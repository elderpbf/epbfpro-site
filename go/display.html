<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Sala de Aula · Display</title>
  <link rel="stylesheet" href="../backstage/css/theme.css?v=1.2">
  <link rel="stylesheet" href="../backstage/css/shared-components.css?v=1.1">
  <link rel="stylesheet" href="../backstage/css/question-types.css?v=1.7">
  <link rel="stylesheet" href="../backstage/css/public-header.css?v=1.6">
  <script src="/backstage/js/debug.js?v=2.5"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }
    body { font-family: 'Inter', sans-serif; background: var(--background); color: var(--text-primary); display: flex; flex-direction: column; min-height: 100vh; }

    /* Main content */
    .main { display: flex; flex-direction: column; flex: 1; padding: clamp(12px, 1.8vh, 28px) clamp(16px, 2.5vw, 44px); overflow-y: auto; max-width: min(1200px, 92vw); width: 100%; margin: 0 auto; }

    /* Center states */
    .center-state { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; flex: 1; min-height: 300px; }
    .center-state .state-icon { font-size: 3rem; }
    .center-state .state-text { font-size: 2rem; color: var(--text-secondary); font-weight: 500; }
    .center-state .state-sub  { font-size: 0.9rem; color: var(--text-light); }

    /* Question display styles now in question-types.css */

    /* Display Mode Results Area */
    .qr-display { flex: 1; overflow-y: auto; min-height: 0; }

    /* No code screen */
    #no-code-screen { display: none; padding: 60px 0; text-align: center; color: var(--text-secondary); }
    #no-code-screen p   { font-size: 0.88rem; margin-bottom: 8px; }
    #no-code-screen code { font-size: 0.82rem; background: var(--surface); padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); }

    /* Refresh dot */
    .refresh-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--text-light); transition: background 0.3s; }
    .refresh-dot.active { background: var(--success); }

    /* Landscape Tablets / Projectors Override */
    @media (max-height: 600px) {
      pensoia-header .ph-bar { padding: 4px 16px; }
    }

    /* Pinned student Q&A on display */
    .cp-qa-pinned-display {
      margin: clamp(16px, 2vh, 32px) auto 0;
      max-width: min(960px, 88vw);
      padding: clamp(20px, 2.5vh, 36px) clamp(24px, 3vw, 48px);
      background: rgba(20,184,166,0.06);
      border: 2px solid rgba(20,184,166,0.4);
      border-radius: 18px;
      box-shadow: 0 4px 24px rgba(20,184,166,0.08);
    }
    .cp-qa-pinned-display .cp-qa-pinned-label {
      font-size: clamp(0.78rem, 1.2vw, 0.95rem);
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .cp-qa-pinned-display .cp-qa-pinned-meta {
      font-size: clamp(0.85rem, 1.3vw, 1.05rem);
      color: var(--text-secondary);
      margin-bottom: 10px;
    }
    .cp-qa-pinned-display .cp-qa-pinned-text {
      font-size: clamp(1.4rem, 2.6vw, 2.1rem);
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.35;
    }
    .cp-qa-pinned-display .cp-qa-pinned-answer {
      margin-top: 18px;
      padding: 14px 20px;
      background: var(--surface);
      border-left: 4px solid var(--primary);
      border-radius: 0 12px 12px 0;
      font-size: clamp(1.05rem, 1.8vw, 1.35rem);
      line-height: 1.45;
      color: var(--text-primary);
    }
    .cp-qa-pinned-display .cp-qa-pinned-answer-label {
      font-size: clamp(0.7rem, 1vw, 0.82rem);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <pensoia-header mode="display" theme-storage-key="bs_theme_public"></pensoia-header>

  <div class="main" id="main-content">
    <div class="center-state">
      <span class="state-icon">&#8987;</span>
      <span class="state-text">Carregando...</span>
    </div>
  </div>

  <div id="qa-pinned-display" class="cp-qa-pinned-display" style="display:none">
    <div class="cp-qa-pinned-label">Pergunta do aluno</div>
    <div class="cp-qa-pinned-meta" id="qa-pinned-meta"></div>
    <div class="cp-qa-pinned-text" id="qa-pinned-text"></div>
    <div id="qa-pinned-answer-wrap" style="display:none">
      <div class="cp-qa-pinned-answer-label" style="margin-top:18px">Resposta</div>
      <div class="cp-qa-pinned-answer" id="qa-pinned-answer"></div>
    </div>
  </div>

  <div id="no-code-screen">
    <p>Nenhum codigo de sessao na URL.</p>
    <p>Abra esta pagina como: <code>display.html?code=AB12</code></p>
  </div>

<script src="../backstage/js/utils.js?v=1.0"></script>
<script src="../backstage/js/api-client.js?v=1.1"></script>
<script src="../backstage/js/question-renderer.js?v=2.4"></script>
<script src="../backstage/js/classpulse-question.min.js?v=1.8"></script>
<script src="../backstage/js/theme-manager.js?v=1.1"></script>
<script src="../backstage/js/pensoia-header.js?v=1.0"></script>
<script>
  // ── THEME ────────────────────────────────────────────────────────────────
  // ThemeManager is initialized by <pensoia-header> via theme-storage-key.
  ThemeManager.initPublic();
  // ────────────────────────────────────────────────────────────────────────

  // ── CONFIG ────────────────────────────────────────────────────────────────
  const POLL_INTERVAL  = 3000;
  // ────────────────────────────────────────────────────────────────────────

  // ── I18N ────────────────────────────────────────────────────────────────
  const ACTIVE_LANG = 'pt';
  const STRINGS = {
    pt: {
      sessionEnded:  'Sessao encerrada',
      waiting:       'Aguardando pergunta...',
      live:          '\u25cf Ao vivo',
      final:         'Resultado final',
      answers:       n => `${n} resposta${n !== 1 ? 's' : ''}`,
    },
    en: {
      sessionEnded:  'Session ended',
      waiting:       'Waiting for question...',
      live:          '\u25cf Live',
      final:         'Final result',
      answers:       n => `${n} answer${n !== 1 ? 's' : ''}`,
    }
  };
  const t = STRINGS[ACTIVE_LANG] || STRINGS.pt;
  // ────────────────────────────────────────────────────────────────────────

  const params      = new URLSearchParams(window.location.search);
  const sessionCode = (params.get('code') || '').trim().toUpperCase();

  const headerEl = document.querySelector('pensoia-header');

  if (!sessionCode) {
    document.querySelector('.main').style.display       = 'none';
    document.getElementById('no-code-screen').style.display = 'block';
  } else {
    headerEl.setAttribute('code', sessionCode);
    const mainEl = document.getElementById('main-content');
    mainEl.innerHTML = '';
    const cpq = document.createElement('classpulse-question');
    cpq.id = 'cpq';
    cpq.setAttribute('mode', 'display');
    cpq.setAttribute('session', sessionCode);
    mainEl.appendChild(cpq);

    cpq.addEventListener('cpq-data', (e) => {
      if (!e.detail) return;
      if (e.detail.session) {
        headerEl.setAttribute('session-title', e.detail.session.title);
      }
      renderPinned(e.detail);
    });
  }

  function renderPinned(data) {
    const card = document.getElementById('qa-pinned-display');
    if (!card) return;
    const pinned = data.qa_enabled ? data.pinned_question : null;
    if (!pinned || !pinned.text) {
      card.style.display = 'none';
      return;
    }
    document.getElementById('qa-pinned-meta').textContent = pinned.student_name || '';
    document.getElementById('qa-pinned-text').textContent = pinned.text;
    const ansWrap = document.getElementById('qa-pinned-answer-wrap');
    if (pinned.answer) {
      document.getElementById('qa-pinned-answer').textContent = pinned.answer;
      ansWrap.style.display = '';
    } else {
      ansWrap.style.display = 'none';
    }
    card.style.display = '';
  }

  document.addEventListener('visibilitychange', () => { 
    if (document.visibilityState === 'visible') {
      const cpq = document.getElementById('cpq');
      if (cpq) cpq.startPolling();
    }
  });
</script>


</body>
</html>
