<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Classroom · Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0f0f0f;
      --text: #f0ece4;
      --text-muted: #a89880;
      --text-dim: #666;
      --border: #2a2a2a;
      --card-bg: #1a1a1a;
      --accent: #c4a97d;
      --accent-dark: #e8d5b0;
      --success: #6dbf8a;
      --pinned-bg: #1e1a14;
      --pinned-border: #c4a97d;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Top bar ── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .top-bar .logo {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .top-bar .session-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
    }
    .top-bar .session-code {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      background: var(--card-bg);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    /* ── Main content ── */
    .main {
      flex: 1;
      padding: 28px 32px 24px;
      overflow-y: auto;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
    }

    /* ── Section labels ── */
    .section-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 14px;
    }

    /* ── Pinned question ── */
    .pinned-section {
      margin-bottom: 32px;
    }
    .pinned-card {
      background: var(--pinned-bg);
      border: 1px solid var(--pinned-border);
      border-left: 4px solid var(--pinned-border);
      border-radius: 14px;
      padding: 24px 28px;
    }
    .pinned-card .pin-icon {
      font-size: 1rem;
      margin-bottom: 10px;
      display: block;
    }
    .pinned-card .question-text {
      font-size: 1.6rem;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text);
      margin-bottom: 14px;
    }
    .pinned-card .question-meta {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* ── Top questions list ── */
    .questions-section {
      margin-bottom: 24px;
    }
    .question-item {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 16px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 10px;
    }
    .question-rank {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-dim);
      min-width: 20px;
      padding-top: 3px;
    }
    .question-body {
      flex: 1;
    }
    .question-body .question-text {
      font-size: 1.15rem;
      font-weight: 500;
      line-height: 1.45;
      color: var(--text);
      margin-bottom: 6px;
    }
    .question-body .question-author {
      font-size: 0.75rem;
      color: var(--text-dim);
    }
    .question-votes {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      padding-top: 2px;
      white-space: nowrap;
    }

    /* ── Empty / closed states ── */
    .center-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-height: 300px;
      flex-direction: column;
      gap: 12px;
    }
    .center-state .state-icon { font-size: 2.5rem; }
    .center-state .state-text { font-size: 1.1rem; color: var(--text-muted); }
    .center-state .state-sub  { font-size: 0.82rem; color: var(--text-dim); }

    /* ── Bottom bar ── */
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 28px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .bottom-bar .join-hint {
      font-size: 0.78rem;
      color: var(--text-dim);
    }
    .bottom-bar .join-hint strong {
      color: var(--accent);
    }
    .bottom-bar .refresh-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-dim);
      transition: background 0.3s;
    }
    .bottom-bar .refresh-dot.active { background: var(--success); }

    /* ── No code screen ── */
    #no-code-screen {
      display: none;
      padding: 60px 0;
      text-align: center;
      color: var(--text-muted);
    }
    #no-code-screen p   { font-size: 0.88rem; margin-bottom: 8px; }
    #no-code-screen code {
      font-size: 0.82rem;
      background: var(--card-bg);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <!-- ── Top bar ── -->
  <div class="top-bar">
    <span class="logo">PensoIA</span>
    <span class="session-title" id="display-title">Loading…</span>
    <span class="session-code" id="display-code"></span>
  </div>

  <!-- ── Main content ── -->
  <div class="main" id="main-content">
    <div class="center-state">
      <span class="state-icon">⏳</span>
      <span class="state-text">Loading…</span>
    </div>
  </div>

  <div id="no-code-screen">
    <p>No session code in URL.</p>
    <p>Open this page as: <code>display.html?code=AB12</code></p>
  </div>

  <!-- ── Bottom bar ── -->
  <div class="bottom-bar">
    <span class="join-hint">
      Students go to <strong>pensoia.com/go</strong> and enter code
      <strong id="bottom-code" style="color:var(--accent)"></strong>
    </span>
    <div class="refresh-dot" id="refresh-dot" title="Live"></div>
  </div>

<script>
  // ── CONFIG ──────────────────────────────────────────────────────────────
  const SPREADSHEET_ID = '14UnmqEmPk6xP0oGwmuAbffuywwlW3dmYhQOAbEadsmA';
  const SESSIONS_CSV   = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=Sessions`;
  const QUESTIONS_CSV  = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=Questions`;
  const REFRESH_INTERVAL = 5000;
  const MAX_DISPLAY      = 5; // max questions shown in list (excluding pinned)
  // ────────────────────────────────────────────────────────────────────────

  // ── CONFIG CHECK ───────────────────────────────────────────────────────
  if (SPREADSHEET_ID.includes('REPLACE')) {
    document.querySelector('.main').innerHTML =
      '<div style="padding:40px;text-align:center;color:#c44;font-size:0.9rem;">' +
      '<strong>Setup incomplete.</strong><br>Replace SPREADSHEET_ID in this file.' +
      '</div>';
    throw new Error('Classroom Light: config placeholders not replaced');
  }
  // ────────────────────────────────────────────────────────────────────────

  const params      = new URLSearchParams(window.location.search);
  const sessionCode = (params.get('code') || '').trim().toUpperCase();

  let sessionTitle  = '';
  let isClosed      = false;

  if (!sessionCode) {
    document.querySelector('.main').style.display       = 'none';
    document.getElementById('no-code-screen').style.display = 'block';
  } else {
    document.getElementById('display-code').textContent = sessionCode;
    document.getElementById('bottom-code').textContent  = sessionCode;
    init();
  }

  // ── CSV PARSING ──────────────────────────────────────────────────────────
  function parseCSV(text) {
    const trimmed = text.trim();
    if (trimmed.startsWith('<!') || trimmed.startsWith('<html') || trimmed.startsWith('<HTML')) {
      console.error('Classroom Light: CSV endpoint returned HTML. Is the Sheet published to web?');
      return [];
    }
    const lines = trimmed.split('\n');
    return lines.slice(1).map(parseCSVLine);
  }

  function parseCSVLine(line) {
    const result = [];
    let current = '', inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      if (line[i] === '"') {
        if (inQuotes && line[i+1] === '"') { current += '"'; i++; }
        else inQuotes = !inQuotes;
      } else if (line[i] === ',' && !inQuotes) {
        result.push(current); current = '';
      } else { current += line[i]; }
    }
    result.push(current);
    return result;
  }

  // ── INIT ─────────────────────────────────────────────────────────────────
  async function init() {
    await fetchData();
    setInterval(fetchData, REFRESH_INTERVAL);
  }

  // ── FETCH ─────────────────────────────────────────────────────────────────
  async function fetchData() {
    const dot = document.getElementById('refresh-dot');
    dot.classList.add('active');

    try {
      const t = Date.now();
      const [sessResp, qResp] = await Promise.all([
        fetch(SESSIONS_CSV  + '&t=' + t),
        fetch(QUESTIONS_CSV + '&t=' + t)
      ]);

      const sessText = await sessResp.text();
      const qText    = await qResp.text();

      const sessions = parseCSV(sessText);
      // cols: A=code, B=title, C=status
      const sess = sessions.find(r => r[0].trim().toUpperCase() === sessionCode);
      if (sess) {
        sessionTitle = sess[1].trim();
        isClosed     = sess[2].trim().toLowerCase() === 'closed';
        document.getElementById('display-title').textContent = sessionTitle;
      }

      const rows = parseCSV(qText);
      // cols: A=id, B=session_code, C=name, D=text, E=upvotes, F=status, G=timestamp
      const questions = rows
        .filter(r => r[1].trim().toUpperCase() === sessionCode)
        .map(r => ({
          id:      r[0].trim(),
          name:    r[2].trim() || 'Anonymous',
          text:    r[3].trim(),
          upvotes: parseInt(r[4]) || 0,
          status:  r[5].trim().toLowerCase(),
          time:    r[6].trim()
        }))
        .filter(q => q.status !== 'hidden');

      render(questions);

    } catch {
      // Keep last rendered state on error
    } finally {
      setTimeout(() => dot.classList.remove('active'), 600);
    }
  }

  // ── RENDER ────────────────────────────────────────────────────────────────
  function render(questions) {
    const main = document.getElementById('main-content');

    if (isClosed) {
      main.innerHTML = `
        <div class="center-state">
          <span class="state-icon">✓</span>
          <span class="state-text">Session ended</span>
          <span class="state-sub">${sessionTitle}</span>
        </div>`;
      return;
    }

    if (!sessionCode || questions.length === 0) {
      main.innerHTML = `
        <div class="center-state">
          <span class="state-icon">💬</span>
          <span class="state-text">Waiting for questions…</span>
          <span class="state-sub">Share the session code: <strong style="color:var(--accent)">${sessionCode}</strong></span>
        </div>`;
      return;
    }

    const pinned = questions.filter(q => q.status === 'pinned');
    const open   = questions
      .filter(q => q.status !== 'pinned' && q.status !== 'answered')
      .sort((a, b) => {
        if (b.upvotes !== a.upvotes) return b.upvotes - a.upvotes;
        return new Date(a.time) - new Date(b.time);
      })
      .slice(0, MAX_DISPLAY);

    let html = '';

    // Pinned section
    if (pinned.length > 0) {
      html += `<div class="pinned-section">
        <div class="section-label">📌 Pinned</div>`;
      pinned.forEach(q => {
        html += `
          <div class="pinned-card">
            <div class="question-text">${escapeHtml(q.text)}</div>
            <div class="question-meta">${escapeHtml(q.name)} · ▲ ${q.upvotes}</div>
          </div>`;
      });
      html += `</div>`;
    }

    // Top questions section
    if (open.length > 0) {
      html += `<div class="questions-section">
        <div class="section-label">Top questions</div>`;
      open.forEach((q, i) => {
        html += `
          <div class="question-item">
            <span class="question-rank">${i + 1}.</span>
            <div class="question-body">
              <div class="question-text">${escapeHtml(q.text)}</div>
              <div class="question-author">${escapeHtml(q.name)}</div>
            </div>
            <div class="question-votes">▲ ${q.upvotes}</div>
          </div>`;
      });
      html += `</div>`;
    }

    if (!html) {
      main.innerHTML = `
        <div class="center-state">
          <span class="state-icon">💬</span>
          <span class="state-text">Waiting for questions…</span>
        </div>`;
    } else {
      main.innerHTML = html;
    }
  }

  // ── UTILS ────────────────────────────────────────────────────────────────
  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Refetch when tab becomes visible
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') fetchData();
  });
</script>
</body>
</html>
