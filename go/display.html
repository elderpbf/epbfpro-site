<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Classroom · Display</title>
  <link rel="stylesheet" href="../backstage/css/theme.css?v=1.2">
  <link rel="stylesheet" href="../backstage/css/shared-components.css?v=1.1">
  <link rel="stylesheet" href="../backstage/css/question-types.css?v=1.1">
  <link rel="stylesheet" href="../backstage/css/public-header.css?v=1.0">
  <script src="/backstage/js/debug.js?v=2.4"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }
    body { font-family: 'Inter', sans-serif; background: var(--background); color: var(--text-primary); display: flex; flex-direction: column; min-height: 100vh; }

    /* Main content */
    .main { display: flex; flex-direction: column; flex: 1; padding: clamp(12px, 1.8vh, 28px) clamp(16px, 2.5vw, 44px); overflow-y: auto; max-width: min(1200px, 92vw); width: 100%; margin: 0 auto; }

    /* Center states */
    .center-state { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; flex: 1; min-height: 300px; }
    .center-state .state-icon { font-size: 3rem; }
    .center-state .state-text { font-size: 2rem; color: var(--text-secondary); font-weight: 500; }
    .center-state .state-sub  { font-size: 0.9rem; color: var(--text-light); }

    /* Question display */
    .question-area { margin-bottom: 32px; flex-shrink: 0; }
    .question-status { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .status-badge { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 4px 10px; border-radius: 4px; }
    .status-badge.live   { background: var(--status-live-bg); color: var(--status-live-text); }
    .status-badge.closed { background: var(--status-closed-bg); color: var(--status-closed-text); }
    .answer-count { font-size: 0.82rem; color: var(--text-light); }

    .question-text-display { font-size: clamp(1.3rem, 2.5vw, 2.8rem); font-weight: 700; color: var(--text-primary); line-height: 1.35; margin-bottom: 32px; text-align: justify; }

    /* Display Mode Results Area */
    .qr-display { flex: 1; overflow-y: auto; min-height: 0; }

    /* No code screen */
    #no-code-screen { display: none; padding: 60px 0; text-align: center; color: var(--text-secondary); }
    #no-code-screen p   { font-size: 0.88rem; margin-bottom: 8px; }
    #no-code-screen code { font-size: 0.82rem; background: var(--surface); padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); }

    /* Refresh dot */
    .refresh-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--text-light); transition: background 0.3s; }
    .refresh-dot.active { background: var(--success); }

    /* Open text feed */
    .text-feed { display: flex; flex-direction: column; gap: 14px; overflow-y: auto; flex: 1; padding-right: 4px; }
    .feed-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: clamp(12px,1.6vw,22px) clamp(14px,2vw,28px); }
    .feed-name { font-size: clamp(0.7rem,1vw,0.85rem); font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
    .feed-text { font-size: clamp(1.1rem,2.2vw,2rem); color: var(--text-primary); line-height: 1.4; word-break: break-word; }
    .feed-empty { font-size: clamp(1rem,2vw,1.6rem); color: var(--text-light); }

    /* Word cloud */
    .word-cloud { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px 18px; padding: 24px 8px; flex: 1; }
    .wc-word { font-weight: 700; line-height: 1.2; transition: opacity 0.3s; cursor: default; }

    /* Landscape Tablets / Projectors Override */
    @media (max-height: 600px) {
      pensoia-header .ph-bar { padding: 4px 16px; }
    }
  </style>
</head>
<body>

  <pensoia-header mode="display" theme-storage-key="bs_theme_public"></pensoia-header>

  <div class="main" id="main-content">
    <div class="center-state">
      <span class="state-icon">&#8987;</span>
      <span class="state-text">Carregando...</span>
    </div>
  </div>

  <div id="no-code-screen">
    <p>Nenhum codigo de sessao na URL.</p>
    <p>Abra esta pagina como: <code>display.html?code=AB12</code></p>
  </div>

<script src="../backstage/js/utils.js?v=1.0"></script>
<script src="../backstage/js/api-client.js?v=1.1"></script>
<script src="../backstage/js/question-renderer.js?v=1.0"></script>
<script src="../backstage/js/theme-manager.js?v=1.0"></script>
<script src="../backstage/js/pensoia-header.js?v=1.0"></script>
<script>
  // ── THEME ────────────────────────────────────────────────────────────────
  // ThemeManager is initialized by <pensoia-header> via theme-storage-key.
  (function() {
    var urlParams = new URLSearchParams(window.location.search);
    var urlTheme  = urlParams.get('theme');
    var stored    = localStorage.getItem('bs_theme_public');
    var theme     = 'light';
    if (urlTheme === 'dark' || urlTheme === 'light') theme = urlTheme;
    else if (stored === 'dark' || stored === 'light') theme = stored;
    ThemeManager.applyTheme(theme);
  })();
  // ────────────────────────────────────────────────────────────────────────

  // ── CONFIG ────────────────────────────────────────────────────────────────
  const POLL_INTERVAL  = 3000;
  // ────────────────────────────────────────────────────────────────────────

  // ── I18N ────────────────────────────────────────────────────────────────
  const ACTIVE_LANG = 'pt';
  const STRINGS = {
    pt: {
      sessionEnded:  'Sessao encerrada',
      waiting:       'Aguardando pergunta...',
      live:          '\u25cf Ao vivo',
      final:         'Resultado final',
      answers:       n => `${n} resposta${n !== 1 ? 's' : ''}`,
    },
    en: {
      sessionEnded:  'Session ended',
      waiting:       'Waiting for question...',
      live:          '\u25cf Live',
      final:         'Final result',
      answers:       n => `${n} answer${n !== 1 ? 's' : ''}`,
    }
  };
  const t = STRINGS[ACTIVE_LANG] || STRINGS.pt;
  // ────────────────────────────────────────────────────────────────────────

  const params      = new URLSearchParams(window.location.search);
  const sessionCode = (params.get('code') || '').trim().toUpperCase();

  const headerEl = document.querySelector('pensoia-header');

  let sessionTitle     = '';
  let lastDisplayedQ   = null;

  if (!sessionCode) {
    document.querySelector('.main').style.display       = 'none';
    document.getElementById('no-code-screen').style.display = 'block';
  } else {
    headerEl.setAttribute('code', sessionCode);
    init();
  }


  // ── INIT ─────────────────────────────────────────────────────────────────
  async function init() {
    await fetchData();
    setInterval(fetchData, POLL_INTERVAL);
  }

  // ── FETCH ─────────────────────────────────────────────────────────────────
  async function fetchData() {
    try {
      const data = await callWorker({ action: 'get_session_state', code: sessionCode });

      if (data.session) {
        sessionTitle = data.session.title;
        headerEl.setAttribute('session-title', sessionTitle);
        if (data.session.status === 'closed') {
          render(null, true);
          return;
        }
      }

      const activeQ = data.active_question;
      if (activeQ) {
        dbg('poll', `active Q ...${activeQ.id.slice(-6)}`);
        lastDisplayedQ = activeQ;
        render(activeQ, false);
      } else {
        const recentlyClosed = lastDisplayedQ
          ? (data.history || []).find(q => q.id === lastDisplayedQ.id) || lastDisplayedQ
          : (data.history || [])[0] || null;
        if (recentlyClosed) {
          dbg('poll', `closed Q ...${recentlyClosed.id.slice(-6)} show=${recentlyClosed.show_results} reveal=${recentlyClosed.reveal_answer}`);
          lastDisplayedQ = recentlyClosed;
          render(lastDisplayedQ, false);
        } else {
          render(null, false);
        }
      }
    } catch (err) {
      console.error('display fetch error:', err);
      dbg('error', `fetch: ${err.message}`);
    }
  }

  // ── RENDER ────────────────────────────────────────────────────────────────
  function render(q, sessionClosed) {
    if (sessionClosed)  dbg('info', 'render: session closed');
    else if (!q)        dbg('info', 'render: waiting (idle)');
    else                dbg('info', `render: Q status=${q.status} reveal=${q.reveal_answer}`);
    const main = document.getElementById('main-content');

    if (sessionClosed) {
      main.innerHTML = `
        <div class="center-state">
          <span class="state-icon">\u2713</span>
          <span class="state-text">${t.sessionEnded}</span>
          <span class="state-sub">${escHtml(sessionTitle)}</span>
        </div>`;
      return;
    }

    if (!q) {
      main.innerHTML = `
        <div class="center-state">
          <span class="state-icon">&#8987;</span>
          <span class="state-text">${t.waiting}</span>
        </div>`;
      return;
    }

    const text          = q.text;
    const status        = q.status;
    const options       = q.options || [];
    const correctAnswer = q.correct_answer;
    const showResults   = status === 'active' || q.show_results === true;
    const revealAnswer  = status === 'closed' && q.reveal_answer === true;

    const counts = q.answer_counts || new Array(options.length).fill(0);
    const total  = counts.reduce((a, b) => a + b, 0);

    const badgeClass = status === 'active' ? 'live' : 'closed';
    const badgeLabel = status === 'active' ? t.live : t.final;

    let html = `
      <div class="question-area">
        <div class="question-status">
          <span class="status-badge ${badgeClass}">${badgeLabel}</span>
          <span class="answer-count">${t.answers(total)}</span>
        </div>
        <div class="question-text-display">${escHtml(text)}</div>
      </div>`;

    main.innerHTML = html;

    if (q.type === 'open' && q.text_answers !== undefined) {
      const feedEl = document.createElement('div');
      feedEl.className = 'text-feed';
      if (q.text_answers.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'feed-card';
        empty.innerHTML = '<div class="feed-empty">Aguardando respostas...</div>';
        feedEl.appendChild(empty);
      } else {
        q.text_answers.forEach(function(a) {
          const card = document.createElement('div');
          card.className = 'feed-card';
          card.innerHTML = '<div class="feed-name">' + escHtml(a.name) + '</div><div class="feed-text">' + escHtml(a.value) + '</div>';
          feedEl.appendChild(card);
        });
      }
      main.appendChild(feedEl);
    } else if (q.type === 'wordcloud' && q.text_answers !== undefined) {
      const cloudEl = document.createElement('div');
      cloudEl.className = 'qr-display';
      renderWordCloud(q.text_answers, cloudEl);
      main.appendChild(cloudEl);
    } else {
      const barsEl = document.createElement('div');
      barsEl.className = 'qr-display';
      QR.renderResults(q, counts, barsEl, {
        mode: 'display',
        showResults,
        revealAnswer,
        correctAnswer,
      });
      main.appendChild(barsEl);
    }
  }

  function renderWordCloud(answers, container) {
    var freq = {};
    answers.forEach(function(a) {
      var word = (a.value || '').trim().toLowerCase();
      if (word) freq[word] = (freq[word] || 0) + 1;
    });
    var entries = Object.entries(freq).sort(function(a, b) { return b[1] - a[1]; });
    var PALETTE = ['#14b8a6','#6366f1','#3b82f6','#7c3aed','#c026d3','#16a34a','#0284c7'];
    if (entries.length === 0) {
      container.innerHTML = '<div class="center-state"><span class="state-text">Aguardando respostas...</span></div>';
      return;
    }
    var maxFreq = entries[0][1];
    var cloud = document.createElement('div');
    cloud.className = 'word-cloud';
    entries.forEach(function(entry, i) {
      var word = entry[0], count = entry[1];
      var size = 1 + (count / maxFreq) * 2;
      var span = document.createElement('span');
      span.className = 'wc-word';
      span.textContent = word;
      span.style.fontSize = size.toFixed(2) + 'rem';
      span.style.color = PALETTE[i % PALETTE.length];
      cloud.appendChild(span);
    });
    container.appendChild(cloud);
  }


  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') fetchData(); });
</script>


</body>
</html>
