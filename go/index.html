<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Sala de Aula · PensoIA</title>
  <link rel="stylesheet" href="../backstage/css/theme.css?v=1.2">
  <link rel="stylesheet" href="../backstage/css/shared-components.css?v=1.1">
  <link rel="stylesheet" href="../backstage/css/public-header.css?v=1.6">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--background); color: var(--text-primary); line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; }
    .container { max-width: 480px; margin: 0 auto; padding: 64px 20px; width: 100%; text-align: center; }
    h1 { font-size: 1.2rem; font-weight: 700; color: var(--primary-dark); margin-bottom: 16px; }
    p { font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 14px; }
    .note { font-size: 0.78rem; color: var(--text-light); margin-top: 32px; padding-top: 18px; border-top: 1px solid var(--border); }
  </style>
</head>
<body>

<pensoia-header mode="student" theme-storage-key="bs_theme_public"></pensoia-header>

<div class="container">
  <h1>Página descontinuada</h1>
  <p>Acesse a trilha da sua turma pelo link compartilhado pelo professor.</p>
  <div class="note">Se você chegou aqui por um QR code antigo, peça o novo link da trilha ao professor.</div>
</div>

<script src="../backstage/js/theme-manager.js?v=1.1"></script>
<script src="../backstage/js/pensoia-header.js?v=1.3"></script>
<script>ThemeManager.initPublic();</script>
</body>
</html>
