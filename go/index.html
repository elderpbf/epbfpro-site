<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Classroom · PensoIA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #faf8f5;
      --text: #3d3529;
      --text-muted: #8a7b66;
      --text-dim: #a89880;
      --border: #e8e0d4;
      --card-bg: #fff;
      --accent: #c4a97d;
      --accent-dark: #5c4a2f;
      --success: #4a7c59;
      --error: #c44;
      --pinned-bg: #fdf6ec;
      --pinned-border: #c4a97d;
      --answered-opacity: 0.45;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      padding: 28px 0 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }
    .header .logo {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent-dark);
      margin-bottom: 6px;
    }
    .header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent-dark);
    }
    .header p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ── Session header bar (Q&A screen) ── */
    .session-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0 18px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .session-bar .session-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent-dark);
    }
    .session-bar .session-code {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      background: var(--border);
      padding: 3px 8px;
      border-radius: 6px;
    }
    .btn-exit {
      font-size: 0.8rem;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 0;
      font-family: inherit;
    }
    .btn-exit:hover { color: var(--text); }

    /* ── Form elements ── */
    label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      background: var(--card-bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus, textarea:focus {
      border-color: var(--accent);
    }
    input[type="text"].code-input {
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-size: 1.4rem;
      font-weight: 700;
      text-align: center;
    }
    textarea {
      resize: none;
      line-height: 1.5;
    }

    .form-group { margin-bottom: 18px; }

    .char-count {
      text-align: right;
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-top: 4px;
    }
    .char-count.near-limit { color: var(--error); }

    /* ── Buttons ── */
    .btn-primary {
      width: 100%;
      padding: 13px;
      background: var(--accent-dark);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.4; cursor: default; }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
      color: var(--text-dim);
      font-size: 0.78rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Host link ── */
    .host-link {
      display: block;
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      text-decoration: none;
    }
    .host-link:hover { color: var(--accent-dark); }

    /* ── Error message ── */
    .error-msg {
      font-size: 0.82rem;
      color: var(--error);
      margin-top: 10px;
      min-height: 1.2em;
      text-align: center;
    }

    /* ── Submit form (Q&A screen) ── */
    .submit-section {
      margin-bottom: 28px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .submit-section h2 {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    /* ── Questions list ── */
    .questions-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .questions-header h2 {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }
    .refresh-indicator {
      font-size: 0.7rem;
      color: var(--text-dim);
    }
    .refresh-indicator.fetching { color: var(--accent); }

    .question-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      transition: opacity 0.2s;
    }
    .question-card.pinned {
      border-left: 3px solid var(--pinned-border);
      background: var(--pinned-bg);
    }
    .question-card.answered {
      opacity: var(--answered-opacity);
    }

    .question-text {
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .question-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .question-author {
      font-size: 0.75rem;
      color: var(--text-dim);
    }
    .question-status-badge {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 4px;
      margin-right: 8px;
    }
    .question-status-badge.pinned {
      background: #f4e6c8;
      color: #8a6020;
    }
    .question-status-badge.answered {
      background: #e0f0e8;
      color: var(--success);
    }

    .upvote-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 0.78rem;
      font-family: inherit;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .upvote-btn:hover:not(.voted) {
      border-color: var(--accent);
      color: var(--accent-dark);
    }
    .upvote-btn.voted {
      background: var(--pinned-bg);
      border-color: var(--accent);
      color: var(--accent-dark);
      cursor: default;
    }

    .empty-state {
      text-align: center;
      padding: 48px 0;
      color: var(--text-dim);
      font-size: 0.88rem;
    }

    .rate-limit-msg {
      font-size: 0.82rem;
      color: var(--text-muted);
      text-align: center;
      padding: 10px;
      background: var(--border);
      border-radius: 8px;
      margin-top: 10px;
    }

    /* ── Screen toggling ── */
    #join-screen { display: block; }
    #qa-screen   { display: none; }
  </style>
</head>
<body>
<div class="container">

  <!-- ══════════════════════════════════════════
       JOIN SCREEN
  ══════════════════════════════════════════ -->
  <div id="join-screen">
    <div class="header">
      <div class="logo">PensoIA</div>
      <h1>Classroom</h1>
      <p>Enter a session code to join</p>
    </div>

    <div class="form-group">
      <label for="code-input">Session code</label>
      <input type="text" id="code-input" class="code-input"
             placeholder="AB12" maxlength="4" autocomplete="off"
             autocorrect="off" autocapitalize="characters" spellcheck="false">
    </div>

    <div class="form-group">
      <label for="name-input">Your name <span style="font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
      <input type="text" id="name-input"
             placeholder="Anonymous" maxlength="30" autocomplete="off">
    </div>

    <button class="btn-primary" id="join-btn" onclick="joinSession()">Join session</button>
    <div class="error-msg" id="join-error"></div>

    <div class="divider">or</div>
    <a class="host-link" href="host.html">Create a session as instructor →</a>
  </div>

  <!-- ══════════════════════════════════════════
       Q&A SCREEN
  ══════════════════════════════════════════ -->
  <div id="qa-screen">
    <div class="session-bar">
      <button class="btn-exit" onclick="exitSession()">← Exit</button>
      <span class="session-title" id="session-title-bar"></span>
      <span class="session-code" id="session-code-bar"></span>
    </div>

    <!-- Submit question -->
    <div class="submit-section">
      <h2>Ask a question</h2>
      <div class="form-group" style="margin-bottom:8px">
        <textarea id="question-input" rows="3"
                  placeholder="Type your question here…" maxlength="280"
                  oninput="updateCharCount()"></textarea>
        <div class="char-count" id="char-count">0 / 280</div>
      </div>
      <button class="btn-primary" id="submit-btn" onclick="submitQuestion()">Submit question</button>
      <div class="error-msg" id="submit-error"></div>
      <div class="rate-limit-msg" id="rate-limit-msg" style="display:none"></div>
    </div>

    <!-- Questions list -->
    <div class="questions-header">
      <h2 id="questions-count">Questions</h2>
      <span class="refresh-indicator" id="refresh-indicator">refreshing…</span>
    </div>
    <div id="questions-list"></div>
  </div>

</div>

<script>
  // ── CONFIG ──────────────────────────────────────────────────────────────
  const SPREADSHEET_ID  = '14UnmqEmPk6xP0oGwmuAbffuywwlW3dmYhQOAbEadsmA';
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwdynfo6geXRNyrJtuAzXxCpOztsnvCGRz2FWkhLC05dsVAjOF2P1QV9bjLTZbVQbDlbg/exec';
  const SESSIONS_CSV    = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=Sessions`;
  const QUESTIONS_CSV   = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=Questions`;
  const REFRESH_INTERVAL   = 5000;   // 5 seconds
  const MAX_QUESTIONS_PER_SESSION = 5;
  // ────────────────────────────────────────────────────────────────────────

  // ── CONFIG CHECK ───────────────────────────────────────────────────────
  if (SPREADSHEET_ID.includes('REPLACE') || APPS_SCRIPT_URL.includes('REPLACE')) {
    document.querySelector('.container').innerHTML =
      '<div style="padding:40px;text-align:center;color:#c44;font-size:0.9rem;">' +
      '<strong>Setup incomplete.</strong><br>Replace SPREADSHEET_ID and APPS_SCRIPT_URL in this file.' +
      '</div>';
    throw new Error('Classroom Light: config placeholders not replaced');
  }
  // ────────────────────────────────────────────────────────────────────────

  let currentSession = null;  // { code, title, studentName }
  let refreshTimer   = null;
  let allQuestions   = [];

  // ── CSV PARSING (same pattern as Adriana-Updates) ──────────────────────
  function parseCSV(text) {
    const trimmed = text.trim();
    if (trimmed.startsWith('<!') || trimmed.startsWith('<html') || trimmed.startsWith('<HTML')) {
      console.error('Classroom Light: CSV endpoint returned HTML. Is the Sheet published to web?');
      return [];
    }
    const lines = trimmed.split('\n');
    return lines.slice(1).map(parseCSVLine);
  }

  function parseCSVLine(line) {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      if (line[i] === '"') {
        if (inQuotes && line[i + 1] === '"') { current += '"'; i++; }
        else inQuotes = !inQuotes;
      } else if (line[i] === ',' && !inQuotes) {
        result.push(current); current = '';
      } else {
        current += line[i];
      }
    }
    result.push(current);
    return result;
  }

  // ── POST HELPER ─────────────────────────────────────────────────────────
  async function post(action, data) {
    const resp = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action, ...data }),
      redirect: 'follow'
    });
    return resp.json();
  }

  // ── JOIN FLOW ────────────────────────────────────────────────────────────
  document.getElementById('code-input').addEventListener('input', function () {
    this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  });

  async function joinSession() {
    const code = document.getElementById('code-input').value.trim().toUpperCase();
    const name = document.getElementById('name-input').value.trim();
    const errorEl = document.getElementById('join-error');
    const btn = document.getElementById('join-btn');

    errorEl.textContent = '';

    if (code.length !== 4) {
      errorEl.textContent = 'Enter a 4-character session code.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Checking…';

    try {
      const resp = await fetch(SESSIONS_CSV + '&t=' + Date.now());
      const text = await resp.text();
      const rows = parseCSV(text);

      // cols: A=code, B=title, C=status, D=created_at, E=password
      const session = rows.find(r => r[0].trim().toUpperCase() === code);

      if (!session) {
        errorEl.textContent = 'Session not found. Check the code and try again.';
        return;
      }
      if (session[2].trim().toLowerCase() === 'closed') {
        errorEl.textContent = 'This session has ended.';
        return;
      }

      currentSession = { code: session[0].trim().toUpperCase(), title: session[1].trim(), studentName: name || 'Anonymous' };
      sessionStorage.setItem('classroom_session', JSON.stringify(currentSession));
      showQAScreen();

    } catch (err) {
      errorEl.textContent = 'Connection error. Please try again.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Join session';
    }
  }

  function showQAScreen() {
    document.getElementById('join-screen').style.display = 'none';
    document.getElementById('qa-screen').style.display  = 'block';
    document.getElementById('session-title-bar').textContent = currentSession.title;
    document.getElementById('session-code-bar').textContent  = currentSession.code;
    checkRateLimit();
    fetchQuestions();
    refreshTimer = setInterval(fetchQuestions, REFRESH_INTERVAL);
  }

  function exitSession() {
    clearInterval(refreshTimer);
    currentSession = null;
    sessionStorage.removeItem('classroom_session');
    document.getElementById('qa-screen').style.display  = 'none';
    document.getElementById('join-screen').style.display = 'block';
    document.getElementById('code-input').value = '';
    document.getElementById('name-input').value = '';
    document.getElementById('join-error').textContent = '';
  }

  // ── QUESTION SUBMISSION ──────────────────────────────────────────────────
  function updateCharCount() {
    const len = document.getElementById('question-input').value.length;
    const el  = document.getElementById('char-count');
    el.textContent = `${len} / 280`;
    el.classList.toggle('near-limit', len > 250);
  }

  function getRateLimitKey() {
    return `classroom_submits_${currentSession.code}`;
  }

  function getSubmitTimestamps() {
    try { return JSON.parse(localStorage.getItem(getRateLimitKey()) || '[]'); }
    catch { return []; }
  }

  function checkRateLimit() {
    const timestamps = getSubmitTimestamps();
    const limitMsg   = document.getElementById('rate-limit-msg');
    const submitBtn  = document.getElementById('submit-btn');
    if (timestamps.length >= MAX_QUESTIONS_PER_SESSION) {
      limitMsg.textContent = `You've reached the limit of ${MAX_QUESTIONS_PER_SESSION} questions for this session.`;
      limitMsg.style.display = 'block';
      submitBtn.disabled = true;
    } else {
      limitMsg.style.display = 'none';
      submitBtn.disabled = false;
    }
  }

  async function submitQuestion() {
    const text    = document.getElementById('question-input').value.trim();
    const errorEl = document.getElementById('submit-error');
    const btn     = document.getElementById('submit-btn');

    errorEl.textContent = '';

    if (!text) { errorEl.textContent = 'Please write your question first.'; return; }
    if (text.length > 280) { errorEl.textContent = 'Question is too long (max 280 characters).'; return; }

    const timestamps = getSubmitTimestamps();
    if (timestamps.length >= MAX_QUESTIONS_PER_SESSION) {
      checkRateLimit();
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Sending…';

    try {
      const result = await post('submit_question', {
        session_code: currentSession.code,
        student_name: currentSession.studentName,
        text
      });

      if (result.ok) {
        // Optimistic: add locally before next fetch
        allQuestions.unshift({
          id: result.id,
          session_code: currentSession.code,
          student_name: currentSession.studentName,
          text,
          upvotes: 0,
          status: 'open',
          timestamp: new Date().toISOString()
        });
        renderQuestions();

        // Record timestamp for rate limiting
        timestamps.push(Date.now());
        localStorage.setItem(getRateLimitKey(), JSON.stringify(timestamps));

        document.getElementById('question-input').value = '';
        updateCharCount();
        checkRateLimit();
      } else {
        errorEl.textContent = result.error || 'Failed to submit. Please try again.';
      }
    } catch {
      errorEl.textContent = 'Connection error. Please try again.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Submit question';
    }
  }

  // ── FETCH & RENDER QUESTIONS ─────────────────────────────────────────────
  async function fetchQuestions() {
    const indicator = document.getElementById('refresh-indicator');
    indicator.textContent = 'refreshing…';
    indicator.classList.add('fetching');
    try {
      const resp = await fetch(QUESTIONS_CSV + '&t=' + Date.now());
      const text = await resp.text();
      const rows = parseCSV(text);

      // cols: A=id, B=session_code, C=student_name, D=text, E=upvotes, F=status, G=timestamp
      allQuestions = rows
        .filter(r => r[1].trim().toUpperCase() === currentSession.code)
        .map(r => ({
          id:           r[0].trim(),
          session_code: r[1].trim(),
          student_name: r[2].trim() || 'Anonymous',
          text:         r[3].trim(),
          upvotes:      parseInt(r[4]) || 0,
          status:       r[5].trim().toLowerCase(),
          timestamp:    r[6].trim()
        }));

      renderQuestions();
      indicator.textContent = 'live';
      indicator.classList.remove('fetching');
    } catch {
      indicator.textContent = 'offline';
      indicator.classList.remove('fetching');
    }
  }

  function getUpvoted() {
    try { return JSON.parse(localStorage.getItem('classroom_upvoted') || '[]'); }
    catch { return []; }
  }

  function renderQuestions() {
    const upvoted  = getUpvoted();
    const listEl   = document.getElementById('questions-list');
    const countEl  = document.getElementById('questions-count');

    const visible = allQuestions.filter(q => q.status !== 'hidden');
    countEl.textContent = `${visible.length} question${visible.length !== 1 ? 's' : ''}`;

    if (visible.length === 0) {
      listEl.innerHTML = '<div class="empty-state">No questions yet. Be the first to ask!</div>';
      return;
    }

    // Sort: pinned first, then by upvotes desc, then by timestamp asc
    const sorted = [...visible].sort((a, b) => {
      if (a.status === 'pinned' && b.status !== 'pinned') return -1;
      if (b.status === 'pinned' && a.status !== 'pinned') return 1;
      if (b.upvotes !== a.upvotes) return b.upvotes - a.upvotes;
      return new Date(a.timestamp) - new Date(b.timestamp);
    });

    // Answered go to bottom
    const open     = sorted.filter(q => q.status !== 'answered');
    const answered = sorted.filter(q => q.status === 'answered');
    const final    = [...open, ...answered];

    listEl.innerHTML = final.map(q => {
      const hasVoted = upvoted.includes(q.id);
      let badge = '';
      if (q.status === 'pinned')   badge = '<span class="question-status-badge pinned">📌 Pinned</span>';
      if (q.status === 'answered') badge = '<span class="question-status-badge answered">✓ Answered</span>';

      return `
        <div class="question-card ${q.status === 'pinned' ? 'pinned' : ''} ${q.status === 'answered' ? 'answered' : ''}">
          <div class="question-text">${escapeHtml(q.text)}</div>
          <div class="question-meta">
            <span class="question-author">${badge}${escapeHtml(q.student_name)}</span>
            <button class="upvote-btn ${hasVoted ? 'voted' : ''}"
                    onclick="upvote('${q.id}', this)"
                    ${hasVoted ? 'disabled' : ''}>
              ${hasVoted ? '▲' : '▲'} ${q.upvotes}
            </button>
          </div>
        </div>`;
    }).join('');
  }

  // ── UPVOTE ───────────────────────────────────────────────────────────────
  async function upvote(id, btn) {
    const upvoted = getUpvoted();
    if (upvoted.includes(id)) return;

    btn.disabled = true;

    try {
      const result = await post('upvote', { id });
      if (result.ok) {
        upvoted.push(id);
        localStorage.setItem('classroom_upvoted', JSON.stringify(upvoted));
        // Update count optimistically
        const q = allQuestions.find(q => q.id === id);
        if (q) { q.upvotes = result.upvotes ?? q.upvotes + 1; }
        renderQuestions();
      }
    } catch {
      btn.disabled = false;
    }
  }

  // ── UTILS ────────────────────────────────────────────────────────────────
  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── INIT ─────────────────────────────────────────────────────────────────
  // Restore session from sessionStorage on page reload
  const saved = sessionStorage.getItem('classroom_session');
  if (saved) {
    try {
      currentSession = JSON.parse(saved);
      showQAScreen();
    } catch { sessionStorage.removeItem('classroom_session'); }
  }

  // Refetch when tab becomes visible
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && currentSession) fetchQuestions();
  });

  // Allow Enter key to submit join form
  document.getElementById('code-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') joinSession();
  });
  document.getElementById('name-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') joinSession();
  });
</script>
</body>
</html>
