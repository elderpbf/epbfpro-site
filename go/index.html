<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Redirecionando · PensoIA</title>
  <link rel="stylesheet" href="../backstage/css/theme.css?v=1.2">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--background);
      color: var(--text-primary);
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .shim {
      max-width: 420px;
      text-align: center;
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.55;
    }
    .shim .spinner {
      display: inline-block;
      width: 22px;
      height: 22px;
      border: 3px solid var(--border, rgba(0,0,0,0.1));
      border-top-color: var(--primary, #14b8a6);
      border-radius: 50%;
      animation: shim-spin 0.75s linear infinite;
      margin-bottom: 14px;
    }
    .shim .error {
      color: var(--error, #ef4444);
      font-weight: 600;
    }
    @keyframes shim-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="shim" id="shim">
  <div class="spinner" aria-hidden="true"></div>
  <div id="shim-msg">Redirecionando para sua sala…</div>
</div>

<script src="/backstage/js/api-client.js?v=1.2"></script>
<script>
// /go/<code> is now a redirect-only shim. Bundle H folded the legacy answer
// flow into the trilha page. Anyone landing here, whether by QR scan or a
// stale link, gets bounced to /trilha/?c=&t=&k= for the matching turma.
(function () {
  var msgEl = document.getElementById('shim-msg');

  function showError(text) {
    if (msgEl) {
      msgEl.textContent = text;
      msgEl.className = 'error';
    }
    var spin = document.querySelector('.shim .spinner');
    if (spin) spin.style.display = 'none';
  }

  var params = new URLSearchParams(window.location.search);
  // Accept ?code=ABCD (post-QR) or a path segment /go/ABCD/ via legacy use.
  var code = params.get('code');
  if (!code) {
    var seg = window.location.pathname
      .replace(/^\/go\/?/, '')
      .replace(/\/+$/, '');
    if (seg) code = seg;
  }
  if (code) code = code.toUpperCase().replace(/[^A-Z0-9]/g, '');

  if (!code) {
    showError('Código da sessão não informado.');
    return;
  }

  (async function () {
    try {
      var data = await callWorker({
        action:     'ct_lookup_turma_by_session',
        session_id: code,
        _silent:    true
      });
      var turma = data && data.turma;
      if (!turma || !turma.client_slug || !turma.turma_slug || !turma.token) {
        showError('Sessão não encontrada ou ainda não vinculada a uma turma.');
        return;
      }
      var url = '/trilha/?c=' + encodeURIComponent(turma.client_slug) +
                '&t=' + encodeURIComponent(turma.turma_slug) +
                '&k=' + encodeURIComponent(turma.token);
      window.location.replace(url);
    } catch (_) {
      showError('Erro de conexão. Tente novamente em instantes.');
    }
  })();
})();
</script>

</body>
</html>
