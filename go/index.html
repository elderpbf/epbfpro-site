<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Classroom · PensoIA</title>
  <link rel="stylesheet" href="../backstage/css/theme.css?v=1.2">
  <link rel="stylesheet" href="../backstage/css/shared-components.css?v=1.1">
  <link rel="stylesheet" href="../backstage/css/question-types.css?v=1.1">
  <link rel="stylesheet" href="../backstage/css/public-header.css?v=1.0">
  <script src="/backstage/js/debug.js?v=2.4"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { font-family: 'Inter', sans-serif; background: var(--background); color: var(--text-primary); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
    .container { position: relative; max-width: clamp(480px, 80vw, 720px); margin: 0 auto; padding: 24px 16px 80px; width: 100%; }

    /* Header (join screen) */
    .header { text-align: center; padding: 28px 0 24px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
    .header .logo { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--primary-dark); margin-bottom: 6px; }
    .header h1 { font-size: 1.15rem; font-weight: 700; color: var(--primary-dark); }
    .header p  { font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px; }

    /* Form */
    label { display: block; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); margin-bottom: 6px; }
    input[type="text"] { width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.95rem; font-family: inherit; background: var(--surface); color: var(--text-primary); outline: none; transition: border-color 0.15s; }
    input[type="text"]:focus { border-color: var(--primary); }
    input.code-input { text-transform: uppercase; letter-spacing: 0.2em; font-size: 1.4rem; font-weight: 700; text-align: center; }
    .form-group { margin-bottom: 18px; }
    .btn-primary { width: 100%; padding: 13px; background: var(--primary-dark); color: #fff; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 600; font-family: inherit; cursor: pointer; transition: opacity 0.15s; }
    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.4; cursor: default; }
    .error-msg { font-size: 1rem; color: var(--error); margin-top: 10px; min-height: 1.2em; text-align: center; }

    /* States */
    .state-center { text-align: center; padding: 56px 0; }
    .state-icon  { font-size: 2.4rem; margin-bottom: 14px; }
    .state-title { font-size: 1.05rem; font-weight: 600; color: var(--primary-dark); margin-bottom: 8px; }
    .state-sub   { font-size: 1rem; color: var(--text-secondary); }

    /* Option buttons */
    .question-label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-secondary); margin-bottom: 14px; }
    .question-text  { font-size: 1.1rem; font-weight: 600; color: var(--text-primary); line-height: 1.5; margin-bottom: 22px; text-align: justify; }

    @media (min-width: 600px) {
      #q-options { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .qr-option-btn { margin-bottom: 0 !important; }
    }

    /* Results bars */
    .results-question { font-size: 1rem; font-weight: 600; color: var(--text-primary); line-height: 1.5; margin-bottom: 22px; }


    .results-count { font-size: 0.78rem; color: var(--text-light); text-align: center; margin-top: 18px; }
    .results-next  { font-size: 0.82rem; color: var(--text-secondary); text-align: center; margin-top: 10px; }

    /* Open text input */
    .open-text-form { display: flex; flex-direction: column; gap: 14px; margin-top: 4px; }
    .open-textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.95rem; font-family: inherit; background: var(--surface); color: var(--text-primary); outline: none; transition: border-color 0.15s; resize: vertical; min-height: 90px; line-height: 1.5; box-sizing: border-box; }
    .open-textarea:focus { border-color: var(--primary); }
    .char-counter { font-size: 0.72rem; color: var(--text-light); text-align: right; }

    /* Word cloud input */
    .wordcloud-hint { font-size: 0.72rem; color: var(--text-light); margin-top: 4px; }

    /* Refresh dot */
    .dot-wrap { text-align: center; margin-top: 18px; }
    .refresh-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--text-light); transition: background 0.3s; }
    .refresh-dot.active { background: var(--success); }

    /* Screen visibility */
    #join-screen    { display: block; }
    #session-screen { display: none; }
  </style>
</head>
<body>

<pensoia-header mode="student" theme-storage-key="bs_theme_public" exitable></pensoia-header>

<div class="container">

  <!-- ── JOIN SCREEN ── -->
  <div id="join-screen">
    <div class="header">
      <div class="logo">PensoIA</div>
      <h1>Classroom</h1>
      <p>Entre com o codigo da sessao</p>
    </div>
    <div class="form-group">
      <label for="code-input">Codigo da sessao</label>
      <input type="text" id="code-input" class="code-input" placeholder="AB12" maxlength="4"
             autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
    </div>
    <div class="form-group">
      <label for="name-input">Seu nome <span style="font-weight:400;text-transform:none;letter-spacing:0">(opcional)</span></label>
      <input type="text" id="name-input" placeholder="Anonimo" maxlength="30" autocomplete="off">
    </div>
    <button class="btn-primary" id="join-btn" onclick="joinSession()">Entrar na sessao</button>
    <div class="error-msg" id="join-error"></div>
  </div>

  <!-- ── SESSION SCREEN ── -->
  <div id="session-screen">

    <!-- waiting -->
    <div id="state-waiting" class="state-center" style="display:none">
      <div class="state-icon">⏳</div>
      <div class="state-title">Aguardando próxima pergunta…</div>
      <div class="dot-wrap"><div class="refresh-dot" id="dot-waiting"></div></div>
    </div>

    <!-- question -->
    <div id="state-question" style="display:none">
      <div class="question-label">Pergunta</div>
      <div class="question-text" id="q-text"></div>
      <div id="q-options"></div>
      <p id="answer-sending-msg" style="display:none;font-size:0.82rem;color:var(--text-secondary);text-align:center;margin-top:10px">Enviando...</p>
      <div class="error-msg" id="answer-error"></div>
    </div>

    <!-- answered -->
    <div id="state-answered" class="state-center" style="display:none">
      <div class="state-icon">✓</div>
      <div class="state-title">Resposta enviada!</div>
      <div class="state-sub">Aguardando o resultado…</div>
      <div class="dot-wrap"><div class="refresh-dot" id="dot-answered"></div></div>
    </div>

    <!-- results -->
    <div id="state-results" class="results-section" style="display:none">
      <div class="question-label">Resultado</div>
      <div class="results-question" id="results-q-text"></div>
      <div id="results-bars"></div>
      <div class="results-count" id="results-count"></div>
      <div class="results-next">Próxima pergunta em breve…</div>
    </div>

    <!-- closed -->
    <div id="state-closed" class="state-center" style="display:none">
      <div class="state-icon">✓</div>
      <div class="state-title">Sessão encerrada</div>
      <div class="state-sub">Obrigado pela participação!</div>
    </div>
  </div>

</div>
<script src="../backstage/js/utils.js?v=1.0"></script>
<script src="../backstage/js/api-client.js?v=1.1"></script>
<script src="../backstage/js/question-renderer.js?v=1.2"></script>
<script src="../backstage/js/theme-manager.js?v=1.0"></script>
<script src="../backstage/js/pensoia-header.js?v=1.0"></script>
<script>
  // ── THEME ────────────────────────────────────────────────────────────────
  // ThemeManager is initialized by <pensoia-header> via theme-storage-key.
  // We still need to apply the initial theme before paint.
  (function() {
    var urlParams = new URLSearchParams(window.location.search);
    var urlTheme  = urlParams.get('theme');
    var stored    = localStorage.getItem('bs_theme_public');
    var theme     = 'light';
    if (urlTheme === 'dark' || urlTheme === 'light') theme = urlTheme;
    else if (stored === 'dark' || stored === 'light') theme = stored;
    ThemeManager.applyTheme(theme);
  })();
  // ────────────────────────────────────────────────────────────────────────

  // ── HEADER COMPONENT ───────────────────────────────────────────────────
  var headerEl = document.querySelector('pensoia-header');
  headerEl.addEventListener('ph-exit', function() { exitSession(); });
  // ────────────────────────────────────────────────────────────────────────

  // ── CONFIG ──────────────────────────────────────────────────────────────
  const POLL_INTERVAL   = 3000;
  // ────────────────────────────────────────────────────────────────────────

  // ── I18N ────────────────────────────────────────────────────────────────
  const ACTIVE_LANG = 'pt';
  const STRINGS = {
    pt: {
      btnJoin:       'Entrar na sessão',
      btnJoining:    'Verificando…',
      errCodeLength: 'Digite um código de 4 caracteres.',
      errNotFound:   'Sessão não encontrada. Verifique o código.',
      errClosed:     'Esta sessão foi encerrada.',
      errConnection: 'Erro de conexão. Tente novamente.',
      errSubmit:     'Falha ao enviar. Tente novamente.',
      errTimeout:    'Tempo esgotado para esta pergunta.',
      answersCount:  n => `${n} resposta${n !== 1 ? 's' : ''}`,
    },
    en: {
      btnJoin:       'Join session',
      btnJoining:    'Checking…',
      errCodeLength: 'Enter a 4-character session code.',
      errNotFound:   'Session not found. Check the code.',
      errClosed:     'This session has ended.',
      errConnection: 'Connection error. Please try again.',
      errSubmit:     'Failed to submit. Please try again.',
      errTimeout:    'This question has already closed.',
      answersCount:  n => `${n} answer${n !== 1 ? 's' : ''}`,
    }
  };
  const t = STRINGS[ACTIVE_LANG] || STRINGS.pt;
  // ────────────────────────────────────────────────────────────────────────

  let currentSession    = null; // { code, title, studentName }
  let pollTimer         = null;
  let activeQuestionData = null; // { id, text, options[] }
  let lastActiveQId     = null;  // ID of last seen active question
  let showingResultsFor = null;  // ID of question currently showing results


  // ── JOIN ─────────────────────────────────────────────────────────────────
  document.getElementById('code-input').addEventListener('input', function() {
    this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  });

  async function joinSession() {
    const code    = document.getElementById('code-input').value.trim().toUpperCase();
    const name    = document.getElementById('name-input').value.trim();
    const errorEl = document.getElementById('join-error');
    const btn     = document.getElementById('join-btn');

    errorEl.textContent = '';
    if (code.length !== 4) { errorEl.textContent = t.errCodeLength; return; }

    btn.disabled = true;
    btn.textContent = t.btnJoining;

    try {
      const data = await callWorker({ action: 'get_session_state', code, _t: Date.now() });

      if (data.error === 'session not found' || !data.session) {
        errorEl.textContent = t.errNotFound; return;
      }
      if (data.session.status === 'closed') { errorEl.textContent = t.errClosed; return; }

      // Assign a persistent device-local ID so anonymous devices don't collide
      var displayName = name;
      if (!displayName) {
        var anonKey = 'bs_anon_id';
        displayName = localStorage.getItem(anonKey);
        if (!displayName) {
          displayName = 'Anon_' + Math.random().toString(36).slice(2, 5).toUpperCase();
          localStorage.setItem(anonKey, displayName);
        }
      }
      currentSession = { code: data.session.code, title: data.session.title, studentName: displayName };
      sessionStorage.setItem('cl_session', JSON.stringify(currentSession));
      startSession();
    } catch(err) {
      errorEl.textContent = t.errConnection;
    } finally {
      btn.disabled = false;
      btn.textContent = t.btnJoin;
    }
  }

  function startSession() {
    document.getElementById('join-screen').style.display    = 'none';
    document.getElementById('session-screen').style.display = 'block';
    headerEl.setAttribute('session-title', currentSession.title);
    headerEl.setAttribute('code', currentSession.code);
    showState('waiting');
    pollData();
    pollTimer = setInterval(pollData, POLL_INTERVAL);
  }

  function exitSession() {
    clearInterval(pollTimer);
    currentSession = lastActiveQId = showingResultsFor = null;
    activeQuestionData = null;
    sessionStorage.removeItem('cl_session');
    document.getElementById('session-screen').style.display = 'none';
    document.getElementById('join-screen').style.display    = 'block';
    document.getElementById('code-input').value = '';
    document.getElementById('join-error').textContent = '';
    headerEl.removeAttribute('code');
    headerEl.removeAttribute('session-title');
  }

  // ── STATE MANAGEMENT ─────────────────────────────────────────────────────
  function showState(state) {
    dbg('info', `state → ${state}`);
    ['waiting','question','answered','results','closed'].forEach(s => {
      document.getElementById('state-' + s).style.display = (s === state) ? '' : 'none';
    });
  }

  function pulseDot(id) {
    const dot = document.getElementById(id);
    if (!dot) return;
    dot.classList.add('active');
    setTimeout(() => dot.classList.remove('active'), 500);
  }

  // ── POLLING ───────────────────────────────────────────────────────────────
  async function pollData() {
    try {
      const data = await callWorker({ action: 'get_session_state', code: currentSession.code });

      if (!data.session || data.session.status === 'closed') {
        clearInterval(pollTimer);
        showState('closed');
        return;
      }

      pulseDot('dot-waiting');
      pulseDot('dot-answered');

      const activeQ = data.active_question;

      if (activeQ) {
        const qId = activeQ.id;
        dbg('poll', `active Q …${qId.slice(-6)}`);
        lastActiveQId = qId;
        showingResultsFor = null;

        const myAnswer = localStorage.getItem('cl_ans_' + qId);
        if (myAnswer !== null) {
          showState('answered');
        } else {
          if (!activeQuestionData || activeQuestionData.id !== qId) {
            renderQuestion(activeQ);
          }
          showState('question');
        }
      } else {
        // No active question
        if (lastActiveQId && !showingResultsFor) {
          const prevQ    = (data.history || []).find(q => q.id === lastActiveQId);
          const myAnswer = localStorage.getItem('cl_ans_' + lastActiveQId);
          const doShow   = prevQ && prevQ.show_results === true;

          if (doShow && myAnswer !== null) {
            showingResultsFor = lastActiveQId;
            lastActiveQId = null;
            renderResults(prevQ, parseInt(myAnswer));
            showState('results');
            // Stay in results until a new question is launched — no timeout
          } else {
            // No results to show; stay in 'answered' if student answered, else 'waiting'
            if (myAnswer !== null) {
              showState('answered');
            } else {
              lastActiveQId = null;
              showState('waiting');
            }
          }
        } else if (!showingResultsFor) {
          showState('waiting');
        }
      }
    } catch (err) {
      console.error('poll error:', err);
      dbg('error', `poll: ${err.message}`);
    }
  }

  // ── RENDER QUESTION ───────────────────────────────────────────────────────
  function renderQuestion(row) {
    activeQuestionData = { id: row.id, text: row.text, options: row.options, type: row.type };

    document.getElementById('q-text').textContent = activeQuestionData.text;
    document.getElementById('answer-error').textContent = '';
    var container = document.getElementById('q-options');
    if (row.type === 'open') {
      renderOpenTextInput(container);
    } else if (row.type === 'wordcloud') {
      renderWordcloudInput(container);
    } else {
      QR.renderInput(row, container, {
        mode: 'student',
        onSelect: function(index, btn) { submitAnswer(index, btn); }
      });
    }
  }

  function renderOpenTextInput(container) {
    container.style.display = 'block';
    container.innerHTML =
      '<div class="open-text-form">' +
        '<textarea class="open-textarea" id="open-answer-input" maxlength="500" placeholder="Digite sua resposta..."></textarea>' +
        '<div class="char-counter"><span id="open-char-count">0</span>/500</div>' +
        '<button class="btn-primary" id="open-submit-btn">Enviar resposta</button>' +
      '</div>';
    document.getElementById('open-answer-input').addEventListener('input', function() {
      document.getElementById('open-char-count').textContent = this.value.length;
    });
    document.getElementById('open-submit-btn').addEventListener('click', function() {
      submitOpenAnswer(this);
    });
  }

  function renderWordcloudInput(container) {
    container.style.display = 'block';
    container.innerHTML =
      '<div class="open-text-form">' +
        '<input type="text" class="open-textarea" id="wc-answer-input" maxlength="50" ' +
               'placeholder="Digite 1 a 3 palavras..." style="min-height:auto;resize:none;padding:12px 14px">' +
        '<div class="wordcloud-hint">M\u00e1ximo 3 palavras</div>' +
        '<button class="btn-primary" id="wc-submit-btn">Enviar resposta</button>' +
      '</div>';
    document.getElementById('wc-answer-input').addEventListener('input', function() {
      var words = this.value.trim().split(/\s+/).filter(Boolean);
      if (words.length > 3) {
        this.value = words.slice(0, 3).join(' ');
      }
    });
    document.getElementById('wc-submit-btn').addEventListener('click', function() {
      submitWordcloudAnswer(this);
    });
  }

  async function submitWordcloudAnswer(btn) {
    if (!activeQuestionData) return;
    var text = (document.getElementById('wc-answer-input').value || '').trim();
    if (!text) { document.getElementById('answer-error').textContent = 'Escreva sua resposta antes de enviar.'; return; }
    var words = text.split(/\s+/).filter(Boolean);
    if (words.length > 3) { document.getElementById('answer-error').textContent = 'Use no m\u00e1ximo 3 palavras.'; return; }
    btn.disabled = true;
    document.getElementById('answer-error').textContent = '';
    document.getElementById('answer-sending-msg').style.display = '';
    var qId = activeQuestionData.id;
    try {
      var result = await callWorker({
        action: 'submit_answer',
        question_id:  qId,
        session_code: currentSession.code,
        student_name: currentSession.studentName,
        answer_value: text
      });
      if (result.ok || result.error === 'Voc\u00ea j\u00e1 enviou resposta.') {
        localStorage.setItem('cl_ans_' + qId, '1');
        dbg('ok', 'wordcloud answer saved for Q ...' + qId.slice(-6));
        showState('answered');
      } else {
        btn.disabled = false;
        document.getElementById('answer-sending-msg').style.display = 'none';
        document.getElementById('answer-error').textContent =
          result.error === 'Question is closed' ? t.errTimeout :
          result.error === 'VALIDATION_FAILED'  ? result.message :
          t.errSubmit;
      }
    } catch(e) {
      btn.disabled = false;
      document.getElementById('answer-sending-msg').style.display = 'none';
      document.getElementById('answer-error').textContent = t.errConnection;
    }
  }

  async function submitOpenAnswer(btn) {
    if (!activeQuestionData) return;
    var text = (document.getElementById('open-answer-input').value || '').trim();
    if (!text) { document.getElementById('answer-error').textContent = 'Escreva sua resposta antes de enviar.'; return; }
    btn.disabled = true;
    document.getElementById('answer-error').textContent = '';
    document.getElementById('answer-sending-msg').style.display = '';
    var qId = activeQuestionData.id;
    try {
      var result = await callWorker({
        action: 'submit_answer',
        question_id:  qId,
        session_code: currentSession.code,
        student_name: currentSession.studentName,
        answer_value: text
      });
      if (result.ok || result.error === 'Você já enviou resposta.') {
        localStorage.setItem('cl_ans_' + qId, '1');
        dbg('ok', 'open answer saved for Q ...' + qId.slice(-6));
        showState('answered');
      } else {
        btn.disabled = false;
        document.getElementById('answer-sending-msg').style.display = 'none';
        document.getElementById('answer-error').textContent =
          result.error === 'Question is closed' ? t.errTimeout :
          result.error === 'VALIDATION_FAILED'  ? result.message :
          t.errSubmit;
      }
    } catch(e) {
      btn.disabled = false;
      document.getElementById('answer-sending-msg').style.display = 'none';
      document.getElementById('answer-error').textContent = t.errConnection;
    }
  }

  // ── SUBMIT ANSWER ─────────────────────────────────────────────────────────
  async function submitAnswer(answerIndex, btn) {
    if (!activeQuestionData) return;
    document.querySelectorAll('.qr-option-btn').forEach(b => b.disabled = true);
    btn.classList.add('selected');
    document.getElementById('answer-error').textContent = '';
    document.getElementById('answer-sending-msg').style.display = '';
    const qId = activeQuestionData.id;

    try {
      const result = await callWorker({
        action: 'submit_answer',
        question_id:  qId,
        session_code: currentSession.code,
        student_name: currentSession.studentName,
        answer_index: answerIndex
      });

      if (result.ok || result.error === 'already answered') {
        localStorage.setItem('cl_ans_' + qId, String(answerIndex));
        dbg('ok', `answer ${answerIndex} saved for Q …${qId.slice(-6)}`);
        showState('answered');
      } else {
        document.querySelectorAll('.qr-option-btn').forEach(b => b.disabled = false);
        btn.classList.remove('selected');
        document.getElementById('answer-sending-msg').style.display = 'none';
        document.getElementById('answer-error').textContent =
          result.error === 'question is not active' ? t.errTimeout : t.errSubmit;
      }
    } catch {
      document.querySelectorAll('.qr-option-btn').forEach(b => b.disabled = false);
      btn.classList.remove('selected');
      document.getElementById('answer-sending-msg').style.display = 'none';
      document.getElementById('answer-error').textContent = t.errConnection;
    }
  }

  // ── RENDER RESULTS ────────────────────────────────────────────────────────
  function renderResults(row, myAnswerIndex) {
    const counts      = row.answer_counts || new Array((row.options || []).length).fill(0);
    const total       = counts.reduce((a, b) => a + b, 0);
    const revealAnswer = row.reveal_answer === true;

    const resSection = document.getElementById('state-results');
    resSection.classList.toggle('revealed', revealAnswer);

    document.getElementById('results-q-text').textContent = row.text || '';
    var barsEl = document.getElementById('results-bars');
    barsEl.className = 'qr-student';
    QR.renderResults(row, counts, barsEl, {
      mode: 'student',
      revealAnswer,
      correctAnswer: row.correct_answer,
      myAnswerIndex,
    });
    document.getElementById('results-count').textContent = t.answersCount(total);
  }


  // ── INIT ─────────────────────────────────────────────────────────────────
  const saved = sessionStorage.getItem('cl_session');
  if (saved) { try { currentSession = JSON.parse(saved); startSession(); } catch { sessionStorage.removeItem('cl_session'); } }

  // Auto-fill code from URL (QR scan lands here with ?code=XXXX)
  const urlCode = new URLSearchParams(window.location.search).get('code');
  if (urlCode && !currentSession) {
    const codeInput = document.getElementById('code-input');
    codeInput.value = urlCode.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
    document.getElementById('name-input').focus();
  }

  document.getElementById('code-input').addEventListener('keydown', e => { if (e.key === 'Enter') joinSession(); });
  document.getElementById('name-input').addEventListener('keydown', e => { if (e.key === 'Enter') joinSession(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && currentSession) pollData(); });
</script>

</body>
</html>
