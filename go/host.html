<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Classroom · Instructor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #faf8f5;
      --text: #3d3529;
      --text-muted: #8a7b66;
      --text-dim: #a89880;
      --border: #e8e0d4;
      --card-bg: #fff;
      --accent: #c4a97d;
      --accent-dark: #5c4a2f;
      --success: #4a7c59;
      --error: #c44;
      --pinned-bg: #fdf6ec;
      --pinned-border: #c4a97d;
      --answered-opacity: 0.5;
      --danger: #b03030;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      padding: 28px 0 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }
    .header .logo {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent-dark);
      margin-bottom: 6px;
    }
    .header h1 { font-size: 1.1rem; font-weight: 700; color: var(--accent-dark); }
    .header p  { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }

    /* ── Form elements ── */
    label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      background: var(--card-bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: var(--accent); }
    .form-group { margin-bottom: 18px; }

    /* ── Buttons ── */
    .btn-primary {
      width: 100%;
      padding: 13px;
      background: var(--accent-dark);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.4; cursor: default; }

    .btn-secondary {
      padding: 8px 16px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.82rem;
      font-family: inherit;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent-dark); }

    .btn-danger {
      padding: 8px 16px;
      background: none;
      border: 1px solid #e0b0b0;
      border-radius: 8px;
      font-size: 0.82rem;
      font-family: inherit;
      color: var(--danger);
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-danger:hover { background: #fdf0f0; }

    /* ── Error / success messages ── */
    .error-msg   { font-size: 0.82rem; color: var(--error); margin-top: 10px; min-height: 1.2em; }
    .success-msg { font-size: 0.82rem; color: var(--success); margin-top: 10px; min-height: 1.2em; }

    /* ── Divider ── */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 22px 0; color: var(--text-dim); font-size: 0.78rem;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* ── Session info bar ── */
    .session-info-bar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 20px;
    }
    .session-info-bar .session-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent-dark);
      margin-bottom: 10px;
    }
    .session-info-bar .info-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .code-display {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--accent-dark);
      background: var(--pinned-bg);
      padding: 4px 14px;
      border-radius: 8px;
      border: 1px solid var(--accent);
    }
    .btn-copy {
      padding: 6px 12px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.78rem;
      font-family: inherit;
      color: var(--text-muted);
      cursor: pointer;
    }
    .btn-copy:hover { border-color: var(--accent); color: var(--accent-dark); }
    .btn-copy.copied { color: var(--success); border-color: var(--success); }

    /* ── Stats row ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }
    .stat-card .stat-num {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent-dark);
    }
    .stat-card .stat-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 2px;
    }

    /* ── Questions section ── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .section-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }
    .refresh-indicator { font-size: 0.7rem; color: var(--text-dim); }
    .refresh-indicator.fetching { color: var(--accent); }

    /* ── Question cards ── */
    .question-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .question-card.pinned  { border-left: 3px solid var(--pinned-border); background: var(--pinned-bg); }
    .question-card.answered { opacity: var(--answered-opacity); }
    .question-card.hidden-q { opacity: 0.3; }

    .question-text {
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 10px;
    }
    .question-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .question-author { font-size: 0.75rem; color: var(--text-dim); }
    .question-time   { font-size: 0.72rem; color: var(--text-dim); }
    .upvote-count    { font-size: 0.78rem; color: var(--text-muted); margin-left: auto; }

    .question-status-badge {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 7px;
      border-radius: 4px;
    }
    .question-status-badge.pinned   { background: #f4e6c8; color: #8a6020; }
    .question-status-badge.answered { background: #e0f0e8; color: var(--success); }
    .question-status-badge.hidden   { background: #eee; color: #999; }

    .action-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .action-row .btn-action {
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.75rem;
      font-family: inherit;
      background: none;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.12s;
    }
    .action-row .btn-action:hover { border-color: var(--accent); color: var(--accent-dark); }
    .action-row .btn-action.btn-pin:hover    { border-color: var(--accent); }
    .action-row .btn-action.btn-answered:hover { border-color: var(--success); color: var(--success); }
    .action-row .btn-action.btn-hide:hover  { border-color: #aaa; }

    .empty-state {
      text-align: center;
      padding: 40px 0;
      color: var(--text-dim);
      font-size: 0.88rem;
    }

    /* ── QR Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 28px 24px;
      max-width: 320px;
      width: 90%;
      text-align: center;
    }
    .modal h3  { font-size: 0.9rem; font-weight: 700; color: var(--accent-dark); margin-bottom: 16px; }
    .modal img { border-radius: 8px; }
    .modal p   { font-size: 0.78rem; color: var(--text-muted); margin-top: 12px; }
    .modal .modal-close {
      margin-top: 16px;
      padding: 8px 24px;
      background: var(--accent-dark);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* ── Session end summary ── */
    .summary-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .summary-card h3 { font-size: 0.9rem; font-weight: 700; color: var(--accent-dark); margin-bottom: 12px; }
    .summary-card p  { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 6px; }
    .summary-card .top-question {
      margin-top: 12px;
      padding: 10px 14px;
      background: var(--pinned-bg);
      border-left: 3px solid var(--accent);
      border-radius: 6px;
      font-size: 0.88rem;
    }

    /* ── Screen visibility ── */
    #pw-gate       { display: block; }
    #no-session    { display: none; }
    #active-session{ display: none; }
    #summary       { display: none; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">PensoIA</div>
    <h1>Classroom · Instructor</h1>
    <p>Manage your Q&amp;A session</p>
  </div>

  <!-- ══════════════════════════════════════════
       PASSWORD GATE
  ══════════════════════════════════════════ -->
  <div id="pw-gate" style="text-align:center; padding: 40px 0;">
    <p style="font-size:0.88rem; color:var(--text-muted); margin-bottom:16px;">Instructor access</p>
    <div style="max-width:280px; margin:0 auto;">
      <div class="form-group">
        <input type="password" id="pw-input" placeholder="Password" autocomplete="current-password">
      </div>
      <button class="btn-primary" onclick="checkPassword()">Enter</button>
      <div class="error-msg" id="pw-error" style="text-align:center"></div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       NO ACTIVE SESSION
  ══════════════════════════════════════════ -->
  <div id="no-session">
    <div class="form-group">
      <label for="session-title-input">Session title</label>
      <input type="text" id="session-title-input" placeholder="e.g. Class 01 – Intro to AI" maxlength="60">
    </div>
    <div class="form-group">
      <label for="session-pw-input">Session password <span style="font-weight:400;text-transform:none;letter-spacing:0">(used to manage questions)</span></label>
      <input type="password" id="session-pw-input" placeholder="Choose a password" maxlength="40" autocomplete="new-password">
    </div>
    <button class="btn-primary" id="create-btn" onclick="createSession()">Create session</button>
    <div class="error-msg" id="create-error"></div>

    <div class="divider">or reopen an existing session</div>

    <div style="display:flex; gap:10px;">
      <input type="text" id="reopen-code-input" placeholder="Code (e.g. AB12)"
             maxlength="4" style="text-transform:uppercase; letter-spacing:0.12em; font-size:1rem;"
             oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')">
      <input type="password" id="reopen-pw-input" placeholder="Password" style="flex:1">
      <button class="btn-secondary" onclick="reopenSession()">Open</button>
    </div>
    <div class="error-msg" id="reopen-error"></div>
  </div>

  <!-- ══════════════════════════════════════════
       ACTIVE SESSION
  ══════════════════════════════════════════ -->
  <div id="active-session">

    <!-- Session info -->
    <div class="session-info-bar">
      <div class="session-name" id="active-title"></div>
      <div class="info-row">
        <span class="code-display" id="active-code"></span>
        <button class="btn-copy" id="copy-btn" onclick="copyCode()">Copy</button>
        <button class="btn-secondary" onclick="showQR()">QR Code</button>
        <a id="display-link" href="#" target="_blank" class="btn-secondary" style="text-decoration:none">
          Open display →
        </a>
        <button class="btn-danger" onclick="confirmClose()">End session</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num" id="stat-total">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-open">0</div>
        <div class="stat-label">Open</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-answered">0</div>
        <div class="stat-label">Answered</div>
      </div>
    </div>

    <!-- Questions -->
    <div class="section-header">
      <span class="section-title">Questions</span>
      <span class="refresh-indicator" id="host-refresh">live</span>
    </div>
    <div id="host-questions-list"></div>
  </div>

  <!-- ══════════════════════════════════════════
       SESSION ENDED SUMMARY
  ══════════════════════════════════════════ -->
  <div id="summary">
    <div class="summary-card">
      <h3>Session ended</h3>
      <p id="summary-stats"></p>
      <div class="top-question" id="summary-top" style="display:none"></div>
    </div>
    <button class="btn-primary" onclick="startOver()">Start a new session</button>
  </div>

</div>

<!-- QR Modal -->
<div class="modal-overlay" id="qr-modal" onclick="closeQR(event)">
  <div class="modal">
    <h3>Scan to join</h3>
    <img id="qr-img" src="" alt="QR Code" width="220" height="220">
    <p>Students go to <strong>pensoia.com/go</strong> and enter code</p>
    <p style="margin-top:6px; font-size:1.2rem; font-weight:700; color:var(--accent-dark)" id="qr-code-label"></p>
    <button class="modal-close" onclick="closeQR()">Close</button>
  </div>
</div>

<script>
  // ── CONFIG ──────────────────────────────────────────────────────────────
  const SPREADSHEET_ID   = '14UnmqEmPk6xP0oGwmuAbffuywwlW3dmYhQOAbEadsmA';
  const APPS_SCRIPT_URL  = 'https://script.google.com/macros/s/AKfycbwdynfo6geXRNyrJtuAzXxCpOztsnvCGRz2FWkhLC05dsVAjOF2P1QV9bjLTZbVQbDlbg/exec';
  const HOST_PASSWORD    = 'pensoia2026'; // instructor page access
  const SESSIONS_CSV     = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=Sessions`;
  const QUESTIONS_CSV    = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=Questions`;
  const REFRESH_INTERVAL = 3000; // 3 seconds (faster than student view)
  // ────────────────────────────────────────────────────────────────────────

  // ── CONFIG CHECK ───────────────────────────────────────────────────────
  if (SPREADSHEET_ID.includes('REPLACE') || APPS_SCRIPT_URL.includes('REPLACE') || HOST_PASSWORD.includes('REPLACE')) {
    document.querySelector('.container').innerHTML =
      '<div style="padding:40px;text-align:center;color:#c44;font-size:0.9rem;">' +
      '<strong>Setup incomplete.</strong><br>Replace SPREADSHEET_ID, APPS_SCRIPT_URL, and HOST_PASSWORD in this file.' +
      '</div>';
    throw new Error('Classroom Light: config placeholders not replaced');
  }
  // ────────────────────────────────────────────────────────────────────────

  let activeSession = null; // { code, title, password }
  let refreshTimer  = null;
  let allQuestions  = [];

  // ── CSV PARSING ──────────────────────────────────────────────────────────
  function parseCSV(text) {
    const trimmed = text.trim();
    if (trimmed.startsWith('<!') || trimmed.startsWith('<html') || trimmed.startsWith('<HTML')) {
      console.error('Classroom Light: CSV endpoint returned HTML. Is the Sheet published to web?');
      return [];
    }
    const lines = trimmed.split('\n');
    return lines.slice(1).map(parseCSVLine);
  }

  function parseCSVLine(line) {
    const result = [];
    let current = '', inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      if (line[i] === '"') {
        if (inQuotes && line[i+1] === '"') { current += '"'; i++; }
        else inQuotes = !inQuotes;
      } else if (line[i] === ',' && !inQuotes) {
        result.push(current); current = '';
      } else { current += line[i]; }
    }
    result.push(current);
    return result;
  }

  // ── POST HELPER ──────────────────────────────────────────────────────────
  async function post(action, data) {
    const resp = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action, ...data }),
      redirect: 'follow'
    });
    return resp.json();
  }

  // ── PASSWORD GATE ────────────────────────────────────────────────────────
  function checkPassword() {
    const val = document.getElementById('pw-input').value;
    if (val === HOST_PASSWORD) {
      sessionStorage.setItem('classroom_host_auth', '1');
      document.getElementById('pw-gate').style.display    = 'none';
      // Restore active session if any
      const saved = sessionStorage.getItem('classroom_host_session');
      if (saved) {
        try { activeSession = JSON.parse(saved); showActiveSession(); return; } catch {}
      }
      document.getElementById('no-session').style.display = 'block';
    } else {
      document.getElementById('pw-error').textContent = 'Incorrect password.';
    }
  }

  document.getElementById('pw-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') checkPassword();
  });

  // ── CREATE SESSION ───────────────────────────────────────────────────────
  async function createSession() {
    const title = document.getElementById('session-title-input').value.trim();
    const pw    = document.getElementById('session-pw-input').value.trim();
    const errorEl = document.getElementById('create-error');
    const btn   = document.getElementById('create-btn');

    errorEl.textContent = '';
    if (!title) { errorEl.textContent = 'Please enter a session title.'; return; }
    if (!pw)    { errorEl.textContent = 'Please set a session password.'; return; }

    btn.disabled = true;
    btn.textContent = 'Creating…';

    try {
      const result = await post('create_session', { title, password: pw });
      if (result.ok) {
        activeSession = { code: result.code, title, password: pw };
        sessionStorage.setItem('classroom_host_session', JSON.stringify(activeSession));
        showActiveSession();
      } else {
        errorEl.textContent = result.error || 'Failed to create session.';
      }
    } catch {
      errorEl.textContent = 'Connection error. Please try again.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Create session';
    }
  }

  // ── REOPEN SESSION ───────────────────────────────────────────────────────
  async function reopenSession() {
    const code = document.getElementById('reopen-code-input').value.trim().toUpperCase();
    const pw   = document.getElementById('reopen-pw-input').value.trim();
    const errorEl = document.getElementById('reopen-error');

    errorEl.textContent = '';
    if (code.length !== 4) { errorEl.textContent = 'Enter a valid 4-character code.'; return; }
    if (!pw) { errorEl.textContent = 'Enter the session password.'; return; }

    try {
      const resp = await fetch(SESSIONS_CSV + '&t=' + Date.now());
      const text = await resp.text();
      const rows = parseCSV(text);
      const session = rows.find(r => r[0].trim().toUpperCase() === code);

      if (!session) { errorEl.textContent = 'Session not found.'; return; }
      if (session[4].trim() !== pw) { errorEl.textContent = 'Incorrect password.'; return; }

      activeSession = { code: session[0].trim().toUpperCase(), title: session[1].trim(), password: pw };
      sessionStorage.setItem('classroom_host_session', JSON.stringify(activeSession));
      showActiveSession();
    } catch {
      errorEl.textContent = 'Connection error. Please try again.';
    }
  }

  // ── SHOW ACTIVE SESSION ──────────────────────────────────────────────────
  function showActiveSession() {
    document.getElementById('no-session').style.display     = 'none';
    document.getElementById('pw-gate').style.display        = 'none';
    document.getElementById('active-session').style.display = 'block';
    document.getElementById('summary').style.display        = 'none';

    document.getElementById('active-title').textContent = activeSession.title;
    document.getElementById('active-code').textContent  = activeSession.code;

    // Display link
    const displayUrl = `display.html?code=${activeSession.code}`;
    document.getElementById('display-link').href = displayUrl;

    fetchHostQuestions();
    refreshTimer = setInterval(fetchHostQuestions, REFRESH_INTERVAL);
  }

  // ── FETCH QUESTIONS (HOST VIEW) ──────────────────────────────────────────
  async function fetchHostQuestions() {
    const indicator = document.getElementById('host-refresh');
    indicator.textContent = 'refreshing…';
    indicator.classList.add('fetching');

    try {
      const resp = await fetch(QUESTIONS_CSV + '&t=' + Date.now());
      const text = await resp.text();
      const rows = parseCSV(text);

      allQuestions = rows
        .filter(r => r[1].trim().toUpperCase() === activeSession.code)
        .map(r => ({
          id:      r[0].trim(),
          name:    r[2].trim() || 'Anonymous',
          text:    r[3].trim(),
          upvotes: parseInt(r[4]) || 0,
          status:  r[5].trim().toLowerCase(),
          time:    r[6].trim()
        }));

      renderHostQuestions();
      updateStats();
      indicator.textContent = 'live';
      indicator.classList.remove('fetching');
    } catch {
      indicator.textContent = 'offline';
      indicator.classList.remove('fetching');
    }
  }

  function updateStats() {
    const visible  = allQuestions.filter(q => q.status !== 'hidden');
    const open     = visible.filter(q => q.status === 'open' || q.status === 'pinned');
    const answered = visible.filter(q => q.status === 'answered');
    document.getElementById('stat-total').textContent    = visible.length;
    document.getElementById('stat-open').textContent     = open.length;
    document.getElementById('stat-answered').textContent = answered.length;
  }

  function renderHostQuestions() {
    const listEl = document.getElementById('host-questions-list');

    if (allQuestions.length === 0) {
      listEl.innerHTML = '<div class="empty-state">No questions yet. Share the session code!</div>';
      return;
    }

    // Sort: pinned first, then by upvotes desc, then timestamp asc
    const sorted = [...allQuestions].sort((a, b) => {
      if (a.status === 'pinned' && b.status !== 'pinned') return -1;
      if (b.status === 'pinned' && a.status !== 'pinned') return 1;
      if (a.status === 'hidden' && b.status !== 'hidden') return 1;
      if (b.status === 'hidden' && a.status !== 'hidden') return -1;
      if (b.upvotes !== a.upvotes) return b.upvotes - a.upvotes;
      return new Date(a.time) - new Date(b.time);
    });

    listEl.innerHTML = sorted.map(q => {
      let badge = '';
      if (q.status === 'pinned')   badge = '<span class="question-status-badge pinned">📌 Pinned</span> ';
      if (q.status === 'answered') badge = '<span class="question-status-badge answered">✓ Answered</span> ';
      if (q.status === 'hidden')   badge = '<span class="question-status-badge hidden">Hidden</span> ';

      const actions = buildActionButtons(q);
      const timeStr = q.time ? new Date(q.time).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) : '';

      return `
        <div class="question-card ${q.status === 'pinned' ? 'pinned' : ''} ${q.status === 'answered' ? 'answered' : ''} ${q.status === 'hidden' ? 'hidden-q' : ''}"
             id="qcard-${q.id}">
          <div class="question-text">${escapeHtml(q.text)}</div>
          <div class="question-meta">
            <span class="question-author">${badge}${escapeHtml(q.name)}</span>
            <span class="question-time">${timeStr}</span>
            <span class="upvote-count">▲ ${q.upvotes}</span>
          </div>
          <div class="action-row">${actions}</div>
        </div>`;
    }).join('');
  }

  function buildActionButtons(q) {
    const btns = [];
    if (q.status === 'pinned') {
      btns.push(`<button class="btn-action btn-pin" onclick="setStatus('${q.id}','open')">Unpin</button>`);
    } else if (q.status !== 'hidden') {
      btns.push(`<button class="btn-action btn-pin" onclick="setStatus('${q.id}','pinned')">📌 Pin</button>`);
    }
    if (q.status === 'answered') {
      btns.push(`<button class="btn-action btn-answered" onclick="setStatus('${q.id}','open')">Reopen</button>`);
    } else if (q.status !== 'hidden') {
      btns.push(`<button class="btn-action btn-answered" onclick="setStatus('${q.id}','answered')">✓ Answered</button>`);
    }
    if (q.status === 'hidden') {
      btns.push(`<button class="btn-action" onclick="setStatus('${q.id}','open')">Show</button>`);
    } else {
      btns.push(`<button class="btn-action btn-hide" onclick="setStatus('${q.id}','hidden')">Hide</button>`);
    }
    return btns.join('');
  }

  // ── SET QUESTION STATUS ──────────────────────────────────────────────────
  async function setStatus(id, status) {
    // Optimistic update
    const q = allQuestions.find(q => q.id === id);
    if (q) { q.status = status; renderHostQuestions(); updateStats(); }

    try {
      await post('update_status', {
        id, status,
        password:     activeSession.password,
        session_code: activeSession.code
      });
    } catch {
      // Revert on failure — next fetch will correct it
    }
  }

  // ── COPY CODE ────────────────────────────────────────────────────────────
  function copyCode() {
    navigator.clipboard.writeText(activeSession.code).then(() => {
      const btn = document.getElementById('copy-btn');
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
    });
  }

  // ── QR CODE ──────────────────────────────────────────────────────────────
  function showQR() {
    const url = 'https://pensoia.com/go';
    document.getElementById('qr-img').src =
      `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(url)}&bgcolor=faf8f5&color=3d3529`;
    document.getElementById('qr-code-label').textContent = activeSession.code;
    document.getElementById('qr-modal').classList.add('open');
  }
  function closeQR(e) {
    if (!e || e.target === document.getElementById('qr-modal') || e.currentTarget === document.querySelector('.modal-close')) {
      document.getElementById('qr-modal').classList.remove('open');
    }
  }

  // ── CLOSE SESSION ────────────────────────────────────────────────────────
  function confirmClose() {
    if (!confirm(`End session "${activeSession.title}"? Students will no longer be able to submit questions.`)) return;
    closeSession();
  }

  async function closeSession() {
    clearInterval(refreshTimer);
    try {
      await post('close_session', { code: activeSession.code, password: activeSession.password });
    } catch {}
    showSummary();
  }

  function showSummary() {
    document.getElementById('active-session').style.display = 'none';
    document.getElementById('summary').style.display        = 'block';

    const visible  = allQuestions.filter(q => q.status !== 'hidden');
    const answered = visible.filter(q => q.status === 'answered');
    const totalVotes = visible.reduce((sum, q) => sum + q.upvotes, 0);
    const top = [...visible].sort((a,b) => b.upvotes - a.upvotes)[0];

    document.getElementById('summary-stats').textContent =
      `${visible.length} questions · ${answered.length} answered · ${totalVotes} total upvotes`;

    if (top && top.upvotes > 0) {
      const topEl = document.getElementById('summary-top');
      topEl.textContent = `Most popular: "${top.text}" (${top.upvotes} votes)`;
      topEl.style.display = 'block';
    }

    sessionStorage.removeItem('classroom_host_session');
    activeSession = null;
  }

  function startOver() {
    document.getElementById('summary').style.display     = 'none';
    document.getElementById('no-session').style.display  = 'block';
    document.getElementById('session-title-input').value = '';
    document.getElementById('session-pw-input').value    = '';
  }

  // ── UTILS ────────────────────────────────────────────────────────────────
  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── INIT ─────────────────────────────────────────────────────────────────
  if (sessionStorage.getItem('classroom_host_auth') === '1') {
    document.getElementById('pw-gate').style.display = 'none';
    const saved = sessionStorage.getItem('classroom_host_session');
    if (saved) {
      try { activeSession = JSON.parse(saved); showActiveSession(); }
      catch { document.getElementById('no-session').style.display = 'block'; }
    } else {
      document.getElementById('no-session').style.display = 'block';
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && activeSession) fetchHostQuestions();
  });
</script>
</body>
</html>
