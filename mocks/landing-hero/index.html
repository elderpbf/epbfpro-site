<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Mock · Topo do landing (alternativas do hero)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,500;0,600;1,500;1,600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<!-- CSS REAL da landing, pra o mock ficar fiel -->
<link rel="stylesheet" href="/css/landing.css?v=21">

<style>
  /* Barra de controle do mock (não faz parte da landing) */
  .mk-bar{position:fixed;inset:0 0 auto 0;z-index:100;display:flex;flex-wrap:wrap;align-items:center;gap:8px;
    padding:10px 16px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px) saturate(140%);
    border-bottom:1px solid var(--line-soft);font-family:'Inter',sans-serif}
  .mk-title{font-weight:700;font-size:.8rem;color:var(--ink);margin-right:6px}
  .mk-btn{padding:6px 11px;border-radius:9px;border:1px solid var(--line);background:var(--pill);color:var(--ink);
    font:600 .78rem 'Inter';cursor:pointer;transition:.2s var(--ease)}
  .mk-btn:hover{border-color:var(--teal);color:var(--teal-text)}
  .mk-btn.is-on{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
  .mk-spacer{flex:1}
  .mk-cap{width:100%;font-size:.76rem;color:var(--ink-soft);padding-top:3px;line-height:1.5}
  .mk-cap b{color:var(--teal-text)}

  /* Alternativas */
  .alt-static{font-family:'Lora',serif;font-style:italic;font-weight:500;color:var(--ink-soft);
    font-size:clamp(1.25rem,2.8vw,1.95rem);margin-top:14px}
  .alt-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}
  .alt-chip{display:inline-flex;align-items:center;gap:9px;padding:9px 17px;border-radius:100px;
    background:var(--pill);border:1px solid var(--line);font:600 .95rem 'Inter';color:var(--ink-soft)}
  .alt-chip i{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px var(--line-soft)}
  .alt-fade{transition:opacity .45s ease}
  .alt4 h1 .plp-hl{background-size:100% 3px}      /* o grifo fica preenchido (no site o orbe o desenha) */
  .alt-draw{display:block;font-family:'Lora',serif;font-style:italic;font-weight:500;color:var(--teal-text);
    font-size:clamp(1.4rem,3.2vw,2.2rem);margin-top:12px}
  .alt-draw .ln{background-image:linear-gradient(var(--hl-line),var(--hl-line));background-repeat:no-repeat;
    background-position:0 100%;background-size:0% 3px;padding-bottom:.07em;-webkit-box-decoration-break:clone;box-decoration-break:clone;
    animation:mkdraw 5s var(--ease) infinite}
  @keyframes mkdraw{0%{background-size:0% 3px}40%{background-size:100% 3px}88%{background-size:100% 3px}100%{background-size:0% 3px}}

  /* deixa o hero um pouco mais baixo pra caber sob a barra ao abrir */
  .plp-hero{min-height:100vh}
</style>
</head>
<body>

<div class="mk-bar">
  <span class="mk-title">Topo do landing · hero</span>
  <button class="mk-btn" data-alt="atual">Atual</button>
  <button class="mk-btn" data-alt="static">1 · Estático</button>
  <button class="mk-btn" data-alt="chips">2 · Pilares</button>
  <button class="mk-btn" data-alt="fade">3 · Crossfade</button>
  <button class="mk-btn" data-alt="hl">4 · Grifado</button>
  <button class="mk-btn" data-alt="orb">5 · Orbe</button>
  <span class="mk-spacer"></span>
  <button class="mk-btn" id="mk-theme">🌙 / ☀</button>
  <div class="mk-cap" id="mk-cap"></div>
</div>

<section class="plp-hero">
  <div class="plp-wrap">
    <div id="alt-slot"></div>
    <p class="plp-lead">Capacitação e consultoria para empresas, instituições e profissionais que querem usar a IA no dia a dia, com clareza, segurança e resultado.</p>
    <p class="plp-tagl">pensamento humano, <b>inteligência ampliada</b></p>
  </div>
</section>

<script>
  const H1 = 'Inteligência artificial aplicada ao seu trabalho';
  const WORDS = ['com método.', 'com segurança.', 'com responsabilidade.'];
  const slot = document.getElementById('alt-slot');
  const cap = document.getElementById('mk-cap');
  let timer = null, interval = null;

  function typewriter() {
    const el = document.getElementById('rot'); if (!el) return;
    let i = 0, ci = 0, del = false;
    (function tick() {
      const w = WORDS[i];
      if (!del) { el.textContent = w.slice(0, ++ci); if (ci >= w.length) { del = true; timer = setTimeout(tick, 1600); return; } timer = setTimeout(tick, 55); }
      else { el.textContent = w.slice(0, --ci); if (ci <= 0) { del = false; i = (i + 1) % WORDS.length; timer = setTimeout(tick, 280); return; } timer = setTimeout(tick, 30); }
    })();
  }

  function crossfade() {
    const el = document.getElementById('fade'); if (!el) return;
    let i = 0;
    interval = setInterval(() => {
      el.style.opacity = 0;
      setTimeout(() => { i = (i + 1) % WORDS.length; el.textContent = WORDS[i]; el.style.opacity = 1; }, 450);
    }, 2800);
  }

  const ALTS = {
    atual: {
      cap: '<b>Atual:</b> texto que digita e apaga + cursor piscando. É o efeito que datou (brega).',
      html: '<h1>' + H1 + '</h1><span class="plp-rot"><span id="rot"></span><span class="plp-cur" aria-hidden="true"></span></span>',
      init: typewriter,
    },
    static: {
      cap: '<b>1 · Estático:</b> sem animação, valores numa linha sóbria. Máxima seriedade, atemporal, risco zero.',
      html: '<h1>' + H1 + '</h1><div class="alt-static">Com método, segurança e responsabilidade.</div>',
    },
    chips: {
      cap: '<b>2 · Pilares:</b> três chips estáticos. Escaneável e moderno, lê como princípios, não como efeito.',
      html: '<h1>' + H1 + '</h1><div class="alt-chips">' +
        '<span class="alt-chip"><i></i>método</span>' +
        '<span class="alt-chip"><i></i>segurança</span>' +
        '<span class="alt-chip"><i></i>responsabilidade</span></div>',
    },
    fade: {
      cap: '<b>3 · Crossfade:</b> as palavras trocam com um fade suave, sem digitação nem cursor. Mantém movimento, sem o ar brega.',
      html: '<h1>' + H1 + '</h1><span class="plp-rot alt-fade" id="fade">com método.</span>',
      init: crossfade,
    },
    hl: {
      cap: '<b>4 · Grifado:</b> frase única, com as palavras no verde-marcador que a marca já usa. Coerente com o resto do site.',
      html: '<div class="alt4"><h1>Inteligência artificial aplicada ao seu trabalho, com ' +
        '<span class="plp-hl plp-hl-on">método</span>, ' +
        '<span class="plp-hl plp-hl-on">segurança</span> e ' +
        '<span class="plp-hl plp-hl-on">responsabilidade</span>.</h1></div>',
    },
    orb: {
      cap: '<b>5 · Orbe (conceito):</b> a luz sublinha a frase. No site real seria o próprio orbe traçando, único da PensoIA.',
      html: '<h1>' + H1 + '</h1><span class="alt-draw"><span class="ln">com método, segurança e responsabilidade.</span></span>',
    },
  };

  function render(key) {
    if (timer) { clearTimeout(timer); timer = null; }
    if (interval) { clearInterval(interval); interval = null; }
    const a = ALTS[key];
    slot.innerHTML = a.html;
    cap.innerHTML = a.cap;
    document.querySelectorAll('.mk-btn[data-alt]').forEach((b) => b.classList.toggle('is-on', b.dataset.alt === key));
    if (a.init) a.init();
  }

  document.querySelectorAll('.mk-btn[data-alt]').forEach((b) =>
    b.addEventListener('click', () => render(b.dataset.alt)));

  document.getElementById('mk-theme').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
  });

  render('atual');   // abre mostrando o atual pra comparar
</script>
</body>
</html>
