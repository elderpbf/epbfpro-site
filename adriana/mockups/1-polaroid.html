<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Adriana, Polaroid</title>
  <link rel="icon" href="../media/favicon-adriana.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Fraunces:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./shared.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #faf6f0;
      color: #3b2e2a;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 20px 60px;
      overflow: hidden;
      position: relative;
    }
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      max-width: 480px;
      width: 100%;
    }
    .polaroid {
      background: #fff;
      padding: 16px 16px 56px;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.10);
      transform: rotate(-2deg);
      width: 280px;
    }
    .polaroid img {
      display: block;
      width: 100%;
      height: 280px;
      object-fit: cover;
    }
    .polaroid .caption {
      font-family: 'Caveat', cursive;
      font-size: 20px;
      color: #7a6a62;
      text-align: center;
      margin-top: 14px;
    }
    .name {
      font-family: 'Caveat', cursive;
      font-weight: 600;
      font-size: clamp(48px, 9vw, 84px);
      color: #3b2e2a;
      line-height: 1;
      margin: 6px 0 0;
    }
    .dates {
      font-family: 'Fraunces', serif;
      font-size: 13px;
      color: #7a6a62;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin: 0;
    }
    .summary {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      color: #5a4d47;
      max-width: 36ch;
      line-height: 1.55;
      text-align: center;
      margin: 4px 0 6px;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      background: #fff;
      border: 1px solid #d6c8b8;
      padding: 12px 22px;
      border-radius: 999px;
      color: #3b2e2a;
      font: 500 14px/1 'Inter', sans-serif;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.05s ease;
    }
    .btn:hover { background: #fdf9f3; }
    .btn:active { transform: translateY(1px); }
    .flourish {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: 14px;
      color: #a08a78;
      margin-top: 6px;
    }
    @media (max-width: 420px) {
      .btn-row { flex-direction: column; width: 100%; }
      .btn { width: 100%; }
      .polaroid { width: 260px; }
      .polaroid img { height: 260px; }
    }
    @media (min-width: 720px) {
      .polaroid { width: 360px; }
      .polaroid img { height: 340px; }
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(40, 25, 15, 0.45);
      backdrop-filter: blur(2px);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #fdf9f3;
      width: 100%;
      max-width: 640px;
      max-height: 90vh;
      border-radius: 24px 24px 0 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.28s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px 12px;
      border-bottom: 1px solid #ecdfcf;
    }
    .modal-title {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 22px;
      margin: 0;
      color: #3b2e2a;
    }
    .modal-close {
      background: transparent;
      border: 0;
      font-size: 22px;
      cursor: pointer;
      color: #7a6a62;
      padding: 4px 8px;
      line-height: 1;
    }
    .modal-body {
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .phase {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }
    .phase-pol {
      flex-shrink: 0;
      background: #fff;
      padding: 6px 6px 18px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.08);
      transform: rotate(-1.5deg);
      width: 92px;
    }
    .phase-pol img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      display: block;
    }
    .phase-text .ph-date {
      font-family: 'Fraunces', serif;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #a08a78;
    }
    .phase-text h3 {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 18px;
      margin: 4px 0 6px;
      color: #3b2e2a;
    }
    .phase-text p {
      font-size: 14px;
      color: #5a4d47;
      margin: 0;
      line-height: 1.55;
    }
    .envelope {
      background: #fff;
      border: 1px solid #ecdfcf;
      border-radius: 10px;
      padding: 16px 18px;
    }
    .env-from {
      font-family: 'Caveat', cursive;
      font-size: 22px;
      color: #3b2e2a;
      line-height: 1;
    }
    .env-date {
      font-family: 'Fraunces', serif;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #a08a78;
      margin: 4px 0 10px;
    }
    .env-text {
      font-family: 'Fraunces', serif;
      font-size: 15px;
      color: #5a4d47;
      line-height: 1.55;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="polaroid">
      <img src="../media/adriana.jpg" alt="Adriana">
      <div class="caption">Adriana, nossa força</div>
    </div>
    <h1 class="name">Adriana</h1>
    <p class="dates">Fevereiro a Abril de 2026</p>
    <p class="summary">45 dias na UTI, e a história continua, com força e fé.</p>
    <div class="btn-row">
      <button class="btn" data-modal="history">Nossa história</button>
      <button class="btn" data-modal="messages">Mensagens de carinho</button>
    </div>
    <div class="flourish">✿ família</div>
  </div>

  <div class="modal-backdrop" id="modal">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 class="modal-title" id="modal-title">Nossa história</h2>
        <button class="modal-close" aria-label="Fechar">×</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <nav class="mockup-nav" aria-label="Mockup navigation">
    <a href="./5-constellation.html" title="Anterior">←</a>
    <span class="count">1 / 5</span>
    <a href="./2-frosted-hero.html" title="Próximo">→</a>
    <span class="sep">·</span>
    <a href="./index.html">índice</a>
  </nav>

  <div class="mockup-footer-label">Mockup 1 de 5 · Adriana retrospectiva</div>

  <script>
    const dataPromise = Promise.all([
      fetch('./history.json').then(r => r.json()).catch(e => { console.warn('history.json falhou', e); return { phases: [] }; }),
      fetch('./messages.json').then(r => r.json()).catch(e => { console.warn('messages.json falhou', e); return { messages: [] }; })
    ]);

    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const modalBody = document.getElementById('modal-body');

    function renderHistory(phases) {
      modalTitle.textContent = 'Nossa história';
      modalBody.innerHTML = phases.map(p => {
        const photo = p.photos && p.photos[0]
          ? `<div class="phase-pol"><img src="../media/${p.photos[0]}" alt=""></div>`
          : `<div class="phase-pol"><img src="../media/favicon-adriana.png" alt="" style="object-fit:contain;background:#fdf9f3"></div>`;
        return `
          <div class="phase">
            ${photo}
            <div class="phase-text">
              <div class="ph-date">${p.date}</div>
              <h3>${p.title}</h3>
              <p>${p.text}</p>
            </div>
          </div>`;
      }).join('');
    }

    function renderMessages(messages) {
      modalTitle.textContent = 'Mensagens de carinho';
      modalBody.innerHTML = messages.map(m => `
        <div class="envelope">
          <div class="env-from">${m.from}</div>
          <div class="env-date">${m.date}</div>
          <p class="env-text">${m.text}</p>
        </div>
      `).join('');
    }

    document.querySelectorAll('[data-modal]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const which = btn.dataset.modal;
        const [history, messages] = await dataPromise;
        if (which === 'history') renderHistory(history.phases || []);
        else renderMessages(messages.messages || []);
        modal.classList.add('open');
      });
    });

    function closeModal() { modal.classList.remove('open'); }
    modal.querySelector('.modal-close').addEventListener('click', closeModal);
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  </script>
</body>
</html>
