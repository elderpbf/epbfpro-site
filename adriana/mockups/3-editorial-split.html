<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Adriana, Editorial Split</title>
  <link rel="icon" href="../media/favicon-adriana.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./shared.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      color: #2a1f1a;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
    }
    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .photo {
      background-image: url('../media/adriana.jpg');
      background-size: cover;
      background-position: center 25%;
    }
    .content {
      background: #f6f1ea;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 48px clamp(28px, 6vw, 64px);
      position: relative;
    }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #a08a78;
      margin: 0 0 18px;
    }
    .name {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: clamp(64px, 7vw, 112px);
      line-height: 0.95;
      margin: 0 0 14px;
      color: #2a1f1a;
      letter-spacing: -0.015em;
    }
    .dates {
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #7d6857;
      margin: 0 0 24px;
    }
    .summary {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: clamp(20px, 2.4vw, 22px);
      max-width: 30ch;
      line-height: 1.5;
      color: #4a3a30;
      margin: 0 0 32px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: flex-start;
    }
    .tlink {
      background: transparent;
      border: 0;
      padding: 4px 0;
      font: 500 16px/1.2 'Inter', sans-serif;
      color: #2a1f1a;
      cursor: pointer;
      border-bottom: 1px solid #2a1f1a;
      text-align: left;
    }
    .tlink .arrow {
      display: inline-block;
      transition: transform 0.18s ease;
      margin-left: 6px;
    }
    .tlink:hover .arrow {
      transform: translateX(4px);
    }
    .footer-mockup {
      position: absolute;
      bottom: 16px;
      left: clamp(28px, 6vw, 64px);
      font-size: 10px;
      color: #a08a78;
      letter-spacing: 0.05em;
    }

    @media (max-width: 720px) {
      .split { grid-template-columns: 1fr; grid-template-rows: 45vh 55vh; }
      .content { padding: 28px 24px; justify-content: center; }
      .name { font-size: clamp(48px, 14vw, 72px); }
      .summary { font-size: 17px; margin-bottom: 22px; }
      .dates { margin-bottom: 18px; }
      .eyebrow { margin-bottom: 12px; }
      .footer-mockup { left: 24px; }
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 12, 8, 0.45);
      z-index: 100;
      display: none;
      justify-content: flex-end;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #fff;
      width: 100%;
      max-width: 640px;
      height: 100%;
      overflow-y: auto;
      padding: 48px clamp(28px, 5vw, 56px);
      transform: translateX(100%);
      animation: slideInRight 0.32s ease forwards;
    }
    @keyframes slideInRight {
      to { transform: translateX(0); }
    }
    @media (max-width: 720px) {
      .modal-backdrop { align-items: flex-end; justify-content: center; }
      .modal {
        max-width: none;
        height: 90vh;
        border-radius: 20px 20px 0 0;
        padding: 32px 24px;
        transform: translateY(100%);
        animation: slideInUp 0.3s ease forwards;
      }
      @keyframes slideInUp { to { transform: translateY(0); } }
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 32px;
    }
    .modal-title {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 32px;
      margin: 0;
      color: #2a1f1a;
      line-height: 1;
    }
    .modal-close {
      background: transparent;
      border: 0;
      font-size: 26px;
      cursor: pointer;
      color: #7a6a62;
      padding: 0;
      line-height: 1;
    }
    .phase {
      margin-bottom: 36px;
      padding-bottom: 36px;
      border-bottom: 1px solid #ecdfcf;
    }
    .phase:last-child { border-bottom: 0; }
    .ph-date {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #a08a78;
    }
    .phase h3 {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 28px;
      margin: 8px 0 12px;
      color: #2a1f1a;
      line-height: 1.1;
    }
    .phase p {
      font-family: 'Fraunces', serif;
      font-size: 17px;
      color: #4a3a30;
      margin: 0 0 16px;
      line-height: 1.55;
      max-width: 50ch;
    }
    .ph-strip {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .ph-strip img {
      width: 80px;
      height: 80px;
      object-fit: cover;
    }
    .msg {
      margin-bottom: 28px;
      padding-bottom: 28px;
      border-bottom: 1px solid #ecdfcf;
    }
    .msg:last-child { border-bottom: 0; }
    .msg-from {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 18px;
      color: #2a1f1a;
    }
    .msg-date {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #a08a78;
      margin: 4px 0 12px;
    }
    .msg-text {
      font-family: 'Fraunces', serif;
      font-size: 16px;
      color: #4a3a30;
      margin: 0;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <div class="split">
    <div class="photo" role="img" aria-label="Foto de Adriana"></div>
    <div class="content">
      <p class="eyebrow">Uma história de recuperação</p>
      <h1 class="name">Adriana</h1>
      <p class="dates">Fevereiro / Abril 2026</p>
      <p class="summary">45 dias na UTI, e a história continua, com força e fé.</p>
      <div class="links">
        <button class="tlink" data-modal="history">Nossa história <span class="arrow">→</span></button>
        <button class="tlink" data-modal="messages">Mensagens de carinho <span class="arrow">→</span></button>
      </div>
      <div class="footer-mockup">Mockup 3 de 5 · Adriana retrospectiva</div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 class="modal-title" id="modal-title">Nossa história</h2>
        <button class="modal-close" aria-label="Fechar">×</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <nav class="mockup-nav" aria-label="Mockup navigation">
    <a href="./2-frosted-hero.html" title="Anterior">←</a>
    <span class="count">3 / 5</span>
    <a href="./4-soft-carousel.html" title="Próximo">→</a>
    <span class="sep">·</span>
    <a href="./index.html">índice</a>
  </nav>

  <script>
    const dataPromise = Promise.all([
      fetch('./history.json').then(r => r.json()).catch(e => { console.warn('history.json falhou', e); return { phases: [] }; }),
      fetch('./messages.json').then(r => r.json()).catch(e => { console.warn('messages.json falhou', e); return { messages: [] }; })
    ]);

    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const modalBody = document.getElementById('modal-body');

    function renderHistory(phases) {
      modalTitle.textContent = 'Nossa história';
      modalBody.innerHTML = phases.map(p => {
        const strip = (p.photos || []).map(ph => `<img src="../media/${ph}" alt="">`).join('');
        return `
          <div class="phase">
            <div class="ph-date">${p.date}</div>
            <h3>${p.title}</h3>
            <p>${p.text}</p>
            ${strip ? `<div class="ph-strip">${strip}</div>` : ''}
          </div>`;
      }).join('');
    }

    function renderMessages(messages) {
      modalTitle.textContent = 'Mensagens de carinho';
      modalBody.innerHTML = messages.map(m => `
        <div class="msg">
          <div class="msg-from">${m.from}</div>
          <div class="msg-date">${m.date}</div>
          <p class="msg-text">${m.text}</p>
        </div>
      `).join('');
    }

    document.querySelectorAll('[data-modal]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const which = btn.dataset.modal;
        const [history, messages] = await dataPromise;
        if (which === 'history') renderHistory(history.phases || []);
        else renderMessages(messages.messages || []);
        modal.classList.add('open');
        // restart animation
        const inner = modal.querySelector('.modal');
        inner.style.animation = 'none';
        inner.offsetHeight;
        inner.style.animation = '';
      });
    });

    function closeModal() { modal.classList.remove('open'); }
    modal.querySelector('.modal-close').addEventListener('click', closeModal);
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  </script>
</body>
</html>
