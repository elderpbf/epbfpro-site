<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Adriana, Frosted Hero</title>
  <link rel="icon" href="../media/favicon-adriana.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./shared.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      color: #fff;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .bg {
      position: fixed;
      inset: 0;
      background-image: url('../media/adriana.jpg');
      background-size: cover;
      background-position: center 30%;
      filter: blur(18px) brightness(0.85);
      transform: scale(1.1);
      z-index: -2;
    }
    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(240, 200, 180, 0.45), rgba(180, 120, 90, 0.55));
    }

    .card {
      backdrop-filter: blur(24px) saturate(1.1);
      -webkit-backdrop-filter: blur(24px) saturate(1.1);
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 28px;
      padding: 48px 36px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }
    .name {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: clamp(56px, 11vw, 96px);
      line-height: 0.95;
      margin: 0;
      color: #fff;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.18);
      letter-spacing: -0.01em;
    }
    .dates {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: 18px;
      margin: 14px 0 18px;
      color: rgba(255, 255, 255, 0.95);
    }
    .summary {
      font-size: 16px;
      max-width: 32ch;
      line-height: 1.6;
      margin: 0 auto 28px;
      color: rgba(255, 255, 255, 0.92);
    }
    .btn-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      background: transparent;
      border: 1.5px solid #fff;
      color: #fff;
      padding: 12px 24px;
      border-radius: 999px;
      font: 500 14px/1 'Inter', sans-serif;
      cursor: pointer;
      transition: background 0.18s ease;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.18); }
    .btn:active { transform: translateY(1px); }

    @media (max-width: 420px) {
      .card { padding: 36px 24px; }
      .btn-row { flex-direction: column; }
      .btn { width: 100%; }
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(40, 25, 15, 0.55);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      transition: opacity 0.24s ease;
    }
    .modal-backdrop.open {
      display: flex;
      opacity: 1;
    }
    .modal {
      background: #fff;
      color: #2a1f1a;
      width: 100%;
      max-width: 720px;
      max-height: 88vh;
      border-radius: 20px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.30);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .modal-banner {
      width: 100%;
      height: 200px;
      background-image: url('../media/adriana.jpg');
      background-size: cover;
      background-position: center 30%;
    }
    .modal-banner.hidden { display: none; }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
      border-bottom: 1px solid #f0e8de;
    }
    .modal-title {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 24px;
      margin: 0;
      color: #2a1f1a;
    }
    .modal-close {
      background: transparent;
      border: 0;
      font-size: 24px;
      cursor: pointer;
      color: #7a6a62;
      padding: 4px 8px;
      line-height: 1;
    }
    .modal-body {
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .phase-card {
      border-left: 2px solid #d6c8b8;
      padding-left: 18px;
    }
    .ph-date {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #a08a78;
    }
    .phase-card h3 {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 20px;
      margin: 6px 0 8px;
      color: #2a1f1a;
    }
    .phase-card p {
      font-size: 15px;
      color: #5a4d47;
      margin: 0;
      line-height: 1.55;
    }
    .phase-photos {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .phase-photos img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 8px;
    }
    .msg-card {
      background: #faf6f0;
      border-radius: 12px;
      padding: 18px 20px;
    }
    .msg-from {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 16px;
      color: #2a1f1a;
    }
    .msg-date {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #a08a78;
      margin: 2px 0 10px;
    }
    .msg-text {
      font-size: 14px;
      color: #5a4d47;
      margin: 0;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <div class="card">
    <h1 class="name">Adriana</h1>
    <p class="dates">Fevereiro a Abril de 2026</p>
    <p class="summary">45 dias na UTI, e a história continua, com força e fé.</p>
    <div class="btn-row">
      <button class="btn" data-modal="history">Nossa história</button>
      <button class="btn" data-modal="messages">Mensagens de carinho</button>
    </div>
  </div>

  <div class="modal-backdrop" id="modal">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-banner" id="modal-banner"></div>
      <div class="modal-head">
        <h2 class="modal-title" id="modal-title">Nossa história</h2>
        <button class="modal-close" aria-label="Fechar">×</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <nav class="mockup-nav" aria-label="Mockup navigation">
    <a href="./1-polaroid.html" title="Anterior">←</a>
    <span class="count">2 / 5</span>
    <a href="./3-editorial-split.html" title="Próximo">→</a>
    <span class="sep">·</span>
    <a href="./index.html">índice</a>
  </nav>

  <div class="mockup-footer-label" style="color: rgba(255,255,255,0.7)">Mockup 2 de 5 · Adriana retrospectiva</div>

  <script>
    const dataPromise = Promise.all([
      fetch('./history.json').then(r => r.json()).catch(e => { console.warn('history.json falhou', e); return { phases: [] }; }),
      fetch('./messages.json').then(r => r.json()).catch(e => { console.warn('messages.json falhou', e); return { messages: [] }; })
    ]);

    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const modalBody = document.getElementById('modal-body');
    const modalBanner = document.getElementById('modal-banner');

    function renderHistory(phases) {
      modalTitle.textContent = 'Nossa história';
      modalBanner.classList.remove('hidden');
      modalBody.innerHTML = phases.map(p => {
        const photos = (p.photos || []).map(ph => `<img src="../media/${ph}" alt="">`).join('');
        return `
          <div class="phase-card">
            <div class="ph-date">${p.date}</div>
            <h3>${p.title}</h3>
            <p>${p.text}</p>
            ${photos ? `<div class="phase-photos">${photos}</div>` : ''}
          </div>`;
      }).join('');
    }

    function renderMessages(messages) {
      modalTitle.textContent = 'Mensagens de carinho';
      modalBanner.classList.add('hidden');
      modalBody.innerHTML = messages.map(m => `
        <div class="msg-card">
          <div class="msg-from">${m.from}</div>
          <div class="msg-date">${m.date}</div>
          <p class="msg-text">${m.text}</p>
        </div>
      `).join('');
    }

    document.querySelectorAll('[data-modal]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const which = btn.dataset.modal;
        const [history, messages] = await dataPromise;
        if (which === 'history') renderHistory(history.phases || []);
        else renderMessages(messages.messages || []);
        modal.classList.add('open');
      });
    });

    function closeModal() { modal.classList.remove('open'); }
    modal.querySelector('.modal-close').addEventListener('click', closeModal);
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  </script>
</body>
</html>
