<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Adriana - Admin</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #faf8f5;
            color: #3d3529;
            line-height: 1.6;
            min-height: 100vh;
        }
        .container { max-width: 600px; margin: 0 auto; padding: 24px 16px 64px; }

        .header {
            text-align: center;
            padding: 24px 0 20px;
            border-bottom: 1px solid #e8e0d4;
            margin-bottom: 28px;
        }
        .header h1 { font-size: 1.1rem; font-weight: 700; color: #5c4a2f; }
        .header p { font-size: 0.8rem; color: #a89880; margin-top: 4px; }

        /* Password gate */
        .pw-gate {
            text-align: center;
            padding: 64px 0;
        }
        .pw-gate p { font-size: 0.9rem; color: #8a7b66; margin-bottom: 16px; }
        .pw-gate input {
            padding: 10px 16px;
            border: 1px solid #e8e0d4;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            width: 220px;
            text-align: center;
            display: block;
            margin: 0 auto 12px;
            background: #fff;
        }
        .pw-gate button {
            padding: 10px 28px;
            background: #5c4a2f;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            cursor: pointer;
        }
        .pw-error { color: #c44; font-size: 0.8rem; margin-top: 10px; }

        /* Admin section */
        .admin-section { display: none; }
        .admin-section.visible { display: block; }

        .section-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #5c4a2f;
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #8a7b66;
            margin-bottom: 5px;
            margin-top: 16px;
        }
        label:first-of-type { margin-top: 0; }

        textarea, input[type="text"], input[type="time"], input[type="date"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e8e0d4;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            background: #fff;
            color: #3d3529;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus, input:focus { border-color: #c4a97d; }
        textarea { min-height: 90px; resize: vertical; }

        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }

        .btn {
            display: inline-block;
            margin-top: 16px;
            padding: 11px 24px;
            background: #5c4a2f;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .btn:hover:not(:disabled) { opacity: 0.85; }
        .btn-outline {
            background: transparent;
            color: #5c4a2f;
            border: 1px solid #ddd2c0;
            margin-left: 8px;
        }

        .feedback { margin-top: 10px; font-size: 0.85rem; padding: 10px 12px; border-radius: 8px; }
        .feedback-ok { background: #e8f5e9; color: #2e7d32; }
        .feedback-err { background: #fce4ec; color: #c62828; }

        .divider {
            border: none;
            border-top: 1px solid #e8e0d4;
            margin: 32px 0;
        }

        /* Recent entries */
        .recent-list { margin-top: 0; }
        .recent-entry {
            background: #fff;
            border: 1px solid #ede7dc;
            border-left: 3px solid #ddd2c0;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #3d3529;
        }
        .recent-meta { color: #a89880; font-size: 0.72rem; margin-bottom: 3px; font-weight: 500; }
        .recent-foto { color: #a89880; font-size: 0.72rem; margin-top: 3px; }

        .logout-btn {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: #fff;
            border: 1px solid #e8e0d4;
            color: #a89880;
            font-size: 0.75rem;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
        }

        /* Photo upload */
        .folder-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            padding: 8px 10px;
            background: #fff;
            border: 1px solid #e8e0d4;
            border-radius: 8px;
            font-size: 0.8rem;
        }
        .folder-bar.granted { border-color: #c8e6c9; background: #f1f8f1; }
        .folder-bar span { flex: 1; color: #8a7b66; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .folder-bar.granted span { color: #4a7c59; }
        .btn-folder {
            padding: 5px 12px;
            background: transparent;
            border: 1px solid #ddd2c0;
            border-radius: 6px;
            font-size: 0.78rem;
            font-family: inherit;
            color: #5c4a2f;
            cursor: pointer;
            white-space: nowrap;
        }

        .drop-zone {
            border: 2px dashed #ddd2c0;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            background: #fff;
            position: relative;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #c4a97d;
            background: #fdf8f2;
        }
        .drop-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }
        .drop-zone-text { font-size: 0.85rem; color: #a89880; pointer-events: none; }
        .drop-zone-text strong { display: block; color: #5c4a2f; font-size: 0.9rem; margin-bottom: 2px; }

        .photo-previews {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .photo-preview {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #e8e0d4;
        }
        .photo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .photo-preview .remove-btn {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(0,0,0,0.55);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .photo-preview .save-status {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 9px;
            padding: 2px;
        }
        .photo-preview .save-status.saving { background: rgba(255,200,0,0.85); color: #5c4a2f; }
        .photo-preview .save-status.saved  { background: rgba(50,150,50,0.8);  color: #fff; }
        .photo-preview .save-status.error  { background: rgba(200,50,50,0.8);  color: #fff; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Admin</h1>
        <p>Atualizações de Adriana</p>
    </div>

    <!-- Password gate -->
    <div id="pw-gate" class="pw-gate">
        <p>Senha de acesso</p>
        <input type="password" id="pw-input" placeholder="••••••••" onkeydown="if(event.key==='Enter') checkPassword()">
        <button onclick="checkPassword()">Entrar</button>
        <div id="pw-error" class="pw-error" style="display:none">Senha incorreta</div>
    </div>

    <!-- Admin form -->
    <div id="admin-section" class="admin-section">

        <!-- New update -->
        <div class="section-title">Nova atualização</div>

        <div class="row">
            <div>
                <label>Data</label>
                <input type="date" id="input-data">
            </div>
            <div>
                <label>Hora</label>
                <input type="time" id="input-hora">
            </div>
        </div>

        <label>Texto</label>
        <textarea id="input-texto" placeholder="O que está acontecendo..."></textarea>

        <label>Fotos</label>

        <!-- Folder access bar -->
        <div class="folder-bar" id="folder-bar">
            <span id="folder-name">Pasta media não selecionada</span>
            <button class="btn-folder" onclick="selectFolder()">Selecionar pasta</button>
        </div>

        <!-- Drop zone -->
        <div class="drop-zone" id="drop-zone">
            <input type="file" id="file-input" accept="image/*,video/*" multiple>
            <div class="drop-zone-text">
                <strong>Arraste fotos aqui</strong>
                ou clique para escolher
            </div>
        </div>
        <div class="photo-previews" id="photo-previews"></div>

        <!-- Manual URL fallback -->
        <input type="text" id="input-foto" placeholder="ou cole caminhos manualmente: media/a.jpg|media/b.jpg" style="margin-top:8px">

        <div style="display:flex; align-items:center; gap:12px; margin-top:16px; flex-wrap:wrap;">
            <button class="btn" style="margin-top:0" id="btn-publish" onclick="publishUpdate()">Publicar</button>
            <button class="btn btn-outline" style="margin-top:0; margin-left:0" onclick="setDefaultDateTime()">Hora atual</button>
            <label style="display:flex; align-items:center; gap:6px; margin:0; text-transform:none; letter-spacing:0; font-size:0.82rem; color:#5c4a2f; cursor:pointer;">
                <input type="checkbox" id="chk-notif" checked style="width:auto; margin:0">
                Notificar seguidores
            </label>
        </div>
        <div id="fb-update" class="feedback" style="display:none"></div>

        <hr class="divider">

        <!-- Resumo -->
        <div class="section-title">Resumo — Como ela está</div>
        <p style="font-size:0.8rem;color:#a89880;margin-bottom:4px;">Só atualize quando houver mudança significativa no quadro geral.</p>

        <label>Texto do resumo</label>
        <textarea id="input-resumo" placeholder="Ex: Estável, infecção sob controle. Rins se recuperando. Na UTI com bom humor."></textarea>

        <button class="btn" id="btn-resumo" onclick="publishResumo()">Atualizar resumo</button>
        <div id="fb-resumo" class="feedback" style="display:none"></div>

        <hr class="divider">

        <!-- Recent -->
        <div class="section-title">Últimas atualizações</div>
        <div class="recent-list" id="recent-list">
            <p style="color:#a89880;font-size:0.85rem">Carregando...</p>
        </div>
    </div>
</div>

<button class="logout-btn" id="logout-btn" onclick="logout()" style="display:none">Sair</button>

<script>
    // ====================================================
    // CONFIG — replace APPS_SCRIPT_URL after deploying
    // ====================================================
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxfTIqI5Pcfez0-8OZs8Ibi68G9NqO2P8xzzDkHKuRofJ7SopJ8-htDcjyEoTC8k79P/exec';
    const ONESIGNAL_APP_ID  = '89faae5a-ef60-4165-aef4-1c274deea3b4';
    const ONESIGNAL_API_KEY = 'os_v2_app_rh5k4wxpmbawllxudqtu33vdwrfsyujepzbetfuicsrhur6tktbl5c2q4xsinwmb4lz75f2bfgswkjp4h755huhfvks3l2lrphkcjai';
    const SPREADSHEET_ID = '14WWz2LsbziG8yXaU9ZzcKGRQXHufZivf7FHsANTRueE';
    const UPDATES_CSV = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=Updates`;
    const RESUMO_CSV  = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=Resumo`;

    // ====================================================
    // AUTH
    // ====================================================
    const ADMIN_PW = 'e4r5t6y7';

    function checkPassword() {
        const pw = document.getElementById('pw-input').value;
        if (!pw) return;
        if (pw !== ADMIN_PW) {
            document.getElementById('pw-error').style.display = 'block';
            document.getElementById('pw-input').value = '';
            return;
        }
        document.getElementById('pw-error').style.display = 'none';
        localStorage.setItem('adriana_admin_pw', pw);
        openAdmin();
    }

    function openAdmin() {
        document.getElementById('pw-gate').style.display = 'none';
        document.getElementById('admin-section').classList.add('visible');
        document.getElementById('logout-btn').style.display = 'block';
        setDefaultDateTime();
        loadRecent();
        loadResumo();
    }

    function logout() {
        localStorage.removeItem('adriana_admin_pw');
        location.reload();
    }

    // Auto-open if correct password saved
    if (localStorage.getItem('adriana_admin_pw') === ADMIN_PW) {
        openAdmin();
    }

    // ====================================================
    // DATE / TIME — Brasilia (UTC-3)
    // ====================================================
    function brNow() {
        const now = new Date();
        return new Date(now.getTime() + (now.getTimezoneOffset() * 60000) - (3 * 3600000));
    }

    function setDefaultDateTime() {
        const br = brNow();
        const y   = br.getFullYear();
        const m   = String(br.getMonth() + 1).padStart(2, '0');
        const d   = String(br.getDate()).padStart(2, '0');
        const h   = String(br.getHours()).padStart(2, '0');
        const min = String(br.getMinutes()).padStart(2, '0');
        document.getElementById('input-data').value = `${y}-${m}-${d}`;
        document.getElementById('input-hora').value = `${h}:${min}`;
    }

    // ====================================================
    // PUBLISH UPDATE
    // ====================================================
    async function publishUpdate() {
        const btn = document.getElementById('btn-publish');
        const fb  = document.getElementById('fb-update');
        const texto = document.getElementById('input-texto').value.trim();
        const foto  = document.getElementById('input-foto').value.trim();

        if (!texto && !foto) {
            showFb(fb, 'Preencha o texto ou adicione uma foto.', false);
            return;
        }

        const [y, m, d] = document.getElementById('input-data').value.split('-');
        const dataBR = `${d}/${m}/${y}`;
        const hora   = document.getElementById('input-hora').value;

        btn.disabled = true;
        btn.textContent = 'Publicando...';
        fb.style.display = 'none';

        try {
            const res = await postToScript({
                action: 'append_update',
                password: localStorage.getItem('adriana_admin_pw'),
                data: dataBR,
                hora,
                texto,
                foto
            });
            if (res.ok) {
                if (document.getElementById('chk-notif').checked && texto) {
                    await sendPushNotification(texto);
                }
                showFb(fb, 'Publicado!', true);
                document.getElementById('input-texto').value = '';
                clearPhotoState();
                setDefaultDateTime();
                loadRecent();
            } else {
                handleError(fb, res.error);
            }
        } catch (e) {
            showFb(fb, 'Erro de conexão. Tente novamente.', false);
        }

        btn.disabled = false;
        btn.textContent = 'Publicar';
    }

    // ====================================================
    // UPDATE RESUMO
    // ====================================================
    async function publishResumo() {
        const btn  = document.getElementById('btn-resumo');
        const fb   = document.getElementById('fb-resumo');
        const texto = document.getElementById('input-resumo').value.trim();

        if (!texto) {
            showFb(fb, 'Preencha o resumo.', false);
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Salvando...';
        fb.style.display = 'none';

        const br = brNow();
        const d  = String(br.getDate()).padStart(2, '0');
        const m  = String(br.getMonth() + 1).padStart(2, '0');
        const y  = br.getFullYear();

        try {
            const res = await postToScript({
                action: 'update_resumo',
                password: localStorage.getItem('adriana_admin_pw'),
                data: `${d}/${m}/${y}`,
                texto
            });
            if (res.ok) {
                showFb(fb, 'Resumo atualizado!', true);
            } else {
                handleError(fb, res.error);
            }
        } catch (e) {
            showFb(fb, 'Erro de conexão. Tente novamente.', false);
        }

        btn.disabled = false;
        btn.textContent = 'Atualizar resumo';
    }

    // ====================================================
    // ONESIGNAL PUSH
    // ====================================================
    async function sendPushNotification(texto) {
        try {
            await fetch('https://onesignal.com/api/v1/notifications', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Basic ' + ONESIGNAL_API_KEY
                },
                body: JSON.stringify({
                    app_id: ONESIGNAL_APP_ID,
                    included_segments: ['Total Subscriptions'],
                    headings: { pt: 'Notícias de Adriana', en: 'Notícias de Adriana' },
                    contents: { pt: texto, en: texto },
                    url: 'https://epbf.com.br/adriana'
                })
            });
        } catch (e) {
            console.error('Notificação não enviada:', e);
        }
    }

    // ====================================================
    // APPS SCRIPT
    // ====================================================
    async function postToScript(payload) {
        const resp = await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        });
        return resp.json();
    }

    function handleError(fb, error) {
        if (error === 'Senha incorreta') {
            localStorage.removeItem('adriana_admin_pw');
            showFb(fb, 'Senha incorreta. Recarregue a página.', false);
        } else {
            showFb(fb, error || 'Erro desconhecido.', false);
        }
    }

    // ====================================================
    // LOAD RECENT UPDATES
    // ====================================================
    function parseCSVLine(line) {
        const result = [];
        let cur = '', inQ = false;
        for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (inQ) {
                if (ch === '"') {
                    if (line[i+1] === '"') { cur += '"'; i++; }
                    else { inQ = false; }
                } else { cur += ch; }
            } else {
                if (ch === '"') { inQ = true; }
                else if (ch === ',') { result.push(cur.trim()); cur = ''; }
                else { cur += ch; }
            }
        }
        result.push(cur.trim());
        return result;
    }

    async function loadRecent() {
        try {
            const resp = await fetch(UPDATES_CSV + '&t=' + Date.now());
            const text = await resp.text();
            const lines = text.trim().split('\n');
            const entries = [];
            for (let i = 1; i < lines.length; i++) {
                const r = parseCSVLine(lines[i]);
                if (r[0]) entries.push(r);
            }
            const recent = entries.slice(-5).reverse();
            const el = document.getElementById('recent-list');
            if (recent.length === 0) {
                el.innerHTML = '<p style="color:#a89880;font-size:0.85rem">Nenhuma atualização ainda.</p>';
                return;
            }
            el.innerHTML = recent.map(r => `
                <div class="recent-entry">
                    <div class="recent-meta">${escHtml(r[0])} ${escHtml(r[1] || '')}</div>
                    <div>${r[2] ? escHtml(r[2]) : '<em style="color:#a89880">sem texto</em>'}</div>
                    ${r[3] ? `<div class="recent-foto">${escHtml(r[3])}</div>` : ''}
                </div>
            `).join('');
        } catch (e) {
            document.getElementById('recent-list').innerHTML = '<p style="color:#c44;font-size:0.85rem">Erro ao carregar.</p>';
        }
    }

    async function loadResumo() {
        try {
            const resp = await fetch(RESUMO_CSV + '&t=' + Date.now());
            const text = await resp.text();
            const lines = text.trim().split('\n');
            if (lines.length > 1) {
                const r = parseCSVLine(lines[1]);
                if (r[1]) document.getElementById('input-resumo').value = r[1];
            }
        } catch (e) {}
    }

    // ====================================================
    // HELPERS
    // ====================================================
    function showFb(el, text, ok) {
        el.textContent = text;
        el.className = ok ? 'feedback feedback-ok' : 'feedback feedback-err';
        el.style.display = 'block';
    }

    function escHtml(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ====================================================
    // FILE SYSTEM ACCESS — save to media/ folder
    // ====================================================
    let mediaFolderHandle = null;
    let pendingFiles = []; // { file, filename, saved }

    // Restore folder handle from IndexedDB
    (async function restoreFolder() {
        try {
            const handle = await idbGet('mediaFolderHandle');
            if (handle) {
                const perm = await handle.queryPermission({ mode: 'readwrite' });
                if (perm === 'granted') {
                    mediaFolderHandle = handle;
                    updateFolderBar(handle.name);
                }
                // If prompt, we'll re-request on next use
            }
        } catch (e) {}
    })();

    async function selectFolder() {
        if (!window.showDirectoryPicker) {
            alert('Seu navegador não suporta acesso a pastas. Use Chrome ou Edge.');
            return;
        }
        try {
            const handle = await window.showDirectoryPicker({ mode: 'readwrite', startIn: 'documents' });
            mediaFolderHandle = handle;
            await idbSet('mediaFolderHandle', handle);
            updateFolderBar(handle.name);
            // Re-save any pending unsaved files
            for (const item of pendingFiles) {
                if (!item.saved) await saveFileToFolder(item);
            }
        } catch (e) {
            if (e.name !== 'AbortError') console.error(e);
        }
    }

    function updateFolderBar(name) {
        const bar = document.getElementById('folder-bar');
        bar.className = 'folder-bar granted';
        document.getElementById('folder-name').textContent = 'Pasta: ' + name;
    }

    async function saveFileToFolder(item) {
        const statusEl = item.statusEl;
        if (!mediaFolderHandle) {
            statusEl.textContent = 'sem pasta';
            statusEl.className = 'save-status error';
            return;
        }
        try {
            const perm = await mediaFolderHandle.requestPermission({ mode: 'readwrite' });
            if (perm !== 'granted') {
                statusEl.textContent = 'sem acesso';
                statusEl.className = 'save-status error';
                return;
            }
            statusEl.textContent = 'salvando';
            statusEl.className = 'save-status saving';
            const fileHandle = await mediaFolderHandle.getFileHandle(item.filename, { create: true });
            const writable = await fileHandle.createWritable();
            await writable.write(item.file);
            await writable.close();
            item.saved = true;
            statusEl.textContent = 'salvo';
            statusEl.className = 'save-status saved';
        } catch (e) {
            console.error(e);
            statusEl.textContent = 'erro';
            statusEl.className = 'save-status error';
        }
    }

    function addFiles(files) {
        for (const file of files) {
            if (!file.type.startsWith('image/') && !file.type.startsWith('video/')) continue;

            // Build filename: keep original name, sanitize spaces
            const filename = file.name.replace(/\s+/g, '_');
            const url = 'media/' + filename;

            // Add to pending
            const item = { file, filename, saved: false, statusEl: null };
            pendingFiles.push(item);

            // Build preview
            const preview = document.createElement('div');
            preview.className = 'photo-preview';

            const img = document.createElement('img');
            img.src = URL.createObjectURL(file);
            img.alt = filename;
            preview.appendChild(img);

            const removeBtn = document.createElement('button');
            removeBtn.className = 'remove-btn';
            removeBtn.textContent = '×';
            removeBtn.onclick = () => {
                pendingFiles = pendingFiles.filter(i => i !== item);
                preview.remove();
                syncFotoField();
            };
            preview.appendChild(removeBtn);

            const statusEl = document.createElement('div');
            statusEl.className = 'save-status saving';
            statusEl.textContent = 'aguardando';
            preview.appendChild(statusEl);
            item.statusEl = statusEl;

            document.getElementById('photo-previews').appendChild(preview);

            // Save to folder
            saveFileToFolder(item);

            // Append to foto field
            syncFotoField();
        }
    }

    function syncFotoField() {
        const urls = pendingFiles.map(i => 'media/' + i.filename);
        document.getElementById('input-foto').value = urls.join('|');
    }

    // Drop zone events
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');

    dropZone.addEventListener('dragover', e => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        addFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', () => {
        addFiles(fileInput.files);
        fileInput.value = ''; // reset so same file can be re-added
    });

    // Clear pending files after successful publish
    function clearPhotoState() {
        pendingFiles = [];
        document.getElementById('photo-previews').innerHTML = '';
        document.getElementById('input-foto').value = '';
    }

    // ====================================================
    // INDEXEDDB — persist folder handle across sessions
    // ====================================================
    function idbOpen() {
        return new Promise((res, rej) => {
            const req = indexedDB.open('adriana-admin', 1);
            req.onupgradeneeded = e => e.target.result.createObjectStore('kv');
            req.onsuccess  = e => res(e.target.result);
            req.onerror    = e => rej(e.target.error);
        });
    }
    async function idbGet(key) {
        const db = await idbOpen();
        return new Promise((res, rej) => {
            const req = db.transaction('kv').objectStore('kv').get(key);
            req.onsuccess = e => res(e.target.result);
            req.onerror   = e => rej(e.target.error);
        });
    }
    async function idbSet(key, val) {
        const db = await idbOpen();
        return new Promise((res, rej) => {
            const req = db.transaction('kv', 'readwrite').objectStore('kv').put(val, key);
            req.onsuccess = () => res();
            req.onerror   = e => rej(e.target.error);
        });
    }
</script>
</body>
</html>
