<!DOCTYPE html>
<html lang="pt-BR" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Entrar na turma · PensoIA</title>

<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2">
<!-- PWA: "Salvar como app" (Trilha, Codex-owned manifest). The single apple-touch-icon is
     the purpose-built Trilha app icon below (matches the manifest); the site-wide one was a
     conflicting duplicate at the same 180x180 size (track-36 i). -->
<link rel="manifest" href="/codex/trilha/manifest.webmanifest?v=1">
<meta name="theme-color" content="#14b8a6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trilha">
<link rel="apple-touch-icon" sizes="180x180" href="/codex/trilha/icons/app-icon-180.png">

<!-- Shared tokens + public chrome (Codex, no backstage). -->
<link rel="stylesheet" href="/codex/css/theme.css?v=1.5">
<link rel="stylesheet" href="/codex/css/tokens.css?v=1.8">
<link rel="stylesheet" href="/codex/css/components.css?v=1">
<link rel="stylesheet" href="/codex/trilha/css/public-header.css?v=1.2">
<link rel="stylesheet" href="/codex/trilha/css/entrar.css?v=1.5">
<link rel="stylesheet" href="/css/support-entry.css?v=1">

<script src="/codex/js/debug.js?v=2.5"></script>
<script src="/codex/js/theme-manager.js?v=1.0"></script>
<script>
  ThemeManager.initPublic({ storageKey: 'trilha_theme', defaultTheme: 'light' });
</script>
</head>
<body>

<pensoia-header mode="student" theme-storage-key="trilha_theme"></pensoia-header>

<div class="cdx-entrar" id="cdx-entrar">
  <div class="cdx-entrar-head">
    <span class="cdx-entrar-eyebrow" data-i18n="entrar.eyebrow">Área do Aluno</span>
    <h1 class="cdx-entrar-title" data-i18n="entrar.title">Acesse sua trilha</h1>
  </div>

  <div class="cdx-entrar-state" id="cdx-entrar-state" aria-live="polite"></div>

  <div class="cdx-entrar-paths" id="cdx-entrar-paths">
    <div class="cdx-entrar-card cdx-entrar-card-code" id="cdx-entrar-card-code">
      <div class="cdx-entrar-ic cdx-entrar-ic-code" aria-hidden="true">#</div>
      <h2 class="cdx-entrar-card-h" data-i18n="entrar.code_h">Tenho um código</h2>
      <p class="cdx-entrar-card-p" data-i18n="entrar.code_sub">Os 4 dígitos que aparecem na tela da aula ao vivo.</p>
      <form class="cdx-entrar-form" id="cdx-entrar-form">
        <div class="cdx-entrar-error" id="cdx-entrar-error" aria-live="polite"></div>
        <input class="cdx-entrar-input" id="cdx-entrar-input" type="text" inputmode="numeric"
               maxlength="4" autocomplete="off" placeholder="0000"
               data-i18n-attr="placeholder:entrar.code_ph,aria-label:entrar.code_label">
        <button class="cdx-entrar-btn cdx-btn cdx-btn-primary" type="submit" id="cdx-entrar-btn" data-i18n="entrar.submit">Entrar</button>
      </form>
    </div>

    <div class="cdx-entrar-card cdx-entrar-card-mail" id="cdx-entrar-card-mail">
      <div class="cdx-entrar-ic cdx-entrar-ic-mail" aria-hidden="true">@</div>
      <div class="cdx-entrar-email" id="cdx-entrar-email"></div>
    </div>
  </div>

  <p class="cdx-entrar-note" data-i18n="entrar.note">Sem código? Peça o link da trilha ao professor.</p>
  <div id="cdx-entrar-support"></div>
</div>

<script type="module">
  import '/codex/js/worker-call.js';
  import '/codex/trilha/js/pensoia-header.js'; // defines <pensoia-header> (cdx, correct light/dark logo)
  import { start } from '/codex/trilha/js/entrar.js';

  // First-party API (track-36 b): api.pensoia.com is the same worker as codex-api.workers.dev
  // (kept alive for the extractor), reached first-party so the login cookie is same-site.
  window.WORKER_URL = 'https://api.pensoia.com';
  start();
</script>
</body>
</html>
