<!DOCTYPE html>
<html lang="pt-BR" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>PensoIA</title>

<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">

<link rel="stylesheet" href="/backstage/css/theme.css?v=1.2">
<link rel="stylesheet" href="/backstage/css/shared-components.css?v=1.5">
<link rel="stylesheet" href="/backstage/css/public-header.css?v=1.8">
<link rel="stylesheet" href="/backstage/css/ct-renderer.css?v=1.1">
<link rel="stylesheet" href="/backstage/css/question-types.css?v=1.8">
<link rel="stylesheet" href="/trilha/css/trilha.css?v=4.0">

<script src="/backstage/js/debug.js?v=2.5"></script>
<script src="/backstage/js/theme-manager.js?v=1.2"></script>
<script>
  // Apply saved theme before paint so there's no flash.
  ThemeManager.initPublic({ storageKey: 'trilha_theme', defaultTheme: 'light' });
</script>
</head>
<body>

<pensoia-header mode="student" theme-storage-key="trilha_theme"></pensoia-header>

<div class="tr-page">

  <div id="tr-loading">
    <div class="tr-spinner"></div>
    Carregando sua trilha...
  </div>

  <div id="tr-error" hidden>
    <div class="tr-error-icon">&#128274;</div>
    <p class="tr-error-msg"></p>
  </div>

  <main id="tr-main" hidden>

    <!-- HERO -->
    <section class="tr-hero">
      <div class="tr-hero-identity">
        <div class="tr-client-avatar" id="tr-client-avatar">
          <img id="tr-client-icon" src="" alt="" hidden>
        </div>
        <div class="tr-hero-text">
          <span class="tr-hero-eyebrow">Sua trilha de aprendizado</span>
          <h1 class="tr-client-name" id="tr-client-name"></h1>
          <p class="tr-turma-name" id="tr-turma-name"></p>
        </div>
      </div>
    </section>

    <!-- TAB NAV (split: Aulas + Outros on left, Apostila on right) -->
    <nav class="tr-tabs" role="tablist" id="tr-tabs">
      <div class="tr-tabs-left">
        <button class="tr-tab-btn active" role="tab" data-tab="aulas" aria-selected="true">Aulas</button>
        <button class="tr-tab-btn" role="tab" data-tab="outros" aria-selected="false" id="tr-tab-outros">Outros materiais</button>
      </div>
      <div class="tr-tabs-right">
        <button class="tr-tab-btn" role="tab" data-tab="apostila" aria-selected="false" id="tr-tab-apostila">Conteúdo do curso</button>
      </div>
    </nav>

    <div class="tr-tab-content">

      <!-- AULAS TAB -->
      <div class="tr-panel" id="tr-panel-aulas">
        <button id="tr-back-pill" class="tr-back-pill" type="button">&lsaquo; Voltar à trilha</button>
        <div id="tr-aulas-timeline" class="tl"></div>
      </div>

      <!-- APOSTILA TAB -->
      <div class="tr-panel" id="tr-panel-apostila" hidden>
        <div id="tr-apostila-list" class="card-list"></div>
      </div>

      <!-- OUTROS MATERIAIS TAB -->
      <div class="tr-panel" id="tr-panel-outros" hidden>
        <div id="tr-outros-filter" class="tr-type-filter"></div>
        <div id="tr-outros-list" class="card-list"></div>
      </div>

    </div>

    <footer class="tr-footer">
      Feito com PensoIA &middot; <a href="https://pensoia.com" target="_blank" rel="noopener">pensoia.com</a>
    </footer>
  </main>

</div>

<script src="/backstage/js/api-client.js?v=1.2"></script>
<script src="/backstage/js/pensoia-header.js?v=1.3"></script>
<script src="/backstage/js/ct-renderer.js?v=1.2"></script>
<script src="/backstage/js/ct-type-filter.js?v=1.0"></script>
<script src="/backstage/js/ct-tarefa-fields.js?v=1.0"></script>
<script src="/backstage/js/ct-tarefa-submit-modal.js?v=1.0"></script>
<script src="/backstage/js/utils.js?v=1.4"></script>
<script src="/backstage/js/question-renderer.js?v=2.5"></script>
<script src="/backstage/js/classpulse-question.min.js?v=1.8"></script>
<script src="/backstage/js/nexo-answer.js?v=1.1"></script>
<script src="/trilha/js/trilha.js?v=3.8"></script>
<script src="/trilha/js/trilha-nexo.js?v=2.0"></script>

</body>
</html>
