<!DOCTYPE html>
<html lang="pt-BR" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>PensoIA</title>

<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2">
<!-- PWA: "Salvar como app" (Trilha, Codex-owned manifest). The single apple-touch-icon is
     the purpose-built Trilha app icon below (matches the manifest); the site-wide one was a
     conflicting duplicate at the same 180x180 size (track-36 i). -->
<link rel="manifest" href="/codex/trilha/manifest.webmanifest?v=1">
<meta name="theme-color" content="#14b8a6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trilha">
<link rel="apple-touch-icon" sizes="180x180" href="/codex/trilha/icons/app-icon-180.png">

<!-- Shared tokens + public chrome (Codex owns its component CSS below). -->
<link rel="stylesheet" href="/codex/css/theme.css?v=1.4">
<link rel="stylesheet" href="/codex/css/tokens.css?v=1.8">
<link rel="stylesheet" href="/codex/css/components.css?v=1.3">
<link rel="stylesheet" href="/codex/trilha/css/public-header.css?v=1.2">
<link rel="stylesheet" href="/codex/css/item-render.css?v=1.1">
<link rel="stylesheet" href="/codex/questions/questions.css?v=4.9">
<link rel="stylesheet" href="/codex/trilha/css/trilha.css?v=1.8">
<link rel="stylesheet" href="/codex/trilha/css/cards.css?v=1.9">
<link rel="stylesheet" href="/codex/trilha/css/forum.css?v=1.2">
<link rel="stylesheet" href="/codex/trilha/css/wall.css?v=1.3">
<link rel="stylesheet" href="/codex/css/notif-bell.css?v=1.4">
<link rel="stylesheet" href="/codex/trilha/css/nexo.css?v=1.3">
<link rel="stylesheet" href="/codex/trilha/css/tarefa-modal.css?v=1.5">
<link rel="stylesheet" href="/codex/trilha/css/tarefas.css?v=1.6">
<link rel="stylesheet" href="/codex/trilha/css/mobile.css?v=1.3">
<link rel="stylesheet" href="/css/support-entry.css?v=1">

<script src="/codex/js/debug.js?v=2.5"></script>
<script src="/codex/js/theme-manager.js?v=1.0"></script>
<script>
  // Pre-paint theme (shared public chrome boot, not app logic; same key as legacy trilha).
  ThemeManager.initPublic({ storageKey: 'trilha_theme', defaultTheme: 'light' });
</script>
</head>
<body>

<pensoia-header mode="student" theme-storage-key="trilha_theme"></pensoia-header>

<div class="cdx-trilha-page" id="cdx-trilha-root">

  <div class="cdx-trilha-loading" data-i18n="page.loading">Carregando sua trilha...</div>

  <div class="cdx-trilha-error" hidden>
    <div class="cdx-trilha-error-icon">&#128274;</div>
    <p class="cdx-trilha-error-msg"></p>
    <div id="cdx-tr-error-support"></div>
  </div>

  <main class="cdx-trilha-main" hidden>

    <!-- HERO -->
    <section class="cdx-trilha-hero">
      <div class="cdx-trilha-hero-identity">
        <div class="cdx-tr-client-avatar" id="cdx-tr-client-avatar">
          <img id="cdx-tr-client-icon" src="" alt="" hidden>
        </div>
        <div class="cdx-tr-hero-text">
          <span class="cdx-tr-hero-eyebrow" data-i18n="page.hero_eyebrow">Sua trilha de aprendizado</span>
          <h1 class="cdx-tr-client-name" id="cdx-tr-client-name"></h1>
          <p class="cdx-tr-turma-name" id="cdx-tr-turma-name"></p>
        </div>
      </div>
    </section>

    <!-- TAB NAV (split: Aulas + Outros left, Apostila right). Each button carries an inline SVG
         icon (shown only on the mobile bottom bar, hidden on the desktop top-tab strip) plus a
         label span; the icons are ported verbatim from the trilha-tabs mock (b2.html). -->
    <nav class="cdx-trilha-tabs" role="tablist">
      <div class="cdx-trilha-tabs-left">
        <button class="cdx-tr-tab-btn active" role="tab" data-tab="aulas" aria-selected="true">
          <svg class="cdx-tr-tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="cdx-tr-tab-txt" data-i18n="page.tab_aulas">Aulas</span></button>
        <button class="cdx-tr-tab-btn" role="tab" data-tab="tarefas" aria-selected="false" id="cdx-tr-tab-tarefas" hidden>
          <svg class="cdx-tr-tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span class="cdx-tr-tab-txt" data-i18n="page.tab_tarefas">Tarefas</span></button>
        <button class="cdx-tr-tab-btn" role="tab" data-tab="forum" aria-selected="false" id="cdx-tr-tab-forum" hidden>
          <svg class="cdx-tr-tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="cdx-tr-tab-txt" data-i18n="page.tab_forum">Fórum</span></button>
        <button class="cdx-tr-tab-btn" role="tab" data-tab="outros" aria-selected="false" id="cdx-tr-tab-outros" hidden>
          <svg class="cdx-tr-tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><span class="cdx-tr-tab-txt">Outros materiais</span></button>
      </div>
      <div class="cdx-trilha-tabs-right">
        <button class="cdx-tr-tab-btn" role="tab" data-tab="apps" aria-selected="false" id="cdx-tr-tab-apps" hidden>
          <svg class="cdx-tr-tab-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg><span class="cdx-tr-tab-txt">Aplicativos</span></button>
        <button class="cdx-tr-tab-btn" role="tab" data-tab="apostila" aria-selected="false" id="cdx-tr-tab-apostila" hidden>
          <svg class="cdx-tr-tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span class="cdx-tr-tab-txt" data-i18n="page.tab_apostila">Apostila do curso</span></button>
      </div>
    </nav>

    <div class="cdx-trilha-tabcontent">

      <!-- AULAS -->
      <div class="cdx-trilha-panel" data-panel="aulas">
        <button id="cdx-tr-back-pill" class="cdx-tr-back-pill" type="button">&lsaquo; Voltar à trilha</button>
        <div id="cdx-tr-aulas-timeline" class="cdx-tr-timeline"></div>
      </div>

      <!-- TAREFAS -->
      <div class="cdx-trilha-panel" data-panel="tarefas" hidden>
        <div id="cdx-tr-tarefas-root"></div>
      </div>

      <!-- FÓRUM -->
      <div class="cdx-trilha-panel" data-panel="forum" hidden>
        <div id="cdx-tr-forum-root"></div>
      </div>

      <!-- APOSTILA -->
      <div class="cdx-trilha-panel" data-panel="apostila" hidden>
        <div id="cdx-tr-apostila-list" class="cdx-tr-card-list"></div>
      </div>

      <!-- OUTROS -->
      <div class="cdx-trilha-panel" data-panel="outros" hidden>
        <div id="cdx-tr-outros-filter" class="cdx-tr-type-filter"></div>
        <div id="cdx-tr-outros-list" class="cdx-tr-card-list"></div>
      </div>

      <!-- APLICATIVOS -->
      <div class="cdx-trilha-panel" data-panel="apps" hidden>
        <div id="cdx-tr-apps-list" class="cdx-tr-card-list"></div>
      </div>

    </div>

    <div id="cdx-tr-support-footer" class="cdx-tr-support"></div>
    <footer class="cdx-trilha-footer">
      <span data-i18n="page.footer">Feito com PensoIA</span> &middot; <a href="https://pensoia.com" target="_blank" rel="noopener">pensoia.com</a>
    </footer>
  </main>

</div>

<!-- Codex is ES modules: one boot owns glyphs, points the backend at codex-api,
     registers the tab renderers, and mounts. -->
<script type="module">
  import '/codex/js/worker-call.js'; // Codex-owned Worker transport -> window.callWorker (codex-api default)
  import '/codex/trilha/js/pensoia-header.js'; // defines the <pensoia-header> custom element
  import * as glyphs from '/codex/js/glyphs.js';
  import { mount } from '/codex/trilha/js/page.js';
  import '/codex/trilha/js/aulas.js'; // self-registers the 'aulas' panel renderer
  import '/codex/trilha/js/tarefas.js'; // self-registers the 'tarefas' panel renderer
  import '/codex/trilha/js/forum.js'; // self-registers the 'forum' panel renderer
  import '/codex/trilha/js/flat.js';  // self-registers the 'apostila' + 'outros' renderers
  import '/codex/trilha/js/apps.js';  // self-registers the 'apps' panel renderer
  import '/codex/trilha/js/nexo.js';  // self-starts the live-question poller
  window.CdxGlyphs = glyphs;
  // Stage 2: Trail's backend is the codex-api Worker. worker-call.js already
  // defaults here; this stays as the explicit page-level override. Reversible.
  // First-party API (track-36 b): the student face talks to api.pensoia.com (same worker as
  // codex-api.workers.dev, kept alive for the extractor) so the login session cookie is
  // first-party same-site and the iPhone stops dropping it.
  window.WORKER_URL = 'https://api.pensoia.com';
  mount(document.getElementById('cdx-trilha-root'), {});
</script>
</body>
</html>
