<!DOCTYPE html>
<html lang="pt-BR" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>PensoIA</title>

<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/backstage/css/theme.css?v=1.2">
<link rel="stylesheet" href="/backstage/css/shared-components.css?v=1.5">
<link rel="stylesheet" href="/backstage/css/public-header.css?v=1.6">
<link rel="stylesheet" href="/trilha/css/trilha.css?v=1.4">

<script src="/backstage/js/debug.js?v=2.5"></script>
<script src="/backstage/js/theme-manager.js?v=1.1"></script>
<script>
  // Apply saved theme before paint so there's no flash.
  ThemeManager.initPublic({ storageKey: 'trilha_theme', defaultTheme: 'light' });
</script>
</head>
<body>

<pensoia-header mode="student" theme-storage-key="trilha_theme"></pensoia-header>

<div class="tr-page">

  <div id="tr-loading">
    <div class="tr-spinner"></div>
    Carregando sua trilha...
  </div>

  <div id="tr-error" hidden>
    <div class="tr-error-icon">&#128274;</div>
    <p class="tr-error-msg"></p>
  </div>

  <main id="tr-main" hidden>
    <section class="tr-hero">
      <span class="tr-hero-eyebrow" id="tr-hero-eyebrow"></span>
      <h1 class="tr-turma-title" id="tr-turma-title"></h1>
      <p class="tr-hero-sub" id="tr-hero-sub">Conteúdo selecionado pelo seu professor para esta turma.</p>
    </section>

    <div class="tr-section-header">
      <span class="tr-section-label">Conteúdo disponível</span>
      <span class="tr-section-count" id="tr-section-count"></span>
    </div>
    <div id="tr-items-list"></div>

    <footer class="tr-footer">
      Feito com PensoIA &middot; <a href="https://pensoia.com" target="_blank" rel="noopener">pensoia.com</a>
    </footer>
  </main>

</div>

<script src="/backstage/js/api-client.js?v=1.1"></script>
<script src="/backstage/js/pensoia-header.js?v=1.0"></script>
<script src="/backstage/js/ct-renderer.js?v=1.1"></script>
<script src="/trilha/js/trilha.js?v=1.4"></script>

</body>
</html>
