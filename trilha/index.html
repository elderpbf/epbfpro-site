<!DOCTYPE html>
<html lang="pt-BR" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>PensoIA</title>

<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/backstage/css/theme.css?v=1.2">
<link rel="stylesheet" href="/backstage/css/shared-components.css?v=1.5">
<link rel="stylesheet" href="/backstage/css/ct-renderer.css?v=1.0">
<link rel="stylesheet" href="/trilha/css/trilha.css?v=2.0">

<script src="/backstage/js/debug.js?v=2.5"></script>
<script src="/backstage/js/theme-manager.js?v=1.2"></script>
<script>
  // Apply saved theme before paint so there's no flash.
  ThemeManager.initPublic({ storageKey: 'trilha_theme', defaultTheme: 'light' });
</script>
</head>
<body>

<!-- Light/dark toggle, top-right corner. No topbar on student page (RULES). -->
<button class="tr-theme-toggle" id="tr-theme-toggle" aria-label="Alternar tema claro/escuro" title="Alternar tema">
  <span class="tr-theme-toggle-icon" id="tr-theme-icon">☀</span>
</button>

<div class="tr-page">

  <div id="tr-loading">
    <div class="tr-spinner"></div>
    Carregando sua trilha...
  </div>

  <div id="tr-error" hidden>
    <div class="tr-error-icon">&#128274;</div>
    <p class="tr-error-msg"></p>
  </div>

  <main id="tr-main" hidden>

    <!-- HERO -->
    <section class="tr-hero">
      <div class="tr-hero-identity">
        <div class="tr-client-avatar" id="tr-client-avatar" hidden>
          <img id="tr-client-icon" src="" alt="">
        </div>
        <div class="tr-hero-text">
          <h1 class="tr-client-name" id="tr-client-name"></h1>
          <p class="tr-turma-name" id="tr-turma-name"></p>
        </div>
      </div>
    </section>

    <!-- ACTION BAND -->
    <div class="tr-action-band" id="tr-action-band">
      <a class="tr-action-btn" id="tr-btn-whatsapp" href="#" target="_blank" rel="noopener" hidden>
        <svg class="tr-action-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        Grupo no WhatsApp
      </a>
      <a class="tr-action-btn" id="tr-btn-classpulse" href="#" target="_blank" rel="noopener" hidden>
        <svg class="tr-action-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Perguntas ao vivo
      </a>
    </div>

    <!-- THREE-TAB NAV -->
    <nav class="tr-tabs" role="tablist" id="tr-tabs">
      <button class="tr-tab-btn active" role="tab" data-tab="aulas" aria-selected="true">Aulas</button>
      <button class="tr-tab-btn" role="tab" data-tab="apostila" aria-selected="false">Apostila do curso</button>
      <button class="tr-tab-btn" role="tab" data-tab="outros" aria-selected="false" id="tr-tab-outros">Outros materiais</button>
    </nav>

    <!-- TAB PANELS -->
    <div class="tr-tab-content">

      <!-- AULAS TAB -->
      <div class="tr-panel" id="tr-panel-aulas">
        <div id="tr-aulas-list"></div>
      </div>

      <!-- APOSTILA TAB -->
      <div class="tr-panel" id="tr-panel-apostila" hidden>
        <p class="tr-apostila-caption">Material compilado de todas as aulas já realizadas.</p>
        <div id="tr-apostila-content"></div>
      </div>

      <!-- OUTROS MATERIAIS TAB -->
      <div class="tr-panel" id="tr-panel-outros" hidden>
        <div id="tr-outros-filter"></div>
        <div id="tr-outros-list"></div>
      </div>

      <!-- LESSON VIEW (overlay on Aulas tab) -->
      <div class="tr-panel" id="tr-panel-lesson" hidden>
        <div class="tr-lesson-header">
          <a class="tr-back-link" href="#aulas">&#8592; Voltar para Aulas</a>
          <h2 class="tr-lesson-title" id="tr-lesson-title"></h2>
          <p class="tr-lesson-date" id="tr-lesson-date"></p>
        </div>
        <div id="tr-apostila-desta-aula" hidden>
          <div class="tr-lesson-block-header">Apostila desta aula</div>
          <div id="tr-apostila-desta-aula-items"></div>
        </div>
        <div id="tr-lesson-items"></div>
      </div>

    </div>

    <footer class="tr-footer">
      Feito com PensoIA &middot; <a href="https://pensoia.com" target="_blank" rel="noopener">pensoia.com</a>
    </footer>
  </main>

</div>

<script src="/backstage/js/api-client.js?v=1.1"></script>
<script src="/backstage/js/ct-renderer.js?v=1.1"></script>
<script src="/backstage/js/ct-type-filter.js?v=1.0"></script>
<script src="/trilha/js/trilha.js?v=2.0"></script>

</body>
</html>
