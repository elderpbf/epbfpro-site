<!DOCTYPE html>
<html lang="pt-BR" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Host - ClassPulse</title>

<link rel="icon" type="image/x-icon" href="../../favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32x32.png">

<link rel="stylesheet" href="../css/theme.css?v=1.1">
<link rel="stylesheet" href="../css/backstage.css?v=1.3">
<link rel="stylesheet" href="../css/classpulse.css?v=1.6">
<link rel="stylesheet" href="../css/shared-components.css?v=1.2">
<link rel="stylesheet" href="../css/question-types.css?v=1.1">
<script src="../js/debug.js?v=2.4"></script>
<style>
  /* Host-specific styles */
  .host-container { max-width: 720px; margin: 0 auto; padding: 2rem 1.5rem 4rem; width: 100%; box-sizing: border-box; }

  .host-session-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    background: var(--surface); border: 1px solid rgba(20,184,166,.2);
    border-radius: 12px; padding: 1rem 1.3rem; margin-bottom: 1.5rem; flex-wrap: wrap;
  }
  .host-code { font-size: 1.6rem; font-weight: 700; letter-spacing: 0.2em; color: var(--primary); }
  .host-session-name { font-size: 0.88rem; color: var(--text-secondary); margin-top: 0.1rem; }
  .host-bar-actions { display: flex; gap: 0.6rem; }

  /* Cards */
  .host-card { background: var(--surface); border: 1px solid rgba(20,184,166,.15); border-radius: 14px; padding: 1.3rem; margin-bottom: 1.25rem; }
  .host-card-title { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 1rem; }

  /* Form elements */
  .host-label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .host-input { width: 100%; padding: 0.7rem 1rem; background: var(--background); border: 1.5px solid rgba(20,184,166,.25); border-radius: 8px; color: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 0.9rem; outline: none; transition: border-color .2s; box-sizing: border-box; }
  .host-input:focus { border-color: var(--primary); }
  textarea.host-input { resize: vertical; min-height: 72px; line-height: 1.5; }
  .host-form-group { margin-bottom: 0.9rem; }
  .host-select { width: 100%; padding: 0.65rem 1rem; background: var(--background); border: 1.5px solid rgba(20,184,166,.25); border-radius: 8px; color: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 0.88rem; outline: none; }

  /* Buttons */
  .host-btn { padding: 0.65rem 1.2rem; border: none; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: opacity .15s; }
  .host-btn:disabled { opacity: .4; cursor: not-allowed; }
  .host-btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; }
  .host-btn-primary:hover:not(:disabled) { opacity: .88; }
  .host-btn-ghost { background: transparent; border: 1.5px solid rgba(20,184,166,.3); color: var(--primary); }
  .host-btn-ghost:hover:not(:disabled) { background: rgba(20,184,166,.08); }
  .host-btn-danger { background: transparent; border: 1.5px solid rgba(239,68,68,.3); color: #ef4444; }
  .host-btn-danger:hover:not(:disabled) { background: rgba(239,68,68,.05); }
  .host-btn-full { width: 100%; }
  .host-btn-row { display: flex; gap: 0.6rem; flex-wrap: wrap; }

  /* Option inputs */
  .opt-row { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 0.5rem; }
  .opt-letter { font-size: 0.75rem; font-weight: 700; color: var(--primary); background: rgba(20,184,166,.12); border: 1px solid rgba(20,184,166,.2); border-radius: 6px; padding: 0.5rem 0.55rem; min-width: 32px; text-align: center; flex-shrink: 0; }
  .opt-row input { flex: 1; }

  /* Active question */
  .active-q-panel { background: var(--surface); border: 2px solid var(--primary); border-radius: 14px; padding: 1.25rem; margin-bottom: 1.25rem; display: none; }
  .active-q-badge { display: inline-block; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; background: rgba(20,184,166,.15); color: var(--primary); border-radius: 4px; padding: 0.2rem 0.6rem; margin-bottom: 0.75rem; }
  .active-q-text { font-size: 1rem; font-weight: 700; color: var(--text-primary); margin-bottom: 1rem; line-height: 1.4; }
  .answer-tally { font-size: 0.82rem; color: var(--text-secondary); }

  /* Result bars */
  .result-bar { display: grid; grid-template-columns: 32px 1fr 40px; align-items: center; gap: 0.6rem; margin-bottom: 0.75rem; }
  .rb-letter { font-size: 0.75rem; font-weight: 700; color: var(--primary); background: rgba(20,184,166,.1); border: 1px solid rgba(20,184,166,.2); border-radius: 6px; padding: 0.45rem 0; text-align: center; }
  .rb-label { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 3px; }
  .rb-opt { color: var(--text-primary); }
  .rb-pct { font-weight: 600; color: var(--text-secondary); }
  .rb-track { height: 7px; background: rgba(20,184,166,.12); border-radius: 4px; overflow: hidden; }
  .rb-fill  { height: 100%; background: var(--primary); border-radius: 4px; transition: width .5s ease; }
  .rb-count { font-size: 0.78rem; font-weight: 600; color: var(--text-secondary); text-align: right; }


  /* Close checkboxes */
  .close-options { display: flex; gap: 1.25rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
  .close-options label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.84rem; color: var(--text-secondary); cursor: pointer; font-weight: 500; text-transform: none; letter-spacing: 0; }
  .close-options input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }

  /* History */
  .history-item { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; padding: 0.75rem 0; border-bottom: 1px solid rgba(20,184,166,.08); }
  .history-item:last-child { border-bottom: none; }
  .hi-text { font-size: 0.88rem; color: var(--text-primary); flex: 1; }
  .hi-meta { font-size: 0.72rem; color: var(--text-secondary); white-space: nowrap; margin-bottom: 0.4rem; }
  .hi-actions { display: flex; gap: 0.5rem; margin-top: 0.4rem; }
  .hi-btn { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary); cursor: pointer; transition: all 0.15s; }
  .hi-btn:hover { border-color: var(--primary); color: var(--primary); background: rgba(20,184,166,0.05); }
  .hi-btn-primary { border-color: var(--primary); color: var(--primary); }
  .hi-btn-primary:hover { background: var(--primary); color: #fff; }

  .hi-results { margin-top: 0.6rem; background: rgba(0,0,0,0.1); border-radius: 6px; padding: 0.5rem; display: flex; flex-direction: column; gap: 0.3rem; }
  .hi-bar { display: flex; align-items: center; font-size: 0.72rem; gap: 0.5rem; }
  .hi-bar-label { flex: 1; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 0.3rem; }
  .hi-bar-badge { font-weight: 700; background: var(--surface); border: 1px solid var(--border); padding: 0.1rem 0.3rem; border-radius: 4px; color: var(--primary); }
  .hi-bar-badge.correct { background: var(--success); color: #fff; border-color: var(--success); }
  .hi-bar-pct { font-weight: 600; color: var(--text-primary); width: 32px; text-align: right; }
  .hi-bar-count { color: var(--text-light); width: 20px; text-align: right; }

  /* Alert */
  .host-alert { padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
  .host-alert.show { display: block; }
  .host-alert-success { background: rgba(20,184,166,.1); color: var(--primary); border: 1px solid rgba(20,184,166,.3); }

  /* Session picker */
  .picker-card { max-width: 480px; margin: 3rem auto; }
  .picker-session-row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.7rem 0; border-bottom: 1px solid rgba(20,184,166,.08); cursor: pointer; }
  .picker-session-row:last-child { border-bottom: none; }
  .picker-session-row:hover .picker-code { color: var(--primary); }
  .picker-code { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.12em; color: var(--text-primary); transition: color .15s; }
  .picker-meta { font-size: 0.8rem; color: var(--text-secondary); }
  .picker-arrow { font-size: 0.9rem; color: var(--text-secondary); }
  .picker-empty { font-size: 0.88rem; color: var(--text-secondary); text-align: center; padding: 1.5rem 0; }

  /* Screen toggle */
  .host-screen { display: none; }
  .host-screen.active { display: block; }

  /* QR modal */
  .qr-modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 200; }
  .qr-modal.open { display: flex; }
  .qr-box { background: var(--surface); border-radius: 16px; padding: 2rem; max-width: 320px; width: 90%; text-align: center; }
  .qr-box h3 { font-size: 0.95rem; font-weight: 700; color: var(--text-primary); margin-bottom: 1rem; }
  .qr-code-big { font-size: 2rem; font-weight: 700; letter-spacing: 0.25em; color: var(--primary); margin-bottom: 1rem; }

  /* Question bank collapsible */
  .bank-toggle-btn { display: flex; align-items: center; gap: 0.5rem; background: none; border: none; padding: 0; font-family: 'Inter', sans-serif; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--primary); cursor: pointer; margin-bottom: 0.9rem; }
  .bank-toggle-btn .bank-chevron { transition: transform .2s; font-style: normal; }
  .bank-toggle-btn.open .bank-chevron { transform: rotate(180deg); }
  .bank-panel { display: none; margin-bottom: 1.1rem; padding-bottom: 1.1rem; border-bottom: 1px solid rgba(20,184,166,.15); }
  .bank-panel.open { display: block; }

  /* Correct answer radio buttons */
  .opt-correct-radio { display: flex; align-items: center; cursor: pointer; }
  .opt-correct-radio input { accent-color: var(--primary); width: 16px; height: 16px; cursor: pointer; }

  @media (max-width: 600px) {
    .host-container { padding: 1.5rem 1rem 3rem; }
    .host-bar-actions { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<div class="theme-transition" id="themeTransition" aria-hidden="true"></div>

<div id="screen-app" class="bs-app">

  <header class="bs-topbar">
    <div class="bs-topbar-inner">
      <a href="/backstage/classpulse/" class="bs-topbar-logo" aria-label="Voltar ao ClassPulse">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary)">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </a>
      <div class="bs-topbar-wordmark">
        <span class="bs-topbar-brand">ClassPulse</span>
        <span class="bs-topbar-name">Host</span>
      </div>
      <div class="bs-topbar-spacer"></div>
      <button class="bs-icon-btn theme-toggle" id="themeToggle" aria-label="Alternar tema" aria-pressed="false">
        <span id="themeIcon"></span>
      </button>
    </div>
  </header>

  <div class="host-container">

    <div class="host-alert host-alert-success" id="alert-success"></div>

    <!-- ── SCREEN: session picker ────────────────────────── -->
    <div class="host-screen active" id="screen-picker">
      <div class="host-card picker-card">
        <div class="host-card-title">Sessões abertas</div>
        <div id="picker-list"><div class="picker-empty">Carregando...</div></div>
        <p style="font-size:0.78rem;color:var(--text-secondary);margin-top:1.25rem">
          <a href="/backstage/classpulse/" style="color:var(--primary)">+ Criar nova sessão</a>
        </p>
      </div>
    </div>

    <!-- ── SCREEN: active session ───────────────────────── -->
    <div class="host-screen" id="screen-session">

      <!-- Session bar -->
      <div class="host-session-bar">
        <div>
          <div class="host-code" id="session-code-display"></div>
          <div class="host-session-name" id="session-name-display"></div>
        </div>
        <div class="host-bar-actions">
          <button class="host-btn host-btn-ghost" id="qr-btn">QR</button>
          <a class="host-btn host-btn-ghost" id="display-link" href="#" target="_blank" rel="noopener">Display</a>
          <button class="host-btn host-btn-ghost" id="reopen-session-btn" style="display:none">Reabrir sessão</button>
          <button class="host-btn host-btn-danger" id="close-session-btn">Encerrar sessão</button>
        </div>
      </div>

      <!-- Active question panel -->
      <div class="active-q-panel" id="active-q-panel">
        <div class="active-q-badge">Pergunta ativa</div>
        <div class="active-q-text" id="aq-text"></div>
        <div id="aq-bars"></div>
        <div style="margin-top:1rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.75rem">
          <span class="answer-tally" id="aq-tally"></span>
          <div>
            <div class="close-options">
              <label><input type="checkbox" id="chk-show-results" checked> Mostrar resultados</label>
              <label><input type="checkbox" id="chk-reveal-answer"> Revelar resposta correta</label>
            </div>
            <button class="host-btn host-btn-danger" id="close-question-btn">Encerrar pergunta</button>
          </div>
        </div>
      </div>

      <!-- Launch question form -->
      <div class="host-card">
        <div class="host-card-title">Lançar pergunta</div>

        <!-- Banco de questões collapsible -->
        <button class="bank-toggle-btn" id="bank-toggle-btn" type="button">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
          Banco de questões
          <i class="bank-chevron">▾</i>
        </button>
        <div class="bank-panel" id="bank-panel">
          <div class="qb-set-row">
            <label for="bank-set-select" style="font-size:0.72rem;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.04em">Conjunto</label>
            <select class="host-select" id="bank-set-select">
              <option value="">Escolha um conjunto...</option>
            </select>
          </div>
          <div class="qb-list" id="bank-q-list">
            <div class="qb-msg">Selecione um conjunto acima.</div>
          </div>
        </div>

        <div class="host-form-group">
          <label class="host-label">Tipo de pergunta</label>
          <select class="host-select" id="q-type">
            <option value="mc">Múltipla Escolha</option>
            <option value="tf">Verdadeiro / Falso</option>
            <option value="poll">Enquete</option>
          </select>
        </div>

        <div class="host-form-group">
          <label class="host-label">Texto da pergunta</label>
          <textarea class="host-input" id="q-text" placeholder="Escreva a pergunta para os alunos..." rows="2"></textarea>
        </div>

        <div id="q-opts-mc">
          <div style="font-size:0.72rem;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.5rem">Opções <span style="font-weight:400;text-transform:none;letter-spacing:0;opacity:.7">— marque a correta</span></div>
          <div class="opt-row">
            <div class="opt-letter">A</div>
            <input class="host-input" type="text" id="q-opt-a" placeholder="Opção A">
            <label class="opt-correct-radio" title="Marcar como correta"><input type="radio" name="correct" value="a" id="q-correct-a"></label>
          </div>
          <div class="opt-row">
            <div class="opt-letter">B</div>
            <input class="host-input" type="text" id="q-opt-b" placeholder="Opção B">
            <label class="opt-correct-radio" title="Marcar como correta"><input type="radio" name="correct" value="b" id="q-correct-b"></label>
          </div>
          <div class="opt-row">
            <div class="opt-letter">C</div>
            <input class="host-input" type="text" id="q-opt-c" placeholder="Opção C">
            <label class="opt-correct-radio" title="Marcar como correta"><input type="radio" name="correct" value="c" id="q-correct-c"></label>
          </div>
          <div class="opt-row">
            <div class="opt-letter">D</div>
            <input class="host-input" type="text" id="q-opt-d" placeholder="Opção D">
            <label class="opt-correct-radio" title="Marcar como correta"><input type="radio" name="correct" value="d" id="q-correct-d"></label>
          </div>
        </div>

        <div id="q-opts-poll" style="display:none">
          <div id="poll-rows"></div>
          <button class="host-btn host-btn-ghost" id="poll-add-btn" type="button" style="font-size:0.82rem;margin-top:0.3rem">+ Adicionar opção</button>
        </div>

        <div class="host-btn-row" style="margin-top:0.75rem">
          <button class="host-btn host-btn-ghost" id="q-generate-btn" type="button">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            Gerar
          </button>
          <button class="host-btn host-btn-ghost" id="q-improve-btn" type="button">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/></svg>
            Melhorar
          </button>
        </div>
        <p id="q-error" style="font-size:0.82rem;color:#ef4444;margin:0.4rem 0 0;min-height:1.2em"></p>

        <div class="host-btn-row" style="margin-top:0.75rem">
          <button class="host-btn host-btn-primary" id="launch-btn">Lançar pergunta</button>
          <button class="host-btn host-btn-ghost" id="clear-form-btn">Limpar</button>
        </div>
      </div>

      <!-- Question history -->
      <div class="host-card" id="history-card" style="display:none">
        <div class="host-card-title">Histórico</div>
        <div id="history-list"></div>
      </div>

    </div>

    <!-- ── SCREEN: session closed ───────────────────────── -->
    <div class="host-screen" id="screen-closed">
      <div class="host-card" style="text-align:center;padding:2.5rem">
        <div style="font-size:2rem;margin-bottom:1rem">✓</div>
        <div style="font-weight:700;color:var(--text-primary);margin-bottom:0.5rem">Sessão encerrada</div>
        <div style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:1.5rem" id="closed-session-name"></div>
        <a href="/backstage/classpulse/" class="host-btn host-btn-primary">Voltar ao ClassPulse</a>
      </div>
    </div>

  </div>
</div>

<!-- QR Modal -->
<div class="qr-modal" id="qr-modal">
  <div class="qr-box">
    <h3>Alunos entram pelo código</h3>
    <div class="qr-code-big" id="qr-code-text"></div>
    <img id="qr-img" src="" alt="QR Code" style="max-width:200px">
    <div style="font-size:0.78rem;color:var(--text-secondary);margin-top:0.5rem">pensoia.com/go</div>
    <button class="host-btn host-btn-ghost host-btn-full" id="qr-close-btn" style="margin-top:1rem">Fechar</button>
  </div>
</div>

<script src="../js/utils.js?v=1.1"></script>
<script src="../js/api-client.js?v=1.0"></script>
<script src="../js/question-renderer.js?v=1.0"></script>
<script src="../js/theme-manager.js?v=1.0"></script>
<script src="../js/question-bank.js?v=1.6"></script>
<script>
'use strict';

// ---------------------------------------------------------------------------
// Backstage auth check
// ---------------------------------------------------------------------------

var PW_KEY   = 'bs_pw_hash';
var AUTH_KEY = 'bs_auth';

if (!localStorage.getItem(PW_KEY) || sessionStorage.getItem(AUTH_KEY) !== '1') {
  location.replace('/backstage/');
}

// ---------------------------------------------------------------------------
// Theme
// ---------------------------------------------------------------------------

ThemeManager.init({ storageKey: 'bs_theme' });
ThemeManager.applyTheme(localStorage.getItem('bs_theme') || 'dark');

// ---------------------------------------------------------------------------
// Config (hardcoded - never configure via settings)
// ---------------------------------------------------------------------------

var AUTH_TOKEN     = localStorage.getItem('bs_pw_hash') || '';

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------

var sessionCode  = null;
var activeQId    = null;
var pollTimer    = null;
var _historyMap  = {};

// ---------------------------------------------------------------------------
// Screens
// ---------------------------------------------------------------------------

function showScreen(id) {
  document.querySelectorAll('.host-screen').forEach(function(el) {
    el.classList.toggle('active', el.id === id);
  });
}

// ---------------------------------------------------------------------------
// Alert helpers
// ---------------------------------------------------------------------------

function showAlert(type, msg) {
  if (type === 'error') { showToastError(msg); return; }
  var el = document.getElementById('alert-' + type);
  el.textContent = msg;
  el.classList.add('show');
}

function clearAlert() {
  var el = document.getElementById('alert-success');
  el.textContent = '';
  el.classList.remove('show');
}


// ---------------------------------------------------------------------------
// Session picker
// ---------------------------------------------------------------------------

var urlCode = new URLSearchParams(location.search).get('code');

async function loadPicker() {
  var listEl = document.getElementById('picker-list');
  try {
    var data = await callWorker({ action: 'list_sessions' });
    var open = (data.sessions || []).filter(function(s) { return s.status === 'open'; });

    // Auto-select if code in URL
    if (urlCode) {
      var match = open.find(function(s) { return s.code === urlCode.toUpperCase(); });
      if (match) { selectSession(match); return; }
      // Code not found or closed - show picker with a note
    }

    if (!open.length) {
      listEl.innerHTML = '<div class="picker-empty">Nenhuma sessão aberta.<br>Crie uma sessão no ClassPulse.</div>';
      return;
    }

    listEl.innerHTML = '';
    open.forEach(function(s) {
      var row = document.createElement('div');
      row.className = 'picker-session-row';
      row.innerHTML =
        '<div>' +
          '<div class="picker-code">' + escHtml(s.code) + '</div>' +
          '<div class="picker-meta">' + escHtml(s.title || '') + (s.created_at ? ' &middot; ' + new Date(s.created_at).toLocaleDateString('pt-BR') : '') + '</div>' +
        '</div>' +
        '<span class="picker-arrow">→</span>';
      row.addEventListener('click', function() { selectSession(s); });
      listEl.appendChild(row);
    });
  } catch (e) {
    listEl.innerHTML = '<div class="picker-empty" style="color:#ef4444">Erro ao carregar sessões: ' + escHtml(e.message) + '</div>';
  }
}

function selectSession(s) {
  sessionCode = s.code;

  document.getElementById('session-code-display').textContent = s.code;
  document.getElementById('session-name-display').textContent = s.title || ('Sessão ' + s.code);
  document.getElementById('display-link').href = '/go/display.html?code=' + encodeURIComponent(s.code);
  document.getElementById('qr-code-text').textContent = s.code;
  document.getElementById('qr-img').src =
    'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent('https://pensoia.com/go?code=' + s.code);

  showScreen('screen-session');
  clearAlert();
  startPolling();
}

// Start the picker on load
loadPicker();

// ---------------------------------------------------------------------------
// Session actions
// ---------------------------------------------------------------------------

document.getElementById('close-session-btn').addEventListener('click', async function() {
  if (!confirm('Encerrar a sessão? Os alunos verão a mensagem de sessão encerrada.')) return;
  var btn = this;
  btn.disabled = true;
  btn.textContent = 'Encerrando sessão...';
  try {
    await callWorker({ action: 'close_session', auth_token: AUTH_TOKEN, code: sessionCode });
    stopPolling();
    document.getElementById('closed-session-name').textContent = 'Sessão ' + sessionCode;
    showScreen('screen-closed');
  } catch (e) {
    showAlert('error', 'Erro: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Encerrar sessão';
  }
});

document.getElementById('reopen-session-btn').addEventListener('click', async function() {
  try {
    await callWorker({ action: 'reopen_session', auth_token: AUTH_TOKEN, code: sessionCode });
    document.getElementById('reopen-session-btn').style.display = 'none';
    document.getElementById('close-session-btn').style.display = '';
    showAlert('success', 'Sessão reaberta.');
  } catch (e) {
    showAlert('error', 'Erro: ' + e.message);
  }
});

// ---------------------------------------------------------------------------
// Question type selector
// ---------------------------------------------------------------------------

var MAX_POLL_OPTS = 6;

function buildPollRow(idx) {
  var row = document.createElement('div');
  row.className = 'opt-row';
  row.innerHTML = '<div class="opt-letter">' + LETTERS[idx] + '</div>' +
    '<input class="host-input" type="text" placeholder="Opção ' + LETTERS[idx] + '">';
  return row;
}

function initPollRows(count) {
  var container = document.getElementById('poll-rows');
  container.innerHTML = '';
  for (var i = 0; i < count; i++) container.appendChild(buildPollRow(i));
}

function applyTypeUI(qType) {
  var isMC   = qType === 'mc';
  var isTF   = qType === 'tf';
  var isPoll = qType === 'poll';
  document.getElementById('q-opts-mc').style.display   = (isMC || isTF) ? '' : 'none';
  document.getElementById('q-opts-poll').style.display = isPoll ? '' : 'none';
  if (isTF) {
    document.getElementById('q-opt-a').value = 'Verdadeiro';
    document.getElementById('q-opt-b').value = 'Falso';
    document.getElementById('q-opt-c').value = '';
    document.getElementById('q-opt-d').value = '';
    document.querySelectorAll('#q-opts-mc .opt-row').forEach(function(row, i) {
      row.style.display = i < 2 ? '' : 'none';
    });
    document.querySelectorAll('#q-opts-mc .opt-correct-radio').forEach(function(el, i) { el.style.display = i < 2 ? '' : 'none'; });
  } else if (isMC) {
    document.querySelectorAll('#q-opts-mc .opt-row').forEach(function(row) { row.style.display = ''; });
    document.querySelectorAll('#q-opts-mc .opt-correct-radio').forEach(function(el) { el.style.display = ''; });
  }
  if (isPoll && document.getElementById('poll-rows').children.length === 0) {
    initPollRows(2);
  }
}

document.getElementById('q-type').addEventListener('change', function() {
  applyTypeUI(this.value);
  document.querySelectorAll('input[name="correct"]').forEach(function(r) { r.checked = false; });
});

document.getElementById('poll-add-btn').addEventListener('click', function() {
  var container = document.getElementById('poll-rows');
  if (container.children.length >= MAX_POLL_OPTS) return;
  container.appendChild(buildPollRow(container.children.length));
});

// ---------------------------------------------------------------------------
// Question form
// ---------------------------------------------------------------------------

document.getElementById('launch-btn').addEventListener('click', async function() {
  var qType   = document.getElementById('q-type').value;
  var text    = document.getElementById('q-text').value.trim();
  var options, ca;

  if (qType === 'tf') {
    options = ['Verdadeiro', 'Falso'];
    var caEl = document.querySelector('input[name="correct"]:checked');
    ca = caEl ? ['a','b','c','d'].indexOf(caEl.value) : null;
  } else if (qType === 'poll') {
    options = Array.from(document.querySelectorAll('#poll-rows .host-input')).map(function(i) { return i.value.trim(); }).filter(Boolean);
    ca = null;
  } else {
    options = ['a','b','c','d'].map(function(l) { return document.getElementById('q-opt-' + l).value.trim(); }).filter(Boolean);
    var caEl = document.querySelector('input[name="correct"]:checked');
    ca = caEl ? ['a','b','c','d'].indexOf(caEl.value) : null;
  }

  if (!text)              return showAlert('error', 'Escreva a pergunta.');
  if (options.length < 2) return showAlert('error', 'Informe pelo menos 2 opções.');

  var btn = this;
  btn.disabled = true;
  btn.textContent = 'Lançando...';

  try {
    var res = await callWorker({
      action: 'launch_question', auth_token: AUTH_TOKEN,
      session_code: sessionCode, type: qType, text: text, options: options, correct_answer: ca
    });
    activeQId = res.id;
    clearAlert();
    clearForm();
  } catch (e) {
    showAlert('error', 'Erro: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Lançar pergunta';
  }
});

document.getElementById('close-question-btn').addEventListener('click', async function() {
  if (!activeQId) return;
  var showResults  = document.getElementById('chk-show-results').checked;
  var revealAnswer = document.getElementById('chk-reveal-answer').checked;
  var btn = this;
  btn.disabled = true;
  btn.textContent = 'Encerrando...';
  try {
    await callWorker({
      action: 'close_question', auth_token: AUTH_TOKEN,
      id: activeQId, session_code: sessionCode,
      show_results: showResults, reveal_answer: revealAnswer
    });
    activeQId = null;
    document.getElementById('active-q-panel').style.display = 'none';
    clearAlert();
  } catch (e) {
    showAlert('error', 'Erro: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Encerrar pergunta';
  }
});

document.getElementById('clear-form-btn').addEventListener('click', clearForm);

function clearForm() {
  document.getElementById('q-text').value = '';
  ['a','b','c','d'].forEach(function(l) { document.getElementById('q-opt-' + l).value = ''; });
  document.querySelectorAll('input[name="correct"]').forEach(function(r) { r.checked = false; });
  document.getElementById('q-type').value = 'mc';
  applyTypeUI('mc');
  document.getElementById('poll-rows').innerHTML = '';
}

// ---------------------------------------------------------------------------
// Polling
// ---------------------------------------------------------------------------

var POLL_INTERVAL = 4000;

function startPolling() { fetchData(); pollTimer = setInterval(fetchData, POLL_INTERVAL); }
function stopPolling()  { clearInterval(pollTimer); pollTimer = null; }

async function fetchData() {
  if (!sessionCode) return;
  try {
    var data = await callWorker({ action: 'get_session_state', code: sessionCode });

    var q = data.active_question;
    if (q) {
      activeQId = q.id;
      renderActiveQuestion(q);
      renderHistory(data.history || []);
    } else {
      activeQId = null;
      document.getElementById('active-q-panel').style.display = 'none';
      renderHistory(data.history || []);
    }
  } catch (err) {
    if (typeof bsLog !== 'undefined') bsLog('host poll: ' + err.message, 'error');
  }
}

function renderActiveQuestion(q) {
  var counts = q.answer_counts || new Array((q.options || []).length).fill(0);
  var total  = counts.reduce(function(a, b) { return a + b; }, 0);

  document.getElementById('aq-text').textContent = q.text;
  document.getElementById('aq-tally').textContent = total + ' resposta' + (total !== 1 ? 's' : '');

  var barsEl = document.getElementById('aq-bars');
  barsEl.className = 'qr-host';
  QR.renderResults(q, counts, barsEl, {
    mode: 'host',
    showResults: true,
    revealAnswer: false,
    correctAnswer: q.correct_answer,
  });
  document.getElementById('active-q-panel').style.display = 'block';
}

function renderHistory(closedQs) {
  if (!closedQs.length) {
    document.getElementById('history-card').style.display = 'none';
    return;
  }
  _historyMap = {};
  var html = closedQs.map(function(q) {
    _historyMap[q.id] = q;

    var resultsHtml = '';
    if (q.options && q.answer_counts && q.options.length > 0) {
      var total = q.answer_counts.reduce(function(a,b){ return a+b; }, 0);
      resultsHtml = '<div class="hi-results">';
      q.options.forEach(function(opt, i) {
        var pct = total > 0 ? Math.round(q.answer_counts[i] / total * 100) : 0;
        var isCorrect = q.correct_answer !== null && i === q.correct_answer;
        resultsHtml += '<div class="hi-bar">' +
                         '<div class="hi-bar-label">' +
                           '<span class="hi-bar-badge ' + (isCorrect ? 'correct' : '') + '">' + LETTERS[i] + (isCorrect ? ' \u2713' : '') + '</span> ' +
                           escHtml(stripOptPrefix(opt)) +
                         '</div>' +
                         '<div class="hi-bar-pct">' + pct + '%</div>' +
                         '<div class="hi-bar-count">' + q.answer_counts[i] + '</div>' +
                       '</div>';
      });
      resultsHtml += '</div>';
    }

    return '<div class="history-item">' +
             '<div style="flex:1">' +
               '<div class="hi-text">' + escHtml(q.text || '') + '</div>' +
               '<div class="hi-meta">' + escHtml(q.created_at ? new Date(q.created_at).toLocaleString('pt-BR') : '') + '</div>' +
               resultsHtml +
               '<div class="hi-actions">' +
                 '<button class="hi-btn hi-btn-primary" data-action="relaunch" data-qid="' + escHtml(q.id) + '">Reabrir</button>' +
                 '<button class="hi-btn" data-action="edit" data-qid="' + escHtml(q.id) + '">Editar</button>' +
               '</div>' +
             '</div>' +
           '</div>';
  }).join('');
  document.getElementById('history-list').innerHTML = html;
  document.getElementById('history-list').querySelectorAll('.hi-btn[data-action]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var q = _historyMap[btn.dataset.qid];
      if (!q) return;
      if (btn.dataset.action === 'relaunch') relaunchFromHistory(btn, q);
      else if (btn.dataset.action === 'edit') editFromHistory(q);
    });
  });
  document.getElementById('history-card').style.display = 'block';
}

async function relaunchFromHistory(btn, q) {
  if (activeQId && !confirm('Já existe uma pergunta ativa. Encerrar a atual e lançar esta?')) return;

  var oldText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '...';

  try {
    var res = await callWorker({
      action: 'launch_question', auth_token: AUTH_TOKEN,
      session_code: sessionCode,
      text: q.text,
      options: q.options,
      correct_answer: q.correct_answer
    });
    activeQId = res.id;
    clearAlert();
    showAlert('success', 'Pergunta relançada!');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    showAlert('error', 'Erro ao relançar: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = oldText;
  }
}

function editFromHistory(q) {
  document.getElementById('q-text').value = q.text || '';
  var qType = q.type || 'mc';
  document.getElementById('q-type').value = qType;
  applyTypeUI(qType);
  document.querySelectorAll('input[name="correct"]').forEach(function(r) { r.checked = false; });
  if (qType === 'poll') {
    var pollOpts = q.options || [];
    initPollRows(pollOpts.length || 2);
    Array.from(document.querySelectorAll('#poll-rows .host-input')).forEach(function(inp, i) { inp.value = pollOpts[i] || ''; });
  } else {
    ['a','b','c','d'].forEach(function(l, i) {
      document.getElementById('q-opt-' + l).value = (q.options && q.options[i]) ? q.options[i] : '';
    });
    if (q.correct_answer !== null && q.correct_answer !== undefined) {
      var r = document.querySelectorAll('input[name="correct"]')[q.correct_answer];
      if (r) r.checked = true;
    }
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
  document.getElementById('q-text').focus();
}

// QR modal

document.getElementById('qr-btn').addEventListener('click', function() {
  document.getElementById('qr-modal').classList.add('open');
});

document.getElementById('qr-close-btn').addEventListener('click', function() {
  document.getElementById('qr-modal').classList.remove('open');
});

document.getElementById('qr-modal').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('open');
});

// Question bank
// ---------------------------------------------------------------------------

// Toggle open/close
document.getElementById('bank-toggle-btn').addEventListener('click', function() {
  var panel = document.getElementById('bank-panel');
  var isOpen = panel.classList.toggle('open');
  this.classList.toggle('open', isOpen);
  if (isOpen) QuestionBank.loadSets();
});

QuestionBank.init({
  setSelect:    document.getElementById('bank-set-select'),
  questionList: document.getElementById('bank-q-list'),
  generateBtn:  document.getElementById('q-generate-btn'),
  improveBtn:   document.getElementById('q-improve-btn'),
  errorEl:      document.getElementById('q-error'),
  canDelete:    false,
  canCreateSet: false,
  onSelect: function(q) { prefillForm(q); },
  getFormState: function() {
    return {
      text: document.getElementById('q-text').value.trim(),
      type: document.getElementById('q-type').value,
      options: [
        document.getElementById('q-opt-a').value.trim(),
        document.getElementById('q-opt-b').value.trim(),
        document.getElementById('q-opt-c').value.trim(),
        document.getElementById('q-opt-d').value.trim()
      ]
    };
  }
});

function prefillForm(q) {
  document.getElementById('q-text').value = q.question || '';
  var qType = q.type || 'mc';
  document.getElementById('q-type').value = qType;
  applyTypeUI(qType);
  document.querySelectorAll('input[name="correct"]').forEach(function(r) { r.checked = false; });
  if (qType === 'poll') {
    var pollOpts = typeof q.options === 'string' ? JSON.parse(q.options) : (q.options || []);
    initPollRows(pollOpts.length || 2);
    Array.from(document.querySelectorAll('#poll-rows .host-input')).forEach(function(inp, i) { inp.value = pollOpts[i] || ''; });
  } else if (qType === 'mc') {
    var mcOpts = typeof q.options === 'string' ? JSON.parse(q.options) : (q.options || []);
    ['a','b','c','d'].forEach(function(l, i) { document.getElementById('q-opt-' + l).value = mcOpts[i] || ''; });
    var ca = parseInt(q.correct_answer);
    if (!isNaN(ca) && ca >= 0) {
      var radio = document.querySelector('input[name="correct"][value="' + ['a','b','c','d'][ca] + '"]');
      if (radio) radio.checked = true;
    }
  }
}
