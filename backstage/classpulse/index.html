<!DOCTYPE html>
<html lang="pt-BR" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>ClassPulse - Backstage</title>

<link rel="icon" type="image/x-icon" href="../../favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png">

<link rel="stylesheet" href="../css/theme.css?v=1.1">
<link rel="stylesheet" href="../css/backstage.css?v=1.1">
<link rel="stylesheet" href="../css/classpulse.css?v=1.3">
<link rel="stylesheet" href="../css/shared-components.css?v=1.1">
<script src="../js/debug.js?v=2.3"></script>
</head>
<body>

<div class="theme-transition" id="themeTransition" aria-hidden="true"></div>

<div id="screen-app" class="bs-app">

  <header class="bs-topbar">
    <div class="bs-topbar-inner">
      <a href="/backstage/" class="bs-topbar-logo" aria-label="Voltar ao Backstage">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary)">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </a>
      <div class="bs-topbar-wordmark">
        <span class="bs-topbar-brand">Backstage</span>
        <span class="bs-topbar-name">ClassPulse</span>
      </div>
      <div class="bs-topbar-spacer"></div>
      <button class="bs-icon-btn theme-toggle" id="themeToggle" aria-label="Alternar tema" aria-pressed="false">
        <span id="themeIcon"></span>
      </button>
      <button class="bs-logout-btn" id="logout-btn">Sair</button>
    </div>
  </header>

  <main class="bs-main">

    <div class="cp-tabs">
      <button class="cp-tab active" id="tab-sessions" data-tab="sessions">Sessões</button>
      <button class="cp-tab" id="tab-banks" data-tab="banks">Banco de Questões</button>
    </div>

    <!-- ============================================================
         PANEL: SESSIONS
         ============================================================ -->
    <div class="cp-panel active" id="panel-sessions">

      <div class="cp-create-session">
        <h3>Nova sessão</h3>
        <div class="cp-row">
          <div class="bs-field">
            <label>Título da sessão</label>
            <input type="text" id="session-title" placeholder="Ex: Aula 3 — Redes Neurais" autocomplete="off">
          </div>
          <button class="cp-btn-primary" id="create-session-btn">Criar sessão</button>
        </div>
        <p class="cp-form-error" id="session-error"></p>
      </div>

      <div id="sessions-list-wrap">
        <div class="cp-empty" id="sessions-empty" hidden>
          <div class="cp-empty-icon">📋</div>
          <p>Nenhuma sessão encontrada.<br>Crie uma sessão acima.</p>
        </div>
        <div class="cp-sessions-list" id="sessions-list"></div>
      </div>

    </div>

    <!-- ============================================================
         PANEL: QUESTION BANKS
         ============================================================ -->
    <div class="cp-panel" id="panel-banks">

      <div class="cp-banks-layout">

        <!-- Set list sidebar -->
        <div>
          <div class="cp-set-list" id="set-list-container">
            <div class="cp-set-list-header">Conjuntos</div>
            <div id="set-list-items">
              <div class="cp-empty" style="padding:1.5rem 1rem">
                <div class="cp-empty-icon">📦</div>
                <p>Nenhum conjunto.<br>Crie questões ao lado.</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Form + question list -->
        <div class="cp-question-area">

          <div class="cp-question-form">
            <h3>Nova questão</h3>

            <!-- Bank picker (collapsed by default) -->
            <button class="bank-toggle-btn" id="bank-toggle-btn" type="button" style="display:flex;align-items:center;gap:0.5rem;background:none;border:none;padding:0;font-family:'Inter',sans-serif;font-size:0.75rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--primary);cursor:pointer;margin-bottom:0.9rem">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
              Preencher do banco
              <i style="transition:transform .2s;font-style:normal" id="bank-chevron">▾</i>
            </button>
            <div style="display:none;margin-bottom:1.1rem;padding-bottom:1.1rem;border-bottom:1px solid rgba(20,184,166,.15)" id="bank-panel">
              <div class="qb-set-row">
                <label for="bank-set-select" style="font-size:0.72rem;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.04em">Conjunto</label>
                <select class="cp-set-select-row" id="bank-set-select" style="width:100%;padding:0.65rem 1rem;background:var(--background);border:1.5px solid rgba(20,184,166,.25);border-radius:8px;color:var(--text-primary);font-family:'Inter',sans-serif;font-size:0.88rem;outline:none">
                  <option value="">Escolha um conjunto...</option>
                </select>
              </div>
              <div class="qb-list" id="bank-q-list">
                <div class="qb-msg">Selecione um conjunto acima.</div>
              </div>
            </div>

            <div class="cp-set-select-row">
              <div class="bs-field">
                <label>Conjunto</label>
                <input type="text" id="q-set-name" placeholder="Nome do conjunto (ex: Semana 3)" autocomplete="off" list="set-suggestions">
                <datalist id="set-suggestions"></datalist>
              </div>
            </div>

            <div class="bs-field">
              <label>Pergunta ou instrução para IA</label>
              <textarea class="bs-textarea" id="q-text" placeholder="Escreva a pergunta diretamente, ou descreva o que você quer para o botão Gerar." style="min-height:72px"></textarea>
            </div>

            <div id="q-options">
              <div class="cp-option-row" id="opt-row-a">
                <div class="cp-option-letter">A</div>
                <input type="text" id="q-opt-a" placeholder="Opção A" autocomplete="off">
                <input type="radio" name="correct" value="a" id="q-correct-a" title="Correta">
              </div>
              <div class="cp-option-row" id="opt-row-b">
                <div class="cp-option-letter">B</div>
                <input type="text" id="q-opt-b" placeholder="Opção B" autocomplete="off">
                <input type="radio" name="correct" value="b" id="q-correct-b" title="Correta">
              </div>
              <div class="cp-option-row" id="opt-row-c">
                <div class="cp-option-letter">C</div>
                <input type="text" id="q-opt-c" placeholder="Opção C" autocomplete="off">
                <input type="radio" name="correct" value="c" id="q-correct-c" title="Correta">
              </div>
              <div class="cp-option-row" id="opt-row-d">
                <div class="cp-option-letter">D</div>
                <input type="text" id="q-opt-d" placeholder="Opção D" autocomplete="off">
                <input type="radio" name="correct" value="d" id="q-correct-d" title="Correta">
              </div>
            </div>

            <p class="cp-form-error" id="q-error"></p>
            <p class="cp-form-msg" id="q-msg"></p>

            <div class="cp-form-actions">
              <button class="cp-btn-ghost" id="q-generate-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                Gerar
              </button>
              <button class="cp-btn-ghost" id="q-improve-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/></svg>
                Melhorar
              </button>
              <button class="cp-btn-primary" id="q-save-btn" style="flex:1">Salvar</button>
            </div>
          </div>

          <!-- Question list for selected set -->
          <div id="question-list-wrap" hidden>
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem">
              <h3 style="font-size:0.9rem; font-weight:700; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.06em" id="question-list-title">Questões</h3>
              <button class="cp-btn-danger" id="delete-set-btn" style="font-size:0.78rem; padding:0.4rem 0.8rem">Excluir conjunto</button>
            </div>
            <div class="cp-question-list" id="question-list"></div>
          </div>

        </div>
      </div>
    </div>

  </main>
</div>

<script src="../js/utils.js?v=1.0"></script>
<script src="../js/api-client.js?v=1.0"></script>
<script src="../js/theme-manager.js?v=1.0"></script>
<script src="../js/question-bank.js?v=1.3"></script>
<script>
'use strict';

// ---------------------------------------------------------------------------
// Auth check
// ---------------------------------------------------------------------------

var PW_KEY   = 'bs_pw_hash';
var AUTH_KEY = 'bs_auth';

document.querySelectorAll('input[type="password"]').forEach(function(el) { el.value = ''; });

if (!localStorage.getItem(PW_KEY) || sessionStorage.getItem(AUTH_KEY) !== '1') {
  location.replace('/backstage/');
}

// ---------------------------------------------------------------------------
// Theme
// ---------------------------------------------------------------------------

ThemeManager.init({ storageKey: 'bs_theme' });
ThemeManager.applyTheme(localStorage.getItem('bs_theme') || 'dark');

document.getElementById('logout-btn').addEventListener('click', function() {
  sessionStorage.removeItem(AUTH_KEY);
  location.replace('/backstage/');
});

// ---------------------------------------------------------------------------
// Config
// ---------------------------------------------------------------------------

var AUTH_TOKEN = localStorage.getItem('bs_pw_hash') || '';

// ---------------------------------------------------------------------------
// Tabs
// ---------------------------------------------------------------------------

document.querySelectorAll('.cp-tab').forEach(function(btn) {
  btn.addEventListener('click', function() {
    var tab = this.dataset.tab;
    document.querySelectorAll('.cp-tab').forEach(function(b) { b.classList.remove('active'); });
    document.querySelectorAll('.cp-panel').forEach(function(p) { p.classList.remove('active'); });
    this.classList.add('active');
    document.getElementById('panel-' + tab).classList.add('active');
    if (tab === 'sessions') loadSessions();
    if (tab === 'banks') loadSets();
  });
});

// ---------------------------------------------------------------------------
// SESSIONS
// ---------------------------------------------------------------------------

var sessions = [];

async function loadSessions() {
  try {
    var data = await callWorker({ action: 'list_sessions' });
    sessions = data.sessions || [];
  } catch (err) {
    sessions = [];
  }
  renderSessions();
}

function renderSessions() {
  var list = document.getElementById('sessions-list');
  var empty = document.getElementById('sessions-empty');
  list.innerHTML = '';

  if (sessions.length === 0) {
    empty.hidden = false;
    return;
  }
  empty.hidden = true;

  sessions.forEach(function(s) {
    var card = document.createElement('div');
    card.className = 'cp-session-card';

    var codeEl = document.createElement('div');
    codeEl.className = 'cp-session-code';
    codeEl.textContent = s.code;

    var info = document.createElement('div');
    info.className = 'cp-session-info';
    var title = document.createElement('div');
    title.className = 'cp-session-title';
    title.textContent = s.title || 'Sem título';
    var meta = document.createElement('div');
    meta.className = 'cp-session-meta';
    meta.textContent = s.created_at ? new Date(s.created_at).toLocaleDateString('pt-BR') : '';
    info.appendChild(title);
    info.appendChild(meta);

    var status = document.createElement('span');
    status.className = 'cp-session-status ' + (s.status || 'open');
    status.textContent = s.status === 'closed' ? 'Encerrada' : 'Aberta';

    var actions = document.createElement('div');
    actions.className = 'cp-session-actions';

    if (s.status !== 'closed') {
      var hostBtn = document.createElement('a');
      hostBtn.className = 'cp-btn-ghost';
      hostBtn.href = 'host.html?code=' + encodeURIComponent(s.code);
      hostBtn.textContent = 'Host';
      actions.appendChild(hostBtn);

      var closeBtn = document.createElement('button');
      closeBtn.className = 'cp-btn-danger';
      closeBtn.textContent = 'Encerrar';
      closeBtn.style.cssText = 'font-size:0.78rem;padding:0.4rem 0.8rem';
      closeBtn.addEventListener('click', async function() {
        if (!confirm('Encerrar sessão ' + s.code + '?')) return;
        try {
          await callWorker({ action: 'close_session', auth_token: AUTH_TOKEN, code: s.code });
          s.status = 'closed';
          renderSessions();
        } catch (e) { alert('Erro: ' + e.message); }
      });
      actions.appendChild(closeBtn);
    } else {
      var reopenBtn = document.createElement('button');
      reopenBtn.className = 'cp-btn-ghost';
      reopenBtn.textContent = 'Reabrir';
      reopenBtn.style.cssText = 'font-size:0.78rem;padding:0.4rem 0.8rem';
      reopenBtn.addEventListener('click', async function() {
        try {
          await callWorker({ action: 'reopen_session', auth_token: AUTH_TOKEN, code: s.code });
          s.status = 'open';
          renderSessions();
        } catch (e) { alert('Erro: ' + e.message); }
      });
      actions.appendChild(reopenBtn);
    }

    card.appendChild(codeEl);
    card.appendChild(info);
    card.appendChild(status);
    card.appendChild(actions);
    list.appendChild(card);
  });
}

document.getElementById('session-title').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('create-session-btn').click();
});

document.getElementById('create-session-btn').addEventListener('click', async function() {
  var title = document.getElementById('session-title').value.trim();
  var err = document.getElementById('session-error');
  err.textContent = '';

  if (!title) { err.textContent = 'Informe o título da sessão.'; return; }

  var btn = this;
  btn.disabled = true;
  btn.textContent = 'Criando...';

  try {
    var data = await callWorker({ action: 'create_session', auth_token: AUTH_TOKEN, title: title });
    document.getElementById('session-title').value = '';
    // Prepend new session
    sessions.unshift({ code: data.code, title: title, status: 'open', created_at: new Date().toISOString() });
    renderSessions();
  } catch (e) {
    err.textContent = 'Erro: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Criar sessão';
  }
});

// ---------------------------------------------------------------------------
// QUESTION BANKS
// ---------------------------------------------------------------------------

var sets = [];
var activeSet = null;
var questions = [];

async function loadSets() {
  try {
    var data = await callWorker({ action: 'list_question_sets' });
    sets = data.banks || [];
  } catch (err) {
    sets = [];
  }
  renderSets();
  updateSetSuggestions();
}

function renderSets() {
  var container = document.getElementById('set-list-items');
  container.innerHTML = '';

  if (sets.length === 0) {
    container.innerHTML = '<div class="cp-empty" style="padding:1.5rem 1rem"><div class="cp-empty-icon">📦</div><p>Nenhum conjunto.<br>Crie questões ao lado.</p></div>';
    activeSet = null;
    document.getElementById('question-list-wrap').hidden = true;
    return;
  }

  sets.forEach(function(s) {
    var item = document.createElement('div');
    item.className = 'cp-set-item' + (activeSet === s.name ? ' active' : '');

    var nameEl = document.createElement('div');
    nameEl.className = 'cp-set-name';
    nameEl.textContent = s.name;

    var countEl = document.createElement('div');
    countEl.className = 'cp-set-count';
    countEl.textContent = s.count;

    var delBtn = document.createElement('button');
    delBtn.className = 'cp-set-delete-btn';
    delBtn.textContent = '\u00d7';
    delBtn.title = 'Excluir conjunto';
    delBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      confirmDeleteSet(s.name);
    });

    item.appendChild(nameEl);
    item.appendChild(countEl);
    item.appendChild(delBtn);
    container.appendChild(item);

    item.addEventListener('click', function() {
      selectSet(s.name);
    });
  });
}

function updateSetSuggestions() {
  var dl = document.getElementById('set-suggestions');
  dl.innerHTML = '';
  sets.forEach(function(s) {
    var opt = document.createElement('option');
    opt.value = s.name;
    dl.appendChild(opt);
  });
}

async function selectSet(name) {
  activeSet = name;
  renderSets();

  document.getElementById('q-set-name').value = name;
  document.getElementById('question-list-wrap').hidden = false;
  document.getElementById('question-list-title').textContent = name;
  document.getElementById('question-list').innerHTML = '<div class="cp-empty"><p>Carregando...</p></div>';

  try {
    var data = await callWorker({ action: 'get_questions', list: name });
    questions = data.questions || [];
  } catch (err) {
    questions = [];
  }
  renderQuestions();
}

function renderQuestions() {
  var list = document.getElementById('question-list');
  list.innerHTML = '';

  if (questions.length === 0) {
    list.innerHTML = '<div class="cp-empty"><div class="cp-empty-icon">❓</div><p>Nenhuma questão neste conjunto.</p></div>';
    return;
  }

  questions.forEach(function(q) {
    var card = document.createElement('div');
    card.className = 'cp-question-card';

    var qText = document.createElement('div');
    qText.className = 'cp-question-text';
    qText.textContent = q.question;
    card.appendChild(qText);

    var opts = document.createElement('div');
    opts.className = 'cp-question-options';
    ['a','b','c','d'].forEach(function(letter) {
      var opt = document.createElement('div');
      opt.className = 'cp-question-option' + (q.correct === letter ? ' is-correct' : '');
      opt.innerHTML = '<span class="opt-letter">' + letter.toUpperCase() + '</span> ' + (q['option_' + letter] || '');
      opts.appendChild(opt);
    });
    card.appendChild(opts);

    var footer = document.createElement('div');
    footer.className = 'cp-question-footer';
    var tag = document.createElement('span');
    tag.className = 'cp-question-set-tag';
    tag.textContent = q.list_name;
    var delBtn = document.createElement('button');
    delBtn.className = 'cp-btn-danger';
    delBtn.style.cssText = 'font-size:0.75rem;padding:0.3rem 0.7rem';
    delBtn.textContent = 'Excluir';
    delBtn.addEventListener('click', function() {
      deleteQuestion(q.question);
    });
    footer.appendChild(tag);
    footer.appendChild(delBtn);
    card.appendChild(footer);

    list.appendChild(card);
  });
}

// Save question
document.getElementById('q-save-btn').addEventListener('click', async function() {
  var setName = document.getElementById('q-set-name').value.trim();
  var text    = document.getElementById('q-text').value.trim();
  var optA    = document.getElementById('q-opt-a').value.trim();
  var optB    = document.getElementById('q-opt-b').value.trim();
  var optC    = document.getElementById('q-opt-c').value.trim();
  var optD    = document.getElementById('q-opt-d').value.trim();
  var correct = document.querySelector('input[name="correct"]:checked');
  var err     = document.getElementById('q-error');
  var msg     = document.getElementById('q-msg');

  err.textContent = '';
  msg.textContent = '';

  if (!setName) { err.textContent = 'Informe o nome do conjunto.'; return; }
  if (!text)    { err.textContent = 'A pergunta não pode estar vazia.'; return; }
  if (!optA || !optB || !optC || !optD) { err.textContent = 'Preencha todas as 4 opções.'; return; }
  if (!correct) { err.textContent = 'Selecione a opção correta.'; return; }

  var btn = this;
  btn.disabled = true;
  btn.textContent = 'Salvando...';

  try {
    await callWorker({
      action: 'add_question',
      auth_token: AUTH_TOKEN,
      list_name: setName,
      question:  text,
      option_a:  optA,
      option_b:  optB,
      option_c:  optC,
      option_d:  optD,
      correct:   correct.value
    });
    msg.textContent = 'Questão salva!';
    clearQuestionForm();
    // Refresh set list and question list
    await loadSets();
    if (activeSet === setName) {
      await selectSet(setName);
    } else {
      activeSet = setName;
      await selectSet(setName);
    }
    setTimeout(function() { msg.textContent = ''; }, 3000);
  } catch (e) {
    err.textContent = 'Erro: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Salvar';
  }
});

function clearQuestionForm() {
  document.getElementById('q-text').value = '';
  document.getElementById('q-opt-a').value = '';
  document.getElementById('q-opt-b').value = '';
  document.getElementById('q-opt-c').value = '';
  document.getElementById('q-opt-d').value = '';
  document.querySelectorAll('input[name="correct"]').forEach(function(r) { r.checked = false; });
  updateCorrectHighlight();
}

// Highlight correct option row
function updateCorrectHighlight() {
  ['a','b','c','d'].forEach(function(l) {
    var row = document.getElementById('opt-row-' + l);
    var radio = document.getElementById('q-correct-' + l);
    if (row) row.classList.toggle('correct-selected', radio && radio.checked);
  });
}

document.querySelectorAll('input[name="correct"]').forEach(function(r) {
  r.addEventListener('change', updateCorrectHighlight);
});

// Delete one question
async function deleteQuestion(questionText) {
  if (!activeSet) return;
  if (!confirm('Excluir esta questão?')) return;
  try {
    await callWorker({ action: 'delete_question', auth_token: AUTH_TOKEN, list_name: activeSet, question: questionText });
    await selectSet(activeSet);
    await loadSets();
  } catch (e) {
    alert('Erro: ' + e.message);
  }
}

// Delete entire set
document.getElementById('delete-set-btn').addEventListener('click', function() {
  if (activeSet) confirmDeleteSet(activeSet);
});

async function confirmDeleteSet(name) {
  if (!confirm('Excluir o conjunto "' + name + '" e todas as suas questões?')) return;
  try {
    await callWorker({ action: 'delete_question_set', auth_token: AUTH_TOKEN, list_name: name });
    activeSet = null;
    document.getElementById('question-list-wrap').hidden = true;
    await loadSets();
  } catch (e) {
    alert('Erro: ' + e.message);
  }
}


// ---------------------------------------------------------------------------
// Question bank picker (bank panel in question form)
// ---------------------------------------------------------------------------

document.getElementById('bank-toggle-btn').addEventListener('click', function() {
  var panel = document.getElementById('bank-panel');
  var chevron = document.getElementById('bank-chevron');
  var isOpen = panel.style.display !== 'none' && panel.style.display !== '';
  if (isOpen) {
    panel.style.display = 'none';
    chevron.style.transform = '';
  } else {
    panel.style.display = 'block';
    chevron.style.transform = 'rotate(180deg)';
    QuestionBank.loadSets();
  }
});

function prefillQuestionForm(q) {
  document.getElementById('q-text').value = q.question || '';
  document.getElementById('q-opt-a').value = q.option_a || '';
  document.getElementById('q-opt-b').value = q.option_b || '';
  document.getElementById('q-opt-c').value = q.option_c || '';
  document.getElementById('q-opt-d').value = q.option_d || '';
  document.querySelectorAll('input[name="correct"]').forEach(function(r) { r.checked = false; });
  if (q.correct) {
    var radio = document.getElementById('q-correct-' + q.correct.toLowerCase());
    if (radio) { radio.checked = true; updateCorrectHighlight(); }
  }
}

QuestionBank.init({
  setSelect:    document.getElementById('bank-set-select'),
  questionList: document.getElementById('bank-q-list'),
  generateBtn:  document.getElementById('q-generate-btn'),
  improveBtn:   document.getElementById('q-improve-btn'),
  errorEl:      document.getElementById('q-error'),
  canDelete:    true,
  canCreateSet: true,
  onSelect: function(q) { prefillQuestionForm(q); },
  getFormState: function() {
    return {
      text: document.getElementById('q-text').value.trim(),
      options: [
        document.getElementById('q-opt-a').value.trim(),
        document.getElementById('q-opt-b').value.trim(),
        document.getElementById('q-opt-c').value.trim(),
        document.getElementById('q-opt-d').value.trim()
      ]
    };
  }
});

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
loadSessions();
</script>
</body>
</html>
