<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aula hub · C — cards + modal grande em 2 colunas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#14b8a6; --primary-dark:#0d9488; --navy:#061a51;
    --bg:#d4f4ed; --surface:#fff; --ink:#134e4a; --ink2:#115e59; --muted:#5b7975;
    --border:#e2e8f0; --shadow:rgba(20,184,166,.12);
    --amber:#f59e0b; --blue:#3b82f6; --green:#10b981; --red:#ef4444;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .wrap{max-width:880px;margin:0 auto;padding:1rem 1.6rem 4rem}
  .mockbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;font-size:.8rem;margin-bottom:.4rem}
  .mockbar b{color:var(--navy)}
  .mockbar a{color:var(--primary-dark);text-decoration:none;border:1px solid var(--border);border-radius:8px;padding:.2rem .5rem;background:var(--surface)}
  .mockbar a.on{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:none}
  .cap{font-size:.82rem;color:var(--ink2);margin:.1rem 0 1rem}
  .cap b{color:var(--navy)}
  .btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:9px;padding:.5rem .85rem;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem}
  .btn:hover{border-color:var(--primary)}
  .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:none;box-shadow:0 6px 16px var(--shadow)}
  .btn-sm{padding:.3rem .55rem;font-size:.75rem}

  .doss-tabs{display:flex;gap:.3rem;border-bottom:2px solid var(--border);margin-bottom:1rem}
  .doss-tab{padding:.55rem .9rem;font-size:.88rem;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;cursor:default}
  .doss-tab.on{color:var(--primary-dark);border-bottom-color:var(--primary)}
  .topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:.7rem}
  .topline b{color:var(--navy);font-size:.95rem}

  /* compact aula cards */
  .acard{background:var(--surface);border:1px solid var(--border);border-radius:13px;box-shadow:0 4px 16px var(--shadow);margin-bottom:.55rem;padding:.7rem .85rem;display:flex;align-items:center;gap:.7rem}
  .anum{flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:var(--bg);color:var(--primary-dark);display:grid;place-items:center;font-weight:700}
  .ainfo{min-width:0;flex:1}
  .at{font-weight:600;font-size:.92rem}
  .as{font-size:.74rem;color:var(--muted);display:flex;gap:.45rem;align-items:center;flex-wrap:wrap;margin-top:.12rem}
  .dte{font-family:var(--mono);font-size:.72rem;color:var(--ink2);background:var(--bg);border-radius:5px;padding:0 .35rem}
  .st{font-size:.72rem;font-weight:600}
  .st.done{color:var(--green)} .st.now{color:var(--blue)} .st.soon{color:var(--amber)}
  .acts{display:flex;gap:.35rem;flex:0 0 auto}
  .pillbtn{border:1px solid var(--border);background:#f8fcfb;border-radius:999px;padding:.28rem .6rem;font-size:.76rem;font-weight:600;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
  .pillbtn:hover{border-color:var(--primary);color:var(--primary-dark)}
  .pillbtn .n{background:var(--bg);border-radius:999px;padding:0 .3rem;font-size:.66rem}

  /* modal */
  .backdrop{position:fixed;inset:0;background:rgba(6,26,81,.32);display:none;align-items:center;justify-content:center;padding:2rem;z-index:50}
  .backdrop.show{display:flex}
  .modal{background:var(--surface);border-radius:16px;box-shadow:0 30px 80px rgba(6,26,81,.3);width:min(960px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
  .mhead{display:flex;align-items:center;gap:.6rem;padding:.85rem 1.1rem;border-bottom:1px solid var(--border)}
  .mhead h3{margin:0;font-size:1.02rem;color:var(--navy)}
  .mhead .x{margin-left:auto;border:none;background:transparent;font-size:1.2rem;cursor:pointer;color:var(--muted)}
  .mbody{display:grid;grid-template-columns:300px 1fr;min-height:0;flex:1}
  .mcol-l{border-right:1px solid var(--border);overflow:auto}
  .mcol-r{overflow:auto;padding:1rem 1.1rem}
  .mfoot{padding:.7rem 1.1rem;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:.5rem}

  .lrow{display:flex;align-items:center;gap:.5rem;padding:.55rem .8rem;cursor:pointer;border-bottom:1px solid #f1f5f4;border-left:3px solid transparent;font-size:.85rem}
  .lrow:hover{background:#f7fbfa}
  .lrow.on{background:rgba(20,184,166,.09);border-left-color:var(--primary);font-weight:600}
  .lrow .n{margin-left:auto;font-size:.72rem;color:var(--muted)}

  .crow{display:flex;align-items:center;gap:.5rem;padding:.4rem .45rem;font-size:.86rem;border-radius:7px}
  .crow:hover{background:#f7fbfa}
  .crow input{accent-color:var(--primary);width:16px;height:16px}
  .tag{font-size:.64rem;font-weight:700;border-radius:5px;padding:0 .3rem;text-transform:uppercase}
  .tag.tarefa{background:#fff7ed;color:#c2680c;border:1px solid #fed7aa}
  .ttl{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:0 0 .5rem}

  .ans{border:1px solid var(--border);border-radius:9px;padding:.5rem .6rem;margin-bottom:.5rem;background:var(--surface)}
  .ans .who{font-size:.82rem;font-weight:600;display:flex;align-items:center;gap:.4rem}
  .ans .who .when{margin-left:auto;font-weight:400;color:var(--muted);font-size:.72rem}
  .ans .txt{font-size:.85rem;color:var(--ink2);margin-top:.3rem;line-height:1.45}
  .reply{margin-top:.4rem;display:flex;gap:.4rem}
  .reply input{flex:1;border:1px solid var(--border);border-radius:8px;padding:.4rem .55rem;font:inherit;font-size:.82rem;background:#f8fcfb}
  .replied{margin-top:.4rem;font-size:.81rem;color:var(--primary-dark);background:rgba(20,184,166,.08);border-radius:8px;padding:.4rem .55rem}
  .hint{font-size:.78rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="mockbar">
    <b>Aula hub</b>
    <a href="a.html">A · colunas</a>
    <a href="b.html">B · acordeão</a>
    <a class="on" href="c.html">C · modal</a>
    <a href="review.html">comparar →</a>
  </div>
  <div class="cap"><b>Opção C.</b> Cards de aula enxutos com os dados à mostra. Cada card tem botões <b>Liberações</b> e <b>Tarefas</b> que abrem um modal grande em 2 colunas, com bastante espaço pra trabalhar.</div>

  <div class="doss-tabs">
    <div class="doss-tab">Dados da turma</div>
    <div class="doss-tab">Participantes</div>
    <div class="doss-tab on">Aulas</div>
    <div class="doss-tab">Fórum</div>
  </div>

  <div class="topline"><b>Aulas · TJSE 2025.1</b><button class="btn btn-sm btn-primary">＋ Nova aula</button></div>
  <div id="alist"></div>
</div>

<div class="backdrop" id="backdrop"><div class="modal" id="modal"></div></div>

<script>
const AULAS = [
  { id:1, n:1, title:'Fundamentos e Prompt', date:'03/03', hours:'4h', st:'done', stl:'concluída', libN:5, tarefas:[
      { name:'Diagnóstico da rotina', count:8, anon:false, answers:[
        {who:'Ana Beatriz', when:'há 2 dias', txt:'Hoje gasto ~3h/dia revisando petições repetitivas; queria automatizar a triagem inicial.', reply:'Ótimo recorte. Na aula 2 vamos montar um prompt de triagem pra isso.'},
        {who:'Bruno Almeida', when:'há 2 dias', txt:'Minha maior dor é resumir processos longos com segurança.', reply:null},
        {who:'Carla Mendes', when:'há 1 dia', txt:'Pesquisa de jurisprudência consome muito tempo.', reply:null},
      ]}]},
  { id:2, n:2, title:'Riscos e Ferramentas', date:'10/03', hours:'4h', st:'now', stl:'hoje', libN:3, tarefas:[
      { name:'Mapa de riscos da sua área', count:3, anon:true, answers:[
        {who:'Anônimo', when:'há 3h', txt:'Risco de vazamento de dados sigilosos ao colar trechos em ferramentas públicas.', reply:null},
        {who:'Anônimo', when:'há 1h', txt:'Alucinação em citação de jurisprudência inexistente.', reply:null},
      ]}]},
  { id:3, n:3, title:'Laboratório prático', date:'17/03', hours:'4h', st:'soon', stl:'agendada', libN:0, tarefas:[
      { name:'Projeto final', count:0, anon:false, answers:[] }]},
];
const POOL = {
  Apostila:['1. O que é um LLM','2. Anatomia de um prompt','3. Padrões de contexto','4. Cadeia de raciocínio','5. Verificação e revisão'],
  Tarefas:['Diagnóstico da rotina','Mapa de riscos da sua área','Projeto final'],
  'Slides e outros':['Slide · Abertura','Slide · Casos reais'],
  Drive:['PDF · Acórdãos selecionados'],
};

function render(){
  document.getElementById('alist').innerHTML = AULAS.map(a=>`
    <div class="acard">
      <span class="anum">${a.n}</span>
      <div class="ainfo"><div class="at">${a.title}</div>
        <div class="as"><span class="dte">${a.date}/2025</span><span>${a.hours}</span><span class="st ${a.st}">${a.stl}</span></div></div>
      <div class="acts">
        <button class="pillbtn" data-lib="${a.id}">▤ Liberações <span class="n">${a.libN}</span></button>
        <button class="pillbtn" data-tar="${a.id}">✎ Tarefas <span class="n">${a.tarefas.length}</span></button>
      </div>
    </div>`).join('');
  document.querySelectorAll('[data-lib]').forEach(b=>b.onclick=()=>openLib(+b.dataset.lib));
  document.querySelectorAll('[data-tar]').forEach(b=>b.onclick=()=>openTar(+b.dataset.tar));
}
function shell(title, sub, bodyHtml, foot){
  document.getElementById('modal').innerHTML=`
    <div class="mhead"><h3>${title}</h3><span class="hint">${sub}</span><button class="x" onclick="closeM()">✕</button></div>
    <div class="mbody">${bodyHtml}</div>
    <div class="mfoot">${foot}</div>`;
  document.getElementById('backdrop').classList.add('show');
}
function openLib(id){
  const a=AULAS.find(x=>x.id===id);
  const cats=Object.keys(POOL);
  const left=cats.map((c,i)=>`<div class="lrow ${i===0?'on':''}" data-cat="${c}">${c}<span class="n">${POOL[c].length}</span></div>`).join('');
  shell(`Liberações · Aula ${a.n}`, a.title,
    `<div class="mcol-l">${left}</div><div class="mcol-r" id="libitems"></div>`,
    `<button class="btn btn-sm" onclick="closeM()">Cancelar</button><button class="btn btn-sm btn-primary">Salvar liberações</button>`);
  const paint=cat=>{document.getElementById('libitems').innerHTML=`<p class="ttl">${cat}</p>`+POOL[cat].map((t,i)=>`<label class="crow"><input type="checkbox" ${i%2===0?'checked':''}><span>${t}</span>${cat==='Tarefas'?'<span class="tag tarefa">tarefa</span>':''}</label>`).join('');};
  paint(cats[0]);
  document.querySelectorAll('[data-cat]').forEach(r=>r.onclick=()=>{document.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('on'));r.classList.add('on');paint(r.dataset.cat);});
}
function openTar(id){
  const a=AULAS.find(x=>x.id===id);
  const left=a.tarefas.map((t,i)=>`<div class="lrow ${i===0?'on':''}" data-t="${i}">✎ ${t.name}<span class="n">${t.count}</span></div>`).join('') || '<div class="hint" style="padding:1rem">Nenhuma tarefa nesta aula.</div>';
  shell(`Tarefas · Aula ${a.n}`, a.title,
    `<div class="mcol-l">${left}</div><div class="mcol-r" id="taritems"></div>`,
    `<button class="btn btn-sm" onclick="closeM()">Fechar</button>`);
  const paint=ti=>{
    const t=a.tarefas[ti]; if(!t){document.getElementById('taritems').innerHTML='<div class="hint">Selecione uma tarefa.</div>';return;}
    document.getElementById('taritems').innerHTML=`<p class="ttl">${t.name} · ${t.count} respostas ${t.anon?'· anônima':''}</p>`+
      (t.answers.length?t.answers.map(an=>`<div class="ans"><div class="who">${an.who}<span class="when">${an.when}</span></div><div class="txt">${an.txt}</div>${an.reply?`<div class="replied"><b>Sua resposta:</b> ${an.reply}</div>`:`<div class="reply"><input placeholder="Responder ao aluno…"><button class="btn btn-sm btn-primary">Enviar</button></div>`}</div>`).join(''):'<div class="hint">Ainda sem respostas.</div>');
  };
  paint(0);
  document.querySelectorAll('[data-t]').forEach(r=>r.onclick=()=>{document.querySelectorAll('[data-t]').forEach(x=>x.classList.remove('on'));r.classList.add('on');paint(+r.dataset.t);});
}
function closeM(){document.getElementById('backdrop').classList.remove('show');}
document.getElementById('backdrop').onclick=e=>{if(e.target.id==='backdrop')closeM();};
render();
</script>
</body>
</html>
