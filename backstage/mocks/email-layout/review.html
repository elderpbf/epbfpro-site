<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mock Review Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --teal:#14b8a6; --tl:#5eead4; --navy:#061a51; --deep:#04123a; --mono:'JetBrains Mono',monospace;
    --line:rgba(255,255,255,.12); --dim:rgba(255,255,255,.55); }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;background:var(--deep);font-family:var(--mono);color:#fff;}

  #stage{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;display:block;z-index:10;}

  /* pin overlay (parent-side; tracks elements via rAF when same-origin) */
  #pins{position:fixed;inset:0;z-index:20;pointer-events:none;}
  #pins.arm{pointer-events:auto;cursor:crosshair;background:rgba(20,184,166,.05);}
  .pin{position:absolute;transform:translate(-50%,-50%);min-width:22px;height:22px;padding:0 4px;border-radius:50% 50% 50% 3px;
    background:var(--teal);color:#042b27;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
    cursor:pointer;pointer-events:auto;box-shadow:0 3px 10px rgba(0,0,0,.45);border:1.5px solid #fff;}
  .pin:hover{background:var(--tl);}
  .pin.lost{opacity:.4;}

  /* edge arrows */
  .edge{position:fixed;top:50%;transform:translateY(-50%);z-index:30;width:48px;height:84px;display:flex;align-items:center;
    justify-content:center;background:rgba(4,18,58,.42);color:#fff;border:1px solid var(--line);cursor:pointer;opacity:.32;
    transition:opacity .15s,background .15s;backdrop-filter:blur(4px);}
  .edge:hover{opacity:1;background:rgba(20,184,166,.9);color:#042b27;}
  #prev{left:0;border-radius:0 12px 12px 0;border-left:0;} #next{right:0;border-radius:12px 0 0 12px;border-right:0;}
  .edge svg{width:22px;height:22px;}

  #revealZone{position:fixed;left:0;right:0;bottom:0;height:16px;z-index:40;}

  /* ===== single bottom bar ===== */
  #bar{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:100vw;
    background:rgba(4,18,58,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);
    transform:translateY(102%);transition:transform .22s ease;
    display:flex;flex-direction:column;}
  #bar.show{transform:translateY(0);}

  /* notes panel (slides above control row, part of the bar) */
  #notes{max-height:0;overflow:hidden;transition:max-height .2s ease;border-bottom:1px solid var(--line);}
  #notes.open{max-height:34vh;overflow:auto;}
  #notes .inner{padding:10px 14px;display:flex;flex-direction:column;gap:7px;}
  .note{display:flex;gap:8px;align-items:flex-start;background:rgba(255,255,255,.05);border:1px solid var(--line);
    border-radius:8px;padding:7px 9px;font-size:12px;line-height:1.45;}
  .note .ic{flex:0 0 auto;} .note .tx{flex:1;word-break:break-word;color:rgba(255,255,255,.92);}
  .note .pn{color:var(--tl);font-weight:700;margin-right:4px;}
  .note .del{cursor:pointer;color:var(--dim);background:none;border:0;font-size:14px;line-height:1;}
  .note .del:hover{color:#f87171;}
  #notes .empty{color:var(--dim);font-size:11.5px;text-align:center;padding:8px 0;}

  /* rows of chips */
  #strips{display:flex;flex-direction:column;gap:5px;padding:9px 12px 4px;}
  .strip{display:flex;gap:5px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;padding-bottom:1px;}
  .strip::-webkit-scrollbar{display:none;}
  .strip.ov{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 30px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 30px),transparent);}
  .strip.ov.sl{-webkit-mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 30px),transparent);mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 30px),transparent);}
  .strip .rl{flex:0 0 auto;align-self:center;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding-right:3px;}
  .chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;font-size:11px;color:rgba(255,255,255,.82);
    background:transparent;border:1px solid rgba(255,255,255,.2);border-radius:13px;padding:4px 8px;cursor:pointer;
    white-space:nowrap;transition:all .12s;}
  .chip .lab{max-width:82px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .chip:hover{border-color:var(--tl);color:#fff;}
  .chip .code{font-weight:600;color:var(--tl);}
  .chip.r1{border-color:rgba(20,184,166,.5);}
  .chip.r2{border-color:var(--teal);background:rgba(20,184,166,.16);color:#fff;}
  .chip.r3{border-color:var(--tl);background:rgba(20,184,166,.34);color:#fff;}
  .chip.out{opacity:.3;text-decoration:line-through;border-style:dashed;}
  .chip.cur{box-shadow:0 0 0 2px var(--tl),0 0 12px rgba(94,234,212,.5);}
  .chip .b{min-width:15px;height:15px;line-height:15px;text-align:center;border-radius:50%;font-size:9px;font-weight:700;background:var(--tl);color:#042b27;}
  .chip .nc{font-size:9px;color:var(--dim);}

  /* control row */
  #ctrl{display:flex;align-items:center;gap:8px;padding:7px 12px 10px;flex-wrap:wrap;border-top:1px solid var(--line);}
  #ctrl .cur-name{font-size:12px;font-weight:600;white-space:nowrap;} #ctrl .cur-name .code{color:var(--tl);}
  #ctrl .grp{display:flex;gap:4px;align-items:center;}
  #ctrl .lbl{font-size:9px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;}
  .rbtn{font-size:12px;font-weight:600;width:28px;height:28px;border-radius:7px;border:1px solid var(--line);
    background:rgba(255,255,255,.05);color:#fff;cursor:pointer;}
  .rbtn:hover{border-color:var(--tl);} .rbtn.on{background:var(--teal);border-color:var(--teal);color:#042b27;}
  .rbtn.zero:hover{border-color:#f87171;color:#f87171;}
  #comment{flex:1;min-width:140px;height:30px;background:rgba(255,255,255,.06);color:#fff;border:1px solid var(--line);
    border-radius:8px;padding:0 10px;font-family:var(--mono);font-size:12px;}
  #comment:focus{outline:2px solid var(--teal);}
  .tbtn{font-size:13px;height:30px;width:32px;border-radius:7px;border:1px solid var(--line);background:rgba(255,255,255,.05);
    color:#fff;cursor:pointer;} .tbtn:hover{border-color:var(--tl);} .tbtn.on{background:var(--teal);border-color:var(--teal);color:#042b27;}
  .txt-btn{font-size:11px;height:30px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;cursor:pointer;}
  .txt-btn:hover{border-color:var(--tl);}
  #meta{font-size:9.5px;color:var(--dim);white-space:nowrap;} #meta b{color:var(--tl);}

  #toast{position:fixed;left:50%;bottom:50%;transform:translateX(-50%);z-index:60;font-size:12px;color:#042b27;
    background:var(--tl);padding:8px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .18s;}
  #toast.show{opacity:1;}
  #hint{position:fixed;left:0;right:0;bottom:0;z-index:35;text-align:center;font-size:9px;color:rgba(255,255,255,.25);
    padding:2px;pointer-events:none;}
</style>
</head>
<body>
  <iframe id="stage" title="proposta"></iframe>
  <div id="pins"></div>

  <button class="edge" id="prev" aria-label="Anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button class="edge" id="next" aria-label="Próximo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>

  <div id="hint">↑ mouse na borda de baixo revela a barra · setas ← → navegam · 0-3 nota · x reseta</div>
  <div id="revealZone" aria-hidden="true"></div>

  <footer id="bar">
    <div id="notes"><div class="inner" id="notesInner"></div></div>
    <div id="strips"></div>
    <div id="ctrl">
      <span class="cur-name" id="curName"></span>
      <span class="grp"><span class="lbl">nota</span>
        <button class="rbtn zero" data-r="0" title="Sai (0)">0</button>
        <button class="rbtn" data-r="1">1</button>
        <button class="rbtn" data-r="2">2</button>
        <button class="rbtn" data-r="3">3</button>
        <button class="rbtn" data-x="1" title="Reseta (x)">⟲</button>
      </span>
      <input id="comment" placeholder="comentário... (Enter adiciona)">
      <button class="tbtn" id="tagLike" title="gostei">👍</button>
      <button class="tbtn" id="tagNo" title="não">👎</button>
      <button class="tbtn" id="tagIdea" title="ideia">💡</button>
      <button class="tbtn" id="pinBtn" title="Pin (p)">📌</button>
      <button class="txt-btn" id="notesBtn" title="Notas (n)">notas</button>
      <button class="txt-btn" id="exportBtn" title="Export (e)">⤓ export</button>
      <span id="meta"></span>
    </div>
  </footer>

  <div id="toast">ok</div>

<script src="mocks.js"></script>
<script>
(function(){
  var M = window.REVIEW_MANIFEST || {rows:[]};
  var STORE = M.storageKey || 'mrk_ratings', NSTORE = M.notesKey || 'mrk_notes';
  document.title = (M.title||'Mock Review')+' · Kit';

  // flatten
  var ITEMS=[], ROWS=M.rows||[]; ROWS.forEach(function(r){ r.items.forEach(function(it){ ITEMS.push(it); }); });
  var byId={}; ITEMS.forEach(function(it){ byId[it.id]=it; });

  var stage=document.getElementById('stage'), pinsEl=document.getElementById('pins'), bar=document.getElementById('bar');

  // state
  var rating={}; ITEMS.forEach(function(it){ if(it.out) rating[it.id]=0; });
  try{ var sv=JSON.parse(localStorage.getItem(STORE)||'{}'); Object.keys(sv).forEach(function(k){ if(byId[k]) rating[k]=sv[k]; }); }catch(e){}
  var notes={}; try{ notes=JSON.parse(localStorage.getItem(NSTORE)||'{}')||{}; }catch(e){ notes={}; }
  var filterLevel=0, FL=['Tudo','≥2','Só 3'], pinMode=false, tag='idea';

  function saveR(){ try{ localStorage.setItem(STORE,JSON.stringify(rating)); }catch(e){} }
  function saveN(){ try{ localStorage.setItem(NSTORE,JSON.stringify(notes)); }catch(e){} }
  function notesOf(id){ return notes[id]||(notes[id]=[]); }

  function pass(id){ if(filterLevel===0) return true; var r=rating[id]||0; return filterLevel===1?r>=2:r===3; }
  function inC(it){ return rating[it.id]!==0; }
  function visible(){ return ITEMS.filter(function(it){ return inC(it)&&pass(it.id); }).map(function(it){return it.id;}); }
  var curId=(ITEMS.find(function(it){return inC(it);})||ITEMS[0]||{}).id;

  // same-origin?
  function sameOrigin(){ try{ return !!(stage.contentDocument && stage.contentDocument.body); }catch(e){ return false; } }

  function show(id){
    var it=byId[id]; if(!it) return; curId=id;
    if(stage.getAttribute('data-src')!==it.file){ stage.src=it.file; stage.setAttribute('data-src',it.file); }
    renderStrips(); renderCtrl(); renderNotes(); buildPins();
  }
  function step(d){ var l=visible(); if(!l.length) return; var i=l.indexOf(curId); if(i<0)i=(d>0?-1:0); show(l[(i+d+l.length)%l.length]); }
  function reconcile(pi){ var nl=visible(); if(nl.indexOf(curId)!==-1||!nl.length){ renderStrips(); renderCtrl(); updMeta(); return; } show(nl[Math.min(Math.max(pi,0),nl.length-1)]); }
  function rate(v){ var l=visible(),i=l.indexOf(curId); rating[curId]=v; saveR(); reconcile(i); }
  function reset(){ var l=visible(),i=l.indexOf(curId); delete rating[curId]; saveR(); reconcile(i); }

  // ---- strips ----
  function chipEl(it){
    var r=rating[it.id], cls='chip';
    if(r===0)cls+=' out'; else if(r===1)cls+=' r1'; else if(r===2)cls+=' r2'; else if(r===3)cls+=' r3';
    if(it.id===curId)cls+=' cur';
    var b=document.createElement('button'); b.className=cls;
    var badge=(r===1||r===2||r===3)?'<span class="b">'+r+'</span>':'';
    var n=(notes[it.id]&&notes[it.id].length)?'<span class="nc">✎'+notes[it.id].length+'</span>':'';
    b.innerHTML='<span class="code">'+it.id.toUpperCase()+'</span><span class="lab">'+it.label+'</span>'+badge+n;
    b.addEventListener('click', function(){ show(it.id); });
    return b;
  }
  function stripFades(){ document.querySelectorAll('#strips .strip').forEach(function(s){ var ov=s.scrollWidth>s.clientWidth+2; s.classList.toggle('ov',ov); s.classList.toggle('sl',ov&&s.scrollLeft>4); }); }
  function renderStrips(){
    var c=document.getElementById('strips'); c.innerHTML='';
    ROWS.forEach(function(row){
      var s=document.createElement('div'); s.className='strip';
      var rl=document.createElement('span'); rl.className='rl'; rl.textContent=row.label||''; s.appendChild(rl);
      row.items.forEach(function(it){ s.appendChild(chipEl(it)); });
      s.addEventListener('scroll', stripFades);
      c.appendChild(s);
    });
    requestAnimationFrame(stripFades);
  }
  window.addEventListener('resize', stripFades);
  // ---- control ----
  function renderCtrl(){
    var it=byId[curId];
    document.getElementById('curName').innerHTML='<span class="code">'+curId.toUpperCase()+'</span> '+(it?it.label:'');
    document.querySelectorAll('.rbtn').forEach(function(b){
      if(b.hasAttribute('data-r')) b.classList.toggle('on', rating[curId]===parseInt(b.getAttribute('data-r'),10));
    });
    updMeta();
  }
  function counts(){ var c={0:0,1:0,2:0,3:0}; ITEMS.forEach(function(it){ var r=rating[it.id]; if(r===0||r===1||r===2||r===3)c[r]++; }); return c; }
  function updMeta(){ var c=counts(),n=(notes[curId]||[]).length;
    document.getElementById('meta').innerHTML='<b>3</b>·'+c[3]+' <b>2</b>·'+c[2]+' <b>1</b>·'+c[1]+' ✕·'+c[0]+' · filtro '+FL[filterLevel]+(n?(' · ✎'+n):''); }
  function cycleFilter(){ var l=visible(),i=l.indexOf(curId); filterLevel=(filterLevel+1)%3; reconcile(i<0?0:i); }

  // ---- notes ----
  var ICON={like:'👍',no:'👎',idea:'💡',pin:'📌'};
  function renderNotes(){
    var box=document.getElementById('notesInner'), arr=notes[curId]||[]; box.innerHTML='';
    if(!arr.length){ box.innerHTML='<div class="empty">sem notas neste mock</div>'; return; }
    var pn=0;
    arr.forEach(function(n,idx){
      var isPin=(n.sel||typeof n.x==='number'); if(isPin)pn++;
      var el=document.createElement('div'); el.className='note';
      el.innerHTML='<span class="ic">'+(ICON[n.k]||(isPin?'📌':'•'))+'</span><span class="tx">'+(isPin?'<span class="pn">#'+pn+'</span>':'')+esc(n.t||'(sem texto)')+'</span>';
      var d=document.createElement('button'); d.className='del'; d.textContent='×';
      d.addEventListener('click', function(){ arr.splice(idx,1); if(!arr.length) delete notes[curId]; saveN(); renderNotes(); buildPins(); renderStrips(); updMeta(); });
      el.appendChild(d); box.appendChild(el);
    });
  }
  function addNote(o){ notesOf(curId).push(o); saveN(); renderNotes(); renderStrips(); updMeta(); }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function addComment(){
    var i=document.getElementById('comment'), t=i.value.trim(); if(!t) return;
    addNote({t:t,k:tag}); i.value='';
  }

  // ---- pins (parent-side, element-anchored when same-origin) ----
  function cssPath(el){
    if(!el||el.nodeType!==1) return '';
    var doc=stage.contentDocument; var parts=[]; var safe=window.CSS&&CSS.escape?CSS.escape:function(s){return s;};
    while(el&&el.nodeType===1&&el!==doc.body&&parts.length<7){
      if(el.id){ parts.unshift('#'+safe(el.id)); break; }
      var s=el.nodeName.toLowerCase(), p=el.parentNode;
      if(p){ var sib=Array.prototype.filter.call(p.children,function(c){return c.nodeName===el.nodeName;});
        if(sib.length>1) s+=':nth-of-type('+(sib.indexOf(el)+1)+')'; }
      parts.unshift(s); el=el.parentNode;
    }
    return parts.join('>');
  }
  var markers=[];
  function buildPins(){
    pinsEl.querySelectorAll('.pin').forEach(function(p){p.remove();}); markers=[];
    var arr=notes[curId]||[], pn=0;
    arr.forEach(function(n,idx){
      var isPin=(n.sel||typeof n.x==='number'); if(!isPin) return; pn++;
      var m=document.createElement('div'); m.className='pin'; m.textContent=pn; m.title=n.t||'';
      m.addEventListener('click', function(ev){ ev.stopPropagation();
        var nt=window.prompt('Comentário do pin (vazio = apagar):', n.t||''); if(nt===null) return;
        if(nt.trim()===''){ arr.splice(idx,1); if(!arr.length) delete notes[curId]; } else { n.t=nt.trim(); }
        saveN(); buildPins(); renderNotes(); renderStrips();
      });
      pinsEl.appendChild(m); markers.push({n:n, el:m});
    });
    positionPins();
  }
  function positionPins(){
    var so=sameOrigin(), doc=so?stage.contentDocument:null;
    markers.forEach(function(mk){
      var n=mk.n, m=mk.el;
      if(n.sel && doc){
        var t=null; try{ t=doc.querySelector(n.sel); }catch(e){}
        if(t){ var r=t.getBoundingClientRect();
          var x=r.left+(n.rx||0)*r.width, y=r.top+(n.ry||0)*r.height;
          var vis=(y>-20&&y<window.innerHeight+20);
          m.style.left=x+'px'; m.style.top=Math.max(8,Math.min(window.innerHeight-8,y))+'px';
          m.classList.toggle('lost', !vis);
        } else { m.classList.add('lost'); m.style.left='12px'; m.style.top=(20+markers.indexOf(mk)*26)+'px'; }
      } else if(typeof n.x==='number'){ m.style.left=n.x+'%'; m.style.top=n.y+'%'; }
      else { m.classList.add('lost'); }
    });
  }
  function tick(){ requestAnimationFrame(tick); if(markers.length) positionPins(); }
  requestAnimationFrame(tick);

  function setPin(on){ pinMode=on; pinsEl.classList.toggle('arm',on); document.getElementById('pinBtn').classList.toggle('on',on); }
  pinsEl.addEventListener('click', function(ev){
    if(!pinMode) return;
    var cx=ev.clientX, cy=ev.clientY;
    if(sameOrigin()){
      var doc=stage.contentDocument, t=null; try{ t=doc.elementFromPoint(cx,cy); }catch(e){}
      if(t){ var r=t.getBoundingClientRect();
        var rx=r.width?(cx-r.left)/r.width:0.5, ry=r.height?(cy-r.top)/r.height:0.5;
        var txt=window.prompt('Comentário deste pin:'); if(txt===null) return;
        addNote({t:txt.trim(),k:'pin',sel:cssPath(t),rx:+rx.toFixed(4),ry:+ry.toFixed(4)});
        buildPins(); return;
      }
    }
    // fallback: viewport %
    var txt2=window.prompt('Comentário deste pin (posição na tela):'); if(txt2===null) return;
    addNote({t:txt2.trim(),k:'pin',x:+(cx/window.innerWidth*100).toFixed(2),y:+(cy/window.innerHeight*100).toFixed(2)});
    buildPins();
  });

  // ---- export / import ----
  var toast=document.getElementById('toast'),tt;
  function showToast(m){ toast.textContent=m; toast.classList.add('show'); clearTimeout(tt); tt=setTimeout(function(){toast.classList.remove('show');},1400); }
  function expData(){ var legend={}; ITEMS.forEach(function(it){legend[it.id]=it.label;}); return {tool:'mock-review-kit',title:M.title,when:new Date().toISOString(),ratings:rating,notes:notes,legend:legend}; }
  function exportAll(){
    var j=JSON.stringify(expData(),null,2);
    try{ var b=new Blob([j],{type:'application/json'}),a=document.createElement('a');
      a.href=URL.createObjectURL(b); a.download='mock-review.json'; document.body.appendChild(a); a.click(); document.body.removeChild(a); }catch(e){}
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(j).then(function(){},function(){});
    showToast('exportado → Downloads + clipboard');
  }
  function importPaste(){ var raw=window.prompt('Cole o JSON exportado:'); if(!raw) return;
    try{ var o=JSON.parse(raw);
      if(o.ratings){ rating={}; ITEMS.forEach(function(it){if(it.out)rating[it.id]=0;}); Object.keys(o.ratings).forEach(function(k){if(byId[k])rating[k]=o.ratings[k];}); saveR(); }
      if(o.notes){ notes=o.notes||{}; saveN(); }
      renderStrips(); renderCtrl(); renderNotes(); buildPins(); showToast('importado');
    }catch(e){ showToast('JSON inválido'); }
  }

  // ---- bar show/hide ----
  var hideT;
  function showBar(){ clearTimeout(hideT); bar.classList.add('show'); }
  function hideBar(){ bar.classList.remove('show'); }
  function softHide(){ if(pinMode) return; clearTimeout(hideT); hideT=setTimeout(hideBar,240); }
  document.getElementById('revealZone').addEventListener('mouseenter', showBar);
  document.addEventListener('mousemove', function(e){ if(e.clientY>window.innerHeight-10) showBar(); });
  bar.addEventListener('mouseenter', function(){ clearTimeout(hideT); });
  bar.addEventListener('mouseleave', softHide);
  document.addEventListener('mousedown', function(e){ if(bar.classList.contains('show') && !bar.contains(e.target) && !pinMode) hideBar(); });
  window.addEventListener('blur', function(){ if(!pinMode) hideBar(); });

  // ---- controls wiring ----
  document.getElementById('prev').addEventListener('click', function(){ step(-1); });
  document.getElementById('next').addEventListener('click', function(){ step(1); });
  document.querySelectorAll('.rbtn').forEach(function(b){ b.addEventListener('click', function(){ b.hasAttribute('data-x')?reset():rate(parseInt(b.getAttribute('data-r'),10)); }); });
  document.getElementById('comment').addEventListener('keydown', function(e){ if(e.key==='Enter') addComment(); e.stopPropagation(); });
  function pickTag(t,btn){ tag=t; document.querySelectorAll('#tagLike,#tagNo,#tagIdea').forEach(function(b){b.classList.remove('on');}); btn.classList.add('on'); }
  document.getElementById('tagLike').addEventListener('click', function(){ pickTag('like',this); });
  document.getElementById('tagNo').addEventListener('click', function(){ pickTag('no',this); });
  document.getElementById('tagIdea').addEventListener('click', function(){ pickTag('idea',this); });
  document.getElementById('tagIdea').classList.add('on');
  document.getElementById('pinBtn').addEventListener('click', function(){ setPin(!pinMode); });
  document.getElementById('notesBtn').addEventListener('click', function(){ document.getElementById('notes').classList.toggle('open'); });
  document.getElementById('exportBtn').addEventListener('click', exportAll);

  document.addEventListener('keydown', function(e){
    var t=e.target; if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA')) return;
    switch(e.key){
      case 'ArrowLeft': step(-1); break; case 'ArrowRight': step(1); break;
      case '0': rate(0); break; case '1': rate(1); break; case '2': rate(2); break; case '3': rate(3); break;
      case 'x': case 'X': reset(); break;
      case 'f': case 'F': cycleFilter(); break;
      case 'e': case 'E': case 'c': case 'C': exportAll(); break;
      case 'n': case 'N': document.getElementById('notes').classList.toggle('open'); showBar(); break;
      case 'p': case 'P': setPin(!pinMode); showBar(); break;
      case 'i': case 'I': importPaste(); break;
      case 'Escape': hideBar(); setPin(false); break;
    }
  });

  if(curId){ show(curId); showBar(); setTimeout(hideBar, 2200); }
})();
</script>
</body>
</html>
