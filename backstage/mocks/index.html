<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>pensoIA · Mocks</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --teal: #0F8B82;
  --navy: #061a51;
  --bg: #F5F5F4;
  --surface: #ffffff;
  --border: #E7E5E4;
  --text: #1C1917;
  --text-muted: #78716C;
}
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Inter', -apple-system, system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: grid;
  grid-template-columns: 280px 1fr;
  transition: grid-template-columns 0.2s;
}
body.sidebar-hidden { grid-template-columns: 1fr; }

aside.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  overflow-x: hidden;
}
body.sidebar-hidden aside.sidebar { display: none; }

.sidebar-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  position: sticky;
  top: 0;
  background: var(--surface);
  z-index: 1;
}
.sidebar-header h1 { font-size: 14px; font-weight: 600; }
.back-btn {
  background: none; border: 1px solid var(--border); border-radius: 6px;
  padding: 4px 9px; cursor: pointer; font-size: 14px; line-height: 1;
  color: var(--text-muted);
}
.back-btn:hover { background: var(--bg); color: var(--text); border-color: var(--text-muted); }

.project-list { list-style: none; padding: 8px; }
.project-list > li { margin-bottom: 2px; }

details summary {
  list-style: none;
  padding: 8px 10px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  border-radius: 6px;
  user-select: none;
}
details summary::-webkit-details-marker { display: none; }
details summary:hover { background: var(--bg); }
details summary::before {
  content: '';
  width: 0; height: 0;
  border-left: 5px solid var(--text-muted);
  border-top: 4px solid transparent;
  border-bottom: 4px solid transparent;
  transition: transform 0.15s;
}
details[open] summary::before { transform: rotate(90deg); }

.count {
  margin-left: auto;
  background: var(--bg);
  color: var(--text-muted);
  padding: 2px 7px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 500;
}

details ul { list-style: none; padding: 4px 0 6px 22px; }
details ul li a {
  display: block;
  padding: 6px 10px;
  color: var(--text);
  text-decoration: none;
  border-radius: 4px;
  font-size: 12.5px;
  line-height: 1.4;
}
details ul li a:hover { background: var(--bg); }
details ul li a.active {
  background: var(--teal);
  color: white;
}

ul.child-list { list-style: none; padding: 2px 0 4px 14px; margin: 2px 0 0 8px; border-left: 1px solid var(--border); }
ul.child-list li a { font-size: 12px; padding: 5px 10px; color: var(--text-muted); }
ul.child-list li a:hover { color: var(--text); background: var(--bg); }
ul.child-list li a.active { color: white; background: var(--teal); }

main.content {
  background: var(--bg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.topbar {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  align-items: center;
  gap: 12px;
}
.toggle-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 10px;
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
}
.toggle-btn:hover { background: var(--bg); }
.current-title {
  font-size: 13px;
  color: var(--text-muted);
}
.current-title strong { color: var(--text); font-weight: 500; }
.copy-link {
  margin-left: auto;
  font-size: 12px;
  color: var(--teal);
  background: none;
  border: 1px solid var(--border);
  padding: 5px 10px;
  border-radius: 6px;
  cursor: pointer;
}
.copy-link:hover { border-color: var(--teal); }

.viewer-area {
  flex: 1;
  position: relative;
  background: var(--bg);
  overflow: hidden;
}
.empty-state {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 14px;
  padding: 20px;
  text-align: center;
}
iframe {
  width: 100%;
  height: 100%;
  border: none;
  background: white;
  display: none;
}

body.guest-mode { grid-template-columns: 1fr; }
body.guest-mode aside.sidebar { display: none; }
body.guest-mode .toggle-btn,
body.guest-mode .copy-link,
body.guest-mode .current-title { display: none; }
body.guest-mode .topbar {
  justify-content: center;
  background: white;
  padding: 14px 16px;
}
body.guest-mode .topbar::before {
  content: 'pensoIA  ·  mock in development';
  font-size: 13px;
  font-weight: 500;
  color: var(--navy);
  letter-spacing: 0.02em;
}

@media (max-width: 768px) {
  body { grid-template-columns: 1fr; }
  aside.sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: 280px;
    z-index: 100;
    box-shadow: 2px 0 8px rgba(0,0,0,0.1);
  }
  body.sidebar-hidden aside.sidebar { display: none; }
}
</style>
</head>
<body class="sidebar-hidden">
  <aside class="sidebar">
    <div class="sidebar-header">
      <button class="back-btn" onclick="window.location.href='/backstage/'" aria-label="Back to Backstage" title="Back to Backstage">←</button>
      <h1>pensoIA · Mocks</h1>
    </div>
    <ul class="project-list" id="projectList"></ul>
  </aside>

  <main class="content">
    <div class="topbar">
      <button class="toggle-btn" onclick="document.body.classList.toggle('sidebar-hidden')" aria-label="Toggle sidebar">☰</button>
      <div class="current-title" id="currentTitle">Select a mock</div>
      <button class="copy-link" onclick="copyLink()" id="copyBtn" style="display:none;">Copy link</button>
    </div>
    <div class="viewer-area">
      <iframe id="viewer" src="about:blank"></iframe>
      <div class="empty-state" id="emptyState">
        ← Open the sidebar to browse available mocks
      </div>
    </div>
  </main>

<script>
const isAuthenticated = () => sessionStorage.getItem('bs_auth') === '1' && !!localStorage.getItem('bs_pw_hash');

const MOCKS = {
  brand: {
    label: 'Brand',
    items: [
      { name: 'Brand system showcase (canonical set)', file: 'brand/showcase.html' },
      { name: 'Tagline and variation explorations', file: 'brand/exploracoes.html', children: [
        { name: 'Refactor (2 tabs, with bp-wm-s)', file: 'brand/refactor.html' }
      ]},
      { name: 'Logo preview (3 backgrounds)', file: 'brand/preview.html' },
      { name: 'Logo rectangle alternatives', file: 'brand/alternativas.html' },
      { name: '20-font comparison', file: 'brand/fontes.html' },
      { name: 'Comfortaa + 4 taglines', file: 'brand/taglines.html' },
      { name: 'Penso family in Comfortaa', file: 'brand/produtos.html' }
    ]
  },
  lauterna: {
    label: 'Lauterna (working title · medical reports platform)',
    items: [
      { name: 'Home', file: 'lauterna/index.html', children: [
        { name: 'New report', file: 'lauterna/novo-laudo.html' },
        { name: 'Templates', file: 'lauterna/mascaras.html' },
        { name: 'Sign report', file: 'lauterna/assinar.html' },
        { name: 'Plans', file: 'lauterna/planos.html' }
      ]}
    ]
  }
};

function renderItem(item) {
  const hash = item.file.replace(/\.html$/, '');
  const link = '<a href="#' + hash + '" data-file="' + item.file + '" data-name="' + item.name + '">' + item.name + '</a>';
  if (item.children && item.children.length) {
    const subs = item.children.map(c => '<li>' + renderItem(c) + '</li>').join('');
    return link + '<ul class="child-list">' + subs + '</ul>';
  }
  return link;
}

function countItems(items) {
  return items.reduce((acc, i) => acc + 1 + (i.children ? i.children.length : 0), 0);
}

function findItemByHash(hash) {
  function search(items) {
    for (const item of items) {
      if (item.file.replace(/\.html$/, '') === hash) return item;
      if (item.children) {
        const found = search(item.children);
        if (found) return found;
      }
    }
    return null;
  }
  for (const key of Object.keys(MOCKS)) {
    const found = search(MOCKS[key].items);
    if (found) return found;
  }
  return null;
}

function render() {
  if (!isAuthenticated()) {
    document.body.classList.add('guest-mode');
    return;
  }
  const list = document.getElementById('projectList');
  let html = '';
  for (const key of Object.keys(MOCKS)) {
    const project = MOCKS[key];
    const items = project.items.map(item => '<li>' + renderItem(item) + '</li>').join('');
    html += '<li><details><summary>' + project.label + '<span class="count">' + countItems(project.items) + '</span></summary><ul>' + items + '</ul></details></li>';
  }
  list.innerHTML = html;
}

function loadMock(file, name) {
  const viewer = document.getElementById('viewer');
  const empty = document.getElementById('emptyState');
  const title = document.getElementById('currentTitle');
  const copyBtn = document.getElementById('copyBtn');

  viewer.src = file;
  viewer.style.display = 'block';
  empty.style.display = 'none';
  title.innerHTML = '<strong>' + name + '</strong>';
  copyBtn.style.display = 'inline-block';

  document.querySelectorAll('.project-list a').forEach(a => {
    a.classList.toggle('active', a.dataset.file === file);
    if (a.dataset.file === file) {
      a.closest('details').open = true;
    }
  });
}

function routeFromHash() {
  const hash = window.location.hash.slice(1);
  const auth = isAuthenticated();
  if (!hash) {
    document.getElementById('viewer').style.display = 'none';
    const empty = document.getElementById('emptyState');
    empty.style.display = 'flex';
    empty.textContent = auth ? '← Open the sidebar to browse available mocks' : 'Open via a direct link to view the mock';
    document.getElementById('currentTitle').textContent = 'Select a mock';
    document.getElementById('copyBtn').style.display = 'none';
    if (auth) document.body.classList.remove('sidebar-hidden');
    return;
  }
  const item = findItemByHash(hash);
  if (item) loadMock(item.file, item.name);
}

function copyLink() {
  navigator.clipboard.writeText(window.location.href).then(() => {
    const btn = document.getElementById('copyBtn');
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = orig; }, 1500);
  });
}

document.addEventListener('click', (e) => {
  if (e.target.tagName === 'A' && e.target.dataset.file) {
    setTimeout(routeFromHash, 0);
  }
});
window.addEventListener('hashchange', routeFromHash);

render();
routeFromHash();
</script>
</body>
</html>
