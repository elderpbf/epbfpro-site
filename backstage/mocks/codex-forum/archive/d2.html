<!DOCTYPE html>
<html lang="pt-BR" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dossiê tabbed · D2 (rail vertical)</title>

<link rel="stylesheet" href="/codex/css/theme.css?v=1.1">
<link rel="stylesheet" href="/codex/css/backstage.css?v=1.0">
<link rel="stylesheet" href="/codex/css/tokens.css?v=1.2">
<link rel="stylesheet" href="/codex/css/codex.css?v=2.6">
<link rel="stylesheet" href="/codex/cohorts/cohorts.css?v=2.6">

<script src="/codex/js/theme-manager.js?v=1.0"></script>

<style>
  .mk-doss { max-width: 920px; margin: 1.5rem auto; padding: 0 1.25rem; }
  .mk-doss-pill { font-size: .72rem; font-weight: 700; padding: 2px 10px; border-radius: 999px;
    background: rgba(20,184,166,.14); color: var(--primary-dark); }
  .mk-split { display: grid; grid-template-columns: 190px 1fr; gap: 1.4rem; margin-top: 1.1rem; }
  .mk-rail { display: flex; flex-direction: column; gap: .15rem; border-right: 1px solid var(--border); padding-right: .6rem; }
  .mk-rail .cdx-subtab { justify-content: flex-start; padding: .5rem .7rem; border-radius: 9px; }
  .mk-tab-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 17px; height: 17px;
    padding: 0 5px; margin-left: auto; border-radius: 999px; background: var(--error); color: #fff; font-size: .62rem; font-weight: 800; }
  .mk-rail-sep { height: 1px; background: var(--border); margin: .35rem .2rem; }
  .mk-acc-row { display: flex; align-items: center; gap: .55rem; padding: .4rem 0; font-size: .9rem; color: var(--text-primary); }
  .mk-acc-row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--primary); }
  .mk-acc-row select { font: inherit; font-size: .84rem; padding: .25rem .5rem; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--text-primary); }
  .mk-acc-row--new { background: rgba(20,184,166,.07); border-radius: 8px; padding: .4rem .55rem; }
  .mk-new-tag { font-size: .58rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 999px;
    background: var(--primary); color: #fff; margin-left: .35rem; }
  .mk-h { font-size: .74rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--text-secondary); margin: 0 0 .7rem; }
  .mk-h:not(:first-child) { margin-top: 1.2rem; padding-top: 1rem; border-top: 1px solid var(--border); }
  .mk-gear { font-size: 1.05rem; }
</style>
</head>
<body>

<div class="bs-app">
  <header class="bs-topbar">
    <div class="bs-topbar-inner bs-topbar-inner--with-tabs">
      <a class="bs-topbar-logo" href="#" aria-label="PensoIA Codex"><span class="bs-topbar-name">PensoIA · Codex</span></a>
      <div class="bs-topbar-spacer"></div>
      <nav class="cdx-tabs" role="tablist" aria-label="Codex">
        <a class="cdx-tab cdx-tab--lessons" href="#"><span class="cdx-tab-label">Aula</span></a>
        <a class="cdx-tab cdx-tab--content" href="#"><span class="cdx-tab-label">Conteúdo</span></a>
        <a class="cdx-tab cdx-tab--cohorts active" href="#" aria-current="page"><span class="cdx-tab-label">Turmas</span></a>
        <a class="cdx-tab cdx-tab--questions" href="#"><span class="cdx-tab-label">Perguntas</span></a>
        <a class="cdx-tab cdx-tab--certificates" href="#"><span class="cdx-tab-label">Certificados</span></a>
      </nav>
      <div class="bs-topbar-spacer"></div>
      <button class="bs-icon-btn theme-toggle" id="themeToggle" aria-label="Alternar tema"><span id="themeIcon"></span></button>
      <button class="bs-icon-btn" aria-label="Configurações"><span class="mk-gear">⚙</span></button>
      <button class="bs-logout-btn">Sair</button>
    </div>
  </header>

  <main class="bs-main">
    <div class="cdx-view">
      <div class="mk-doss">
        <div class="cdx-doss">

          <div class="cdx-doss-head">
            <div class="cdx-doss-headmain">
              <h2 class="cdx-doss-title">IA na Prática Jurídica · Turma 2026.1</h2>
              <div class="cdx-doss-sub">Tribunal de Justiça · 12 participantes</div>
            </div>
            <div class="cdx-doss-headright">
              <span class="mk-doss-pill">Em andamento</span>
              <button class="cdx-btn cdx-btn-sm cdx-btn-danger">Arquivar</button>
            </div>
          </div>

          <!-- NOVO: rail vertical de abas à esquerda, conteúdo à direita -->
          <div class="mk-split">
            <nav class="mk-rail" role="tablist">
              <a class="cdx-subtab active" href="#">Dados</a>
              <a class="cdx-subtab" href="#">Participantes</a>
              <a class="cdx-subtab" href="#">Aulas</a>
              <a class="cdx-subtab" href="#">Certificados</a>
              <div class="mk-rail-sep"></div>
              <a class="cdx-subtab" href="#">Fórum <span class="mk-tab-badge">3</span></a>
            </nav>

            <div class="mk-pane">
              <p class="mk-h">Dados da turma</p>
              <div class="cdx-doss-facts">
                <div class="cdx-doss-fact cdx-doss-fact--course"><label>Curso</label><div class="v">IA na Prática Jurídica</div></div>
                <div class="cdx-doss-fact"><label>Carga</label><div class="v">16 h</div></div>
                <div class="cdx-doss-fact"><label>Encontros</label><div class="v">4</div></div>
                <div class="cdx-doss-fact"><label>Início</label><div class="v">12 mar 2026</div></div>
                <div class="cdx-doss-fact"><label>Fim</label><div class="v">02 abr 2026</div></div>
                <div class="cdx-doss-fact"><label>Formato</label><div class="v">Presencial</div></div>
              </div>

              <p class="mk-h">Acesso</p>
              <label class="mk-acc-row"><input type="checkbox" checked> <span>Exigir identificação (acesso controlado)</span></label>
              <label class="mk-acc-row"><span>Modo do gate</span>
                <select><option>Inline</option><option>Upfront</option></select>
              </label>
              <label class="mk-acc-row"><input type="checkbox" checked> <span>Certificados habilitados</span></label>
              <label class="mk-acc-row mk-acc-row--new"><input type="checkbox" checked> <span>Fórum da turma</span><span class="mk-new-tag">novo</span></label>
              <label class="mk-acc-row mk-acc-row--new"><input type="checkbox" checked> <span>Notificações (sino)</span><span class="mk-new-tag">novo</span></label>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>
</div>

<script>
  ThemeManager.init({ storageKey: 'bs_theme', toggleEl: document.getElementById('themeToggle'), iconEl: document.getElementById('themeIcon') });
</script>
</body>
</html>
