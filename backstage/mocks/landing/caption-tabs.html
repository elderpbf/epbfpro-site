<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caption tab — 6 ideias</title>
<style>
  :root{
    --bg:#0b1220; --panel:#121b2e; --ink:#e7eef7; --muted:#8aa0bd;
    --line:rgba(255,255,255,.10); --track:rgba(255,255,255,.12);
    --teal:#19c7ad; --teal-soft:#5eead4; --teal-glow:rgba(25,199,173,.55);
    --phone:#0f1626; --phone-screen:#0c1322; --phone-edge:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 800px at 50% -10%,#13203a,#0b1220 60%);
       color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       min-height:100vh;padding:40px 28px 80px}
  h1{font-weight:650;font-size:22px;margin:0 0 4px;text-align:center}
  .sub{color:var(--muted);text-align:center;margin:0 0 38px;font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px 36px;max-width:1180px;margin:0 auto}
  @media(max-width:960px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}
  .card{display:flex;flex-direction:column;align-items:center}
  .card .name{color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:18px}
  .stack{width:248px;display:flex;flex-direction:column;align-items:stretch}

  /* ---------- phone (shared) ---------- */
  .phone{width:248px;height:300px;background:var(--phone);border:1px solid var(--phone-edge);
         border-radius:26px;padding:10px;box-shadow:0 24px 60px -28px rgba(0,0,0,.8)}
  .phone.flush{border-top-left-radius:18px;border-top-right-radius:18px}
  .screen{height:100%;background:var(--phone-screen);border-radius:18px;overflow:hidden;position:relative;
          display:flex;flex-direction:column;gap:9px;padding:14px}
  .statusbar{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);opacity:.7}
  .q{font-size:12px;color:var(--ink);opacity:.85;margin-top:2px}
  .opt{height:26px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
  .opt.sel{background:rgba(25,199,173,.16);border-color:var(--teal)}
  .askbar{margin-top:auto;height:30px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid var(--line)}

  /* ---------- tab pieces (shared) ---------- */
  .label{font-weight:600;font-size:13.5px;color:var(--ink);white-space:nowrap;transition:opacity .35s}
  .label .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal);
              box-shadow:0 0 0 0 var(--teal-glow);margin-right:7px;vertical-align:middle;
              animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 var(--teal-glow)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

  .segs{display:flex;gap:6px}
  .seg{flex:1;height:5px;border-radius:99px;background:var(--track);transition:background .35s,box-shadow .35s}
  .seg.is-done{background:rgba(25,199,173,.4)}
  .seg.is-active{background:var(--teal);box-shadow:0 0 10px var(--teal-glow)}

  /* ===== 1. Connected folder tab ===== */
  .s1 .tab{align-self:center;width:200px;background:var(--panel);border:1px solid var(--phone-edge);border-bottom:none;
           border-radius:14px 14px 0 0;padding:11px 16px 12px;text-align:center;position:relative;z-index:2;margin-bottom:-1px}
  .s1 .tab .label{display:block;margin-bottom:9px}
  .s1 .segs{width:150px;margin:0 auto}

  /* ===== 2. Floating pill ===== */
  .s2 .tab{align-self:center;background:var(--panel);border:1px solid var(--phone-edge);
           border-radius:999px;padding:9px 18px;display:flex;align-items:center;gap:14px;margin-bottom:16px;
           box-shadow:0 12px 30px -18px rgba(0,0,0,.8)}
  .s2 .segs{width:74px;gap:5px}
  .s2 .seg{height:6px}

  /* ===== 3. Segmented underbar (minimal, no box) ===== */
  .s3 .tab{text-align:center;margin-bottom:16px}
  .s3 .label{display:block;margin-bottom:11px}
  .s3 .segs{width:210px;margin:0 auto;gap:8px}
  .s3 .seg{height:6px}

  /* ===== 4. Browser tab ===== */
  .s4 .tab{align-self:flex-start;margin-left:18px;background:var(--panel);border:1px solid var(--phone-edge);border-bottom:none;
           border-radius:10px 18px 0 0;padding:10px 20px 11px 14px;position:relative;z-index:2;margin-bottom:-1px;
           display:flex;flex-direction:column;gap:8px;min-width:180px}
  .s4 .tab .label{font-size:13px}
  .s4 .segs{gap:5px}
  .s4 .seg{height:4px}

  /* ===== 5. Ticket / perforated bottom ===== */
  .s5 .tab{align-self:center;width:210px;background:var(--panel);border:1px solid var(--phone-edge);
           border-radius:12px;padding:12px 16px 0;text-align:center;margin-bottom:16px;position:relative;overflow:hidden}
  .s5 .tab .label{display:block;margin-bottom:11px}
  .s5 .segs{gap:4px;padding-bottom:0;margin-bottom:-2px}
  .s5 .seg{height:8px;border-radius:6px 6px 0 0}

  /* ===== 6. Stepper rail ===== */
  .s6 .tab{align-self:center;width:220px;text-align:center;margin-bottom:16px}
  .s6 .label{display:block;margin-bottom:12px}
  .s6 .segs{position:relative;justify-content:space-between;gap:0}
  .s6 .segs::before{content:"";position:absolute;top:50%;left:6px;right:6px;height:2px;background:var(--track);transform:translateY(-50%)}
  .s6 .seg{flex:0 0 auto;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--track);position:relative;z-index:1}
  .s6 .seg.is-done{background:rgba(25,199,173,.5);border-color:transparent}
  .s6 .seg.is-active{background:var(--teal);border-color:var(--teal);box-shadow:0 0 10px var(--teal-glow)}

  .toggle{position:fixed;top:14px;right:18px;background:var(--panel);color:var(--muted);border:1px solid var(--line);
          border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer}
</style>
</head>
<body>
  <h1>Caption tab, 6 ideias</h1>
  <p class="sub">Cada tab fica acima do telefone (fora da caixa do demo). O rótulo troca e os segmentos avançam a cada beat, ao vivo.</p>

  <div class="grid" id="grid"></div>

  <script>
    const BEATS = ['Pergunta ao vivo','Respondendo','Perguntando ao instrutor','Pergunta respondida'];
    const TOTAL = BEATS.length;

    const phone = `
      <div class="phone">
        <div class="screen">
          <div class="statusbar"><span>9:41</span><span>PensoIA</span></div>
          <div class="q">Qual a melhor forma de revisar um prompt?</div>
          <div class="opt"></div>
          <div class="opt sel"></div>
          <div class="opt"></div>
          <div class="opt"></div>
          <div class="askbar"></div>
        </div>
      </div>`;

    const flushPhone = phone.replace('class="phone"','class="phone flush"');

    function segs(){ let s=''; for(let i=0;i<TOTAL;i++) s+='<span class="seg"></span>'; return `<div class="segs">${s}</div>`; }
    function labelDot(){ return `<span class="label"><span class="dot"></span><span class="txt">${BEATS[0]}</span></span>`; }
    function labelPlain(){ return `<span class="label"><span class="txt">${BEATS[0]}</span></span>`; }

    const styles = [
      {n:'1 · Tab conectada',  cls:'s1', html:`<div class="tab">${labelDot()}${segs()}</div>${flushPhone}`},
      {n:'2 · Pílula flutuante',cls:'s2', html:`<div class="tab">${labelDot()}${segs()}</div>${phone}`},
      {n:'3 · Barra segmentada',cls:'s3', html:`<div class="tab">${labelDot()}${segs()}</div>${phone}`},
      {n:'4 · Aba de navegador',cls:'s4', html:`<div class="tab">${labelDot()}${segs()}</div>${flushPhone}`},
      {n:'5 · Ticket perfurado',cls:'s5', html:`<div class="tab">${labelPlain()}${segs()}</div>${phone}`},
      {n:'6 · Trilho de etapas', cls:'s6', html:`<div class="tab">${labelDot()}${segs()}</div>${phone}`},
    ];

    const grid = document.getElementById('grid');
    grid.innerHTML = styles.map(s=>`
      <div class="card ${s.cls}">
        <div class="name">${s.n}</div>
        <div class="stack">${s.html}</div>
      </div>`).join('');

    let beat = 0;
    function render(){
      document.querySelectorAll('.txt').forEach(el=>{
        el.style.opacity = 0;
        setTimeout(()=>{ el.textContent = BEATS[beat]; el.style.opacity = 1; }, 180);
      });
      document.querySelectorAll('.segs').forEach(row=>{
        [...row.children].forEach((seg,i)=>{
          seg.classList.toggle('is-active', i===beat);
          seg.classList.toggle('is-done', i<beat);
        });
      });
    }
    render();
    setInterval(()=>{ beat=(beat+1)%TOTAL; render(); }, 2200);
  </script>
</body>
</html>
