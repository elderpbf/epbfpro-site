<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Finale v2 · Íris</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Lora:ital,wght@0,600;1,600&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{min-height:100vh;background:radial-gradient(120% 120% at 50% 24%,#0a2b63,#04122e 72%);color:#eaf2ff;font-family:'Inter',system-ui,sans-serif;overflow:hidden}
.tag{position:fixed;top:14px;left:16px;z-index:9;font:600 .7rem 'JetBrains Mono',monospace;color:#7c95c0;letter-spacing:.08em}
.replay{position:fixed;top:11px;right:16px;z-index:9;background:rgba(125,232,214,.1);border:1px solid rgba(125,232,214,.3);color:#5eead4;font:600 .74rem 'Inter';padding:7px 12px;border-radius:9px;cursor:pointer}
.stage{position:fixed;inset:0;display:grid;place-items:center}
.orb{position:absolute;left:50%;top:-8%;width:15px;height:15px;border-radius:50%;z-index:4;transform:translate(-50%,-50%);
  background:radial-gradient(circle,#fff 0%,#9ff3e2 38%,transparent 72%);
  box-shadow:0 0 24px 8px rgba(125,232,214,.55),0 0 58px 20px rgba(20,184,166,.5);
  transition:top 1.35s cubic-bezier(.5,0,.18,1),opacity .5s ease}
.orb.down{top:50%}
.orb.gone{opacity:0}
/* anel/abertura (íris) */
.ring{position:absolute;left:50%;top:50%;width:12px;height:12px;border-radius:50%;z-index:2;transform:translate(-50%,-50%);
  border:2px solid rgba(125,232,214,.85);box-shadow:0 0 40px 6px rgba(20,184,166,.45),inset 0 0 30px rgba(125,232,214,.3);opacity:0;
  transition:width 1.05s cubic-bezier(.3,0,.15,1),height 1.05s cubic-bezier(.3,0,.15,1),opacity .9s ease,border-color .9s ease}
.ring.open{width:820px;height:820px;opacity:1;border-color:rgba(125,232,214,.14);box-shadow:0 0 80px 14px rgba(20,184,166,.18),inset 0 0 120px rgba(125,232,214,.06)}
.ring.fade{opacity:0}
/* contatos revelados pela abertura circular (íris) */
.contacts{position:relative;z-index:3;text-align:center;max-width:580px;padding:0 22px;opacity:0;
  clip-path:circle(0% at 50% 50%);transition:clip-path 1.05s cubic-bezier(.3,0,.15,1),opacity .35s ease}
.contacts.show{opacity:1;clip-path:circle(150% at 50% 50%)}
.contacts.hide{opacity:0;transition:opacity .5s ease}
.eye{font:700 .72rem 'JetBrains Mono';letter-spacing:.18em;color:#5eead4;margin-bottom:13px}
h2{font-family:'Lora',serif;font-weight:600;font-size:clamp(2rem,5vw,3.1rem);letter-spacing:-.02em;line-height:1.1}
h2 i{color:#5eead4}
.tg{font:500 .86rem 'JetBrains Mono';color:#a9c2e6;margin:11px 0 28px}.tg b{color:#5eead4}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.row a{display:inline-flex;align-items:center;gap:8px;padding:13px 20px;border-radius:13px;border:1px solid rgba(125,232,214,.22);background:rgba(10,33,80,.55);backdrop-filter:blur(6px);color:#eaf2ff;font-weight:600;font-size:.9rem;text-decoration:none}
.row a.wa{background:linear-gradient(120deg,#14b8a6,#0d9488);color:#03201b;border-color:transparent}
.row svg{width:17px;height:17px}
@media(prefers-reduced-motion:reduce){.orb,.ring,.contacts{transition:none}}
</style>
</head>
<body>
<div class="tag">finale · v2 · íris</div>
<button class="replay">▶ repetir</button>
<div class="stage">
  <div class="ring" id="ring"></div>
  <div class="orb" id="orb"></div>
  <div class="contacts" id="cts">
    <div class="eye">VAMOS CONVERSAR</div>
    <h2>Me conta o seu <i>contexto</i></h2>
    <p class="tg">pensamento humano, <b>inteligência ampliada</b></p>
    <div class="row">
      <a class="wa" href="#"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M.06 24l1.68-6.1A11.9 11.9 0 1 1 12 24a11.9 11.9 0 0 1-5.7-1.45L.06 24z"/></svg>WhatsApp</a>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>contato@pensoia.com</a>
      <a href="#"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5A2.5 2.5 0 1 0 5 8.5a2.5 2.5 0 0 0-.02-5ZM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-.95 1.83-1.95 3.77-1.95 4.03 0 4.78 2.5 4.78 5.75V21h-4v-5c0-1.2-.02-2.74-1.67-2.74-1.67 0-1.93 1.3-1.93 2.65V21H9z"/></svg>LinkedIn</a>
    </div>
  </div>
</div>
<script>
const orb=document.getElementById('orb'),ring=document.getElementById('ring'),cts=document.getElementById('cts');
let timers=[];const T=(f,ms)=>timers.push(setTimeout(f,ms));
function reset(){timers.forEach(clearTimeout);timers=[];
  [orb,ring,cts].forEach(e=>e.style.transition='none');orb.className='orb';ring.className='ring';cts.className='contacts';
  void orb.offsetWidth;[orb,ring,cts].forEach(e=>e.style.transition='');}
function run(){
  reset();
  T(()=>orb.classList.add('down'),60);            // desce
  T(()=>{orb.classList.add('gone');ring.classList.add('open');cts.classList.add('show');},1450); // abre a íris e revela
  T(()=>{ring.classList.remove('open');ring.classList.add('fade');cts.classList.add('hide');},5600); // fecha
  T(run,6500);
}
document.querySelector('.replay').onclick=run;
run();
</script>
</body>
</html>
