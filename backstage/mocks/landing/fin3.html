<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Finale v3 · Partículas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Lora:ital,wght@0,600;1,600&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{min-height:100vh;background:radial-gradient(120% 120% at 50% 24%,#0a2b63,#04122e 72%);color:#eaf2ff;font-family:'Inter',system-ui,sans-serif;overflow:hidden}
.tag{position:fixed;top:14px;left:16px;z-index:9;font:600 .7rem 'JetBrains Mono',monospace;color:#7c95c0;letter-spacing:.08em}
.replay{position:fixed;top:11px;right:16px;z-index:9;background:rgba(125,232,214,.1);border:1px solid rgba(125,232,214,.3);color:#5eead4;font:600 .74rem 'Inter';padding:7px 12px;border-radius:9px;cursor:pointer}
#cv{position:fixed;inset:0;z-index:1}
.stage{position:fixed;inset:0;display:grid;place-items:center;z-index:3;pointer-events:none}
.contacts{text-align:center;max-width:580px;padding:0 22px;opacity:0;transform:scale(.94) translateY(8px);transition:opacity .8s ease,transform .9s cubic-bezier(.2,1,.3,1);pointer-events:auto}
.contacts.show{opacity:1;transform:none}
.eye{font:700 .72rem 'JetBrains Mono';letter-spacing:.18em;color:#5eead4;margin-bottom:13px}
h2{font-family:'Lora',serif;font-weight:600;font-size:clamp(2rem,5vw,3.1rem);letter-spacing:-.02em;line-height:1.1}
h2 i{color:#5eead4}
.tg{font:500 .86rem 'JetBrains Mono';color:#a9c2e6;margin:11px 0 28px}.tg b{color:#5eead4}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.row a{display:inline-flex;align-items:center;gap:8px;padding:13px 20px;border-radius:13px;border:1px solid rgba(125,232,214,.22);background:rgba(10,33,80,.55);backdrop-filter:blur(6px);color:#eaf2ff;font-weight:600;font-size:.9rem;text-decoration:none}
.row a.wa{background:linear-gradient(120deg,#14b8a6,#0d9488);color:#03201b;border-color:transparent}
.row svg{width:17px;height:17px}
</style>
</head>
<body>
<div class="tag">finale · v3 · partículas</div>
<button class="replay">▶ repetir</button>
<canvas id="cv"></canvas>
<div class="stage">
  <div class="contacts" id="cts">
    <div class="eye">VAMOS CONVERSAR</div>
    <h2>Me conta o seu <i>contexto</i></h2>
    <p class="tg">pensamento humano, <b>inteligência ampliada</b></p>
    <div class="row">
      <a class="wa" href="#"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M.06 24l1.68-6.1A11.9 11.9 0 1 1 12 24a11.9 11.9 0 0 1-5.7-1.45L.06 24z"/></svg>WhatsApp</a>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>contato@pensoia.com</a>
      <a href="#"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5A2.5 2.5 0 1 0 5 8.5a2.5 2.5 0 0 0-.02-5ZM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-.95 1.83-1.95 3.77-1.95 4.03 0 4.78 2.5 4.78 5.75V21h-4v-5c0-1.2-.02-2.74-1.67-2.74-1.67 0-1.93 1.3-1.93 2.65V21H9z"/></svg>LinkedIn</a>
    </div>
  </div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),cts=document.getElementById('cts');
let W,H;function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
size();addEventListener('resize',size);
let mode='descend',modeT=performance.now(),burstAt=0,parts=[];
function setMode(m){mode=m;modeT=performance.now();}
function spawn(cx,cy){parts=[];for(let i=0;i<100;i++){const a=Math.random()*Math.PI*2,sp=1.5+Math.random()*5.5;
  parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,r:1+Math.random()*2.2});}}
function orbDot(x,y,r){const g=ctx.createRadialGradient(x,y,0,x,y,r*5);g.addColorStop(0,'#fff');g.addColorStop(.35,'rgba(159,243,226,.9)');g.addColorStop(1,'rgba(20,184,166,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*5,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}
function frame(now){
  ctx.clearRect(0,0,W,H);const cx=W/2,cy=H/2;
  if(mode==='descend'){const p=Math.min(1,(now-modeT)/1250);const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;orbDot(cx,-20+(cy+20)*e,8+4*p);}
  else{
    const age=now-burstAt,g=Math.max(0,1-age/1500);
    if(g>0){const rad=260*Math.min(1,age/600+0.25);const grd=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);
      grd.addColorStop(0,'rgba(159,243,226,'+(.5*g)+')');grd.addColorStop(.5,'rgba(20,184,166,'+(.28*g)+')');grd.addColorStop(1,'rgba(20,184,166,0)');
      ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);}
    for(const q of parts){if(q.life<=0)continue;q.x+=q.vx;q.y+=q.vy;q.vx*=.965;q.vy*=.965;q.life-=.011;
      ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle='#9ff3e2';ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fill();}
    ctx.globalAlpha=1;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
let timers=[];const T=(f,ms)=>timers.push(setTimeout(f,ms));
function run(){
  timers.forEach(clearTimeout);timers=[];cts.classList.remove('show');setMode('descend');
  T(()=>{setMode('burst');burstAt=performance.now();spawn(W/2,H/2);},1250); // desce -> estoura no centro
  T(()=>cts.classList.add('show'),1600);                                     // contatos surgem no ponto da explosão
  T(()=>cts.classList.remove('show'),5500);
  T(run,6300);
}
document.querySelector('.replay').onclick=run;
run();
</script>
</body>
</html>
