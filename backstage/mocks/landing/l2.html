<!DOCTYPE html>
<html lang="pt-BR" data-theme="light" data-lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>PensoIA — pensamento humano, inteligência ampliada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&family=Lora:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   L2 — "O PAINEL"
   Concept: a single-screen board/console. Left = hero panel
   (photo + numbers + tagline). A vertical rail of sectors;
   choosing one reveals that sector's content on the right, no
   page scroll. A "ver tudo" control zooms the board out so you
   see it was one panel all along. The signature point of light
   rides the rail downward as you progress, and bursts into a
   supernova when you reach Contato.
   ============================================================ */
:root{
  --navy:#061a51; --teal:#14b8a6; --teal-dark:#0d9488; --teal-light:#5eead4;
  --accent:#7de8d6; --green:#047857;
  --ease:cubic-bezier(.22,.9,.3,1);
}
/* LIGHT (default, made as strong as dark) */
html[data-theme="light"]{
  --bg:#eaf1f7; --board:#f6fafd; --panel:#ffffff; --panel-2:#f1f7fb;
  --ink:#08214a; --ink-soft:#3c5778; --ink-faint:#6b85a6;
  --line:rgba(6,26,81,.12); --line-2:rgba(6,26,81,.20); --hair:rgba(6,26,81,.06);
  --teal-text:var(--teal-dark);
  --rail:linear-gradient(180deg,#0a2360,#06163f);
  --glow-a:rgba(20,184,166,.28); --glow-b:rgba(13,148,136,.30);
  --shadow:0 30px 70px -34px rgba(6,26,81,.40); --shadow-sm:0 14px 34px -20px rgba(6,26,81,.34);
  --chip:rgba(20,184,166,.10); --chip-brd:rgba(20,184,166,.30);
  --node:#0d9488;
}
html[data-theme="dark"]{
  --bg:#030f28; --board:#061a3d; --panel:#0a2150; --panel-2:#0c265c;
  --ink:#eaf2ff; --ink-soft:#9fb6e0; --ink-faint:#6f8cba;
  --line:rgba(125,232,214,.16); --line-2:rgba(125,232,214,.26); --hair:rgba(125,232,214,.07);
  --teal-text:var(--teal-light);
  --rail:linear-gradient(180deg,#06163f,#020c22);
  --glow-a:rgba(20,184,166,.42); --glow-b:rgba(94,234,212,.40);
  --shadow:0 36px 90px -42px rgba(0,0,0,.78); --shadow-sm:0 18px 44px -24px rgba(0,0,0,.66);
  --chip:rgba(94,234,212,.10); --chip-brd:rgba(94,234,212,.28);
  --node:#9ff3e2;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;transition:background .5s var(--ease),color .5s var(--ease);line-height:1.6;overflow:hidden}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
:focus-visible{outline:2.5px solid var(--teal);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mono{font-family:'JetBrains Mono',monospace}
.serif{font-family:'Lora',serif}

/* ============ BOARD SHELL ============ */
.board{position:fixed;inset:0;display:flex;flex-direction:column;padding:clamp(10px,1.6vw,20px);gap:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:4px 6px 14px}
.brand img{height:34px;width:auto}
.ctrl{display:flex;align-items:center;gap:8px}
.lang{display:inline-flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.lang button{border:none;background:transparent;color:var(--ink-faint);font-family:inherit;font-weight:700;font-size:.72rem;padding:6px 9px;border-radius:8px;cursor:pointer;transition:.2s}
.lang button[aria-pressed="true"]{background:linear-gradient(120deg,var(--teal),var(--teal-dark));color:#03122e}
.btn-ic{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:.92rem;cursor:pointer;display:grid;place-items:center;transition:.25s}
.btn-ic:hover{border-color:var(--teal);color:var(--teal-text);transform:translateY(-1px)}
.cta{background:linear-gradient(120deg,var(--teal),var(--teal-dark));color:#03122e;font-weight:700;font-size:.84rem;padding:10px 17px;border-radius:11px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 10px 26px -12px var(--glow-a);transition:.25s}
.cta:hover{transform:translateY(-2px)}
@media(max-width:640px){.brand img{height:28px}.cta span{display:none}}

/* main grid: rail + stage */
.main{flex:1;display:grid;grid-template-columns:300px 1fr;gap:clamp(10px,1.4vw,18px);min-height:0}
@media(max-width:980px){.main{grid-template-columns:1fr;grid-template-rows:auto 1fr}}

/* ============ THE RAIL (hero + sectors) ============ */
.rail{position:relative;border-radius:20px;background:var(--rail);color:#eaf2ff;overflow:hidden;display:flex;flex-direction:column;padding:24px 20px;box-shadow:var(--shadow)}
.rail::after{content:"";position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(70% 46% at 100% 0%,rgba(20,184,166,.30),transparent 60%),
  radial-gradient(60% 40% at 0% 100%,rgba(125,232,214,.12),transparent 60%)}
.rail>*{position:relative;z-index:2}
.rail .photo{width:74px;height:74px;border-radius:16px;object-fit:cover;border:2px solid rgba(94,234,212,.4);box-shadow:0 0 30px -6px var(--glow-a)}
.rail .who{margin-top:14px}
.rail .who b{font-size:1.04rem;font-weight:700;display:block}
.rail .who span{font-size:.76rem;color:#bcd0f5;display:block;margin-top:3px}
.rail .tag{margin-top:14px;font-family:'JetBrains Mono',monospace;font-size:.72rem;color:#a9c1ee;letter-spacing:.02em}
.rail .tag b{color:var(--teal-light)}
.mini-stats{display:flex;gap:8px;margin:16px 0 4px}
.mini-stats .ms{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 8px;text-align:center}
.mini-stats .ms b{font-family:'Lora',serif;font-weight:600;font-size:1.15rem;color:var(--teal-light);line-height:1;display:block}
.mini-stats .ms span{font-size:.62rem;color:#aec3ee;display:block;margin-top:5px;line-height:1.2}

/* sector nav with light rail */
.nav{margin-top:20px;position:relative;display:flex;flex-direction:column;gap:3px;flex:1;min-height:0}
.nav .line{position:absolute;left:19px;top:8px;bottom:8px;width:2px;background:rgba(125,232,214,.18);border-radius:2px}
.nav .line .fill{position:absolute;left:0;top:0;width:100%;height:0;background:linear-gradient(180deg,var(--teal-light),var(--teal));border-radius:2px;transition:height .5s var(--ease)}
.nav .spark{position:absolute;left:50%;top:0;width:11px;height:11px;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,#fff,var(--teal-light) 40%,transparent 72%);box-shadow:0 0 16px 4px var(--glow-b);transition:top .5s var(--ease)}
.navbtn{display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;width:100%;background:transparent;border:none;color:#dbe7ff;padding:11px 12px 11px 0;border-radius:11px;transition:.25s;position:relative;z-index:2}
.navbtn .dot{flex:none;width:38px;display:grid;place-items:center}
.navbtn .dot i{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(125,232,214,.4);transition:.25s;display:block}
.navbtn .lb{font-size:.92rem;font-weight:600;transition:.2s}
.navbtn .lb small{display:block;font-size:.7rem;color:#9fb6e0;font-weight:500}
.navbtn:hover{background:rgba(255,255,255,.05)}
.navbtn:hover .lb{transform:translateX(2px)}
.navbtn[aria-current="true"] .dot i{background:var(--teal-light);border-color:var(--teal-light);box-shadow:0 0 14px 2px var(--glow-b)}
.navbtn[aria-current="true"] .lb{color:#fff}
.rail-foot{margin-top:14px;display:flex;gap:8px}
.zoomout{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;font-size:.78rem;font-weight:600;color:#cfe0ff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:11px;padding:11px;cursor:pointer;transition:.2s}
.zoomout:hover{background:rgba(255,255,255,.14);border-color:var(--teal-light)}

/* ============ THE STAGE ============ */
.stage{position:relative;border-radius:20px;background:var(--board);border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow);min-height:0}
.stage-scroll{position:absolute;inset:0;overflow-y:auto;padding:clamp(22px,3vw,44px)}
.stage-scroll::-webkit-scrollbar{width:9px}
.stage-scroll::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px}
#supernova{position:absolute;inset:0;z-index:1;pointer-events:none}

/* crumb */
.crumb{display:flex;align-items:center;gap:9px;font-size:.74rem;color:var(--ink-faint);margin-bottom:10px;font-family:'JetBrains Mono',monospace}
.crumb .now{color:var(--teal-text);font-weight:600}
.crumb .pulse{width:6px;height:6px;border-radius:50%;background:var(--teal)}

/* panel content fade/slide swap */
#panel{position:relative;z-index:2;transition:opacity .4s ease,transform .4s var(--ease);max-width:860px}
#panel.swap{opacity:0;transform:translateY(16px)}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--teal-text);display:flex;align-items:center;gap:9px;margin-bottom:12px}
.eyebrow::before{content:"";width:20px;height:2px;background:var(--teal);border-radius:2px}
.p-h{font-family:'Lora',serif;font-weight:600;letter-spacing:-.015em;line-height:1.08;font-size:clamp(1.9rem,4vw,3rem);max-width:20ch}
.p-h .em{color:var(--teal-text);font-style:italic}
.p-lead{margin-top:14px;font-size:clamp(1rem,1.6vw,1.15rem);color:var(--ink-soft);max-width:58ch}
.block{margin-top:30px}

/* generic cards used by sectors */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:6px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow-sm)}
.tile .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--chip);border:1px solid var(--chip-brd);color:var(--teal-text);margin-bottom:12px}
.tile .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
.tile h4{font-size:1.02rem;font-weight:700;margin-bottom:5px}
.tile p{font-size:.9rem;color:var(--ink-soft)}
.tile ul{list-style:none;margin-top:10px;display:grid;gap:7px}
.tile li{font-size:.85rem;color:var(--ink-soft);display:flex;gap:9px}
.tile li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--teal);margin-top:8px}

/* steps row */
.rows{margin-top:6px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow-sm)}
.row{display:flex;gap:16px;padding:16px 20px;align-items:flex-start}
.row+.row{border-top:1px solid var(--hair)}
.row .n{font-family:'Lora',serif;font-weight:600;font-size:1rem;color:var(--teal-text);width:28px;flex:none}
.row h4{font-size:.98rem;font-weight:700}
.row p{font-size:.86rem;color:var(--ink-soft);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}
.chips .c{font-size:.78rem;font-weight:600;color:var(--teal-text);background:var(--chip);border:1px solid var(--chip-brd);border-radius:100px;padding:8px 14px}

/* platform sub-tabs + animated print */
.plat-head{display:flex;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:13px;padding:5px;margin:6px 0 18px;width:fit-content}
.plat-head button{border:none;background:transparent;color:var(--ink-soft);font-family:inherit;font-weight:600;font-size:.84rem;padding:9px 16px;border-radius:9px;cursor:pointer;transition:.25s;display:inline-flex;align-items:center;gap:7px}
.plat-head button .d{width:7px;height:7px;border-radius:50%;background:var(--teal)}
.plat-head button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow-sm)}
.plat-body{display:grid;grid-template-columns:1fr 280px;gap:28px;align-items:center}
@media(max-width:760px){.plat-body{grid-template-columns:1fr;justify-items:center;text-align:center}}
.plat-body .when{display:inline-flex;align-items:center;gap:7px;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-text);background:var(--chip);border:1px solid var(--chip-brd);border-radius:100px;padding:6px 11px;margin-bottom:12px}
.plat-body h4{font-family:'Lora',serif;font-weight:600;font-size:1.4rem;margin-bottom:8px}
.plat-body>div>p{font-size:.94rem;color:var(--ink-soft);margin-bottom:14px}
.pfeats{list-style:none;display:flex;flex-direction:column;gap:9px}
.pfeats li{display:flex;gap:10px;font-size:.88rem;color:var(--ink-soft)}
.pfeats .tk{flex:none;width:19px;height:19px;border-radius:6px;background:var(--chip);color:var(--teal-text);display:grid;place-items:center;font-size:.66rem;font-weight:800;margin-top:1px}
.shots{position:relative;width:min(248px,80%);aspect-ratio:9/18;justify-self:center}
.device{position:absolute;inset:0;border:8px solid var(--panel);border-radius:34px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow),0 0 60px -22px var(--glow-b)}
.device img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;opacity:0;transition:opacity .6s ease,transform .6s var(--ease);transform:scale(1.04)}
.device img.on{opacity:1;transform:none}
.shot-dots{display:flex;gap:7px;justify-content:center;margin-top:14px}
.shot-dots button{width:8px;height:8px;border-radius:50%;border:none;background:var(--line-2);cursor:pointer;padding:0;transition:.25s}
.shot-dots button[aria-current="true"]{background:var(--teal);transform:scale(1.3)}

/* certificate */
.cert-wrap{display:grid;grid-template-columns:1fr 300px;gap:28px;align-items:center;margin-top:6px}
@media(max-width:760px){.cert-wrap{grid-template-columns:1fr}}
.cert-card{position:relative;border-radius:18px;border:1px solid var(--line);background:linear-gradient(155deg,var(--panel),var(--panel-2));box-shadow:var(--shadow-sm);padding:28px;overflow:hidden}
.cert-card::after{content:"";position:absolute;inset:0;background:radial-gradient(360px 240px at 90% 6%,var(--glow-b),transparent 60%);pointer-events:none}
.seal{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--teal),var(--teal-dark));box-shadow:0 0 34px -6px var(--glow-a);margin-bottom:16px;position:relative;z-index:1}
.seal svg{width:32px;height:32px;fill:none;stroke:#03122e;stroke-width:1.8}
.cert-card h4{font-family:'Lora',serif;font-weight:600;font-size:1.3rem;margin-bottom:6px;position:relative;z-index:1}
.cert-card p{font-size:.92rem;color:var(--ink-soft);position:relative;z-index:1}
.cert-meta{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px;position:relative;z-index:1}
.cert-meta span{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--teal-text);background:var(--chip);border:1px solid var(--chip-brd);padding:6px 10px;border-radius:8px}

/* contact sector */
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.cbtn{display:inline-flex;align-items:center;gap:9px;font-weight:700;font-size:.92rem;padding:14px 22px;border-radius:12px;cursor:pointer;transition:.25s;border:1px solid transparent}
.cbtn.wa{background:linear-gradient(120deg,var(--teal),var(--teal-dark));color:#03122e;box-shadow:0 14px 32px -16px var(--glow-a)}
.cbtn.wa:hover{transform:translateY(-2px)}
.cbtn.ghost{background:transparent;border-color:var(--line-2);color:var(--ink)}
.cbtn.ghost:hover{border-color:var(--teal);transform:translateY(-2px)}
.cbtn svg{width:18px;height:18px}
.socials{display:flex;gap:10px;margin-top:18px}
.socials a{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-soft);background:var(--panel);transition:.25s}
.socials a:hover{border-color:var(--teal);color:var(--teal-text);transform:translateY(-2px)}
.socials svg{width:19px;height:19px}

/* ============ ZOOMED-OUT BOARD VIEW ============ */
.allview{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);
  display:none;padding:clamp(16px,3vw,40px);overflow:auto}
.allview.show{display:block;animation:fade .4s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.allview .av-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;max-width:1200px;margin-inline:auto}
.allview .av-head h3{font-family:'Lora',serif;font-weight:600;font-size:1.4rem}
.allview .av-head p{font-size:.86rem;color:var(--ink-soft);margin-top:2px}
.av-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:1200px;margin:0 auto}
@media(max-width:900px){.av-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.av-grid{grid-template-columns:1fr}}
.av-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;cursor:pointer;transition:.3s;position:relative;overflow:hidden;box-shadow:var(--shadow-sm)}
.av-card:hover{transform:translateY(-4px);border-color:var(--teal);box-shadow:var(--shadow)}
.av-card .tag{font-family:'JetBrains Mono',monospace;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-text)}
.av-card h4{font-family:'Lora',serif;font-weight:600;font-size:1.15rem;margin:8px 0 6px}
.av-card p{font-size:.86rem;color:var(--ink-soft)}
.av-close{font-family:inherit;font-size:.82rem;font-weight:600;color:var(--ink);background:var(--panel);border:1px solid var(--line-2);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.2s}
.av-close:hover{border-color:var(--teal);color:var(--teal-text)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#panel.swap{opacity:1;transform:none}}
@media(max-width:980px){
  body{overflow:auto}
  .board{position:relative;min-height:100vh}
  .stage{min-height:62vh}
  .nav{flex-direction:row;overflow-x:auto;gap:6px}
  .nav .line{display:none}
  .navbtn{flex:none;flex-direction:column;align-items:flex-start;background:rgba(255,255,255,.05);padding:10px 12px;border:1px solid rgba(255,255,255,.12)}
  .navbtn .dot{display:none}
}
</style>
</head>
<body>
<div class="board">
  <!-- TOPBAR -->
  <div class="topbar">
    <a class="brand" href="#" aria-label="PensoIA"><img id="logo" src="../../../images/brand/glyph-wordmark_bg.transp.svg" alt="PensoIA"></a>
    <div class="ctrl">
      <div class="lang" role="group" aria-label="Idioma">
        <button data-lang="pt" aria-pressed="true">PT</button>
        <button data-lang="en" aria-pressed="false">EN</button>
        <button data-lang="es" aria-pressed="false">ES</button>
      </div>
      <button class="btn-ic" id="theme" aria-label="Alternar tema">🌙</button>
      <a class="cta" href="https://wa.me/557998014253" target="_blank" rel="noopener"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M.06 24l1.68-6.1A11.9 11.9 0 1 1 12 24a11.9 11.9 0 0 1-5.7-1.45L.06 24zM6.6 20.1l.36.2a9.9 9.9 0 1 0-3.4-3.3l.23.37-1 3.6 3.8-.87z"/></svg><span data-i18n="nav.cta">Conversar</span></a>
    </div>
  </div>

  <div class="main">
    <!-- ============ RAIL ============ -->
    <aside class="rail">
      <img class="photo" src="../../../images/profile.jpg" alt="Élder Prudente Barbosa Filho">
      <div class="who">
        <b>Élder Prudente Barbosa Filho</b>
        <span data-i18n="rail.role">Direito + Análise e Desenvolvimento de Sistemas</span>
      </div>
      <p class="tag">pensamento humano, <b>inteligência ampliada</b></p>
      <div class="mini-stats">
        <div class="ms"><b>600+</b><span data-i18n="rail.s1">já formados</span></div>
        <div class="ms"><b>~11</b><span data-i18n="rail.s2">anos no TJSE</span></div>
        <div class="ms"><b>2</b><span data-i18n="rail.s3">formações</span></div>
      </div>

      <nav class="nav" id="nav" aria-label="Setores">
        <div class="line" aria-hidden="true"><div class="fill" id="navFill"></div></div>
        <div class="spark" id="navSpark" aria-hidden="true"></div>
        <!-- buttons injected -->

/* ====================== STATE ====================== */
let LANG='pt', current='inicio';
let curPlat='pulso', curShot=0, shotTimer=null;
const $=s=>document.querySelector(s);
function theme(){return document.documentElement.getAttribute('data-theme');}

/* ====================== NAV BUILD ====================== */
function buildNav(){
  const nav=$('#nav');
  // keep line + spark, append buttons
  nav.querySelectorAll('.navbtn').forEach(b=>b.remove());
  SECTORS.forEach(key=>{
    const b=document.createElement('button');
    b.className='navbtn';b.dataset.sec=key;b.setAttribute('aria-current',String(key===current));
    b.innerHTML=`<span class="dot"><i></i></span><span class="lb">${I18N[LANG]['n.'+key]}<small>${I18N[LANG]['n.'+key+'.s']}</small></span>`;
    b.addEventListener('click',()=>select(key));
    nav.appendChild(b);
  });
  positionSpark();
}
function positionSpark(){
  const idx=SECTORS.indexOf(current);
  const btns=document.querySelectorAll('.navbtn');
  if(!btns.length)return;
  const line=document.querySelector('.nav .line');
  if(!line||!line.offsetParent){return;} // hidden on mobile layout
  const nav=$('#nav'); const navRect=nav.getBoundingClientRect();
  const lineRect=line.getBoundingClientRect();
  // spark sits at the current dot, measured against the nav box
  const target=btns[idx].querySelector('.dot i').getBoundingClientRect();
  const sparkTop=target.top-navRect.top+target.height/2;
  $('#navSpark').style.top=sparkTop+'px';
  // fill grows inside the track, measured against the track box
  const fillTop=target.top-lineRect.top+target.height/2;
  $('#navFill').style.height=Math.max(0,fillTop)+'px';
}

/* ====================== RENDER PANEL ====================== */
function paint(key){
  $('#crumbNow').textContent=I18N[LANG]['n.'+key];
  $('#panel').innerHTML=C[LANG][key];
  if(key==='plataformas'){ wirePlat(); }
  if(key==='contato'){ fireNova(); } else { stopNova(); }
  $('#stageScroll').scrollTop=0;
}
function select(key){
  if(key===current && $('#panel').innerHTML.trim()){return;}
  current=key;
  document.querySelectorAll('.navbtn').forEach(b=>b.setAttribute('aria-current',String(b.dataset.sec===key)));
  positionSpark();
  const p=$('#panel'); const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduce){paint(key);return;}
  p.classList.add('swap');
  setTimeout(()=>{paint(key);requestAnimationFrame(()=>p.classList.remove('swap'));},240);
}

/* ====================== PLATFORM SUB-TABS + SHOTS ====================== */
function wirePlat(){
  curPlat='pulso';curShot=0;
  document.querySelectorAll('.plat-head button').forEach(b=>b.addEventListener('click',()=>{curPlat=b.dataset.plat;curShot=0;renderPlat();}));
  renderPlat();
}
function renderPlat(){
  $('#platName').textContent=PLAT_NAME[LANG][curPlat];
  $('#platWhen').textContent=PLAT_WHEN[LANG][curPlat];
  $('#platDesc').textContent=PLAT_DESC[LANG][curPlat];
  $('#platFeats').innerHTML=PLAT_FEATS[curPlat][LANG].map(f=>`<li><span class="tk">✓</span><span>${f}</span></li>`).join('');
  document.querySelectorAll('.plat-head button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.plat===curPlat)));
  renderShots();
}
function renderShots(){
  const dark=theme()==='dark'; const list=SHOTS[curPlat];
  $('#device').innerHTML=list.map((base,i)=>`<img src="../../../images/app/${base}-${dark?'dark':'light'}.jpg" alt="${PLAT_NAME[LANG][curPlat]}" class="${i===curShot?'on':''}">`).join('');
  const dots=$('#shotDots');
  dots.innerHTML=list.map((b,i)=>`<button aria-current="${i===curShot}" aria-label="${i+1}"></button>`).join('');
  dots.querySelectorAll('button').forEach((b,i)=>b.addEventListener('click',()=>{curShot=i;updateShot();restartShot();}));
  restartShot();
}
function updateShot(){
  document.querySelectorAll('#device img').forEach((im,i)=>im.classList.toggle('on',i===curShot));
  document.querySelectorAll('#shotDots button').forEach((b,i)=>b.setAttribute('aria-current',String(i===curShot)));
}
function restartShot(){
  clearInterval(shotTimer);
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  shotTimer=setInterval(()=>{if(current!=='plataformas')return;curShot=(curShot+1)%SHOTS[curPlat].length;updateShot();},3400);
}

/* ====================== SUPERNOVA (fires on Contato) ====================== */
let novaActive=false, novaRAF=null, parts=[];
function fireNova(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const c=$('#supernova'),ctx=c.getContext('2d');
  let DPR=Math.min(devicePixelRatio||1,2);
  c.width=c.offsetWidth*DPR;c.height=c.offsetHeight*DPR;
  const cx=c.width*.5, cy=c.height*.42;
  const NODE=theme()==='dark'?'125,232,214':'13,148,136';
  parts=[];
  for(let i=0;i<140;i++){const a=Math.random()*Math.PI*2,sp=(Math.random()*4+1)*DPR;parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,r:(Math.random()*2+1)*DPR});}
  novaActive=true;cancelAnimationFrame(novaRAF);let t=0;
  function frame(){
    ctx.clearRect(0,0,c.width,c.height);
    const fl=Math.max(0,1-t/34);
    if(fl>0){const g=ctx.createRadialGradient(cx,cy,0,cx,cy,200*DPR*(1+t/22));g.addColorStop(0,'rgba(255,255,255,'+(fl*.45)+')');g.addColorStop(.4,'rgba('+NODE+','+(fl*.4)+')');g.addColorStop(1,'rgba('+NODE+',0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,210*DPR*(1+t/22),0,7);ctx.fill();}
    for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.vy*=.985;p.life-=.011;if(p.life<0)p.life=0;ctx.fillStyle='rgba('+NODE+','+(p.life*.9)+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,7);ctx.fill();}
    t++;
    if(novaActive&&parts.some(p=>p.life>0))novaRAF=requestAnimationFrame(frame);
  }
  frame();
}
function stopNova(){novaActive=false;cancelAnimationFrame(novaRAF);const c=$('#supernova');c.getContext('2d').clearRect(0,0,c.width,c.height);}

   es:{inicio:"La propuesta y la promesa, en pocas líneas.",sobre:"Derecho + Sistemas, ~11 años en el Judicial.",oferta:"Cursos, consultoría y repertorio que queda.",metodo:"De los fundamentos a tu repertorio de prompts.",plataformas:"Pulso y Ruta, apoyo durante y después.",certificado:"Validado por el sitio al concluir.",contato:"WhatsApp, correo y redes."}

/* ====================== LANG & THEME ====================== */
const LOGO_LIGHTBG="../../../images/brand/glyph-wordmark_bg.transp.svg";
const LOGO_DARKBG="../../../images/brand/glyph-wordmark_bg.navy.svg";
function applyStatic(){
  document.documentElement.lang=LANG==='pt'?'pt-BR':LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(I18N[LANG][k]!=null)el.textContent=I18N[LANG][k];});
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===LANG)));
}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{
  LANG=b.dataset.lang;applyStatic();buildNav();paint(current);
}));
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  const dark=t==='dark';
  const logo=dark?LOGO_DARKBG:LOGO_LIGHTBG;
  $('#logo').src=logo;
  $('#theme').textContent=dark?'☀️':'🌙';
  if(current==='plataformas')renderShots();
  if(current==='contato')fireNova();
}
$('#theme').addEventListener('click',()=>setTheme(theme()==='dark'?'light':'dark'));

addEventListener('resize',()=>{positionSpark();if(current==='contato')fireNova();},{passive:true});

/* ====================== INIT ====================== */
setTheme(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');

buildNav();
