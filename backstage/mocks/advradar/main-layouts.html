<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>advradar — opções de layout</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #eef1f4; color: #0f172a; }

  /* ── Mock control bar (NOT part of the app design) ─────────────── */
  .mockbar {
    position: sticky; top: 0; z-index: 100;
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
    padding: 10px 16px; background: #0f172a; color: #e2e8f0;
    box-shadow: 0 2px 12px rgba(0,0,0,.25);
  }
  .mockbar .title { font-weight: 700; letter-spacing: .02em; }
  .mockbar .grp { display: flex; align-items: center; gap: 6px; }
  .mockbar .glabel { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; opacity: .6; }
  .seg { display: inline-flex; background: #1e293b; border-radius: 8px; padding: 2px; }
  .seg button {
    border: 0; background: transparent; color: #cbd5e1; font: inherit; font-size: 13px;
    font-weight: 600; padding: 5px 11px; border-radius: 6px; cursor: pointer;
  }
  .seg button.on { background: #14b8a6; color: #042f2a; }
  .caption {
    padding: 9px 16px; background: #134e4a; color: #d1faf3; font-size: 13px;
  }

  .stage { padding: 20px; display: flex; justify-content: center; }
  .preview {
    width: 100%; max-width: 1180px; height: 760px;
    border: 1px solid #cbd5e1; border-radius: 14px; overflow: hidden;
    background: var(--avr-bg); box-shadow: 0 14px 48px rgba(0,0,0,.2);
  }
  .preview.w-mobile { width: 390px; }

  /* ── advradar theme tokens (ported teal theme) ─────────────────── */
  .preview.theme-light {
    --avr-bg:#d4f4ed; --avr-surface:#ffffff; --avr-border:#e2e8f0;
    --avr-text:#134e4a; --avr-muted:#115e59; --avr-accent:#14b8a6;
    --avr-soft:rgba(20,184,166,.10); --avr-shadow:rgba(20,184,166,.12);
  }
  .preview.theme-dark {
    --avr-bg:#0f1419; --avr-surface:#1a1f26; --avr-border:#0f766e;
    --avr-text:#e5e7eb; --avr-muted:#d1d5db; --avr-accent:#2dd4bf;
    --avr-soft:rgba(20,184,166,.18); --avr-shadow:rgba(0,0,0,.35);
  }

  /* ── App shell ─────────────────────────────────────────────────── */
  .app {
    position: relative; height: 100%; display: flex; flex-direction: column;
    background: var(--avr-bg); color: var(--avr-text);
  }
  .top { background: var(--avr-surface); border-bottom: 1px solid var(--avr-border); box-shadow: 0 2px 10px var(--avr-shadow); }
  /* corner to corner: full width, just side padding, no max-width */
  .top-in { display: flex; align-items: center; gap: 12px; height: 58px; padding: 0 18px; }
  .brand { display: inline-flex; align-items: center; gap: 9px; text-decoration: none; }
  .mark { color: var(--avr-accent); display: inline-flex; }
  .bname { font-family: 'Comfortaa', sans-serif; font-weight: 700; font-size: 20px; color: var(--avr-text); letter-spacing: -.01em; }
  .sp { flex: 1; }
  .who { font-size: 13px; color: var(--avr-muted); white-space: nowrap; max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
  .iconbtn {
    display: inline-flex; align-items: center; gap: 6px; justify-content: center;
    border: 1px solid var(--avr-border); background: transparent; color: var(--avr-muted);
    border-radius: 8px; padding: 7px 10px; cursor: pointer; font: inherit; font-size: 13px;
  }
  .iconbtn:hover { color: var(--avr-text); border-color: var(--avr-muted); }
  .iconbtn svg { width: 17px; height: 17px; }

  /* topbar tabs (layout C) */
  .tabs { display: flex; gap: 4px; margin-left: 6px; overflow-x: auto; }
  .tab { display: inline-flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 8px; color: var(--avr-muted); font-weight: 600; font-size: 14px; white-space: nowrap; cursor: pointer; }
  .tab.on { color: var(--avr-accent); background: var(--avr-soft); }

  .body { flex: 1; min-height: 0; display: grid; overflow: hidden; }
  .layout-a .body { grid-template-columns: 216px 1fr 264px; }
  .layout-b .body { grid-template-columns: 216px 1fr; }
  .layout-c .body { grid-template-columns: 264px 1fr; }
  .w-mobile .body { grid-template-columns: 1fr; }

  .aside { background: var(--avr-surface); overflow: auto; padding: 14px; }
  .nav-aside { border-right: 1px solid var(--avr-border); }
  .layout-c .filt-aside { border-right: 1px solid var(--avr-border); }
  .layout-a .filt-aside { border-left: 1px solid var(--avr-border); }
  .w-mobile .nav-aside, .w-mobile .filt-aside { display: none; }

  .asec { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--avr-muted); margin: 2px 4px 10px; font-weight: 700; }

  .nlink { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 8px; color: var(--avr-muted); font-weight: 600; cursor: pointer; font-size: 14px; }
  .nlink + .nlink { margin-top: 2px; }
  .nlink.on { color: var(--avr-accent); background: var(--avr-soft); }
  .nlink svg { width: 18px; height: 18px; }

  .main { overflow: auto; padding: 16px 18px; }
  .ptitle { margin: 0 0 2px; font-size: 19px; font-weight: 700; }
  .psub { margin: 0 0 14px; color: var(--avr-muted); font-size: 13px; }

  /* filters */
  .filt-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 14px; background: var(--avr-surface); border: 1px solid var(--avr-border); border-radius: 12px; margin-bottom: 14px; }
  .fgroup { margin-bottom: 14px; }
  .filt-top .fgroup { margin-bottom: 0; }
  .flabel { font-size: 12px; color: var(--avr-muted); margin-bottom: 6px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .fchip { padding: 4px 10px; border: 1px solid var(--avr-border); border-radius: 999px; background: var(--avr-surface); color: var(--avr-muted); font-size: 12px; cursor: pointer; }
  .fchip.on { background: var(--avr-soft); color: var(--avr-accent); border-color: var(--avr-accent); font-weight: 600; }
  .finput { width: 100%; padding: 8px 10px; border: 1px solid var(--avr-border); border-radius: 8px; background: var(--avr-bg); color: var(--avr-text); font: inherit; font-size: 13px; }
  .ftog { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--avr-text); cursor: pointer; }
  .fclear { margin-top: 4px; border: 1px solid var(--avr-border); background: transparent; color: var(--avr-muted); border-radius: 8px; padding: 7px 12px; font: inherit; font-size: 13px; cursor: pointer; }

  /* cards */
  .list { display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--avr-surface); border: 1px solid var(--avr-border); border-radius: 12px; box-shadow: 0 1px 3px var(--avr-shadow); padding: 14px 16px; }
  .chead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 7px; }
  .ctrib { font-weight: 700; color: var(--avr-accent); background: var(--avr-soft); padding: 2px 8px; border-radius: 6px; font-size: 12px; }
  .ctipo { font-size: 12px; color: var(--avr-muted); }
  .cdate { margin-left: auto; font-size: 12px; color: var(--avr-muted); }
  .cproc { font-size: 13px; color: var(--avr-muted); }
  .cproc b { color: var(--avr-text); }
  .cpartes { font-size: 13px; margin: 4px 0; }
  .cbody { margin: 8px 0 10px; font-size: 13px; color: var(--avr-text); }
  .cdead { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #b45309; background: rgba(245,158,11,.14); padding: 3px 9px; border-radius: 999px; }
  .theme-dark .cdead { color: #fcd34d; }
  .cdead.soon { color: #b91c1c; background: rgba(239,68,68,.14); }
  .theme-dark .cdead.soon { color: #fca5a5; }
  .clink { display: inline-block; margin-top: 10px; font-size: 13px; font-weight: 600; color: var(--avr-accent); text-decoration: none; }

  .group-h { display: flex; align-items: baseline; gap: 8px; margin: 18px 0 8px; }
  .group-h:first-child { margin-top: 0; }
  .group-h b { font-size: 14px; }
  .group-h .cnt { font-size: 12px; color: var(--avr-muted); }

  /* config page */
  .field { margin-bottom: 14px; max-width: 420px; }
  .field label { display: block; font-size: 12px; color: var(--avr-muted); margin-bottom: 6px; font-weight: 600; }
  .field input { width: 100%; padding: 9px 11px; border: 1px solid var(--avr-border); border-radius: 8px; background: var(--avr-surface); color: var(--avr-text); font: inherit; }

  /* mobile drawers */
  .drawer { position: absolute; top: 0; bottom: 0; width: 270px; background: var(--avr-surface); z-index: 30; overflow: auto; padding: 14px; transition: transform .22s ease; }
  .drawer.nav { left: 0; border-right: 1px solid var(--avr-border); transform: translateX(-100%); }
  .drawer.filt { right: 0; border-left: 1px solid var(--avr-border); transform: translateX(100%); }
  .app.draweropen .drawer.nav { transform: none; }
  .app.filtopen .drawer.filt { transform: none; }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.4); z-index: 20; display: none; }
  .app.draweropen .scrim, .app.filtopen .scrim { display: block; }
  .w-desktop .drawer, .w-desktop .scrim, .w-desktop .ham, .w-desktop .filtbtn { display: none !important; }
  .ham, .filtbtn { display: none; }
  .w-mobile .ham, .w-mobile .filtbtn { display: inline-flex; }
  .w-mobile.layout-c .ham { display: none; }
</style>
</head>
<body>
  <div class="mockbar">
    <span class="title">advradar · layouts</span>
    <div class="grp"><span class="glabel">Layout</span>
      <div class="seg" id="segLayout">
        <button data-v="a" class="on">A · nav esq + filtros dir</button>
        <button data-v="b">B · nav esq + filtros no topo</button>
        <button data-v="c">C · abas no topo + filtros esq</button>
      </div>
    </div>
    <div class="grp"><span class="glabel">Página</span>
      <div class="seg" id="segPage">
        <button data-v="pub" class="on">Publicações</button>
        <button data-v="prazos">Prazos</button>
        <button data-v="proc">Processos</button>
        <button data-v="config">Config</button>
      </div>
    </div>
    <div class="grp"><span class="glabel">Tela</span>
      <div class="seg" id="segWidth">
        <button data-v="desktop" class="on">Desktop</button>
        <button data-v="mobile">Mobile</button>
      </div>
    </div>
    <div class="grp"><span class="glabel">Tema</span>
      <div class="seg" id="segTheme">
        <button data-v="light" class="on">Claro</button>
        <button data-v="dark">Escuro</button>
      </div>
    </div>
  </div>
  <div class="caption" id="caption"></div>
  <div class="stage"><div id="preview" class="preview"></div></div>

<script>
const ICON = {
  pub:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  prazos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/></svg>',
  proc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18"/><path d="M3 12h18"/><path d="M3 17h18"/></svg>',
  config:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
  menu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>',
  radar:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="12" r="5"/><path d="M12 12 L20 6"/><circle cx="17.4" cy="8" r="1.3" fill="currentColor" stroke="none"/></svg>'
};

const NAV = [
  { id:'pub', label:'Publicações' },
  { id:'prazos', label:'Prazos' },
  { id:'proc', label:'Processos' },
  { id:'config', label:'Configurações' }
];

const PUBS = [
  { trib:'TJSE', tipo:'Intimação', date:'04/06', proc:'0801234-56.2026.8.25.0001', partes:'Banco X S/A × João da Silva', body:'Fica a parte intimada para, no prazo de 15 dias, apresentar contrarrazões ao recurso de apelação interposto.', prazo:'19/06', soon:false },
  { trib:'TJSE', tipo:'Citação', date:'04/06', proc:'0805678-90.2026.8.25.0011', partes:'Maria Souza × Construtora Y Ltda', body:'Citação para, querendo, apresentar contestação no prazo legal, sob pena de revelia.', prazo:'08/06', soon:true },
  { trib:'TRT20', tipo:'Despacho', date:'03/06', proc:'0001234-55.2026.5.20.0002', partes:'Sindicato Z × Empresa W', body:'Vistos. Intime-se a reclamada para manifestação sobre os documentos juntados.', prazo:'', soon:false },
  { trib:'TRF5', tipo:'Intimação', date:'02/06', proc:'0512345-67.2026.4.05.8500', partes:'União × Carlos Mendes', body:'Intimação para ciência da decisão que indeferiu o pedido de tutela de urgência.', prazo:'17/06', soon:false },
  { trib:'TJSE', tipo:'Sentença', date:'02/06', proc:'0809999-01.2026.8.25.0001', partes:'Pedro Lima × Município de Aracaju', body:'Ante o exposto, julgo procedente o pedido para condenar o réu ao pagamento.', prazo:'', soon:false },
  { trib:'STJ', tipo:'Distribuição', date:'01/06', proc:'REsp 2.123.456/SE', partes:'—', body:'Processo distribuído, por sorteio, ao Ministro Relator da Terceira Turma.', prazo:'', soon:false }
];

const CAPS = {
  a: 'Layout A — Navegação à esquerda, filtros à direita. Topbar de canto a canto. A nav vira hambúrguer no mobile; os filtros viram gaveta.',
  b: 'Layout B — Navegação à esquerda, filtros em barra horizontal acima da lista. Mais largura de leitura, filtros menos persistentes.',
  c: 'Layout C — Navegação em abas na topbar, filtros à esquerda. Máxima largura de conteúdo; no mobile as abas viram tira rolável.'
};

const state = { layout:'a', page:'pub', width:'desktop', theme:'light' };

function card(p) {
  return `<article class="card">
    <div class="chead"><span class="ctrib">${p.trib}</span><span class="ctipo">${p.tipo}</span><span class="cdate">${p.date}</span></div>
    <div class="cproc">Processo <b>${p.proc}</b></div>
    <div class="cpartes">${p.partes}</div>
    <p class="cbody">${p.body}</p>
    ${p.prazo ? `<div class="cdead ${p.soon?'soon':''}">⏰ Prazo ${p.prazo}</div>` : ''}
    <a class="clink" href="#">Abrir no tribunal →</a>
  </article>`;
}

function content() {
  if (state.page === 'pub') {
    return `<h1 class="ptitle">Publicações</h1><p class="psub">Acompanhamento diário no DJEN · OAB 7975-SE</p>
      <div class="list">${PUBS.map(card).join('')}</div>`;
  }
  if (state.page === 'prazos') {
    const withP = PUBS.filter(p => p.prazo).sort((a,b)=> a.prazo.localeCompare(b.prazo));
    return `<h1 class="ptitle">Prazos</h1><p class="psub">Publicações com prazo, por vencimento</p>
      <div class="list">${withP.map(card).join('')}</div>`;
  }
  if (state.page === 'proc') {
    const groups = {};
    PUBS.forEach(p => { (groups[p.proc] = groups[p.proc] || []).push(p); });
    return `<h1 class="ptitle">Processos</h1><p class="psub">Publicações agrupadas por processo</p>
      ${Object.keys(groups).map(k => `<div class="group-h"><b>${k}</b><span class="cnt">${groups[k].length} publicação(ões)</span></div><div class="list">${groups[k].map(card).join('')}</div>`).join('')}`;
  }
  return `<h1 class="ptitle">Configurações</h1><p class="psub">Perfil e preferências</p>
    <div class="field"><label>Nome completo</label><input value="Mateus Moura de Oliveira"></div>
    <div class="field"><label>OAB</label><input value="7975-SE"></div>
    <div class="field"><label>UF</label><input value="SE"></div>
    <div class="field"><label>Resumo diário por e-mail</label><input value="ativado (em breve)" disabled></div>`;
}

function navList() {
  return NAV.map(n => `<div class="nlink ${state.page===n.id?'on':''}" data-nav="${n.id}">${ICON[n.id]||''}<span>${n.label}</span></div>`).join('');
}

function tabs() {
  return `<div class="tabs">${NAV.filter(n=>n.id!=='config').map(n => `<div class="tab ${state.page===n.id?'on':''}" data-nav="${n.id}">${ICON[n.id]}<span>${n.label}</span></div>`).join('')}</div>`;
}

function filtersInner(compact) {
  const wrap = (label, body) => `<div class="fgroup"><div class="flabel">${label}</div>${body}</div>`;
  const chips = (arr, on) => `<div class="chips">${arr.map(v=>`<span class="fchip ${v===on?'on':''}">${v}</span>`).join('')}</div>`;
  return `
    ${wrap('Período', chips(['1d','3d','7d','15d','30d','90d'],'7d'))}
    <div class="fgroup"><input class="finput" placeholder="Buscar texto, parte, processo…"></div>
    ${wrap('Tribunal', chips(['TJSE','TRT20','TRF5','STJ'],null))}
    ${wrap('Tipo', chips(['Intimação','Citação','Despacho','Sentença'],null))}
    <div class="fgroup"><label class="ftog"><input type="checkbox"> Somente com prazo</label></div>
    <button class="fclear">Limpar filtros</button>`;
}

function topbar() {
  const isC = state.layout === 'c';
  return `<header class="top"><div class="top-in">
    ${(!isC) ? `<button class="iconbtn ham" data-act="nav">${ICON.menu}</button>` : ''}
    <a class="brand"><span class="mark">${ICON.radar}</span><span class="bname">advradar</span></a>
    ${isC ? tabs() : ''}
    <div class="sp"></div>
    <button class="iconbtn filtbtn" data-act="filt">${ICON.menu} Filtros</button>
    <span class="who">${state.page!=='config'?'Mateus Moura':''}</span>
    <button class="iconbtn">${ICON.gear}</button>
    <button class="iconbtn" data-act="theme">${ICON.moon}</button>
  </div></header>`;
}

function shell() {
  const L = state.layout;
  const navA = `<aside class="aside nav-aside"><div class="asec">Navegação</div>${navList()}</aside>`;
  const filtA = `<aside class="aside filt-aside"><div class="asec">Filtros</div>${filtersInner()}</aside>`;
  const filtTop = `<div class="filt-top">${filtersInner(true)}</div>`;
  let body = '';
  if (L === 'a') body = `${navA}<main class="main">${content()}</main>${filtA}`;
  else if (L === 'b') body = `${navA}<main class="main">${filtTop}${content()}</main>`;
  else body = `${filtA}<main class="main">${content()}</main>`;
  return `${topbar()}<div class="body">${body}</div>
    <div class="scrim" data-act="close"></div>
    <div class="drawer nav"><div class="asec">Navegação</div>${navList()}</div>
    <div class="drawer filt"><div class="asec">Filtros</div>${filtersInner()}</div>`;
}

function render() {
  const p = document.getElementById('preview');
  p.className = `preview layout-${state.layout} page-${state.page} w-${state.width} theme-${state.theme}`;
  p.innerHTML = `<div class="app">${shell()}</div>`;
  document.getElementById('caption').textContent = CAPS[state.layout];
  const app = p.querySelector('.app');
  p.querySelectorAll('[data-nav]').forEach(el => el.onclick = () => { state.page = el.dataset.nav; syncSeg('segPage', state.page); render(); });
  p.querySelectorAll('[data-act]').forEach(el => el.onclick = () => {
    const a = el.dataset.act;
    if (a === 'nav') app.classList.toggle('draweropen');
    else if (a === 'filt') app.classList.toggle('filtopen');
    else if (a === 'close') app.classList.remove('draweropen','filtopen');
    else if (a === 'theme') { state.theme = state.theme==='light'?'dark':'light'; syncSeg('segTheme', state.theme); render(); }
  });
}

function syncSeg(id, v) {
  document.querySelectorAll(`#${id} button`).forEach(b => b.classList.toggle('on', b.dataset.v === v));
}

function wireSeg(id, key) {
  document.getElementById(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state[key] = b.dataset.v; syncSeg(id, b.dataset.v); render();
  });
}
wireSeg('segLayout','layout');
wireSeg('segPage','page');
wireSeg('segWidth','width');
wireSeg('segTheme','theme');
render();
</script>
</body>
</html>
