<title>advradar — 3 conceitos de app</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #eef1f4; color: #0f172a; }

  .mockbar { position: sticky; top: 0; z-index: 100; display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 10px 16px; background: #0f172a; color: #e2e8f0; box-shadow: 0 2px 12px rgba(0,0,0,.25); }
  .mockbar .title { font-weight: 700; }
  .grp { display: flex; align-items: center; gap: 6px; }
  .glabel { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; opacity: .6; }
  .seg { display: inline-flex; background: #1e293b; border-radius: 8px; padding: 2px; }
  .seg button { border: 0; background: transparent; color: #cbd5e1; font: inherit; font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
  .seg button.on { background: #14b8a6; color: #042f2a; }
  .caption { padding: 9px 16px; background: #134e4a; color: #d1faf3; font-size: 13px; }

  .stage { padding: 20px; display: flex; justify-content: center; }
  .preview { width: 100%; max-width: 1200px; height: 780px; border: 1px solid #cbd5e1; border-radius: 14px; overflow: hidden; background: var(--avr-bg); box-shadow: 0 14px 48px rgba(0,0,0,.2); }
  .preview.w-mobile { width: 390px; }

  .preview.theme-light { --avr-bg:#d4f4ed; --avr-surface:#fff; --avr-border:#e2e8f0; --avr-text:#134e4a; --avr-muted:#115e59; --avr-accent:#14b8a6; --avr-soft:rgba(20,184,166,.10); --avr-shadow:rgba(20,184,166,.12); }
  .preview.theme-dark { --avr-bg:#0f1419; --avr-surface:#1a1f26; --avr-border:#0f766e; --avr-text:#e5e7eb; --avr-muted:#d1d5db; --avr-accent:#2dd4bf; --avr-soft:rgba(20,184,166,.18); --avr-shadow:rgba(0,0,0,.35); }

  .app { position: relative; height: 100%; display: flex; flex-direction: column; background: var(--avr-bg); color: var(--avr-text); }
  .top { background: var(--avr-surface); border-bottom: 1px solid var(--avr-border); box-shadow: 0 2px 10px var(--avr-shadow); z-index: 5; }
  .top-in { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 58px; padding: 0 16px; gap: 10px; }
  .top-l { display: flex; align-items: center; gap: 10px; }
  .top-r { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .brand { display: inline-flex; align-items: center; gap: 9px; text-decoration: none; }
  .mark { color: var(--avr-accent); display: inline-flex; }
  .bname { font-family: 'Comfortaa', sans-serif; font-weight: 700; font-size: 20px; color: var(--avr-text); }
  .who { font-size: 13px; color: var(--avr-muted); white-space: nowrap; }
  .iconbtn { display: inline-flex; align-items: center; gap: 6px; justify-content: center; border: 1px solid var(--avr-border); background: transparent; color: var(--avr-muted); border-radius: 8px; padding: 7px 10px; cursor: pointer; font: inherit; font-size: 13px; }
  .iconbtn:hover { color: var(--avr-text); border-color: var(--avr-muted); }
  .iconbtn svg { width: 17px; height: 17px; }

  /* centered colored glyph tabs */
  .tabs { display: flex; gap: 4px; justify-content: center; }
  .tab { display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: 8px 8px 0 0; color: var(--avr-muted); font-weight: 600; font-size: 14px; white-space: nowrap; cursor: pointer; border-bottom: 2px solid transparent; }
  .tab .g { color: var(--acc); display: inline-flex; }
  .tab:hover { color: var(--avr-text); }
  .tab.on { color: var(--acc); border-bottom-color: var(--acc); background: color-mix(in srgb, var(--acc) 12%, transparent); }
  .ham { display: none; }
  .w-mobile .tabs { display: none; }
  .w-mobile .ham { display: inline-flex; }
  .w-mobile .top-in { grid-template-columns: auto 1fr auto; }
  .w-mobile .top-c { display: none; }

  .body { flex: 1; min-height: 0; overflow: auto; padding: 16px 18px; }
  .body.flush { padding: 0; }
  .ptitle { margin: 0 0 2px; font-size: 19px; font-weight: 700; }
  .psub { margin: 0 0 14px; color: var(--avr-muted); font-size: 13px; }

  /* cards */
  .list { display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--avr-surface); border: 1px solid var(--avr-border); border-radius: 12px; box-shadow: 0 1px 3px var(--avr-shadow); padding: 14px 16px; cursor: pointer; }
  .card:hover { border-color: var(--avr-muted); }
  .chead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .ctrib { font-weight: 700; color: var(--avr-accent); background: var(--avr-soft); padding: 2px 8px; border-radius: 6px; font-size: 12px; }
  .ctipo { font-size: 12px; color: var(--avr-muted); }
  .cdate { margin-left: auto; font-size: 12px; color: var(--avr-muted); }
  .stat { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .stat.novo { color: #0d9488; background: rgba(20,184,166,.14); }
  .stat.pend { color: #b45309; background: rgba(245,158,11,.16); }
  .stat.trat { color: #15803d; background: rgba(34,197,94,.16); }
  .cproc { font-size: 13px; color: var(--avr-muted); } .cproc b { color: var(--avr-text); }
  .cpartes { font-size: 13px; margin: 3px 0; }
  .cai { font-size: 12.5px; color: var(--avr-muted); margin: 6px 0; display: flex; gap: 6px; align-items: flex-start; }
  .cai .g { color: #8b5cf6; flex-shrink: 0; margin-top: 1px; }
  .cbody { margin: 6px 0 8px; font-size: 13px; }
  .cdead { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #b45309; background: rgba(245,158,11,.14); padding: 3px 9px; border-radius: 999px; }
  .cdead.soon { color: #b91c1c; background: rgba(239,68,68,.14); }
  .theme-dark .cdead { color: #fcd34d; } .theme-dark .cdead.soon { color: #fca5a5; }

  .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; padding-top: 10px; border-top: 1px solid var(--avr-border); }
  .act { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--avr-muted); border: 1px solid var(--avr-border); background: transparent; border-radius: 7px; padding: 5px 9px; cursor: pointer; }
  .act:hover { color: var(--avr-accent); border-color: var(--avr-accent); }
  .act svg { width: 15px; height: 15px; }

  /* two-pane (concept 1) */
  .twopane { display: grid; grid-template-columns: 340px 1fr; height: 100%; }
  .w-mobile .twopane { grid-template-columns: 1fr; }
  .w-mobile .twopane .tp-detail { display: none; }
  .tp-list { border-right: 1px solid var(--avr-border); overflow: auto; background: var(--avr-surface); }
  .tp-row { padding: 12px 14px; border-bottom: 1px solid var(--avr-border); cursor: pointer; }
  .tp-row:hover { background: var(--avr-soft); }
  .tp-row.sel { background: var(--avr-soft); box-shadow: inset 3px 0 0 var(--avr-accent); }
  .tp-row .l1 { display: flex; gap: 7px; align-items: center; margin-bottom: 3px; }
  .tp-row .l2 { font-size: 12.5px; color: var(--avr-muted); }
  .tp-detail { overflow: auto; padding: 18px 20px; }

  .dh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .dlabel { font-size: 12px; color: var(--avr-muted); font-weight: 600; margin: 14px 0 4px; }
  .dbody { font-size: 14px; line-height: 1.6; }

  /* slide-over detail + filter panel */
  .panel { position: absolute; top: 0; bottom: 0; right: 0; width: 380px; background: var(--avr-surface); border-left: 1px solid var(--avr-border); z-index: 30; overflow: auto; padding: 18px 20px; transform: translateX(100%); transition: transform .22s ease; box-shadow: -8px 0 30px rgba(0,0,0,.12); }
  .filt { width: 320px; }
  .app.detailopen .panel.detail { transform: none; }
  .app.filtopen .panel.filt { transform: none; }
  .w-mobile .panel { width: 100%; }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.4); z-index: 20; display: none; }
  .app.detailopen .scrim, .app.filtopen .scrim, .app.navopen .scrim { display: block; }
  .panel-x { float: right; }

  /* nav drawer (mobile) */
  .drawer { position: absolute; top: 0; bottom: 0; left: 0; width: 270px; background: var(--avr-surface); border-right: 1px solid var(--avr-border); z-index: 30; overflow: auto; padding: 14px; transform: translateX(-100%); transition: transform .22s ease; }
  .app.navopen .drawer { transform: none; }
  .nlink { display: flex; gap: 11px; align-items: center; padding: 11px 12px; border-radius: 8px; color: var(--avr-muted); font-weight: 600; cursor: pointer; }
  .nlink .g { color: var(--acc); }
  .nlink.on { color: var(--acc); background: color-mix(in srgb, var(--acc) 14%, transparent); }

  /* filters */
  .fgroup { margin-bottom: 16px; }
  .flabel { font-size: 12px; color: var(--avr-muted); margin-bottom: 7px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .fchip { padding: 4px 10px; border: 1px solid var(--avr-border); border-radius: 999px; background: transparent; color: var(--avr-muted); font-size: 12px; cursor: pointer; }
  .fchip.on { background: var(--avr-soft); color: var(--avr-accent); border-color: var(--avr-accent); font-weight: 600; }
  .finput { width: 100%; padding: 9px 11px; border: 1px solid var(--avr-border); border-radius: 8px; background: var(--avr-bg); color: var(--avr-text); font: inherit; font-size: 13px; }

  /* dashboard (concept 3) */
  .stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 18px; }
  .w-mobile .stats { grid-template-columns: repeat(2,1fr); }
  .scard { background: var(--avr-surface); border: 1px solid var(--avr-border); border-radius: 12px; padding: 14px; box-shadow: 0 1px 3px var(--avr-shadow); }
  .scard .n { font-size: 26px; font-weight: 700; }
  .scard .k { font-size: 12px; color: var(--avr-muted); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .scard .k .g { color: var(--acc); }
  .sech { font-size: 14px; font-weight: 700; margin: 18px 0 10px; }

  /* calendar */
  .cal { background: var(--avr-surface); border: 1px solid var(--avr-border); border-radius: 12px; padding: 14px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }
  .cal-dow { text-align: center; font-size: 11px; color: var(--avr-muted); font-weight: 700; padding: 4px 0; }
  .cal-cell { min-height: 64px; border: 1px solid var(--avr-border); border-radius: 8px; padding: 5px; font-size: 12px; }
  .cal-cell .d { color: var(--avr-muted); }
  .cal-pill { display: block; margin-top: 4px; font-size: 10.5px; font-weight: 700; color: #fff; background: #f59e0b; border-radius: 5px; padding: 2px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-pill.soon { background: #ef4444; }

  /* casos / equipe */
  .grouph { display: flex; align-items: center; gap: 9px; margin: 18px 0 8px; } .grouph:first-child { margin-top: 0; }
  .grouph b { font-size: 14px; } .grouph .cnt { font-size: 12px; color: var(--avr-muted); }
  .member { display: flex; align-items: center; gap: 12px; background: var(--avr-surface); border: 1px solid var(--avr-border); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 14px; }
  .member .mn { font-weight: 600; font-size: 14px; } .member .mr { font-size: 12px; color: var(--avr-muted); }
  .member .mc { margin-left: auto; font-size: 12px; color: var(--avr-muted); }
  .note { font-size: 13px; color: var(--avr-muted); background: var(--avr-soft); border-radius: 10px; padding: 12px 14px; margin-top: 8px; display: flex; gap: 9px; align-items: flex-start; }
  .field { margin-bottom: 14px; max-width: 420px; }
  .field label { display: block; font-size: 12px; color: var(--avr-muted); margin-bottom: 6px; font-weight: 600; }
  .field input { width: 100%; padding: 9px 11px; border: 1px solid var(--avr-border); border-radius: 8px; background: var(--avr-surface); color: var(--avr-text); font: inherit; }
  .btn-primary { border: 0; background: var(--avr-accent); color: #042f2a; font-weight: 700; border-radius: 8px; padding: 9px 16px; cursor: pointer; font: inherit; }
</style>
</head>

  {id:2, trib:'TJSE', tipo:'Citação', date:'04/06', proc:'0805678-90.2026.8.25.0011', partes:'Maria Souza × Construtora Y', resumo:'Citação para contestar, sob pena de revelia · prazo curto.', body:'Citação para, querendo, apresentar contestação no prazo legal, sob pena de revelia e confissão quanto à matéria de fato.', prazo:'08/06', day:8, soon:true, status:'novo'},
  {id:3, trib:'TRT20', tipo:'Despacho', date:'03/06', proc:'0001234-55.2026.5.20.0002', partes:'Sindicato Z × Empresa W', resumo:'Despacho: manifestar-se sobre documentos juntados.', body:'Vistos. Intime-se a reclamada para manifestação sobre os documentos juntados pela reclamante.', prazo:'', day:0, soon:false, status:'pendente'},
  {id:4, trib:'TRF5', tipo:'Intimação', date:'02/06', proc:'0512345-67.2026.4.05.8500', partes:'União × Carlos Mendes', resumo:'Ciência da decisão que indeferiu a tutela de urgência.', body:'Intimação para ciência da decisão que indeferiu o pedido de tutela de urgência.', prazo:'17/06', day:17, soon:false, status:'novo'},
  {id:5, trib:'TJSE', tipo:'Sentença', date:'02/06', proc:'0809999-01.2026.8.25.0001', partes:'Pedro Lima × Município de Aracaju', resumo:'Sentença de procedência do pedido.', body:'Ante o exposto, julgo procedente o pedido para condenar o réu ao pagamento das verbas pleiteadas.', prazo:'', day:0, soon:false, status:'tratada'},
  {id:6, trib:'STJ', tipo:'Distribuição', date:'01/06', proc:'REsp 2.123.456/SE', partes:'—', resumo:'Processo distribuído ao Ministro Relator.', body:'Processo distribuído, por sorteio, ao Ministro Relator da Terceira Turma.', prazo:'', day:0, soon:false, status:'pendente'},
  {id:7, trib:'TJSE', tipo:'Intimação', date:'01/06', proc:'0805678-90.2026.8.25.0011', partes:'Construtora Y × Ana Rocha', resumo:'Intimação para audiência de conciliação.', body:'Intimação para comparecimento à audiência de conciliação designada.', prazo:'24/06', day:24, soon:false, status:'pendente'}
];
const STAT_LABEL = {novo:'Novo', pendente:'Pendente', tratada:'Tratada'};
const STAT_CLS = {novo:'novo', pendente:'pend', tratada:'trat'};
const ACTIONS = [ ['check-circle','Tratar'], ['checklist','Tarefa'], ['calendar','Agenda'], ['users','Atribuir'], ['share','Compartilhar'], ['edit','Nota'], ['archive','Arquivar'] ];
const MEMBERS = [ ['MM','Mateus Moura','Advogado (você)',12,'#14b8a6'], ['AB','Ana Beatriz','Advogada associada',5,'#6366f1'], ['CH','Carlos Henrique','Estagiário',3,'#f59e0b'], ['SE','Secretaria','Apoio administrativo',0,'#ec4899'] ];

const state = { c:1, page:'home', width:'desktop', theme:'light', sel:1 };

function actsRow(set) {
  const items = set || ACTIONS;
  return `<div class="acts">${items.map(a=>`<button class="act">${g(a[0],15)}<span>${a[1]}</span></button>`).join('')}</div>`;
}
function statusChip(s){ return `<span class="stat ${STAT_CLS[s]}">${STAT_LABEL[s]}</span>`; }
function deadChip(p){ return p.prazo ? `<span class="cdead ${p.soon?'soon':''}">${g('clock',13)} Prazo ${p.prazo}</span>` : ''; }

function card(p) {
  return `<article class="card" data-pub="${p.id}">
    <div class="chead"><span class="ctrib">${p.trib}</span><span class="ctipo">${p.tipo}</span>${statusChip(p.status)}<span class="cdate">${p.date}</span></div>
    <div class="cproc">Processo <b>${p.proc}</b></div>
    <div class="cpartes">${p.partes}</div>
    <div class="cai">${g('sparkle',15)}<span>${p.resumo}</span></div>
    ${deadChip(p)}
    ${actsRow([['check-circle','Tratar'],['calendar','Agenda'],['users','Atribuir'],['share','Compartilhar']])}
  </article>`;
}
function detail(p) {
  return `<div class="dh"><span class="ctrib">${p.trib}</span><span class="ctipo">${p.tipo}</span>${statusChip(p.status)}<span class="cdate">${p.date}</span></div>
    <div class="cproc">Processo <b>${p.proc}</b></div>
    <div class="cpartes">${p.partes}</div>
    <div class="cai">${g('sparkle',16)}<span><b>Resumo IA:</b> ${p.resumo}</span></div>
    ${p.prazo ? `<div class="dlabel">Prazo</div>${deadChip(p)} <button class="act" style="margin-left:6px">${g('calendar',15)} Adicionar à agenda</button>` : ''}
    <div class="dlabel">Texto da publicação</div>
    <div class="dbody">${p.body}</div>
    ${actsRow()}
    <a class="act" style="margin-top:12px">Abrir no tribunal →</a>`;
}

function filtersInner() {
  const ch = (arr,on)=>`<div class="chips">${arr.map(v=>`<span class="fchip ${v===on?'on':''}">${v}</span>`).join('')}</div>`;
  return `<button class="iconbtn panel-x" data-act="closefilt">${g('x',16)}</button>
    <h3 style="margin:0 0 16px">Filtros</h3>
    <div class="fgroup"><div class="flabel">Período</div>${ch(['1d','3d','7d','15d','30d','90d'],'7d')}</div>
    <div class="fgroup"><input class="finput" placeholder="Buscar texto, parte, processo…"></div>
    <div class="fgroup"><div class="flabel">Tribunal</div>${ch(['TJSE','TRT20','TRF5','STJ'],null)}</div>
    <div class="fgroup"><div class="flabel">Tipo</div>${ch(['Intimação','Citação','Despacho','Sentença'],null)}</div>
    <div class="fgroup"><div class="flabel">Situação</div>${ch(['Novo','Pendente','Tratada'],'Novo')}</div>
    <div class="fgroup"><label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox"> Somente com prazo</label></div>`;
}

/* ── home renderers ─────────────────────────── */
function homeInbox() {
  const rows = PUBS.map(p=>`<div class="tp-row ${p.id===state.sel?'sel':''}" data-sel="${p.id}">
    <div class="l1"><span class="ctrib">${p.trib}</span>${statusChip(p.status)}<span class="cdate" style="margin-left:auto">${p.date}</span></div>
    <div class="l2"><b>${p.tipo}</b> · ${p.partes}</div>
    ${p.prazo?`<div style="margin-top:5px">${deadChip(p)}</div>`:''}
  </div>`).join('');
  const sel = PUBS.find(p=>p.id===state.sel) || PUBS[0];
  return `<div class="twopane"><div class="tp-list">${rows}</div><div class="tp-detail">${detail(sel)}</div></div>`;
}
function homeFeed() {
  return `<div style="padding:16px 18px"><h1 class="ptitle">Publicações</h1><p class="psub">Acompanhamento diário no DJEN · OAB 7975-SE</p><div class="list">${PUBS.map(card).join('')}</div></div>`;
}
function homeDash() {
  const novos = PUBS.filter(p=>p.status==='novo').length;
  const prazos = PUBS.filter(p=>p.prazo).length;
  const pend = PUBS.filter(p=>p.status==='pendente').length;
  const sc = (n,k,gl,acc)=>`<div class="scard" style="--acc:${acc}"><div class="n" style="color:${acc}">${n}</div><div class="k">${g(gl,14)}<span>${k}</span></div></div>`;
  const upcoming = PUBS.filter(p=>p.prazo).sort((a,b)=>a.day-b.day);
  return `<div style="padding:16px 18px">
    <h1 class="ptitle">Início</h1><p class="psub">Resumo do dia · OAB 7975-SE</p>
    <div class="stats">${sc(novos,'Novos hoje','file-text','#14b8a6')}${sc(prazos,'Prazos a vencer','clock','#f59e0b')}${sc(pend,'Pendentes','list','#6366f1')}${sc(3,'Tarefas','checklist','#ec4899')}</div>
    <div class="sech">Próximos prazos</div>
    <div class="list">${upcoming.map(p=>`<div class="card" data-pub="${p.id}"><div class="chead"><span class="ctrib">${p.trib}</span><span class="ctipo">${p.tipo}</span>${deadChip(p)}<span class="cdate">${p.date}</span></div><div class="cpartes">${p.partes}</div></div>`).join('')}</div>
    <div class="sech">Para tratar</div>
    <div class="list">${PUBS.filter(p=>p.status!=='tratada').slice(0,3).map(card).join('')}</div>
  </div>`;
}

/* ── shared pages ───────────────────────────── */
function pageCalendar() {
  const dows = ['D','S','T','Q','Q','S','S'];
  const marks = {}; PUBS.filter(p=>p.prazo).forEach(p=>{ marks[p.day]=p; });
  let cells = '';
  for (let i=0;i<35;i++){ const day=i-0+1; const has = day>=1&&day<=30; const m = marks[day];
    cells += `<div class="cal-cell"><div class="d">${has?day:''}</div>${m?`<span class="cal-pill ${m.soon?'soon':''}">${m.trib} ${m.tipo}</span>`:''}</div>`; }
  return `<div style="padding:16px 18px"><h1 class="ptitle">Calendário de prazos</h1><p class="psub">Junho 2026</p>
    <div class="cal"><div class="cal-grid">${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div></div></div>`;
}
function pageCasos() {
  const groups = {}; PUBS.forEach(p=>{ (groups[p.proc]=groups[p.proc]||[]).push(p); });
  return `<div style="padding:16px 18px"><h1 class="ptitle">Casos</h1><p class="psub">Publicações agrupadas por processo</p>
    ${Object.keys(groups).map(k=>`<div class="grouph">${g('briefcase',16)}<b>${k}</b><span class="cnt">${groups[k].length} publicação(ões)</span></div><div class="list">${groups[k].map(card).join('')}</div>`).join('')}</div>`;
}
function pageEquipe() {
  return `<div style="padding:16px 18px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><h1 class="ptitle" style="margin:0">Equipe</h1><button class="btn-primary" style="margin-left:auto">${g('users',15)} Convidar membro</button></div>
    <p class="psub">Pessoas com acesso ao seu espaço de trabalho</p>
    ${MEMBERS.map(m=>`<div class="member"><span class="avatar" style="background:${m[4]}">${m[0]}</span><div><div class="mn">${m[1]}</div><div class="mr">${m[2]}</div></div><span class="mc">${m[3]} atribuídas</span></div>`).join('')}
    <div class="note">${g('share',16)}<span><b>Compartilhar fora da equipe:</b> envie uma publicação por link ou e-mail para um colega que não usa o app. Ele vê uma cópia só-leitura, sem precisar de conta.</span></div></div>`;
}
function pageConfig() {
  return `<div style="padding:16px 18px"><h1 class="ptitle">Configurações</h1><p class="psub">Perfil e preferências</p>
    <div class="field"><label>Nome completo</label><input value="Mateus Moura de Oliveira"></div>
    <div class="field"><label>OAB</label><input value="7975-SE"></div>
    <div class="field"><label>UF</label><input value="SE"></div>
    <div class="field"><label>Resumo diário por e-mail</label><input value="ativado · 07:00" ></div>
    <div class="field"><label>Lembrete de prazo</label><input value="3 dias antes"></div></div>`;
}

function pageContent() {
  if (state.page==='home') return state.c===1 ? homeInbox() : state.c===2 ? homeFeed() : homeDash();
  if (state.page==='calendar') return pageCalendar();
  if (state.page==='casos') return pageCasos();
  if (state.page==='equipe') return pageEquipe();
  return pageConfig();
}

function tabsHtml() {
  return `<div class="tabs">${NAV[state.c].map(n=>`<div class="tab ${state.page===n.kind?'on':''}" style="--acc:${n.acc}" data-page="${n.kind}">${g(n.glyph,17).replace('class="g"','class="g"')}<span>${n.label}</span></div>`).join('')}</div>`;
}
function navDrawer() {
  const items = NAV[state.c].concat([{kind:'config',label:'Configurações',glyph:'settings',acc:ACC.config}]);
  return `<div class="drawer">${items.map(n=>`<div class="nlink ${state.page===n.kind?'on':''}" style="--acc:${n.acc}" data-page="${n.kind}">${g(n.glyph,18)}<span>${n.label}</span></div>`).join('')}</div>`;
}

function shell() {
  const homeFlush = state.page==='home' && state.c===1;
  return `<header class="top"><div class="top-in">
      <div class="top-l"><button class="iconbtn ham" data-act="nav">${g('menu',18)}</button><a class="brand"><span class="mark">${RADAR}</span><span class="bname">advradar</span></a></div>
      <div class="top-c">${tabsHtml()}</div>
      <div class="top-r"><button class="iconbtn" data-act="filt">${g('filter',16)} Filtros</button><span class="who">Mateus Moura</span><button class="iconbtn">${g('settings',16)}</button><button class="iconbtn" data-act="theme">${g('moon',16)}</button></div>
    </div></header>
    <div class="body ${homeFlush?'flush':''}">${pageContent()}</div>
    <div class="scrim" data-act="close"></div>
    ${navDrawer()}
    <aside class="panel detail"><button class="iconbtn panel-x" data-act="closedetail">${g('x',16)}</button><div style="clear:both"></div>${detail(PUBS.find(p=>p.id===state.sel)||PUBS[0])}</aside>
    <aside class="panel filt">${filtersInner()}</aside>`;
}

function render() {
  const p = document.getElementById('preview');
  p.className = `preview c-${state.c} page-${state.page} w-${state.width} theme-${state.theme}`;
  p.innerHTML = `<div class="app">${shell()}</div>`;
  document.getElementById('caption').textContent = CAPS[state.c];
  const app = p.querySelector('.app');
  const openDetail = id => { state.sel = +id; if (!(state.page==='home'&&state.c===1)) app.classList.add('detailopen'); render2sel(); };
  // re-bind
  p.querySelectorAll('[data-page]').forEach(el=>el.onclick=()=>{ state.page=el.dataset.page; syncSeg('segP',state.page); render(); });
  p.querySelectorAll('[data-sel]').forEach(el=>el.onclick=()=>{ state.sel=+el.dataset.sel; render(); });
  p.querySelectorAll('[data-pub]').forEach(el=>el.onclick=()=>{ state.sel=+el.dataset.pub; if(!(state.page==='home'&&state.c===1)) app.classList.add('detailopen'); render(); app.classList.add('detailopen'); });
  p.querySelectorAll('[data-act]').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); const a=el.dataset.act;
    if(a==='nav') app.classList.toggle('navopen');
    else if(a==='filt') app.classList.add('filtopen');
    else if(a==='closefilt') app.classList.remove('filtopen');
    else if(a==='closedetail') app.classList.remove('detailopen');
    else if(a==='close') app.classList.remove('navopen','filtopen','detailopen');
    else if(a==='theme'){ state.theme=state.theme==='light'?'dark':'light'; syncSeg('segT',state.theme); render(); }
  });
}
function render2sel(){ render(); }
function syncSeg(id,v){ document.querySelectorAll(`#${id} button`).forEach(b=>b.classList.toggle('on',b.dataset.v===v)); }
function wire(id,key,cast){ document.getElementById(id).addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; state[key]=cast?cast(b.dataset.v):b.dataset.v; syncSeg(id,b.dataset.v); render(); }); }
wire('segC','c',Number); wire('segP','page'); wire('segW','width'); wire('segT','theme');
render();
</script>
</body>
</html>
