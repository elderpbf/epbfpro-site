<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pensoIA · certificado · ousado/tech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Lora:ital,wght@0,400;0,500;0,600;0,700&family=Comfortaa:wght@400;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#061a51; --teal:#14b8a6; --teal-dark:#0d9488; --green:#047857;
    --paper:#fafdfc; --cream:#faf7f2; --ink:#1d2b33; --muted:#5b7975; --rule:#e3e8e6;
    --acc-light:#7de8d6;
    --lora:'Lora',serif; --inter:'Inter',sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:#16181c; font-family:var(--inter); }

  #pages[data-pal="navy"] { --grad:linear-gradient(135deg,#0b2f73 0%,#061a51 60%,#04123a 100%); --grad-soft:linear-gradient(135deg,#123a86 0%,#08205e 100%); --accent:#14b8a6; --ink2:#061a51; --pdark:#0d9488; --glow:rgba(20,184,166,.55); --deep:#04123a; --mid:#0b2f73; }
  #pages[data-pal="teal"] { --grad:linear-gradient(135deg,#0d9488 0%,#047857 60%,#134e4a 100%); --grad-soft:linear-gradient(135deg,#15b5a3 0%,#0a8f78 100%); --accent:#7de8d6; --ink2:#134e4a; --pdark:#0d9488; --glow:rgba(125,232,214,.5); --deep:#0c3b37; --mid:#0d9488; }
  #pages[data-pal="duo"]  { --grad:linear-gradient(135deg,#061a51 0%,#0c5f7a 64%,#14b8a6 122%); --grad-soft:linear-gradient(125deg,#0a2566 0%,#0e6f8f 70%,#16c2ae 130%); --accent:#7de8d6; --ink2:#061a51; --pdark:#0d9488; --glow:rgba(20,184,166,.55); --deep:#04123a; --mid:#0c5f7a; }

  /* ===== TOOLBAR ===== */
  .toolbar { position:fixed; top:0; left:0; right:0; z-index:50; display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:11px 20px; background:rgba(6,26,81,0.96); backdrop-filter:blur(8px); color:#fff; }
  .toolbar .brand { font-family:'Comfortaa',sans-serif; font-weight:700; font-size:13px; }
  .toolbar .brand b { color:var(--teal); }
  .tgroup { display:flex; align-items:center; gap:5px; }
  .tgroup > label { font-family:var(--inter); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.5); margin-right:3px; }
  .chip { border:1px solid rgba(255,255,255,.22); background:transparent; color:rgba(255,255,255,.82); font-family:var(--inter); font-size:12px; font-weight:500; padding:5px 11px; border-radius:16px; cursor:pointer; transition:all .15s; }
  .chip:hover { border-color:rgba(255,255,255,.5); color:#fff; }
  .chip.active { background:var(--teal); border-color:var(--teal); color:#042b27; font-weight:600; }
  .toolbar .spacer { flex:1; }
  .print-btn { background:var(--teal); border:none; color:#042b27; font-weight:700; font-family:var(--inter); font-size:12px; padding:7px 16px; border-radius:16px; cursor:pointer; }

  /* ===== STAGE ===== */
  .stage { position:fixed; top:54px; left:0; right:0; bottom:0; overflow:auto; display:flex; align-items:center; justify-content:center; padding:26px; }
  #pages { display:flex; gap:24px; transform-origin:center center; transition:transform .15s ease; }

  /* ===== A4 LANDSCAPE PAGE ===== */
  .page { width:297mm; height:210mm; flex:0 0 auto; background:var(--paper); color:var(--ink); box-shadow:0 18px 60px rgba(0,0,0,.45); position:relative; overflow:hidden; }
  .page * { line-height:1.5; }
  .dots { position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.16) .7px,transparent .7px); background-size:18px 18px; opacity:.6; pointer-events:none; z-index:0; }
  .eyebrow { font-family:var(--inter); font-weight:500; font-size:12px; letter-spacing:.3em; text-transform:uppercase; }
  .bmark svg, .mk svg { width:100%; height:auto; display:block; }
  .qr { background:#fff; padding:4px; border-radius:4px; display:block; }
  .qr svg { display:block; }

  /* P glyph as graphic element: huge watermark helper */
  .pwm { position:absolute; pointer-events:none; }
  .pwm svg { width:100%; height:100%; display:block; }

  /* ============================================================ FRONT 1 · ECLIPSE
     Giant P glyph eclipsed by a radial glow, name riding the light. */
  .f-eclipse { background:var(--grad); color:#fff; overflow:hidden; }
  .f-eclipse .dots { opacity:.5; }
  .f-eclipse .glow { position:absolute; width:150mm; height:150mm; right:-30mm; top:50%; transform:translateY(-50%); border-radius:50%; background:radial-gradient(circle, var(--glow) 0%, transparent 68%); filter:blur(8px); z-index:0; }
  .f-eclipse .pwm-big { right:6mm; top:50%; transform:translateY(-50%); width:150mm; height:150mm; opacity:.16; z-index:0; }
  .f-eclipse .ec-wrap { position:relative; z-index:2; height:100%; display:flex; flex-direction:column; padding:16mm 24mm; }
  .f-eclipse .ec-top { display:flex; justify-content:space-between; align-items:flex-start; }
  .f-eclipse .ec-top .bmark { width:52mm; filter:drop-shadow(0 4px 14px rgba(0,0,0,.3)); }
  .f-eclipse .ec-tag { text-align:right; font-family:var(--mono); font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:rgba(255,255,255,.75); line-height:2; }
  .f-eclipse .ec-tag b { color:var(--acc-light); font-weight:600; }
  .f-eclipse .ec-mid { flex:1; display:flex; flex-direction:column; justify-content:center; max-width:188mm; }
  .f-eclipse .eyebrow { color:var(--acc-light); margin-bottom:12px; }
  .f-eclipse .lead { font-weight:300; font-size:15px; color:rgba(255,255,255,.85); margin-bottom:6px; }
  .f-eclipse .name { font-family:var(--lora); font-weight:600; font-size:74px; line-height:1; letter-spacing:-.02em; margin-bottom:18px; text-shadow:0 6px 30px rgba(0,0,0,.3); }
  .f-eclipse .sub { font-weight:300; font-size:15.5px; line-height:1.6; color:rgba(255,255,255,.92); max-width:170mm; }
  .f-eclipse .sub b { font-weight:600; color:#fff; }
  .f-eclipse .ec-foot { display:grid; grid-template-columns:1fr 1fr auto; gap:20px; align-items:end; padding-top:13px; border-top:1px solid rgba(255,255,255,.2); }
  .f-eclipse .ec-foot dt { font-family:var(--mono); font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.65); margin-bottom:5px; }
  .f-eclipse .ec-foot dd { font-family:var(--lora); font-size:14px; }
  .f-eclipse .ec-val { display:flex; align-items:center; gap:11px; }
  .f-eclipse .ec-val .qr { width:19mm; height:19mm; }
  .f-eclipse .ec-val .vc { font-family:var(--mono); font-size:13px; font-weight:600; letter-spacing:.08em; color:#fff; }
  .f-eclipse .ec-val .vc small { display:block; font-family:var(--inter); font-weight:400; font-size:9px; color:rgba(255,255,255,.7); letter-spacing:.02em; margin-top:3px; }

  /* ============================================================ FRONT 2 · DIAGONAL
     Bold gradient slab cut on a diagonal across a light page. */
  .f-diag { background:#fff; overflow:hidden; }
  .f-diag .slab { position:absolute; inset:0; background:var(--grad); clip-path:polygon(0 0, 100% 0, 100% 46%, 0 78%); z-index:0; }
  .f-diag .slab .dots { opacity:.5; }
  .f-diag .pwm-big { left:-26mm; top:-30mm; width:128mm; height:128mm; opacity:.12; z-index:1; }
  .f-diag .dg-head { position:relative; z-index:3; padding:15mm 24mm 0; display:flex; justify-content:space-between; align-items:flex-start; }
  .f-diag .dg-head .bmark { width:50mm; filter:drop-shadow(0 4px 14px rgba(0,0,0,.28)); }
  .f-diag .dg-head .eyebrow { color:var(--acc-light); margin-top:16mm; }
  .f-diag .dg-meta { text-align:right; font-family:var(--mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.78); line-height:2; }
  .f-diag .dg-body { position:relative; z-index:3; padding:8mm 24mm 0; }
  .f-diag .lead { color:#fff; font-weight:300; font-size:15px; margin-bottom:4px; opacity:.9; }
  .f-diag .name { font-family:var(--lora); font-weight:600; font-size:64px; line-height:1.02; letter-spacing:-.02em; color:#fff; text-shadow:0 6px 26px rgba(0,0,0,.32); }
  .f-diag .dg-low { position:absolute; left:24mm; right:24mm; bottom:16mm; z-index:3; }
  .f-diag .stmt { font-size:15.5px; line-height:1.7; color:var(--ink); max-width:175mm; margin-bottom:11mm; }
  .f-diag .stmt b { font-weight:600; color:var(--ink2); }
  .f-diag .dg-foot { display:flex; justify-content:space-between; align-items:flex-end; padding-top:12px; border-top:1px solid var(--rule); }
  .f-diag .dg-sig .ln { width:64mm; height:1.5px; background:var(--ink2); margin-bottom:6px; }
  .f-diag .dg-sig .nm { font-family:var(--lora); font-weight:600; font-size:15px; color:var(--ink2); }
  .f-diag .dg-sig .ro { font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-top:4px; }
  .f-diag .dg-val { display:flex; align-items:center; gap:11px; }
  .f-diag .dg-val .qr { width:21mm; height:21mm; }
  .f-diag .dg-val .vm { font-family:var(--mono); font-size:9px; color:var(--muted); line-height:1.8; text-align:right; }
  .f-diag .dg-val .vm .c { display:block; font-size:14px; font-weight:600; color:var(--ink2); letter-spacing:.08em; }

  /* ============================================================ FRONT 3 · GRID-SYSTEM
     Linear/Vercel dashboard grid, name in a glass card, telemetry tiles. */
  .f-grid { background:var(--deep); color:#fff; overflow:hidden; }
  .f-grid .mesh { position:absolute; inset:0; background:var(--grad); opacity:.92; z-index:0; }
  .f-grid .lines { position:absolute; inset:0; z-index:0; opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);
    background-size:22mm 22mm; mask-image:radial-gradient(ellipse 120% 90% at 30% 40%, #000 35%, transparent 80%); }
  .f-grid .gr-wrap { position:relative; z-index:2; height:100%; padding:16mm 22mm; display:grid; grid-template-columns:1.55fr 1fr; grid-template-rows:auto 1fr auto; gap:9mm 14mm; }
  .f-grid .gr-top { grid-column:1 / -1; display:flex; justify-content:space-between; align-items:center; }
  .f-grid .gr-top .bmark { width:50mm; filter:drop-shadow(0 4px 14px rgba(0,0,0,.3)); }
  .f-grid .gr-top .pill { display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--acc-light); border:1px solid rgba(125,232,214,.4); background:rgba(125,232,214,.08); padding:5px 13px; border-radius:100px; }
  .f-grid .gr-top .pill .dot { width:7px; height:7px; border-radius:50%; background:var(--acc-light); box-shadow:0 0 10px var(--acc-light); }
  .f-grid .gr-hero { align-self:center; }
  .f-grid .eyebrow { color:var(--acc-light); margin-bottom:11px; }
  .f-grid .lead { font-weight:300; font-size:14px; color:rgba(255,255,255,.8); margin-bottom:5px; }
  .f-grid .name { font-family:var(--lora); font-weight:600; font-size:60px; line-height:1.01; letter-spacing:-.02em; margin-bottom:15px; }
  .f-grid .stmt { font-weight:300; font-size:14px; line-height:1.65; color:rgba(255,255,255,.9); max-width:150mm; }
  .f-grid .stmt b { font-weight:600; color:#fff; }
  .f-grid .gr-card { align-self:center; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); border-radius:16px; backdrop-filter:blur(10px); padding:8mm 7mm; box-shadow:0 18px 50px rgba(0,0,0,.35); }
  .f-grid .gr-card .ql { font-family:var(--mono); font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.6); margin-bottom:8px; }
  .f-grid .gr-card .qr { width:100%; aspect-ratio:1; }
  .f-grid .gr-card .code { font-family:var(--mono); font-size:17px; font-weight:600; letter-spacing:.1em; text-align:center; margin-top:9px; color:#fff; }
  .f-grid .gr-card .url { font-family:var(--inter); font-size:9.5px; text-align:center; color:rgba(255,255,255,.7); margin-top:3px; }
  .f-grid .gr-tiles { grid-column:1 / -1; display:grid; grid-template-columns:repeat(4,1fr); gap:0; border-top:1px solid rgba(255,255,255,.16); }
  .f-grid .tile { padding:11px 16px 0 0; border-right:1px solid rgba(255,255,255,.14); }
  .f-grid .tile:last-child { border-right:none; }
  .f-grid .tile dt { font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.6); margin-bottom:5px; }
  .f-grid .tile dd { font-family:var(--lora); font-size:14px; color:#fff; }

  /* ============================================================ FRONT 4 · MONOLITH
     Towering left gradient column with a vertical wordmark and giant P, airy right. */
  .f-mono { display:grid; grid-template-columns:96mm 1fr; background:#fff; }
  .f-mono .col { position:relative; background:var(--grad); color:#fff; overflow:hidden; display:flex; flex-direction:column; padding:16mm 13mm; }
  .f-mono .col .dots { opacity:.45; }
  .f-mono .col .pwm-big { left:50%; bottom:-34mm; transform:translateX(-50%); width:128mm; height:128mm; opacity:.18; z-index:0; }
  .f-mono .col > * { position:relative; z-index:2; }
  .f-mono .col .bmark { width:54mm; filter:drop-shadow(0 4px 14px rgba(0,0,0,.28)); }
  .f-mono .col .vlabel { margin-top:auto; writing-mode:vertical-rl; transform:rotate(180deg); font-family:var(--mono); font-size:11px; letter-spacing:.4em; text-transform:uppercase; color:rgba(255,255,255,.7); align-self:flex-start; }
  .f-mono .col .col-foot { margin-top:14mm; }
  .f-mono .col .col-foot .ql { font-family:var(--mono); font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:var(--acc-light); margin-bottom:8px; }
  .f-mono .col .col-foot .qr { width:30mm; height:30mm; }
  .f-mono .main { padding:18mm 20mm; display:flex; flex-direction:column; position:relative; }
  .f-mono .main .eyebrow { color:var(--pdark); }
  .f-mono .main .lead { font-weight:300; color:var(--muted); font-size:15px; margin:6mm 0 3mm; }
  .f-mono .main .name { font-family:var(--lora); font-weight:600; font-size:60px; line-height:1.02; letter-spacing:-.02em; color:var(--ink2); margin-bottom:6mm; }
  .f-mono .main .accent-bar { width:62mm; height:5px; border-radius:5px; background:var(--grad); margin-bottom:6mm; }
  .f-mono .main .stmt { font-size:15.5px; line-height:1.72; color:var(--ink); max-width:150mm; }
  .f-mono .main .stmt b { font-weight:600; color:var(--ink2); }
  .f-mono .main .m-foot { margin-top:auto; display:flex; justify-content:space-between; align-items:flex-end; }
  .f-mono .main .m-sig .ln { width:62mm; height:1.5px; background:var(--ink2); margin-bottom:6px; }
  .f-mono .main .m-sig .nm { font-family:var(--lora); font-weight:600; font-size:15px; color:var(--ink2); }
  .f-mono .main .m-sig .ro { font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-top:4px; }
  .f-mono .main .m-meta { text-align:right; font-family:var(--mono); font-size:10px; color:var(--muted); line-height:1.9; }
  .f-mono .main .m-meta b { color:var(--ink2); font-weight:600; }

  /* ============================================================ FRONT 5 · NEON FRAME
     Dark page, glowing teal hairline frame, name centered with spotlight. */
  .f-neon { background:var(--deep); color:#fff; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .f-neon .bg { position:absolute; inset:0; background:var(--grad); opacity:.85; z-index:0; }
  .f-neon .dots { opacity:.4; }
  .f-neon .spot { position:absolute; inset:0; z-index:0; background:radial-gradient(ellipse 80% 60% at 50% 42%, var(--glow) 0%, transparent 60%); opacity:.7; }
  .f-neon .frame { position:absolute; inset:11mm; border:1.5px solid rgba(125,232,214,.55); border-radius:6px; z-index:1; box-shadow:inset 0 0 40px rgba(125,232,214,.12), 0 0 30px rgba(125,232,214,.18); }
  .f-neon .corner { position:absolute; width:14mm; height:14mm; border:2.5px solid var(--acc-light); z-index:3; }
  .f-neon .corner.tl { left:8mm; top:8mm; border-right:none; border-bottom:none; }
  .f-neon .corner.tr { right:8mm; top:8mm; border-left:none; border-bottom:none; }
  .f-neon .corner.bl { left:8mm; bottom:8mm; border-right:none; border-top:none; }
  .f-neon .corner.br { right:8mm; bottom:8mm; border-left:none; border-top:none; }
  .f-neon .ne-wrap { position:relative; z-index:2; text-align:center; padding:0 28mm; display:flex; flex-direction:column; align-items:center; }
  .f-neon .bmark { width:54mm; margin-bottom:9mm; filter:drop-shadow(0 4px 18px rgba(0,0,0,.4)); }
  .f-neon .eyebrow { color:var(--acc-light); margin-bottom:10px; }
  .f-neon .lead { font-weight:300; font-size:15px; color:rgba(255,255,255,.82); margin-bottom:5px; }
  .f-neon .name { font-family:var(--lora); font-weight:600; font-size:70px; line-height:1; letter-spacing:-.02em; margin-bottom:7mm; text-shadow:0 0 40px var(--glow), 0 6px 24px rgba(0,0,0,.35); }
  .f-neon .sub { font-weight:300; font-size:15px; line-height:1.6; color:rgba(255,255,255,.9); max-width:165mm; margin-bottom:9mm; }
  .f-neon .sub b { font-weight:600; color:#fff; }
  .f-neon .ne-foot { display:flex; align-items:center; gap:16px; padding-top:7mm; border-top:1px solid rgba(255,255,255,.2); }
  .f-neon .ne-foot .qr { width:20mm; height:20mm; }
  .f-neon .ne-foot .fm { font-family:var(--mono); font-size:9.5px; letter-spacing:.04em; color:rgba(255,255,255,.72); line-height:1.9; text-align:left; }
  .f-neon .ne-foot .fm .c { font-size:14px; font-weight:600; color:var(--acc-light); letter-spacing:.08em; }

  /* ============================================================ FRONT 6 · BLUEPRINT
     Technical/schematic aesthetic, crosshair, mono labels, P as wireframe watermark. */
  .f-bp { background:var(--deep); color:#fff; overflow:hidden; }
  .f-bp .bg { position:absolute; inset:0; background:var(--grad); opacity:.9; z-index:0; }
  .f-bp .grid { position:absolute; inset:0; z-index:0; opacity:.45;
    background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);
    background-size:11mm 11mm; }
  .f-bp .pwm-big { right:14mm; bottom:8mm; width:120mm; height:120mm; opacity:.14; z-index:1; }
  .f-bp .bp-wrap { position:relative; z-index:2; height:100%; padding:15mm 22mm; display:flex; flex-direction:column; }
  .f-bp .bp-top { display:flex; justify-content:space-between; align-items:flex-start; padding-bottom:9px; border-bottom:1px solid rgba(255,255,255,.22); }
  .f-bp .bp-top .bmark { width:48mm; filter:drop-shadow(0 4px 14px rgba(0,0,0,.3)); }
  .f-bp .bp-top .tag { font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.72); text-align:right; line-height:1.9; }
  .f-bp .bp-top .tag b { color:var(--acc-light); font-weight:600; }
  .f-bp .bp-mid { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .f-bp .crosshair { font-family:var(--mono); font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:var(--acc-light); margin-bottom:14px; display:flex; align-items:center; gap:10px; }
  .f-bp .crosshair::before { content:''; width:24px; height:1px; background:var(--acc-light); }
  .f-bp .lead { font-weight:300; font-size:14px; color:rgba(255,255,255,.8); margin-bottom:5px; }
  .f-bp .name { font-family:var(--lora); font-weight:600; font-size:66px; line-height:1; letter-spacing:-.02em; margin-bottom:8px; }
  .f-bp .ann { font-family:var(--mono); font-size:10px; color:rgba(255,255,255,.6); letter-spacing:.08em; margin-bottom:16px; }
  .f-bp .sub { font-weight:300; font-size:14.5px; line-height:1.65; color:rgba(255,255,255,.9); max-width:165mm; }
  .f-bp .sub b { font-weight:600; color:#fff; }
  .f-bp .bp-foot { display:grid; grid-template-columns:repeat(3,auto) 1fr auto; gap:18px; align-items:end; padding-top:11px; border-top:1px solid rgba(255,255,255,.22); }
  .f-bp .bp-foot .f { font-family:var(--mono); }
  .f-bp .bp-foot .f .l { font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.55); margin-bottom:4px; }
  .f-bp .bp-foot .f .v { font-size:12px; color:#fff; }
  .f-bp .bp-foot .bp-val { justify-self:end; display:flex; align-items:center; gap:11px; }
  .f-bp .bp-foot .bp-val .qr { width:18mm; height:18mm; }
  .f-bp .bp-foot .bp-val .vc { font-family:var(--mono); font-size:13px; font-weight:600; color:var(--acc-light); letter-spacing:.08em; }

  // ── faux QR (determinístico, parece QR real para avaliar o layout) ──
  function fauxQr(seed, mods) {
    mods = mods || 25;
    let h = 2166136261;
    for (let i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = (h * 16777619) >>> 0; }
    const bit = (i, j) => { let x = (h ^ (i*73856093) ^ (j*19349663)) >>> 0; x = (x * 2654435761) >>> 0; return (x >>> 17) & 1; };
    const cell = 4, sz = mods * cell;
    const corners = [[0,0],[0,mods-7],[mods-7,0]];
    const inFinder = (i,j) => corners.some(([bi,bj]) => i>=bi && i<bi+7 && j>=bj && j<bj+7);
    const nearFinder = (i,j) => corners.some(([bi,bj]) => i>=bi-1 && i<bi+8 && j>=bj-1 && j<bj+8);
    let r = '';
    for (let i = 0; i < mods; i++) for (let j = 0; j < mods; j++) {
      let on = false;
      if (inFinder(i,j)) {
        const c = corners.find(([bi,bj]) => i>=bi && i<bi+7 && j>=bj && j<bj+7);
        const li = i - c[0], lj = j - c[1];
        on = (li===0||li===6||lj===0||lj===6) || (li>=2&&li<=4&&lj>=2&&lj<=4);
      } else if (nearFinder(i,j)) { on = false; }
      else { on = bit(i,j) === 1; }
      if (on) r += '<rect x="'+(j*cell)+'" y="'+(i*cell)+'" width="'+cell+'" height="'+cell+'"/>';
    }
    return '<svg viewBox="0 0 '+sz+' '+sz+'" width="100%" height="100%" shape-rendering="crispEdges">'
      + '<rect width="'+sz+'" height="'+sz+'" fill="#fff"/><g fill="#061a51">'+r+'</g></svg>';
  }

  function back() {
    const mods = D.modules.map(m =>
      '<div class="ci"><div class="n">'+m.n+'</div><div><h4>'+m.t+'</h4><p>'+m.d+'</p></div></div>').join('');

    + '</div>'

          + '<div class="s"><div class="v">'+D.meetings+'</div><div class="l">Encontros</div></div>'
          + '<div class="s"><div class="v sm">'+D.modality+'</div><div class="l">Modalidade</div></div>'
        + '</div>'
        + '<div class="mblk"><div class="ml">Emissor</div><div class="mv">'+D.issuer+'<small>CNPJ '+D.cnpj+'</small></div></div>'
        + '<div class="mblk"><div class="ml">Instrutor responsável</div><div class="mv">'+D.instructor+'<small>'+D.format+'</small></div></div>'
        + '<div class="mblk"><div class="ml">Data e local de emissão</div><div class="mv">'+D.date+'<small>'+D.place+'</small></div></div>'
        + '<div class="vcard"><span class="qr" data-qr></span><div class="tx">'
          + '<div class="b">Autenticidade verificável</div>'
          + '<p>Código <span class="c">'+D.code+'</span> em '+D.validar+'</p>'
        + '</div></div>'
      + '</div>'
    + '</div>'
    + '<div class="pfoot"><span>pensoIA · Certificado de Participação</span><span>'+D.client+'</span></div>';
  }

  // ── render ──
  let state = { layout:'eclipse', pal:'duo', side:'frente' };

  function makePage(kind) {
    const page = document.createElement('div');
    page.className = 'page';
    if (kind === 'front') { page.classList.add('f-' + state.layout); page.innerHTML = FRONTS[state.layout](); }
    else { page.classList.add('back'); page.innerHTML = back(); }
    page.querySelectorAll('[data-logo]').forEach(el => { el.innerHTML = glyphWordmarkTag(logoFor(el.dataset.logo)); });
    page.querySelectorAll('[data-mk]').forEach(el => { el.innerHTML = mark(stdColors('teal')); });
    page.querySelectorAll('[data-pwm]').forEach(el => { el.innerHTML = pBig(); });
    page.querySelectorAll('[data-qr]').forEach(el => { el.innerHTML = fauxQr(D.code); });
    return page;
  }

  function render() {
    const host = document.getElementById('pages');
    host.dataset.pal = state.pal;
    host.innerHTML = '';
    const want = state.side === 'ambos' ? ['front','back'] : (state.side === 'verso' ? ['back'] : ['front']);
    want.forEach(k => host.appendChild(makePage(k)));
    fit();
  }

  function fit() {
    const host = document.getElementById('pages');
    host.style.transform = 'scale(1)';
    const stage = document.querySelector('.stage');
    const scale = Math.min((stage.clientWidth-50)/host.scrollWidth, (stage.clientHeight-50)/host.scrollHeight, 1);
    host.style.transform = 'scale(' + scale + ')';
  }

  function wire(groupId, key) {
    document.getElementById(groupId).addEventListener('click', e => {
      const btn = e.target.closest('.chip'); if (!btn) return;
      state[key] = btn.dataset[key];
      document.querySelectorAll('#' + groupId + ' .chip').forEach(c => c.classList.toggle('active', c === btn));
      render();
    });
  }
  wire('layoutGroup', 'layout');
  wire('palGroup', 'pal');
  wire('sideGroup', 'side');

  function doPrint() { const p = state.side; state.side = 'ambos'; render(); setTimeout(() => { window.print(); state.side = p; render(); }, 160); }
  window.doPrint = doPrint;

  window.addEventListener('resize', fit);
  render();
</script>
