<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pensoIA · certificado · agent-b · ousado/tech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Lora:ital,wght@0,400;0,500;0,600;0,700&family=Comfortaa:wght@400;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#061a51; --teal:#14b8a6; --teal-dark:#0d9488; --green:#047857;
    --paper:#fafdfc; --cream:#faf7f2; --ink:#1d2b33; --muted:#5b7975; --rule:#e3e8e6;
    --acc-light:#7de8d6;
    --lora:'Lora',serif; --inter:'Inter',sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:#1a1d21; font-family:var(--inter); }

  #pages[data-pal="navy"] { --grad:linear-gradient(135deg,#0b2f73 0%,#061a51 60%,#04123a 100%); --gradr:linear-gradient(120deg,#04123a 0%,#061a51 45%,#0b2f73 100%); --accent:#14b8a6; --ink2:#061a51; --pdark:#0d9488; --glow:rgba(20,184,166,.55); --c1:#0b2f73; --c2:#061a51; }
  #pages[data-pal="teal"] { --grad:linear-gradient(135deg,#0d9488 0%,#047857 60%,#134e4a 100%); --gradr:linear-gradient(120deg,#134e4a 0%,#0d9488 55%,#14b8a6 110%); --accent:#7de8d6; --ink2:#134e4a; --pdark:#0d9488; --glow:rgba(125,232,214,.55); --c1:#0d9488; --c2:#134e4a; }
  #pages[data-pal="duo"]  { --grad:linear-gradient(135deg,#061a51 0%,#0c5f7a 64%,#14b8a6 122%); --gradr:linear-gradient(120deg,#14b8a6 -10%,#0c5f7a 46%,#061a51 100%); --accent:#7de8d6; --ink2:#061a51; --pdark:#0d9488; --glow:rgba(20,184,166,.6); --c1:#061a51; --c2:#14b8a6; }

  /* ===== TOOLBAR ===== */
  .toolbar { position:fixed; top:0; left:0; right:0; z-index:50; display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:11px 20px; background:rgba(6,26,81,0.96); backdrop-filter:blur(8px); color:#fff; }
  .toolbar .brand { font-family:'Comfortaa',sans-serif; font-weight:700; font-size:13px; }
  .toolbar .brand b { color:var(--teal); }
  .tgroup { display:flex; align-items:center; gap:5px; }
  .tgroup > label { font-family:var(--inter); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.5); margin-right:3px; }
  .chip { border:1px solid rgba(255,255,255,.22); background:transparent; color:rgba(255,255,255,.82); font-family:var(--inter); font-size:12px; font-weight:500; padding:5px 11px; border-radius:16px; cursor:pointer; transition:all .15s; }
  .chip:hover { border-color:rgba(255,255,255,.5); color:#fff; }
  .chip.active { background:var(--teal); border-color:var(--teal); color:#042b27; font-weight:600; }
  .toolbar .spacer { flex:1; }
  .print-btn { background:var(--teal); border:none; color:#042b27; font-weight:700; font-family:var(--inter); font-size:12px; padding:7px 16px; border-radius:16px; cursor:pointer; }

  /* ===== STAGE ===== */
  .stage { position:fixed; top:54px; left:0; right:0; bottom:0; overflow:auto; display:flex; align-items:center; justify-content:center; padding:26px; }
  #pages { display:flex; gap:24px; transform-origin:center center; transition:transform .15s ease; }

  /* ===== A4 LANDSCAPE PAGE ===== */
  .page { width:297mm; height:210mm; flex:0 0 auto; background:var(--paper); color:var(--ink); box-shadow:0 18px 60px rgba(0,0,0,.5); position:relative; overflow:hidden; }
  .page * { line-height:1.5; }
  .dots { position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.16) .7px,transparent .7px); background-size:18px 18px; opacity:.6; pointer-events:none; z-index:0; }
  .eyebrow { font-family:var(--inter); font-weight:500; font-size:12px; letter-spacing:.3em; text-transform:uppercase; }
  .bmark svg, .mk svg { width:100%; height:auto; display:block; }
  .qr { background:#fff; padding:4px; border-radius:4px; display:block; }
  .qr svg { display:block; }

  /* ============================================================ FRONT 1 · VETOR
     Huge P-glyph mass bleeding off the right edge on a gradient slab,
     holder name overlapping the negative space. Asymmetric, confident. */
  .f-vetor { background:var(--paper); display:flex; flex-direction:column; overflow:hidden; }
  .f-vetor .vt-slab { position:absolute; top:0; right:0; bottom:0; width:148mm; background:var(--gradr); clip-path:polygon(28% 0,100% 0,100% 100%,0 100%); z-index:0; }
  .f-vetor .vt-slab .dots { opacity:.5; }
  .f-vetor .vt-ghost { position:absolute; right:-46mm; top:50%; transform:translateY(-50%); width:215mm; opacity:.16; z-index:1; pointer-events:none; }
  .f-vetor .vt-ghost svg { width:100%; height:auto; display:block; }
  .f-vetor .vt-grid { position:absolute; inset:0; background-image:radial-gradient(rgba(6,26,81,.05) .8px,transparent .8px); background-size:20px 20px; z-index:0; pointer-events:none; }
  .f-vetor > .vt-content { position:relative; z-index:3; flex:1; display:flex; flex-direction:column; padding:17mm 22mm 14mm; }
  .f-vetor .vt-top { display:flex; justify-content:space-between; align-items:flex-start; }
  .f-vetor .vt-top .bmark { width:52mm; }
  .f-vetor .vt-top .vt-tag { font-family:var(--mono); font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:#fff; text-align:right; line-height:1.9; opacity:.9; }
  .f-vetor .vt-mid { flex:1; display:flex; flex-direction:column; justify-content:center; max-width:165mm; }
  .f-vetor .vt-mid .eyebrow { color:var(--pdark); margin-bottom:6mm; }
  .f-vetor .vt-mid .lead { font-weight:300; font-size:15px; color:var(--muted); margin-bottom:3mm; }
  .f-vetor .vt-mid .name { font-family:var(--lora); font-weight:600; font-size:74px; line-height:.98; letter-spacing:-.02em; color:var(--ink2); }
  .f-vetor .vt-mid .gbar { width:64mm; height:5px; border-radius:5px; background:var(--grad); margin:7mm 0 6mm; box-shadow:0 4px 16px var(--glow); }
  .f-vetor .vt-mid .stmt { font-size:15px; line-height:1.7; color:var(--ink); max-width:150mm; }
  .f-vetor .vt-mid .stmt b { font-weight:600; color:var(--ink2); }
  .f-vetor .vt-foot { display:flex; justify-content:space-between; align-items:flex-end; gap:18mm; }
  .f-vetor .vt-foot .meta { font-size:10.5px; color:var(--muted); line-height:1.95; letter-spacing:.01em; }
  .f-vetor .vt-foot .meta b { color:var(--ink2); font-weight:600; }
  .f-vetor .vt-vchip { display:flex; align-items:center; gap:11px; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3); border-radius:14px; padding:8px 12px; backdrop-filter:blur(4px); }
  .f-vetor .vt-vchip .qr { width:21mm; height:21mm; }
  .f-vetor .vt-vchip .vx { color:#fff; }
  .f-vetor .vt-vchip .vx .l { font-family:var(--mono); font-size:8.5px; letter-spacing:.16em; text-transform:uppercase; opacity:.78; }
  .f-vetor .vt-vchip .vx .c { font-family:var(--mono); font-weight:600; font-size:15px; letter-spacing:.08em; margin:2px 0; }
  .f-vetor .vt-vchip .vx .u { font-size:9.5px; opacity:.82; }

  /* ============================================================ FRONT 2 · AURORA
     Full-bleed gradient, layered glow orbs, soft spotlight; the name floats
     in negative space, validation is a luminous glass chip. */
  .f-aurora { background:var(--grad); color:#fff; display:flex; flex-direction:column; overflow:hidden; }
  .f-aurora .au-orb { position:absolute; border-radius:50%; filter:blur(60px); z-index:0; pointer-events:none; }
  .f-aurora .au-orb.o1 { width:120mm; height:120mm; top:-40mm; right:-30mm; background:var(--glow); opacity:.5; }
  .f-aurora .au-orb.o2 { width:90mm; height:90mm; bottom:-44mm; left:-26mm; background:rgba(125,232,214,.4); opacity:.45; }
  .f-aurora .au-spot { position:absolute; inset:0; background:radial-gradient(120% 90% at 30% 38%,rgba(255,255,255,.16),transparent 60%); z-index:0; pointer-events:none; }
  .f-aurora .au-ghost { position:absolute; left:-30mm; bottom:-58mm; width:160mm; opacity:.1; z-index:0; pointer-events:none; }
  .f-aurora .au-ghost svg { width:100%; height:auto; display:block; }
  .f-aurora > * { position:relative; z-index:2; }
  .f-aurora .au-top { padding:16mm 24mm 0; display:flex; justify-content:space-between; align-items:flex-start; }
  .f-aurora .au-top .bmark { width:54mm; filter:drop-shadow(0 6px 20px rgba(0,0,0,.3)); }
  .f-aurora .au-top .au-seal { display:flex; align-items:center; gap:8px; border:1px solid rgba(255,255,255,.34); border-radius:20px; padding:6px 14px; background:rgba(255,255,255,.08); backdrop-filter:blur(6px); }
  .f-aurora .au-top .au-seal .d { width:7px; height:7px; border-radius:50%; background:var(--acc-light); box-shadow:0 0 10px var(--acc-light); }
  .f-aurora .au-top .au-seal span { font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; }
  .f-aurora .au-body { flex:1; padding:0 24mm; display:flex; flex-direction:column; justify-content:center; }
  .f-aurora .au-body .eyebrow { color:var(--acc-light); margin-bottom:14px; }
  .f-aurora .au-body .lead { font-weight:300; font-size:16px; color:rgba(255,255,255,.82); margin-bottom:8px; }
  .f-aurora .au-body .name { font-family:var(--lora); font-weight:500; font-size:80px; line-height:.98; letter-spacing:-.015em; text-shadow:0 8px 40px rgba(0,0,0,.35); }
  .f-aurora .au-body .stmt { font-weight:300; font-size:16px; line-height:1.65; color:rgba(255,255,255,.92); max-width:195mm; margin-top:16px; }
  .f-aurora .au-body .stmt b { font-weight:600; }
  .f-aurora .au-foot { padding:14px 24mm 16mm; display:grid; grid-template-columns:1fr 1fr 1.5fr; gap:24px; border-top:1px solid rgba(255,255,255,.2); align-items:center; }
  .f-aurora .au-foot dt { font-family:var(--mono); font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.72); margin-bottom:5px; }
  .f-aurora .au-foot dd { font-family:var(--lora); font-size:14.5px; }
  .f-aurora .au-vglass { justify-self:end; display:flex; align-items:center; gap:12px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.32); border-radius:16px; padding:9px 13px; backdrop-filter:blur(8px); box-shadow:0 10px 30px rgba(0,0,0,.2); }
  .f-aurora .au-vglass .qr { width:22mm; height:22mm; }
  .f-aurora .au-vglass .vx .l { font-family:var(--mono); font-size:8.5px; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.74); }
  .f-aurora .au-vglass .vx .c { font-family:var(--mono); font-weight:600; font-size:15px; letter-spacing:.08em; margin:2px 0; }
  .f-aurora .au-vglass .vx .u { font-size:9.5px; color:rgba(255,255,255,.84); }

  /* ============================================================ FRONT 3 · CONSOLE
     Tech / terminal record. Mono metadata, a validation "code block",
     dotted grid, gradient rail. The credential reads like a verified record. */
  .f-console { background:#fff; display:flex; flex-direction:column; padding:0; overflow:hidden; }
  .f-console .cs-rail { position:absolute; top:0; left:0; bottom:0; width:9mm; background:var(--grad); z-index:2; }
  .f-console .cs-grid { position:absolute; inset:0; background-image:linear-gradient(rgba(6,26,81,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(6,26,81,.035) 1px,transparent 1px); background-size:26px 26px; z-index:0; pointer-events:none; }
  .f-console .cs-ghost { position:absolute; right:-30mm; top:-30mm; width:130mm; opacity:.05; z-index:0; pointer-events:none; }
  .f-console .cs-ghost svg { width:100%; height:auto; display:block; }
  .f-console > .cs-wrap { position:relative; z-index:3; flex:1; display:flex; flex-direction:column; padding:16mm 22mm 14mm 30mm; }
  .f-console .cs-top { display:flex; justify-content:space-between; align-items:flex-start; }
  .f-console .cs-top .bmark { width:50mm; }
  .f-console .cs-status { display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11px; color:var(--pdark); border:1px solid var(--rule); border-radius:8px; padding:6px 12px; background:var(--paper); }
  .f-console .cs-status .d { width:8px; height:8px; border-radius:50%; background:var(--teal); box-shadow:0 0 0 4px rgba(20,184,166,.18); }
  .f-console .cs-mid { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .f-console .cs-mid .kicker { font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-bottom:5mm; }
  .f-console .cs-mid .kicker b { color:var(--ink2); }
  .f-console .cs-mid .lead { font-weight:300; font-size:15px; color:var(--muted); margin-bottom:2mm; }
  .f-console .cs-mid .name { font-family:var(--lora); font-weight:600; font-size:70px; line-height:1; letter-spacing:-.02em; color:var(--ink2); }
  .f-console .cs-mid .gbar { width:58mm; height:5px; border-radius:5px; background:var(--grad); margin:6mm 0 6mm; }
  .f-console .cs-mid .stmt { font-size:14.5px; line-height:1.7; color:var(--ink); max-width:178mm; }
  .f-console .cs-mid .stmt b { font-weight:600; color:var(--ink2); }
  .f-console .cs-foot { display:grid; grid-template-columns:1fr auto; gap:18mm; align-items:end; }
  .f-console .cs-fields { display:grid; grid-template-columns:1fr 1fr 1fr; gap:5mm 8mm; }
  .f-console .cs-fields .fld .k { font-family:var(--mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .f-console .cs-fields .fld .v { font-size:12.5px; color:var(--ink2); font-weight:500; margin-top:2px; }
  .f-console .cs-block { width:74mm; border:1px solid var(--rule); border-radius:12px; overflow:hidden; box-shadow:0 12px 30px rgba(6,26,81,.1); }
  .f-console .cs-block .bb { display:flex; align-items:center; gap:6px; padding:7px 12px; background:var(--ink2); }
  .f-console .cs-block .bb i { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.34); display:inline-block; }
  .f-console .cs-block .bb i:nth-child(2){ background:var(--teal); }
  .f-console .cs-block .bb span { font-family:var(--mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.72); margin-left:6px; }
  .f-console .cs-block .bd { display:flex; align-items:center; gap:12px; padding:12px; background:#fff; }
  .f-console .cs-block .bd .qr { width:24mm; height:24mm; }
  .f-console .cs-block .bd .tx { font-family:var(--mono); font-size:10px; line-height:1.7; color:var(--muted); }
  .f-console .cs-block .bd .tx .row b { color:var(--pdark); }
  .f-console .cs-block .bd .tx .code { font-size:14px; font-weight:600; color:var(--ink2); letter-spacing:.06em; margin-top:3px; }

  /* ============================================================ FRONT 4 · DIAGONAL
     Bold diagonal gradient slash cutting across the page; name straddles the
     seam; dynamic split with layered depth and a huge corner P. */
  .f-diag { background:var(--paper); display:flex; flex-direction:column; overflow:hidden; }
  .f-diag .dg-slash { position:absolute; inset:0; background:var(--grad); clip-path:polygon(0 0,100% 0,100% 40%,0 78%); z-index:0; }
  .f-diag .dg-slash .dots { opacity:.45; }
  .f-diag .dg-edge { position:absolute; left:0; right:0; height:3px; background:var(--accent); z-index:1; transform-origin:left center; box-shadow:0 0 24px var(--glow); top:40%; clip-path:polygon(0 0,100% 60%,100% 100%,0 40%); }
  .f-diag .dg-ghost { position:absolute; left:-26mm; top:-30mm; width:140mm; opacity:.13; z-index:1; pointer-events:none; }
  .f-diag .dg-ghost svg { width:100%; height:auto; display:block; }
  .f-diag .dg-grid { position:absolute; inset:0; background-image:radial-gradient(rgba(6,26,81,.05) .8px,transparent .8px); background-size:20px 20px; z-index:0; pointer-events:none; }
  .f-diag > .dg-content { position:relative; z-index:3; flex:1; display:flex; flex-direction:column; padding:16mm 24mm 14mm; }
  .f-diag .dg-top { display:flex; justify-content:space-between; align-items:flex-start; }
  .f-diag .dg-top .bmark { width:54mm; filter:drop-shadow(0 4px 14px rgba(0,0,0,.25)); }
  .f-diag .dg-top .dg-meta { font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:#fff; text-align:right; line-height:1.95; opacity:.9; }
  .f-diag .dg-hero { margin-top:12mm; }
  .f-diag .dg-hero .eyebrow { color:var(--acc-light); margin-bottom:3mm; }
  .f-diag .dg-hero .lead { font-weight:300; font-size:15px; color:rgba(255,255,255,.85); margin-bottom:2mm; }
  .f-diag .dg-hero .name { font-family:var(--lora); font-weight:500; font-size:76px; line-height:.98; letter-spacing:-.015em; color:#fff; text-shadow:0 8px 34px rgba(0,0,0,.3); max-width:200mm; }
  .f-diag .dg-lower { flex:1; display:flex; flex-direction:column; justify-content:flex-end; }
  .f-diag .dg-lower .stmt { font-size:15px; line-height:1.7; color:var(--ink); max-width:172mm; margin-bottom:9mm; }
  .f-diag .dg-lower .stmt b { font-weight:600; color:var(--ink2); }
  .f-diag .dg-foot { display:flex; justify-content:space-between; align-items:flex-end; gap:16mm; }
  .f-diag .dg-sig .ln { border-top:1.5px solid var(--ink2); padding-top:5px; width:66mm; }
  .f-diag .dg-sig .nm { font-family:var(--lora); font-weight:600; font-size:15px; color:var(--ink2); }
  .f-diag .dg-sig .ro { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-top:3px; }
  .f-diag .dg-vbox { display:flex; align-items:center; gap:11px; }
  .f-diag .dg-vbox .qr { width:22mm; height:22mm; }
  .f-diag .dg-vbox .vx .l { font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .f-diag .dg-vbox .vx .c { font-family:var(--mono); font-weight:600; font-size:15px; letter-spacing:.06em; color:var(--ink2); margin:2px 0; }
  .f-diag .dg-vbox .vx .u { font-size:9.5px; color:var(--muted); }

  /* ============================================================ FRONT 5 · HOLOGRAMA
     Dark navy field, giant ghosted P watermark, a luminous "passport / card"
     frame, glow ring on the QR. Premium dark-mode wow. */
  .f-holo { background:var(--grad); color:#fff; display:flex; align-items:center; justify-content:center; padding:13mm; overflow:hidden; }
  .f-holo .ho-ghost { position:absolute; right:-58mm; top:50%; transform:translateY(-50%); width:240mm; opacity:.08; z-index:0; pointer-events:none; }
  .f-holo .ho-ghost svg { width:100%; height:auto; display:block; }
  .f-holo .ho-orb { position:absolute; width:120mm; height:120mm; border-radius:50%; filter:blur(70px); background:var(--glow); opacity:.4; top:-34mm; left:-28mm; z-index:0; pointer-events:none; }
  .f-holo .ho-card { position:relative; z-index:2; width:100%; height:100%; border:1px solid rgba(255,255,255,.22); border-radius:18px; background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02)); backdrop-filter:blur(2px); box-shadow:0 30px 80px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18); display:flex; flex-direction:column; padding:15mm 18mm 14mm; }
  .f-holo .ho-card .dots { border-radius:18px; opacity:.4; }
  .f-holo .ho-card > * { position:relative; z-index:1; }
  .f-holo .ho-top { display:flex; justify-content:space-between; align-items:center; }
  .f-holo .ho-top .bmark { width:50mm; filter:drop-shadow(0 4px 14px rgba(0,0,0,.3)); }
  .f-holo .ho-top .ho-id { font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.8); text-align:right; line-height:1.9; }
  .f-holo .ho-top .ho-id b { color:var(--acc-light); }
  .f-holo .ho-body { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .f-holo .ho-body .eyebrow { color:var(--acc-light); margin-bottom:12px; }
  .f-holo .ho-body .lead { font-weight:300; font-size:15px; color:rgba(255,255,255,.82); margin-bottom:6px; }
  .f-holo .ho-body .name { font-family:var(--lora); font-weight:500; font-size:72px; line-height:1; letter-spacing:-.015em; text-shadow:0 8px 36px rgba(0,0,0,.4); }
  .f-holo .ho-body .gbar { width:60mm; height:5px; border-radius:5px; background:linear-gradient(90deg,var(--acc-light),transparent); margin:6mm 0 5mm; box-shadow:0 0 20px var(--glow); }
  .f-holo .ho-body .stmt { font-weight:300; font-size:15px; line-height:1.65; color:rgba(255,255,255,.9); max-width:190mm; }
  .f-holo .ho-body .stmt b { font-weight:600; color:#fff; }
  .f-holo .ho-foot { display:flex; justify-content:space-between; align-items:flex-end; gap:18mm; padding-top:11px; border-top:1px solid rgba(255,255,255,.18); }
  .f-holo .ho-foot .meta { font-family:var(--inter); font-size:10.5px; color:rgba(255,255,255,.82); line-height:1.95; }
  .f-holo .ho-foot .meta b { color:#fff; font-weight:600; }
  .f-holo .ho-vring { display:flex; align-items:center; gap:12px; }
  .f-holo .ho-vring .qwrap { padding:5px; border-radius:10px; background:linear-gradient(135deg,var(--acc-light),var(--teal)); box-shadow:0 0 26px var(--glow); }
  .f-holo .ho-vring .qr { width:23mm; height:23mm; }
  .f-holo .ho-vring .vx .l { font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.74); }
  .f-holo .ho-vring .vx .c { font-family:var(--mono); font-weight:600; font-size:15px; letter-spacing:.08em; margin:2px 0; }
  .f-holo .ho-vring .vx .u { font-size:9.5px; color:rgba(255,255,255,.84); }

  /* ============================================================ VERSO (paisagem · 2 colunas · sem paginação) */
  .back { padding:15mm 22mm 13mm; display:flex; flex-direction:column; }
  .back .bhead { display:flex; justify-content:space-between; align-items:flex-start; }
  .back .bhead .ht .kicker { font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:var(--pdark); font-weight:700; margin-bottom:8px; }
  .back .bhead .ht .title { font-family:var(--lora); font-weight:500; font-size:30px; line-height:1.1; color:var(--ink2); letter-spacing:-.01em; max-width:185mm; }
  .back .bhead .hc { text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  .back .bhead .hc .bmark { width:42mm; }
  .back .bhead .hc .code { font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .back .bhead .hc .code b { display:block; font-size:13px; letter-spacing:.08em; color:var(--ink2); margin-top:2px; }
  .back .rule { width:56px; height:3px; background:var(--accent); margin:12px 0 0; }
  .back .bcols { flex:1; display:grid; grid-template-columns:1.55fr 1fr; gap:18mm; margin-top:7mm; }

  .back .curriculum { display:flex; flex-direction:column; }
  .back .ci { display:grid; grid-template-columns:40px 1fr; gap:14px; padding:6.5px 0; border-bottom:1px solid var(--rule); align-items:baseline; }
  .back .ci:last-child { border-bottom:none; }
  .back .ci .n { font-family:var(--lora); font-size:22px; font-weight:600; color:var(--pdark); }
  .back .ci h4 { font-family:var(--inter); font-size:14px; font-weight:700; color:var(--ink2); margin-bottom:3px; }
  .back .ci p { font-size:12.5px; color:var(--muted); line-height:1.5; margin:0; }

  .back .side { display:flex; flex-direction:column; border-left:1px solid var(--rule); padding-left:16mm; }
  .back .cargo { display:flex; border:1px solid var(--rule); border-radius:8px; overflow:hidden; margin-bottom:7mm; }
  .back .cargo .s { flex:1; padding:11px 6px; text-align:center; border-right:1px solid var(--rule); }
  .back .cargo .s:last-child { border-right:none; }
  .back .cargo .v { font-family:var(--lora); font-size:23px; font-weight:600; color:var(--ink2); line-height:1; }
  .back .cargo .v.sm { font-size:15px; }
  .back .cargo .l { font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-top:5px; }
  .back .mblk { margin-bottom:5mm; }
  .back .mblk .ml { font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-bottom:3px; }
  .back .mblk .mv { font-size:12.5px; color:var(--ink2); font-weight:500; }
  .back .mblk .mv small { display:block; color:var(--muted); font-weight:400; margin-top:1px; font-size:10.5px; }
  .back .vcard { margin-top:auto; display:flex; align-items:center; gap:12px; background:var(--cream); border:1px solid var(--rule); border-radius:10px; padding:5mm; }
  .back .vcard .qr { width:22mm; height:22mm; flex:0 0 auto; }
  .back .vcard .tx .b { font-family:var(--lora); font-size:13px; font-weight:600; color:var(--ink2); }
  .back .vcard .tx p { font-size:11px; color:var(--ink); margin:2px 0 0; }
  .back .vcard .tx .c { font-weight:700; color:var(--pdark); letter-spacing:.06em; }
  .back .pfoot { display:flex; justify-content:space-between; margin-top:6mm; padding-top:8px; border-top:1px solid var(--rule); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:600; }

  /* ===== PRINT ===== */
  @media print {
    @page { size:A4 landscape; margin:0; }
    html, body { background:#fff; }
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .toolbar { display:none !important; }
    .stage { position:static; padding:0; overflow:visible; }
    #pages { transform:none !important; gap:0; display:block; }
    .page { box-shadow:none; page-break-after:always; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <span class="brand">penso<b>IA</b> · certificado · <span style="opacity:.7">agent-b · ousado/tech</span></span>
  <div class="tgroup" id="layoutGroup">
    <label>frente</label>

<div class="stage"><div id="pages" data-pal="duo"></div></div>

<script src="../../js/brand-logos.js?v=1.0"></script>
<script>
  // ── conteúdo real do programa VNC (curriculum da proposta-final) ──
  const D = {
    holder: 'Marina Andrade Conrado',
    course: 'Inteligência Artificial: do Zero ao Entendimento Prático',
    hours: '12 horas',
    meetings: '3',
    modality: 'Presencial',
    format: '3 encontros de 4 horas',
    date: '15 de agosto de 2026',
    place: 'Aracaju · SE',
    client: 'VNC Advocacia',
    code: 'AB3HNQ4VXY',
    validar: 'pensoia.com/trilha/validar',
    issuerShort: 'EPBF Soluções em Tecnologia',
    issuer: 'EPBF Soluções em Tecnologia Ltda',
    cnpj: '65.254.064/0001-64',
    instructor: 'Élder Prudente Barbosa Filho',
    role: 'Instrutor responsável',
    modules: [
      { n:'I',   t:'Fundamentos de LLMs',           d:'Tokens, embeddings e janela de contexto, e como modelos preditivos diferem de mecanismos de busca.' },
      { n:'II',  t:'Engenharia de Prompt Avançada',  d:'Frameworks com markdown para garantir precisão e evitar resultados não profissionais.' },
      { n:'III', t:'Gestão de Riscos',               d:'Identificação e mitigação de alucinações, com atenção a precedentes e dados fictícios.' },
      { n:'IV',  t:'Panorama de Ferramentas',        d:'ChatGPT, Claude e Gemini, com NotebookLM aplicado a grandes volumes processuais.' },
      { n:'V',   t:'Laboratório Prático',            d:'Construção e teste de prompts para a advocacia, com repertório reutilizável pela equipe.' },
    ],
  };

  // ── faux QR (determinístico, parece QR real para avaliar o layout) ──
  function fauxQr(seed, mods) {
    mods = mods || 25;
    let h = 2166136261;
    for (let i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = (h * 16777619) >>> 0; }
    const bit = (i, j) => { let x = (h ^ (i*73856093) ^ (j*19349663)) >>> 0; x = (x * 2654435761) >>> 0; return (x >>> 17) & 1; };
    const cell = 4, sz = mods * cell;
    const corners = [[0,0],[0,mods-7],[mods-7,0]];
    const inFinder = (i,j) => corners.some(([bi,bj]) => i>=bi && i<bi+7 && j>=bj && j<bj+7);
    const nearFinder = (i,j) => corners.some(([bi,bj]) => i>=bi-1 && i<bi+8 && j>=bj-1 && j<bj+8);
    let r = '';
    for (let i = 0; i < mods; i++) for (let j = 0; j < mods; j++) {
      let on = false;
      if (inFinder(i,j)) {
        const c = corners.find(([bi,bj]) => i>=bi && i<bi+7 && j>=bj && j<bj+7);
        const li = i - c[0], lj = j - c[1];
        on = (li===0||li===6||lj===0||lj===6) || (li>=2&&li<=4&&lj>=2&&lj<=4);
      } else if (nearFinder(i,j)) { on = false; }
      else { on = bit(i,j) === 1; }
      if (on) r += '<rect x="'+(j*cell)+'" y="'+(i*cell)+'" width="'+cell+'" height="'+cell+'"/>';
    }
    return '<svg viewBox="0 0 '+sz+' '+sz+'" width="100%" height="100%" shape-rendering="crispEdges">'
      + '<rect width="'+sz+'" height="'+sz+'" fill="#fff"/><g fill="#061a51">'+r+'</g></svg>';
  }

  const logoFor = (where) => stdColors(where === 'grad' ? 'teal' : 'white');

  // ── FRONTS ──
  // FRONT 1 · VETOR — huge P-glyph mass bleeding off the right, name in negative space
  function fVetor() {
    return '<div class="vt-grid"></div>'
    + '<div class="vt-slab"><div class="dots"></div></div>'
    + '<div class="vt-ghost" data-mk></div>'
    + '<div class="vt-content">'
      + '<div class="vt-top"><span class="bmark" data-logo="light"></span>'
        + '<div class="vt-tag">Certificado · Nº '+D.code+'<br>'+D.client+' · '+D.place+'</div></div>'
      + '<div class="vt-mid">'
        + '<div class="eyebrow">Certificado de Participação</div>'
        + '<div class="lead">Certificamos que</div>'
        + '<h1 class="name">'+D.holder+'</h1>'
        + '<div class="gbar"></div>'
        + '<p class="stmt">concluiu o curso <b>'+D.course+'</b>, com carga horária de <b>'+D.hours+'</b>, realizado em '+D.place+'.</p>'
      + '</div>'
      + '<div class="vt-foot">'
        + '<div class="meta">Emissor · <b>'+D.issuerShort+'</b><br>Instrutor · <b>'+D.instructor+'</b><br>Emissão · <b>'+D.date+'</b></div>'
        + '<div class="vt-vchip"><span class="qr" data-qr></span><div class="vx">'
          + '<div class="l">Validação</div><div class="c">'+D.code+'</div><div class="u">'+D.validar+'</div>'
        + '</div></div>'
      + '</div>'
    + '</div>';
  }

  // FRONT 2 · AURORA — full-bleed gradient, glow orbs, name floating in light
  function fAurora() {
    return '<div class="au-orb o1"></div><div class="au-orb o2"></div>'
    + '<div class="au-spot"></div>'
    + '<div class="au-ghost" data-mk></div>'
    + '<div class="au-top"><span class="bmark" data-logo="grad"></span>'
      + '<div class="au-seal"><span class="d"></span><span>autêntico</span></div></div>'
    + '<div class="au-body">'
      + '<div class="eyebrow">Certificado de Participação</div>'
      + '<div class="lead">Certificamos que</div>'
      + '<h1 class="name">'+D.holder+'</h1>'
      + '<p class="stmt">concluiu o curso <b>'+D.course+'</b>, com carga horária de <b>'+D.hours+'</b> ('+D.format+'), realizado em '+D.place+'.</p>'
    + '</div>'
    + '<dl class="au-foot">'
      + '<div><dt>Emissão</dt><dd>'+D.date+'</dd></div>'
      + '<div><dt>Emissor</dt><dd>'+D.issuerShort+'</dd></div>'
      + '<div class="au-vglass"><span class="qr" data-qr></span><div class="vx">'
        + '<div class="l">Validação</div><div class="c">'+D.code+'</div><div class="u">'+D.validar+'</div>'
      + '</div></div>'
    + '</dl>';
  }

  // FRONT 3 · CONSOLE — tech record, mono metadata, validation "code block"
  function fConsole() {
    return '<div class="cs-grid"></div><div class="cs-rail"></div>'
    + '<div class="cs-ghost" data-mk></div>'
    + '<div class="cs-wrap">'
      + '<div class="cs-top"><span class="bmark" data-logo="light"></span>'
        + '<div class="cs-status"><span class="d"></span>verificado · pensoIA</div></div>'
      + '<div class="cs-mid">'
        + '<div class="kicker">Certificado de Participação · <b>'+D.client+'</b></div>'
        + '<div class="lead">Certificamos que</div>'
        + '<h1 class="name">'+D.holder+'</h1>'
        + '<div class="gbar"></div>'
        + '<p class="stmt">concluiu o curso <b>'+D.course+'</b>, com carga horária de <b>'+D.hours+'</b>, realizado em '+D.place+'.</p>'
      + '</div>'
      + '<div class="cs-foot">'
        + '<div class="cs-fields">'
          + '<div class="fld"><div class="k">Emissor</div><div class="v">'+D.issuerShort+'</div></div>'
          + '<div class="fld"><div class="k">Instrutor</div><div class="v">'+D.instructor+'</div></div>'
          + '<div class="fld"><div class="k">Emissão</div><div class="v">'+D.date+'</div></div>'
          + '<div class="fld"><div class="k">Carga horária</div><div class="v">'+D.hours+'</div></div>'
          + '<div class="fld"><div class="k">Modalidade</div><div class="v">'+D.modality+'</div></div>'
          + '<div class="fld"><div class="k">Local</div><div class="v">'+D.place+'</div></div>'
        + '</div>'
        + '<div class="cs-block">'
          + '<div class="bb"><i></i><i></i><i></i><span>validação</span></div>'
          + '<div class="bd"><span class="qr" data-qr></span><div class="tx">'
            + '<div class="row">scan · <b>QR</b></div>'
            + '<div class="row">'+D.validar+'</div>'
            + '<div class="code">'+D.code+'</div>'
          + '</div></div>'
        + '</div>'
      + '</div>'
    + '</div>';
  }

  // FRONT 4 · DIAGONAL — bold gradient slash, name straddling the seam
  function fDiag() {
    return '<div class="dg-grid"></div>'
    + '<div class="dg-slash"><div class="dots"></div></div>'
    + '<div class="dg-edge"></div>'
    + '<div class="dg-ghost" data-mk></div>'
    + '<div class="dg-content">'
      + '<div class="dg-top"><span class="bmark" data-logo="grad"></span>'
        + '<div class="dg-meta">Certificado · Nº '+D.code+'<br>'+D.date+'</div></div>'
      + '<div class="dg-hero">'
        + '<div class="eyebrow">Certificado de Participação</div>'
        + '<div class="lead">Certificamos que</div>'
        + '<h1 class="name">'+D.holder+'</h1>'
      + '</div>'
      + '<div class="dg-lower">'
        + '<p class="stmt">concluiu o curso <b>'+D.course+'</b>, com carga horária de <b>'+D.hours+'</b>, realizado em '+D.place+'.</p>'
        + '<div class="dg-foot">'
          + '<div class="dg-sig"><div class="ln"></div><div class="nm">'+D.instructor+'</div><div class="ro">'+D.role+'</div></div>'
          + '<div class="dg-vbox"><span class="qr" data-qr></span><div class="vx">'
            + '<div class="l">Validação</div><div class="c">'+D.code+'</div><div class="u">'+D.validar+'</div>'
          + '</div></div>'
        + '</div>'
      + '</div>'
    + '</div>';
  }

  // FRONT 5 · HOLOGRAMA — dark field, ghosted P, luminous card frame, glowing QR ring
  function fHolo() {
    return '<div class="ho-orb"></div>'
    + '<div class="ho-ghost" data-mk></div>'
    + '<div class="ho-card"><div class="dots"></div>'
      + '<div class="ho-top"><span class="bmark" data-logo="grad"></span>'
        + '<div class="ho-id">Certificado Nº <b>'+D.code+'</b><br>'+D.client+' · '+D.place+'</div></div>'
      + '<div class="ho-body">'
        + '<div class="eyebrow">Certificado de Participação</div>'
        + '<div class="lead">Certificamos que</div>'
        + '<h1 class="name">'+D.holder+'</h1>'
        + '<div class="gbar"></div>'
        + '<p class="stmt">concluiu o curso <b>'+D.course+'</b>, com carga horária de <b>'+D.hours+'</b> ('+D.format+'), realizado em '+D.place+'.</p>'
      + '</div>'
      + '<div class="ho-foot">'
        + '<div class="meta">Emissor · <b>'+D.issuerShort+'</b><br>Instrutor · <b>'+D.instructor+'</b><br>Emissão · <b>'+D.date+'</b></div>'
        + '<div class="ho-vring"><div class="qwrap"><span class="qr" data-qr></span></div><div class="vx">'
          + '<div class="l">Validação</div><div class="c">'+D.code+'</div><div class="u">'+D.validar+'</div>'
        + '</div></div>'
      + '</div>'
    + '</div>';
  }

  const FRONTS = { vetor:fVetor, aurora:fAurora, console:fConsole, diag:fDiag, holo:fHolo };

  // ── VERSO (paisagem, 2 colunas, sem paginação) ──
  function back() {
    const mods = D.modules.map(m =>
      '<div class="ci"><div class="n">'+m.n+'</div><div><h4>'+m.t+'</h4><p>'+m.d+'</p></div></div>').join('');
    return '<div class="bhead">'
      + '<div class="ht"><div class="kicker">Conteúdo Programático</div><h2 class="title">'+D.course+'.</h2></div>'
      + '<div class="hc"><span class="bmark" data-logo="light"></span><div class="code">Código<b>'+D.code+'</b></div></div>'
    + '</div>'
    + '<div class="rule"></div>'
    + '<div class="bcols">'
      + '<div class="curriculum">'+mods+'</div>'
      + '<div class="side">'
        + '<div class="cargo">'
          + '<div class="s"><div class="v">'+D.hours.replace(' horas','')+'</div><div class="l">Horas</div></div>'
          + '<div class="s"><div class="v">'+D.meetings+'</div><div class="l">Encontros</div></div>'
          + '<div class="s"><div class="v sm">'+D.modality+'</div><div class="l">Modalidade</div></div>'
        + '</div>'
        + '<div class="mblk"><div class="ml">Emissor</div><div class="mv">'+D.issuer+'<small>CNPJ '+D.cnpj+'</small></div></div>'
        + '<div class="mblk"><div class="ml">Instrutor responsável</div><div class="mv">'+D.instructor+'<small>'+D.format+'</small></div></div>'
        + '<div class="mblk"><div class="ml">Data e local de emissão</div><div class="mv">'+D.date+'<small>'+D.place+'</small></div></div>'
        + '<div class="vcard"><span class="qr" data-qr></span><div class="tx">'
          + '<div class="b">Autenticidade verificável</div>'
          + '<p>Código <span class="c">'+D.code+'</span> em '+D.validar+'</p>'
        + '</div></div>'
      + '</div>'
    + '</div>'
    + '<div class="pfoot"><span>pensoIA · Certificado de Participação</span><span>'+D.client+'</span></div>';
  }

  // ── render ──
  let state = { layout:'vetor', pal:'duo', side:'frente' };

  function makePage(kind) {
    const page = document.createElement('div');
    page.className = 'page';
    if (kind === 'front') { page.classList.add('f-' + state.layout); page.innerHTML = FRONTS[state.layout](); }
    else { page.classList.add('back'); page.innerHTML = back(); }
    page.querySelectorAll('[data-logo]').forEach(el => { el.innerHTML = glyphWordmarkTag(logoFor(el.dataset.logo)); });
    page.querySelectorAll('[data-mk]').forEach(el => { el.innerHTML = mark(stdColors('teal')); });
    page.querySelectorAll('[data-qr]').forEach(el => { el.innerHTML = fauxQr(D.code); });
    return page;
  }

  function render() {
    const host = document.getElementById('pages');
    host.dataset.pal = state.pal;
    host.innerHTML = '';
    const want = state.side === 'ambos' ? ['front','back'] : (state.side === 'verso' ? ['back'] : ['front']);
    want.forEach(k => host.appendChild(makePage(k)));
    fit();
  }

  function fit() {
    const host = document.getElementById('pages');
    host.style.transform = 'scale(1)';
    const stage = document.querySelector('.stage');
    const scale = Math.min((stage.clientWidth-50)/host.scrollWidth, (stage.clientHeight-50)/host.scrollHeight, 1);
    host.style.transform = 'scale(' + scale + ')';
  }

  function wire(groupId, key) {
    document.getElementById(groupId).addEventListener('click', e => {
      const btn = e.target.closest('.chip'); if (!btn) return;
      state[key] = btn.dataset[key];
      document.querySelectorAll('#' + groupId + ' .chip').forEach(c => c.classList.toggle('active', c === btn));
      render();
    });
  }
  wire('layoutGroup', 'layout');
  wire('palGroup', 'pal');
  wire('sideGroup', 'side');

  function doPrint() { const p = state.side; state.side = 'ambos'; render(); setTimeout(() => { window.print(); state.side = p; render(); }, 160); }
  window.doPrint = doPrint;

  window.addEventListener('resize', fit);
  render();
</script>
