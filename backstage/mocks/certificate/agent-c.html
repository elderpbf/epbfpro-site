<style>

    --paper:#fafdfc; --cream:#faf7f2; --ink:#1d2b33; --muted:#5b7975; --rule:#e3e8e6;
    --acc-light:#7de8d6;
    --lora:'Lora',serif; --inter:'Inter',sans-serif;
    --gold:#b9933f; /* noble metallic accent, used sparingly on cream */
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:#23272b; font-family:var(--inter); }

  #pages[data-pal="navy"] { --grad:linear-gradient(135deg,#0b2f73 0%,#061a51 60%,#04123a 100%); --accent:#14b8a6; --ink2:#061a51; --pdark:#0d9488; --seal-a:#0b2f73; --seal-b:#04123a; }
  #pages[data-pal="teal"] { --grad:linear-gradient(135deg,#0d9488 0%,#047857 60%,#134e4a 100%); --accent:#14b8a6; --ink2:#134e4a; --pdark:#0d9488; --seal-a:#0d9488; --seal-b:#134e4a; }

  /* ===== TOOLBAR ===== */

  /* ===== A4 LANDSCAPE PAGE ===== */

  .f-brasao { background:var(--cream); color:var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:13mm 26mm; position:relative; }

  .f-brasao .br-corner svg { width:100%; height:100%; display:block; }
  .f-brasao .br-corner.tl { top:6.4mm; left:6.4mm; }
  .f-brasao .br-corner.tr { top:6.4mm; right:6.4mm; transform:scaleX(-1); }
  .f-brasao .br-corner.bl { bottom:6.4mm; left:6.4mm; transform:scaleY(-1); }
  .f-brasao .br-corner.br { bottom:6.4mm; right:6.4mm; transform:scale(-1,-1); }
  .f-brasao > * { position:relative; z-index:1; }
  .f-brasao .crest { width:33mm; height:33mm; margin-bottom:5mm; }

  .f-brasao .br-foot .meta .lbl { font-size:8.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--pdark); font-weight:700; }

  .back .mblk .mv { font-size:12.5px; color:var(--ink2); font-weight:500; }
  .back .mblk .mv small { display:block; color:var(--muted); font-weight:400; margin-top:1px; font-size:10.5px; }

  .back .vcard .qr { width:22mm; height:22mm; flex:0 0 auto; }

  .back .vcard .tx .c { font-weight:700; color:var(--pdark); letter-spacing:.06em; }
  .back .pfoot { display:flex; justify-content:space-between; margin-top:6mm; padding-top:8px; border-top:1px solid var(--rule); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:600; }

  /* ===== PRINT ===== */
  @media print {
    @page { size:A4 landscape; margin:0; }
    html, body { background:#fff; }

    .stage { position:static; padding:0; overflow:visible; }
    #pages { transform:none !important; gap:0; display:block; }
    .page { box-shadow:none; page-break-after:always; }
  }
</style>

<script>
  // ── conteúdo real do programa VNC (curriculum da proposta-final) ── VERBATIM do mock atual ──

  // ── faux QR (determinístico, parece QR real para avaliar o layout) ── VERBATIM do mock atual ──
  function fauxQr(seed, mods) {
    mods = mods || 25;
    let h = 2166136261;
    for (let i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = (h * 16777619) >>> 0; }
    const bit = (i, j) => { let x = (h ^ (i*73856093) ^ (j*19349663)) >>> 0; x = (x * 2654435761) >>> 0; return (x >>> 17) & 1; };
    const cell = 4, sz = mods * cell;
    const corners = [[0,0],[0,mods-7],[mods-7,0]];
    const inFinder = (i,j) => corners.some(([bi,bj]) => i>=bi && i<bi+7 && j>=bj && j<bj+7);
    const nearFinder = (i,j) => corners.some(([bi,bj]) => i>=bi-1 && i<bi+8 && j>=bj-1 && j<bj+8);
    let r = '';
    for (let i = 0; i < mods; i++) for (let j = 0; j < mods; j++) {
      let on = false;
      if (inFinder(i,j)) {
        const c = corners.find(([bi,bj]) => i>=bi && i<bi+7 && j>=bj && j<bj+7);
        const li = i - c[0], lj = j - c[1];
        on = (li===0||li===6||lj===0||lj===6) || (li>=2&&li<=4&&lj>=2&&lj<=4);
      } else if (nearFinder(i,j)) { on = false; }
      else { on = bit(i,j) === 1; }
      if (on) r += '<rect x="'+(j*cell)+'" y="'+(i*cell)+'" width="'+cell+'" height="'+cell+'"/>';
    }
    return '<svg viewBox="0 0 '+sz+' '+sz+'" width="100%" height="100%" shape-rendering="crispEdges">'
      + '<rect width="'+sz+'" height="'+sz+'" fill="#fff"/><g fill="#061a51">'+r+'</g></svg>';
  }

  const logoFor = (where) => stdColors(where === 'grad' ? 'teal' : 'white');

  // =================================================================
  //  INSTITUCIONAL ATEMPORAL · helpers de selo, guilloché, brasão
  // =================================================================

  // resolve a CSS var on the current #pages palette (for SVG fills)
  function palVar(name, fallback) {
    const host = document.getElementById('pages');
    const v = getComputedStyle(host).getPropertyValue(name).trim();
    return v || fallback;
  }

  // Texto curvo em volta do anel do selo (path circular + textPath)
  function rimText(cx, cy, r, top, bottom, color, size) {
    const topPath  = 'M '+(cx-r)+' '+cy+' A '+r+' '+r+' 0 0 1 '+(cx+r)+' '+cy;     // arco superior (esq->dir)
    const botPath  = 'M '+(cx-r)+' '+cy+' A '+r+' '+r+' 0 0 0 '+(cx+r)+' '+cy;     // arco inferior (esq->dir, varre por baixo)
    return ''
      + '<defs>'
      + '<path id="rt-'+top.id+'" d="'+topPath+'"/>'
      + '<path id="rb-'+top.id+'" d="'+botPath+'"/>'
      + '</defs>'
      + '<text fill="'+color+'" font-family="Inter,sans-serif" font-size="'+size+'" font-weight="700" letter-spacing="'+(size*0.34)+'">'
      +   '<textPath href="#rt-'+top.id+'" startOffset="50%" text-anchor="middle">'+top.t+'</textPath>'
      + '</text>'
      + '<text fill="'+color+'" font-family="Inter,sans-serif" font-size="'+size+'" font-weight="600" letter-spacing="'+(size*0.30)+'">'
      +   '<textPath href="#rb-'+top.id+'" startOffset="50%" text-anchor="middle">'+bottom+'</textPath>'
      + '</text>';
  }

  // pontos regulares em volta de um anel (rebites do selo)
  function rivets(cx, cy, r, count, rad, color) {
    let s = '';
    for (let k = 0; k < count; k++) {
      const a = (k / count) * Math.PI * 2 - Math.PI / 2;
      s += '<circle cx="'+(cx + r*Math.cos(a)).toFixed(2)+'" cy="'+(cy + r*Math.sin(a)).toFixed(2)+'" r="'+rad+'" fill="'+color+'"/>';
    }
    return s;
  }

  // roseta guilloché: curvas de Lissajous sobrepostas formando padrão moiré nobre
  function guillocheRose(cx, cy, R, color, opacity, petals, loops) {
    let d = '';
    const steps = 720;
    const r1 = R, r2 = R * 0.34;
    for (let i = 0; i <= steps; i++) {
      const t = (i / steps) * Math.PI * 2;
      const rr = r1 - r2 + r2 * Math.cos(petals * t);
      const x = cx + rr * Math.cos(t + loops * t * 0.0);
      const y = cy + rr * Math.sin(t);
      // pequeno deslocamento epicicloidal para textura entrelaçada
      const ex = x + (R*0.06) * Math.cos(loops * t);
      const ey = y + (R*0.06) * Math.sin(loops * t);
      d += (i === 0 ? 'M ' : 'L ') + ex.toFixed(2) + ' ' + ey.toFixed(2) + ' ';
    }
    return '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="0.7" opacity="'+opacity+'"/>';
  }

  // SELO DE OFÍCIO completo — emblema circular com glifo P, anéis e texto de borda.
  //  size = lado do quadrado svg; light=true usa tinta clara (sobre superfícies escuras)
  function officeSeal(opts) {
    const o = Object.assign({ size:300, light:false, ring:true, rim:true, id:'s', label:'Certificado Verificável', sub:'· Autêntico ·' }, opts);
    const s = o.size, cx = s/2, cy = s/2;
    const ink   = o.light ? '#ffffff' : palVar('--ink2', '#061a51');
    const acc   = o.light ? palVar('--acc-light', '#7de8d6') : palVar('--accent', '#14b8a6');
    const faint = o.light ? 'rgba(255,255,255,.5)' : 'rgba(6,26,81,.5)';
    const rOuter = s*0.485, rRim = s*0.40, rInner = s*0.305, rGuil = s*0.27;
    // glifo P (mark) centralizado, escala ~ 0.30 do selo
    const mkColors = o.light ? stdColors('teal') : stdColors('white');
    const mkSize = s*0.30, mkX = cx - mkSize/2, mkY = cy - mkSize*0.62;
    let mkSvg = mark(mkColors);
    mkSvg = mkSvg.replace(/^<svg([^>]*)>/, '<svg$1 x="'+mkX+'" y="'+mkY+'" width="'+mkSize+'" height="'+(mkSize*757/600)+'">');
    let g = '<svg viewBox="0 0 '+s+' '+s+'" xmlns="http://www.w3.org/2000/svg">';
    g += '<circle cx="'+cx+'" cy="'+cy+'" r="'+rOuter+'" fill="none" stroke="'+ink+'" stroke-width="'+(s*0.012)+'"/>';
    g += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(rOuter - s*0.030)+'" fill="none" stroke="'+acc+'" stroke-width="'+(s*0.006)+'"/>';
    if (o.rim) {
      g += rivets(cx, cy, (rOuter + rRim)/2, 48, s*0.006, faint);
      g += rimText(cx, cy, rRim, { id:o.id, t:o.label }, o.sub, ink, s*0.052);
    }
    g += '<circle cx="'+cx+'" cy="'+cy+'" r="'+rInner+'" fill="none" stroke="'+ink+'" stroke-width="'+(s*0.006)+'"/>';
    g += guillocheRose(cx, cy, rGuil, faint, o.light ? 0.45 : 0.5, 16, 9);
    g += mkSvg;
    // pequena legenda interna inferior: "pensoIA"
    g += '<text x="'+cx+'" y="'+(cy + rInner*0.62)+'" fill="'+acc+'" font-family="Comfortaa,sans-serif" font-weight="700" font-size="'+(s*0.058)+'" text-anchor="middle" letter-spacing="'+(s*0.004)+'">pensoIA</text>';
    g += '</svg>';
    return g;
  }

  // Canto de moldura ornamental (brasão): hairline dupla + floreio guilloché de canto.
  function frameCorner(size, color, acc) {
    const s = size;
    return '<svg viewBox="0 0 '+s+' '+s+'" xmlns="http://www.w3.org/2000/svg">'
      + '<path d="M 1 '+s+' L 1 '+(s*0.18)+' Q 1 1 '+(s*0.18)+' 1 L '+s+' 1" fill="none" stroke="'+color+'" stroke-width="1.4"/>'
      + '<path d="M 6 '+s+' L 6 '+(s*0.22)+' Q 6 6 '+(s*0.22)+' 6 L '+s+' 6" fill="none" stroke="'+acc+'" stroke-width="0.8" opacity="0.8"/>'
      + '<circle cx="'+(s*0.22)+'" cy="'+(s*0.22)+'" r="'+(s*0.05)+'" fill="'+acc+'"/>'
      + '<path d="M '+(s*0.22)+' '+(s*0.45)+' C '+(s*0.10)+' '+(s*0.55)+', '+(s*0.10)+' '+(s*0.78)+', '+(s*0.30)+' '+(s*0.85)+'" fill="none" stroke="'+color+'" stroke-width="0.9" opacity="0.7"/>'
      + '<path d="M '+(s*0.45)+' '+(s*0.22)+' C '+(s*0.55)+' '+(s*0.10)+', '+(s*0.78)+' '+(s*0.10)+', '+(s*0.85)+' '+(s*0.30)+'" fill="none" stroke="'+color+'" stroke-width="0.9" opacity="0.7"/>'
      + '</svg>';
  }

  // Brasão / crest compacto: escudo arredondado com glifo P, fitas e estrela teal.
  function crest(size) {
    const s = size, cx = s/2;
    const ink = palVar('--ink2', '#061a51');
    const acc = palVar('--accent', '#14b8a6');
    const pdark = palVar('--pdark', '#0d9488');
    const mkColors = stdColors('white');
    const mkSize = s*0.42, mkX = cx - mkSize/2, mkY = s*0.20;
    let mkSvg = mark(mkColors);
    mkSvg = mkSvg.replace(/^<svg([^>]*)>/, '<svg$1 x="'+mkX+'" y="'+mkY+'" width="'+mkSize+'" height="'+(mkSize*757/600)+'">');
    // escudo
    const shield = 'M '+(s*0.18)+' '+(s*0.12)+' L '+(s*0.82)+' '+(s*0.12)+' L '+(s*0.82)+' '+(s*0.58)
      + ' Q '+(s*0.82)+' '+(s*0.84)+' '+cx+' '+(s*0.96)
      + ' Q '+(s*0.18)+' '+(s*0.84)+' '+(s*0.18)+' '+(s*0.58)+' Z';
    let g = '<svg viewBox="0 0 '+s+' '+s+'" xmlns="http://www.w3.org/2000/svg">';
    g += '<path d="'+shield+'" fill="none" stroke="'+ink+'" stroke-width="'+(s*0.018)+'"/>';
    g += '<path d="'+shield+'" fill="none" stroke="'+acc+'" stroke-width="'+(s*0.008)+'" transform="translate('+(cx)+' '+(s*0.5)+') scale(0.9) translate('+(-cx)+' '+(-s*0.5)+')"/>';
    g += mkSvg;
    // estrela / lozango teal no topo do escudo
    g += '<path d="M '+cx+' '+(s*0.015)+' l '+(s*0.028)+' '+(s*0.05)+' l '+(s*0.05)+' '+(s*0.012)+' l -'+(s*0.038)+' '+(s*0.04)+' l '+(s*0.012)+' '+(s*0.055)+' l -'+(s*0.052)+' -'+(s*0.026)+' l -'+(s*0.052)+' '+(s*0.026)+' l '+(s*0.012)+' -'+(s*0.055)+' l -'+(s*0.038)+' -'+(s*0.04)+' l '+(s*0.05)+' -'+(s*0.012)+' Z" fill="'+acc+'"/>';
    // ano gravado na base do escudo
    g += '<text x="'+cx+'" y="'+(s*0.73)+'" fill="'+pdark+'" font-family="Inter,sans-serif" font-weight="700" font-size="'+(s*0.075)+'" text-anchor="middle" letter-spacing="'+(s*0.01)+'">MMXXVI</text>';
    return g + '</svg>';
  }

  // Trilho guilloché vertical (Cátedra): coluna entrelaçada de hairlines.
  function railSvg(w, color, acc) {
    const W = w, H = 600, cx = W/2;
    let d1 = '', d2 = '';
    const steps = 120, amp = W*0.32;
    for (let i = 0; i <= steps; i++) {
      const t = i/steps, y = t*H;
      const x1 = cx + amp*Math.sin(t*Math.PI*9);
      const x2 = cx - amp*Math.sin(t*Math.PI*9);
      d1 += (i===0?'M ':'L ') + x1.toFixed(2) + ' ' + y.toFixed(2) + ' ';
      d2 += (i===0?'M ':'L ') + x2.toFixed(2) + ' ' + y.toFixed(2) + ' ';
    }
    return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" width="'+W+'" xmlns="http://www.w3.org/2000/svg">'
      + '<line x1="'+cx+'" y1="0" x2="'+cx+'" y2="'+H+'" stroke="'+color+'" stroke-width="1" opacity="0.55"/>'
      + '<path d="'+d1+'" fill="none" stroke="'+acc+'" stroke-width="1.1" opacity="0.7"/>'
      + '<path d="'+d2+'" fill="none" stroke="'+color+'" stroke-width="0.9" opacity="0.45"/>'
      + '</svg>';
  }

  // Bordadura guilloché de página inteira (Diploma): moldura dupla + roseta de cantos.
  function pageGuilloche(color, acc) {
    const W = 1122, H = 793; // px ~ A4 landscape proporção
    const inset = 26, inset2 = 34;
    let g = '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">';
    g += '<rect x="'+inset+'" y="'+inset+'" width="'+(W-2*inset)+'" height="'+(H-2*inset)+'" fill="none" stroke="'+color+'" stroke-width="2"/>';
    g += '<rect x="'+inset2+'" y="'+inset2+'" width="'+(W-2*inset2)+'" height="'+(H-2*inset2)+'" fill="none" stroke="'+acc+'" stroke-width="0.9" opacity="0.75"/>';
    // banda guilloché ondulada entre as duas molduras (topo e base)
    const wave = (y, ph) => {
      let d=''; const steps=160, amp=3.2;
      for (let i=0;i<=steps;i++){ const x=inset+ (i/steps)*(W-2*inset); const yy=y+amp*Math.sin(i/steps*Math.PI*40+ph); d+=(i===0?'M ':'L ')+x.toFixed(1)+' '+yy.toFixed(1)+' '; }
      return '<path d="'+d+'" fill="none" stroke="'+acc+'" stroke-width="0.55" opacity="0.55"/>';
    };
    g += wave(inset+4,0)+wave(inset+4,Math.PI)+wave(H-inset-4,0)+wave(H-inset-4,Math.PI);
    // rosetas de canto
    [[inset2,inset2],[W-inset2,inset2],[inset2,H-inset2],[W-inset2,H-inset2]].forEach(([x,y])=>{
      g += '<circle cx="'+x+'" cy="'+y+'" r="9" fill="none" stroke="'+color+'" stroke-width="1.2"/>';
      g += '<circle cx="'+x+'" cy="'+y+'" r="4" fill="'+acc+'"/>';
    });
    return g + '</svg>';
  }

  // Roundel / medalhão central de fundo (Pergaminho): roseta concêntrica.
  function medallion(size) {
    const s = size, cx = s/2, cy = s/2;
    const ink = palVar('--ink2', '#061a51');
    const acc = palVar('--accent', '#14b8a6');
    let g = '<svg viewBox="0 0 '+s+' '+s+'" xmlns="http://www.w3.org/2000/svg">';
    g += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(s*0.47)+'" fill="none" stroke="'+ink+'" stroke-width="2"/>';
    g += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(s*0.40)+'" fill="none" stroke="'+ink+'" stroke-width="1"/>';
    g += guillocheRose(cx, cy, s*0.38, ink, 0.9, 24, 13);
    g += guillocheRose(cx, cy, s*0.27, acc, 0.9, 18, 7);
    g += guillocheRose(cx, cy, s*0.16, ink, 0.9, 12, 5);
    return g + '</svg>';
  }

  // Ramo de louro estilizado (Pergaminho): folhas em arco.
  function laurel(w, h) {
    const W = w, H = h;
    const ink = palVar('--pdark', '#0d9488');
    let g = '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
    // haste curva
    g += '<path d="M '+(W*0.85)+' '+(H*0.02)+' Q '+(W*0.10)+' '+(H*0.5)+' '+(W*0.82)+' '+(H*0.98)+'" fill="none" stroke="'+ink+'" stroke-width="1.4"/>';
    // folhas ao longo da haste
    const n = 7;
    for (let i = 1; i <= n; i++) {
      const t = i/(n+1);
      const y = H*0.02 + t*(H*0.96);
      const x = W*0.85 - Math.sin(t*Math.PI)*(W*0.75);
      const ang = (t < 0.5 ? -40 : 40) + (t-0.5)*30;
      g += '<g transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+ang.toFixed(0)+')">'
         + '<path d="M 0 0 Q '+(W*0.14)+' -'+(H*0.04)+' '+(W*0.30)+' 0 Q '+(W*0.14)+' '+(H*0.04)+' 0 0 Z" fill="'+ink+'" opacity="0.85"/></g>';
    }
    return g + '</svg>';
  }

  // ── VERSO (paisagem, 2 colunas, sem paginação) ── VERBATIM do mock atual ──
  function back() {
    const mods = D.modules.map(m =>
      '<div class="ci"><div class="n">'+m.n+'</div><div><h4>'+m.t+'</h4><p>'+m.d+'</p></div></div>').join('');
    return '<div class="bhead">'
      + '<div class="ht"><div class="kicker">Conteúdo Programático</div><h2 class="title">'+D.course+'.</h2></div>'
      + '<div class="hc"><span class="bmark" data-logo="light"></span><div class="code">Código<b>'+D.code+'</b></div></div>'
    + '</div>'
    + '<div class="rule"></div>'
    + '<div class="bcols">'
      + '<div class="curriculum">'+mods+'</div>'
      + '<div class="side">'
        + '<div class="cargo">'
          + '<div class="s"><div class="v">'+D.hours.replace(' horas','')+'</div><div class="l">Horas</div></div>'

        + '</div></div>'
      + '</div>'
    + '</div>'
    + '<div class="pfoot"><span>pensoIA · Certificado de Participação</span><span>'+D.client+'</span></div>';
  }

  // ── render ──
  let state = { layout:'brasao', pal:'duo', side:'frente' };

  function makePage(kind) {
    const page = document.createElement('div');
    page.className = 'page';
    if (kind === 'front') { page.classList.add('f-' + state.layout); page.innerHTML = FRONTS[state.layout](); }
    else { page.classList.add('back'); page.innerHTML = back(); }
    // brand logo lockups
    page.querySelectorAll('[data-logo]').forEach(el => { el.innerHTML = glyphWordmarkTag(logoFor(el.dataset.logo)); });
    // QR codes
    page.querySelectorAll('[data-qr]').forEach(el => { el.innerHTML = fauxQr(D.code); });
    // institucional ornaments (precisam das CSS vars da paleta já aplicadas em #pages)
    const ink = palVar('--ink2', '#061a51'), acc = palVar('--accent', '#14b8a6');
    page.querySelectorAll('[data-crest]').forEach(el => { el.innerHTML = crest(300); });
    page.querySelectorAll('[data-corner]').forEach(el => { el.innerHTML = frameCorner(120, ink, acc); });
    page.querySelectorAll('[data-seal]').forEach((el,i) => { el.innerHTML = officeSeal({ size:300, light:false, id:'seal'+state.layout+i }); });
    page.querySelectorAll('[data-bigseal]').forEach((el,i) => { el.innerHTML = officeSeal({ size:340, light:true, id:'big'+i }); });
    page.querySelectorAll('[data-guilloche]').forEach(el => { el.innerHTML = pageGuilloche(ink, acc); });
    page.querySelectorAll('[data-rail]').forEach(el => { el.innerHTML = railSvg(80, ink, acc); });
    page.querySelectorAll('[data-medal]').forEach(el => { el.innerHTML = medallion(600); });
    page.querySelectorAll('[data-laurel]').forEach(el => { el.innerHTML = laurel(56, 120); });
    return page;
  }

  function render() {
    const host = document.getElementById('pages');
    host.dataset.pal = state.pal;
    host.innerHTML = '';
    const want = state.side === 'ambos' ? ['front','back'] : (state.side === 'verso' ? ['back'] : ['front']);
    want.forEach(k => host.appendChild(makePage(k)));
    fit();
  }

  function fit() {
    const host = document.getElementById('pages');
    host.style.transform = 'scale(1)';
    const stage = document.querySelector('.stage');
    const scale = Math.min((stage.clientWidth-50)/host.scrollWidth, (stage.clientHeight-50)/host.scrollHeight, 1);
    host.style.transform = 'scale(' + scale + ')';
  }

  function wire(groupId, key) {
    document.getElementById(groupId).addEventListener('click', e => {
      const btn = e.target.closest('.chip'); if (!btn) return;
      state[key] = btn.dataset[key];
      document.querySelectorAll('#' + groupId + ' .chip').forEach(c => c.classList.toggle('active', c === btn));
      render();
    });
  }
  wire('layoutGroup', 'layout');
  wire('palGroup', 'pal');
  wire('sideGroup', 'side');

  function doPrint() { const p = state.side; state.side = 'ambos'; render(); setTimeout(() => { window.print(); state.side = p; render(); }, 160); }
  window.doPrint = doPrint;

  window.addEventListener('resize', fit);
  render();
</script>
