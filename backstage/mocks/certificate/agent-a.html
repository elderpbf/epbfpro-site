<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pensoIA · certificado · editorial de luxo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#061a51; --teal:#14b8a6; --teal-dark:#0d9488; --green:#047857;
    --paper:#fafdfc; --cream:#faf7f2; --ink:#1d2b33; --muted:#5b7975; --rule:#e3e8e6;
    --acc-light:#7de8d6;
    --lora:'Lora',serif; --inter:'Inter',sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:#23272b; font-family:var(--inter); }

  #pages[data-pal="navy"] { --grad:linear-gradient(135deg,#0b2f73 0%,#061a51 60%,#04123a 100%); --accent:#14b8a6; --ink2:#061a51; --pdark:#0d9488; --deep:#04123a; --soft:#0b2f73; }
  #pages[data-pal="teal"] { --grad:linear-gradient(135deg,#0d9488 0%,#047857 60%,#134e4a 100%); --accent:#14b8a6; --ink2:#134e4a; --pdark:#0d9488; --deep:#0a3f3a; --soft:#0d9488; }
  #pages[data-pal="duo"]  { --grad:linear-gradient(135deg,#061a51 0%,#0c5f7a 64%,#14b8a6 122%); --accent:#14b8a6; --ink2:#061a51; --pdark:#0d9488; --deep:#04123a; --soft:#0c5f7a; }

  /* ===== TOOLBAR ===== */
  .toolbar { position:fixed; top:0; left:0; right:0; z-index:50; display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:11px 20px; background:rgba(6,26,81,0.96); backdrop-filter:blur(8px); color:#fff; }
  .toolbar .brand { font-family:'Comfortaa',sans-serif; font-weight:700; font-size:13px; }
  .toolbar .brand b { color:var(--teal); }
  .tgroup { display:flex; align-items:center; gap:5px; }
  .tgroup > label { font-family:var(--inter); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.5); margin-right:3px; }
  .chip { border:1px solid rgba(255,255,255,.22); background:transparent; color:rgba(255,255,255,.82); font-family:var(--inter); font-size:12px; font-weight:500; padding:5px 11px; border-radius:16px; cursor:pointer; transition:all .15s; }
  .chip:hover { border-color:rgba(255,255,255,.5); color:#fff; }
  .chip.active { background:var(--teal); border-color:var(--teal); color:#042b27; font-weight:600; }
  .toolbar .spacer { flex:1; }
  .print-btn { background:var(--teal); border:none; color:#042b27; font-weight:700; font-family:var(--inter); font-size:12px; padding:7px 16px; border-radius:16px; cursor:pointer; }

  /* ===== STAGE ===== */
  .stage { position:fixed; top:54px; left:0; right:0; bottom:0; overflow:auto; display:flex; align-items:center; justify-content:center; padding:26px; }
  #pages { display:flex; gap:24px; transform-origin:center center; transition:transform .15s ease; }

  /* ===== A4 LANDSCAPE PAGE ===== */
  .page { width:297mm; height:210mm; flex:0 0 auto; background:var(--paper); color:var(--ink); box-shadow:0 18px 60px rgba(0,0,0,.45); position:relative; overflow:hidden; }
  .page * { line-height:1.5; }
  .dots { position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.16) .7px,transparent .7px); background-size:18px 18px; opacity:.6; pointer-events:none; z-index:0; }
  .eyebrow { font-family:var(--inter); font-weight:500; font-size:12px; letter-spacing:.3em; text-transform:uppercase; }
  .bmark svg, .mk svg { width:100%; height:auto; display:block; }
  .qr { background:#fff; padding:4px; border-radius:4px; display:block; }
  .qr svg { display:block; }

  /* shared editorial micro-typography */
  .sc { font-family:var(--inter); text-transform:uppercase; letter-spacing:.34em; font-weight:500; }
  .num-fine { font-family:var(--lora); font-feature-settings:"onum" 1, "lnum" 0; }
  .glyph-wm { position:absolute; pointer-events:none; z-index:0; }
  .glyph-wm svg { width:100%; height:auto; display:block; }

  /* ============================================================ FRONT 1 · MONOGRAMA
     Vast cream field. The name is the hero, centred, dramatic Lora. A giant P glyph
     watermark bleeds off the right edge at very low opacity. Hairline inset frame. */
  .f-mono { background:
      radial-gradient(120% 90% at 18% 8%, rgba(20,184,166,.05), transparent 60%),
      var(--cream); padding:0; display:flex; }
  .f-mono .frame { position:absolute; inset:11mm; border:1px solid var(--rule); z-index:1; pointer-events:none; }
  .f-mono .frame::before { content:""; position:absolute; inset:2.4mm; border:1px solid rgba(6,26,81,.10); }
  .f-mono .wm { right:-34mm; top:50%; transform:translateY(-50%); width:170mm; opacity:.045; }
  .f-mono .inner { position:relative; z-index:2; flex:1; display:flex; flex-direction:column; padding:22mm 26mm; }
  .f-mono .m-top { display:flex; justify-content:space-between; align-items:flex-start; }
  .f-mono .m-top .bmark { width:46mm; }
  .f-mono .m-top .ref { text-align:right; }
  .f-mono .m-top .ref .sc { font-size:9px; color:var(--muted); letter-spacing:.28em; }
  .f-mono .m-top .ref .no { font-family:var(--lora); font-size:15px; color:var(--ink2); margin-top:3px; letter-spacing:.02em; }
  .f-mono .m-body { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .f-mono .m-eyebrow { font-family:var(--inter); font-size:11px; letter-spacing:.44em; text-transform:uppercase; color:var(--pdark); font-weight:600; }
  .f-mono .m-orn { display:flex; align-items:center; justify-content:center; gap:11px; margin:11mm 0 9mm; color:var(--muted); }
  .f-mono .m-orn::before, .f-mono .m-orn::after { content:""; width:26mm; height:1px; background:linear-gradient(90deg, transparent, var(--rule), transparent); }
  .f-mono .m-orn span { font-family:var(--lora); font-style:italic; font-size:15px; color:var(--muted); }
  .f-mono .m-name { font-family:var(--lora); font-weight:500; font-size:74px; line-height:1.0; letter-spacing:-.015em; color:var(--ink2); }
  .f-mono .m-stmt { font-family:var(--lora); font-weight:400; font-size:17px; line-height:1.75; color:var(--ink); max-width:182mm; margin:9mm auto 0; }
  .f-mono .m-stmt b { font-weight:600; color:var(--ink2); font-style:italic; }
  .f-mono .m-foot { display:grid; grid-template-columns:1fr 1fr auto; gap:16mm; align-items:end; padding-top:8mm; border-top:1px solid var(--rule); }
  .f-mono .m-foot .ft .sc { font-size:8.5px; color:var(--muted); letter-spacing:.26em; display:block; margin-bottom:5px; }
  .f-mono .m-foot .ft .vv { font-family:var(--lora); font-size:14px; color:var(--ink2); }
  .f-mono .m-foot .sig .ln { width:62mm; border-top:1px solid var(--ink2); margin-bottom:6px; }
  .f-mono .m-foot .sig .sg { font-family:var(--lora); font-style:italic; font-size:21px; color:var(--ink2); line-height:1; margin-bottom:7px; margin-top:-2mm; }
  .f-mono .m-foot .val { display:flex; align-items:center; gap:11px; }
  .f-mono .m-foot .val .qr { width:19mm; height:19mm; box-shadow:0 2px 10px rgba(6,26,81,.10); }
  .f-mono .m-foot .val .vt { font-size:9px; color:var(--muted); line-height:1.7; letter-spacing:.02em; }
  .f-mono .m-foot .val .vt .c { font-family:var(--lora); font-size:14px; font-weight:600; color:var(--ink2); letter-spacing:.08em; }

  /* ============================================================ FRONT 2 · FRONTISPÍCIO
     Fine-book title page. Strict centred axial composition, thin cartouche, ornament
     dots, the holder name set like the title of a monograph. */
  .f-front { background:var(--paper); display:flex; align-items:center; justify-content:center; padding:16mm; }
  .f-front .fp-wm { left:50%; top:50%; transform:translate(-50%,-50%); width:122mm; opacity:.04; }
  .f-front .plate { position:relative; z-index:2; width:100%; height:100%; border:2px solid var(--ink2); padding:4mm; }
  .f-front .plate-in { height:100%; border:1px solid rgba(6,26,81,.28); display:flex; flex-direction:column; align-items:center; text-align:center; padding:16mm 22mm; }
  .f-front .fp-mark { width:38mm; margin-bottom:8mm; }
  .f-front .fp-house { font-family:var(--inter); font-size:9.5px; letter-spacing:.4em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .f-front .fp-kicker { font-family:var(--lora); font-style:italic; font-size:19px; color:var(--pdark); margin:8mm 0 2mm; }
  .f-front .fp-rule { display:flex; align-items:center; gap:10px; color:var(--accent); margin:2mm 0 7mm; }
  .f-front .fp-rule::before, .f-front .fp-rule::after { content:""; height:1px; width:30mm; background:var(--ink2); opacity:.35; }
  .f-front .fp-rule .d { width:5px; height:5px; border-radius:50%; background:var(--accent); }
  .f-front .fp-name { font-family:var(--lora); font-weight:500; font-size:62px; line-height:1.04; letter-spacing:-.01em; color:var(--ink2); }
  .f-front .fp-stmt { font-family:var(--lora); font-size:16px; line-height:1.8; color:var(--ink); max-width:172mm; margin:7mm auto 0; }
  .f-front .fp-stmt b { font-weight:600; color:var(--ink2); }
  .f-front .fp-meta { margin-top:auto; display:flex; align-items:flex-end; justify-content:space-between; width:100%; gap:18mm; }
  .f-front .fp-meta .col { text-align:left; }
  .f-front .fp-meta .col.r { text-align:right; }
  .f-front .fp-meta .sc { font-size:8.5px; color:var(--muted); letter-spacing:.26em; display:block; margin-bottom:4px; }
  .f-front .fp-meta .vv { font-family:var(--lora); font-size:13.5px; color:var(--ink2); line-height:1.45; }
  .f-front .fp-meta .center { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .f-front .fp-meta .center .qr { width:21mm; height:21mm; }
  .f-front .fp-meta .center .c { font-family:var(--lora); font-size:13px; font-weight:600; letter-spacing:.1em; color:var(--ink2); }
  .f-front .fp-meta .center .u { font-size:8px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }

  /* ============================================================ FRONT 3 · COLUNA EDITORIAL
     Generous cream field at left holds the name; a slim restrained gradient column at
     right carries vertical small-caps + validation. Asymmetric, magazine-like. */
  .f-col { display:grid; grid-template-columns:1fr 70mm; }
  .f-col .col-main { position:relative; background:var(--cream); padding:20mm 20mm 18mm 24mm; display:flex; flex-direction:column; overflow:hidden; }
  .f-col .col-main .wm { left:-30mm; bottom:-30mm; width:140mm; opacity:.05; }
  .f-col .col-main > * { position:relative; z-index:2; }
  .f-col .cm-top { display:flex; align-items:center; gap:10px; }
  .f-col .cm-top .bmark { width:42mm; }
  .f-col .cm-eyebrow { font-family:var(--inter); font-size:10.5px; letter-spacing:.4em; text-transform:uppercase; color:var(--pdark); font-weight:600; margin-top:auto; }
  .f-col .cm-lead { font-family:var(--lora); font-style:italic; font-size:18px; color:var(--muted); margin:7mm 0 3mm; }
  .f-col .cm-name { font-family:var(--lora); font-weight:500; font-size:66px; line-height:1.0; letter-spacing:-.015em; color:var(--ink2); }
  .f-col .cm-hair { width:46mm; height:1px; background:var(--ink2); opacity:.3; margin:8mm 0; }
  .f-col .cm-stmt { font-family:var(--lora); font-size:16px; line-height:1.8; color:var(--ink); max-width:150mm; }
  .f-col .cm-stmt b { font-weight:600; color:var(--ink2); }
  .f-col .cm-sig { margin-top:auto; padding-top:8mm; }
  .f-col .cm-sig .sg { font-family:var(--lora); font-style:italic; font-size:23px; color:var(--ink2); line-height:1; }
  .f-col .cm-sig .ln { width:64mm; border-top:1px solid var(--ink2); margin:5px 0 6px; }
  .f-col .cm-sig .nm { font-family:var(--lora); font-size:14px; font-weight:600; color:var(--ink2); }
  .f-col .cm-sig .ro { font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin-top:3px; }

  .f-col .col-side { background:var(--grad); color:#fff; position:relative; display:flex; flex-direction:column; align-items:center; padding:16mm 0; overflow:hidden; }
  .f-col .col-side .dots { opacity:.4; }
  .f-col .col-side > * { position:relative; z-index:2; }
  .f-col .col-side .vert { writing-mode:vertical-rl; text-orientation:mixed; transform:rotate(180deg); font-family:var(--inter); font-size:10px; letter-spacing:.5em; text-transform:uppercase; color:rgba(255,255,255,.78); font-weight:500; margin-bottom:auto; }
  .f-col .col-side .cs-mid { display:flex; flex-direction:column; align-items:center; gap:9px; margin:auto 0; }
  .f-col .col-side .cs-mid .qr { width:32mm; height:32mm; box-shadow:0 6px 20px rgba(0,0,0,.25); }
  .f-col .col-side .cs-mid .c { font-family:var(--lora); font-size:17px; font-weight:600; letter-spacing:.12em; }
  .f-col .col-side .cs-mid .u { font-size:8px; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.72); }
  .f-col .col-side .cs-bot { font-family:var(--lora); font-style:italic; font-size:13px; color:rgba(255,255,255,.82); text-align:center; margin-top:auto; padding:0 10mm; }

  /* ============================================================ FRONT 4 · FOLHA DOURADA
     Dark navy gradient collector's plate. Name reversed in cream Lora. Engraved hairline
     border, glyph watermark, seal-cluster validation. Sophisticated, restrained gradient. */
  .f-plate { background:var(--grad); color:#fff; position:relative; display:flex; flex-direction:column; }
  .f-plate .dots { opacity:.5; }
  .f-plate .pl-border { position:absolute; inset:10mm; border:1px solid rgba(255,255,255,.30); z-index:1; pointer-events:none; }
  .f-plate .pl-border::before { content:""; position:absolute; inset:2.6mm; border:1px solid rgba(255,255,255,.14); }
  .f-plate .pl-corner { position:absolute; z-index:2; width:9mm; height:9mm; border:1px solid var(--acc-light); opacity:.7; }
  .f-plate .pl-corner.tl { top:13mm; left:13mm; border-right:none; border-bottom:none; }
  .f-plate .pl-corner.tr { top:13mm; right:13mm; border-left:none; border-bottom:none; }
  .f-plate .pl-corner.bl { bottom:13mm; left:13mm; border-right:none; border-top:none; }
  .f-plate .pl-corner.br { bottom:13mm; right:13mm; border-left:none; border-top:none; }
  .f-plate .wm { left:50%; bottom:-30mm; transform:translateX(-50%); width:150mm; opacity:.07; }
  .f-plate .pl-in { position:relative; z-index:3; flex:1; display:flex; flex-direction:column; padding:22mm 30mm; }
  .f-plate .pl-top { display:flex; justify-content:space-between; align-items:flex-start; }
  .f-plate .pl-top .bmark { width:44mm; filter:drop-shadow(0 4px 14px rgba(0,0,0,.3)); }
  .f-plate .pl-top .ref { text-align:right; }
  .f-plate .pl-top .ref .sc { font-size:8.5px; color:rgba(255,255,255,.7); letter-spacing:.28em; display:block; }
  .f-plate .pl-top .ref .no { font-family:var(--lora); font-size:15px; color:#fff; margin-top:3px; letter-spacing:.04em; }
  .f-plate .pl-body { flex:1; display:flex; flex-direction:column; justify-content:center; text-align:center; align-items:center; }
  .f-plate .pl-eyebrow { font-family:var(--inter); font-size:11px; letter-spacing:.46em; text-transform:uppercase; color:var(--acc-light); font-weight:600; }
  .f-plate .pl-lead { font-family:var(--lora); font-style:italic; font-size:17px; color:rgba(255,255,255,.84); margin:8mm 0 5mm; }
  .f-plate .pl-name { font-family:var(--lora); font-weight:500; font-size:70px; line-height:1.0; letter-spacing:-.01em; color:#fff; }
  .f-plate .pl-flourish { display:flex; align-items:center; justify-content:center; gap:12px; margin:7mm 0; color:var(--acc-light); }
  .f-plate .pl-flourish::before, .f-plate .pl-flourish::after { content:""; height:1px; width:34mm; background:linear-gradient(90deg, transparent, rgba(125,232,214,.7), transparent); }
  .f-plate .pl-flourish .d { width:5px; height:5px; border-radius:50%; background:var(--acc-light); }
  .f-plate .pl-stmt { font-family:var(--lora); font-size:16px; line-height:1.8; color:rgba(255,255,255,.92); max-width:186mm; }
  .f-plate .pl-stmt b { font-weight:600; color:#fff; }
  .f-plate .pl-foot { display:grid; grid-template-columns:1fr auto 1fr; align-items:end; gap:16mm; padding-top:8mm; border-top:1px solid rgba(255,255,255,.2); }
  .f-plate .pl-foot .ft .sc { font-size:8px; color:rgba(255,255,255,.66); letter-spacing:.24em; display:block; margin-bottom:5px; }
  .f-plate .pl-foot .ft .vv { font-family:var(--lora); font-size:13.5px; color:#fff; line-height:1.45; }
  .f-plate .pl-foot .ft.r { text-align:right; }
  .f-plate .pl-foot .ft.r .sg { font-family:var(--lora); font-style:italic; font-size:20px; color:#fff; line-height:1; margin-bottom:4px; }
  .f-plate .pl-foot .seal { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .f-plate .pl-foot .seal .qr { width:20mm; height:20mm; box-shadow:0 6px 18px rgba(0,0,0,.3); }
  .f-plate .pl-foot .seal .c { font-family:var(--lora); font-size:13px; font-weight:600; letter-spacing:.1em; color:#fff; }
  .f-plate .pl-foot .seal .u { font-size:7.5px; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.7); }

  /* ============================================================ FRONT 5 · MANUSCRITO
     Asymmetric editorial spread. A thin left marginalia rail holds metadata and the
     folio number; an oversized display name anchors the field; signature flourish. */
  .f-ms { display:grid; grid-template-columns:62mm 1fr; background:var(--paper); }
  .f-ms .ms-rail { position:relative; background:var(--cream); border-right:1px solid var(--rule); padding:20mm 14mm; display:flex; flex-direction:column; overflow:hidden; }
  .f-ms .ms-rail .folio { font-family:var(--lora); font-size:46px; font-weight:500; color:var(--ink2); line-height:1; letter-spacing:.02em; }
  .f-ms .ms-rail .folio small { display:block; font-family:var(--inter); font-size:9px; letter-spacing:.28em; text-transform:uppercase; color:var(--muted); font-weight:600; margin-top:6px; }
  .f-ms .ms-rail .marg { margin-top:13mm; display:flex; flex-direction:column; gap:8mm; }
  .f-ms .ms-rail .marg .mb .sc { font-size:8px; color:var(--muted); letter-spacing:.24em; display:block; margin-bottom:4px; }
  .f-ms .ms-rail .marg .mb .vv { font-family:var(--lora); font-size:13px; color:var(--ink2); line-height:1.45; }
  .f-ms .ms-rail .ms-mark { margin-top:auto; width:40mm; }
  .f-ms .ms-main { position:relative; padding:20mm 22mm 18mm; display:flex; flex-direction:column; overflow:hidden; }
  .f-ms .ms-main .wm { right:-26mm; top:-14mm; width:104mm; opacity:.05; }
  .f-ms .ms-main > * { position:relative; z-index:2; }
  .f-ms .ms-top { display:flex; align-items:center; justify-content:space-between; }
  .f-ms .ms-top .eyb { font-family:var(--inter); font-size:10.5px; letter-spacing:.4em; text-transform:uppercase; color:var(--pdark); font-weight:600; }
  .f-ms .ms-top .ref { font-family:var(--lora); font-size:13px; color:var(--muted); letter-spacing:.06em; }
  .f-ms .ms-lead { font-family:var(--lora); font-style:italic; font-size:18px; color:var(--muted); margin:auto 0 3mm; }
  .f-ms .ms-name { font-family:var(--lora); font-weight:500; font-size:72px; line-height:.98; letter-spacing:-.02em; color:var(--ink2); }
  .f-ms .ms-stmt { font-family:var(--lora); font-size:16px; line-height:1.8; color:var(--ink); max-width:172mm; margin-top:8mm; }
  .f-ms .ms-stmt b { font-weight:600; color:var(--ink2); }
  .f-ms .ms-foot { margin-top:auto; display:flex; align-items:flex-end; justify-content:space-between; gap:16mm; padding-top:8mm; border-top:1px solid var(--rule); }
  .f-ms .ms-foot .sig .sg { font-family:var(--lora); font-style:italic; font-size:24px; color:var(--ink2); line-height:1; }
  .f-ms .ms-foot .sig .ln { width:66mm; border-top:1px solid var(--ink2); margin:6px 0 6px; }
  .f-ms .ms-foot .sig .nm { font-family:var(--lora); font-size:14px; font-weight:600; color:var(--ink2); }
  .f-ms .ms-foot .sig .ro { font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin-top:3px; }
  .f-ms .ms-foot .val { display:flex; align-items:center; gap:11px; }
  .f-ms .ms-foot .val .qr { width:20mm; height:20mm; box-shadow:0 2px 10px rgba(6,26,81,.1); }
  .f-ms .ms-foot .val .vt { font-size:9px; color:var(--muted); line-height:1.7; }
  .f-ms .ms-foot .val .vt .c { font-family:var(--lora); font-size:14px; font-weight:600; color:var(--ink2); letter-spacing:.08em; }

  /* ============================================================ VERSO (paisagem · 2 colunas · sem paginação) */
  .back { padding:15mm 22mm 13mm; display:flex; flex-direction:column; }
  .back .bhead { display:flex; justify-content:space-between; align-items:flex-start; }
  .back .bhead .ht .kicker { font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:var(--pdark); font-weight:700; margin-bottom:8px; }
  .back .bhead .ht .title { font-family:var(--lora); font-weight:500; font-size:30px; line-height:1.1; color:var(--ink2); letter-spacing:-.01em; max-width:185mm; }
  .back .bhead .hc { text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  .back .bhead .hc .bmark { width:42mm; }
  .back .bhead .hc .code { font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .back .bhead .hc .code b { display:block; font-size:13px; letter-spacing:.08em; color:var(--ink2); margin-top:2px; }
  .back .rule { width:56px; height:3px; background:var(--accent); margin:12px 0 0; }
  .back .bcols { flex:1; display:grid; grid-template-columns:1.55fr 1fr; gap:18mm; margin-top:7mm; }

  .back .curriculum { display:flex; flex-direction:column; }
  .back .ci { display:grid; grid-template-columns:40px 1fr; gap:14px; padding:6.5px 0; border-bottom:1px solid var(--rule); align-items:baseline; }
  .back .ci:last-child { border-bottom:none; }
  .back .ci .n { font-family:var(--lora); font-size:22px; font-weight:600; color:var(--pdark); }
  .back .ci h4 { font-family:var(--inter); font-size:14px; font-weight:700; color:var(--ink2); margin-bottom:3px; }
  .back .ci p { font-size:12.5px; color:var(--muted); line-height:1.5; margin:0; }

  .back .side { display:flex; flex-direction:column; border-left:1px solid var(--rule); padding-left:16mm; }
  .back .cargo { display:flex; border:1px solid var(--rule); border-radius:8px; overflow:hidden; margin-bottom:7mm; }
  .back .cargo .s { flex:1; padding:11px 6px; text-align:center; border-right:1px solid var(--rule); }
  .back .cargo .s:last-child { border-right:none; }
  .back .cargo .v { font-family:var(--lora); font-size:23px; font-weight:600; color:var(--ink2); line-height:1; }
  .back .cargo .v.sm { font-size:15px; }
  .back .cargo .l { font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-top:5px; }
  .back .mblk { margin-bottom:5mm; }
  .back .mblk .ml { font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-bottom:3px; }
  .back .mblk .mv { font-size:12.5px; color:var(--ink2); font-weight:500; }
  .back .mblk .mv small { display:block; color:var(--muted); font-weight:400; margin-top:1px; font-size:10.5px; }
  .back .vcard { margin-top:auto; display:flex; align-items:center; gap:12px; background:var(--cream); border:1px solid var(--rule); border-radius:10px; padding:5mm; }
  .back .vcard .qr { width:22mm; height:22mm; flex:0 0 auto; }
  .back .vcard .tx .b { font-family:var(--lora); font-size:13px; font-weight:600; color:var(--ink2); }
  .back .vcard .tx p { font-size:11px; color:var(--ink); margin:2px 0 0; }
  .back .vcard .tx .c { font-weight:700; color:var(--pdark); letter-spacing:.06em; }
  .back .pfoot { display:flex; justify-content:space-between; margin-top:6mm; padding-top:8px; border-top:1px solid var(--rule); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:600; }

  /* ===== PRINT ===== */
  @media print {
    @page { size:A4 landscape; margin:0; }
    html, body { background:#fff; }
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .toolbar { display:none !important; }
    .stage { position:static; padding:0; overflow:visible; }
    #pages { transform:none !important; gap:0; display:block; }
    .page { box-shadow:none; page-break-after:always; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <span class="brand">penso<b>IA</b> · certificado</span>
  <div class="tgroup" id="layoutGroup">
    <label>frente</label>
    <button class="chip active" data-layout="mono">Monograma</button>
    <button class="chip" data-layout="front">Frontispício</button>
    <button class="chip" data-layout="col">Coluna</button>
    <button class="chip" data-layout="plate">Folha</button>
    <button class="chip" data-layout="ms">Manuscrito</button>
  </div>
  <div class="tgroup" id="palGroup">
    <label>tema</label>
    <button class="chip" data-pal="navy">Navy</button>
    <button class="chip" data-pal="teal">Teal</button>
    <button class="chip active" data-pal="duo">Duo</button>
  </div>
  <div class="tgroup" id="sideGroup">
    <label>lado</label>
    <button class="chip active" data-side="frente">Frente</button>
    <button class="chip" data-side="verso">Verso</button>
    <button class="chip" data-side="ambos">Ambos</button>
  </div>
  <span class="spacer"></span>
  <button class="print-btn" onclick="doPrint()">Imprimir / PDF</button>
</div>

<div class="stage"><div id="pages" data-pal="duo"></div></div>

<script src="../../js/brand-logos.js?v=1.0"></script>
<script>
  // ── conteúdo real do programa VNC (curriculum da proposta-final) ──
  const D = {
    holder: 'Marina Andrade Conrado',
    course: 'Inteligência Artificial: do Zero ao Entendimento Prático',
    hours: '12 horas',
    meetings: '3',
    modality: 'Presencial',
    format: '3 encontros de 4 horas',
    date: '15 de agosto de 2026',
    place: 'Aracaju · SE',
    client: 'VNC Advocacia',
    code: 'AB3HNQ4VXY',
    validar: 'pensoia.com/trilha/validar',
    issuerShort: 'EPBF Soluções em Tecnologia',
    issuer: 'EPBF Soluções em Tecnologia Ltda',
    cnpj: '65.254.064/0001-64',
    instructor: 'Élder Prudente Barbosa Filho',
    role: 'Instrutor responsável',
    modules: [
      { n:'I',   t:'Fundamentos de LLMs',           d:'Tokens, embeddings e janela de contexto, e como modelos preditivos diferem de mecanismos de busca.' },
      { n:'II',  t:'Engenharia de Prompt Avançada',  d:'Frameworks com markdown para garantir precisão e evitar resultados não profissionais.' },
      { n:'III', t:'Gestão de Riscos',               d:'Identificação e mitigação de alucinações, com atenção a precedentes e dados fictícios.' },
      { n:'IV',  t:'Panorama de Ferramentas',        d:'ChatGPT, Claude e Gemini, com NotebookLM aplicado a grandes volumes processuais.' },
      { n:'V',   t:'Laboratório Prático',            d:'Construção e teste de prompts para a advocacia, com repertório reutilizável pela equipe.' },
    ],
  };

  // ── faux QR (determinístico, parece QR real para avaliar o layout) ──
  function fauxQr(seed, mods) {
    mods = mods || 25;
    let h = 2166136261;
    for (let i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = (h * 16777619) >>> 0; }
    const bit = (i, j) => { let x = (h ^ (i*73856093) ^ (j*19349663)) >>> 0; x = (x * 2654435761) >>> 0; return (x >>> 17) & 1; };
    const cell = 4, sz = mods * cell;
    const corners = [[0,0],[0,mods-7],[mods-7,0]];
    const inFinder = (i,j) => corners.some(([bi,bj]) => i>=bi && i<bi+7 && j>=bj && j<bj+7);
    const nearFinder = (i,j) => corners.some(([bi,bj]) => i>=bi-1 && i<bi+8 && j>=bj-1 && j<bj+8);
    let r = '';
    for (let i = 0; i < mods; i++) for (let j = 0; j < mods; j++) {
      let on = false;
      if (inFinder(i,j)) {
        const c = corners.find(([bi,bj]) => i>=bi && i<bi+7 && j>=bj && j<bj+7);
        const li = i - c[0], lj = j - c[1];
        on = (li===0||li===6||lj===0||lj===6) || (li>=2&&li<=4&&lj>=2&&lj<=4);
      } else if (nearFinder(i,j)) { on = false; }
      else { on = bit(i,j) === 1; }
      if (on) r += '<rect x="'+(j*cell)+'" y="'+(i*cell)+'" width="'+cell+'" height="'+cell+'"/>';
    }
    return '<svg viewBox="0 0 '+sz+' '+sz+'" width="100%" height="100%" shape-rendering="crispEdges">'
      + '<rect width="'+sz+'" height="'+sz+'" fill="#fff"/><g fill="#061a51">'+r+'</g></svg>';
  }

  const logoFor = (where) => stdColors(where === 'grad' ? 'teal' : 'white');

  // ── helper: P glyph watermark (mark only, single brand color, low opacity via CSS) ──
  function glyphWM(tone) {
    // tone 'light' -> navy P for cream/paper surfaces; tone 'grad' -> all-white P for dark surfaces.
    return mark(stdColors(tone === 'grad' ? 'teal' : 'white'));
  }

  // ── FRONTS · EDITORIAL DE LUXO ──

  // 1 · MONOGRAMA
  function fMono() {
    return '<div class="frame"></div>'
    + '<span class="glyph-wm wm" data-wm="light"></span>'
    + '<div class="inner">'
      + '<div class="m-top"><span class="bmark" data-logo="light"></span>'
        + '<div class="ref"><span class="sc">Certificado n.º</span><div class="no">'+D.code+'</div></div></div>'
      + '<div class="m-body">'
        + '<div class="m-eyebrow">Certificado de Participação</div>'
        + '<div class="m-orn"><span>certificamos que</span></div>'
        + '<h1 class="m-name">'+D.holder+'</h1>'
        + '<p class="m-stmt">concluiu, com aproveitamento, o curso <b>'+D.course+'</b>, com carga horária de '+D.hours+', realizado em '+D.place+'.</p>'
      + '</div>'
      + '<div class="m-foot">'
        + '<div class="ft"><span class="sc">Emissão</span><div class="vv">'+D.date+'</div></div>'
        + '<div class="sig"><div class="sg">Élder B. Filho</div><div class="ln"></div><div class="ft"><span class="sc" style="margin-bottom:3px">Instrutor responsável</span><div class="vv" style="font-size:13px">'+D.instructor+'</div></div></div>'
        + '<div class="val"><span class="qr" data-qr></span><div class="vt"><span class="c">'+D.code+'</span><br>'+D.validar+'</div></div>'
      + '</div>'
    + '</div>';
  }

  // 2 · FRONTISPÍCIO
  function fFront() {
    return '<span class="glyph-wm fp-wm" data-wm="light"></span>'
    + '<div class="plate"><div class="plate-in">'
      + '<span class="fp-mark" data-mark="light"></span>'
      + '<div class="fp-house">'+D.issuerShort+' · pensoIA</div>'
      + '<div class="fp-kicker">Certificado de Participação</div>'
      + '<div class="fp-rule"><span class="d"></span></div>'
      + '<h1 class="fp-name">'+D.holder+'</h1>'
      + '<p class="fp-stmt">concluiu o curso <b>'+D.course+'</b>, com carga horária de <b>'+D.hours+'</b> ('+D.format+'), realizado em '+D.place+'.</p>'
      + '<div class="fp-meta">'
        + '<div class="col"><span class="sc">Emissão</span><div class="vv">'+D.date+'</div></div>'
        + '<div class="center"><span class="qr" data-qr></span><div class="c">'+D.code+'</div><div class="u">'+D.validar+'</div></div>'
        + '<div class="col r"><span class="sc">Instrutor</span><div class="vv">'+D.instructor+'</div></div>'
      + '</div>'
    + '</div></div>';
  }

  // 3 · COLUNA EDITORIAL
  function fCol() {
    return '<div class="col-main"><span class="glyph-wm wm" data-wm="light"></span>'
      + '<div class="cm-top"><span class="bmark" data-logo="light"></span></div>'
      + '<div class="cm-eyebrow">Certificado de Participação</div>'
      + '<div class="cm-lead">certificamos que</div>'
      + '<h1 class="cm-name">'+D.holder+'</h1>'
      + '<div class="cm-hair"></div>'
      + '<p class="cm-stmt">concluiu o curso <b>'+D.course+'</b>, com carga horária de <b>'+D.hours+'</b>, realizado em '+D.place+'.</p>'
      + '<div class="cm-sig"><div class="sg">Élder B. Filho</div><div class="ln"></div><div class="nm">'+D.instructor+'</div><div class="ro">'+D.role+'</div></div>'
    + '</div>'
    + '<div class="col-side"><div class="dots"></div>'
      + '<div class="vert">'+D.issuerShort+' · '+D.date+'</div>'
      + '<div class="cs-mid"><span class="qr" data-qr></span><div class="c">'+D.code+'</div><div class="u">autenticidade verificável</div></div>'
      + '<div class="cs-bot">'+D.validar+'</div>'
    + '</div>';
  }

  // 4 · FOLHA DOURADA
  function fPlate() {
    return '<div class="dots"></div><div class="pl-border"></div>'
    + '<span class="pl-corner tl"></span><span class="pl-corner tr"></span><span class="pl-corner bl"></span><span class="pl-corner br"></span>'
    + '<span class="glyph-wm wm" data-wm="grad"></span>'
    + '<div class="pl-in">'
      + '<div class="pl-top"><span class="bmark" data-logo="grad"></span>'
        + '<div class="ref"><span class="sc">Certificado n.º</span><div class="no">'+D.code+'</div></div></div>'
      + '<div class="pl-body">'
        + '<div class="pl-eyebrow">Certificado de Participação</div>'
        + '<div class="pl-lead">certificamos que</div>'
        + '<h1 class="pl-name">'+D.holder+'</h1>'
        + '<div class="pl-flourish"><span class="d"></span></div>'
        + '<p class="pl-stmt">concluiu o curso <b>'+D.course+'</b>, com carga horária de <b>'+D.hours+'</b>, realizado em '+D.place+'.</p>'
      + '</div>'
      + '<div class="pl-foot">'
        + '<div class="ft"><span class="sc">Emissão</span><div class="vv">'+D.date+'<br>'+D.issuerShort+'</div></div>'
        + '<div class="seal"><span class="qr" data-qr></span><div class="c">'+D.code+'</div><div class="u">'+D.validar+'</div></div>'
        + '<div class="ft r"><div class="sg">Élder B. Filho</div><span class="sc">'+D.role+'</span><div class="vv" style="font-size:13px">'+D.instructor+'</div></div>'
      + '</div>'
    + '</div>';
  }

  // 5 · MANUSCRITO
  function fMs() {
    return '<div class="ms-rail">'
      + '<div class="folio">No. 01<small>Certificado</small></div>'
      + '<div class="marg">'
        + '<div class="mb"><span class="sc">Emissor</span><div class="vv">'+D.issuer+'</div></div>'
        + '<div class="mb"><span class="sc">Carga horária</span><div class="vv">'+D.hours+' · '+D.format+'</div></div>'
        + '<div class="mb"><span class="sc">Local e data</span><div class="vv">'+D.place+'<br>'+D.date+'</div></div>'
        + '<div class="mb"><span class="sc">Cliente</span><div class="vv">'+D.client+'</div></div>'
      + '</div>'
      + '<span class="ms-mark" data-logo="light"></span>'
    + '</div>'
    + '<div class="ms-main"><span class="glyph-wm wm" data-wm="light"></span>'
      + '<div class="ms-top"><span class="eyb">Certificado de Participação</span><span class="ref">'+D.code+'</span></div>'
      + '<div class="ms-lead">certificamos que</div>'
      + '<h1 class="ms-name">'+D.holder+'</h1>'
      + '<p class="ms-stmt">concluiu o curso <b>'+D.course+'</b>, com carga horária de <b>'+D.hours+'</b>, realizado em '+D.place+', integrando o programa de capacitação em IA Generativa conduzido para a equipe.</p>'
      + '<div class="ms-foot">'
        + '<div class="sig"><div class="sg">Élder B. Filho</div><div class="ln"></div><div class="nm">'+D.instructor+'</div><div class="ro">'+D.role+'</div></div>'
        + '<div class="val"><span class="qr" data-qr></span><div class="vt">verifique em<br>'+D.validar+'<br><span class="c">'+D.code+'</span></div></div>'
      + '</div>'
    + '</div>';
  }

  const FRONTS = { mono:fMono, front:fFront, col:fCol, plate:fPlate, ms:fMs };

  // ── VERSO (paisagem, 2 colunas, sem paginação) ──
  function back() {
    const mods = D.modules.map(m =>
      '<div class="ci"><div class="n">'+m.n+'</div><div><h4>'+m.t+'</h4><p>'+m.d+'</p></div></div>').join('');
    return '<div class="bhead">'
      + '<div class="ht"><div class="kicker">Conteúdo Programático</div><h2 class="title">'+D.course+'.</h2></div>'
      + '<div class="hc"><span class="bmark" data-logo="light"></span><div class="code">Código<b>'+D.code+'</b></div></div>'
    + '</div>'
    + '<div class="rule"></div>'
    + '<div class="bcols">'
      + '<div class="curriculum">'+mods+'</div>'
      + '<div class="side">'
        + '<div class="cargo">'
          + '<div class="s"><div class="v">'+D.hours.replace(' horas','')+'</div><div class="l">Horas</div></div>'
          + '<div class="s"><div class="v">'+D.meetings+'</div><div class="l">Encontros</div></div>'
          + '<div class="s"><div class="v sm">'+D.modality+'</div><div class="l">Modalidade</div></div>'
        + '</div>'
        + '<div class="mblk"><div class="ml">Emissor</div><div class="mv">'+D.issuer+'<small>CNPJ '+D.cnpj+'</small></div></div>'
        + '<div class="mblk"><div class="ml">Instrutor responsável</div><div class="mv">'+D.instructor+'<small>'+D.format+'</small></div></div>'
        + '<div class="mblk"><div class="ml">Data e local de emissão</div><div class="mv">'+D.date+'<small>'+D.place+'</small></div></div>'
        + '<div class="vcard"><span class="qr" data-qr></span><div class="tx">'
          + '<div class="b">Autenticidade verificável</div>'
          + '<p>Código <span class="c">'+D.code+'</span> em '+D.validar+'</p>'
        + '</div></div>'
      + '</div>'
    + '</div>'
    + '<div class="pfoot"><span>pensoIA · Certificado de Participação</span><span>'+D.client+'</span></div>';
  }

  // ── render ──
  let state = { layout:'mono', pal:'duo', side:'frente' };

  function makePage(kind) {
    const page = document.createElement('div');
    page.className = 'page';
    if (kind === 'front') { page.classList.add('f-' + state.layout); page.innerHTML = FRONTS[state.layout](); }
    else { page.classList.add('back'); page.innerHTML = back(); }
    page.querySelectorAll('[data-logo]').forEach(el => { el.innerHTML = glyphWordmarkTag(logoFor(el.dataset.logo)); });
    page.querySelectorAll('[data-mark]').forEach(el => { el.innerHTML = mark(logoFor(el.dataset.mark)); });
    page.querySelectorAll('[data-mk]').forEach(el => { el.innerHTML = mark(stdColors('teal')); });
    page.querySelectorAll('[data-wm]').forEach(el => { el.innerHTML = glyphWM(el.dataset.wm); });
    page.querySelectorAll('[data-qr]').forEach(el => { el.innerHTML = fauxQr(D.code); });
    return page;
  }

  function render() {
    const host = document.getElementById('pages');
    host.dataset.pal = state.pal;
    host.innerHTML = '';
    const want = state.side === 'ambos' ? ['front','back'] : (state.side === 'verso' ? ['back'] : ['front']);
    want.forEach(k => host.appendChild(makePage(k)));
    fit();
  }

  function fit() {
    const host = document.getElementById('pages');
    host.style.transform = 'scale(1)';
    const stage = document.querySelector('.stage');
    const scale = Math.min((stage.clientWidth-50)/host.scrollWidth, (stage.clientHeight-50)/host.scrollHeight, 1);
    host.style.transform = 'scale(' + scale + ')';
  }

  function wire(groupId, key) {
    document.getElementById(groupId).addEventListener('click', e => {
      const btn = e.target.closest('.chip'); if (!btn) return;
      state[key] = btn.dataset[key];
      document.querySelectorAll('#' + groupId + ' .chip').forEach(c => c.classList.toggle('active', c === btn));
      render();
    });
  }
  wire('layoutGroup', 'layout');
  wire('palGroup', 'pal');
  wire('sideGroup', 'side');

  function doPrint() { const p = state.side; state.side = 'ambos'; render(); setTimeout(() => { window.print(); state.side = p; render(); }, 160); }
  window.doPrint = doPrint;

  window.addEventListener('resize', fit);
  render();
</script>
</body>
