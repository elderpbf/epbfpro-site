<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pensoIA · certificado · mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700&family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#061a51; --teal:#14b8a6; --teal-dark:#0d9488; --green:#047857;
    --paper:#fafdfc; --cream:#faf7f2; --ink:#1d2b33; --muted:#5b7975; --rule:#e3e8e6;
    --acc-light:#7de8d6;
    --lora:'Lora',serif; --inter:'Inter',sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:#23272b; font-family:var(--inter); }

  #pages[data-pal="navy"] { --grad:linear-gradient(135deg,#0b2f73 0%,#061a51 60%,#04123a 100%); --accent:#14b8a6; --ink2:#061a51; --pdark:#0d9488; }
  #pages[data-pal="teal"] { --grad:linear-gradient(135deg,#0d9488 0%,#047857 60%,#134e4a 100%); --accent:#14b8a6; --ink2:#134e4a; --pdark:#0d9488; }
  #pages[data-pal="duo"]  { --grad:linear-gradient(135deg,#061a51 0%,#0c5f7a 64%,#14b8a6 122%); --accent:#14b8a6; --ink2:#061a51; --pdark:#0d9488; }

  /* ===== TOOLBAR ===== */
  .toolbar { position:fixed; top:0; left:0; right:0; z-index:50; display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:11px 20px; background:rgba(6,26,81,0.96); backdrop-filter:blur(8px); color:#fff; }
  .toolbar .brand { font-family:'Comfortaa',sans-serif; font-weight:700; font-size:13px; }
  .toolbar .brand b { color:var(--teal); }
  .tgroup { display:flex; align-items:center; gap:5px; }
  .tgroup > label { font-family:var(--inter); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.5); margin-right:3px; }
  .chip { border:1px solid rgba(255,255,255,.22); background:transparent; color:rgba(255,255,255,.82); font-family:var(--inter); font-size:12px; font-weight:500; padding:5px 11px; border-radius:16px; cursor:pointer; transition:all .15s; }
  .chip:hover { border-color:rgba(255,255,255,.5); color:#fff; }
  .chip.active { background:var(--teal); border-color:var(--teal); color:#042b27; font-weight:600; }
  .toolbar .spacer { flex:1; }
  .print-btn { background:var(--teal); border:none; color:#042b27; font-weight:700; font-family:var(--inter); font-size:12px; padding:7px 16px; border-radius:16px; cursor:pointer; }

  /* ===== STAGE ===== */
  .stage { position:fixed; top:54px; left:0; right:0; bottom:0; overflow:auto; display:flex; align-items:center; justify-content:center; padding:26px; }
  #pages { display:flex; gap:24px; transform-origin:center center; transition:transform .15s ease; }

  /* ===== A4 LANDSCAPE PAGE ===== */
  .page { width:297mm; height:210mm; flex:0 0 auto; background:var(--paper); color:var(--ink); box-shadow:0 18px 60px rgba(0,0,0,.45); position:relative; overflow:hidden; }
  .page * { line-height:1.5; }
  .dots { position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.16) .7px,transparent .7px); background-size:18px 18px; opacity:.6; pointer-events:none; z-index:0; }
  .eyebrow { font-family:var(--inter); font-weight:500; font-size:12px; letter-spacing:.3em; text-transform:uppercase; }
  .bmark svg, .mk svg { width:100%; height:auto; display:block; }
  .qr { background:#fff; padding:4px; border-radius:4px; display:block; }
  .qr svg { display:block; }

  /* ============================================================ FRONT 1 · CAPA */
  .f-capa { background:var(--grad); color:#fff; display:flex; flex-direction:column; }
  .f-capa > * { position:relative; z-index:1; }
  .f-capa .capa-top { padding:16mm 24mm 0; display:flex; justify-content:space-between; align-items:flex-start; }
  .f-capa .bmark { width:56mm; filter:drop-shadow(0 4px 14px rgba(0,0,0,.25)); }
  .f-capa .capa-meta { font-size:11px; letter-spacing:.22em; text-transform:uppercase; text-align:right; color:rgba(255,255,255,.82); line-height:1.9; }
  .f-capa .capa-body { flex:1; padding:0 24mm; display:flex; flex-direction:column; justify-content:center; }
  .f-capa .eyebrow { color:var(--acc-light); margin-bottom:14px; }
  .f-capa .lead { font-weight:300; font-size:15px; color:rgba(255,255,255,.85); margin-bottom:8px; }
  .f-capa .name { font-family:var(--lora); font-weight:500; font-size:62px; line-height:1.03; letter-spacing:-.01em; margin-bottom:18px; }
  .f-capa .sub { font-weight:300; font-size:16px; line-height:1.6; color:rgba(255,255,255,.92); max-width:200mm; }
  .f-capa .sub b { font-weight:500; }
  .f-capa .capa-foot { padding:13px 24mm 16mm; display:grid; grid-template-columns:1fr 1fr 1.5fr; gap:24px; border-top:1px solid rgba(255,255,255,.18); }
  .f-capa .capa-foot dt { font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.72); font-weight:600; margin-bottom:5px; }
  .f-capa .capa-foot dd { font-family:var(--lora); font-size:14px; }
  .f-capa .vfield dd { display:flex; align-items:center; gap:10px; }
  .f-capa .vfield .qr { width:18mm; height:18mm; }
  .f-capa .vfield .vc { font-family:var(--inter); font-size:13px; font-weight:700; letter-spacing:.06em; }
  .f-capa .vfield .vc small { display:block; font-weight:400; font-size:9.5px; color:rgba(255,255,255,.7); letter-spacing:.02em; margin-top:2px; }

  /* ============================================================ FRONT 2 · EDITORIAL (faixa no topo) */
  .f-edit { display:flex; flex-direction:column; }
  .f-edit .band { background:var(--grad); color:#fff; position:relative; padding:14mm 24mm 12mm; }
  .f-edit .band > * { position:relative; z-index:1; }
  .f-edit .band .bmark { width:50mm; filter:drop-shadow(0 4px 14px rgba(0,0,0,.22)); }
  .f-edit .band .eyebrow { color:var(--acc-light); margin-top:9mm; }
  .f-edit .band .lead { font-weight:300; color:rgba(255,255,255,.9); font-size:15px; margin-top:7px; }
  .f-edit .body { flex:1; padding:13mm 24mm; display:flex; flex-direction:column; }
  .f-edit .name { font-family:var(--lora); font-weight:500; font-size:54px; line-height:1.04; color:var(--ink2); margin-bottom:14px; }
  .f-edit .stmt { font-size:16px; line-height:1.75; color:var(--ink); max-width:200mm; }
  .f-edit .stmt b { font-weight:600; color:var(--ink2); }
  .f-edit .efoot { margin-top:auto; display:grid; grid-template-columns:1fr auto; gap:24mm; align-items:end; }
  .f-edit .sig .ln { border-top:1.5px solid var(--ink2); padding-top:5px; width:70mm; }
  .f-edit .sig .nm { font-family:var(--lora); font-weight:600; font-size:15px; color:var(--ink2); }
  .f-edit .sig .ro { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-top:3px; }
  .f-edit .vbox { display:flex; align-items:center; gap:10px; }
  .f-edit .vbox .qr { width:20mm; height:20mm; }
  .f-edit .vbox .vm { font-size:10px; color:var(--muted); line-height:1.7; }
  .f-edit .vbox .vm .c { font-size:13px; font-weight:700; color:var(--ink2); letter-spacing:.06em; }

  /* ============================================================ FRONT 3 · SELO (selo à esquerda) */
  .f-selo { display:grid; grid-template-columns:92mm 1fr; align-items:center; gap:16mm; padding:18mm 22mm; }
  .f-selo .sealcol { display:flex; flex-direction:column; align-items:center; gap:7mm; }
  .f-selo .sealcol .bmark { width:54mm; }
  .f-selo .seal { width:60mm; height:60mm; border-radius:50%; background:var(--grad); position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; box-shadow:0 14px 34px rgba(6,26,81,.28); }
  .f-selo .seal .dots { border-radius:50%; background-size:12px 12px; opacity:.5; }
  .f-selo .seal .mk { width:17mm; position:relative; z-index:1; }
  .f-selo .seal .sl { font-size:8.5px; letter-spacing:.24em; text-transform:uppercase; margin-top:5px; color:rgba(255,255,255,.92); position:relative; z-index:1; }
  .f-selo .txt .eyebrow { color:var(--pdark); }
  .f-selo .txt .lead { font-weight:300; color:var(--muted); font-size:15px; margin:5mm 0 2mm; }
  .f-selo .txt .name { font-family:var(--lora); font-weight:500; font-size:52px; line-height:1.04; color:var(--ink2); margin-bottom:5mm; }
  .f-selo .txt .stmt { font-size:15.5px; line-height:1.75; color:var(--ink); max-width:150mm; }
  .f-selo .txt .foot { margin-top:8mm; display:flex; align-items:center; gap:14px; }
  .f-selo .txt .foot .qr { width:20mm; height:20mm; }
  .f-selo .txt .foot .fm { font-size:11px; color:var(--muted); line-height:1.7; }
  .f-selo .txt .foot .fm .c { font-weight:700; color:var(--ink2); letter-spacing:.06em; font-size:13px; }

  /* ============================================================ FRONT 4 · SPLIT (painel à esquerda) */
  .f-split { display:grid; grid-template-columns:104mm 1fr; }
  .f-split .panel { background:var(--grad); color:#fff; position:relative; padding:18mm 16mm; display:flex; flex-direction:column; }
  .f-split .panel > * { position:relative; z-index:1; }
  .f-split .panel .bmark { width:54mm; filter:drop-shadow(0 4px 14px rgba(0,0,0,.22)); }
  .f-split .panel .badge { display:inline-flex; align-items:center; gap:6px; margin-top:11mm; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.32); border-radius:16px; padding:4px 12px; font-size:11px; font-weight:600; align-self:flex-start; }
  .f-split .panel .pcode { margin-top:auto; }
  .f-split .panel .pcode .lbl { font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.72); }
  .f-split .panel .pcode .c { font-weight:700; font-size:25px; letter-spacing:.08em; margin:4px 0 2px; }
  .f-split .panel .pcode .url { font-size:10px; color:rgba(255,255,255,.78); }
  .f-split .panel .qr { width:32mm; height:32mm; margin-top:8mm; }
  .f-split .main { padding:22mm 22mm; display:flex; flex-direction:column; }
  .f-split .main .eyebrow { color:var(--pdark); }
  .f-split .main .lead { font-weight:300; color:var(--muted); font-size:15px; margin:5mm 0 2mm; }
  .f-split .main .name { font-family:var(--lora); font-weight:500; font-size:52px; line-height:1.05; color:var(--ink2); margin-bottom:6mm; }
  .f-split .main .stmt { font-size:15.5px; line-height:1.75; color:var(--ink); }
  .f-split .main .stmt b { font-weight:600; color:var(--ink2); }
  .f-split .main .sig { margin-top:auto; }
  .f-split .main .sig .ln { border-top:1.5px solid var(--ink2); padding-top:5px; width:70mm; }
  .f-split .main .sig .nm { font-family:var(--lora); font-weight:600; font-size:15px; color:var(--ink2); }
  .f-split .main .sig .ro { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-top:3px; }

  /* ============================================================ FRONT 5 · MINIMAL BOLD */
  .f-min { background:#fff; padding:18mm 24mm; display:flex; flex-direction:column; }
  .f-min .bmark { width:48mm; }
  .f-min .blk { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .f-min .eyebrow { color:var(--pdark); }
  .f-min .lead { font-weight:300; color:var(--muted); font-size:15px; margin:5mm 0 2mm; }
  .f-min .name { font-family:var(--lora); font-weight:500; font-size:68px; line-height:1.01; color:var(--ink2); }
  .f-min .gbar { width:70mm; height:6px; border-radius:6px; background:var(--grad); margin:6mm 0; }
  .f-min .stmt { font-size:15.5px; line-height:1.75; color:var(--ink); max-width:185mm; }
  .f-min .stmt b { font-weight:600; color:var(--ink2); }
  .f-min .foot { display:flex; justify-content:space-between; align-items:flex-end; }
  .f-min .foot .meta { font-size:10.5px; letter-spacing:.02em; color:var(--muted); line-height:1.9; }
  .f-min .foot .meta b { color:var(--ink2); font-weight:600; }
  .f-min .foot .qrwrap { text-align:center; }
  .f-min .foot .qr { width:22mm; height:22mm; }
  .f-min .foot .code { font-size:12px; font-weight:700; letter-spacing:.08em; color:var(--ink2); margin-top:4px; }

  /* ============================================================ VERSO (paisagem · 2 colunas · sem paginação) */
  .back { padding:15mm 22mm 13mm; display:flex; flex-direction:column; }
  .back .bhead { display:flex; justify-content:space-between; align-items:flex-start; }
  .back .bhead .ht .kicker { font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:var(--pdark); font-weight:700; margin-bottom:8px; }
  .back .bhead .ht .title { font-family:var(--lora); font-weight:500; font-size:30px; line-height:1.1; color:var(--ink2); letter-spacing:-.01em; max-width:185mm; }
  .back .bhead .hc { text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  .back .bhead .hc .bmark { width:42mm; }
  .back .bhead .hc .code { font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .back .bhead .hc .code b { display:block; font-size:13px; letter-spacing:.08em; color:var(--ink2); margin-top:2px; }
  .back .rule { width:56px; height:3px; background:var(--accent); margin:12px 0 0; }
  .back .bcols { flex:1; display:grid; grid-template-columns:1.55fr 1fr; gap:18mm; margin-top:7mm; }

  .back .curriculum { display:flex; flex-direction:column; }
  .back .ci { display:grid; grid-template-columns:40px 1fr; gap:14px; padding:6.5px 0; border-bottom:1px solid var(--rule); align-items:baseline; }
  .back .ci:last-child { border-bottom:none; }
  .back .ci .n { font-family:var(--lora); font-size:22px; font-weight:600; color:var(--pdark); }
  .back .ci h4 { font-family:var(--inter); font-size:14px; font-weight:700; color:var(--ink2); margin-bottom:3px; }
  .back .ci p { font-size:12.5px; color:var(--muted); line-height:1.5; margin:0; }

  .back .side { display:flex; flex-direction:column; border-left:1px solid var(--rule); padding-left:16mm; }
  .back .cargo { display:flex; border:1px solid var(--rule); border-radius:8px; overflow:hidden; margin-bottom:7mm; }
  .back .cargo .s { flex:1; padding:11px 6px; text-align:center; border-right:1px solid var(--rule); }
  .back .cargo .s:last-child { border-right:none; }
  .back .cargo .v { font-family:var(--lora); font-size:23px; font-weight:600; color:var(--ink2); line-height:1; }
  .back .cargo .v.sm { font-size:15px; }
  .back .cargo .l { font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-top:5px; }
  .back .mblk { margin-bottom:5mm; }
  .back .mblk .ml { font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-bottom:3px; }
  .back .mblk .mv { font-size:12.5px; color:var(--ink2); font-weight:500; }
  .back .mblk .mv small { display:block; color:var(--muted); font-weight:400; margin-top:1px; font-size:10.5px; }
  .back .vcard { margin-top:auto; display:flex; align-items:center; gap:12px; background:var(--cream); border:1px solid var(--rule); border-radius:10px; padding:5mm; }
  .back .vcard .qr { width:22mm; height:22mm; flex:0 0 auto; }
  .back .vcard .tx .b { font-family:var(--lora); font-size:13px; font-weight:600; color:var(--ink2); }
  .back .vcard .tx p { font-size:11px; color:var(--ink); margin:2px 0 0; }
  .back .vcard .tx .c { font-weight:700; color:var(--pdark); letter-spacing:.06em; }
  .back .pfoot { display:flex; justify-content:space-between; margin-top:6mm; padding-top:8px; border-top:1px solid var(--rule); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:600; }

  /* ===== PRINT ===== */
  @media print {
    @page { size:A4 landscape; margin:0; }
    html, body { background:#fff; }
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .toolbar { display:none !important; }
    .stage { position:static; padding:0; overflow:visible; }
    #pages { transform:none !important; gap:0; display:block; }
    .page { box-shadow:none; page-break-after:always; }
  }
</style>
</head>

<div class="toolbar">
  <span class="brand">penso<b>IA</b> · certificado</span>
  <div class="tgroup" id="layoutGroup">
    <label>frente</label>
    <button class="chip active" data-layout="capa">Capa</button>
    <button class="chip" data-layout="edit">Editorial</button>

<script src="../../js/brand-logos.js?v=1.0"></script>
<script>
  // ── conteúdo real do programa VNC (curriculum da proposta-final) ──
  const D = {
    holder: 'Marina Andrade Conrado',
    course: 'Inteligência Artificial: do Zero ao Entendimento Prático',
    hours: '12 horas',
    meetings: '3',
    modality: 'Presencial',
    format: '3 encontros de 4 horas',
    date: '15 de agosto de 2026',
    place: 'Aracaju · SE',
    client: 'VNC Advocacia',
    code: 'AB3HNQ4VXY',
    validar: 'pensoia.com/trilha/validar',
    issuerShort: 'EPBF Soluções em Tecnologia',
    issuer: 'EPBF Soluções em Tecnologia Ltda',
    cnpj: '65.254.064/0001-64',
    instructor: 'Élder Prudente Barbosa Filho',
    role: 'Instrutor responsável',
    modules: [
      { n:'I',   t:'Fundamentos de LLMs',           d:'Tokens, embeddings e janela de contexto, e como modelos preditivos diferem de mecanismos de busca.' },
      { n:'II',  t:'Engenharia de Prompt Avançada',  d:'Frameworks com markdown para garantir precisão e evitar resultados não profissionais.' },
      { n:'III', t:'Gestão de Riscos',               d:'Identificação e mitigação de alucinações, com atenção a precedentes e dados fictícios.' },
      { n:'IV',  t:'Panorama de Ferramentas',        d:'ChatGPT, Claude e Gemini, com NotebookLM aplicado a grandes volumes processuais.' },
      { n:'V',   t:'Laboratório Prático',            d:'Construção e teste de prompts para a advocacia, com repertório reutilizável pela equipe.' },
    ],
  };

  // ── faux QR (determinístico, parece QR real para avaliar o layout) ──
  function fauxQr(seed, mods) {
    mods = mods || 25;
    let h = 2166136261;
    for (let i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = (h * 16777619) >>> 0; }
    const bit = (i, j) => { let x = (h ^ (i*73856093) ^ (j*19349663)) >>> 0; x = (x * 2654435761) >>> 0; return (x >>> 17) & 1; };
    const cell = 4, sz = mods * cell;
    const corners = [[0,0],[0,mods-7],[mods-7,0]];
    const inFinder = (i,j) => corners.some(([bi,bj]) => i>=bi && i<bi+7 && j>=bj && j<bj+7);
    const nearFinder = (i,j) => corners.some(([bi,bj]) => i>=bi-1 && i<bi+8 && j>=bj-1 && j<bj+8);
    let r = '';
    for (let i = 0; i < mods; i++) for (let j = 0; j < mods; j++) {
      let on = false;
      if (inFinder(i,j)) {
        const c = corners.find(([bi,bj]) => i>=bi && i<bi+7 && j>=bj && j<bj+7);
        const li = i - c[0], lj = j - c[1];
        on = (li===0||li===6||lj===0||lj===6) || (li>=2&&li<=4&&lj>=2&&lj<=4);
      } else if (nearFinder(i,j)) { on = false; }
      else { on = bit(i,j) === 1; }
      if (on) r += '<rect x="'+(j*cell)+'" y="'+(i*cell)+'" width="'+cell+'" height="'+cell+'"/>';
    }
    return '<svg viewBox="0 0 '+sz+' '+sz+'" width="100%" height="100%" shape-rendering="crispEdges">'
      + '<rect width="'+sz+'" height="'+sz+'" fill="#fff"/><g fill="#061a51">'+r+'</g></svg>';
  }

  const logoFor = (where) => stdColors(where === 'grad' ? 'teal' : 'white');

  // ── FRONTS ──
  function fCapa() {
    return '<div class="dots"></div>'
    + '<div class="capa-top"><span class="bmark" data-logo="grad"></span>'
      + '<div class="capa-meta">Certificado<br>Nº '+D.code+'</div></div>'
    + '<div class="capa-body">'
      + '<div class="eyebrow">Certificado de Participação</div>'
      + '<div class="lead">Certificamos que</div>'
      + '<h1 class="name">'+D.holder+'</h1>'
      + '<p class="sub">concluiu o curso <b>'+D.course+'</b>, com carga horária de <b>'+D.hours+'</b>, realizado em '+D.place+'.</p>'
    + '</div>'
    + '<dl class="capa-foot">'
      + '<div><dt>Emissão</dt><dd>'+D.date+'</dd></div>'
      + '<div><dt>Emissor</dt><dd>'+D.issuerShort+'</dd></div>'
      + '<div class="vfield"><dt>Validação</dt><dd><span class="qr" data-qr></span>'
        + '<span class="vc">'+D.code+'<small>'+D.validar+'</small></span></dd></div>'
    + '</dl>';
  }

  function fEdit() {
    return '<div class="band"><div class="dots"></div>'
      + '<span class="bmark" data-logo="grad"></span>'
      + '<div class="eyebrow">Certificado de Participação</div>'
      + '<div class="lead">Certificamos que</div></div>'
    + '<div class="body">'
      + '<h1 class="name">'+D.holder+'</h1>'
      + '<p class="stmt">concluiu o curso <b>'+D.course+'</b>, com carga horária de <b>'+D.hours+'</b> ('+D.format+'), realizado em '+D.place+'.</p>'
      + '<div class="efoot">'
        + '<div class="sig"><div class="ln"></div><div class="nm">'+D.instructor+'</div><div class="ro">'+D.role+'</div></div>'
        + '<div class="vbox"><span class="qr" data-qr></span><div class="vm">verifique em<br>'+D.validar+'<br><span class="c">'+D.code+'</span></div></div>'
      + '</div>'
    + '</div>';
  }

  function fSelo() {
    return '<div class="sealcol"><span class="bmark" data-logo="light"></span>'
      + '<div class="seal"><div class="dots"></div><span class="mk" data-mk></span><span class="sl">Autêntico</span></div></div>'
    + '<div class="txt">'
      + '<div class="eyebrow">Certificado de Participação</div>'
      + '<div class="lead">Certificamos que</div>'
      + '<h1 class="name">'+D.holder+'</h1>'
      + '<p class="stmt">concluiu o curso <b>'+D.course+'</b>, com carga horária de '+D.hours+', realizado em '+D.place+'.</p>'
      + '<div class="foot"><span class="qr" data-qr></span><div class="fm">'+D.issuerShort+'<br>'+D.date+'<br><span class="c">'+D.code+'</span></div></div>'
    + '</div>';
  }

  function fSplit() {
    return '<div class="panel"><div class="dots"></div>'
      + '<span class="bmark" data-logo="grad"></span>'
      + '<span class="badge">✓ autêntico</span>'
      + '<div class="pcode"><div class="lbl">Validação</div><div class="c">'+D.code+'</div><div class="url">'+D.validar+'</div>'
        + '<span class="qr" data-qr></span></div>'
    + '</div>'
    + '<div class="main">'
      + '<div class="eyebrow">Certificado de Participação</div>'
      + '<div class="lead">Certificamos que</div>'
      + '<h1 class="name">'+D.holder+'</h1>'
      + '<p class="stmt">concluiu o curso <b>'+D.course+'</b>, com carga horária de <b>'+D.hours+'</b>, realizado em '+D.place+'.</p>'
      + '<div class="sig"><div class="ln"></div><div class="nm">'+D.instructor+'</div><div class="ro">'+D.role+'</div></div>'
    + '</div>';
  }

  function fMin() {
    return '<span class="bmark" data-logo="light"></span>'
    + '<div class="blk">'
      + '<div class="eyebrow">Certificado de Participação</div>'
      + '<div class="lead">Certificamos que</div>'
      + '<h1 class="name">'+D.holder+'</h1>'
      + '<div class="gbar"></div>'
      + '<p class="stmt">concluiu o curso <b>'+D.course+'</b>, com carga horária de <b>'+D.hours+'</b>, realizado em '+D.place+'.</p>'
    + '</div>'
    + '<div class="foot">'
      + '<div class="meta">Emissor · <b>'+D.issuerShort+'</b><br>Instrutor · <b>'+D.instructor+'</b><br>Emissão · <b>'+D.date+'</b></div>'
      + '<div class="qrwrap"><span class="qr" data-qr></span><div class="code">'+D.code+'</div></div>'
    + '</div>';
  }

  const FRONTS = { capa:fCapa, edit:fEdit, selo:fSelo, split:fSplit, min:fMin };

  // ── VERSO (paisagem, 2 colunas, sem paginação) ──
  function back() {
    const mods = D.modules.map(m =>
      '<div class="ci"><div class="n">'+m.n+'</div><div><h4>'+m.t+'</h4><p>'+m.d+'</p></div></div>').join('');
    return '<div class="bhead">'
      + '<div class="ht"><div class="kicker">Conteúdo Programático</div><h2 class="title">'+D.course+'.</h2></div>'
      + '<div class="hc"><span class="bmark" data-logo="light"></span><div class="code">Código<b>'+D.code+'</b></div></div>'
    + '</div>'
    + '<div class="rule"></div>'
    + '<div class="bcols">'
      + '<div class="curriculum">'+mods+'</div>'
      + '<div class="side">'
        + '<div class="cargo">'
          + '<div class="s"><div class="v">'+D.hours.replace(' horas','')+'</div><div class="l">Horas</div></div>'
          + '<div class="s"><div class="v">'+D.meetings+'</div><div class="l">Encontros</div></div>'
          + '<div class="s"><div class="v sm">'+D.modality+'</div><div class="l">Modalidade</div></div>'
        + '</div>'
        + '<div class="mblk"><div class="ml">Emissor</div><div class="mv">'+D.issuer+'<small>CNPJ '+D.cnpj+'</small></div></div>'
        + '<div class="mblk"><div class="ml">Instrutor responsável</div><div class="mv">'+D.instructor+'<small>'+D.format+'</small></div></div>'
        + '<div class="mblk"><div class="ml">Data e local de emissão</div><div class="mv">'+D.date+'<small>'+D.place+'</small></div></div>'
        + '<div class="vcard"><span class="qr" data-qr></span><div class="tx">'
          + '<div class="b">Autenticidade verificável</div>'
          + '<p>Código <span class="c">'+D.code+'</span> em '+D.validar+'</p>'
        + '</div></div>'
      + '</div>'
    + '</div>'
    + '<div class="pfoot"><span>pensoIA · Certificado de Participação</span><span>'+D.client+'</span></div>';
  }

  // ── render ──
  let state = { layout:'capa', pal:'duo', side:'frente' };

  function makePage(kind) {
    const page = document.createElement('div');
    page.className = 'page';
    if (kind === 'front') { page.classList.add('f-' + state.layout); page.innerHTML = FRONTS[state.layout](); }
    else { page.classList.add('back'); page.innerHTML = back(); }
    page.querySelectorAll('[data-logo]').forEach(el => { el.innerHTML = glyphWordmarkTag(logoFor(el.dataset.logo)); });
    page.querySelectorAll('[data-mk]').forEach(el => { el.innerHTML = mark(stdColors('teal')); });
    page.querySelectorAll('[data-qr]').forEach(el => { el.innerHTML = fauxQr(D.code); });
    return page;
  }

  function render() {
    const host = document.getElementById('pages');
    host.dataset.pal = state.pal;
    host.innerHTML = '';
    const want = state.side === 'ambos' ? ['front','back'] : (state.side === 'verso' ? ['back'] : ['front']);
    want.forEach(k => host.appendChild(makePage(k)));
    fit();
  }

  function fit() {
    const host = document.getElementById('pages');
    host.style.transform = 'scale(1)';
    const stage = document.querySelector('.stage');
    const scale = Math.min((stage.clientWidth-50)/host.scrollWidth, (stage.clientHeight-50)/host.scrollHeight, 1);
    host.style.transform = 'scale(' + scale + ')';
  }

  function wire(groupId, key) {
    document.getElementById(groupId).addEventListener('click', e => {
      const btn = e.target.closest('.chip'); if (!btn) return;
      state[key] = btn.dataset[key];
      document.querySelectorAll('#' + groupId + ' .chip').forEach(c => c.classList.toggle('active', c === btn));
      render();
    });
  }
  wire('layoutGroup', 'layout');
  wire('palGroup', 'pal');
  wire('sideGroup', 'side');

  function doPrint() { const p = state.side; state.side = 'ambos'; render(); setTimeout(() => { window.print(); state.side = p; render(); }, 160); }
  window.doPrint = doPrint;

  window.addEventListener('resize', fit);
  render();
</script>
</body>
</html>
