<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Preview · E-mail PensoIA</title>
<style>
  body{ margin:0; background:#dfe4ec; font-family:Arial,Helvetica,sans-serif; }
  .bar{ background:#0e1622; color:#cfd9e6; padding:10px 16px; font-size:13px; }
  .bar b{ color:#fff; }
  .frame{ padding:0; }
</style>
</head>
<body>
<div class="bar">Preview do e-mail de certificado (template real <b>renderEmailHtml</b> de <code>codex/js/codex-email.js</code>). É exatamente o que o aluno recebe.</div>
<div id="out" class="frame"></div>
<script type="module">
  import { renderEmailHtml } from '/codex/js/codex-email.js';
  const validarUrl = 'https://pensoia.com/validar/CMURHTXF5N';
  const course = 'Inteligência Artificial na Prática Jurídica';
  const bodyHtml =
    '<p style="margin:0 0 14px">Olá, Beatriz!</p>' +
    '<p style="margin:0 0 14px">Parabéns! Seu certificado do curso <strong>' + course +
      '</strong> está pronto e segue <strong>em anexo</strong>, em PDF.</p>' +
    '<p style="margin:0 0 4px">Você pode confirmar a autenticidade dele a qualquer momento pelo link abaixo:</p>' +
    '<p style="margin:0;font-size:13px"><a href="' + validarUrl + '" style="color:#0d9488">' + validarUrl + '</a></p>';
  document.getElementById('out').innerHTML = renderEmailHtml({
    heading: 'Seu certificado PensoIA',
    bodyHtml,
    cta: { label: 'Validar certificado', url: validarUrl },
    preheader: 'Seu certificado do curso ' + course + ' está em anexo.',
  });
</script>
</body>
</html>
