<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>pensoIA, exploração de variações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
    background: #F5F5F4;
    color: #1C1917;
    padding: 24px;
  }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #78716C; margin-bottom: 24px; }

  /* Tabs (CSS-only via radio) */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid #E7E5E4; margin-bottom: 20px; }
  .tabs input[type="radio"] { display: none; }
  .tabs label {
    padding: 10px 18px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: #78716C;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    user-select: none;
  }
  .tabs label:hover { color: #1C1917; }
  #t1:checked ~ .tabs label[for="t1"],
  #t2:checked ~ .tabs label[for="t2"],
  #t3:checked ~ .tabs label[for="t3"] {
    color: #0F8B82;
    border-bottom-color: #0F8B82;
  }
  .tab-content > section { display: none; }
  #t1:checked ~ .tab-content > .pane-1,
  #t2:checked ~ .tab-content > .pane-2,
  #t3:checked ~ .tab-content > .pane-3,
  #t4:checked ~ .tab-content > .pane-4 { display: block; }

  .grid { display: grid; grid-template-columns: 1fr; gap: 18px; }
  .card {
    background: white;
    border: 1px solid #E7E5E4;
    border-radius: 10px;
    overflow: hidden;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid #E7E5E4;
  }
  .card-id {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10px;
    color: #A8A29E;
    letter-spacing: 0.06em;
  }
  .card-label { font-size: 14px; font-weight: 600; color: #1C1917; }
  .bg-row { display: grid; grid-template-columns: repeat(3, 1fr); }
  .bg-cell {
    padding: 28px 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 140px;
    border-right: 1px solid rgba(0,0,0,0.06);
  }
  .bg-cell:last-child { border-right: none; }
  .bg-cell.white { background: #ffffff; }
  .bg-cell.navy { background: #061a51; }
  .bg-cell.teal { background: #14b8a6; }
  .bg-cell svg { max-width: 100%; max-height: 120px; height: auto; display: block; }
  .card-note {
    padding: 12px 20px;
    font-size: 12px;
    color: #57534E;
    line-height: 1.5;
    background: #FAFAF9;
    border-top: 1px solid #E7E5E4;
  }
  svg text { font-family: 'Comfortaa', sans-serif; }
</style>
</head>
<body>

<h1>pensoIA, explorações de tagline e variações</h1>
<div class="sub">3 abas. Cada variante testada nos 3 fundos: branco, navy e teal.</div>

<input type="radio" name="tab" id="t1" checked>
<input type="radio" name="tab" id="t2">
<input type="radio" name="tab" id="t3">
<input type="radio" name="tab" id="t4">

<div class="tabs">
  <label for="t1">1, Posicionamento da Tagline</label>
  <label for="t2">2, Versões Reduzidas</label>
  <label for="t3">3, Experimentais</label>
  <label for="t4">4, Wordmark Inline (p como letra)</label>
</div>

<div class="tab-content">
  <section class="pane-1"><div class="grid" id="grid-1"></div></section>
  <section class="pane-2"><div class="grid" id="grid-2"></div></section>
  <section class="pane-3"><div class="grid" id="grid-3"></div></section>
  <section class="pane-4"><div class="grid" id="grid-4"></div></section>
</div>

<script>
const PATHS = {
  outer: `M2830 7440 c-622 -54 -1241 -297 -1710 -670 -124 -99 -293 -261 -393 -378 -407 -473 -675 -1101 -717 -1677 -8 -103 -10 -861 -8 -2430 l3 -2280 203 -3 202 -2 0 2317 c0 2519 -2 2433 55 2686 32 143 103 351 166 489 346 757 1047 1300 1909 1477 334 69 820 69 1153 0 306 -63 625 -195 876 -363 553 -370 910 -905 996 -1494 33 -227 27 -472 -16 -687 -88 -435 -346 -862 -698 -1156 -312 -261 -659 -419 -1096 -500 -113 -21 -156 -23 -755 -29 -713 -7 -709 -6 -961 -90 -454 -150 -780 -495 -895 -949 -29 -113 -33 -225 -9 -270 17 -33 50 -47 90 -37 45 11 186 169 371 417 56 74 132 163 170 198 159 149 380 254 623 295 78 13 183 16 605 16 531 0 662 6 856 40 1143 201 1981 1055 2131 2170 18 137 15 479 -5 615 -129 851 -665 1576 -1466 1982 -292 148 -628 252 -960 298 -138 19 -570 28 -720 15z`,
  brain: `M2940 6514 c-352 -42 -584 -106 -845 -236 -551 -273 -942 -773 -1069 -1369 -44 -203 -46 -277 -46 -1383 l1 -1051 51 60 c101 118 295 301 388 367 225 159 474 257 814 320 100 19 159 22 579 25 432 4 468 6 462 21 -4 10 -9 54 -12 100 l-6 84 -476 -5 c-462 -4 -480 -4 -616 -30 -357 -67 -625 -180 -886 -373 -48 -35 -89 -64 -93 -64 -11 0 -7 1556 5 1680 14 152 32 240 80 385 180 541 596 958 1148 1149 509 176 1108 151 1556 -65 624 -301 943 -926 809 -1584 -61 -302 -262 -614 -504 -783 -36 -25 -69 -49 -74 -53 -4 -4 4 -24 18 -45 14 -21 33 -60 42 -86 8 -27 18 -48 21 -48 3 0 35 20 72 44 267 179 482 464 582 770 56 172 73 291 73 491 0 145 -4 202 -22 292 -72 363 -252 677 -529 924 -109 97 -234 179 -398 259 -195 96 -368 149 -605 185 -100 15 -446 28 -520 19z`,
  dot: `M3653 3771 c-91 -33 -167 -104 -207 -190 -31 -67 -30 -226 1 -293 32 -70 108 -146 178 -179 78 -38 184 -40 272 -7 81 30 171 121 202 203 30 78 26 203 -8 281 -28 63 -99 134 -171 170 -74 37 -190 44 -267 15z`
};

const C = { navy: '#061a51', teal: '#14b8a6', white: '#ffffff' };
const TAGLINE = 'pensamento humano, inteligência ampliada';

// Standard color resolver per background
function stdColors(bg) {
  if (bg === 'white') return { pOuter: C.navy, pBrain: C.teal, pDot: C.teal, ensoColor: C.navy, iaColor: C.teal, taglineColor: C.navy };
  if (bg === 'navy')  return { pOuter: C.teal, pBrain: C.white, pDot: C.white, ensoColor: C.white, iaColor: C.teal, taglineColor: C.white };
  if (bg === 'teal')  return { pOuter: C.navy, pBrain: C.white, pDot: C.white, ensoColor: C.white, iaColor: C.navy, taglineColor: C.white };
}

function pGlyph(outerColor, brainColor, dotColor, tx=0, ty=0, scale=1) {
  const t = `translate(${tx},${ty + 745 * scale}) scale(${scale * 0.1},${-scale * 0.1})`;
  return `<g transform="${t}" stroke="none"><path fill="${outerColor}" d="${PATHS.outer}"/><path fill="${brainColor}" d="${PATHS.brain}"/><path fill="${dotColor}" d="${PATHS.dot}"/></g>`;
}

function buildSvg(viewBox, content) {
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${viewBox}" preserveAspectRatio="xMidYMid meet">${content}</svg>`;
}

// Horizontal logo (P glyph beside wordmark)
// Default wordmarkPrefix = 'enso' because the P glyph IS the visual P
function logoHorizontal(c, o = {}) {
  const {
    showTagline = true,
    taglineText = TAGLINE,
    taglineSize = 78,
    taglineX = 610,
    taglineY = 810,
    taglineAnchor = 'start',
    taglineLetterSpacing = 0,
    taglineTextLength = null,
    taglineLines = null,
    taglineLineGap = 100,
    ensoWeight = 400,
    iaWeight = 700,
    wordmarkPrefix = 'enso',
    viewBox = '0 0 2400 870',
    showSymbol = true,
    customTaglineMarkup = null
  } = o;

  let content = showSymbol ? pGlyph(c.pOuter, c.pBrain, c.pDot) : '';
  const wmX = showSymbol ? 610 : 0;
  content += `<text x="${wmX}" y="615" font-size="500" letter-spacing="-10" font-weight="${ensoWeight}" fill="${c.ensoColor}">${wordmarkPrefix}<tspan font-weight="${iaWeight}" fill="${c.iaColor}">IA</tspan></text>`;

  if (showTagline) {
    if (customTaglineMarkup) {
      content += customTaglineMarkup;
    } else if (taglineLines && taglineLines.length > 1) {
      taglineLines.forEach((line, i) => {
        const tl = taglineTextLength ? ` textLength="${taglineTextLength}" lengthAdjust="spacingAndGlyphs"` : '';
        content += `<text x="${taglineX}" y="${taglineY + i * taglineLineGap}" font-weight="400" font-size="${taglineSize}" letter-spacing="${taglineLetterSpacing}" text-anchor="${taglineAnchor}" fill="${c.taglineColor}"${tl}>${line}</text>`;
      });
    } else {
      const tl = taglineTextLength ? ` textLength="${taglineTextLength}" lengthAdjust="spacingAndGlyphs"` : '';
      content += `<text x="${taglineX}" y="${taglineY}" font-weight="400" font-size="${taglineSize}" letter-spacing="${taglineLetterSpacing}" text-anchor="${taglineAnchor}" fill="${c.taglineColor}"${tl}>${taglineText}</text>`;
    }
  }

  return buildSvg(viewBox, content);
}

function logoMarkOnly(c) {
  return buildSvg('0 0 600 745', pGlyph(c.pOuter, c.pBrain, c.pDot));
}

function logoWordmarkOnly(c, o = {}) {
  const { ensoWeight = 400, iaWeight = 700 } = o;
  // No P glyph adjacent, so use 'pensoIA' (with lowercase p)
  const content = `<text x="0" y="500" font-size="500" letter-spacing="-10" font-weight="${ensoWeight}" fill="${c.ensoColor}">penso<tspan font-weight="${iaWeight}" fill="${c.iaColor}">IA</tspan></text>`;
  return buildSvg('0 0 2200 550', content);
}

function logoStacked(c, o = {}) {
  const { showTagline = false } = o;
  const pScale = 0.7;
  const pX = (1900 - 600 * pScale) / 2;
  let content = pGlyph(c.pOuter, c.pBrain, c.pDot, pX, 0, pScale);
  // P glyph is NOT beside the wordmark, so use 'pensoIA'
  content += `<text x="950" y="${745*pScale + 480}" font-size="380" letter-spacing="-8" font-weight="400" fill="${c.ensoColor}" text-anchor="middle">penso<tspan font-weight="700" fill="${c.iaColor}">IA</tspan></text>`;
  if (showTagline) {
    content += `<text x="950" y="${745*pScale + 620}" font-weight="400" font-size="62" fill="${c.taglineColor}" text-anchor="middle">${TAGLINE}</text>`;
  }
  const totalH = showTagline ? 745*pScale + 700 : 745*pScale + 540;
  return buildSvg(`0 0 1900 ${totalH}`, content);
}

// Monochromatic, adapts to bg
function monoColors(mainColor) {
  return { pOuter: mainColor, pBrain: mainColor, pDot: mainColor, ensoColor: mainColor, iaColor: mainColor, taglineColor: mainColor };
}

// Thick P glyph paths (used as the stylized lowercase 'p' letter in the inline wordmark)
// P-thick native viewBox: 488 x 600 -- the outer p shape
// AI-thick native viewBox: 600 x 601 -- the brain bubble + synaptic dot

// Render thick P + brain + dot together as a single stylized lowercase 'p' letter
// All coordinates anchored to viewBox space; size sets P height
function pInlineThick(c, x, y, size) {
  const pScale = size / 600;
  const pW = 488 * pScale;
  const pH = 600 * pScale;
  const brainScale = pScale * 0.55;
  const brainW = 600 * brainScale;
  const brainH = 601 * brainScale;
  const brainX = x + (pW - brainW) / 2 + pW * 0.06;
  const brainY = y + pH * 0.08;
  const tP = `translate(${x},${y + pH}) scale(${pScale * 0.1},${-pScale * 0.1})`;
  const tB = `translate(${brainX},${brainY + brainH}) scale(${brainScale * 0.1},${-brainScale * 0.1})`;
  return `<g transform="${tP}" stroke="none"><path fill="${c.pOuter}" d="${THICK_PATHS.p}"/></g><g transform="${tB}" stroke="none"><path fill="${c.pBrain}" d="${THICK_PATHS.brain}"/><path fill="${c.pDot}" d="${THICK_PATHS.dot}"/></g>`;
}

// Inline wordmark: stylized 'p' (thick + brain) + 'ensoIA' in Comfortaa
function logoWordmarkInline(c, o = {}) {
  const {
    pSize = 450, pX = 30, pY = 200,
    wordmarkX = 380, wordmarkY = 615, fontSize = 500,
    showTagline = false, taglineY = 780, taglineSize = 60,
    viewBox = '0 0 2400 870'
  } = o;
  let content = pInlineThick(c, pX, pY, pSize);
  content += `<text x="${wordmarkX}" y="${wordmarkY}" font-size="${fontSize}" letter-spacing="-10" font-weight="400" fill="${c.ensoColor}">enso<tspan font-weight="700" fill="${c.iaColor}">IA</tspan></text>`;
  if (showTagline) {
    content += `<text x="${pX}" y="${taglineY}" font-weight="400" font-size="${taglineSize}" fill="${c.taglineColor}">${TAGLINE}</text>`;
  }
  return buildSvg(viewBox, content);
}

// ============================================================
// RENDER
// ============================================================
function renderVariants(targetId, variants) {
  const host = document.getElementById(targetId);
  host.innerHTML = variants.map(v => {
    const bgs = ['white', 'navy', 'teal'];
    const cells = bgs.map(bg => {
      const svg = v.customRender ? v.customRender(bg) : v.render(stdColors(bg));
      return `<div class="bg-cell ${bg}">${svg}</div>`;
    }).join('');
    return `
      <div class="card">
        <div class="card-header">
          <div class="card-label">${v.label}</div>
          <div class="card-id">${v.id}</div>
        </div>
        <div class="bg-row">${cells}</div>
        ${v.note ? `<div class="card-note">${v.note}</div>` : ''}
      </div>
    `;
  }).join('');
}
