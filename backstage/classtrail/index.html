<!DOCTYPE html>
<html lang="pt-BR" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>ClassTrail - Backstage</title>

<link rel="icon" type="image/x-icon" href="../../favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png">

<link rel="stylesheet" href="../css/theme.css?v=1.1">
<link rel="stylesheet" href="../css/backstage.css?v=1.4">
<link rel="stylesheet" href="../css/settings-drawer.css?v=1.0">
<link rel="stylesheet" href="../css/shared-components.css?v=1.5">
<link rel="stylesheet" href="css/classtrail.css?v=1.4">
<script src="../js/debug.js?v=2.5"></script>
</head>
<body>

<div class="theme-transition" id="themeTransition" aria-hidden="true"></div>

<div id="screen-app" class="bs-app">

  <main class="bs-main">

    <div class="ct-tabs">
      <button class="ct-tab active" data-tab="clients">Clientes</button>
      <button class="ct-tab" data-tab="items">Itens</button>
      <button class="ct-tab" data-tab="releases">Liberações</button>
    </div>

    <!-- ===== CLIENTES / TURMAS ===== -->
    <div class="ct-panel active" id="panel-clients">
      <div class="ct-two-pane">

        <div class="ct-pane">
          <div class="ct-pane-header">
            <span class="ct-pane-title">Clientes</span>
            <button class="ct-btn ct-btn-sm ct-btn-primary" id="btn-new-client">+ Novo</button>
          </div>
          <div class="ct-pane-body" id="clients-list">
            <div class="ct-empty">Carregando...</div>
          </div>
        </div>

        <div class="ct-pane">
          <div class="ct-pane-header">
            <span class="ct-pane-title" id="turmas-pane-title">Turmas</span>
            <button class="ct-btn ct-btn-sm ct-btn-primary" id="btn-new-turma" style="display:none">+ Nova turma</button>
          </div>
          <div class="ct-pane-body" id="turmas-list">
            <div class="ct-empty">Selecione um cliente para ver suas turmas.</div>
          </div>
        </div>

      </div>
    </div>

    <!-- ===== ITENS ===== -->
    <div class="ct-panel" id="panel-items">
      <div class="ct-toolbar">
        <h2>Biblioteca de Itens</h2>
        <button class="ct-btn ct-btn-primary" id="btn-new-item">+ Novo item</button>
        <button class="ct-btn" id="btn-manage-tags" type="button">Gerenciar tags</button>
      </div>
      <div id="items-filter"></div>
      <div class="ct-items-grid" id="items-list">
        <div class="ct-empty">Carregando...</div>
      </div>
    </div>

    <!-- ===== LIBERAÇÕES ===== -->
    <div class="ct-panel" id="panel-releases">
      <div class="ct-toolbar">
        <h2>Liberações por Turma</h2>
      </div>
      <div class="ct-releases-selector">
        <select id="rel-client-select">
          <option value="">Selecione o cliente...</option>
        </select>
        <select id="rel-turma-select" disabled>
          <option value="">Selecione a turma...</option>
        </select>
      </div>
      <div class="ct-releases-list" id="releases-list">
        <div class="ct-empty">Selecione um cliente e uma turma para gerenciar as liberações.</div>
      </div>
    </div>

  </main>

</div>

<script src="../js/utils.js?v=1.3"></script>
<script src="../js/api-client.js?v=1.1"></script>
<script src="../js/ai-client.js?v=1.0"></script>
<script src="../js/ct-ai-spec.js?v=1.2"></script>
<script src="../js/ct-type-filter.js?v=1.0"></script>
<script src="../js/theme-manager.js?v=1.2"></script>
<script src="../js/auth.js?v=1.1"></script>
<script src="../js/settings-drawer.js?v=1.1"></script>
<script src="../js/backstage-topbar.js?v=1.2"></script>
<script src="js/ct-admin.js?v=1.6"></script>
<script>
'use strict';
BS_AUTH.guard();
BS_AUTH.clearPasswordInputs();
Topbar.init({ title: 'PensoIA', subtitle: 'ClassTrail', backLink: '/backstage/' });
CT_ADMIN.init();
</script>

</body>
</html>
