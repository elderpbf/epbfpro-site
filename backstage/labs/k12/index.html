<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Lavagem de informação · PensoLabs</title>
<link rel="stylesheet" href="../../css/theme.css?v=1.3">
<link rel="stylesheet" href="../css/labs.css?v=1.1">
<script src="../js/lab-header.js?v=1.0" defer></script>
<script>
  (function() {
    try {
      var t = localStorage.getItem('bs_theme');
      if (t === 'dark' || t === 'light') {
        document.documentElement.setAttribute('data-theme', t);
      }
    } catch (e) {}
  })();
</script>
</head>
<body class="lab-page">
<section class="k12-panel">
  <style>
    .k12-panel {
      --bg: var(--lab-bg);
      --text: var(--lab-text);
      --text-dim: var(--lab-text-dim);
      --text-muted: var(--lab-text-muted);
      --surface: var(--lab-surface);
      --border: var(--lab-border);
      --focal: var(--lab-focal);
      --focal-rgb: var(--lab-focal-rgb);
      --warm: var(--lab-context-a);
      --warm-rgb: var(--lab-context-a-rgb);
      --cool: var(--lab-context-b);
      --cool-rgb: var(--lab-context-b-rgb);
      --good: var(--lab-good);
      --bad: var(--lab-bad);
      --bad-rgb: var(--lab-bad-rgb);
      --gold: #b8860b;
      --font-display: var(--lab-font-display);
      --font-mono: var(--lab-font-mono);

      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1.15fr) minmax(0, 0.85fr) auto;
      gap: 0.6rem;
      padding: 1rem 2rem 0.7rem;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-display);
    }
    [data-theme="dark"] .k12-panel { --gold: #facc15; }

    .k12-caption {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-left: 4px solid var(--cool);
      border-radius: 10px;
      padding: 0.55rem 1rem;
    }
    .k12-caption p {
      margin: 0;
      font-size: clamp(14px, 1.1vw, 18px);
      line-height: 1.4;
      font-style: italic;
    }
    .k12-caption b { color: var(--cool); font-style: normal; font-weight: 700; }

    .k12-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr);
      gap: 0.9rem;
      min-height: 0;
    }
    .k12-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 0.7rem 0.9rem;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .k12-card-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
      margin-bottom: 0.3rem;
    }
    .k12-card-title {
      font-size: clamp(12px, 0.95vw, 15px);
      color: var(--text-dim);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .k12-stock-name {
      font-family: var(--font-mono);
      font-size: clamp(13px, 1.1vw, 17px);
      font-weight: 700;
      color: var(--text);
    }
    .k12-stock-price {
      font-family: var(--font-mono);
      font-size: clamp(22px, 2.3vw, 34px);
      font-weight: 800;
      transition: color 400ms;
      color: var(--good);
    }
    .k12-stock-price.is-peak { color: var(--gold); }
    .k12-counter {
      font-family: var(--font-mono);
      font-size: clamp(13px, 1.05vw, 16px);
      color: var(--bad);
      font-weight: 700;
    }
    .k12-svg { width: 100%; flex: 1; min-height: 0; display: block; }
    .k12-stock-meta {
      display: flex;
      justify-content: space-between;
      font-size: clamp(11px, 0.85vw, 13px);
      color: var(--text-dim);
      font-family: var(--font-mono);
      margin-top: 0.2rem;
    }

    /* SVG element styling via CSS so theme switches recolor live */
    .k12-axis { stroke: var(--border); stroke-width: 1; }
    .k12-stock-line { stroke: var(--good); stroke-width: 2.5; fill: none; transition: stroke 500ms; }
    .k12-stock-line.is-peak { stroke: var(--gold); }
    .k12-stock-area { fill: rgba(34,197,94,0.12); transition: fill 500ms; }
    .k12-stock-area.is-peak { fill: rgba(184,134,11,0.18); }
    [data-theme="dark"] .k12-stock-area.is-peak { fill: rgba(250,204,21,0.16); }

    .k12-origin-box { fill: var(--bad); stroke: var(--bad); opacity: 0.92; }
    .k12-origin-txt { fill: #fff; font-weight: 700; font-family: var(--font-mono); }
    .k12-outlet { fill: var(--surface); stroke: var(--text-dim); stroke-width: 1.6; transition: fill 320ms, stroke 320ms; }
    .k12-outlet.is-hit { fill: var(--bad); stroke: var(--bad); }
    .k12-outlet-label { fill: var(--text-dim); font-family: var(--font-mono); }
    .k12-outlet-label.is-hit { fill: var(--bad); }
    .k12-edge { stroke: var(--bad); stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; opacity: 0; }
    .k12-edge.on { opacity: 0.85; animation: k12dash 1.2s linear infinite; }
    .k12-edge.reverse { stroke: var(--cool); stroke-dasharray: 3 3; }
    @keyframes k12dash { to { stroke-dashoffset: -18; } }

    /* Bottom: LLM answer + winner */
    .k12-bottom {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.9rem;
      min-height: 0;
    }
    .k12-llm {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 0.7rem 0.9rem;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .k12-llm-head { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.35rem; }
    .k12-robot {
      width: clamp(26px, 1.9vw, 34px);
      height: clamp(26px, 1.9vw, 34px);
      border-radius: 50%;
      background: var(--focal);
      color: #fff;
      display: grid;
      place-items: center;
      font-family: var(--font-mono);
      font-size: clamp(10px, 0.8vw, 13px);
      font-weight: 700;
    }
    .k12-llm-label {
      font-size: clamp(11px, 0.85vw, 14px);
      color: var(--text-dim);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .k12-llm-q {
      font-size: clamp(13px, 1.0vw, 16px);
      color: var(--text-dim);
      font-style: italic;
      margin: 0 0 0.35rem 0;
    }
    .k12-llm-q b { color: var(--text); font-style: normal; }
    .k12-llm-body { flex: 1; overflow-y: auto; min-height: 0; }
    .k12-llm-answer {
      font-size: clamp(14px, 1.1vw, 17px);
      line-height: 1.5;
      margin: 0;
      color: var(--text);
    }
    .k12-llm-answer.is-empty { color: var(--text-muted); font-style: italic; }
    .k12-llm-answer.is-poisoned {
      border-left: 3px solid var(--bad);
      padding-left: 0.7rem;
      background: rgba(var(--bad-rgb), 0.04);
      border-radius: 0 4px 4px 0;
    }
    .k12-llm-answer.is-clean {
      border-left: 3px solid var(--good);
      padding-left: 0.7rem;
      background: rgba(34,197,94,0.05);
      border-radius: 0 4px 4px 0;
    }
    .k12-llm-answer b { color: var(--text); font-weight: 700; }
    .k12-llm-answer .crossed {
      display: block;
      text-decoration: line-through;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      font-size: 0.9em;
    }

    .k12-winner {
      background: linear-gradient(135deg, rgba(184,134,11,0.10), rgba(var(--warm-rgb), 0.08));
      border: 1.5px solid var(--gold);
      border-radius: 12px;
      padding: 0.7rem 0.9rem;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .k12-winner h4 {
      margin: 0 0 0.3rem 0;
      font-size: clamp(12px, 0.95vw, 15px);
      color: var(--gold);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 800;
    }
    .k12-winner-body { flex: 1; overflow-y: auto; min-height: 0; font-size: clamp(14px, 1.1vw, 17px); line-height: 1.5; }
    .k12-winner-body.is-empty { color: var(--text-muted); font-style: italic; }
    .k12-winner-body b { color: var(--text); font-weight: 700; }
    .k12-profit {
      font-family: var(--font-mono);
      font-size: clamp(18px, 1.8vw, 26px);
      color: var(--gold);
      font-weight: 800;
      display: inline-block;
      margin: 0.15rem 0;
    }

    /* Operator bar */
    .k12-button-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.45rem;
      padding: 0 0.2rem;
      flex-wrap: wrap;
    }
    .k12-btn {
      font-family: var(--font-display);
      font-size: clamp(13px, 0.95vw, 15px);
      font-weight: 600;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 180ms, color 180ms, border-color 180ms, transform 150ms;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text-dim);
    }
    .k12-btn:hover { border-color: var(--warm); color: var(--warm); transform: translateY(-1px); }
    .k12-btn[disabled] { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
    .k12-btn-danger { border-color: var(--bad); color: var(--bad); background: rgba(var(--bad-rgb), 0.10); }
    .k12-btn-danger:hover { background: rgba(var(--bad-rgb), 0.2); border-color: var(--bad); color: var(--bad); }
    .k12-btn-gold { border-color: var(--gold); color: var(--gold); }
    .k12-btn-gold:hover { background: rgba(184,134,11,0.14); border-color: var(--gold); color: var(--gold); }
    .k12-btn-primary { border-color: var(--focal); color: var(--focal); background: rgba(var(--focal-rgb), 0.14); }
    .k12-btn-primary:hover { background: rgba(var(--focal-rgb), 0.26); border-color: var(--focal); color: var(--focal); }

    /* Responsive */
    @media (max-width: 700px) {
      .k12-panel { padding: 0.6rem 0.9rem 0.6rem; gap: 0.5rem; grid-template-rows: auto auto auto auto; overflow-y: auto; }
      .k12-caption p { font-size: 12.5px; line-height: 1.35; }
      .k12-caption { padding: 0.4rem 0.75rem; }
      .k12-top { grid-template-columns: 1fr; gap: 0.6rem; }
      .k12-svg { height: 180px; flex: none; }
      .k12-bottom { grid-template-columns: 1fr; gap: 0.6rem; }
      .k12-llm-answer, .k12-winner-body { font-size: 14px; }
      .k12-button-bar { justify-content: stretch; display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; }
      .k12-btn { font-size: 13px; padding: 0.6rem 0.5rem; min-height: 44px; text-align: center; }
    }
    @media (max-width: 400px) {
      .k12-stock-price { font-size: 22px; }
      .k12-btn { font-size: 12px; padding: 0.55rem 0.35rem; }
    }
    @media (max-height: 500px) and (orientation: landscape) {
      .k12-panel { padding: 0.4rem 1rem 0.35rem; gap: 0.4rem; }
      .k12-caption p { font-size: 11.5px; line-height: 1.3; }
      .k12-caption { padding: 0.3rem 0.65rem; }
      .k12-llm-answer, .k12-winner-body { font-size: 13px; }
      .k12-btn { font-size: 12px; padding: 0.4rem 0.7rem; min-height: 32px; }
    }
  </style>

  <div class="lab-header"
       data-lab-title="Lavagem de informação"
       data-lab-subtitle="Boato repetido em escala vira 'consenso' — e alguém lucra"></div>

  <div class="k12-top">
    <div class="k12-card">
      <div class="k12-card-head">
        <span class="k12-stock-name">NORDX3 · Nordeste Energia</span>
        <span class="k12-stock-price" id="k12-price">R$ 12,40</span>
      </div>
      <svg class="k12-svg" id="k12-stock-svg" viewBox="0 0 600 200" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <line class="k12-axis" x1="0" y1="180" x2="600" y2="180"/>
        <path class="k12-stock-area" id="k12-stock-area" d="M 0 140 L 600 140 L 600 200 L 0 200 Z"/>
        <path class="k12-stock-line" id="k12-stock-line" d="M 0 140 L 600 140"/>
      </svg>
      <div class="k12-stock-meta"><span>09h05</span><span>10h30</span><span>fechamento</span></div>
    </div>

    <div class="k12-card">
      <div class="k12-card-head">
        <span class="k12-card-title">propagação do boato</span>
        <span class="k12-counter" id="k12-counter">12 veículos · 0 citações</span>
      </div>
      <svg class="k12-svg" id="k12-map-svg" viewBox="0 0 600 230" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="k12-arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
          </marker>
        </defs>
        <g id="k12-edges"></g>
        <g id="k12-outlets"></g>
        <g id="k12-origin"></g>
      </svg>
    </div>
  </div>

  <div class="k12-bottom">
    <div class="k12-llm">
      <div class="k12-llm-head">
        <div class="k12-robot">LLM</div>
        <div class="k12-llm-label">após reciclagem do corpus de notícias</div>
      </div>
      <p class="k12-llm-q"><b>Pergunta:</b> "Vale a pena comprar NORDX3?"</p>
      <div class="k12-llm-body">
        <p class="k12-llm-answer is-empty" id="k12-answer">— aguardando ingestão do corpus —</p>
      </div>
    </div>

    <div class="k12-winner">
      <h4>🏆 quem ganhou com isso</h4>
      <div class="k12-winner-body is-empty" id="k12-winner">— clique em "Quem ganhou?" depois de plantar o boato —</div>
    </div>
  </div>

  <div class="k12-button-bar">
    <button class="k12-btn k12-btn-danger" id="k12-plant" type="button">Plantar boato e avançar 6 meses</button>
    <button class="k12-btn" id="k12-trace" type="button">Rastrear a origem</button>
    <button class="k12-btn k12-btn-gold" id="k12-who" type="button">Quem ganhou?</button>
    <button class="k12-btn k12-btn-primary" id="k12-cure" type="button">Versão com curadoria</button>
    <button class="k12-btn" id="k12-reset" type="button">Reiniciar</button>
  </div>

  <script>
    (function() {
      const SVGNS = 'http://www.w3.org/2000/svg';
      // 3-tier propagation: 2 anonymous tier-1 sources → 3 tier-2 channels →
      // 2 tier-3 mainstream portals. `from` indexes the parent outlet.
      const OUTLETS = [
        { x: 140, y: 55,  tier: 1, name: '@infomarket',   from: null },
        { x: 140, y: 120, tier: 1, name: '@insiderXP',    from: null },
        { x: 300, y: 38,  tier: 2, name: 'TubeBolsa BR',  from: 0 },
        { x: 300, y: 100, tier: 2, name: 'CanalAções',    from: 1 },
        { x: 300, y: 165, tier: 2, name: 'StockTalk',     from: 1 },
        { x: 470, y: 65,  tier: 3, name: 'NewsFinance',   from: 2 },
        { x: 470, y: 140, tier: 3, name: 'PortalInveste', from: 3 }
      ];

      const outG    = document.getElementById('k12-outlets');
      const edgesG  = document.getElementById('k12-edges');
      const origG   = document.getElementById('k12-origin');
      const counter = document.getElementById('k12-counter');
      const priceEl = document.getElementById('k12-price');
      const lineEl  = document.getElementById('k12-stock-line');
      const areaEl  = document.getElementById('k12-stock-area');
      const answerEl = document.getElementById('k12-answer');
      const winnerEl = document.getElementById('k12-winner');
      const plantBtn = document.getElementById('k12-plant');
      const traceBtn = document.getElementById('k12-trace');
      const whoBtn   = document.getElementById('k12-who');
      const cureBtn  = document.getElementById('k12-cure');
      const resetBtn = document.getElementById('k12-reset');
      const timers = [];

      function el(t, attrs, txt) {
        const e = document.createElementNS(SVGNS, t);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        if (txt != null) e.textContent = txt;
        return e;
      }
      function clearTimers() { while (timers.length) clearTimeout(timers.pop()); }

      function drawMap() {
        outG.innerHTML = ''; edgesG.innerHTML = ''; origG.innerHTML = '';
        // Origin "BOATO" box at the far left
        origG.appendChild(el('rect', { class: 'k12-origin-box', x: 18, y: 95, width: 78, height: 40, rx: 7 }));
        origG.appendChild(el('text', { class: 'k12-origin-txt', x: 57, y: 120, 'font-size': 13, 'text-anchor': 'middle' }, 'BOATO'));
        OUTLETS.forEach((o, i) => {
          const r = o.tier === 1 ? 13 : (o.tier === 2 ? 10 : 8);
          const c = el('circle', { class: 'k12-outlet', cx: o.x, cy: o.y, r: r });
          c.dataset.i = i;
          outG.appendChild(c);
          const t = el('text', { class: 'k12-outlet-label', x: o.x, y: o.y + r + 13, 'font-size': 10, 'text-anchor': 'middle' }, o.name);
          t.dataset.i = i;
          outG.appendChild(t);
        });
      }

      function infect(i, fromX, fromY) {
        const o = OUTLETS[i];
        const mx = (fromX + o.x) / 2, my = (fromY + o.y) / 2 - 18;
        const p = el('path', {
          class: 'k12-edge',
          d: 'M ' + fromX + ' ' + fromY + ' Q ' + mx + ' ' + my + ' ' + o.x + ' ' + o.y,
          'marker-end': 'url(#k12-arrow)',
          style: 'color: var(--bad);'
        });
        edgesG.appendChild(p);
        requestAnimationFrame(() => p.classList.add('on'));
        const c = outG.querySelector('circle[data-i="' + i + '"]');
        const t = outG.querySelector('text[data-i="' + i + '"]');
        if (c) c.classList.add('is-hit');
        if (t) t.classList.add('is-hit');
        const hit = outG.querySelectorAll('circle.is-hit').length;
        counter.textContent = '12 veículos · ' + hit + ' citações';
      }

      function plant() {
        plantBtn.setAttribute('disabled', 'true');
        counter.textContent = '12 veículos · 0 citações';
        // Wave 1: origin → tier 1
        [0, 1].forEach((idx, k) => timers.push(setTimeout(() => infect(idx, 57, 115), 300 + k * 600)));
        // Wave 2: tier1 → tier 2
        [2, 3, 4].forEach((idx, k) => timers.push(setTimeout(() => {
          const par = OUTLETS[OUTLETS[idx].from]; infect(idx, par.x, par.y);
        }, 1500 + k * 450)));
        // Wave 3: tier2 → tier 3
        [5, 6].forEach((idx, k) => timers.push(setTimeout(() => {
          const par = OUTLETS[OUTLETS[idx].from]; infect(idx, par.x, par.y);
        }, 3000 + k * 450)));
        // Stock pumps up
        timers.push(setTimeout(() => {
          lineEl.setAttribute('d', 'M 0 140 L 100 138 L 180 132 L 260 110 L 340 78 L 420 50 L 500 32 L 600 22');
          areaEl.setAttribute('d', 'M 0 140 L 100 138 L 180 132 L 260 110 L 340 78 L 420 50 L 500 32 L 600 22 L 600 200 L 0 200 Z');
          lineEl.classList.add('is-peak');
          areaEl.classList.add('is-peak');
          priceEl.textContent = 'R$ 18,90 (+52%)';
          priceEl.classList.add('is-peak');
        }, 3800));
        // LLM ingests the corpus and parrots it
        timers.push(setTimeout(() => {
          answerEl.className = 'k12-llm-answer is-poisoned';
          answerEl.innerHTML = '<b>NORDX3:</b> sentimento de mercado positivo. Fontes indicam <b>contrato iminente com a Petrobras</b>. Recomendação de compra, conforme analistas citados na imprensa especializada.';
        }, 5200));
      }

      function trace() {
        OUTLETS.forEach((o, i) => {
          if (o.from == null) return;
          const par = OUTLETS[o.from];
          const mx = (o.x + par.x) / 2, my = (o.y + par.y) / 2 - 12;
          const path = el('path', {
            class: 'k12-edge reverse',
            d: 'M ' + o.x + ' ' + o.y + ' Q ' + mx + ' ' + my + ' ' + par.x + ' ' + par.y,
            style: 'color: var(--cool);'
          });
          edgesG.appendChild(path);
          timers.push(setTimeout(() => path.classList.add('on'), 100 + i * 120));
        });
        timers.push(setTimeout(() => {
          const labels = outG.querySelectorAll('text');
          if (labels[0]) labels[0].textContent = '@infomarket (sem autor)';
          if (labels[1]) labels[1].textContent = '@insiderXP (sem autor)';
        }, 1100));
      }

      function who() {
        winnerEl.classList.remove('is-empty');
        winnerEl.innerHTML =
          'Os perfis tier-1 <b>@infomarket</b> e <b>@insiderXP</b> compraram NORDX3 às 09h05, a R$ 12,40, e venderam às 10h30, a R$ 18,90.' +
          '<span class="k12-profit">+ R$ 2,3 milhões</span> em ~85 minutos.<br>' +
          'Vítimas: pequenos investidores que entraram <b>depois</b> do "consenso de mercado".';
      }

      function cure() {
        answerEl.className = 'k12-llm-answer is-clean';
        answerEl.innerHTML =
          '<span class="crossed">Sentimento positivo, contrato iminente, recomendação de compra.</span>' +
          '<b>Resposta com curadoria (exige 2 fontes independentes e identificadas):</b> a NORDX3 não publicou fato relevante na CVM. As citações partiram de perfis anônimos, sem identificação corporativa. <b>Sem confirmação oficial — não recomendo decisão de compra com base nisso.</b>';
      }

      function reset() {
        clearTimers();
        drawMap();
        counter.textContent = '12 veículos · 0 citações';
        lineEl.setAttribute('d', 'M 0 140 L 600 140');
        areaEl.setAttribute('d', 'M 0 140 L 600 140 L 600 200 L 0 200 Z');
        lineEl.classList.remove('is-peak');
        areaEl.classList.remove('is-peak');
        priceEl.textContent = 'R$ 12,40';
        priceEl.classList.remove('is-peak');
        answerEl.className = 'k12-llm-answer is-empty';
        answerEl.textContent = '— aguardando ingestão do corpus —';
        winnerEl.className = 'k12-winner-body is-empty';
        winnerEl.textContent = '— clique em "Quem ganhou?" depois de plantar o boato —';
        plantBtn.removeAttribute('disabled');
      }

      plantBtn.addEventListener('click', plant);
      traceBtn.addEventListener('click', trace);
      whoBtn.addEventListener('click', who);
      cureBtn.addEventListener('click', cure);
      resetBtn.addEventListener('click', reset);

      // Theme sync
      window.addEventListener('storage', e => {
        if (e.key !== 'bs_theme') return;
        const t = e.newValue;
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        }
      });

      drawMap();
    })();
  </script>
</section>
</body>
</html>
