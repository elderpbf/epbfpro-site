<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClassForge - Viewer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css">
<link rel="stylesheet" id="reveal-theme" href="">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/highlight/monokai.css">
<link rel="stylesheet" href="../../css/question-types.css?v=1.6">
<link rel="stylesheet" href="../../css/viewer.css?v=2.0">
<link rel="stylesheet" href="../../css/theme.css?v=1.2">
<link rel="stylesheet" href="../../css/backstage.css?v=1.6">
<link rel="stylesheet" href="../../css/settings-drawer.css?v=1.0">
<link rel="stylesheet" href="../../css/classforge.css?v=1.7">
<script src="../../js/debug.js?v=2.5"></script>
<script src="../../js/api-client.js?v=1.1"></script>
<script src="../../js/utils.js?v=1.3"></script>
<script src="../../js/ai-client.js?v=1.1"></script>
<script src="../../js/theme-registry.js?v=2.2"></script>
<script src="../../js/presentation-settings.js?v=2.1"></script>
<script src="../../js/question-renderer.js?v=1.7"></script>
<script src="../../js/classpulse-question.min.js?v=1.4"></script>
<script src="../../js/theme-manager.js?v=1.0"></script>
<script src="../../js/settings-drawer.js?v=1.1"></script>
<script src="../../js/backstage-topbar.js?v=1.2"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1/dist/html2canvas.min.js"></script>
<script src="../../js/backstage-thumbnail.js?v=1.0"></script>
</head>
<body>

<!-- Setup screen -->
<div id="setup-screen" class="cf-page">
  <div class="cf-card">
    <h1>ClassForge</h1>
    <p class="cf-tagline">Reveal.js lesson viewer for Google Slides</p>
    <label for="pres-input">Presentation ID or URL</label>
    <input id="pres-input" type="text" placeholder="e.g. 1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgVE2upms">
    <label for="script-input">Apps Script URL</label>
    <input id="script-input" type="url" placeholder="https://script.google.com/macros/s/.../exec">
    <p class="cf-form-error" id="form-error"></p>
    <div class="cf-btn-row">
      <button class="cf-btn cf-btn-primary" id="load-btn">Load</button>
      <button class="cf-btn cf-btn-secondary" id="demo-btn">Try Demo</button>
    </div>
  </div>
</div>

<!-- Loading screen -->
<div id="loading-screen" class="cf-page" hidden>
  <div style="text-align:center">
    <div class="cf-spinner"></div>
    <p>Loading lesson...</p>
  </div>
</div>

<!-- Error screen -->
<div id="error-screen" class="cf-page" hidden>
  <div class="cf-card">
    <h1>Could not load</h1>
    <div class="cf-error-box" id="error-message"></div>
    <button class="cf-btn cf-btn-secondary" id="back-btn">Back to setup</button>
  </div>
</div>

<!-- Reveal.js presentation container -->
<div class="reveal" id="reveal-container" hidden>
  <div class="slides" id="slides-container"></div>
</div>

<!-- Logo overlay (persists across slides, positioned by CSS class) -->
<div id="cf-logo" hidden></div>


<script type="module">
import Reveal from 'https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.esm.js';
import RevealHighlight from 'https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/highlight/highlight.esm.js';
import RevealNotes from 'https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/notes/notes.esm.js';
import RevealMarkdown from 'https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/markdown/markdown.esm.js';

var _viewerSlug = new URLSearchParams(location.search).get('slug') || '';

Topbar.init({
  mode: 'presentation',
  title: 'ClassForge',
  backLink: '/backstage/classforge/',
  sections: PresentationSettings.buildSections({
    engine: 'reveal',
    slug: _viewerSlug,
    onThemeChange: function(name) { ThemeRegistry.initTheme(name, 'reveal'); }
  })
});

// ---------------------------------------------------------------------------
// Constants
// ---------------------------------------------------------------------------

const ALL_SCREENS = ['setup-screen','loading-screen','error-screen','reveal-container'];

// ---------------------------------------------------------------------------
// Security helpers
// ---------------------------------------------------------------------------

function safeUrl(url) {
  return (typeof url === 'string' && /^https?:\/\//.test(url)) ? url : '#';
}

// ---------------------------------------------------------------------------
// Screen management
// ---------------------------------------------------------------------------

function showOnly(ids) {
  const visible = new Set(Array.isArray(ids) ? ids : [ids]);
  for (const id of ALL_SCREENS) {
    document.getElementById(id).hidden = !visible.has(id);
  }
}

function showSetup(presId) {
  showOnly('setup-screen');
  if (presId) document.getElementById('pres-input').value = presId;
  const saved = localStorage.getItem('bs_cf_script_url');
  if (saved) document.getElementById('script-input').value = saved;
}

function showLoading() {
  showOnly('loading-screen');
}

function showError(msg) {
  document.getElementById('error-message').textContent = msg;
  showOnly('error-screen');
}

function showFormError(msg) {
  const el = document.getElementById('form-error');
  el.textContent = msg;
}

// ---------------------------------------------------------------------------
// DOM builders
// ---------------------------------------------------------------------------

function buildBulletGroup(items) {
  const topUl = document.createElement('ul');
  let lastL0 = null, lastL1 = null, ul1 = null, ul2 = null;

  for (const item of items) {
    const li = document.createElement('li');
    li.textContent = item.text || '';
    const lvl = Math.min(item.level || 0, 2);

    if (lvl === 0) {
      topUl.appendChild(li);
      lastL0 = li; lastL1 = null; ul1 = null; ul2 = null;
    } else if (lvl === 1) {
      if (!ul1) {
        ul1 = document.createElement('ul');
        (lastL0 || topUl).appendChild(ul1);
        ul2 = null; lastL1 = null;
      }
      ul1.appendChild(li);
      lastL1 = li;
    } else {
      if (!ul2) {
        ul2 = document.createElement('ul');
        (lastL1 || ul1 || topUl).appendChild(ul2);
      }
      ul2.appendChild(li);
    }
  }

  return topUl;
}

function buildContentItem(item) {
  switch (item.type) {

    case 'divider':
      return document.createElement('hr');

    case 'quote': {
      const bq = document.createElement('blockquote');
      const p = document.createElement('p');
      p.textContent = item.text || '';
      bq.appendChild(p);
      return bq;
    }

    case 'callout': {
      const div = document.createElement('div');
      div.className = 'cf-callout';
      div.textContent = item.text || '';
      return div;
    }

    case 'code': {
      const pre = document.createElement('pre');
      const code = document.createElement('code');
      code.setAttribute('data-trim', '');
      if (item.language) code.className = 'language-' + item.language;
      code.textContent = item.text || '';
      pre.appendChild(code);
      return pre;
    }

    case 'image': {
      const url = safeUrl(item.url);
      if (url === '#') return null;
      const img = document.createElement('img');
      img.src = url;
      img.alt = item.alt || '';
      return img;
    }

    case 'video': {
      const url = safeUrl(item.url);
      if (url === '#') return null;
      const iframe = document.createElement('iframe');
      iframe.src = url;
      iframe.width = '100%';
      iframe.height = '400';
      iframe.setAttribute('allowfullscreen', '');
      iframe.setAttribute('frameborder', '0');
      return iframe;
    }

    case 'link': {
      const url = safeUrl(item.url);
      const p = document.createElement('p');
      const a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = item.text || item.url || url;
      p.appendChild(a);
      return p;
    }

    default:
      return null;
  }
}

function buildImageLeftSlide(sectionData) {
  const section = document.createElement('section');
  section.className = 'cf-layout-image-left';
  if (sectionData.css_class) section.classList.add(sectionData.css_class);
  if (sectionData.notes) section.dataset.notes = sectionData.notes;
  const imgItem = (sectionData.content || []).find(i => i.type === 'image');
  if (imgItem) {
    const img = document.createElement('img');
    img.className = 'cf-slide-image';
    img.src = safeUrl(imgItem.url);
    img.alt = imgItem.alt || '';
    section.appendChild(img);
  }
  const body = document.createElement('div');
  body.className = 'cf-slide-body';
  const h2 = document.createElement('h2');
  h2.textContent = sectionData.title || '';
  body.appendChild(h2);
  const bullets = (sectionData.content || []).filter(i => i.type === 'bullet');
  if (bullets.length) body.appendChild(buildBulletGroup(bullets));
  section.appendChild(body);
  return section;
}

function buildImageRightSlide(sectionData) {
  const section = buildImageLeftSlide(sectionData);
  section.className = section.className.replace('cf-layout-image-left', 'cf-layout-image-right');
  return section;
}

function buildFullBleedSlide(sectionData) {
  const section = document.createElement('section');
  section.className = 'cf-layout-full-bleed';
  if (sectionData.css_class) section.classList.add(sectionData.css_class);
  if (sectionData.notes) section.dataset.notes = sectionData.notes;
  const imgItem = (sectionData.content || []).find(i => i.type === 'image');
  if (imgItem) {
    const url = safeUrl(imgItem.url);
    if (url !== '#') {
      section.setAttribute('data-background-image', url);
      section.setAttribute('data-background-size', 'cover');
    }
  }
  const body = document.createElement('div');
  body.className = 'cf-slide-body';
  const h2 = document.createElement('h2');
  h2.textContent = sectionData.title || '';
  body.appendChild(h2);
  const bullets = (sectionData.content || []).filter(i => i.type === 'bullet');
  if (bullets.length) body.appendChild(buildBulletGroup(bullets));
  section.appendChild(body);
  return section;
}

function buildStatementSlide(sectionData) {
  const section = document.createElement('section');
  section.className = 'cf-layout-statement';
  if (sectionData.css_class) section.classList.add(sectionData.css_class);
  if (sectionData.notes) section.dataset.notes = sectionData.notes;
  const p = document.createElement('p');
  p.className = 'cf-statement-text';
  p.textContent = sectionData.title || '';
  section.appendChild(p);
  return section;
}

function buildTwoColumnSlide(sectionData) {
  const section = document.createElement('section');
  section.className = 'cf-layout-two-column';
  if (sectionData.css_class) section.classList.add(sectionData.css_class);
  if (sectionData.notes) section.dataset.notes = sectionData.notes;
  const grid = document.createElement('div');
  grid.className = 'cf-two-col-grid';
  const h2 = document.createElement('h2');
  h2.textContent = sectionData.title || '';
  grid.appendChild(h2);
  const cols = sectionData.columns || [];
  for (const col of cols) {
    const div = document.createElement('div');
    const colBullets = (col.content || []).filter(i => i.type === 'bullet');
    if (colBullets.length) div.appendChild(buildBulletGroup(colBullets));
    grid.appendChild(div);
  }
  section.appendChild(grid);
  return section;
}

function buildTopicGridSlide(sectionData) {
  const section = document.createElement('section');
  section.className = 'cf-layout-topic-grid';
  if (sectionData.css_class) section.classList.add(sectionData.css_class);
  if (sectionData.notes) section.dataset.notes = sectionData.notes;
  const h2 = document.createElement('h2');
  h2.textContent = sectionData.title || '';
  section.appendChild(h2);
  const grid = document.createElement('div');
  grid.className = 'cf-topic-grid';
  for (const topic of (sectionData.topics || [])) {
    const card = document.createElement('div');
    card.className = 'cf-topic-card';
    const strong = document.createElement('strong');
    strong.textContent = topic.title || '';
    card.appendChild(strong);
    if (topic.description) {
      const p = document.createElement('p');
      p.textContent = topic.description;
      card.appendChild(p);
    }
    grid.appendChild(card);
  }
  section.appendChild(grid);
  return section;
}

function buildEmbedSlide(sectionData) {
  const section = document.createElement('section');
  section.className = 'cf-layout-embed';
  if (sectionData.css_class) section.classList.add(sectionData.css_class);
  if (sectionData.notes) section.dataset.notes = sectionData.notes;
  if (sectionData.title) {
    const h2 = document.createElement('h2');
    h2.textContent = sectionData.title;
    section.appendChild(h2);
  }
  const embed = sectionData.embed || {};
  const div = document.createElement('classpulse-question');
  div.setAttribute('mode', 'embed');
  if (embed.slug) {
    div.setAttribute('slug', embed.slug);
  } else {
    if (embed.session) div.setAttribute('session', embed.session);
    if (embed.question_id) div.setAttribute('question-id', embed.question_id);
  }
  section.appendChild(div);
  return section;
}

function buildSlide(sectionData) {
  const layout = sectionData.layout || 'default';
  if (layout === 'image-left')  return buildImageLeftSlide(sectionData);
  if (layout === 'image-right') return buildImageRightSlide(sectionData);
  if (layout === 'full-bleed')  return buildFullBleedSlide(sectionData);
  if (layout === 'statement')   return buildStatementSlide(sectionData);
  if (layout === 'two-column')  return buildTwoColumnSlide(sectionData);
  if (layout === 'topic-grid')  return buildTopicGridSlide(sectionData);
  if (layout === 'embed')       return buildEmbedSlide(sectionData);

  const section = document.createElement('section');

  if (sectionData.notes) {
    section.dataset.notes = sectionData.notes;
  }

  if (layout === 'media') {
    const images = (sectionData.content || []).filter(i => i.type === 'image');
    if (images.length === 1) {
      const url = safeUrl(images[0].url);
      if (url !== '#') {
        section.setAttribute('data-background-image', url);
        section.setAttribute('data-background-size', 'contain');
      }
    }
  }

  const h2 = document.createElement('h2');
  h2.textContent = sectionData.title || '';
  section.appendChild(h2);

  if (layout === 'title-only') return section;

  const items = sectionData.content || [];
  let i = 0;

  while (i < items.length) {
    if (items[i].type === 'bullet') {
      const bullets = [];
      while (i < items.length && items[i].type === 'bullet') bullets.push(items[i++]);
      section.appendChild(buildBulletGroup(bullets));
    } else {
      if (layout === 'media' && items[i].type === 'image') { i++; continue; }
      const el = buildContentItem(items[i]);
      if (el) section.appendChild(el);
      i++;
    }
  }

  return section;
}

function buildCoverSlide(lesson) {
  const section = document.createElement('section');
  const h1 = document.createElement('h1');
  h1.textContent = lesson.title || 'Untitled';
  section.appendChild(h1);
  if (lesson.subtitle) {
    const p = document.createElement('p');
    p.className = 'cf-subtitle';
    p.textContent = lesson.subtitle;
    section.appendChild(p);
  }
  return section;
}

// ---------------------------------------------------------------------------
// Fetch
// ---------------------------------------------------------------------------

async function fetchLesson(scriptUrl, presId) {
  const url = scriptUrl + '?action=get&id=' + encodeURIComponent(presId);
  let resp;
  try {
    resp = await fetch(url);
  } catch (err) {
    throw new Error('Network error: ' + err.message);
  }
  if (!resp.ok) throw new Error('HTTP ' + resp.status + ' ' + resp.statusText);
  const data = await resp.json();
  if (data.error) throw new Error(data.error);
  return data;
}

async function fetchSlugPresentation(slug) {
  let data;
  try {
    data = await callWorker({ action: 'get_presentation_json', slug });
  } catch (err) {
    throw new Error('Could not load presentation: ' + err.message);
  }
  if (!data.data) throw new Error('Presentation data missing from R2');
  return data.data;
}

function initLogo(logoConfig) {
  const el = document.getElementById('cf-logo');
  if (!logoConfig || !logoConfig.url) { el.hidden = true; return []; }
  const img = document.createElement('img');
  img.src = safeUrl(logoConfig.url);
  img.alt = 'Logo';
  el.innerHTML = '';
  el.appendChild(img);
  el.className = '';
  const pos = logoConfig.position || 'top-right';
  el.classList.add('cf-logo-' + pos);
  el.hidden = false;
  return logoConfig.hide_on || [];
}

function initCustomCss(css) {
  if (!css) return;
  let el = document.getElementById('cf-custom-css');
  if (!el) {
    el = document.createElement('style');
    el.id = 'cf-custom-css';
    document.head.appendChild(el);
  }
  el.textContent = css;
}

// ---------------------------------------------------------------------------
// Show presentation
// ---------------------------------------------------------------------------

let revealInited = false;

async function showPresentation(lesson, opts) {
  const logoHideOn = opts && opts.logoConfig ? initLogo(opts.logoConfig) : null;
  if (opts && opts.customCss) initCustomCss(opts.customCss);

  const container = document.getElementById('slides-container');
  container.innerHTML = '';

  container.appendChild(buildCoverSlide(lesson));
  for (const s of lesson.sections || []) {
    container.appendChild(buildSlide(s));
  }

  Topbar.setSubtitle((lesson.title || 'Untitled') + ' (Reveal)');
  var _slugTheme = _viewerSlug && localStorage.getItem('bs_theme_' + _viewerSlug);
  ThemeRegistry.initTheme(_slugTheme || ThemeRegistry.resolveTheme(lesson.theme), 'reveal');
  showOnly('reveal-container');

  if (!revealInited) {
    await Reveal.initialize({
      hash: true,
      slideNumber: true,
      progress: true,
      controls: true,
      center: true,
      transition: 'slide',
      width: 1200,
      height: 700,
      margin: 0.1,
      plugins: [RevealHighlight, RevealNotes, RevealMarkdown]
    });
    revealInited = true;
    if (logoHideOn && logoHideOn.length) {
      Reveal.on('slidechanged', ({ indexh }) => {
        document.getElementById('cf-logo').hidden = logoHideOn.includes(indexh);
      });
    }
  } else {
    Reveal.sync();
    Reveal.slide(0);
  }
}

// ---------------------------------------------------------------------------
// Event listeners
// ---------------------------------------------------------------------------

document.getElementById('load-btn').addEventListener('click', async () => {
  showFormError('');

  let presId = document.getElementById('pres-input').value.trim();
  const scriptUrl = document.getElementById('script-input').value.trim();

  if (!presId) { showFormError('Enter a Presentation ID or URL.'); return; }
  if (!scriptUrl) { showFormError('Enter the Apps Script URL.'); return; }

  const m = presId.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (m) presId = m[1];

  localStorage.setItem('bs_cf_script_url', scriptUrl);

  showLoading();
  try {
    const lesson = await fetchLesson(scriptUrl, presId);
    await showPresentation(lesson);
  } catch (err) {
    showError(err.message);
  }
});

document.getElementById('demo-btn').addEventListener('click', () => {
  const base = location.href.split('?')[0].split('#')[0];
  location.href = base + '?slug=ia-capacitacao';
});

document.getElementById('back-btn').addEventListener('click', () => { location.href = '../'; });

// ---------------------------------------------------------------------------
// Thumbnail capture
// ---------------------------------------------------------------------------

// On-demand thumbnail capture (called from settings, not auto)
var _thumbSlug = '', _thumbTitle = '';
window._captureThumbnail = function() {
  if (!_thumbSlug) return;
  return window.BackstageThumbnail.capture({
    slug: _thumbSlug,
    title: _thumbTitle,
    engine: 'reveal',
    targetSelector: '.reveal .slides',
    backgroundSelector: '.reveal-viewport',
    fallbackBg: '#191919',
  });
};

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------

(async function main() {
  const params = new URLSearchParams(location.search);
  const presId = params.get('id');
  const scriptParam = params.get('script');

  const slug = params.get('slug');
  if (slug) {
    showLoading();
    try {
      const lesson = await fetchSlugPresentation(slug);
      await showPresentation(lesson, {
        logoConfig: lesson.logo_config,
        customCss: lesson.custom_css
      });
      _thumbSlug = slug;
      _thumbTitle = lesson.title || 'Untitled';

      callWorker({ action: 'get_linked_session', slug: slug, _silent: true }).then(function(data) {
        if (data && data.session) {
          Topbar.addItem({
            label: 'ClassPulse: ' + data.session.code,
            href:  '/backstage/classpulse/host.html?code=' + encodeURIComponent(data.session.code),
            title: 'Abrir host ClassPulse'
          });
        }
      }).catch(function() {});
    } catch (err) {
      showError(err.message);
    }
    return;
  }

  if (presId) {
    const scriptUrl = scriptParam || localStorage.getItem('bs_cf_script_url');
    if (scriptUrl) {
      if (scriptParam) localStorage.setItem('bs_cf_script_url', scriptParam);
      showLoading();
      try {
        const lesson = await fetchLesson(scriptUrl, presId);
        await showPresentation(lesson);

      } catch (err) {
        showError(err.message);
      }
      return;
    }
  }

  showSetup(presId || '');
})();

</script>
</body>
</html>
