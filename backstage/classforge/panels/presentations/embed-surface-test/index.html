<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Embed Surface Test</title>
  <link rel="stylesheet" href="../../engine/tokens.css">
  <link rel="stylesheet" href="../../layouts/embed-fullbleed/embed-fullbleed.css">
  <link rel="stylesheet" href="../../layouts/tool-fullbleed/tool-fullbleed.css">
  <link rel="stylesheet" href="../../tools/slides-embed/slides-embed.css?v=1.1">
  <link rel="stylesheet" href="../../tools/video-embed/video-embed.css">
  <link rel="stylesheet" href="../../tools/gif-embed/gif-embed.css">
  <link rel="stylesheet" href="../../tools/js-anim-embed/js-anim-embed.css">
  <link rel="stylesheet" href="../../tools/tokenizer-embed/tokenizer-embed.css?v=1.1">
  <link rel="stylesheet" href="../../tools/classpulse-display-embed/classpulse-display-embed.css">
  <link rel="stylesheet" href="../../tools/popup-launcher/popup-launcher.css">
  <link rel="stylesheet" href="../../tools/terminal-embed/terminal-embed.css">
  <link rel="stylesheet" href="../../tools/ai-chat/ai-chat.css?v=1.5">
  <link rel="stylesheet" href="../../layouts/content/content.css">
  <link rel="stylesheet" href="../../engine/sidebar.css?v=2.1">
  <link rel="stylesheet" href="../../engine/panel-pills.css?v=1.1">
  <link rel="stylesheet" href="/backstage/css/theme.css?v=1.2">
  <link rel="stylesheet" href="/backstage/css/backstage.css?v=1.6">
  <link rel="stylesheet" href="/backstage/css/settings-drawer.css?v=1.0">
  <link rel="stylesheet" href="/backstage/css/classforge.css?v=1.7">
  <script src="/backstage/js/debug.js?v=2.5"></script>
  <script src="/backstage/js/theme-manager.js?v=1.0"></script>
  <script src="/backstage/js/settings-drawer.js?v=1.1"></script>
  <script src="/backstage/js/backstage-topbar.js?v=1.2"></script>
  <script src="/backstage/js/theme-registry.js?v=2.2"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1/dist/html2canvas.min.js"></script>
  <script src="/backstage/js/backstage-thumbnail.js?v=1.4"></script>
  <style>
    html, body { margin: 0; padding: 0; min-height: 100vh; background: var(--pn-bg); color: var(--pn-text); font-family: var(--pn-font-body); }
    #pn-host { min-height: 100vh; }
    .pn-diagnostic { padding: 32px; }
    .pn-diagnostic h2 { color: var(--pn-heading); margin: 0 0 12px; }
    .pn-diagnostic pre { padding: 12px; background: var(--pn-surface-1); border-radius: var(--pn-radius-md); white-space: pre-wrap; overflow: auto; margin: 0 0 16px; }
    .pn-diagnostic button { padding: 8px 16px; border-radius: var(--pn-radius-md); border: 1px solid var(--pn-border); background: var(--pn-surface-2); color: var(--pn-text); cursor: pointer; }
  </style>
</head>
<body>
  <div id="pn-host"></div>

  <script type="module">
    import '../../themes/default/index.js';
    import '../../layouts/embed-fullbleed/index.js';
    import '../../layouts/tool-fullbleed/index.js';
    import '../../tools/slides-embed/index.js';
    import '../../tools/video-embed/index.js';
    import '../../tools/gif-embed/index.js';
    import '../../tools/js-anim-embed/index.js';
    import '../../tools/tokenizer-embed/index.js';
    import '../../tools/classpulse-display-embed/index.js';
    import '../../tools/popup-launcher/index.js';
    import '../../tools/terminal-embed/index.js';
    import '../../tools/ai-chat/index.js?v=1.2';
    import '../../layouts/content/index.js';

    import { createRuntime, defaultLoadPanel } from '../../engine/runtime.js';
    import { registry } from '../../engine/registry.js';
    import { attachTopbar } from '../../engine/topbar-integration.js';
    import { attachSettings } from '../../engine/settings-integration.js';
    import { attachThumbnail } from '../../engine/thumbnail-integration.js';
    import { attachSidebar } from '../../engine/sidebar-integration.js';
    import { attachFocusReclaim } from '../../engine/focus-reclaim.js';

    // URL param handling
    const params = new URLSearchParams(window.location.search);
    const presenterMode = params.get('presenter') === 'mirror';

    // Phase 3AA retention toggle. Default: 'hidden' so this test deck
    // exercises the cache. Override via URL: ?retention=none|hidden|lru
    // and ?retention-max=N (LRU only, default 4).
    const rp = params.get('retention');
    const retentionMode = rp === 'none' ? 'none' : (rp === 'lru' ? 'lru' : 'hidden');
    const rmax = parseInt(params.get('retention-max') || '', 10);
    const retentionMaxSize = Number.isFinite(rmax) && rmax > 0 ? rmax : 4;
    console.log('[embed-surface-test] retention:', retentionMode, retentionMode === 'lru' ? `(max ${retentionMaxSize})` : '');

    const host = document.getElementById('pn-host');
    const runtime = createRuntime({
      manifest: 'manifest.json',
      host,
      registry,
      loadPanel: defaultLoadPanel,
      retentionMode,
      retentionMaxSize,
    });
    window.__panelsRuntime = runtime;

    if (!presenterMode) {
      const sections = [
        ...attachSettings(runtime, { slug: 'embed-surface-test' }),
        ...attachThumbnail(runtime, {
          slug: 'embed-surface-test',
          title: 'Embed Surface Test',
          engine: 'panels',
          targetSelector: '#pn-host',
        }),
      ];
      const topbar = attachTopbar(runtime, { title: 'ClassForge', backLink: '/backstage/classforge/', sections });
      attachSidebar(runtime, { topbar });
    }

    runtime.start().then(() => {
      // BroadcastChannel: broadcast panel changes to any open presenter view.
      // Placed after start() so runtime.manifest is populated.
      // - Main deck (presenterMode=false) tags broadcasts as origin='deck'.
      // - Mirror (presenterMode=true) tags broadcasts as origin='mirror' so the
      //   main deck doesn't react to its own echo.
      const bcSlug = (runtime.manifest && runtime.manifest.id) || 'embed-surface-test';
      const bc = new BroadcastChannel('panels-presenter-' + bcSlug);
      const myOrigin = presenterMode ? 'mirror' : 'deck';
      runtime.eventBus.addEventListener('panel-entered', () => {
        bc.postMessage({
          type: 'panel',
          index: runtime.currentIndex,
          meta: runtime.currentMeta,
          total: runtime.panelCount,
          origin: myOrigin,
        });
      });

      bc.addEventListener('message', e => {
        const msg = e.data;
        if (!msg) return;

        if (presenterMode) {
          // Mirror mode: track main deck's panel changes by calling goto on
          // our own runtime instance -- no iframe reload, preserves state.
          if (msg.type === 'panel' && msg.origin === 'deck' && typeof msg.index === 'number') {
            if (msg.index !== runtime.currentIndex) runtime.goto(msg.index);
          }
        } else {
          // Main deck: respond to navigate commands from presenter window AND state requests.
          if (msg.origin !== 'presenter') return;
          if (msg.type === 'navigate') {
            if (msg.direction === 'next') runtime.next();
            else if (msg.direction === 'prev') runtime.prev();
          } else if (msg.type === 'request-state') {
            // Presenter view just connected; broadcast our current state so its
            // counter / notes / mirror sync immediately.
            bc.postMessage({
              type: 'panel',
              index: runtime.currentIndex,
              meta: runtime.currentMeta,
              total: runtime.panelCount,
              origin: 'deck',
            });
          }
        }
      });

      // Reclaim focus from iframes so arrow keys keep reaching us.
      // Main deck reclaims to itself. Mirror reclaims to its parent window
      // (the presenter view) so the presenter's keydown handler fires.
      attachFocusReclaim({
        targetWindow: presenterMode ? window.parent : window,
      });

      // Jump to requested panel index if provided via URL (?panel=N).
      const panelParam = params.get('panel');
      if (panelParam !== null) {
        const idx = parseInt(panelParam, 10);
        if (Number.isInteger(idx) && idx >= 0) runtime.goto(idx);
      }
    }).catch(err => {
      console.error('[embed-surface-test] failed to start', err);
      host.innerHTML = `<div class="pn-diagnostic"><h2>Boot failed</h2><pre>${String(err)}</pre></div>`;
    });
  </script>
</body>
</html>
