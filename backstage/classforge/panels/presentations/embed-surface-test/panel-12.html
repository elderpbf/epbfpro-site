<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Panel 12 - Terminal embarcado (xterm.js, scripted)</title>
  <link rel="stylesheet" href="../../engine/tokens.css">
  <link rel="stylesheet" href="../../layouts/embed-fullbleed/embed-fullbleed.css">
  <link rel="stylesheet" href="../../tools/terminal-embed/terminal-embed.css">
</head>
<body>
  <script type="application/json" id="panel-meta">
    {
      "id": "panel-12",
      "layout": "embed-fullbleed",
      "title": "Terminal embarcado (xterm.js, demo scripted)",
      "tools": [{
        "id": "terminal-embed",
        "slot": "tool",
        "config": {
          "mode": "scripted",
          "scenes": [
            ["p", "$ "],
            ["t", "python"],
            ["w", 200],
            ["o", "Python 3.11.5 (main, Sep  5 2023, 12:27:53)"],
            ["o", "Type \"help\", \"copyright\", \"credits\" or \"license\" for more information."],
            ["w", 300],
            ["p", ">>> "],
            ["t", "import tiktoken"],
            ["w", 200],
            ["p", ">>> "],
            ["t", "enc = tiktoken.encoding_for_model(\"gpt-4\")"],
            ["w", 350],
            ["p", ">>> "],
            ["t", "enc.encode(\"Hello world\")"],
            ["w", 200],
            ["o", "[9906, 1917]"],
            ["w", 800],
            ["p", ">>> "],
            ["t", "enc.encode(\"Ola mundo\")"],
            ["w", 200],
            ["o", "[507, 4355, 30791]"],
            ["w", 1200],
            ["p", ">>> "],
            ["c", "# Portugues consome mais tokens que ingles para o mesmo conteudo."],
            ["w", 1500],
            ["p", ">>> "],
            ["t", "enc.encode(\"Sentenca, decisao, acordao.\")"],
            ["w", 200],
            ["o", "[31837, 23029, 64, 11, 12970, 64, 11, 1645, 4685, 78, 13]"],
            ["w", 1000],
            ["p", ">>> "],
            ["t", "len(enc.encode(\"Sentenca\")), len(enc.encode(\"decisao\")), len(enc.encode(\"acordao\"))"],
            ["w", 300],
            ["o", "(3, 3, 3)"],
            ["w", 1500],
            ["p", ">>> "],
            ["c", "# Cada termo juridico custa 3 tokens. Em ingles seria 1."],
            ["w", 2500],
            ["p", ">>> "]
          ]
        }
      }],
      "elements": []
    }
  </script>
  <div data-panel-body></div>
</body>
</html>
