<!DOCTYPE html>
<html lang="pt-BR" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>ClassForge - Backstage</title>

<link rel="icon" type="image/x-icon" href="../../favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png">

<link rel="stylesheet" href="../css/theme.css?v=1.2">
<link rel="stylesheet" href="../css/backstage.css?v=1.3">
<link rel="stylesheet" href="../css/settings-drawer.css?v=1.0">
<link rel="stylesheet" href="../css/classforge.css?v=1.5">
<link rel="stylesheet" href="../css/shared-components.css?v=1.3">
<script src="../js/debug.js?v=2.4"></script>
</head>
<body>

<div class="theme-transition" id="themeTransition" aria-hidden="true"></div>

<div id="screen-app" class="bs-app">

  <main class="bs-main">

      <div class="cf-toolbar">
        <h1 data-key="cf_title">Apresentações</h1>
        <button class="cf-refresh-btn" id="refresh-btn" title="Recarregar lista">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
          <span data-key="refresh_btn">Atualizar</span>
        </button>
        <a href="https://slides.google.com/" target="_blank" rel="noopener noreferrer" class="cf-new-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          <span data-key="new_btn">Nova apresentação</span>
        </a>
      </div>

      <div id="cf-grid" class="cf-grid">
        <!-- Demo card + dynamic cards injected by JS -->
      </div>

  </main>

</div>



<script src="../js/utils.js?v=1.3"></script>
<script src="../js/api-client.js?v=1.1"></script>
<script src="../js/ai-client.js?v=1.1"></script>
<script src="../js/theme-registry.js?v=1.0"></script>
<script src="../js/theme-manager.js?v=1.0"></script>
<script src="../js/auth.js?v=1.1"></script>
<script src="../js/settings-drawer.js?v=1.1"></script>
<script src="../js/backstage-topbar.js?v=1.1"></script>
<script>
'use strict';

// ---------------------------------------------------------------------------
// Auth check
// ---------------------------------------------------------------------------
BS_AUTH.guard();
BS_AUTH.clearPasswordInputs();
var AUTH_TOKEN = BS_AUTH.TOKEN;

// ---------------------------------------------------------------------------
// i18n
// ---------------------------------------------------------------------------
var TRANSLATIONS = {
  'pt-BR': {
    logout_btn:                'Sair',
    cf_title:                  'Apresentações',
    refresh_btn:               'Atualizar',
    new_btn:                   'Nova apresentação',
    settings_title:            'Configurações',
    settings_script_section:   'Apps Script (ClassForge)',
    settings_script_label:     'URL do Apps Script',
    settings_script_hint:      'Implante o Code.gs como Web App e cole a URL aqui. Necessário para carregar suas apresentações.',
    settings_save_btn:         'Salvar',
    settings_theme_section:    'Tema de apresentação',
    settings_theme_hint:       'Aplicado a todas as apresentações ao clicar em Apresentar.',
    settings_theme_gen_btn:    '+ Criar tema com IA',
    settings_theme_desc_label: 'Descreva o tema',
    settings_theme_gen_submit: 'Gerar com Gemini',
    theme_preview_label:       'Pré-visualização',
    theme_save_btn:            'Salvar tema',
    card_present:              'Apresentar',
    card_edit:                 'Editar',
    card_demo_badge:           'Demo',
    card_demo_title:           'Por que patos são legais?',
    card_demo_meta:            'Apresentação de demonstração',
    state_no_script_msg:       'Configure o Apps Script para ver suas apresentações.',
    state_no_script_btn:       'Configurar agora',
    state_loading_msg:         'Carregando apresentações...',
    state_error_btn:           'Tentar novamente',
    state_empty_msg:           'Nenhuma apresentação encontrada na pasta.',
    save_ok:                   'Salvo com sucesso.',
  }
};
var LANG = 'pt-BR';
var T = TRANSLATIONS[LANG];
function t(key) { return T[key] || key; }

document.querySelectorAll('[data-key]').forEach(function(el) {
  var key = el.getAttribute('data-key');
  if (T[key]) el.textContent = T[key];
});


// ---------------------------------------------------------------------------
// ClassForge: Presentation grid
// ---------------------------------------------------------------------------

var THUMB_GRADIENTS = [
  'linear-gradient(135deg, #0d9488 0%, #047857 100%)',
  'linear-gradient(135deg, #1d4ed8 0%, #4338ca 100%)',
  'linear-gradient(135deg, #7c3aed 0%, #9333ea 100%)',
  'linear-gradient(135deg, #b45309 0%, #d97706 100%)',
  'linear-gradient(135deg, #be123c 0%, #e11d48 100%)',
  'linear-gradient(135deg, #0369a1 0%, #0891b2 100%)',
];

function thumbGrad(index) {
  return THUMB_GRADIENTS[index % THUMB_GRADIENTS.length];
}

function initial(title) {
  return (title || '?').trim().charAt(0).toUpperCase();
}

function buildDemoCard() {
  var card = document.createElement('div');
  card.className = 'cf-card';
  var thumb = document.createElement('div');
  thumb.className = 'cf-card-thumb';
  thumb.style.background = 'linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%)';
  thumb.innerHTML =
    '<span style="font-size:2.5rem">P</span>' +
    '<span class="cf-card-badge">' + t('card_demo_badge') + '</span>';
  card.appendChild(thumb);
  var body = document.createElement('div');
  body.className = 'cf-card-body';
  var title = document.createElement('h3');
  title.className = 'cf-card-title';
  title.textContent = t('card_demo_title');
  body.appendChild(title);
  var meta = document.createElement('p');
  meta.className = 'cf-card-meta';
  meta.textContent = t('card_demo_meta');
  body.appendChild(meta);
  var actions = document.createElement('div');
  actions.className = 'cf-card-actions';
  var present = document.createElement('a');
  present.className = 'cf-btn-present';
  present.href = 'viewer/?demo=1';
  present.textContent = t('card_present');
  actions.appendChild(present);
  var edit = document.createElement('span');
  edit.className = 'cf-btn-edit cf-disabled';
  edit.textContent = t('card_edit');
  edit.title = 'Demonstração - sem edição';
  actions.appendChild(edit);
  body.appendChild(actions);
  card.appendChild(body);
  return card;
}

var ENGINE_LABELS = { 'reveal': 'Reveal', 'panels': 'Panels', 'reveal-legacy': 'Legacy' };

function getPresentHref(engine, slug, id, scriptUrl) {
  if (engine === 'reveal-legacy') {
    var url = 'viewer/?id=' + encodeURIComponent(id || slug || '');
    if (scriptUrl) url += '&script=' + encodeURIComponent(scriptUrl);
    return url;
  }
  if (engine === 'reveal') return 'viewer/?slug=' + encodeURIComponent(slug || '');
  if (engine === 'panels') return 'presentations/' + encodeURIComponent(slug || '') + '/';
  return '#';
}

function buildCard(pres, index) {
  var scriptUrl = localStorage.getItem('bs_cf_script_url') || '';
  var engine = pres.engine || 'reveal-legacy';
  var card = document.createElement('div');
  card.className = 'cf-card';
  var thumb = document.createElement('div');
  thumb.className = 'cf-card-thumb';
  thumb.style.background = thumbGrad(index);
  thumb.textContent = initial(pres.title);
  if (engine !== 'reveal-legacy') {
    var badge = document.createElement('span');
    badge.className = 'cf-card-badge cf-card-badge--engine';
    badge.setAttribute('data-engine', engine);
    badge.textContent = ENGINE_LABELS[engine] || engine;
    thumb.appendChild(badge);
  }
  card.appendChild(thumb);
  var body = document.createElement('div');
  body.className = 'cf-card-body';
  var title = document.createElement('h3');
  title.className = 'cf-card-title';
  title.textContent = pres.title || 'Sem título';
  body.appendChild(title);
  var meta = document.createElement('p');
  meta.className = 'cf-card-meta';
  meta.textContent = 'Modificado: ' + (pres.modified || pres.updated_at || '--');
  body.appendChild(meta);
  var actions = document.createElement('div');
  actions.className = 'cf-card-actions';
  var present = document.createElement('a');
  present.className = 'cf-btn-present';
  present.href = getPresentHref(engine, pres.slug, pres.id, scriptUrl);
  present.textContent = t('card_present');
  actions.appendChild(present);
  if (pres.url) {
    var editLink = document.createElement('a');
    editLink.className = 'cf-btn-edit';
    editLink.href = pres.url;
    editLink.target = '_blank';
    editLink.rel = 'noopener noreferrer';
    editLink.textContent = t('card_edit');
    actions.appendChild(editLink);
  }
  body.appendChild(actions);
  card.appendChild(body);
  return card;
}

function buildSkeletonCard() {
  var card = document.createElement('div');
  card.className = 'cf-card cf-card-skeleton';
  card.innerHTML =
    '<div class="cf-card-thumb cf-skeleton cf-card-thumb-sk"></div>' +
    '<div class="cf-card-body">' +
      '<div class="cf-skeleton cf-sk-line" style="margin-bottom:10px"></div>' +
      '<div class="cf-skeleton cf-sk-line short"></div>' +
    '</div>';
  return card;
}

function buildStateBlock(html) {
  var div = document.createElement('div');
  div.className = 'cf-state-block';
  div.innerHTML = html;
  return div;
}

var grid = document.getElementById('cf-grid');

function renderCards(presentations) {
  grid.innerHTML = '';
  grid.appendChild(buildDemoCard());
  if (!presentations) return;
  if (presentations.length === 0) {
    grid.appendChild(buildStateBlock('<p>' + t('state_empty_msg') + '</p>'));
    return;
  }
  presentations.forEach(function(pres, i) {
    grid.appendChild(buildCard(pres, i));
  });
}

function showSkeletons() {
  grid.innerHTML = '';
  grid.appendChild(buildDemoCard());
  for (var i = 0; i < 3; i++) grid.appendChild(buildSkeletonCard());
}

function showNoScriptState() {
  grid.innerHTML = '';
  grid.appendChild(buildDemoCard());
  grid.appendChild(buildStateBlock(
    '<p>' + t('state_no_script_msg') + '</p>' +
    '<button class="cf-inline-btn" id="state-settings-btn">' + t('state_no_script_btn') + '</button>'
  ));
  var btn = document.getElementById('state-settings-btn');
  if (btn) btn.addEventListener('click', SettingsDrawer.open);
}

function showErrorState(msg) {
  showToastError(msg || 'Erro ao carregar');
  showNoScriptState();
}

async function loadPresentations() {
  var scriptUrl = localStorage.getItem('bs_cf_script_url') || '';
  showSkeletons();

  var results = await Promise.allSettled([
    // D1 presentations (always attempted)
    callWorker({ action: 'list_presentations' }),
    // Apps Script presentations (only if URL is set)
    scriptUrl && scriptUrl.startsWith('https://')
      ? fetch(scriptUrl + '?action=list').then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      : Promise.reject(new Error('no script url'))
  ]);

  var d1Result     = results[0];
  var scriptResult = results[1];

  var merged = [];

  // D1 presentations first
  if (d1Result.status === 'fulfilled' && d1Result.value && d1Result.value.presentations) {
    d1Result.value.presentations.forEach(function(p) {
      merged.push({ engine: p.engine || 'panels', slug: p.slug, id: p.slug, title: p.title, updated_at: (p.updated_at || '').slice(0, 10) });
    });
  }

  // Apps Script presentations (reveal-legacy, appended after D1)
  if (scriptResult.status === 'fulfilled' && scriptResult.value && scriptResult.value.lessons) {
    scriptResult.value.lessons.forEach(function(p) {
      merged.push({ engine: 'reveal-legacy', slug: null, id: p.id, title: p.title, modified: p.modified, url: p.url });
    });
  }

  if (merged.length === 0 && !scriptUrl) {
    showNoScriptState();
    return;
  }

  renderCards(merged);
}

document.getElementById('refresh-btn').addEventListener('click', loadPresentations);

// ---------------------------------------------------------------------------
// Settings drawer
// ---------------------------------------------------------------------------

var CF_SCRIPT_SECTION_HTML =
  '<div class="bs-field">' +
    '<label>URL do Apps Script</label>' +
    '<input id="settings-script-url" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">' +
  '</div>' +
  '<p class="bs-hint">Implante o Code.gs como Web App e cole a URL aqui. Necessário para carregar suas apresentações.</p>' +
  '<button class="bs-save-btn" id="settings-save-btn">Salvar</button>' +
  '<p class="bs-drawer-save-msg" id="settings-save-msg"></p>';

var CF_THEME_SECTION_HTML =
  '<p class="bs-hint" style="margin-bottom:0.75rem">Aplicado a todas as apresentações ao clicar em Apresentar.</p>' +
  '<div id="settings-theme-grid" class="cf-theme-grid"></div>' +
  '<div style="margin-top:1.25rem">' +
    '<button class="bs-toggle-btn" id="show-theme-gen-btn">+ Criar tema com IA</button>' +
    '<div id="theme-gen-form" hidden style="margin-top:1rem">' +
      '<div class="bs-field">' +
        '<label>Descreva o tema</label>' +
        '<textarea id="theme-desc-input" class="bs-textarea" placeholder="Ex: Tema escuro e elegante com tons de azul oceano..."></textarea>' +
      '</div>' +
      '<p class="bs-form-error" id="theme-gen-error"></p>' +
      '<button class="bs-save-btn" id="theme-gen-btn">Gerar com Gemini</button>' +
      '<div id="theme-gen-preview" hidden style="margin-top:1rem;padding:0.75rem;border-radius:8px;border:1px solid rgba(20,184,166,.3)">' +
        '<p style="font-size:0.82rem;color:var(--text-secondary);margin-bottom:0.5rem">Pré-visualização</p>' +
        '<div id="theme-preview-swatches" style="display:flex;gap:6px;margin-bottom:0.75rem"></div>' +
        '<p id="theme-preview-name" style="font-size:0.9rem;font-weight:600;color:var(--text-primary);margin-bottom:0.75rem"></p>' +
        '<button class="bs-save-btn" id="theme-save-btn">Salvar tema</button>' +
      '</div>' +
    '</div>' +
  '</div>';

Topbar.init({
  title: 'ClassForge',
  backLink: '/backstage/',
  sections: [
    {
      id: 'cf-script',
      title: 'Apps Script (ClassForge)',
      content: CF_SCRIPT_SECTION_HTML,
      onOpen: function() {
        document.getElementById('settings-script-url').value = localStorage.getItem('bs_cf_script_url') || '';
        document.getElementById('settings-save-msg').textContent = '';
      },
      onInit: function() {
        document.getElementById('settings-save-btn').addEventListener('click', function() {
          var url = document.getElementById('settings-script-url').value.trim();
          localStorage.setItem('bs_cf_script_url', url);
          document.getElementById('settings-save-msg').textContent = t('save_ok');
          setTimeout(function() { document.getElementById('settings-save-msg').textContent = ''; }, 3000);
          loadPresentations();
        });
      }
    },
    {
      id: 'cf-theme',
      title: 'Tema de apresentação',
      content: CF_THEME_SECTION_HTML,
      onOpen: function() { _renderThemes(); },
      onInit: function() {
        document.getElementById('show-theme-gen-btn').addEventListener('click', function() {
          document.getElementById('theme-gen-form').hidden = !document.getElementById('theme-gen-form').hidden;
        });
        _initThemeGen();
      }
    }
  ]
});

// ---------------------------------------------------------------------------
// Theme management (delegates to ThemeRegistry)
// ---------------------------------------------------------------------------

var _themeGridOpts = {
  onSelect: function(name) {
    ThemeRegistry.setActiveTheme(name);
    _renderThemes();
    showToast('Tema "' + name.replace('custom:', '') + '" selecionado.');
  }
};

function _renderThemes() {
  ThemeRegistry.renderThemeGrid(document.getElementById('settings-theme-grid'), _themeGridOpts);
}

var pendingTheme = null;

function _initThemeGen() {
document.getElementById('theme-gen-btn').addEventListener('click', async function() {
  var desc    = document.getElementById('theme-desc-input').value.trim();
  var errEl   = document.getElementById('theme-gen-error');
  var preview = document.getElementById('theme-gen-preview');
  errEl.textContent = ''; preview.hidden = true; pendingTheme = null;

  if (!desc) { errEl.textContent = 'Descreva o tema antes de gerar.'; return; }

  var btn = this; btn.textContent = 'Gerando...'; btn.disabled = true;
  try {
    var theme = await ThemeRegistry.generateTheme(desc);
    if (!theme) {
      showToastError('IA indisponível ou resposta inválida. Tente novamente.');
      return;
    }
    pendingTheme = theme;
    var swatchContainer = document.getElementById('theme-preview-swatches');
    swatchContainer.innerHTML = '';
    [theme.overrides['--r-background-color'], theme.overrides['--r-main-color'], theme.overrides['--r-heading-color'], theme.overrides['--r-link-color']].filter(Boolean).forEach(function(c) {
      var s = document.createElement('div');
      s.style.cssText = 'width:28px;height:28px;border-radius:6px;background:'+c+';border:1px solid rgba(0,0,0,.2)';
      swatchContainer.appendChild(s);
    });
    document.getElementById('theme-preview-name').textContent = theme.name;
    preview.hidden = false;
  } catch (err) {
    dbg('error', 'ai_theme: ' + err.message);
    showToastError('Erro ao gerar tema. Tente novamente.');
  } finally {
    btn.textContent = t('settings_theme_gen_submit'); btn.disabled = false;
  }
});

document.getElementById('theme-save-btn').addEventListener('click', function() {
  if (!pendingTheme) return;
  ThemeRegistry.createCustomTheme(pendingTheme);
  ThemeRegistry.setActiveTheme('custom:' + pendingTheme.name);
  document.getElementById('theme-gen-preview').hidden = true;
  document.getElementById('theme-desc-input').value = '';
  pendingTheme = null;
  _renderThemes();
});
} // end _initThemeGen

// ---------------------------------------------------------------------------
// Start
// ---------------------------------------------------------------------------
loadPresentations();
</script>
</body>
</html>
