<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Backstage - PensoIA</title>

<body>

<div class="theme-transition" id="themeTransition" aria-hidden="true"></div>


<!-- =====================================================
     SCREEN: LOGIN
     ===================================================== -->
<div id="screen-login" class="bs-auth-bg" hidden>
  <div class="bs-auth-card">
    <div class="bs-auth-logo">
      <img src="../images/logo.png" alt="PensoIA">
      <span class="bs-product">Backstage</span>
    </div>
    <h2 data-key="login_title">Bem-vindo de volta</h2>
    <p class="bs-auth-hint" data-key="login_hint">Entre com sua senha para acessar o painel.</p>

    <!-- Primary: password sign-in -->
    <div class="bs-field">
      <input id="login-pw" type="password" autocomplete="off" autofocus placeholder="Senha">
    </div>
    <button class="bs-auth-btn" id="login-btn" data-key="login_btn">Entrar com senha</button>

    <p class="bs-form-error" id="login-error"></p>

    <!-- Secondary: Google sign-in -->
    <div class="bs-auth-divider"><span class="bs-auth-divider-text">ou</span></div>
    <button class="bs-auth-btn bs-auth-btn--google" id="login-google-btn">
      <svg width="18" height="18" viewBox="0 0 48 48" style="vertical-align:middle;margin-right:8px"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
      Entrar com Google
    </button>
  </div>
</div>

<!-- =====================================================
     SCREEN: APP
     ===================================================== -->
<div id="screen-app" class="bs-app" hidden>

  <main class="bs-main">

    <!-- Dashboard view -->
    <div id="view-dashboard">
      <nav class="bs-tabs" role="tablist" aria-label="Backstage">
        <a class="bs-tab is-active" href="./" role="tab" aria-selected="true" data-key="tab_tools">Ferramentas</a>
        <a class="bs-tab" href="mocks/" role="tab" data-key="tab_mocks">Mocks</a>
      </nav>
      <div class="bs-tool-grid">

        <!-- Codex: the unified teaching admin (Aula / Conteúdo / Turmas /
             Perguntas / Slides), the cdx- rebuild served at /codex/. The old
             per-product hub now lives under the Legado section below. -->
        <a class="bs-tool-card" id="card-codex" href="/codex/" aria-label="Abrir Codex">
          <div class="bs-tool-icon" style="background: linear-gradient(135deg, #14b8a6, #0d9488);">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
          </div>
          <div class="bs-tool-name">Codex</div>
          <div class="bs-tool-desc" data-key="codex_desc">Aula, conteúdo, turmas e perguntas</div>
        </a>

        <!-- Belfast 3-day Titanic travel guide -->
        <a class="bs-tool-card" id="card-belfast" href="belfast/index.html" aria-label="Abrir guia Belfast">
          <div class="bs-tool-icon" style="background: linear-gradient(135deg, #1e3a5f, #0e6e8c);">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <line x1="12" y1="2" x2="12" y2="9"></line>
              <line x1="12" y1="15" x2="12" y2="22"></line>
              <path d="M5.5 5.5A9.9 9.9 0 0 0 2 12c0 2.4.85 4.6 2.25 6.32"></path>
              <path d="M18.5 5.5A9.9 9.9 0 0 1 22 12c0 2.4-.85 4.6-2.25 6.32"></path>
              <path d="M5 19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2l-7-4-7 4z"></path>
            </svg>
          </div>
          <div class="bs-tool-name">Belfast 3 Dias</div>
          <div class="bs-tool-desc" data-key="belfast_desc">Guia Titanic + Causeway Coast</div>
        </a>

        <!-- TypeDrill (admin-only — codename only) -->
        <a class="bs-tool-card" id="card-typedrill" href="typedrill/index.html" aria-label="Abrir TypeDrill">
          <div class="bs-tool-icon" style="background: linear-gradient(135deg, #0ea5e9, #0284c7);">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M7 16h10"></path>
            </svg>
          </div>
          <div class="bs-tool-name">TypeDrill</div>
          <div class="bs-tool-desc" data-key="typedrill_desc">Treino de digitação</div>
        </a>

        <!-- LaudoApp: voice-driven medical report PWA (Vercel, external) -->
        <a class="bs-tool-card" id="card-laudoapp" href="https://laudoapp.vercel.app" target="_blank" rel="noopener noreferrer" aria-label="Abrir LaudoApp">
          <div class="bs-tool-icon" style="background: linear-gradient(135deg, #0891b2, #0e7490);">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line>
            </svg>
          </div>
          <div class="bs-tool-name">LaudoApp</div>
          <div class="bs-tool-desc" data-key="laudoapp_desc">Laudos médicos com voz e IA</div>
        </a>

        <!-- advradar: daily DJEN publication tracker for Mateus (Cloudflare Worker, external) -->
        <a class="bs-tool-card" id="card-advradar" href="https://advradar.pensoia.com" target="_blank" rel="noopener noreferrer" aria-label="Abrir advradar">
          <div class="bs-tool-icon" style="background: linear-gradient(135deg, #475569, #334155);">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="2"></circle><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"></path>
            </svg>
          </div>
          <div class="bs-tool-name">advradar</div>
          <div class="bs-tool-desc" data-key="advradar_desc">Publicações oficiais do DJEN</div>
        </a>

      </div>

      <!-- Legacy ClassPlatform apps (ClassTrail / ClassVault / ClassPulse / ClassForge)
           archived to backstage/_archive/ on 2026-06-20; Codex (/codex/) is the daily
           driver. Kept in-repo (unlinked) for reference, not deleted. -->
    </div>

  </main>

</div><!-- /screen-app -->

     ===================================================== -->
<script src="js/utils.js?v=1.4"></script>
<script src="js/api-client.js?v=1.2"></script>

<script src="js/bs-google.js?v=1.4"></script>

<script>
'use strict';

// ---------------------------------------------------------------------------
// i18n (PT-BR)
// ---------------------------------------------------------------------------

var TRANSLATIONS = {
  'pt-BR': {
    login_title:               'Bem-vindo de volta',
    login_hint:                'Entre com sua senha para acessar o painel.',
    login_pw_label:            'Senha',
    login_btn:                 'Entrar com senha',
    logout_btn:                'Sair',
    dashboard_title:           'Ferramentas',
    tab_tools:                 'Ferramentas',
    tab_mocks:                 'Mocks',
    classforge_desc:           'Apresentações',
    classpulse_desc:           'Interação em sala',
    classtrail_desc:           'Trilha de conteúdo',
    classvault_desc:           'Painel do professor em aula',
    codex_desc:                'Aula, conteúdo, turmas e perguntas',
    classplatform_desc:        'ClassTrail, ClassVault e ClassPulse',
    legacy_label:              'Legado',
    typedrill_desc:            'Treino de digitação',
    belfast_desc:              'Guia Titanic + Causeway Coast',
    laudoapp_desc:             'Laudos médicos com voz e IA',
    advradar_desc:             'Publicações oficiais do DJEN',
    laudoai_mockup_desc:       'Mockup — Laudo com IA',
    mocks_desc:                'Galeria de mockups',
    settings_title:            'Configurações',
    settings_save_btn:         'Salvar',
    settings_dev_section:      'Desenvolvedor',
    settings_debug_label:      'Painel de debug',
    settings_debug_on:         'Desativar',
    settings_debug_off:        'Ativar',
    settings_debug_hint:       'Exibe pill flutuante com logs em todas as páginas do Backstage.',
    settings_security_section: 'Segurança',
    settings_change_pw_btn:    'Alterar senha',
    change_pw_current:         'Senha atual',
    change_pw_new:             'Nova senha',
    change_pw_confirm:         'Confirmar nova senha',
    change_pw_save_btn:        'Atualizar senha',
    save_ok:                   'Salvo com sucesso.',
    error_pw_short:            'A senha deve ter pelo menos 6 caracteres.',
    error_pw_match:            'As senhas não coincidem.',
    error_pw_wrong:            'Senha incorreta.',
    error_pw_current_wrong:    'Senha atual incorreta.',
    change_pw_ok:              'Senha alterada com sucesso.',
  }
};

var LANG = 'pt-BR';
var T = TRANSLATIONS[LANG];
function t(key) { return T[key] || key; }

// Apply translations
document.querySelectorAll('[data-key]').forEach(function(el) {
  var key = el.getAttribute('data-key');
  if (T[key]) el.textContent = T[key];
});

// ---------------------------------------------------------------------------
// Migration from old cf_ keys to bs_ keys
// ---------------------------------------------------------------------------

function migrateOldKeys() {
  var migrations = [
    ['cf_pw_hash',      'bs_pw_hash'],
    ['cf_script_url',   'bs_cf_script_url'],
    ['cf_theme',        'bs_reveal_theme'],
    ['cf_custom_themes','bs_custom_themes']
  ];
  migrations.forEach(function(pair) {
    var old = localStorage.getItem(pair[0]);
    if (old && !localStorage.getItem(pair[1])) {
      localStorage.setItem(pair[1], old);
    }
  });
  // Migrate site theme preference
  var oldTheme = localStorage.getItem('theme');
  if (oldTheme && !localStorage.getItem('bs_theme')) {
    localStorage.setItem('bs_theme', oldTheme);
  }
}
migrateOldKeys();

// ---------------------------------------------------------------------------
// Topbar
// ---------------------------------------------------------------------------

Topbar.init({ title: 'Backstage' });

// ---------------------------------------------------------------------------
// Screen management
// ---------------------------------------------------------------------------

// Clear any browser-injected password values on load
document.querySelectorAll('input[type="password"]').forEach(function(el) {
  el.value = '';
});
</script>

<!-- Bundle Q: auth boot lives in js/login-page.js per AGENTS.md Rule 8.
     Loaded after the inline i18n / migrate / Topbar.init block so it can
     consume the t() helper. init() auto-skips when the password hash is in
     localStorage; bind() wires the Google + password sign-in handlers. -->
<script src="js/login-page.js?v=1.2"></script>
<script>
'use strict';
LoginPage.bind();
LoginPage.init();
</script>
</body>
