<!DOCTYPE html>
<html lang="pt-BR" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Backstage - PensoIA</title>

<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/x-icon" href="../favicon.ico?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=2">

<link rel="stylesheet" href="css/theme.css?v=1.3">
<link rel="stylesheet" href="css/backstage.css?v=2.1">
<link rel="stylesheet" href="css/settings-drawer.css?v=1.0">
<link rel="stylesheet" href="css/classforge.css?v=1.3">
<link rel="stylesheet" href="css/shared-components.css?v=1.3">
<script src="js/debug.js?v=2.5"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div class="theme-transition" id="themeTransition" aria-hidden="true"></div>


<!-- =====================================================
     SCREEN: LOGIN
     ===================================================== -->
<div id="screen-login" class="bs-auth-bg" hidden>
  <div class="bs-auth-card">
    <div class="bs-auth-logo">
      <img src="../images/logo.png" alt="PensoIA">
      <span class="bs-product">Backstage</span>
    </div>
    <h2 data-key="login_title">Bem-vindo de volta</h2>
    <p class="bs-auth-hint" data-key="login_hint">Entre com sua conta Google para acessar o painel.</p>

    <!-- Primary: Google sign-in -->
    <button class="bs-auth-btn bs-auth-btn--google" id="login-google-btn">
      <svg width="18" height="18" viewBox="0 0 48 48" style="vertical-align:middle;margin-right:8px"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
      Entrar com Google
    </button>

    <p class="bs-form-error" id="login-error"></p>

    <!-- Secondary: password fallback (collapsed by default) -->
    <div class="bs-auth-divider">
      <button type="button" class="bs-auth-toggle" id="login-pw-toggle">Entrar com senha</button>
    </div>
    <div id="login-pw-section" hidden>
      <div class="bs-field">
        <label data-key="login_pw_label">Senha</label>
        <input id="login-pw" type="password" autocomplete="off">
      </div>
      <button class="bs-auth-btn" id="login-btn" data-key="login_btn">Entrar</button>
    </div>
  </div>
</div>

<!-- =====================================================
     SCREEN: APP
     ===================================================== -->
<div id="screen-app" class="bs-app" hidden>

  <main class="bs-main">

    <!-- Dashboard view -->
    <div id="view-dashboard">
      <nav class="bs-tabs" role="tablist" aria-label="Backstage">
        <a class="bs-tab is-active" href="./" role="tab" aria-selected="true" data-key="tab_tools">Ferramentas</a>
        <a class="bs-tab" href="mocks/" role="tab" data-key="tab_mocks">Mocks</a>
      </nav>
      <div class="bs-tool-grid">

        <!-- PensoCodex — unified admin hub (ClassVault + ClassTrail + ClassPulse) -->
        <a class="bs-tool-card" id="card-pensocodex" href="classvault/index.html" aria-label="Abrir PensoCodex">
          <div class="bs-tool-icon" style="background: linear-gradient(135deg, #6366f1, #4f46e5);">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
          </div>
          <div class="bs-tool-name">PensoCodex</div>
          <div class="bs-tool-desc" data-key="pensocodex_desc">Aula, conteúdo, liberações, turmas e Nexo</div>
        </a>

        <!-- TypeDrill (admin-only — codename only) -->
        <a class="bs-tool-card" id="card-typedrill" href="typedrill/index.html" aria-label="Abrir TypeDrill">
          <div class="bs-tool-icon" style="background: linear-gradient(135deg, #0ea5e9, #0284c7);">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M7 16h10"></path>
            </svg>
          </div>
          <div class="bs-tool-name">TypeDrill</div>
          <div class="bs-tool-desc" data-key="typedrill_desc">Treino de digitação</div>
        </a>

      </div>

      <!-- Legacy: tools kept around for ongoing maintenance, not active development. -->
      <section class="bs-legacy-section" aria-label="Legado">
        <div class="bs-legacy-label" data-key="legacy_label">Legado</div>
        <a class="bs-legacy-link" id="card-classforge" href="classforge/index.html" aria-label="Abrir ClassForge">
          <span class="bs-legacy-name">ClassForge</span>
          <span class="bs-legacy-desc" data-key="classforge_desc">Apresentações</span>
        </a>
      </section>
    </div>

  </main>

</div><!-- /screen-app -->


<!-- =====================================================
     SCRIPT
     ===================================================== -->
<script src="js/utils.js?v=1.4"></script>
<script src="js/api-client.js?v=1.2"></script>
<script src="js/theme-manager.js?v=1.0"></script>
<script src="js/bs-google.js?v=1.1"></script>
<script src="js/auth.js?v=1.2"></script>
<script src="js/settings-drawer.js?v=1.1"></script>
<script src="js/brand-logos.js?v=1.0"></script>
<script src="js/backstage-topbar.js?v=1.6"></script>
<script>
'use strict';

// ---------------------------------------------------------------------------
// i18n (PT-BR)
// ---------------------------------------------------------------------------

var TRANSLATIONS = {
  'pt-BR': {
    login_title:               'Bem-vindo de volta',
    login_hint:                'Entre com sua conta Google para acessar o painel.',
    login_pw_label:            'Senha',
    login_btn:                 'Entrar',
    logout_btn:                'Sair',
    dashboard_title:           'Ferramentas',
    tab_tools:                 'Ferramentas',
    tab_mocks:                 'Mocks',
    classforge_desc:           'Apresentações',
    classpulse_desc:           'Interação em sala',
    classtrail_desc:           'Trilha de conteúdo',
    classvault_desc:           'Painel do professor em aula',
    pensocodex_desc:           'Aula, conteúdo, liberações, turmas e Nexo',
    legacy_label:              'Legado',
    typedrill_desc:            'Treino de digitação',
    laudoai_mockup_desc:       'Mockup — Laudo com IA',
    mocks_desc:                'Galeria de mockups',
    settings_title:            'Configurações',
    settings_save_btn:         'Salvar',
    settings_dev_section:      'Desenvolvedor',
    settings_debug_label:      'Painel de debug',
    settings_debug_on:         'Desativar',
    settings_debug_off:        'Ativar',
    settings_debug_hint:       'Exibe pill flutuante com logs em todas as páginas do Backstage.',
    settings_security_section: 'Segurança',
    settings_change_pw_btn:    'Alterar senha',
    change_pw_current:         'Senha atual',
    change_pw_new:             'Nova senha',
    change_pw_confirm:         'Confirmar nova senha',
    change_pw_save_btn:        'Atualizar senha',
    save_ok:                   'Salvo com sucesso.',
    error_pw_short:            'A senha deve ter pelo menos 6 caracteres.',
    error_pw_match:            'As senhas não coincidem.',
    error_pw_wrong:            'Senha incorreta.',
    error_pw_current_wrong:    'Senha atual incorreta.',
    change_pw_ok:              'Senha alterada com sucesso.',
  }
};

var LANG = 'pt-BR';
var T = TRANSLATIONS[LANG];
function t(key) { return T[key] || key; }

// Apply translations
document.querySelectorAll('[data-key]').forEach(function(el) {
  var key = el.getAttribute('data-key');
  if (T[key]) el.textContent = T[key];
});

// ---------------------------------------------------------------------------
// Migration from old cf_ keys to bs_ keys
// ---------------------------------------------------------------------------

function migrateOldKeys() {
  var migrations = [
    ['cf_pw_hash',      'bs_pw_hash'],
    ['cf_script_url',   'bs_cf_script_url'],
    ['cf_theme',        'bs_reveal_theme'],
    ['cf_custom_themes','bs_custom_themes']
  ];
  migrations.forEach(function(pair) {
    var old = localStorage.getItem(pair[0]);
    if (old && !localStorage.getItem(pair[1])) {
      localStorage.setItem(pair[1], old);
    }
  });
  // Migrate site theme preference
  var oldTheme = localStorage.getItem('theme');
  if (oldTheme && !localStorage.getItem('bs_theme')) {
    localStorage.setItem('bs_theme', oldTheme);
  }
}
migrateOldKeys();

// ---------------------------------------------------------------------------
// Topbar
// ---------------------------------------------------------------------------

Topbar.init({ title: 'Backstage' });

// ---------------------------------------------------------------------------
// Screen management
// ---------------------------------------------------------------------------

var PW_KEY   = 'bs_pw_hash';
var AUTH_KEY = 'bs_auth';

var SCREENS = ['screen-login', 'screen-app'];

function showScreen(id) {
  SCREENS.forEach(function(s) {
    document.getElementById(s).hidden = (s !== id);
  });
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------

// Clear any browser-injected password values on load
document.querySelectorAll('input[type="password"]').forEach(function(el) {
  el.value = '';
});

async function init() {
  // Init BS_GOOGLE (warms GIS token client in background).
  if (window.BS_GOOGLE) await window.BS_GOOGLE.init();

  // Auto-login: Google token present and still valid.
  if (window.BS_GOOGLE && window.BS_GOOGLE.isAuthed()) {
    showApp();
    return;
  }
  // Auto-login: password hash present and session confirmed.
  if (sessionStorage.getItem(AUTH_KEY) === '1' && localStorage.getItem(PW_KEY)) {
    showApp();
    return;
  }
  showScreen('screen-login');
}

// ---------------------------------------------------------------------------
// Auth event handlers
// ---------------------------------------------------------------------------

// Google sign-in (primary path).
document.getElementById('login-google-btn').addEventListener('click', async function() {
  var btn = this;
  var err = document.getElementById('login-error');
  err.textContent = '';
  btn.disabled = true;
  try {
    await window.BS_GOOGLE.requestToken({ prompt: 'consent' });
    // Token is now stored in localStorage by BS_GOOGLE.
    sessionStorage.setItem(AUTH_KEY, '1');
    showApp();
  } catch (e) {
    var msg = e && e.message;
    if (msg === 'gis_timeout') {
      err.textContent = 'Não foi possível carregar o login do Google. Verifique sua conexão.';
    } else if (msg === 'access_denied') {
      err.textContent = 'Acesso negado. Verifique se a conta está autorizada.';
    } else {
      err.textContent = 'Erro ao entrar com Google. Tente novamente.';
    }
  } finally {
    btn.disabled = false;
  }
});

// Reveal/hide password section.
document.getElementById('login-pw-toggle').addEventListener('click', function() {
  var section = document.getElementById('login-pw-section');
  var hidden = section.hidden;
  section.hidden = !hidden;
  if (!hidden) {
    document.getElementById('login-pw').value = '';
  } else {
    document.getElementById('login-pw').focus();
  }
});

// Password sign-in (fallback path).
document.getElementById('login-btn').addEventListener('click', async function() {
  var btn = this;
  var pw  = document.getElementById('login-pw').value;
  var err = document.getElementById('login-error');
  err.textContent = '';
  btn.disabled = true;
  try {
    var hash   = await hashPw(pw);
    var result = await callWorker({ action: 'validate_auth', auth_token: hash });
    if (!result.ok) {
      err.textContent = t('error_pw_wrong');
      document.getElementById('login-pw').value = '';
      document.getElementById('login-pw').focus();
      return;
    }
    localStorage.setItem(PW_KEY, hash);
    sessionStorage.setItem(AUTH_KEY, '1');
    showApp();
  } catch (e) {
    err.textContent = t('error_pw_wrong');
    document.getElementById('login-pw').value = '';
    document.getElementById('login-pw').focus();
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('login-pw').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('login-btn').click();
});

// Sign-out is handled by Topbar via BS_AUTH.signOut().

// ---------------------------------------------------------------------------
// App views
// ---------------------------------------------------------------------------

function showApp() {
  showScreen('screen-app');
}

// ---------------------------------------------------------------------------
// Start
// ---------------------------------------------------------------------------
init();
</script>
</body>
</html>
