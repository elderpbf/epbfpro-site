<!DOCTYPE html>
<html lang="pt-BR" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Backstage - PensoIA</title>

<link rel="icon" type="image/x-icon" href="../favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">

<link rel="stylesheet" href="css/theme.css?v=1.2">
<link rel="stylesheet" href="css/backstage.css?v=1.3">
<link rel="stylesheet" href="css/settings-drawer.css?v=1.0">
<link rel="stylesheet" href="css/classforge.css?v=1.3">
<link rel="stylesheet" href="css/shared-components.css?v=1.3">
<script src="js/debug.js?v=2.4"></script>
</head>
<body>

<div class="theme-transition" id="themeTransition" aria-hidden="true"></div>


<!-- =====================================================
     SCREEN: LOGIN
     ===================================================== -->
<div id="screen-login" class="bs-auth-bg" hidden>
  <div class="bs-auth-card">
    <div class="bs-auth-logo">
      <img src="../images/logo.png" alt="PensoIA">
      <span class="bs-product">Backstage</span>
    </div>
    <h2 data-key="login_title">Bem-vindo de volta</h2>
    <p class="bs-auth-hint" data-key="login_hint">Entre com sua senha para acessar o painel.</p>
    <div class="bs-field">
      <label data-key="login_pw_label">Senha</label>
      <input id="login-pw" type="password" autocomplete="off">
    </div>
    <p class="bs-form-error" id="login-error"></p>
    <button class="bs-auth-btn" id="login-btn" data-key="login_btn">Entrar</button>
  </div>
</div>

<!-- =====================================================
     SCREEN: APP
     ===================================================== -->
<div id="screen-app" class="bs-app" hidden>

  <header class="bs-topbar">
    <div class="bs-topbar-inner">
      <a href="https://pensoia.com" class="bs-topbar-logo" aria-label="PensoIA">
        <img src="../images/logo.png" alt="PensoIA">
        <div class="bs-topbar-wordmark">
          <span class="bs-topbar-brand">PensoIA</span>
          <span class="bs-topbar-name">Backstage</span>
        </div>
      </a>
      <div class="bs-topbar-spacer"></div>
      <button class="bs-icon-btn theme-toggle" id="themeToggle" aria-label="Alternar tema" aria-pressed="false">
        <span id="themeIcon"></span>
      </button>
      <button class="bs-icon-btn" id="settings-btn" aria-label="Configurações" title="Configurações">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <button class="bs-logout-btn" id="logout-btn" data-key="logout_btn">Sair</button>
    </div>
  </header>

  <main class="bs-main">

    <!-- Dashboard view -->
    <div id="view-dashboard">
      <h1 class="bs-dashboard-title" data-key="dashboard_title">Ferramentas</h1>
      <div class="bs-tool-grid">

        <!-- ClassForge -->
        <a class="bs-tool-card" id="card-classforge" href="classforge/" aria-label="Abrir ClassForge">
          <div class="bs-tool-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
          </div>
          <div class="bs-tool-name">ClassForge</div>
          <div class="bs-tool-desc" data-key="classforge_desc">Apresentações</div>
        </a>

        <!-- ClassPulse -->
        <a class="bs-tool-card" id="card-classpulse" href="classpulse/" aria-label="Abrir ClassPulse">
          <div class="bs-tool-icon" style="background: linear-gradient(135deg, #7c3aed, #6d28d9);">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
          </div>
          <div class="bs-tool-name">ClassPulse</div>
          <div class="bs-tool-desc" data-key="classpulse_desc">Interação em sala</div>
        </a>

      </div>
    </div>

  </main>

</div><!-- /screen-app -->


<!-- =====================================================
     SCRIPT
     ===================================================== -->
<script src="js/utils.js?v=1.2"></script>
<script src="js/api-client.js?v=1.1"></script>
<script src="js/theme-manager.js?v=1.0"></script>
<script src="js/settings-drawer.js?v=1.0"></script>
<script>
'use strict';

// ---------------------------------------------------------------------------
// i18n (PT-BR)
// ---------------------------------------------------------------------------

var TRANSLATIONS = {
  'pt-BR': {
    login_title:               'Bem-vindo de volta',
    login_hint:                'Entre com sua senha para acessar o painel.',
    login_pw_label:            'Senha',
    login_btn:                 'Entrar',
    logout_btn:                'Sair',
    dashboard_title:           'Ferramentas',
    classforge_desc:           'Apresentações',
    classpulse_desc:           'Interação em sala',
    settings_title:            'Configurações',
    settings_save_btn:         'Salvar',
    settings_dev_section:      'Desenvolvedor',
    settings_debug_label:      'Painel de debug',
    settings_debug_on:         'Desativar',
    settings_debug_off:        'Ativar',
    settings_debug_hint:       'Exibe pill flutuante com logs em todas as páginas do Backstage.',
    settings_security_section: 'Segurança',
    settings_change_pw_btn:    'Alterar senha',
    change_pw_current:         'Senha atual',
    change_pw_new:             'Nova senha',
    change_pw_confirm:         'Confirmar nova senha',
    change_pw_save_btn:        'Atualizar senha',
    save_ok:                   'Salvo com sucesso.',
    error_pw_short:            'A senha deve ter pelo menos 6 caracteres.',
    error_pw_match:            'As senhas não coincidem.',
    error_pw_wrong:            'Senha incorreta.',
    error_pw_current_wrong:    'Senha atual incorreta.',
    change_pw_ok:              'Senha alterada com sucesso.',
  }
};

var LANG = 'pt-BR';
var T = TRANSLATIONS[LANG];
function t(key) { return T[key] || key; }

// Apply translations
document.querySelectorAll('[data-key]').forEach(function(el) {
  var key = el.getAttribute('data-key');
  if (T[key]) el.textContent = T[key];
});

// ---------------------------------------------------------------------------
// Migration from old cf_ keys to bs_ keys
// ---------------------------------------------------------------------------

function migrateOldKeys() {
  var migrations = [
    ['cf_pw_hash',      'bs_pw_hash'],
    ['cf_script_url',   'bs_cf_script_url'],
    ['cf_theme',        'bs_reveal_theme'],
    ['cf_custom_themes','bs_custom_themes']
  ];
  migrations.forEach(function(pair) {
    var old = localStorage.getItem(pair[0]);
    if (old && !localStorage.getItem(pair[1])) {
      localStorage.setItem(pair[1], old);
    }
  });
  // Migrate site theme preference
  var oldTheme = localStorage.getItem('theme');
  if (oldTheme && !localStorage.getItem('bs_theme')) {
    localStorage.setItem('bs_theme', oldTheme);
  }
}
migrateOldKeys();

// ---------------------------------------------------------------------------
// Theme toggle
// ---------------------------------------------------------------------------

ThemeManager.init({ storageKey: 'bs_theme' });
ThemeManager.applyTheme(localStorage.getItem('bs_theme') || 'dark');

// ---------------------------------------------------------------------------
// Crypto helpers
// ---------------------------------------------------------------------------

async function hashPw(pw) {
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
}

// ---------------------------------------------------------------------------
// Screen management
// ---------------------------------------------------------------------------

var PW_KEY   = 'bs_pw_hash';
var AUTH_KEY = 'bs_auth';

var SCREENS = ['screen-login', 'screen-app'];

function showScreen(id) {
  SCREENS.forEach(function(s) {
    document.getElementById(s).hidden = (s !== id);
  });
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------

// Clear any browser-injected password values on load
document.querySelectorAll('input[type="password"]').forEach(function(el) {
  el.value = '';
});

async function init() {
  if (sessionStorage.getItem(AUTH_KEY) === '1' && localStorage.getItem(PW_KEY)) {
    showApp();
    return;
  }
  showScreen('screen-login');
  document.getElementById('login-pw').focus();
}

// ---------------------------------------------------------------------------
// Auth event handlers
// ---------------------------------------------------------------------------

document.getElementById('login-btn').addEventListener('click', async function() {
  var btn = this;
  var pw  = document.getElementById('login-pw').value;
  var err = document.getElementById('login-error');
  err.textContent = '';
  btn.disabled = true;
  try {
    var hash   = await hashPw(pw);
    var result = await callWorker({ action: 'validate_auth', auth_token: hash });
    if (!result.ok) {
      err.textContent = t('error_pw_wrong');
      document.getElementById('login-pw').value = '';
      document.getElementById('login-pw').focus();
      return;
    }
    localStorage.setItem(PW_KEY, hash);
    sessionStorage.setItem(AUTH_KEY, '1');
    showApp();
  } catch (e) {
    err.textContent = t('error_pw_wrong');
    document.getElementById('login-pw').value = '';
    document.getElementById('login-pw').focus();
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('login-pw').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('login-btn').click();
});

document.getElementById('logout-btn').addEventListener('click', function() {
  localStorage.removeItem(PW_KEY);
  sessionStorage.removeItem(AUTH_KEY);
  document.getElementById('login-pw').value = '';
  document.getElementById('login-error').textContent = '';
  showScreen('screen-login');
  document.getElementById('login-pw').focus();
});

// ---------------------------------------------------------------------------
// App views
// ---------------------------------------------------------------------------

function showApp() {
  showScreen('screen-app');
}

// ---------------------------------------------------------------------------
// Start
// ---------------------------------------------------------------------------
init();
SettingsDrawer.init();
</script>
</body>
</html>
