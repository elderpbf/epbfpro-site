<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Sala de Aula · Display</title>
  <link rel="stylesheet" href="../backstage/css/theme.css?v=1.2">
  <link rel="stylesheet" href="../backstage/css/shared-components.css?v=1.6">
  <link rel="stylesheet" href="../backstage/css/qr-share-modal.css?v=1.3">
  <link rel="stylesheet" href="../backstage/css/question-types.css?v=1.9">
  <link rel="stylesheet" href="../backstage/css/public-header.css?v=1.6">
  <link rel="stylesheet" href="../backstage/css/cp-display.css?v=1.0">
  <script src="/backstage/js/debug.js?v=2.5"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }
    body { font-family: 'Inter', sans-serif; background: var(--background); color: var(--text-primary); display: flex; flex-direction: column; min-height: 100vh; }

    /* Main content */
    .main { display: flex; flex-direction: column; flex: 1; padding: clamp(12px, 1.8vh, 28px) clamp(16px, 2.5vw, 44px); overflow-y: auto; max-width: min(1200px, 92vw); width: 100%; margin: 0 auto; }

    /* Center states */
    .center-state { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; flex: 1; min-height: 300px; }
    .center-state .state-icon { font-size: 3rem; }
    .center-state .state-text { font-size: 2rem; color: var(--text-secondary); font-weight: 500; }
    .center-state .state-sub  { font-size: 0.9rem; color: var(--text-light); }

    /* Question display styles now in question-types.css */

    /* Display Mode Results Area */
    .qr-display { flex: 1; overflow-y: auto; min-height: 0; }

    /* No code screen */
    #no-code-screen { display: none; padding: 60px 0; text-align: center; color: var(--text-secondary); }
    #no-code-screen p   { font-size: 0.88rem; margin-bottom: 8px; }
    #no-code-screen code { font-size: 0.82rem; background: var(--surface); padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); }

    /* Refresh dot */
    .refresh-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--text-light); transition: background 0.3s; }
    .refresh-dot.active { background: var(--success); }

    /* Landscape Tablets / Projectors Override */
    @media (max-height: 600px) {
      pensoia-header .ph-bar { padding: 4px 16px; }
    }

    /* Promoted student Q&A card lives in ../backstage/css/cp-display.css */
  </style>
</head>
<body>

  <pensoia-header mode="display" theme-storage-key="bs_theme_public"></pensoia-header>

  <div class="main" id="main-content">
    <div class="center-state" id="center-state">
      <span class="state-icon">&#8987;</span>
      <span class="state-text">Carregando...</span>
    </div>
    <div id="qa-student-card" class="cp-qa-student">
      <div class="cp-qa-student-label">Pergunta do aluno</div>
      <div class="cp-qa-student-name" id="qa-student-name"></div>
      <div class="cp-qa-student-text" id="qa-student-text"></div>
      <div id="qa-student-answer-wrap" class="cp-qa-student-answer-wrap">
        <div class="cp-qa-student-answer-label">Resposta</div>
        <div class="cp-qa-student-answer" id="qa-student-answer"></div>
      </div>
    </div>
  </div>

  <div id="no-code-screen">
    <p>Nenhum codigo de sessao na URL.</p>
    <p>Abra esta pagina como: <code>display.html?code=AB12</code></p>
  </div>

<script src="../backstage/js/utils.js?v=1.0"></script>
<script src="../backstage/js/api-client.js?v=1.1"></script>
<script src="../backstage/js/question-renderer.js?v=2.6"></script>
<script src="../backstage/js/classpulse-question.min.js?v=1.8"></script>
<script src="../backstage/js/theme-manager.js?v=1.1"></script>
<script src="../backstage/js/qr-share-modal.js?v=1.3"></script>
<script src="../backstage/js/pensoia-header.js?v=1.4"></script>
<script>
  // ── THEME ────────────────────────────────────────────────────────────────
  // ThemeManager is initialized by <pensoia-header> via theme-storage-key.
  ThemeManager.initPublic();
  // ────────────────────────────────────────────────────────────────────────

  // ── CONFIG ────────────────────────────────────────────────────────────────
  const POLL_INTERVAL  = 3000;
  // ────────────────────────────────────────────────────────────────────────

  // ── I18N ────────────────────────────────────────────────────────────────
  const ACTIVE_LANG = 'pt';
  const STRINGS = {
    pt: {
      sessionEnded:  'Sessao encerrada',
      waiting:       'Aguardando pergunta...',
      live:          '\u25cf Ao vivo',
      final:         'Resultado final',
      answers:       n => `${n} resposta${n !== 1 ? 's' : ''}`,
    },
    en: {
      sessionEnded:  'Session ended',
      waiting:       'Waiting for question...',
      live:          '\u25cf Live',
      final:         'Final result',
      answers:       n => `${n} answer${n !== 1 ? 's' : ''}`,
    }
  };
  const t = STRINGS[ACTIVE_LANG] || STRINGS.pt;
  // ────────────────────────────────────────────────────────────────────────

  const params      = new URLSearchParams(window.location.search);
  const sessionCode = (params.get('code') || '').trim().toUpperCase();

  const headerEl = document.querySelector('pensoia-header');

  if (!sessionCode) {
    document.querySelector('.main').style.display       = 'none';
    document.getElementById('no-code-screen').style.display = 'block';
  } else {
    headerEl.setAttribute('code', sessionCode);
    // Resolve the trilha URL for the QR modal. cp_resolve_trilha only returns
    // the linked turma once the session is 'open', and the display tab is
    // usually opened before the host clicks Iniciar — so a one-shot lookup on
    // load would leave the QR stuck on the "no turma" notice for the rest of
    // the session. Instead we re-check on every poll tick (cpq-data) until it
    // resolves, then stop. This self-heals the moment the session goes live.
    function resolveTrilha() {
      if (headerEl.getAttribute('join-url')) return;
      callWorker({ action: 'cp_resolve_trilha', code: sessionCode })
        .then(function(res) {
          var tr = res && res.trilha;
          if (!tr) return;
          var url = 'https://pensoia.com/trilha/' + encodeURIComponent(tr.client_slug) + '/' +
                    encodeURIComponent(tr.turma_slug) + (tr.token ? '?k=' + encodeURIComponent(tr.token) : '');
          headerEl.setAttribute('join-url', url);
        })
        .catch(function() {});
    }
    resolveTrilha();
    const mainEl = document.getElementById('main-content');
    const centerState = document.getElementById('center-state');
    if (centerState) centerState.remove();
    const cpq = document.createElement('classpulse-question');
    cpq.id = 'cpq';
    cpq.setAttribute('mode', 'display');
    cpq.setAttribute('session', sessionCode);
    mainEl.insertBefore(cpq, document.getElementById('qa-student-card'));

    cpq.addEventListener('cpq-data', (e) => {
      if (!e.detail) return;
      if (e.detail.session) {
        headerEl.setAttribute('session-title', e.detail.session.title);
      }
      // Retry trilha resolution until it lands (self-guards on join-url).
      resolveTrilha();
      renderStudentQA(e.detail, cpq);
    });
  }

  function renderStudentQA(data, cpq) {
    const card = document.getElementById('qa-student-card');
    if (!card) return;
    const aq = data.active_question;
    const isStudentQA = aq && aq.type === 'student_qa';
    if (!isStudentQA) {
      card.classList.remove('is-active');
      if (cpq) cpq.style.display = '';
      return;
    }
    if (cpq) cpq.style.display = 'none';
    // Audience label seam (mirror of codex/questions/identity.js audienceLabel):
    // anonymous device handles (Anon_*) collapse to "Anônimo" on the public display;
    // a typed/real name (legacy ClassPulse join) shows as-is.
    var _qaNm = aq.student_name || '';
    document.getElementById('qa-student-name').textContent =
      (!_qaNm || /^anon[_-]/i.test(_qaNm)) ? 'Anônimo' : _qaNm;
    document.getElementById('qa-student-text').textContent = aq.text || '';
    const ansWrap = document.getElementById('qa-student-answer-wrap');
    const ansText = (aq.student_answer || '').trim();
    if (ansText) {
      document.getElementById('qa-student-answer').textContent = aq.student_answer;
      ansWrap.classList.add('is-visible');
    } else {
      ansWrap.classList.remove('is-visible');
    }
    card.classList.add('is-active');
  }

  document.addEventListener('visibilitychange', () => { 
    if (document.visibilityState === 'visible') {
      const cpq = document.getElementById('cpq');
      if (cpq) cpq.startPolling();
    }
  });
</script>


</body>
</html>
