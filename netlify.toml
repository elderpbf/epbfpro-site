# Force browsers to always fetch fresh HTML for the adriana page.
# Images and other assets can still be cached normally.

[[headers]]
  for = "/adriana"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/adriana/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/adriana/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/adriana/admin"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/adriana/admin/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
