<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Perdido no meio · PensoLabs</title>
<link rel="stylesheet" href="../../css/theme.css?v=1.3">
<link rel="stylesheet" href="../css/labs.css?v=1.6">
<script src="../js/lab-header.js?v=1.0" defer></script>
<script src="../js/lab-controls.js?v=1.0" defer></script>
<script src="../js/lab-info.js?v=1.0" defer></script>
<script>
  (function() {
    try {
      var t = localStorage.getItem('bs_theme');
      if (t === 'dark' || t === 'light') {
        document.documentElement.setAttribute('data-theme', t);
      }
    } catch (e) {}
  })();
</script>
</head>
<body class="lab-page">
<section class="k4-panel">
  <style>
    .k4-panel {
      --bg: var(--lab-bg);
      --text: var(--lab-text);
      --text-dim: var(--lab-text-dim);
      --text-muted: var(--lab-text-muted);
      --surface: var(--lab-surface);
      --border: var(--lab-border);
      --focal: var(--lab-focal);
      --focal-rgb: var(--lab-focal-rgb);
      --warm: var(--lab-context-a);
      --warm-rgb: var(--lab-context-a-rgb);
      --cool: var(--lab-context-b);
      --cool-rgb: var(--lab-context-b-rgb);
      --good: var(--lab-good);
      --bad: var(--lab-bad);
      --bad-rgb: var(--lab-bad-rgb);
      --amber: #d4a017;
      --amber-rgb: 212, 160, 23;
      --font-display: var(--lab-font-display);
      --font-mono: var(--lab-font-mono);

      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 0.7rem;
      padding: 1rem 2rem 0.7rem;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-display);
    }

    /* ── Main area: accuracy + context bar + curve + response ── */
    .k4-main {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 0.8rem;
      min-height: 0;
    }

    /* Size selector — audience-visible context for the curve depth.
       Four discrete buttons (segmented look) so each step is anchored
       in the audience's mind. Labels are lawyer-speak, no token counts. */
    .k4-size-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      flex-wrap: wrap;
    }
    .k4-size-label {
      font-family: var(--font-display);
      font-size: var(--lab-fs-ui);
      color: var(--text-dim);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .k4-size-buttons {
      display: inline-flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .k4-size-btn {
      font-family: var(--font-display);
      font-size: var(--lab-fs-ui);
      font-weight: 600;
      padding: 0.5rem 1.1rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 220ms, color 220ms, border-color 220ms, box-shadow 220ms, transform 150ms;
      letter-spacing: 0.01em;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      line-height: 1.15;
    }
    .k4-size-btn:hover {
      border-color: var(--cool);
      color: var(--cool);
      transform: translateY(-1px);
    }
    .k4-size-btn.k4-size-btn--active {
      border-color: var(--cool);
      background: rgba(var(--cool-rgb), 0.18);
      color: var(--cool);
      box-shadow: 0 0 14px rgba(var(--cool-rgb), 0.25);
    }

    /* Context bar with draggable needle */
    .k4-ctx-section {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .k4-ctx-bar {
      position: relative;
      height: clamp(56px, 6vh, 84px);
      background: color-mix(in srgb, var(--text) 5%, transparent);
      border-radius: 12px;
      overflow: visible;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    .k4-ctx-bar:active { cursor: grabbing; }
    /* Ghost tokens: a subtle vertical-line pattern suggests "lots of text" */
    .k4-ctx-bar::before {
      content: '';
      position: absolute;
      inset: 8px 10px;
      border-radius: 8px;
      background-image: repeating-linear-gradient(
        90deg,
        rgba(var(--cool-rgb), 0.18) 0,
        rgba(var(--cool-rgb), 0.18) 2px,
        transparent 2px,
        transparent 6px
      );
      opacity: 0.75;
      pointer-events: none;
    }
    .k4-needle {
      position: absolute;
      top: -10px;
      bottom: -10px;
      width: 4px;
      background: var(--warm);
      border-radius: 2px;
      transform: translateX(-50%);
      box-shadow: 0 0 14px rgba(var(--warm-rgb), 0.55);
      transition: left 80ms linear;
      pointer-events: none;
    }
    .k4-needle::before {
      content: '';
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--warm);
      box-shadow: 0 0 14px rgba(var(--warm-rgb), 0.7);
    }
    .k4-needle-tag {
      position: absolute;
      top: -54px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--warm);
      color: #fff;
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: var(--lab-fs-ui);
      font-weight: 600;
      letter-spacing: 0.01em;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(var(--warm-rgb), 0.4);
      pointer-events: none;
    }
    .k4-needle-tag::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid var(--warm);
    }
    .k4-scale {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      font-family: var(--font-mono);
      font-size: var(--lab-fs-ui);
      color: var(--text-dim);
      padding: 0 0.4rem;
      letter-spacing: 0.04em;
    }
    .k4-scale span:nth-child(1) { text-align: left; }
    .k4-scale span:nth-child(2) { text-align: center; }
    .k4-scale span:nth-child(3) { text-align: right; }

    /* U-curve + response side-by-side */
    .k4-bottom {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
      gap: 1.2rem;
      min-height: 0;
      align-items: stretch;
    }

    .k4-curve-wrap {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .k4-curve-title {
      font-family: var(--font-display);
      font-size: var(--lab-fs-ui);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
      font-weight: 600;
      margin: 0 0 0.4rem;
    }
    .k4-curve-svg {
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
      display: block;
    }

    .k4-response {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .k4-response-title {
      font-family: var(--font-display);
      font-size: var(--lab-fs-ui);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
      font-weight: 600;
      margin: 0 0 0.4rem;
    }
    .k4-response-card {
      flex: 1;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 1rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      overflow-y: auto;
      min-height: 0;
    }
    .k4-response-card.k4-response--empty {
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-style: italic;
      font-size: var(--lab-fs-answer);
      text-align: center;
    }
    .k4-response-answer {
      font-family: var(--font-display);
      font-size: var(--lab-fs-answer);
      font-weight: 700;
      line-height: 1.25;
      margin: 0;
      text-align: justify;
    }
    .k4-response-verdict {
      font-family: var(--font-display);
      font-size: var(--lab-fs-answer);
      color: var(--text-dim);
      line-height: 1.4;
      margin: 0;
      text-align: justify;
    }
    .k4-response-card.k4-response--high {
      border-color: var(--good);
      box-shadow: 0 0 18px rgba(34, 197, 94, 0.18);
      background: color-mix(in srgb, var(--good) 8%, var(--surface));
    }
    .k4-response-card.k4-response--high .k4-response-answer { color: var(--good); }
    .k4-response-card.k4-response--mid {
      border-color: var(--amber);
      background: color-mix(in srgb, var(--amber) 10%, var(--surface));
    }
    .k4-response-card.k4-response--mid .k4-response-answer { color: var(--amber); }
    .k4-response-card.k4-response--low {
      border-color: var(--bad);
      background: color-mix(in srgb, var(--bad) 10%, var(--surface));
    }
    .k4-response-card.k4-response--low .k4-response-answer { color: var(--bad); }

    /* ── Operator buttons ────────────────────────────────── */
    .k4-button-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.45rem;
      padding: 0 0.2rem;
      flex-wrap: wrap;
    }
    /* The text-size control (A− / A+) is mounted by lab-controls.js into
       this slot; on desktop it sits at the left of the operator bar. */
    .k4-fs-slot { margin-right: auto; }
    .k4-btn {
      font-family: var(--font-display);
      font-size: var(--lab-fs-btn);
      font-weight: 600;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 180ms, color 180ms, border-color 180ms, box-shadow 180ms, transform 150ms;
      letter-spacing: 0.02em;
      line-height: 1.15;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text-dim);
    }
    .k4-btn:hover { border-color: var(--warm); color: var(--warm); transform: translateY(-1px); }
    .k4-btn-primary {
      border-color: var(--focal);
      background: rgba(var(--focal-rgb), 0.16);
      color: var(--focal);
      box-shadow: 0 0 10px rgba(var(--focal-rgb), 0.18);
    }
    .k4-btn-primary:hover {
      background: rgba(var(--focal-rgb), 0.28);
      border-color: var(--focal);
      color: var(--focal);
      box-shadow: 0 0 16px rgba(var(--focal-rgb), 0.3);
    }

    /* ── Responsive: phone / narrow portrait ───────────────
       Font sizing is handled by the shared --lab-fs-* tokens (which carry
       their own phone floors), so these blocks only touch LAYOUT: padding,
       grid, tap targets, positioning. */
    @media (max-width: 700px) {
      /* Fixed stage on phone too (no page scroll) — same app-fit model as the
         other labs. The removed question box is what used to force scrolling;
         with it gone the pieces fit one 100dvh screen. */
      .k4-panel {
        padding: 0.5rem 0.9rem 0.5rem;
        gap: 0.4rem;
      }

      .k4-main { gap: 0.45rem; }
      .k4-size-row {
        flex-direction: column;
        align-items: stretch;
        gap: 0.3rem;
      }
      .k4-size-label {
        text-align: center;
        letter-spacing: 0.06em;
      }
      .k4-size-buttons {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 0.3rem;
      }
      .k4-size-btn {
        padding: 0.4rem 0.7rem;
        flex: 1 1 calc(50% - 0.15rem);
        min-width: 0;
        min-height: 40px;
        text-align: center;
      }

      /* Extra top room so the needle tag (absolutely positioned above the
         bar) clears the size-selector buttons, which wrap to two rows here. */
      .k4-ctx-section { gap: 0.3rem; margin-top: 2.4rem; }
      .k4-ctx-bar { height: 46px; }
      .k4-needle-tag {
        padding: 0.22rem 0.6rem;
        top: -40px;
      }
      .k4-scale { padding: 0 0.2rem; }

      /* Curve and response share the remaining height (both can shrink), so
         the stage never overflows. The response card scrolls internally if an
         answer is long — the page itself does not scroll. */
      .k4-bottom {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1.15fr) minmax(0, 1fr);
        gap: 0.4rem;
      }
      .k4-curve-title,
      .k4-response-title { margin: 0 0 0.2rem; }
      .k4-response-card { padding: 0.6rem 0.8rem; gap: 0.3rem; }
      .k4-response-answer { line-height: 1.25; }

      .k4-button-bar { gap: 0.35rem; padding: 0; }
      .k4-fs-slot { margin-right: 0; flex: 1 0 100%; justify-content: center; }
      .k4-btn {
        padding: 0.5rem 0.5rem;
        flex: 1 1 calc(50% - 0.2rem);
        min-height: 44px;
        min-width: 0;
        text-align: center;
      }
      /* A−/A+ is hidden on phone (shared rule); "Entenda" takes a full-width
         row at the top of the operator bar, the actions keep their grid
         below. Same layout in every lab. */
      .k4-button-bar > [data-lab-info-ctl] {
        order: -1;
        display: flex;
        flex: 1 1 100%;
      }
      .k4-button-bar > [data-lab-info-ctl] .lab-info-btn {
        width: 100%;
        justify-content: center;
      }
    }

    @media (max-width: 400px) {
      .k4-size-btn { padding: 0.4rem 0.5rem; }
      .k4-btn { padding: 0.6rem 0.35rem; }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      .k4-panel {
        padding: 0.4rem 1rem 0.35rem;
        gap: 0.4rem;
      }
      .k4-main { gap: 0.5rem; }
      .k4-size-btn {
        padding: 0.35rem 0.7rem;
      }
      .k4-ctx-bar { height: 44px; }
      .k4-needle-tag {
        padding: 0.2rem 0.55rem;
        top: -36px;
      }
      .k4-bottom { gap: 0.7rem; }
      .k4-response-card { padding: 0.5rem 0.7rem; gap: 0.3rem; }
      .k4-btn {
        padding: 0.4rem 0.75rem;
        min-height: 32px;
      }
    }
  </style>

  <div class="lab-header"
       data-lab-title="Perdido no meio"
       data-lab-subtitle="Acurácia ao longo do processo"></div>

  <div class="k4-main">
    <div class="k4-size-row" role="radiogroup" aria-label="Tamanho do processo">
      <span class="k4-size-label">Tamanho do processo</span>
      <div class="k4-size-buttons">
        <button class="k4-size-btn" data-size="0" type="button" role="radio">Petição inicial</button>
        <button class="k4-size-btn k4-size-btn--active" data-size="1" type="button" role="radio" aria-checked="true">Processo simples</button>
        <button class="k4-size-btn" data-size="2" type="button" role="radio">Processo complexo</button>
        <button class="k4-size-btn" data-size="3" type="button" role="radio">Processo monstro</button>
      </div>
    </div>

    <div class="k4-ctx-section">
      <div class="k4-ctx-bar" id="k4-ctx-bar" role="slider" tabindex="0"
           aria-label="Posição da intimação no processo"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="k4-needle" id="k4-needle">
          <span class="k4-needle-tag">15/03/2024 — intimação do réu</span>
        </div>
      </div>
      <div class="k4-scale">
        <span>início do processo</span>
        <span>meio do processo</span>
        <span>final do processo</span>
      </div>
    </div>

    <div class="k4-bottom">
      <div class="k4-curve-wrap">
        <h2 class="k4-curve-title">Acurácia × posição</h2>
        <svg class="k4-curve-svg" id="k4-curve" viewBox="0 0 1000 320" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="k4-curve-grad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="rgb(var(--cool-rgb))" stop-opacity="0.4"/>
              <stop offset="100%" stop-color="rgb(var(--cool-rgb))" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <!-- Axes -->
          <line x1="0" y1="320" x2="1000" y2="320" stroke="var(--border)" stroke-width="2"/>
          <line x1="0" y1="0"   x2="0"    y2="320" stroke="var(--border)" stroke-width="2"/>
          <!-- Reference 50%/100% grid lines -->
          <line x1="0" y1="160" x2="1000" y2="160" stroke="var(--border)" stroke-width="1" stroke-dasharray="4 6"/>
          <line x1="500" y1="0" x2="500" y2="320" stroke="var(--border)" stroke-width="1" stroke-dasharray="4 6"/>
          <!-- Y axis ticks -->
          <text x="10" y="14" font-family="var(--font-mono)" font-size="14" fill="var(--text-dim)">100%</text>
          <text x="10" y="166" font-family="var(--font-mono)" font-size="14" fill="var(--text-dim)">50%</text>
          <text x="10" y="316" font-family="var(--font-mono)" font-size="14" fill="var(--text-dim)">0%</text>
          <!-- Filled area + curve will be injected by JS -->
          <path id="k4-curve-area" d="" fill="url(#k4-curve-grad)" opacity="0.8"/>
          <path id="k4-curve-path" d="" fill="none" stroke="rgb(var(--cool-rgb))" stroke-width="3" stroke-linejoin="round"/>
          <!-- Tracking dot -->
          <circle id="k4-curve-dot" cx="0" cy="16" r="9"
                  fill="rgb(var(--warm-rgb))"
                  stroke="white" stroke-width="3"
                  style="filter: drop-shadow(0 0 6px rgba(var(--warm-rgb), 0.6));"/>
        </svg>
      </div>

      <div class="k4-response">
        <h2 class="k4-response-title">Resposta do modelo</h2>
        <div class="k4-response-card k4-response--empty" id="k4-response">
          Pergunte ao modelo.
        </div>
      </div>
    </div>
  </div>

  <div class="k4-button-bar">
    <span data-lab-info-ctl></span>
    <span class="k4-fs-slot" data-lab-fs-ctl></span>
    <button class="k4-btn k4-btn-primary" id="k4-ask">Perguntar ao modelo</button>
    <button class="k4-btn" id="k4-reset">Reiniciar</button>
  </div>

  <!-- Theory that the app-fit rule keeps off the stage; surfaced by the
       shared "Entenda" button (lab-info.js). -->
  <template data-lab-info data-lab-info-title="Por que o modelo se perde no meio?">
    <p>Um modelo de linguagem <strong>não lê o processo com atenção uniforme</strong>. Ele recupera muito bem o que está no <strong>começo</strong> e no <strong>fim</strong> do texto, mas a precisão despenca para o que está no <strong>meio</strong>.</p>
    <p>É a <strong>“zona morta no meio”</strong> (o efeito <em>lost in the middle</em>): quanto maior o processo, mais funda fica essa zona, e maior a chance de o modelo perder um ato, uma data ou uma intimação que esteja no centro dos autos.</p>
    <p>Na prática, a mesma intimação é fácil de achar numa petição curta e pode <strong>sumir</strong> no meio de um processo monstro. O que decide não é só <em>se</em> a informação está nos autos, mas <em>onde</em> ela está.</p>
  </template>

  <script>
    (function() {
      // ── Constants ───────────────────────────────────────
      // Per-size dip depth. Values chosen so that even the deepest
      // ("processo monstro") only drops accuracy to ~30% at the centre,
      // not to zero — real lost-in-the-middle research shows the dip is
      // visible but not catastrophic. acc(pos) = 0.95 - depth * gaussian.
      const SIZE_DEPTHS = [0.10, 0.30, 0.50, 0.65];
      const SIZE_LABELS = ['Petição inicial', 'Processo simples', 'Processo complexo', 'Processo monstro'];

      function accuracyAt(pos, depth) {
        return 0.95 - depth * Math.exp(-((pos - 0.5) ** 2) / 0.05);
      }
      // Zone for the answer card. Computed from the current accuracy
      // (size + position together), NOT from position alone — the whole
      // point of the size selector is that the same middle position is
      // safe in a small case but lethal in a monster.
      function zoneOfAcc(acc) {
        if (acc >= 0.75) return 'high';
        if (acc >= 0.55) return 'mid';
        return 'low';
      }

      // ── State ───────────────────────────────────────────
      let needlePos    = 0;   // 0..1
      let sizeIdx      = 1;   // index into SIZE_DEPTHS; default "Processo simples"
      let isDragging   = false;
      let lowAnswerIdx = 0;   // cycles through hallucinated answers on repeated asks

      // Hallucinated / hedged answers cycled through when the model
      // "loses" the intimação in the middle of a long processo.
      const LOW_ANSWERS = [
        'Não localizei a intimação do réu neste processo.',
        '23 de abril de 2024.',
        'A intimação consta, mas a data não pôde ser determinada.',
        '15 de fevereiro de 2024.',
        'Não há registro de intimação específica da sentença no processo.'
      ];

      // ── DOM refs ────────────────────────────────────────
      const ctxBarEl   = document.getElementById('k4-ctx-bar');
      const needleEl   = document.getElementById('k4-needle');
      const curvePath  = document.getElementById('k4-curve-path');
      const curveArea  = document.getElementById('k4-curve-area');
      const curveDot   = document.getElementById('k4-curve-dot');
      const responseEl = document.getElementById('k4-response');
      const askBtn     = document.getElementById('k4-ask');
      const resetBtn   = document.getElementById('k4-reset');
      const sizeBtns   = document.querySelectorAll('.k4-size-btn');

      // ── Curve geometry (one-time path build) ────────────
      // We sample 101 points across pos ∈ [0, 1] and emit them as an SVG
      // path inside the 1000x320 viewBox. acc=1 maps to y=0 (top); acc=0
      // maps to y=320 (bottom). We use preserveAspectRatio="none" on the
      // <svg> so the curve stretches to whatever the container ends up
      // being — the points are unit-coords, not pixel-coords.
      const CURVE_W = 1000;
      const CURVE_H = 320;
      function buildCurve() {
        const depth = SIZE_DEPTHS[sizeIdx];
        const N = 100;
        let path = '';
        let area = '';
        for (let i = 0; i <= N; i++) {
          const pos = i / N;
          const acc = accuracyAt(pos, depth);
          const x = pos * CURVE_W;
          const y = (1 - acc) * CURVE_H;
          path += (i === 0 ? 'M ' : 'L ') + x.toFixed(2) + ' ' + y.toFixed(2) + ' ';
        }
        area = path + ' L ' + CURVE_W + ' ' + CURVE_H + ' L 0 ' + CURVE_H + ' Z';
        curvePath.setAttribute('d', path);
        curveArea.setAttribute('d', area);
      }

      // ── Render ──────────────────────────────────────────
      function render() {
        const depth = SIZE_DEPTHS[sizeIdx];
        const acc = accuracyAt(needlePos, depth);

        // Needle horizontal position (% of context bar)
        needleEl.style.left = (needlePos * 100) + '%';
        ctxBarEl.setAttribute('aria-valuenow', String(Math.round(needlePos * 100)));

        // Curve dot — its vertical drop is the audience's *implicit*
        // accuracy reading. We deliberately don't display the percentage.
        curveDot.setAttribute('cx', String(needlePos * CURVE_W));
        curveDot.setAttribute('cy', String((1 - acc) * CURVE_H));
      }

      // ── Dragging ────────────────────────────────────────
      function posFromEvent(e) {
        const rect = ctxBarEl.getBoundingClientRect();
        const clientX = (e.touches && e.touches[0])
          ? e.touches[0].clientX
          : (e.changedTouches && e.changedTouches[0])
            ? e.changedTouches[0].clientX
            : e.clientX;
        if (clientX == null) return null;
        const x = clientX - rect.left;
        return Math.max(0, Math.min(1, x / rect.width));
      }

      function onDown(e) {
        const p = posFromEvent(e);
        if (p == null) return;
        isDragging = true;
        needlePos = p;
        render();
        ctxBarEl.setPointerCapture && e.pointerId != null && ctxBarEl.setPointerCapture(e.pointerId);
        e.preventDefault();
      }
      function onMove(e) {
        if (!isDragging) return;
        const p = posFromEvent(e);
        if (p == null) return;
        needlePos = p;
        render();
      }
      function onUp(e) {
        if (!isDragging) return;
        isDragging = false;
        if (e.pointerId != null && ctxBarEl.releasePointerCapture) {
          try { ctxBarEl.releasePointerCapture(e.pointerId); } catch (_) {}
        }
      }

      ctxBarEl.addEventListener('pointerdown', onDown);
      window  .addEventListener('pointermove', onMove);
      window  .addEventListener('pointerup',   onUp);
      window  .addEventListener('pointercancel', onUp);

      // Keyboard accessibility (arrow keys nudge the needle by 2% / 10%)
      ctxBarEl.addEventListener('keydown', e => {
        let step = 0;
        if (e.key === 'ArrowLeft')   step = -0.02;
        if (e.key === 'ArrowRight')  step = +0.02;
        if (e.key === 'PageDown')    step = -0.10;
        if (e.key === 'PageUp')      step = +0.10;
        if (e.key === 'Home')        { needlePos = 0;   render(); e.preventDefault(); return; }
        if (e.key === 'End')         { needlePos = 1;   render(); e.preventDefault(); return; }
        if (step === 0) return;
        needlePos = Math.max(0, Math.min(1, needlePos + step));
        render();
        e.preventDefault();
      });

      // ── Ask handler ─────────────────────────────────────
      function ask() {
        const depth = SIZE_DEPTHS[sizeIdx];
        const acc = accuracyAt(needlePos, depth);
        const zone = zoneOfAcc(acc);
        const card = responseEl;
        card.classList.remove('k4-response--empty', 'k4-response--high', 'k4-response--mid', 'k4-response--low');

        let answer, verdict;
        if (zone === 'high') {
          answer = 'O réu foi intimado da sentença em 15 de março de 2024.';
          verdict = 'Resposta correta.';
          card.classList.add('k4-response--high');
        } else if (zone === 'mid') {
          answer = 'Acredito que a intimação tenha ocorrido em 15 de março de 2024 (?).';
          verdict = 'Recuperação incerta.';
          card.classList.add('k4-response--mid');
        } else {
          answer = LOW_ANSWERS[lowAnswerIdx % LOW_ANSWERS.length];
          lowAnswerIdx += 1;
          verdict = 'O modelo perdeu o ato no meio.';
          card.classList.add('k4-response--low');
        }

        card.innerHTML = '';
        const ans = document.createElement('p');
        ans.className = 'k4-response-answer';
        ans.textContent = answer;
        const ver = document.createElement('p');
        ver.className = 'k4-response-verdict';
        ver.textContent = verdict;
        card.appendChild(ans);
        card.appendChild(ver);
      }

      function reset() {
        needlePos = 0;
        lowAnswerIdx = 0;
        responseEl.classList.remove('k4-response--high', 'k4-response--mid', 'k4-response--low');
        responseEl.classList.add('k4-response--empty');
        responseEl.innerHTML = 'Pergunte ao modelo.';
        render();
      }

      // ── Size selector ───────────────────────────────────
      // Picking a size redraws the curve (deeper dip = bigger processo)
      // and re-renders the dot so the audience sees the change instantly.
      // We DON'T reset the response card — it's fair game to ask, then
      // change the size, then ask again to compare same position / two
      // processo sizes.
      sizeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          sizeIdx = Number(btn.dataset.size);
          sizeBtns.forEach(b => {
            const isActive = Number(b.dataset.size) === sizeIdx;
            b.classList.toggle('k4-size-btn--active', isActive);
            b.setAttribute('aria-checked', String(isActive));
          });
          buildCurve();
          render();
        });
      });

      askBtn  .addEventListener('click', ask);
      resetBtn.addEventListener('click', reset);

      // ── Theme sync ──────────────────────────────────────
      window.addEventListener('storage', e => {
        if (e.key !== 'bs_theme') return;
        const t = e.newValue;
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        }
      });

      // ── Init ────────────────────────────────────────────
      buildCurve();
      render();
    })();
  </script>
</section>
</body>
</html>
