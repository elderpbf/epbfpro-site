<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Temperatura · PensoLabs</title>
<link rel="stylesheet" href="../../css/theme.css?v=1.3">
<link rel="stylesheet" href="../css/labs.css?v=1.4">
<script src="../js/lab-header.js?v=1.0" defer></script>
<script src="../js/lab-controls.js?v=1.0" defer></script>
<script src="../js/lab-info.js?v=1.0" defer></script>
<script>
  (function() {
    try {
      var t = localStorage.getItem('bs_theme');
      if (t === 'dark' || t === 'light') {
        document.documentElement.setAttribute('data-theme', t);
      }
    } catch (e) {}
  })();
</script>
</head>
<body class="lab-page">
<section class="k2-panel">
  <style>
    .k2-panel {
      --bg: var(--lab-bg);
      --text: var(--lab-text);
      --text-dim: var(--lab-text-dim);
      --surface: var(--lab-surface);
      --surface-2: var(--lab-surface-2);
      --focal: var(--lab-focal);
      --focal-rgb: var(--lab-focal-rgb);
      --warm: var(--lab-context-a);
      --warm-rgb: var(--lab-context-a-rgb);
      --cool: var(--lab-context-b);
      --cool-rgb: var(--lab-context-b-rgb);
      --border: var(--lab-border);
      --font-display: var(--lab-font-display);
      --font-mono: var(--lab-font-mono);

      position: relative;
      width: 100%;
      /* dvh, not vh: on mobile the vh box sits behind the URL bar and hides
         the operator button row. dvh tracks the visible viewport. */
      height: 100dvh;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto auto;
      gap: 0.7rem;
      padding: 1rem 2rem 0.7rem;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-display);
    }

    /* ── Section labels ───────────────────────────────────── */
    .k2-section-label {
      font-family: var(--font-mono);
      font-size: var(--lab-fs-ui);
      color: var(--text-dim);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin: 0 0 0.4rem;
      font-weight: 600;
    }

    /* ── Prompt row ─────────────────────────────────────────
       Prompt line wraps freely. Earlier version forced nowrap
       + ellipsis and the badge / last token got clipped once
       the full sentence was in. With Reiniciar now in the
       bottom bar, the prompt-wrap owns the whole row, and
       the rare wrap to a second line is cheaper than a
       truncated reveal. */
    .k2-prompt-wrap {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 0.7rem 1.2rem 0.85rem;
      min-width: 0;
    }
    .k2-prompt-line {
      font-family: var(--font-mono);
      font-size: var(--lab-fs-audience);
      font-weight: 600;
      letter-spacing: 0.005em;
      color: var(--text);
      line-height: 1.15;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    .k2-prompt-word {
      display: inline-block;
      animation: k2-pop-in 320ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    .k2-blank {
      display: inline-block;
      min-width: 2.5em;
      border-bottom: 3px solid var(--focal);
      color: var(--focal);
      font-weight: 700;
      position: relative;
    }
    .k2-blank::after {
      content: '';
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--focal);
      margin-left: 0.1em;
      vertical-align: middle;
      animation: k2-blink 900ms steps(2) infinite;
    }
    .k2-prompt-final {
      color: var(--focal);
      font-weight: 800;
    }
    @keyframes k2-blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0; }
    }
    @keyframes k2-pop-in {
      from { transform: translateY(-0.5em) scale(0.7); opacity: 0; }
      to   { transform: translateY(0) scale(1); opacity: 1; }
    }
    .k2-final-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 1.3rem;
      margin-left: 0.8rem;
      background: rgba(var(--cool-rgb), 0.14);
      border: 2px solid var(--cool);
      border-radius: 999px;
      font-family: var(--font-display);
      font-size: var(--lab-fs-answer);
      font-weight: 700;
      color: var(--cool);
      animation: k2-pop-in 380ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    /* ── Bar chart ──────────────────────────────────────────
       Bars use a 12-row grid so they always divide the chart's
       available height evenly. The chart now bleeds onto the
       panel background (no surrounding box/card) so the bars
       get the full available width and the chart breathes
       into the bottom space instead of being framed inside a
       smaller container. */
    .k2-chart-wrap {
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 0;
    }
    .k2-bars {
      flex: 1;
      display: grid;
      grid-template-rows: repeat(12, minmax(0, 1fr));
      gap: 0.35rem;
      min-height: 0;
    }
    .k2-bar {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      min-height: 0;
      min-width: 0;
    }
    .k2-bar-token {
      flex: 0 0 auto;
      width: clamp(220px, 16vw, 320px);
      padding-right: 0.7rem;
      font-family: var(--font-mono);
      font-size: var(--lab-fs-body);
      font-weight: 600;
      color: var(--text);
      text-align: right;
      white-space: nowrap;
      overflow: visible;
    }
    .k2-bar-track {
      flex: 1 1 auto;
      min-width: 0;
      position: relative;
      height: 64%;
      min-height: 18px;
      max-height: 51px;
      background: color-mix(in srgb, var(--text) 6%, transparent);
      border-radius: 8px;
      overflow: hidden;
    }
    .k2-bar-fill {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 0%;
      background: linear-gradient(90deg,
        rgba(var(--cool-rgb), 0.55),
        rgba(var(--focal-rgb), 0.85));
      border-radius: 6px;
      transition: width 600ms cubic-bezier(0.22, 0.61, 0.36, 1),
                  background 320ms;
    }
    .k2-bar.k2-bar--top .k2-bar-fill {
      background: linear-gradient(90deg,
        rgba(var(--warm-rgb), 0.65),
        var(--warm));
      box-shadow: 0 0 14px rgba(var(--warm-rgb), 0.35);
    }
    .k2-bar.k2-bar--sampled .k2-bar-fill {
      animation: k2-pulse 600ms ease-out;
    }
    @keyframes k2-pulse {
      0%   { filter: brightness(1); }
      40%  { filter: brightness(1.6); transform: scaleY(1.1); }
      100% { filter: brightness(1); transform: scaleY(1); }
    }
    .k2-bar-pct {
      flex: 0 0 auto;
      width: clamp(68px, 5.2vw, 96px);
      font-family: var(--font-mono);
      font-size: var(--lab-fs-body);
      font-weight: 600;
      color: var(--text-dim);
      text-align: right;
    }
    .k2-bar.k2-bar--top .k2-bar-pct { color: var(--warm); font-weight: 700; }

    /* ── Controls row ──────────────────────────────────────
       Only the temperature block lives here now; the action
       buttons (Sobreajuste / Reiniciar / Selecionar) moved to
       the .k2-button-bar below so they don't fight the temp
       UI for horizontal space. */
    .k2-controls {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 0.45rem 0.9rem;
    }
    .k2-temp-block {
      display: grid;
      grid-template-columns: minmax(0, 220px) minmax(0, 1fr);
      column-gap: 1.1rem;
      align-items: center;
      min-width: 0;
    }
    .k2-temp-label-col {
      grid-column: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.1rem;
      min-width: 0;
    }
    .k2-temp-value {
      font-family: var(--font-mono);
      font-size: var(--lab-fs-audience);
      font-weight: 700;
      color: var(--warm);
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .k2-temp-desc {
      font-family: var(--font-display);
      font-size: var(--lab-fs-body);
      color: var(--text-dim);
      font-weight: 500;
      letter-spacing: 0.02em;
      max-width: 100%;
      overflow-wrap: break-word;
      line-height: 1.2;
    }
    .k2-temp-slider-row {
      grid-column: 2;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      min-width: 0;
    }
    .k2-temp-slider-label {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: var(--lab-fs-ui);
      color: var(--text-dim);
      opacity: 0.7;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .k2-temp-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      background: color-mix(in srgb, var(--text) 8%, transparent);
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }
    .k2-temp-slider {
      height: 14px;
    }
    .k2-temp-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--warm);
      border: 4px solid var(--surface);
      box-shadow: 0 0 0 1px var(--warm), 0 0 16px rgba(var(--warm-rgb), 0.4);
      cursor: grab;
      transition: transform 120ms;
    }
    .k2-temp-slider::-webkit-slider-thumb:active { cursor: grabbing; transform: scale(1.1); }
    .k2-temp-slider::-moz-range-thumb {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--warm);
      border: 4px solid var(--surface);
      box-shadow: 0 0 0 1px var(--warm), 0 0 16px rgba(var(--warm-rgb), 0.4);
      cursor: grab;
    }

    /* ── Bottom button bar ─────────────────────────────────
       Operator-only controls. Kept visually quiet (small font,
       tight padding, right-aligned) since Elder operates them
       up close and the audience watches the chart, not the
       buttons. Variants: toggle (Sobreajuste), reset (Reiniciar),
       sample (Selecionar). */
    .k2-button-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.45rem;
      padding: 0 0.2rem;
      flex-wrap: wrap;
    }
    /* The text-size control (A− / A+) is mounted by lab-controls.js into
       this slot; on desktop it sits at the left of the operator bar. */
    .k2-fs-slot { margin-right: auto; }
    .k2-btn {
      font-family: var(--font-display);
      font-size: var(--lab-fs-btn);
      font-weight: 600;
      padding: 0.38rem 1rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 180ms, color 180ms, border-color 180ms, box-shadow 180ms, transform 150ms;
      letter-spacing: 0.02em;
      line-height: 1.15;
    }
    .k2-btn-sample {
      border: 1.5px solid var(--focal);
      background: rgba(var(--focal-rgb), 0.16);
      color: var(--focal);
      box-shadow: 0 0 10px rgba(var(--focal-rgb), 0.18);
    }
    .k2-btn-sample:hover:not(:disabled) {
      background: rgba(var(--focal-rgb), 0.28);
      transform: translateY(-1px);
      box-shadow: 0 0 16px rgba(var(--focal-rgb), 0.3);
    }
    .k2-btn-sample:disabled { opacity: 0.45; cursor: not-allowed; }
    .k2-btn-reset {
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text-dim);
    }
    .k2-btn-reset:hover {
      border-color: var(--warm);
      color: var(--warm);
    }
    .k2-btn-toggle {
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text-dim);
    }
    .k2-btn-toggle:hover {
      border-color: var(--cool);
      color: var(--cool);
    }
    .k2-btn-toggle[aria-pressed="true"] {
      border-color: var(--cool);
      background: rgba(var(--cool-rgb), 0.16);
      color: var(--cool);
      box-shadow: 0 0 10px rgba(var(--cool-rgb), 0.22);
    }

    /* ── Flying token clone ───────────────────────────────── */
    .k2-fly {
      position: fixed;
      pointer-events: none;
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--warm);
      z-index: 100;
      transition: transform 700ms cubic-bezier(0.22, 0.61, 0.36, 1),
                  font-size 700ms cubic-bezier(0.22, 0.61, 0.36, 1),
                  opacity 700ms ease-out;
    }

    /* ── Responsive: phone / narrow portrait ─────────────── */
    @media (max-width: 700px) {
      .k2-panel {
        padding: 0.5rem 0.9rem 0.5rem;
        gap: 0.4rem;
      }
      .k2-prompt-wrap { padding: 0.5rem 0.9rem 0.55rem; }
      .k2-final-badge { padding: 0.35rem 0.85rem; margin-left: 0.5rem; }

      .k2-bars { gap: 0.2rem; }
      .k2-bar { gap: 0.5rem; }
      .k2-bar-token {
        width: 130px;
        padding-right: 0.4rem;
      }
      .k2-bar-pct { width: 52px; }
      .k2-bar-track { min-height: 15px; max-height: 29px; height: 56%; }

      .k2-controls { padding: 0.4rem 0.7rem; }
      .k2-temp-block {
        grid-template-columns: 1fr;
        column-gap: 0;
        row-gap: 0.4rem;
      }
      .k2-temp-label-col {
        flex-direction: row;
        align-items: baseline;
        gap: 0.55rem;
      }
      /* Single-column grid on phone: force the slider row into track 1 so it
         stacks BELOW the value+desc instead of landing in an implicit 2nd
         column (grid-column:2 from the desktop rule) and overlapping. */
      .k2-temp-slider-row { grid-column: 1; gap: 0.2rem; }
      .k2-temp-slider::-webkit-slider-thumb { width: 28px; height: 28px; }
      .k2-temp-slider::-moz-range-thumb { width: 28px; height: 28px; }

      .k2-button-bar { gap: 0.4rem; padding: 0; }
      /* Text-size control gets its own centered row on phones. */
      .k2-fs-slot { margin-right: 0; flex: 1 0 100%; justify-content: center; }
      .k2-btn {
        padding: 0.65rem 0.5rem;
        flex: 1 1 calc(33.333% - 0.27rem);
        min-height: 44px;
        min-width: 0;
        text-align: center;
      }
      /* A−/A+ is hidden on phone (shared rule); "Entenda" takes a full-width
         row at the top of the operator bar, actions keep their grid below. */
      .k2-button-bar > [data-lab-info-ctl] {
        order: -1;
        display: flex;
        flex: 1 1 100%;
      }
      .k2-button-bar > [data-lab-info-ctl] .lab-info-btn {
        width: 100%;
        justify-content: center;
      }
    }

    @media (max-width: 400px) {
      .k2-bar-token { width: 110px; }
      .k2-bar-pct { width: 46px; }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      .k2-panel {
        padding: 0.4rem 1rem 0.35rem;
        gap: 0.4rem;
      }
      .k2-prompt-wrap { padding: 0.4rem 0.9rem 0.5rem; }
      .k2-bars { gap: 0.2rem; }
      .k2-bar-track { min-height: 13px; max-height: 24px; height: 56%; }
      .k2-controls { padding: 0.35rem 0.7rem; }
      .k2-btn {
        padding: 0.4rem 0.75rem;
        min-height: 32px;
      }
    }
  </style>

  <div class="lab-header"
       data-lab-title="Temperatura"
       data-lab-subtitle="Probabilidades e aleatoriedade na geração"></div>

  <div class="k2-prompt-wrap">
    <div class="k2-prompt-line" id="k2-prompt"></div>
  </div>

  <div class="k2-chart-wrap">
    <div class="k2-bars" id="k2-bars"></div>
  </div>

  <div class="k2-controls">
    <div class="k2-temp-block">
      <div class="k2-temp-label-col">
        <div class="k2-temp-value" id="k2-temp-value">1.00</div>
        <div class="k2-temp-desc" id="k2-temp-desc">distribuição natural</div>
      </div>
      <div class="k2-temp-slider-row">
        <div class="k2-temp-slider-label">
          <span>0.00 · determinístico</span>
          <span>aleatório · 2.00</span>
        </div>
        <input type="range" class="k2-temp-slider" id="k2-temp-slider"
               min="0" max="2" step="0.01" value="1.0">
      </div>
    </div>
  </div>

  <div class="k2-button-bar">
    <span data-lab-info-ctl></span>
    <span class="k2-fs-slot" data-lab-fs-ctl></span>
    <button class="k2-btn k2-btn-toggle" id="k2-sobreajuste" aria-pressed="true"
            title="Sobreajuste: o modelo decorou a frase 'O rato roeu...' e sempre escolhe a palavra mais provável. Desligue para ver uma distribuição mais aberta com 'Eu gosto de...'">Sobreajuste</button>
    <button class="k2-btn k2-btn-reset" id="k2-reset" title="Voltar ao prompt inicial">Reiniciar</button>
    <button class="k2-btn k2-btn-sample" id="k2-sample">Selecionar</button>
  </div>

  <!-- Theory kept off the stage by the app-fit rule; surfaced by the shared
       "Entenda" button (lab-info.js). -->
  <template data-lab-info data-lab-info-title="Temperatura: do previsível ao criativo">
    <p>A cada palavra, o modelo não escolhe uma “certa”. Ele calcula a <strong>probabilidade</strong> de várias palavras seguintes e <strong>sorteia</strong> entre elas.</p>
    <p>A <strong>temperatura</strong> regula esse sorteio. <strong>Baixa</strong> (perto de 0): ele quase sempre pega a mais provável, respostas previsíveis e repetíveis. <strong>Alta</strong> (perto de 2): achata as probabilidades, respostas variadas e criativas, mas mais sujeitas a erro.</p>
    <p>Não existe temperatura “certa”: para uma <strong>minuta jurídica</strong> você quer baixa (consistente e fiel ao texto); para <strong>gerar ideias</strong>, mais alta. A mesma pergunta dá respostas diferentes só mudando esse ajuste.</p>
  </template>

  <script>
    (function() {
      // ── Scenarios: two parallel demos.
      //   overfit = true  → "O rato roeu a..." with peaked logits + argmax sample
      //                     (the model decorou and always emits the saying).
      //   overfit = false → "Eu gosto de..." with flat logits + weighted sample
      //                     (no overfitting, so distribution is broad and
      //                     temperature actually shapes the random choice).
      // Each entry holds the prompt prefix + the 12 logits for the next slot.
      const SCENARIOS = {
        overfit: {
          base: 'O rato roeu a',
          steps: [
            {
              prefix: 'O rato roeu a',
              logits: [
                ['roupa', 5.2], ['casa', 2.1], ['parede', 1.9], ['mesa', 1.6],
                ['rolha', 1.4], ['fruta', 1.2], ['queijo', 1.1], ['madeira', 0.9],
                ['porta', 0.7], ['corda', 0.5], ['vela', 0.3], ['capa', 0.1]
              ]
            },
            {
              prefix: 'O rato roeu a roupa',
              logits: [
                ['do', 6.0], ['.', 4.5], ['e', 2.0], [',', 1.8],
                ['no', 1.5], ['que', 1.4], ['com', 1.3], ['da', 1.0],
                ['em', 0.8], ['então', 0.6], ['para', 0.5], ['mas', 0.3]
              ]
            },
            {
              prefix: 'O rato roeu a roupa do',
              logits: [
                ['rei', 5.5], ['padre', 2.5], ['soldado', 2.2], ['pai', 1.8],
                ['juiz', 1.6], ['nobre', 1.4], ['príncipe', 1.2], ['conde', 1.0],
                ['duque', 0.8], ['bispo', 0.6], ['avô', 0.4], ['mestre', 0.2]
              ]
            },
            {
              prefix: 'O rato roeu a roupa do rei',
              logits: [
                ['de', 6.2], ['da', 1.8], [',', 1.2], ['do', 1.0],
                ['com', 0.7], ['e', 0.6], ['na', 0.6], ['que', 0.5],
                ['.', 0.4], ['em', 0.4], ['mas', 0.3], ['sem', 0.2]
              ]
            },
            {
              prefix: 'O rato roeu a roupa do rei de',
              logits: [
                ['Roma', 5.8], ['França', 2.2], ['Portugal', 1.9], ['Espanha', 1.5],
                ['Veneza', 1.2], ['Israel', 1.0], ['Roma.', 1.5], ['Roma!', 1.0],
                ['Aragão', 0.7], ['Castela', 0.6], ['Sevilha', 0.4], ['ouro', 0.3]
              ]
            }
          ]
        },
        normal: {
          base: 'Eu gosto de',
          // 2-step path: NOUN + ENDER. Every step-0 × step-1 pair is a
          // coherent BR-Portuguese sentence (144 combinations) so random
          // sampling can't produce nonsense. The distribution at each step
          // is visibly flatter than overfit (spread ~1.0 vs ~5.0) so the
          // pedagogical contrast holds. Asymmetry with overfit's 5-step
          // "rato" chain is the point: memorized = long deterministic,
          // non-memorized = short uncertain.
          steps: [
            {
              prefix: 'Eu gosto de',
              logits: [
                ['música', 2.8], ['café', 2.7], ['cinema', 2.6], ['filmes', 2.5],
                ['festa', 2.5], ['praia', 2.4], ['livros', 2.4], ['arte', 2.3],
                ['churrasco', 2.2], ['samba', 2.1], ['viagem', 2.0], ['silêncio', 1.9]
              ]
            },
            {
              prefix: 'Eu gosto de _',
              logits: [
                ['demais', 2.8], ['muito', 2.7], ['também', 2.6], ['sempre', 2.5],
                ['bastante', 2.4], ['mesmo', 2.3], ['hoje', 2.2], ['agora', 2.1],
                ['todo dia', 2.0], ['de noite', 1.9], ['no Brasil', 1.7], ['no verão', 1.5]
              ]
            }
          ]
        }
      };
      function scenario() { return SCENARIOS[overfit ? 'overfit' : 'normal']; }
      function steps()    { return scenario().steps; }

      // ── State ─────────────────────────────────────────────
      let stepIdx = 0;             // 0..4; 5 = complete
      let temperature = 1.0;
      let sampledTokens = [];      // tokens chosen so far, in order
      let isSampling = false;
      // Sobreajuste (overfit) mode is the default: the model always picks
      // the argmax regardless of T, so the demo always produces the saying
      // "O rato roeu a roupa do rei de Roma". Toggling off lets temperature
      // actually drive sampling and the sentence varies.
      let overfit = true;

      // ── DOM refs ─────────────────────────────────────────
      const promptEl       = document.getElementById('k2-prompt');
      const barsEl         = document.getElementById('k2-bars');
      const tempValEl      = document.getElementById('k2-temp-value');
      const tempDescEl     = document.getElementById('k2-temp-desc');
      const sliderEl       = document.getElementById('k2-temp-slider');
      const sampleBtn      = document.getElementById('k2-sample');
      const resetBtn       = document.getElementById('k2-reset');
      const sobreajusteBtn = document.getElementById('k2-sobreajuste');

      // ── Math ─────────────────────────────────────────────
      function softmax(logits, T) {
        const Tsafe = Math.max(T, 0.01);
        // At T < 0.05, snap to argmax (deterministic greedy) per spec.
        if (Tsafe < 0.05) {
          const argmax = logits.reduce((best, l, i) => l > logits[best] ? i : best, 0);
          return logits.map((_, i) => i === argmax ? 1 : 0);
        }
        const scaled = logits.map(l => l / Tsafe);
        const maxL = Math.max(...scaled);   // for numerical stability
        const exps = scaled.map(l => Math.exp(l - maxL));
        const sum = exps.reduce((a, b) => a + b, 0);
        return exps.map(e => e / sum);
      }
      function weightedSample(probs) {
        const r = Math.random();
        let acc = 0;
        for (let i = 0; i < probs.length; i++) {
          acc += probs[i];
          if (r <= acc) return i;
        }
        return probs.length - 1;
      }
      function tempDescription(T) {
        if (T < 0.05) return 'determinístico';
        if (T < 0.3)  return 'quase determinístico';
        if (T < 0.7)  return 'mais focado';
        if (T < 1.2)  return 'distribuição natural';
        if (T < 1.6)  return 'mais criativo';
        return 'muito aleatório';
      }

      // ── Render prompt ────────────────────────────────────
      function renderPrompt() {
        const base = scenario().base;
        const parts = [escapeHtml(base)];
        sampledTokens.forEach(tok => {
          parts.push('<span class="k2-prompt-word">' + escapeHtml(tok) + '</span>');
        });
        const isComplete = stepIdx >= steps().length;
        if (!isComplete) {
          parts.push('<span class="k2-blank" id="k2-blank">&nbsp;&nbsp;&nbsp;</span>');
        } else {
          parts.push('<span class="k2-final-badge">✓ Frase completa</span>');
        }
        // Join with spaces but skip the space before standalone punctuation.
        const html = parts.reduce((acc, part, i) => {
          if (i === 0) return part;
          // Heuristic: if the rendered word starts with a punctuation char,
          // omit the leading space so "rolha." reads naturally.
          const m = part.match(/^<span[^>]*>(.)/);
          const firstChar = m ? m[1] : '';
          const isPunct = firstChar === '.' || firstChar === ',' || firstChar === '!';
          return acc + (isPunct ? '' : ' ') + part;
        }, '');
        promptEl.innerHTML = html;
      }
      function escapeHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      // ── Render bars ──────────────────────────────────────
      function renderBars(animate) {
        const isComplete = stepIdx >= steps().length;
        if (isComplete) {
          barsEl.innerHTML = '<div style="text-align:center; color:var(--text-dim); ' +
            'font-style:italic; padding:1.5rem; opacity:0.6;">Sentença finalizada. ' +
            'Clique em Reiniciar para começar de novo.</div>';
          return;
        }
        const state = steps()[stepIdx];
        const logits = state.logits.map(l => l[1]);
        const probs = softmax(logits, temperature);
        // Argmax stays as the visual "top" no matter where T pushes the
        // distribution. We deliberately do NOT reorder bars when T changes,
        // since shuffling 12 rows on each slider tick is jarring and obscures
        // which bar is the same token across reads. Bars stay in their fixed
        // logit-rank order from the state definition.
        const argmaxIdx = probs.reduce((best, p, i) => p > probs[best] ? i : best, 0);

        const scenarioKey = overfit ? 'overfit' : 'normal';
        const stateKey = scenarioKey + ':' + stepIdx;
        const needsRebuild = barsEl.dataset.stateIdx !== stateKey;
        if (needsRebuild) {
          barsEl.dataset.stateIdx = stateKey;
          barsEl.innerHTML = state.logits.map((l, i) => {
            const tok = escapeHtml(l[0]);
            return (
              '<div class="k2-bar" data-i="' + i + '">' +
                '<div class="k2-bar-token">' + tok + '</div>' +
                '<div class="k2-bar-track"><div class="k2-bar-fill"></div></div>' +
                '<div class="k2-bar-pct"></div>' +
              '</div>'
            );
          }).join('');
        }
        // Apply widths, percentages, and argmax highlight.
        const bars = barsEl.querySelectorAll('.k2-bar');
        bars.forEach(barEl => {
          const i = Number(barEl.dataset.i);
          const p = probs[i];
          const fill = barEl.querySelector('.k2-bar-fill');
          const pctEl = barEl.querySelector('.k2-bar-pct');
          fill.style.width = (p * 100).toFixed(2) + '%';
          pctEl.textContent = (p * 100).toFixed(p >= 0.1 ? 1 : 2) + '%';
          if (i === argmaxIdx) barEl.classList.add('k2-bar--top');
          else barEl.classList.remove('k2-bar--top');
        });
      }

      // ── Temperature wiring ───────────────────────────────
      function setTemperature(T) {
        temperature = T;
        tempValEl.textContent = T.toFixed(2);
        tempDescEl.textContent = tempDescription(T);
        renderBars();
      }
      sliderEl.addEventListener('input', e => {
        setTemperature(parseFloat(e.target.value));
      });

      // ── Sample button: pick a token, animate it into the blank ───
      function doSample() {
        if (isSampling) return;
        if (stepIdx >= steps().length) return;
        isSampling = true;
        sampleBtn.disabled = true;

        const state = steps()[stepIdx];
        const logits = state.logits.map(l => l[1]);
        // Overfit (sobreajuste) mode pins the choice to the argmax regardless
        // of T, so the demo lands on the saying every time. Without overfit,
        // the sample follows the temperature-shaped distribution.
        let chosenIdx;
        if (overfit) {
          chosenIdx = logits.reduce((best, l, i) => l > logits[best] ? i : best, 0);
        } else {
          const probs = softmax(logits, temperature);
          chosenIdx = weightedSample(probs);
        }
        const chosenToken = state.logits[chosenIdx][0];

        // Pulse the chosen bar
        const bars = barsEl.querySelectorAll('.k2-bar');
        const chosenBar = Array.from(bars).find(b => Number(b.dataset.i) === chosenIdx);
        if (chosenBar) {
          chosenBar.classList.add('k2-bar--sampled');
          setTimeout(() => chosenBar.classList.remove('k2-bar--sampled'), 700);
        }

        // After pulse, fly the token text into the blank
        setTimeout(() => {
          const sourceEl = chosenBar ? chosenBar.querySelector('.k2-bar-token') : null;
          const blankEl  = document.getElementById('k2-blank');
          if (!sourceEl || !blankEl) {
            finalizeSample(chosenToken);
            return;
          }
          const srcRect  = sourceEl.getBoundingClientRect();
          const dstRect  = blankEl.getBoundingClientRect();
          const fly = document.createElement('span');
          fly.className = 'k2-fly';
          fly.textContent = chosenToken;
          fly.style.left = srcRect.left + 'px';
          fly.style.top  = srcRect.top + 'px';
          fly.style.fontSize = window.getComputedStyle(sourceEl).fontSize;
          document.body.appendChild(fly);
          // Force reflow before applying the transition target.
          void fly.offsetWidth;
          const dx = dstRect.left - srcRect.left;
          const dy = dstRect.top - srcRect.top;
          const promptFontSize = window.getComputedStyle(promptEl).fontSize;
          fly.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';
          fly.style.fontSize = promptFontSize;
          fly.style.opacity = '0.0';
          setTimeout(() => {
            if (fly.parentNode) fly.parentNode.removeChild(fly);
            finalizeSample(chosenToken);
          }, 720);
        }, 420);
      }
      function finalizeSample(tok) {
        sampledTokens.push(tok);
        stepIdx += 1;
        renderPrompt();
        renderBars();
        isSampling = false;
        sampleBtn.disabled = stepIdx >= steps().length;
      }

      sampleBtn.addEventListener('click', doSample);

      // ── Sobreajuste toggle ───────────────────────────────
      // Flipping swaps the active scenario (rato/overfit ↔ eu gosto/normal),
      // so the prefix and logits change. A reset is required so the prompt
      // doesn't show a mixed sentence (e.g. "Eu gosto de roupa do rei...").
      sobreajusteBtn.addEventListener('click', () => {
        overfit = !overfit;
        sobreajusteBtn.setAttribute('aria-pressed', String(overfit));
        reset();
      });

      // ── Reset ────────────────────────────────────────────
      function reset() {
        stepIdx = 0;
        sampledTokens = [];
        isSampling = false;
        sampleBtn.disabled = false;
        renderPrompt();
        renderBars();
      }
      resetBtn.addEventListener('click', reset);

      // ── Theme sync ───────────────────────────────────────
      window.addEventListener('storage', e => {
        if (e.key !== 'bs_theme') return;
        const t = e.newValue;
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        }
      });

      // ── Init ─────────────────────────────────────────────
      setTemperature(1.0);
      renderPrompt();
      renderBars();
    })();
  </script>
</section>
</body>
</html>
