<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Aposta na Citação · PensoLabs</title>
<link rel="stylesheet" href="../../css/theme.css?v=1.3">
<link rel="stylesheet" href="../css/labs.css?v=1.6">
<script src="../js/lab-header.js?v=1.0" defer></script>
<script src="../js/lab-controls.js?v=1.0" defer></script>
<script src="../js/lab-info.js?v=1.0" defer></script>
<script>
  (function() {
    try {
      var t = localStorage.getItem('bs_theme');
      if (t === 'dark' || t === 'light') {
        document.documentElement.setAttribute('data-theme', t);
      }
    } catch (e) {}
  })();
</script>
</head>
<body class="lab-page">
<section class="k20-panel">
  <style>
    .k20-panel {
      --bg: var(--lab-bg);
      --text: var(--lab-text);
      --text-dim: var(--lab-text-dim);
      --surface: var(--lab-surface);
      --border: var(--lab-border);
      --focal: var(--lab-focal);
      --focal-rgb: var(--lab-focal-rgb);
      --good: var(--lab-good);
      --bad: var(--lab-bad);
      --bad-rgb: var(--lab-bad-rgb);
      --font-display: var(--lab-font-display);
      --font-mono: var(--lab-font-mono);

      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 0.6rem;
      padding: 1rem 2rem 0.7rem;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-display);
    }

    .k20-meter {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.1rem;
    }
    .k20-meter-label {
      font-size: var(--lab-fs-ui);
      color: var(--text-dim);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .k20-meter-value {
      font-family: var(--font-mono);
      font-size: var(--lab-fs-audience);
      font-weight: 700;
      color: var(--focal);
      line-height: 1;
    }

    .k20-cards {
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.9rem;
    }
    .k20-progress {
      font-size: var(--lab-fs-ui);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
      text-align: center;
    }
    .k20-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 1.1rem 1.3rem;
      transition: border-color 220ms, background 220ms;
    }
    .k20-card-text {
      font-family: var(--font-mono);
      font-size: var(--lab-fs-doc);
      line-height: 1.4;
      color: var(--text);
      margin: 0 0 0.9rem;
      text-align: justify;
    }
    .k20-final-note {
      text-align: center;
      font-size: var(--lab-fs-body);
      font-weight: 700;
      color: var(--text);
      margin-top: 0.6rem;
    }
    .k20-card-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .k20-guess-btn {
      font-family: var(--font-display);
      font-size: var(--lab-fs-btn);
      font-weight: 600;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      cursor: pointer;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      transition: border-color 180ms, color 180ms;
    }
    .k20-guess-btn:hover:not(:disabled) { border-color: var(--focal); color: var(--focal); }
    .k20-guess-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .k20-guess-btn--picked {
      border-color: var(--focal);
      background: color-mix(in srgb, var(--focal) 16%, transparent);
      color: var(--focal);
      opacity: 1;
    }
    .k20-verdict {
      display: none;
      align-items: baseline;
      gap: 0.5rem;
      font-size: var(--lab-fs-body);
      color: var(--text-dim);
      line-height: 1.4;
    }
    .k20-verdict-mark {
      font-family: var(--font-mono);
      font-weight: 800;
      font-size: var(--lab-fs-answer);
      flex-shrink: 0;
    }
    .k20-verdict-note { text-align: justify; }
    .k20-card--revealed .k20-verdict { display: flex; }
    .k20-card--revealed .k20-card-row { display: none; }
    .k20-card--correct { border-color: var(--good); }
    .k20-card--correct .k20-verdict-mark { color: var(--good); }
    .k20-card--wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 6%, var(--surface)); }
    .k20-card--wrong .k20-verdict-mark { color: var(--bad); }

    .k20-button-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.45rem;
      padding: 0 0.2rem;
      flex-wrap: wrap;
    }
    .k20-fs-slot { margin-right: auto; }
    .k20-btn {
      font-family: var(--font-display);
      font-size: var(--lab-fs-btn);
      font-weight: 600;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      cursor: pointer;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      transition: border-color 180ms, color 180ms, transform 150ms;
    }
    .k20-btn:hover:not(:disabled) { border-color: var(--focal); color: var(--focal); transform: translateY(-1px); }
    .k20-btn-action {
      border-color: var(--focal);
      background: color-mix(in srgb, var(--focal) 16%, transparent);
      color: var(--focal);
    }
    .k20-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    @media (max-width: 700px) {
      .k20-panel { padding: 0.6rem 0.9rem 0.6rem; gap: 0.5rem; }
      .k20-card { padding: 0.7rem 0.85rem; }
      .k20-button-bar { gap: 0.4rem; padding: 0; }
      .k20-btn { padding: 0.6rem 0.5rem; flex: 1 1 calc(50% - 0.2rem); min-height: 44px; text-align: center; }
      .k20-fs-slot { margin-right: 0; flex: 1 0 100%; justify-content: center; }
      .k20-button-bar > [data-lab-info-ctl] { order: -1; display: flex; flex: 1 1 100%; }
      .k20-button-bar > [data-lab-info-ctl] .lab-info-btn { width: 100%; justify-content: center; }
      .k20-guess-btn { min-height: 44px; flex: 1 1 auto; }
    }
    @media (max-height: 500px) and (orientation: landscape) {
      .k20-panel { padding: 0.4rem 1rem 0.35rem; gap: 0.35rem; }
      .k20-btn { min-height: 32px; }
    }
  </style>

  <div class="lab-header" data-lab-title="Aposta na Citação" data-lab-subtitle="Soa correto não é prova de que é real">
    <div class="k20-meter">
      <span class="k20-meter-label">Acertos</span>
      <span class="k20-meter-value" id="k20-score">—</span>
    </div>
  </div>

  <div class="k20-cards">
    <p class="k20-progress" id="k20-progress"></p>
    <div class="k20-card" id="k20-card"></div>
  </div>

  <div class="k20-button-bar">
    <span data-lab-info-ctl></span>
    <span class="k20-fs-slot" data-lab-fs-ctl></span>
    <button class="k20-btn k20-btn-action" id="k20-next" disabled>Próxima</button>
    <button class="k20-btn" id="k20-reset">Reiniciar</button>
  </div>

  <template data-lab-info data-lab-info-title="Por que isso engana até quem conhece a área?">
    <p>Um modelo de linguagem não distingue "sei essa informação de verdade" de "essa forma de frase é comum, vou completar assim". As duas coisas produzem o mesmo tom seguro, com número de artigo, súmula e linguagem jurídica corretos.</p>
    <p>A única forma de saber se uma citação é real é <strong>verificar na fonte oficial</strong>, nunca pela fluência do texto. É exatamente essa a regra do CORE (Regras: "baseie-se exclusivamente na base de conhecimento, não presuma, não infira, não invente") e o motivo de todo protocolo de citação exigir conferência palavra por palavra antes de qualquer peça sair.</p>
    <p>As citações "inventadas" aqui foram escritas para soar plausíveis, mas contêm um erro de fundo (uma regra que contraria o que a lei ou a jurisprudência realmente dizem), não um número aleatório. É assim que uma alucinação real costuma aparecer: coerente na forma, errada no conteúdo.</p>
  </template>

  <script>
    (function () {
      // Real citations verified verbatim (WebFetch/WebSearch against
      // planalto.gov.br and secondary sources quoting the official text)
      // before this file shipped, 2026-07-30. Fabricated ones reuse a REAL
      // citation number attached to invented text, wrong at the content
      // level (category mismatch, or an inverted holding), never an
      // implausible number — same convention as k9/k12.
      var ITEMS = [
        {
          text: 'Art. 5º, LXXVIII da Constituição Federal: "A todos, no âmbito judicial e administrativo, são assegurados a razoável duração do processo e os meios que garantam a celeridade de sua tramitação."',
          real: true,
          note: 'Real. Inciso incluído pela EC 45/2004, garante prazo razoável e meios que acelerem o processo, judicial ou administrativo.'
        },
        {
          text: 'Súmula 43 do STJ: "Incide correção monetária sobre dívida por ato ilícito a partir da data do efetivo prejuízo."',
          real: true,
          note: 'Real. Fixa o termo inicial da correção monetária numa dívida por ato ilícito: a data do prejuízo, não a da sentença nem a da citação.'
        },
        {
          text: 'Art. 940 do Código Civil: "Aquele que demandar por dívida já paga, no todo ou em parte, sem ressalvar as quantias recebidas ou pedir mais do que for devido, ficará obrigado a pagar ao devedor, no primeiro caso, o dobro do que houver cobrado."',
          real: true,
          note: 'Real. Pune quem cobra judicialmente dívida já paga: paga em dobro o que cobrou indevidamente, mas exige prova de má-fé do credor.'
        },
        {
          text: 'Art. 142 da Lei nº 8.112/90: "A ação disciplinar prescreve em 5 (cinco) anos, qualquer que seja a gravidade da infração, inclusive quanto à pena de advertência."',
          real: false,
          note: 'Inventada. O art. 142 de verdade tem prazo diferente por gravidade: 180 dias pra advertência, 2 anos pra suspensão, só demissão (e penas equivalentes) prescreve em 5 anos. Aplicar 5 anos pra qualquer infração ignora essa gradação.'
        },
        {
          text: 'Art. 27, § 1º do Decreto-Lei nº 3.365/41: "Os honorários advocatícios, na desapropriação, serão fixados entre 10% (dez por cento) e 20% (vinte por cento) sobre o valor da diferença, observados os critérios gerais do art. 85 do CPC."',
          real: false,
          note: 'Inventada. A Lei de Desapropriação tem faixa própria, mais estreita que a regra geral do CPC: honorários entre 0,5% e 5% sobre a diferença, não os 10% a 20% do art. 85 do CPC que valem pra ações em geral. É a regra especial afastando a geral, ao contrário do que a citação diz.'
        }
      ];

      function shuffle(arr) {
        var out = arr.slice();
        for (var i = out.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = out[i]; out[i] = out[j]; out[j] = tmp;
        }
        return out;
      }

      var progressEl = document.getElementById('k20-progress');
      var cardEl = document.getElementById('k20-card');
      var scoreEl = document.getElementById('k20-score');
      var nextBtn = document.getElementById('k20-next');
      var resetBtn = document.getElementById('k20-reset');
      var idx = 0;
      var deck = shuffle(ITEMS);
      var guesses = new Array(deck.length).fill(null);
      var correct = 0;

      function renderCard() {
        var item = deck[idx];
        progressEl.textContent = 'Citação ' + (idx + 1) + ' de ' + deck.length;
        cardEl.className = 'k20-card';
        cardEl.innerHTML =
          '<p class="k20-card-text">' + item.text + '</p>' +
          '<div class="k20-card-row">' +
            '<button type="button" class="k20-guess-btn" data-guess="true">Parece real</button>' +
            '<button type="button" class="k20-guess-btn" data-guess="false">Parece inventada</button>' +
          '</div>' +
          '<div class="k20-verdict">' +
            '<span class="k20-verdict-mark"></span>' +
            '<span class="k20-verdict-note"></span>' +
          '</div>';

        var btns = cardEl.querySelectorAll('.k20-guess-btn');
        btns.forEach(function (btn) {
          btn.addEventListener('click', function () { guess(btn, btns); });
        });
        nextBtn.disabled = true;
        nextBtn.textContent = idx === deck.length - 1 ? 'Ver placar final' : 'Próxima';
      }

      function guess(btn, btns) {
        var item = deck[idx];
        guesses[idx] = btn.dataset.guess === 'true';
        var wasCorrect = guesses[idx] === item.real;
        if (wasCorrect) correct++;

        btns.forEach(function (b) {
          b.classList.toggle('k20-guess-btn--picked', b === btn);
          b.disabled = true;
        });
        cardEl.classList.add('k20-card--revealed', wasCorrect ? 'k20-card--correct' : 'k20-card--wrong');
        cardEl.querySelector('.k20-verdict-mark').textContent = item.real ? '✓ REAL' : '✗ INVENTADA';
        cardEl.querySelector('.k20-verdict-note').textContent = item.note;
        scoreEl.textContent = correct + '/' + (idx + 1);
        nextBtn.disabled = false;
      }

      nextBtn.addEventListener('click', function () {
        if (idx >= deck.length - 1) {
          progressEl.textContent = 'Fim';
          cardEl.insertAdjacentHTML('beforeend',
            '<p class="k20-final-note">Placar final: ' + correct + '/' + deck.length + '</p>');
          nextBtn.disabled = true;
          return;
        }
        idx++;
        renderCard();
      });

      resetBtn.addEventListener('click', function () {
        idx = 0;
        correct = 0;
        // Reshuffled on every reset, not just on page load, so replaying
        // the demo doesn't land on the same "always the real ones first"
        // order the audience could start to memorize.
        deck = shuffle(ITEMS);
        guesses = new Array(deck.length).fill(null);
        scoreEl.textContent = '—';
        renderCard();
      });

      renderCard();

      window.addEventListener('storage', function (e) {
        if (e.key !== 'bs_theme') return;
        var t = e.newValue;
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        }
      });
    })();
  </script>
</section>
</body>
</html>
