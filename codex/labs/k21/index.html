<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Modelo e Esforço · PensoLabs</title>
<link rel="stylesheet" href="../../css/theme.css?v=1.3">
<link rel="stylesheet" href="../css/labs.css?v=1.5">
<script src="../js/lab-header.js?v=1.0" defer></script>
<script src="../js/lab-controls.js?v=1.0" defer></script>
<script src="../js/lab-info.js?v=1.0" defer></script>
<script>
  (function() {
    try {
      var t = localStorage.getItem('bs_theme');
      if (t === 'dark' || t === 'light') {
        document.documentElement.setAttribute('data-theme', t);
      }
    } catch (e) {}
  })();
</script>
</head>
<body class="lab-page">
<section class="k21-panel">
  <style>
    .k21-panel {
      --bg: var(--lab-bg);
      --text: var(--lab-text);
      --text-dim: var(--lab-text-dim);
      --surface: var(--lab-surface);
      --border: var(--lab-border);
      --focal: var(--lab-focal);
      --focal-rgb: var(--lab-focal-rgb);
      --warm: var(--lab-context-a);
      --warm-rgb: var(--lab-context-a-rgb);
      --good: var(--lab-good);
      --bad: var(--lab-bad);
      --bad-rgb: var(--lab-bad-rgb);
      --font-display: var(--lab-font-display);
      --font-mono: var(--lab-font-mono);

      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr) auto;
      gap: 0.55rem;
      padding: 1rem 2rem 0.7rem;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-display);
    }

    .k21-scenarios {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
    }
    .k21-scenario-btn {
      font-family: var(--font-display);
      font-size: var(--lab-fs-ui);
      font-weight: 600;
      padding: 0.5rem 0.6rem;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-dim);
      cursor: pointer;
      text-align: center;
      line-height: 1.25;
      transition: border-color 180ms, color 180ms;
    }
    .k21-scenario-btn--on {
      border-color: var(--focal);
      background: color-mix(in srgb, var(--focal) 14%, var(--surface));
      color: var(--focal);
    }

    .k21-selectors {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .k21-axis-label {
      font-size: var(--lab-fs-ui);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin: 0 0 0.3rem;
    }
    .k21-pills {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.4rem;
    }
    .k21-pill {
      font-family: var(--font-display);
      font-size: var(--lab-fs-body);
      font-weight: 700;
      padding: 0.55rem 0.4rem;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-dim);
      cursor: pointer;
      text-align: center;
      transition: border-color 180ms, color 180ms, background 180ms;
    }
    .k21-pill--on.k21-pill--modelo {
      border-color: var(--focal);
      background: color-mix(in srgb, var(--focal) 16%, var(--surface));
      color: var(--focal);
    }
    .k21-pill--on.k21-pill--esforco {
      border-color: var(--warm);
      background: color-mix(in srgb, var(--warm) 16%, var(--surface));
      color: var(--warm);
    }

    .k21-verdict {
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.7rem;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 1.1rem 1.3rem;
      transition: border-color 220ms;
    }
    .k21-verdict--ok { border-color: var(--good); }
    .k21-verdict--warn { border-color: var(--warm); }
    .k21-verdict--bad { border-color: var(--bad); }
    .k21-verdict-mark {
      font-family: var(--font-mono);
      font-weight: 800;
      font-size: var(--lab-fs-audience);
      line-height: 1;
    }
    .k21-verdict--ok .k21-verdict-mark { color: var(--good); }
    .k21-verdict--warn .k21-verdict-mark { color: var(--warm); }
    .k21-verdict--bad .k21-verdict-mark { color: var(--bad); }
    .k21-verdict-text {
      font-size: var(--lab-fs-doc);
      line-height: 1.45;
      color: var(--text);
      margin: 0;
    }
    .k21-readout {
      display: flex;
      gap: 1.4rem;
      padding-top: 0.5rem;
      border-top: 1px dashed var(--border);
    }
    .k21-readout-item {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }
    .k21-readout-label {
      font-size: var(--lab-fs-ui);
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .k21-readout-val {
      font-family: var(--font-mono);
      font-size: var(--lab-fs-body);
      font-weight: 700;
      color: var(--text);
    }

    .k21-button-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.45rem;
      padding: 0 0.2rem;
      flex-wrap: wrap;
    }
    .k21-fs-slot { margin-right: auto; }
    .k21-btn {
      font-family: var(--font-display);
      font-size: var(--lab-fs-btn);
      font-weight: 600;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      cursor: pointer;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      transition: border-color 180ms, color 180ms, transform 150ms;
    }
    .k21-btn:hover { border-color: var(--focal); color: var(--focal); transform: translateY(-1px); }

    @media (max-width: 700px) {
      .k21-panel { padding: 0.6rem 0.9rem 0.6rem; gap: 0.45rem; }
      .k21-scenario-btn { font-size: 12px; padding: 0.45rem 0.4rem; }
      .k21-selectors { grid-template-columns: 1fr; gap: 0.5rem; }
      .k21-verdict { padding: 0.8rem 0.9rem; }
      .k21-readout { gap: 1rem; }
      .k21-button-bar { gap: 0.4rem; padding: 0; }
      .k21-btn { padding: 0.6rem 0.5rem; flex: 1 1 calc(50% - 0.2rem); min-height: 44px; text-align: center; }
      .k21-fs-slot { margin-right: 0; flex: 1 0 100%; justify-content: center; }
      .k21-button-bar > [data-lab-info-ctl] { order: -1; display: flex; flex: 1 1 100%; }
      .k21-button-bar > [data-lab-info-ctl] .lab-info-btn { width: 100%; justify-content: center; }
    }
    @media (max-height: 500px) and (orientation: landscape) {
      .k21-panel { padding: 0.4rem 1rem 0.35rem; gap: 0.3rem; }
      .k21-btn { min-height: 32px; }
    }
  </style>

  <div class="lab-header" data-lab-title="Modelo e Esforço" data-lab-subtitle="Não soube ou não se esforçou?"></div>

  <div class="k21-scenarios" id="k21-scenarios"></div>

  <div class="k21-selectors">
    <div>
      <p class="k21-axis-label">Modelo</p>
      <div class="k21-pills" id="k21-modelo"></div>
    </div>
    <div>
      <p class="k21-axis-label">Esforço</p>
      <div class="k21-pills" id="k21-esforco"></div>
    </div>
  </div>

  <div class="k21-verdict" id="k21-verdict">
    <span class="k21-verdict-mark" id="k21-verdict-mark"></span>
    <p class="k21-verdict-text" id="k21-verdict-text"></p>
    <div class="k21-readout">
      <div class="k21-readout-item"><span class="k21-readout-label">Custo</span><span class="k21-readout-val" id="k21-custo"></span></div>
      <div class="k21-readout-item"><span class="k21-readout-label">Tempo</span><span class="k21-readout-val" id="k21-tempo"></span></div>
    </div>
  </div>

  <div class="k21-button-bar">
    <span data-lab-info-ctl></span>
    <span class="k21-fs-slot" data-lab-fs-ctl></span>
    <button class="k21-btn" id="k21-reset">Reiniciar</button>
  </div>

  <template data-lab-info data-lab-info-title="Não soube ou não se esforçou?">
    <p>Toda ferramenta de chat tem dois controles independentes: o <strong>modelo</strong> (o quanto ele sabe e consegue raciocinar, Haiku/Sonnet/Opus na Claude, Flash/Pro no Gemini, e por aí vai) e o <strong>esforço</strong> (o quanto ele "pensa" antes de responder, dentro do mesmo modelo).</p>
    <p>Quando a IA erra, a pergunta certa é: ela <strong>não sabia</strong> (precisa de um modelo maior, mais capaz) ou <strong>não se esforçou</strong> (o mesmo modelo, com mais tempo de raciocínio, teria acertado)? Confundir os dois desperdiça dinheiro: trocar de modelo quando o problema era esforço, ou subir o esforço quando o problema era capacidade.</p>
    <p>Regra prática: modelo maior para o problema difícil, novo ou de decisão; modelo menor para rotina e volume. Esforço sobe quando a tarefa tem etapas fáceis de pular (prazo, cálculo, conferência), não quando falta conhecimento.</p>
  </template>

  <script>
    (function () {
      var MODELOS = ['Pequeno', 'Médio', 'Grande'];
      var ESFORCOS = ['Baixo', 'Médio', 'Alto'];

      // verdict(modeloIdx, esforcoIdx) -> { state: 'ok'|'warn'|'bad', text }
      var SCENARIOS = [
        {
          label: 'Resumir 200 despachos parecidos',
          verdict: function (m, e) {
            if (m === 2 || e === 2) {
              return { state: 'warn', text: 'Certo, mas caro e lento à toa. É uma tarefa simples e repetitiva, não precisa de modelo grande nem de esforço alto.' };
            }
            return { state: 'ok', text: 'Certo, rápido e barato. Ideal pra um volume grande de tarefa simples.' };
          }
        },
        {
          label: 'Prazo com feriado e suspensão',
          verdict: function (m, e) {
            if (e === 0) {
              return { state: 'bad', text: 'Errado. Pulou a conferência de feriado e suspensão, saiu confiante do mesmo jeito, o modelo maior não teria evitado isso sozinho.' };
            }
            return { state: 'ok', text: 'Certo. Parou pra checar feriado e suspensão antes de fechar a conta, mesmo num modelo menor. Aqui o problema era esforço, não capacidade.' };
          }
        },
        {
          label: 'Contradição entre laudo e petição',
          verdict: function (m, e) {
            if (m < 2) {
              return { state: 'bad', text: 'Errado. Por mais esforço que faça, esse modelo não tem capacidade pra cruzar as duas peças e notar a divergência sutil. Aqui o problema é o modelo, não o esforço.' };
            }
            return { state: 'ok', text: 'Certo. Capacidade suficiente pra cruzar laudo e petição e notar a contradição.' };
          }
        }
      ];

      var scenariosEl = document.getElementById('k21-scenarios');
      var modeloEl = document.getElementById('k21-modelo');
      var esforcoEl = document.getElementById('k21-esforco');
      var verdictEl = document.getElementById('k21-verdict');
      var markEl = document.getElementById('k21-verdict-mark');
      var textEl = document.getElementById('k21-verdict-text');
      var custoEl = document.getElementById('k21-custo');
      var tempoEl = document.getElementById('k21-tempo');
      var resetBtn = document.getElementById('k21-reset');

      var scenarioIdx = 0, modeloIdx = 1, esforcoIdx = 1;

      function buildPills(container, labels, cls, onPick) {
        container.innerHTML = '';
        labels.forEach(function (label, i) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'k21-pill ' + cls;
          btn.textContent = label;
          btn.addEventListener('click', function () { onPick(i); render(); });
          container.appendChild(btn);
        });
      }

      buildPills(modeloEl, MODELOS, 'k21-pill--modelo', function (i) { modeloIdx = i; });
      buildPills(esforcoEl, ESFORCOS, 'k21-pill--esforco', function (i) { esforcoIdx = i; });

      SCENARIOS.forEach(function (s, i) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'k21-scenario-btn';
        btn.textContent = s.label;
        btn.addEventListener('click', function () { scenarioIdx = i; render(); });
        scenariosEl.appendChild(btn);
      });

      var LEVEL_LABEL = ['Baixo', 'Médio', 'Alto'];

      function render() {
        Array.prototype.forEach.call(scenariosEl.children, function (btn, i) {
          btn.classList.toggle('k21-scenario-btn--on', i === scenarioIdx);
        });
        Array.prototype.forEach.call(modeloEl.children, function (btn, i) {
          btn.classList.toggle('k21-pill--on', i === modeloIdx);
        });
        Array.prototype.forEach.call(esforcoEl.children, function (btn, i) {
          btn.classList.toggle('k21-pill--on', i === esforcoIdx);
        });

        var v = SCENARIOS[scenarioIdx].verdict(modeloIdx, esforcoIdx);
        verdictEl.classList.remove('k21-verdict--ok', 'k21-verdict--warn', 'k21-verdict--bad');
        verdictEl.classList.add('k21-verdict--' + v.state);
        markEl.textContent = v.state === 'bad' ? '✗ ERRADO' : (v.state === 'warn' ? '✓ CERTO, MAS CARO' : '✓ CERTO');
        textEl.textContent = v.text;

        var level = modeloIdx + esforcoIdx; // 0..4
        var bucket = level <= 1 ? 0 : (level <= 2 ? 1 : 2);
        custoEl.textContent = LEVEL_LABEL[bucket];
        tempoEl.textContent = LEVEL_LABEL[bucket];
      }

      resetBtn.addEventListener('click', function () {
        scenarioIdx = 0; modeloIdx = 1; esforcoIdx = 1;
        render();
      });

      window.addEventListener('storage', function (e) {
        if (e.key !== 'bs_theme') return;
        var t = e.newValue;
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        }
      });

      render();
    })();
  </script>
</section>
</body>
</html>
