<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Três velocidades · PensoLabs</title>
<link rel="stylesheet" href="../../css/theme.css?v=1.3">
<link rel="stylesheet" href="../css/labs.css?v=1.4">
<script src="../js/lab-header.js?v=1.0" defer></script>
<script src="../js/lab-controls.js?v=1.0" defer></script>
<script src="../js/lab-info.js?v=1.0" defer></script>
<script src="../js/lab-tabs.js?v=1.0" defer></script>
<script>
  (function() {
    try {
      var t = localStorage.getItem('bs_theme');
      if (t === 'dark' || t === 'light') {
        document.documentElement.setAttribute('data-theme', t);
      }
    } catch (e) {}
  })();
</script>
</head>
<body class="lab-page">
<section class="k13-panel">
  <style>
    .k13-panel, .k13-panel * { box-sizing: border-box; }

    .k13-panel {
      --bg: var(--lab-bg);
      --text: var(--lab-text);
      --text-dim: var(--lab-text-dim);
      --text-muted: var(--lab-text-muted);
      --surface: var(--lab-surface);
      --border: var(--lab-border);
      --focal: var(--lab-focal);
      --focal-rgb: var(--lab-focal-rgb);
      --warm: var(--lab-context-a);
      --warm-rgb: var(--lab-context-a-rgb);
      --cool: var(--lab-context-b);
      --cool-rgb: var(--lab-context-b-rgb);
      --good: var(--lab-good);
      --bad: var(--lab-bad);
      --bad-rgb: var(--lab-bad-rgb);
      --gold: #b8860b;
      --font-display: var(--lab-font-display);
      --font-mono: var(--lab-font-mono);

      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      gap: 0.6rem;
      padding: 1rem 2rem 0.7rem;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-display);
    }
    [data-theme="dark"] .k13-panel { --gold: #facc15; }

    /* Scenario selector + question on one band */
    .k13-controls {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: stretch;
      gap: 0.7rem;
      min-height: 0;
    }
    .k13-scenarios {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      justify-content: center;
    }
    .k13-sc-label {
      font-family: var(--font-mono);
      font-size: var(--lab-fs-ui);
      color: var(--text-dim);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .k13-sc-row { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .k13-sc-btn {
      font-family: var(--font-display);
      font-size: var(--lab-fs-btn);
      font-weight: 600;
      padding: 0.45rem 1rem;
      border-radius: 999px;
      cursor: pointer;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      transition: background 160ms, color 160ms, border-color 160ms, transform 140ms;
    }
    .k13-sc-btn:hover { border-color: var(--cool); color: var(--cool); transform: translateY(-1px); }
    .k13-sc-btn.is-active {
      background: rgba(var(--cool-rgb), 0.16);
      border-color: var(--cool);
      color: var(--cool);
    }

    .k13-q {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 0.7rem 1.1rem;
      display: flex;
      align-items: center;
      min-width: 0;
    }
    .k13-q-inner {
      font-size: var(--lab-fs-body);
      line-height: 1.35;
      color: var(--text);
    }
    .k13-q .lbl {
      color: var(--text-dim);
      font-weight: 700;
      font-style: normal;
      margin-right: 0.4rem;
      letter-spacing: 0.02em;
    }
    .k13-q .qt { font-style: italic; }

    /* Three lanes -- data-lab-tabs turns this into one-panel-at-a-time on
       phone (lab-tabs.js); desktop keeps the 3-col grid untouched. */
    .k13-cols {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.8rem;
      min-height: 0;
    }
    .k13-col {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem 0.9rem;
      min-height: 0;
      overflow-y: auto;
      transition: border-color 380ms, box-shadow 380ms;
    }
    .k13-col.is-fit {
      border-color: var(--gold);
      box-shadow: 0 0 18px rgba(184,134,11,0.28);
    }
    [data-theme="dark"] .k13-col.is-fit { box-shadow: 0 0 18px rgba(250,204,21,0.24); }
    .k13-col-name {
      margin: 0;
      font-size: var(--lab-fs-audience);
      font-weight: 800;
      letter-spacing: 0.03em;
      line-height: 1.05;
    }
    .k13-col--trad .k13-col-name { color: var(--good); }
    .k13-col--rac  .k13-col-name { color: var(--cool); }
    .k13-col--ag   .k13-col-name { color: var(--warm); }
    .k13-col-sub {
      font-size: var(--lab-fs-ui);
      color: var(--text-dim);
      font-style: italic;
      margin-top: -0.2rem;
    }
    .k13-plan {
      background: rgba(var(--cool-rgb), 0.07);
      border-left: 2.5px solid var(--cool);
      border-radius: 0 6px 6px 0;
      padding: 0.45rem 0.65rem;
    }
    .k13-plan-label {
      font-size: var(--lab-fs-ui);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--cool);
      font-weight: 700;
    }
    .k13-plan ol { margin: 0.25rem 0 0 0; padding-left: 1.2rem; font-size: var(--lab-fs-ui); line-height: 1.4; }
    .k13-plan li { margin: 0.12rem 0; }
    .k13-tools { display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; }
    .k13-tools-label {
      font-size: var(--lab-fs-ui);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--warm);
      font-weight: 700;
      width: 100%;
    }
    .k13-tool {
      font-family: var(--font-mono);
      font-size: var(--lab-fs-ui);
      background: rgba(var(--warm-rgb), 0.12);
      border: 1px solid rgba(var(--warm-rgb), 0.34);
      color: var(--warm);
      padding: 0.18rem 0.5rem;
      border-radius: 6px;
    }
    .k13-response {
      font-size: var(--lab-fs-answer);
      line-height: 1.5;
      color: var(--text);
      flex: 1;
    }
    .k13-response b { color: var(--text); font-weight: 700; }
    .k13-response .miss { color: var(--bad); font-weight: 700; text-decoration: underline dotted; }
    .k13-response .fab { color: var(--bad); background: rgba(var(--bad-rgb), 0.10); padding: 0 2px; border-radius: 3px; font-weight: 700; }
    .k13-response .real { color: var(--good); font-weight: 700; }
    .k13-chip {
      align-self: flex-start;
      font-family: var(--font-mono);
      font-size: var(--lab-fs-ui);
      padding: 0.22rem 0.7rem;
      border-radius: 999px;
      letter-spacing: 0.04em;
      font-weight: 700;
    }
    .k13-chip.fit   { background: rgba(34,197,94,0.18); color: var(--good); border: 1px solid var(--good); }
    .k13-chip.over  { background: rgba(var(--warm-rgb), 0.16); color: var(--warm); border: 1px solid var(--warm); }
    .k13-chip.under { background: rgba(var(--bad-rgb), 0.16); color: var(--bad); border: 1px solid var(--bad); }

    /* ── Operator bar ─────────────────────────────────────── */
    .k13-button-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.45rem;
      padding: 0 0.2rem;
      flex-wrap: wrap;
    }
    .k13-fs-slot { margin-right: auto; }

    /* Responsive */
    @media (max-width: 700px) {
      .k13-panel { padding: 0.6rem 0.9rem 0.55rem; gap: 0.5rem; }
      .k13-controls { grid-template-columns: 1fr; gap: 0.5rem; }
      .k13-q { padding: 0.55rem 0.85rem; }
      .k13-col { padding: 0.65rem 0.75rem; }
      .k13-sc-btn { padding: 0.6rem 0.5rem; min-height: 44px; flex: 1 1 calc(33% - 0.3rem); text-align: center; }

      .k13-button-bar { gap: 0.4rem; padding: 0; }
      /* A−/A+ is hidden on phone (shared rule); "Entenda" takes a full-width
         row at the top of the operator bar. */
      .k13-button-bar > [data-lab-info-ctl] {
        order: -1;
        display: flex;
        flex: 1 1 100%;
      }
      .k13-button-bar > [data-lab-info-ctl] .lab-info-btn {
        width: 100%;
        justify-content: center;
      }
    }
    @media (max-height: 500px) and (orientation: landscape) {
      .k13-panel { padding: 0.4rem 1rem 0.35rem; gap: 0.4rem; }
    }
  </style>

  <div class="lab-header"
       data-lab-title="Três velocidades"
       data-lab-subtitle="Não é corrida de tempo, é qual formato cabe na pergunta"></div>

  <div class="k13-controls">
    <div class="k13-scenarios">
      <span class="k13-sc-label">tipo da pergunta:</span>
      <div class="k13-sc-row">
        <button class="k13-sc-btn is-active" data-sc="factual" type="button">Factual seca</button>
        <button class="k13-sc-btn" data-sc="multi" type="button">Análise multi-passos</button>
        <button class="k13-sc-btn" data-sc="arquivo" type="button">Exige arquivos</button>
      </div>
    </div>
    <div class="k13-q">
      <span class="k13-q-inner"><span class="lbl">Pergunta:</span><span class="qt" id="k13-q-text"></span></span>
    </div>
  </div>

  <div class="k13-cols" data-lab-tabs data-lab-tab-default="Tradicional">
    <div class="k13-col k13-col--trad" data-lane="trad" data-lab-tab="Tradicional">
      <h3 class="k13-col-name">TRADICIONAL</h3>
      <div class="k13-col-sub">responde do que sabe, pode pular etapas</div>
      <div class="k13-response" id="k13-trad"></div>
      <span class="k13-chip" id="k13-trad-chip"></span>
    </div>
    <div class="k13-col k13-col--rac" data-lane="rac" data-lab-tab="Raciocínio">
      <h3 class="k13-col-name">RACIOCÍNIO</h3>
      <div class="k13-col-sub">planeja antes, sem acesso externo</div>
      <div class="k13-plan" id="k13-rac-plan" style="display:none;"></div>
      <div class="k13-response" id="k13-rac"></div>
      <span class="k13-chip" id="k13-rac-chip"></span>
    </div>
    <div class="k13-col k13-col--ag" data-lane="ag" data-lab-tab="Agêntico">
      <h3 class="k13-col-name">AGÊNTICO</h3>
      <div class="k13-col-sub">planeja e usa ferramentas: arquivos, web</div>
      <div class="k13-plan" id="k13-ag-plan" style="display:none;"></div>
      <div class="k13-tools" id="k13-ag-tools" style="display:none;"></div>
      <div class="k13-response" id="k13-ag"></div>
      <span class="k13-chip" id="k13-ag-chip"></span>
    </div>
  </div>

  <div class="k13-button-bar">
    <span data-lab-info-ctl></span>
    <span class="k13-fs-slot" data-lab-fs-ctl></span>
  </div>

  <!-- Theory kept off the stage by the app-fit rule; surfaced by the shared
       "Entenda" button (lab-info.js). -->
  <template data-lab-info data-lab-info-title="Três velocidades: tradicional, raciocínio e agêntico">
    <p>Nem todo modelo de IA responde do mesmo jeito. O modo <strong>tradicional</strong> responde direto do que já sabe, sem parar para planejar. O modo <strong>raciocínio</strong> monta um plano antes de responder, mas não sai do próprio conhecimento. O modo <strong>agêntico</strong> planeja E usa ferramentas externas (arquivos, buscas, scripts) para executar o plano.</p>
    <p>A pergunta "qual é o melhor" não faz sentido sozinha: o que importa é qual formato <strong>cabe</strong> no tipo de pergunta. Uma pergunta factual seca não precisa de plano nem de ferramenta, e usar raciocínio ou agente ali é exagero. Uma conta com várias etapas (como somar prazos e suspensões) pede raciocínio. Uma pergunta que exige ler arquivos anexados só o agêntico consegue responder sem inventar.</p>
    <p>Troque o tipo de pergunta acima e compare as três respostas lado a lado: o chip embaixo de cada uma mostra se aquele formato "cabe", "é exagero" ou "fica curto" para aquela pergunta específica.</p>
  </template>

  <script>
    (function() {
      // Three scenarios. Selecting one immediately renders all three lanes,
      // the reasoning plan, the agentic tools and the fit chips (fit/over/under),
      // and lights the lane that fits. No "generate" step: the scenario IS the
      // control. Citations are real (CPC arts. 1.003/1.070, art. 7 XXIX CF) or
      // marked fabricated. The lesson: the right format depends on the question
      // TYPE, not on speed.
      const SCEN = {
        factual: {
          q: '"Qual o prazo do agravo de instrumento no CPC?"',
          fit: 'trad',
          trad: { resp: '<b>15 dias úteis</b> (art. 1.003 c/c art. 1.070 do CPC).' },
          rac:  { plan: ['identificar o recurso', 'localizar o dispositivo', 'confirmar 15 dias úteis', 'responder'], resp: '<b>15 dias úteis</b> (arts. 1.003 e 1.070 do CPC), na contagem em dias úteis do procedimento comum.' },
          ag:   { plan: ['avaliar se preciso de ferramenta', 'não preciso, é factual', 'responder direto'], tools: [], resp: '<b>15 dias úteis</b> (CPC). Não precisei consultar nenhuma fonte externa.' },
          chips: { trad: 'fit', rac: 'over', ag: 'over' }
        },
        multi: {
          q: '"Rescisão em 28/06/2024, com 60 dias de suspensão do prazo por causa X. Em que data prescreve a pretensão?"',
          fit: 'rac',
          trad: { resp: 'Prescreve em <span class="miss">junho de 2026</span>. Respondeu direto e <b>pulou o cálculo da suspensão</b>.' },
          rac:  { plan: ['prazo bienal (art. 7, XXIX, CF)', 'termo inicial: 28/06/2024', 'somar os 60 dias de suspensão', 'fechar a data'], resp: '<b>Prescreve em 27/08/2026</b>: 28/06/2024 mais 2 anos chega a 28/06/2026; somados 60 dias de suspensão, vai a <b>27/08/2026</b>.' },
          ag:   { plan: ['avaliar se preciso de calendário', 'a conta cabe sem ferramenta', 'responder'], tools: [], resp: '<b>Prescreve em 27/08/2026</b>. A conta de dias coube no próprio raciocínio, sem ferramenta.' },
          chips: { trad: 'under', rac: 'fit', ag: 'over' }
        },
        arquivo: {
          q: '"Leia estes 3 acórdãos do TJSE em PDF e diga se sustentam minha tese de rescisão indireta."',
          fit: 'ag',
          trad: { resp: '<span class="fab">Em geral, acórdãos sobre rescisão indireta exigem prova robusta do descumprimento contratual.</span> <b>Não tenho acesso aos PDFs anexados</b>, respondi por padrão genérico (alucinação).' },
          rac:  { plan: ['ler os 3 acórdãos', 'extrair as teses', 'comparar com a minha', 'concluir'], resp: '<i>Para executar este plano eu precisaria abrir os PDFs anexados, e <b>não tenho ferramenta de leitura de arquivos</b> neste modo. Recuso inventar o conteúdo.</i>' },
          ag:   { plan: ['abrir cada PDF', 'extrair as ementas', 'comparar as teses', 'citar com número'], tools: ['📄 PDFs', '⚖ TJSE', '💻 script'], resp: 'Li os 3 acórdãos. <span class="real">AC 0102345-22.2023</span> e <span class="real">0098765-11.2022</span> sustentam sua tese (descumprimento reconhecido como justa causa para rescisão indireta). O 3º (<span class="real">0011223-44.2024</span>) é distinto: trata de assédio moral, não de descumprimento.' },
          chips: { trad: 'under', rac: 'under', ag: 'fit' }
        }
      };
      const CHIP_LABEL = { fit: 'cabe na pergunta', over: 'exagero', under: 'fica curto' };

      const qText   = document.getElementById('k13-q-text');
      const scBtns  = document.querySelectorAll('.k13-sc-btn');
      const cols    = document.querySelectorAll('.k13-col');
      const tradEl  = document.getElementById('k13-trad');
      const racEl   = document.getElementById('k13-rac');
      const agEl    = document.getElementById('k13-ag');
      const racPlan = document.getElementById('k13-rac-plan');
      const agPlan  = document.getElementById('k13-ag-plan');
      const agTools = document.getElementById('k13-ag-tools');
      const tradChip = document.getElementById('k13-trad-chip');
      const racChip  = document.getElementById('k13-rac-chip');
      const agChip   = document.getElementById('k13-ag-chip');

      function planHtml(steps) {
        return '<div class="k13-plan-label">🧠 plano</div><ol>' +
          steps.map(s => '<li>' + s + '</li>').join('') + '</ol>';
      }

      function render(key) {
        const sc = SCEN[key];
        scBtns.forEach(b => b.classList.toggle('is-active', b.dataset.sc === key));
        qText.textContent = ' ' + sc.q;

        tradEl.innerHTML = sc.trad.resp;

        racPlan.style.display = 'block';
        racPlan.innerHTML = planHtml(sc.rac.plan);
        racEl.innerHTML = sc.rac.resp;

        agPlan.style.display = 'block';
        agPlan.innerHTML = planHtml(sc.ag.plan);
        if (sc.ag.tools.length) {
          agTools.style.display = 'flex';
          agTools.innerHTML = '<span class="k13-tools-label">🛠 ferramentas usadas</span>' +
            sc.ag.tools.map(t => '<span class="k13-tool">' + t + '</span>').join('');
        } else {
          agTools.style.display = 'none';
        }
        agEl.innerHTML = sc.ag.resp;

        const chipMap = { trad: tradChip, rac: racChip, ag: agChip };
        ['trad', 'rac', 'ag'].forEach(k => {
          const cls = sc.chips[k];
          const chip = chipMap[k];
          chip.className = 'k13-chip ' + cls;
          chip.textContent = CHIP_LABEL[cls];
        });
        cols.forEach(c => c.classList.toggle('is-fit', c.dataset.lane === sc.fit));
      }

      scBtns.forEach(b => b.addEventListener('click', () => render(b.dataset.sc)));

      window.addEventListener('storage', e => {
        if (e.key !== 'bs_theme') return;
        const t = e.newValue;
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        }
      });

      render('factual');
    })();
  </script>
</section>
</body>
</html>
