<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Atenção! · PensoLabs</title>
<link rel="stylesheet" href="../../css/theme.css?v=1.3">
<link rel="stylesheet" href="../css/labs.css?v=1.6">
<script src="../js/lab-header.js?v=1.0" defer></script>
<script src="../js/lab-controls.js?v=1.0" defer></script>
<script src="../js/lab-info.js?v=1.0" defer></script>
<script>
  (function() {
    try {
      var t = localStorage.getItem('bs_theme');
      if (t === 'dark' || t === 'light') {
        document.documentElement.setAttribute('data-theme', t);
      }
    } catch (e) {}
  })();
</script>
</head>
<body class="lab-page">
<section class="k1-panel">
  <style>
    .k1-panel {
      --bg: var(--lab-bg);
      --text: var(--lab-text);
      --text-dim: var(--lab-text-dim);
      --surface: var(--lab-surface);
      --surface-2: var(--lab-surface-2);
      --accent: var(--lab-focal);
      --accent-good: var(--lab-context-b);
      --accent-warm: var(--lab-context-a);
      --accent-bad: var(--lab-bad);
      --border: var(--lab-border);
      --font-display: var(--lab-font-display);
      --font-mono: var(--lab-font-mono);

      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr) auto;
      gap: 0.7rem;
      padding: 1rem 2rem 0.7rem;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-display);
    }

    /* border-box for the whole lab. The panel set it but its children didn't
       inherit it (UA default is content-box), so the mobile width:100% input
       + its padding/border overflowed the right edge and got clipped by the
       panel's overflow:hidden — that was the "cortando as laterais" bug. */
    .k1-panel, .k1-panel * { box-sizing: border-box; }

    /* ── Section labels ───────────────────────────────────── */
    .k1-section-label {
      font-family: var(--font-mono);
      font-size: var(--lab-fs-ui);
      color: var(--text-dim);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin: 0 0 0.4rem;
      font-weight: 600;
    }
    .k1-section-label .hint {
      color: var(--text-dim);
      opacity: 0.65;
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0.02em;
      margin-left: 0.6em;
    }

    /* ── Typing input with autocomplete ───────────────────── */
    .k1-type-wrap {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 0.7rem 1rem 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    .k1-type-row {
      display: flex;
      align-items: center;
      gap: 1.1rem;
      min-width: 0;
    }
    .k1-type-input {
      flex: 0 0 auto;
      width: clamp(280px, 28vw, 480px);
      background: var(--surface-2);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 0.55rem 1.1rem;
      font-family: var(--font-display);
      font-size: var(--lab-fs-audience);
      font-weight: 600;
      color: var(--text);
      outline: none;
      letter-spacing: 0.005em;
      transition: border-color 200ms ease, background 200ms ease;
    }
    .k1-type-input::placeholder {
      color: var(--text-dim);
      opacity: 0.55;
      font-style: italic;
      font-weight: 400;
    }
    .k1-type-input:focus {
      border-color: var(--accent);
      background: rgba(var(--lab-focal-rgb), 0.06);
    }
    .k1-type-input.k1-error {
      animation: k1-shake 260ms ease;
      border-color: var(--accent-bad);
      background: rgba(var(--lab-bad-rgb), 0.08);
    }
    @keyframes k1-shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }
    .k1-type-suggestion {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      flex: 1 1 auto;
      min-width: 0;
      font-family: var(--font-mono);
      font-size: var(--lab-fs-answer);
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
    }
    .k1-sug-arrow {
      opacity: 0.5;
      font-size: 1.4em;
      line-height: 1;
    }
    .k1-sug-chip {
      display: inline-flex;
      align-items: center;
      padding: 0.35rem 1.1rem;
      background: rgba(var(--lab-focal-rgb), 0.12);
      border: 2px solid var(--accent);
      border-radius: 999px;
      font-family: var(--font-display);
      font-size: var(--lab-fs-audience);
      font-weight: 700;
      color: var(--accent);
      cursor: pointer;
      transition: background 150ms, transform 150ms;
    }
    .k1-sug-chip:hover { background: rgba(var(--lab-focal-rgb), 0.22); transform: translateY(-1px); }
    .k1-sug-chip.k1-bias-fruta { border-color: var(--accent-good); color: var(--accent-good); background: rgba(var(--lab-context-b-rgb), 0.10); }
    .k1-sug-chip.k1-bias-fruta:hover { background: rgba(var(--lab-context-b-rgb), 0.20); }
    .k1-sug-chip.k1-bias-roupa { border-color: var(--accent-warm); color: var(--accent-warm); background: rgba(var(--lab-context-a-rgb), 0.10); }
    .k1-sug-chip.k1-bias-roupa:hover { background: rgba(var(--lab-context-a-rgb), 0.20); }
    .k1-sug-prefix { /* what you've typed so far, in solid color of the chip */ }
    .k1-sug-suffix { opacity: 0.55; font-weight: 500; }
    .k1-sug-empty {
      font-style: italic;
      opacity: 0.45;
    }
    .k1-sug-keys {
      margin-left: auto;
      flex-shrink: 0;
      font-size: 0.85em;
      opacity: 0.65;
    }
    .k1-sug-keys kbd {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.05em 0.45em;
      font-family: var(--font-mono);
      color: var(--text);
    }

    /* ── Drop zone (Frase) ────────────────────────────────── */
    .k1-frase-wrap {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 0.65rem 1rem 0.75rem;
    }
    .k1-frase {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem 0.6rem;
      align-items: center;
      min-height: 64px;
      border: 2px dashed transparent;
      border-radius: 10px;
      padding: 0.35rem 0.5rem;
      transition: border-color 200ms ease, background 200ms ease;
    }
    .k1-frase.k1-drag-hover {
      border-color: var(--accent);
      background: rgba(var(--lab-focal-rgb), 0.06);
    }
    /* The pinned "manga" anchor — looks like a draggable pill, can be
       reordered, but has no × button so it cannot be removed. */
    .k1-word-anchor {
      display: inline-flex;
      align-items: center;
      padding: 0.45rem 1.3rem;
      background: rgba(var(--lab-focal-rgb), 0.20);
      border: 2.5px solid var(--accent);
      border-radius: 999px;
      font-family: var(--font-display);
      font-size: var(--lab-fs-audience);
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.005em;
      line-height: 1;
      cursor: grab;
      user-select: none;
      white-space: nowrap;
      box-shadow: 0 0 16px rgba(var(--lab-focal-rgb), 0.28);
      animation: k1-pop-in 280ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    .k1-word-anchor:active { cursor: grabbing; }
    .k1-word-anchor.k1-dragging { opacity: 0.4; transform: scale(0.95); }
    /* Insertion indicator (a colored bar between pills during drag) */
    .k1-drop-indicator {
      width: 4px;
      height: 32px;
      background: var(--accent);
      border-radius: 2px;
      box-shadow: 0 0 10px rgba(var(--lab-focal-rgb), 0.7);
      animation: k1-pulse-indicator 700ms ease-in-out infinite alternate;
      pointer-events: none;
      flex-shrink: 0;
    }
    @keyframes k1-pulse-indicator {
      from { opacity: 0.5; }
      to   { opacity: 1; }
    }
    .k1-word-active {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.65rem 0.45rem 1.15rem;
      background: rgba(var(--lab-focal-rgb), 0.12);
      border: 1.5px solid var(--accent);
      border-radius: 999px;
      font-family: var(--font-display);
      font-size: var(--lab-fs-answer);
      font-weight: 600;
      color: var(--text);
      line-height: 1;
    }
    .k1-word-active.k1-word-just-added {
      animation: k1-pop-in 280ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    .k1-word-active.k1-bias-fruta {
      background: rgba(var(--lab-context-b-rgb), 0.13);
      border-color: var(--accent-good);
    }
    .k1-word-active.k1-bias-roupa {
      background: rgba(var(--lab-context-a-rgb), 0.13);
      border-color: var(--accent-warm);
    }
    .k1-word-active.k1-bias-manga {
      background: rgba(var(--lab-focal-rgb), 0.20);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 800;
      box-shadow: 0 0 14px rgba(var(--lab-focal-rgb), 0.28);
    }
    .k1-frase-placeholder {
      color: var(--text-dim);
      font-style: italic;
      font-size: var(--lab-fs-body);
      opacity: 0.55;
      letter-spacing: 0.01em;
    }
    @keyframes k1-pop-in {
      from { transform: scale(0.7); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    .k1-x {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.4em;
      height: 1.4em;
      border-radius: 50%;
      border: none;
      background: color-mix(in srgb, var(--lab-text) 12%, transparent);
      color: var(--text-dim);
      font-family: inherit;
      font-size: 0.85em;
      cursor: pointer;
      transition: background 150ms, color 150ms;
      padding: 0;
      line-height: 1;
    }
    .k1-x:hover { background: var(--accent-bad); color: var(--lab-bg); }

    /* ── Frase + bottom button bar ─────────────────────────
       Frase takes the full row width now. Operator buttons
       (Sugerir frase / Limpar) live in the .k1-button-bar at
       the bottom of the panel, kept visually small since
       Elder operates them while the class watches the viz. */
    .k1-frase-row {
      display: flex;
      align-items: flex-start;
    }
    .k1-frase-row .k1-frase-wrap { flex: 1; min-width: 0; }

    .k1-button-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.45rem;
      padding: 0 0.2rem;
      flex-wrap: wrap;
    }
    /* The text-size control (A− / A+) is mounted by lab-controls.js into
       this slot; on desktop it sits at the left of the operator bar. */
    .k1-fs-slot { margin-right: auto; }
    .k1-btn-reset,
    .k1-btn-suggest {
      font-family: var(--font-display);
      font-size: var(--lab-fs-btn);
      font-weight: 600;
      padding: 0.38rem 1rem;
      border-radius: 999px;
      cursor: pointer;
      letter-spacing: 0.02em;
      line-height: 1.15;
      transition: background 180ms ease, color 180ms ease,
                  border-color 180ms ease, box-shadow 180ms ease,
                  transform 150ms ease;
    }
    .k1-btn-reset {
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text-dim);
    }
    .k1-btn-reset:hover {
      border-color: var(--accent-bad);
      color: var(--accent-bad);
    }
    .k1-btn-suggest {
      border: 1.5px solid var(--accent);
      background: rgba(var(--lab-focal-rgb), 0.16);
      color: var(--accent);
      box-shadow: 0 0 10px rgba(var(--lab-focal-rgb), 0.18);
    }
    .k1-btn-suggest:hover:not(:disabled) {
      background: rgba(var(--lab-focal-rgb), 0.28);
      transform: translateY(-1px);
      box-shadow: 0 0 16px rgba(var(--lab-focal-rgb), 0.3);
    }
    .k1-btn-suggest:disabled {
      opacity: 0.45;
      cursor: wait;
    }

    /* ── Visualization ──────────────────────────────────────
       No surrounding card: the SVG sits directly on the panel
       background so the FRUTA / ROUPA labels and clusters get
       the full panel width without a frame chewing pixels off
       the edges. */
    .k1-viz-wrap {
      padding: 0;
      display: flex;
      align-items: stretch;
      justify-content: center;
      min-height: 0;
    }
    .k1-viz {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── Caption ──────────────────────────────────────────── */
    .k1-caption {
      text-align: center;
      font-size: var(--lab-fs-body);
      color: var(--text-dim);
      font-style: italic;
      margin: 0;
      letter-spacing: 0.005em;
    }

    /* ── Responsive: phone / narrow portrait ─────────────── */
    @media (max-width: 700px) {
      /* Keep the top fields tight so the viz area stays tall enough to be
         detected as portrait (clusters stack vertically) and everything fits
         one fixed screen with no scroll. */
      .k1-panel {
        padding: 0.5rem 0.9rem 0.5rem;
        gap: 0.4rem;
      }
      .k1-type-wrap { padding: 0.4rem 0.75rem 0.45rem; }
      .k1-type-row {
        flex-direction: column;
        align-items: stretch;
        gap: 0.35rem;
      }
      .k1-type-input {
        width: 100%;
        padding: 0.35rem 0.85rem;
        font-size: var(--lab-fs-answer);
      }
      .k1-type-suggestion {
        flex-wrap: wrap;
      }
      .k1-sug-chip { padding: 0.3rem 0.9rem; }
      .k1-sug-keys { display: none; }
      .k1-frase-wrap { padding: 0.4rem 0.75rem 0.45rem; }
      .k1-frase {
        gap: 0.4rem 0.5rem;
        min-height: 44px;
        padding: 0.2rem 0.35rem;
      }
      .k1-word-anchor {
        padding: 0.35rem 0.9rem;
      }
      .k1-word-active {
        padding: 0.35rem 0.55rem 0.35rem 0.85rem;
      }

      .k1-button-bar { gap: 0.4rem; padding: 0; }
      /* Text-size control gets its own centered row on phones. */
      .k1-fs-slot { margin-right: 0; flex: 1 0 100%; justify-content: center; }
      .k1-btn-reset,
      .k1-btn-suggest {
        padding: 0.65rem 0.5rem;
        flex: 1 1 calc(50% - 0.2rem);
        min-height: 44px;
        text-align: center;
      }
      /* A−/A+ is hidden on phone (shared rule); "Entenda" takes a full-width
         row at the top of the operator bar, actions keep their grid below. */
      .k1-button-bar > [data-lab-info-ctl] {
        order: -1;
        display: flex;
        flex: 1 1 100%;
      }
      .k1-button-bar > [data-lab-info-ctl] .lab-info-btn {
        width: 100%;
        justify-content: center;
      }
    }

    @media (max-width: 400px) {
      .k1-btn-reset,
      .k1-btn-suggest { padding: 0.6rem 0.35rem; }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      .k1-panel {
        padding: 0.4rem 1rem 0.35rem;
        gap: 0.4rem;
      }
      .k1-type-row {
        flex-direction: row;
        gap: 0.7rem;
      }
      .k1-type-input { padding: 0.35rem 0.8rem; width: clamp(220px, 26vw, 360px); }
      .k1-sug-chip { padding: 0.25rem 0.7rem; }
      .k1-frase-wrap { padding: 0.4rem 0.7rem 0.5rem; }
      .k1-frase { min-height: 44px; gap: 0.35rem 0.4rem; }
      .k1-word-anchor { padding: 0.3rem 0.8rem; }
      .k1-word-active { padding: 0.3rem 0.5rem 0.3rem 0.75rem; }
      .k1-btn-reset,
      .k1-btn-suggest {
        padding: 0.4rem 0.75rem;
        min-height: 32px;
      }
    }
  </style>

  <div class="lab-header"
       data-lab-title="Atenção!"
       data-lab-subtitle="Como o contexto desambigua o sentido"></div>

  <div class="k1-type-wrap">
    <div class="k1-type-row">
      <input class="k1-type-input" id="k1-type-input" type="text"
             autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="off"
             placeholder="digite uma palavra..." />
      <div class="k1-type-suggestion" id="k1-type-suggestion"></div>
    </div>
  </div>

  <div class="k1-frase-row">
    <div class="k1-frase-wrap">
      <div class="k1-frase" id="k1-frase"></div>
    </div>
  </div>

  <!-- Visualization -->
  <div class="k1-viz-wrap">
    <svg class="k1-viz" id="k1-viz" viewBox="0 0 1000 400" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="k1-button-bar">
    <span data-lab-info-ctl></span>
    <span class="k1-fs-slot" data-lab-fs-ctl></span>
    <button class="k1-btn-suggest" id="k1-suggest" title="Inserir uma frase de exemplo aleatória">Sugerir frase</button>
    <button class="k1-btn-reset" id="k1-reset" title="Limpar a frase">Limpar</button>
  </div>

  <!-- Theory kept off the stage by the app-fit rule; surfaced by the shared
       "Entenda" button (lab-info.js). -->
  <template data-lab-info data-lab-info-title="Atenção: o contexto decide o sentido">
    <p>Uma mesma palavra pode ter sentidos diferentes. <strong>“Manga”</strong> é a manga da fruta ou a manga da camisa? Sozinha, ela é ambígua.</p>
    <p>O modelo resolve isso com <strong>atenção</strong>: ao processar cada palavra, ele “olha” para as vizinhas e <strong>pesa quais importam</strong>. <em>Costura, camisa</em> puxam o sentido pra ROUPA; <em>doce, madura</em> puxam pra FRUTA.</p>
    <p>Não há um sentido fixo guardado na palavra; ele <strong>emerge do contexto</strong>. Quanto mais pistas de um lado, mais forte a puxada. Por isso o mesmo termo jurídico muda de sentido conforme o resto do texto.</p>
  </template>

      if (!root) return;

        // Defs: glow filter for manga dot
        const defs = makeEl('defs', {});
        const glow = makeEl('filter', { id: 'k1-glow', x: '-50%', y: '-50%', width: '200%', height: '200%' });
        glow.appendChild(makeEl('feGaussianBlur', { stdDeviation: '7', result: 'b' }));
        const merge = makeEl('feMerge', {});
        merge.appendChild(makeEl('feMergeNode', { in: 'b' }));
        merge.appendChild(makeEl('feMergeNode', { in: 'SourceGraphic' }));
        glow.appendChild(merge);
        defs.appendChild(glow);
        vizEl.appendChild(defs);

        // Cluster regions
        roupaRegion = makeEl('circle', {
          cx: ROUPA_CX, cy: ROUPA_CY, r: CLUSTER_R,
          fill: `rgba(${ROUPA_RGB.join(',')}, 0.06)`,
          stroke: `rgba(${ROUPA_RGB.join(',')}, 0.30)`,
          'stroke-width': '1.5',
          'stroke-dasharray': '6 6',
        });
        vizEl.appendChild(roupaRegion);

        fruitaRegion = makeEl('circle', {
          cx: FRUTA_CX, cy: FRUTA_CY, r: CLUSTER_R,
          fill: `rgba(${FRUTA_RGB.join(',')}, 0.06)`,
          stroke: `rgba(${FRUTA_RGB.join(',')}, 0.30)`,
          'stroke-width': '1.5',
          'stroke-dasharray': '6 6',
        });
        vizEl.appendChild(fruitaRegion);

        // Big cluster labels (above each region). Clamp to a safe minimum so
        // the cap top stays inside the viewBox even when the viz is short.
        // The SVG text Y attribute is the BASELINE, so the cap rises roughly
        // CLUSTER_LABEL_F * 0.8 above it. Anything less than that as a Y
        // value would clip the top of "FRUTA" / "ROUPA".
        roupaLabel = makeEl('text', {
          x: ROUPA_CX, y: ROUPA_LABEL_Y,
          'text-anchor': 'middle',
          fill: `rgb(${ROUPA_RGB.join(',')})`,
          'font-family': "'Inter', system-ui, sans-serif",
          'font-size': CAP_F,
          'font-weight': '800',
          'letter-spacing': '4',
          opacity: '0.65',
        });
        roupaLabel.textContent = 'ROUPA';
        vizEl.appendChild(roupaLabel);

        fruitaLabel = makeEl('text', {
          x: FRUTA_CX, y: FRUTA_LABEL_Y,
          'text-anchor': 'middle',
          fill: `rgb(${FRUTA_RGB.join(',')})`,
          'font-family': "'Inter', system-ui, sans-serif",
          'font-size': CAP_F,
          'font-weight': '800',
          'letter-spacing': '4',
          opacity: '0.65',
        });
        fruitaLabel.textContent = 'FRUTA';
        vizEl.appendChild(fruitaLabel);

        // Cluster members — dot with label BELOW it, positions scale with CLUSTER_R
        function renderMembers(centerX, centerY, ratios, rgb) {
          ratios.forEach(m => {
            const x = centerX + m.rx * CLUSTER_R;
            const y = centerY + m.ry * CLUSTER_R;
            vizEl.appendChild(makeEl('circle', {
              cx: x, cy: y, r: MEMBER_DOT_R,
              fill: `rgba(${rgb.join(',')}, 0.78)`,
            }));
            const t = makeEl('text', {
              x, y: y + MEMBER_F * 1.25,
              'text-anchor': 'middle',
              fill: `rgba(${rgb.join(',')}, 0.92)`,
              'font-family': "'JetBrains Mono', ui-monospace, monospace",
              'font-size': MEMBER_F,
              'font-weight': '500',
            });
            t.textContent = m.label;
            vizEl.appendChild(t);
          });
        }
        renderMembers(ROUPA_CX, ROUPA_CY, ROUPA_RATIOS, ROUPA_RGB);
        renderMembers(FRUTA_CX, FRUTA_CY, FRUTA_RATIOS, FRUTA_RGB);

        // Recompute manga's position for the current bias under the new geometry
        const mp = biasToPos(currentBias);
        currentMangaX = mp.x;
        currentMangaY = mp.y;
        const currentCol = lerpColor(currentBias);

        // Manga dot
        mangaDot = makeEl('circle', {
          cx: currentMangaX, cy: currentMangaY, r: MANGA_DOT_R,
          fill: currentCol,
          filter: 'url(#k1-glow)',
        });
        vizEl.appendChild(mangaDot);

        // Manga label
        mangaLabel = makeEl('text', {
          x: currentMangaX, y: currentMangaY - MANGA_DOT_R - MANGA_LABEL_F * 0.4,
          'text-anchor': 'middle',
          fill: currentCol,
          'font-family': "'Inter', system-ui, sans-serif",
          'font-size': MANGA_LABEL_F,
          'font-weight': '800',
          'letter-spacing': '0.5',
        });
        mangaLabel.textContent = 'manga';
        vizEl.appendChild(mangaLabel);

        updateClusterGlow(currentBias);
        return true;
      }

      // Rebuild viz whenever its container resizes (debounced).
      // Critical for both the standalone test and the integrated panel
      // where the section starts hidden (zero size) and gets dimensions
      // only when the menu reveals it. ALSO fires when the frase wraps
      // to a different number of rows (which shifts the viz height) —
      // so we must restart any in-flight animation toward its target,
      // otherwise manga gets stuck mid-flight (e.g. on "Limpar").
      let resizeTimer = null;
      const ro = new ResizeObserver(() => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          const wasAnimating = animId !== null;
          if (animId) { cancelAnimationFrame(animId); animId = null; }
          buildViz();
          if (wasAnimating && Math.abs(currentBias - targetBias) > 0.001) {
            animateToBias(targetBias);
          }
        }, 80);
      });
      ro.observe(vizEl);

      // ── Update cluster opacities based on bias ───────────
      function updateClusterGlow(bias) {
        if (!fruitaRegion) return;
        // bias > 0: fruta strong, roupa neutral
        // bias < 0: roupa strong, fruta neutral
        const fruitaPull = Math.max(0, bias);
        const roupaPull  = Math.max(0, -bias);
        const fbg = 0.06 + 0.22 * fruitaPull;
        const fbd = 0.30 + 0.55 * fruitaPull;
        const rbg = 0.06 + 0.22 * roupaPull;
        const rbd = 0.30 + 0.55 * roupaPull;
        fruitaRegion.setAttribute('fill', `rgba(${FRUTA_RGB.join(',')}, ${fbg})`);
        fruitaRegion.setAttribute('stroke', `rgba(${FRUTA_RGB.join(',')}, ${fbd})`);
        roupaRegion.setAttribute('fill', `rgba(${ROUPA_RGB.join(',')}, ${rbg})`);
        roupaRegion.setAttribute('stroke', `rgba(${ROUPA_RGB.join(',')}, ${rbd})`);
        fruitaLabel.setAttribute('opacity', String(0.55 + 0.42 * fruitaPull));
        roupaLabel.setAttribute('opacity',  String(0.55 + 0.42 * roupaPull));
      }

      // ── Animate manga to new bias ────────────────────────
      function animateToBias(newBias) {
        targetBias = newBias;
        const newPos = biasToPos(newBias);
        animFromX = currentMangaX;
        animFromY = currentMangaY;
        animFromBias = currentBias;
        animToX = newPos.x;
        animToY = newPos.y;
        animToBias = newBias;
        animStart = performance.now();
        if (animId) cancelAnimationFrame(animId);
        animId = requestAnimationFrame(animTick);
      }

      function animTick(ts) {
        const elapsed = ts - animStart;
        const t = Math.min(elapsed / ANIM_DUR, 1);
        const u = easeInOut(t);
        const x = animFromX + (animToX - animFromX) * u;
        const y = animFromY + (animToY - animFromY) * u;
        const b = animFromBias + (animToBias - animFromBias) * u;

        currentMangaX = x;
        currentMangaY = y;
        currentBias = b;

        // Guard: the dot may have been rebuilt out from under us by a
        // resize. animTick gets cancelled in that case, but be defensive.
        if (mangaDot) {
          mangaDot.setAttribute('cx', x);
          mangaDot.setAttribute('cy', y);
          mangaLabel.setAttribute('x', x);
          mangaLabel.setAttribute('y', y - MANGA_DOT_R - MANGA_LABEL_F * 0.4);
          const col = lerpColor(b);
          mangaDot.setAttribute('fill', col);
          mangaLabel.setAttribute('fill', col);
        }
        updateClusterGlow(b);

        if (t < 1) {
          animId = requestAnimationFrame(animTick);
        } else {
          animId = null;
        }
      }

      // ── Dictionary lookup helpers ────────────────────────
      // Duplicates are allowed in the frase, so we don't filter "used".
      function hasPrefixMatch(prefix) {
        if (!prefix) return true;
        return WORDS.some(w => w.text.startsWith(prefix));
      }
      function findBestMatch(prefix) {
        if (!prefix) return null;
        const exact = WORDS.find(w => w.text === prefix);
        if (exact) return exact;
        // Shortest prefix match wins (ties broken alphabetically).
        return WORDS
          .filter(w => w.text.startsWith(prefix))
          .sort((a, b) => a.text.length - b.text.length || a.text.localeCompare(b.text))[0];
      }

      // ── Update the live suggestion display ───────────────
      function updateSuggestion() {
        const val = inputEl.value.toLowerCase();
        if (!val) {
          sugEl.innerHTML = '<span class="k1-sug-empty">comece a digitar para ver a sugestão…</span>';
          return;
        }
        const match = findBestMatch(val);
        if (!match) {
          sugEl.innerHTML = '<span class="k1-sug-empty">sem palavras disponíveis com este início</span>';
          return;
        }
        const prefix = val;
        const suffix = match.text.slice(prefix.length);
        const biasClass =
          match.bias === 'fruta' ? 'k1-bias-fruta' :
          match.bias === 'roupa' ? 'k1-bias-roupa' : '';
        sugEl.innerHTML =
          '<span class="k1-sug-arrow">→</span>' +
          '<span class="k1-sug-chip ' + biasClass + '" data-text="' + match.text + '" title="clique para adicionar">' +
            '<span class="k1-sug-prefix">' + prefix + '</span>' +
            '<span class="k1-sug-suffix">' + suffix + '</span>' +
          '</span>';
      }

      // ── Render the frase ─────────────────────────────────
      // Only pills carrying _justAdded === true play the pop-in animation.
      // Without this flag every renderFrase() would replay the animation on
      // every existing pill, producing a jarring full-row refresh on each
      // insertion (visible during Sugerir frase's stagger-insert).
      function renderFrase() {
        fraseEl.innerHTML = '';
        if (activeWords.length === 0) {
          const ph = document.createElement('span');
          ph.className = 'k1-frase-placeholder';
          ph.textContent = 'comece a digitar palavras…';
          fraseEl.appendChild(ph);
          return;
        }
        activeWords.forEach((w, idx) => {
          const pill = document.createElement('span');
          pill.className = 'k1-word-active';
          if (w._justAdded) {
            pill.classList.add('k1-word-just-added');
            delete w._justAdded;
          }
          if (w.bias === 'fruta') pill.classList.add('k1-bias-fruta');
          else if (w.bias === 'roupa') pill.classList.add('k1-bias-roupa');
          else if (w.bias === 'manga') pill.classList.add('k1-bias-manga');
          pill.draggable = true;
          pill.dataset.idx = idx;
          pill.innerHTML = `<span>${w.text}</span>`;
          const x = document.createElement('button');
          x.className = 'k1-x';
          x.dataset.absIdx = idx;
          x.textContent = '×';
          x.title = `remover "${w.text}"`;
          pill.appendChild(x);
          fraseEl.appendChild(pill);
        });
      }

      // ── Insert / remove / reorder ────────────────────────
      function insertWordAt(text, idx) {
        const def = BY_TEXT[text];
        if (!def) return;
        const clamped = Math.max(0, Math.min(activeWords.length, idx));
        // Each insertion is a fresh entry so duplicates work cleanly.
        // _justAdded marks this pill for the pop-in animation on next render.
        activeWords.splice(clamped, 0, { text: def.text, bias: def.bias, _justAdded: true });
        updateSuggestion();
        renderFrase();
        animateToBias(computeBias(activeWords));
      }
      function removeWordAt(absIdx) {
        if (absIdx < 0 || absIdx >= activeWords.length) return;
        activeWords.splice(absIdx, 1);
        updateSuggestion();
        renderFrase();
        animateToBias(computeBias(activeWords));
      }
      function moveWord(fromIdx, toIdx) {
        if (fromIdx < 0 || fromIdx >= activeWords.length) return;
        if (toIdx < 0) toIdx = 0;
        if (toIdx > activeWords.length) toIdx = activeWords.length;
        if (fromIdx === toIdx || fromIdx === toIdx - 1) return;
        const [item] = activeWords.splice(fromIdx, 1);
        const insertAt = toIdx > fromIdx ? toIdx - 1 : toIdx;
        activeWords.splice(insertAt, 0, item);
        renderFrase();
        // Order doesn't affect bias
      }
      function resetAll() {
        activeWords = [];
        inputEl.value = '';
        updateSuggestion();
        renderFrase();
        animateToBias(0);
        inputEl.focus();
      }

      // ── Typing input → commit a word into the frase ──────
      function insertTypedWord(text) {
        // New typed words append to the end of the frase, building the
        // sentence left-to-right as the instructor types.
        insertWordAt(text, activeWords.length);
      }
      function flashError() {
        inputEl.classList.remove('k1-error');
        void inputEl.offsetWidth;
        inputEl.classList.add('k1-error');
      }
      function commitTypedWord() {
        const val = inputEl.value.toLowerCase().trim();
        if (!val) { flashError(); return; }
        const match = findBestMatch(val);
        if (!match) { flashError(); return; }
        insertTypedWord(match.text);
        inputEl.value = '';
        updateSuggestion();
      }
      function completeTypedWord() {
        const val = inputEl.value.toLowerCase();
        const match = findBestMatch(val);
        if (!match || match.text === val) return;
        inputEl.value = match.text;
        updateSuggestion();
      }

      // ── Typing input wiring ──────────────────────────────
      // beforeinput is the cleanest cross-browser hook: it runs BEFORE the
      // character is inserted, lets us inspect the proposed value, and we
      // can preventDefault() to block invalid letters.
      const PT_LETTER_RE = /^[a-záàâãéêíóôõúçñü]+$/i;
      inputEl.addEventListener('beforeinput', e => {
        if (e.inputType !== 'insertText' && e.inputType !== 'insertFromPaste' &&
            e.inputType !== 'insertCompositionText' && e.inputType !== 'insertReplacementText') {
          return; // allow deletes, etc.
        }
        const data = (e.data || '').toLowerCase();
        if (!data) return;
        // Block non-letter input (digits, punctuation other than letters)
        if (!PT_LETTER_RE.test(data)) {
          e.preventDefault();
          flashError();
          return;
        }
        // Compute the value that WOULD result and check the prefix rule
        const start = (inputEl.selectionStart != null) ? inputEl.selectionStart : inputEl.value.length;
        const end   = (inputEl.selectionEnd   != null) ? inputEl.selectionEnd   : inputEl.value.length;
        const newVal = (inputEl.value.slice(0, start) + data + inputEl.value.slice(end)).toLowerCase();
        if (!hasPrefixMatch(newVal)) {
          e.preventDefault();
          flashError();
        }
      });
      inputEl.addEventListener('input', updateSuggestion);
      inputEl.addEventListener('keydown', e => {
        if (e.key === 'Tab') {
          e.preventDefault();
          completeTypedWord();
          return;
        }
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          commitTypedWord();
          return;
        }
        if (e.key === 'Escape') {
          inputEl.value = '';
          updateSuggestion();
          return;
        }
      });
      // Click the suggestion chip → commit that exact word.
      sugEl.addEventListener('click', e => {
        const chip = e.target.closest('.k1-sug-chip');
        if (!chip) return;
        insertTypedWord(chip.dataset.text);
        inputEl.value = '';
        updateSuggestion();
        inputEl.focus();
      });

      // ── Frase reorder (drag within the frase) ────────────
      const REORDER_MIME = 'application/x-k1-reorder';

      // Frase pills (including the manga anchor) — drag to reorder.
      fraseEl.addEventListener('dragstart', e => {
        const pill = e.target.closest('.k1-word-active, .k1-word-anchor');
        if (!pill) return;
        const idx = parseInt(pill.dataset.idx, 10);
        e.dataTransfer.setData(REORDER_MIME, String(idx));
        e.dataTransfer.setData('text/plain', activeWords[idx]?.text || '');
        e.dataTransfer.effectAllowed = 'move';
        pill.classList.add('k1-dragging');
      });
      fraseEl.addEventListener('dragend', e => {
        const pill = e.target.closest('.k1-word-active, .k1-word-anchor');
        if (pill) pill.classList.remove('k1-dragging');
        removeIndicator();
      });

      // Compute insertion index based on mouse position over the frase.
      // Returns 0..activeWords.length — where to insert.
      function computeDropIndex(clientX, clientY) {
        const pills = Array.from(fraseEl.querySelectorAll('.k1-word-active, .k1-word-anchor'));
        if (pills.length === 0) return 0;
        // For each pill, find the one whose vertical band the cursor is in.
        // If the cursor is in row of pill i, return i if cursor left of pill center, else i+1.
        // If cursor isn't in any pill's row (above/below), pick nearest row.
        let bestIdx = pills.length;
        let bestRowDist = Infinity;
        let bestRowChoice = null;
        pills.forEach((p, i) => {
          const r = p.getBoundingClientRect();
          const inRow = clientY >= r.top && clientY <= r.bottom;
          const rowDist = inRow ? 0 : Math.min(Math.abs(clientY - r.top), Math.abs(clientY - r.bottom));
          if (inRow) {
            if (bestRowDist !== 0) { bestRowDist = 0; bestRowChoice = null; }
            // Within this row, decide before or after this pill
            const before = clientX < r.left + r.width / 2;
            if (bestRowChoice === null || (before && bestRowChoice.before === false)) {
              bestRowChoice = { i, before };
            } else if (clientX < r.left + r.width / 2 || bestRowChoice.i === i) {
              bestRowChoice = { i, before };
            }
          } else if (rowDist < bestRowDist) {
            bestRowDist = rowDist;
            bestRowChoice = { i, before: clientX < r.left + r.width / 2 };
          }
        });
        // We want the LAST applicable choice in flex order, so do another scan
        // simpler: pick pill with min center distance, decide before/after.
        let minDist = Infinity;
        let pickIdx = pills.length;
        let pickBefore = false;
        pills.forEach((p, i) => {
          const r = p.getBoundingClientRect();
          const cx = r.left + r.width / 2;
          const cy = r.top + r.height / 2;
          const d = Math.hypot(clientX - cx, clientY - cy);
          if (d < minDist) {
            minDist = d;
            pickIdx = i;
            pickBefore = clientX < cx;
          }
        });
        return pickBefore ? pickIdx : pickIdx + 1;
      }

      // Insertion indicator
      let indicatorEl = null;
      function showIndicator(beforeIdx) {
        removeIndicator();
        const pills = Array.from(fraseEl.querySelectorAll('.k1-word-active, .k1-word-anchor'));
        indicatorEl = document.createElement('span');
        indicatorEl.className = 'k1-drop-indicator';
        if (beforeIdx >= pills.length) {
          fraseEl.appendChild(indicatorEl);
        } else {
          fraseEl.insertBefore(indicatorEl, pills[beforeIdx]);
        }
      }
      function removeIndicator() {
        if (indicatorEl && indicatorEl.parentNode) {
          indicatorEl.parentNode.removeChild(indicatorEl);
        }
        indicatorEl = null;
      }

      fraseEl.addEventListener('dragover', e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        fraseEl.classList.add('k1-drag-hover');
        const dropIdx = computeDropIndex(e.clientX, e.clientY);
        showIndicator(dropIdx);
      });
      fraseEl.addEventListener('dragleave', e => {
        if (!fraseEl.contains(e.relatedTarget)) {
          fraseEl.classList.remove('k1-drag-hover');
          removeIndicator();
        }
      });
      fraseEl.addEventListener('drop', e => {
        e.preventDefault();
        fraseEl.classList.remove('k1-drag-hover');
        removeIndicator();
        const dropIdx = computeDropIndex(e.clientX, e.clientY);
        const reorderStr = e.dataTransfer.getData(REORDER_MIME);
        if (reorderStr !== '') {
          moveWord(parseInt(reorderStr, 10), dropIdx);
          return;
        }
        const text = e.dataTransfer.getData('text/plain');
        if (text) insertWordAt(text, dropIdx);
      });
      fraseEl.addEventListener('click', e => {
        const btn = e.target.closest('.k1-x');
        if (btn) removeWordAt(parseInt(btn.dataset.absIdx, 10));
      });

      resetBtn.addEventListener('click', resetAll);

      // ── Sugerir frase: pick a phrase and stagger-insert it ──
      // Bias strictly alternates between fruta and roupa on each click.
      // Random 50/50 occasionally streaked one bias and gave the impression
      // the button was broken; alternation makes the contrast obvious.
      const suggestBtn = root.querySelector('#k1-suggest');
      let isSuggesting = false;
      let lastSuggestedBias = 'roupa'; // so the FIRST click yields fruta
      const STAGGER_MS = 150;
      const PRE_DELAY_MS = 380;  // give manga a beat to start sliding home

      function suggestPhrase() {
        if (isSuggesting) return;
        isSuggesting = true;
        suggestBtn.disabled = true;

        // Strict alternation: flip from whatever was suggested last.
        const bias = lastSuggestedBias === 'fruta' ? 'roupa' : 'fruta';
        lastSuggestedBias = bias;
        const pool = PHRASES[bias];
        const phrase = pool[Math.floor(Math.random() * pool.length)];

        // Clear current state
        activeWords = [];
        inputEl.value = '';
        updateSuggestion();
        renderFrase();
        animateToBias(0);

        // Stagger-insert each token
        let i = 0;
        function tick() {
          if (i >= phrase.length) {
            isSuggesting = false;
            suggestBtn.disabled = false;
            inputEl.focus();
            return;
          }
          insertWordAt(phrase[i], activeWords.length);
          i++;
          setTimeout(tick, STAGGER_MS);
        }
        setTimeout(tick, PRE_DELAY_MS);
      }

      suggestBtn.addEventListener('click', suggestPhrase);

      // ── Init ─────────────────────────────────────────────
      // ResizeObserver above will fire buildViz once the container is sized.
      // We still try once now in case it's already sized (standalone test).
      buildViz();
      updateSuggestion();
      renderFrase();
      // Pre-focus the typing input so the instructor can start typing.
      setTimeout(() => inputEl.focus(), 0);

      // ── Theme sync: when the parent toggles bs_theme in localStorage,
      //    reflect it here and rebuild viz so the SVG colors (which are
      //    inline attributes, not CSS-driven) refresh.
      window.addEventListener('storage', function(e) {
        if (e.key !== 'bs_theme') return;
        const t = e.newValue;
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
          NEUTRAL_RGB = readRgb('--lab-focal-rgb');
          FRUTA_RGB   = readRgb('--lab-context-b-rgb');
          ROUPA_RGB   = readRgb('--lab-context-a-rgb');
          buildViz();
        }
      });
    })();
  </script>
</section>
</body>
</html>
