<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Embeddings · PensoLabs</title>
<link rel="stylesheet" href="../../css/theme.css?v=1.3">
<link rel="stylesheet" href="../css/labs.css?v=1.5">
<script src="../js/lab-header.js?v=1.0" defer></script>
<script src="../js/lab-controls.js?v=1.0" defer></script>
<script src="../js/lab-tabs.js?v=1.0" defer></script>
<script src="../js/lab-info.js?v=1.0" defer></script>
<script>
  (function() {
    try {
      var t = localStorage.getItem('bs_theme');
      if (t === 'dark' || t === 'light') {
        document.documentElement.setAttribute('data-theme', t);
      }
    } catch (e) {}
  })();
</script>
</head>
<body class="lab-page">
<section class="k6-panel">
  <style>
    .k6-panel {
      --bg: var(--lab-bg);
      --text: var(--lab-text);
      --text-dim: var(--lab-text-dim);
      --surface: var(--lab-surface);
      --border: var(--lab-border);
      --focal: var(--lab-focal);
      --warm: var(--lab-context-a);
      --cool: var(--lab-context-b);
      --good: var(--lab-good);
      --font-display: var(--lab-font-display);
      --font-mono: var(--lab-font-mono);

      /* 6 domain colors, custom (not reused UI-accent tokens: --lab-focal/
         --lab-good sit only 1 hue-family apart and read as the same color
         from the back row, confirmed in playtest screenshots). Spread ~60deg
         apart on purpose so no two domains are ever confusable. Each has its
         own [data-theme="dark"] override below. */
      --k6-red: #dc2626;
      --k6-amber: #b45309;
      --k6-green: #15803d;
      --k6-cyan: #0e7490;
      --k6-blue: #2563eb;
      --k6-purple: #a21caf;

      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 0.6rem;
      padding: 1rem 2rem 0.7rem;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-display);
    }
    [data-theme="dark"] .k6-panel {
      --k6-red: #f87171;
      --k6-amber: #d4a017;
      --k6-green: #4ade80;
      --k6-cyan: #22d3ee;
      --k6-blue: #60a5fa;
      --k6-purple: #e879f9;
    }

    .k6-meter {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.1rem;
    }
    .k6-meter-label {
      font-size: var(--lab-fs-ui);
      color: var(--text-dim);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .k6-meter-value {
      font-family: var(--font-mono);
      font-size: var(--lab-fs-audience);
      font-weight: 700;
      color: var(--focal);
      line-height: 1;
    }

    .k6-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(240px, 28%);
      gap: 1.4rem;
      min-height: 0;
    }

    .k6-stage {
      position: relative;
      min-height: 0;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .k6-word {
      position: absolute;
      transform: translate(-50%, -50%) scale(0.7);
      white-space: nowrap;
      font-family: var(--font-mono);
      font-size: var(--lab-fs-ui);
      font-weight: 700;
      padding: 0.3rem 0.65rem;
      border-radius: 999px;
      border: 1.5px solid var(--dom-color);
      background: color-mix(in srgb, var(--dom-color) 16%, var(--surface));
      color: var(--dom-color);
      opacity: 0;
      transition: left 850ms cubic-bezier(0.22, 0.61, 0.36, 1),
                  top 850ms cubic-bezier(0.22, 0.61, 0.36, 1),
                  opacity 500ms ease-out,
                  transform 500ms ease-out;
    }
    .k6-word.k6-word--in {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .k6-legend {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 1rem 1.1rem;
      min-width: 0;
      min-height: 0;
      overflow-y: auto;
      gap: 0.7rem;
    }
    .k6-legend-title {
      margin: 0;
      font-size: var(--lab-fs-ui);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .k6-legend-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .k6-legend-list li {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-size: var(--lab-fs-body);
      font-weight: 600;
      color: var(--text);
    }
    .k6-dot {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      flex-shrink: 0;
      background: var(--dom-color);
    }
    .k6-caption {
      margin-top: auto;
      padding-top: 0.6rem;
      border-top: 1px dashed var(--border);
      font-size: var(--lab-fs-ui);
      color: var(--text-dim);
      line-height: 1.4;
      font-style: italic;
    }

    .k6-button-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.45rem;
      padding: 0 0.2rem;
      flex-wrap: wrap;
    }
    .k6-fs-slot { margin-right: auto; }
    .k6-btn {
      font-family: var(--font-display);
      font-size: var(--lab-fs-btn);
      font-weight: 600;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      cursor: pointer;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      transition: border-color 180ms, color 180ms, transform 150ms;
    }
    .k6-btn:hover { border-color: var(--cool); color: var(--cool); transform: translateY(-1px); }
    .k6-btn-action {
      border-color: var(--focal);
      background: color-mix(in srgb, var(--focal) 16%, transparent);
      color: var(--focal);
    }
    .k6-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    @media (max-width: 700px) {
      .k6-panel { padding: 0.6rem 0.9rem 0.6rem; gap: 0.5rem; }
      .k6-main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; gap: 0.5rem; }
      .k6-legend { padding: 0.6rem 0.75rem; gap: 0.5rem; }
      .k6-word { font-size: 11px; padding: 0.24rem 0.5rem; }
      .k6-button-bar { gap: 0.4rem; padding: 0; }
      .k6-btn { padding: 0.6rem 0.5rem; flex: 1 1 calc(50% - 0.2rem); min-height: 44px; text-align: center; }
      .k6-fs-slot { margin-right: 0; flex: 1 0 100%; justify-content: center; }
      .k6-button-bar > [data-lab-info-ctl] { order: -1; display: flex; flex: 1 1 100%; }
      .k6-button-bar > [data-lab-info-ctl] .lab-info-btn { width: 100%; justify-content: center; }
    }
    @media (max-height: 500px) and (orientation: landscape) {
      .k6-panel { padding: 0.4rem 1rem 0.35rem; gap: 0.35rem; }
      .k6-btn { min-height: 32px; }
    }
  </style>

  <div class="lab-header" data-lab-title="Embeddings" data-lab-subtitle="Sentido tem geometria">
    <div class="k6-meter">
      <span class="k6-meter-label">Palavras</span>
      <span class="k6-meter-value"><span id="k6-count">0</span>/<span id="k6-total">36</span></span>
    </div>
  </div>

  <div class="k6-main" data-lab-tabs data-lab-tab-default="Cena">
    <div class="k6-stage" id="k6-stage" data-lab-tab="Cena"></div>
    <aside class="k6-legend" data-lab-tab="Domínios">
      <p class="k6-legend-title">Domínios</p>
      <ul class="k6-legend-list" id="k6-legend-list"></ul>
      <p class="k6-caption">Ninguém disse ao modelo qual palavra é de qual assunto. Elas terminam perto porque aparecem perto, no mesmo tipo de conteúdo, durante o treinamento, não porque alguém rotulou o assunto.</p>
    </aside>
  </div>

  <div class="k6-button-bar">
    <span data-lab-info-ctl></span>
    <span class="k6-fs-slot" data-lab-fs-ctl></span>
    <button class="k6-btn k6-btn-action" id="k6-next">Próxima palavra</button>
    <button class="k6-btn k6-btn-action" id="k6-all">Executar tudo</button>
    <button class="k6-btn" id="k6-reset">Reiniciar</button>
  </div>

  <template data-lab-info data-lab-info-title="O que é um embedding?">
    <p>Um embedding é a posição de uma palavra (ou frase) num espaço onde a <strong>distância vem de como as palavras aparecem juntas no material de treinamento</strong>, não de o modelo "entender" que elas significam a mesma coisa. Palavras que aparecem nos mesmos tipos de texto ficam perto; palavras de assuntos que raramente aparecem juntos ficam longe.</p>
    <p>Essa demo usa posições escolhidas à mão, não um cálculo real, pra ficar previsível e clara no palco. Mas o fenômeno é real: é assim que um modelo treinado organiza o vocabulário, sem que ninguém tenha etiquetado "isto é direito, isto é culinária". O agrupamento emerge do uso, não de uma lista de categorias.</p>
    <p>É a mesma geometria que faz a busca semântica funcionar: procurar "carro quebrado" pode encontrar um documento que fala em "veículo com defeito", porque os dois ficam perto no espaço, mesmo sem nenhuma palavra em comum.</p>
  </template>

  <script>
    (function () {
      var DOMAINS = [
        { key: 'direito', label: 'Direito', color: 'var(--k6-blue)', cx: 18, cy: 25,
          words: ['processo', 'sentença', 'réu', 'autor', 'prazo', 'recurso'] },
        { key: 'medicina', label: 'Medicina', color: 'var(--k6-red)', cx: 50, cy: 20,
          words: ['paciente', 'diagnóstico', 'cirurgia', 'remédio', 'sintoma', 'exame'] },
        { key: 'musica', label: 'Música', color: 'var(--k6-purple)', cx: 82, cy: 25,
          words: ['melodia', 'violão', 'acorde', 'refrão', 'ritmo', 'cantor'] },
        { key: 'esporte', label: 'Esporte', color: 'var(--k6-green)', cx: 18, cy: 75,
          words: ['gol', 'árbitro', 'técnico', 'jogador', 'campeonato', 'torcida'] },
        { key: 'culinaria', label: 'Culinária', color: 'var(--k6-amber)', cx: 50, cy: 80,
          words: ['receita', 'tempero', 'panela', 'forno', 'sabor', 'ingrediente'] },
        { key: 'tecnologia', label: 'Tecnologia', color: 'var(--k6-cyan)', cx: 82, cy: 75,
          words: ['código', 'servidor', 'aplicativo', 'internet', 'dados', 'algoritmo'] }
      ];
      // Fixed per-word offsets from the domain centroid (percent), hand-picked
      // so 6 members never overlap. Same offsets reused per domain on purpose:
      // it is the CENTROIDS that differ, not a need for per-word randomness.
      var OFFSETS = [[-9, -8], [9, -8], [-11, 4], [11, 4], [-4, 11], [5, -12]];

      // Reveal order: round-robin across domains, so the audience sees one
      // dot land in each of the 6 areas per lap, not one whole domain at a
      // time (which would make the clustering look scripted, not emergent).
      var QUEUE = [];
      for (var i = 0; i < 6; i++) {
        DOMAINS.forEach(function (d) {
          QUEUE.push({
            word: d.words[i],
            color: d.color,
            x: d.cx + OFFSETS[i][0],
            y: d.cy + OFFSETS[i][1]
          });
        });
      }

      var stageEl = document.getElementById('k6-stage');
      var countEl = document.getElementById('k6-count');
      var totalEl = document.getElementById('k6-total');
      var legendListEl = document.getElementById('k6-legend-list');
      var nextBtn = document.getElementById('k6-next');
      var allBtn = document.getElementById('k6-all');
      var resetBtn = document.getElementById('k6-reset');

      totalEl.textContent = String(QUEUE.length);
      DOMAINS.forEach(function (d) {
        var li = document.createElement('li');
        li.innerHTML = '<span class="k6-dot" style="--dom-color:' + d.color + '"></span><span>' + d.label + '</span>';
        legendListEl.appendChild(li);
      });

      var revealed = 0;
      var autoTimer = null;

      function revealNext() {
        if (revealed >= QUEUE.length) return;
        var item = QUEUE[revealed];
        var el = document.createElement('div');
        el.className = 'k6-word';
        el.style.setProperty('--dom-color', item.color);
        el.style.left = item.x + '%';
        el.style.top = item.y + '%';
        el.textContent = item.word;
        stageEl.appendChild(el);
        // Force layout before adding --in, so the entry transition plays
        // instead of the word appearing already at full opacity/scale.
        void el.offsetWidth;
        el.classList.add('k6-word--in');
        revealed++;
        countEl.textContent = String(revealed);
        nextBtn.disabled = revealed >= QUEUE.length;
        allBtn.disabled = revealed >= QUEUE.length;
      }

      function stopAuto() {
        if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
        allBtn.textContent = 'Executar tudo';
      }

      nextBtn.addEventListener('click', function () { stopAuto(); revealNext(); });

      allBtn.addEventListener('click', function () {
        if (autoTimer) { stopAuto(); return; }
        allBtn.textContent = 'Pausar';
        autoTimer = setInterval(function () {
          revealNext();
          if (revealed >= QUEUE.length) stopAuto();
        }, 550);
      });

      resetBtn.addEventListener('click', function () {
        stopAuto();
        stageEl.innerHTML = '';
        revealed = 0;
        countEl.textContent = '0';
        nextBtn.disabled = false;
        allBtn.disabled = false;
      });

      window.addEventListener('storage', function (e) {
        if (e.key !== 'bs_theme') return;
        var t = e.newValue;
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        }
      });
    })();
  </script>
</section>
</body>
</html>
