<!DOCTYPE html>
<html lang="pt-BR" data-theme="light" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>PensoIA — Pulso (demo)</title>

<!-- The REAL Codex student CSS. Linking it (not copying) is what keeps this demo
     pixel-identical to the live app with zero drift: a change to questions.css /
     nexo.css shows up here automatically. -->
<link rel="stylesheet" href="/codex/css/theme.css?v=1.0">
<link rel="stylesheet" href="/codex/questions/questions.css?v=1.0">
<link rel="stylesheet" href="/codex/trilha/css/nexo.css?v=1.0">

<script>
  // Install the canned Worker transport BEFORE any Codex module loads, so the real
  // student stack (nexo-answer -> question-element -> codex-api.call) runs UNMODIFIED
  // on demo data. This is the exact seam the question tests use (_question-harness
  // workerFrom): codex-api.call(action, p) sets p.action and calls window.callWorker.
  window.WORKER_URL = '';
  window.__demo = {
    qid: 'demo-q-0',
    qtext: 'O resultado da IA precisa de revisão humana?',
    opts: ['Sempre', 'Só às vezes', 'Nunca', 'Depende do uso'],
    answered: false, qSent: false, qAnswered: false, closed: false
  };
  window.callWorker = function (params) {
    var d = window.__demo, action = params && params.action;
    if (action === 'get_session_state') {
      return Promise.resolve({
        session: { code: 'DEMO', status: 'open' },
        qa_enabled: true,
        active_question: d.closed ? null : {
          id: d.qid, text: d.qtext, type: 'mc', status: 'active',
          options: d.opts, max_select: 1,
          answer_counts: [0, 0, 0, 0], show_results: false, reveal_answer: false,
          correct_answers: [], voter_count: 0
        },
        history: []
      });
    }
    if (action === 'submit_answer') { d.answered = true; return Promise.resolve({ ok: true }); }
    if (action === 'submit_student_question') {
      d.qSent = true;
      setTimeout(function () { d.qAnswered = true; }, 2200); // instructor replies shortly after
      return Promise.resolve({ ok: true });
    }
    if (action === 'cp_student_inbox') {
      return Promise.resolve({
        ok: true,
        questions: d.qAnswered
          ? [{ id: 'sq1', text: 'pergunta do aluno', answer: 'resposta do instrutor' }]
          : []
      });
    }
    return Promise.resolve({ ok: true });
  };
</script>

<style>
  /* Demo chrome ONLY — scoped to this page, never touches the real app. Frames the
     live-question experience at phone width and applies the agreed hybrid look:
     real labels/letters/state-strings stay; long internal prose becomes content
     boxes (so nothing unreadable, no per-language upkeep). */
  html, body { margin: 0; height: 100%; background: var(--background); overflow: hidden; }
  body { font-family: 'Inter', 'Segoe UI', sans-serif; }
  #demo-host, .nx-answer-screen { min-height: 100%; }
  .nx-answer-screen { padding: 16px 14px; box-sizing: border-box; }

  /* Box the A/B/C/D option label (keep the real letter chip). */
  .cdx-qr-option-btn > span:last-child { color: transparent !important; position: relative; }
  .cdx-qr-option-btn > span:last-child::after {
    content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    height: 10px; border-radius: 3px; background: var(--text-secondary); opacity: .22; width: 74%;
  }
  .cdx-qr-option-btn:nth-of-type(1) > span:last-child::after { width: 60%; }
  .cdx-qr-option-btn:nth-of-type(2) > span:last-child::after { width: 82%; }
  .cdx-qr-option-btn:nth-of-type(3) > span:last-child::after { width: 50%; }
  .cdx-qr-option-btn:nth-of-type(4) > span:last-child::after { width: 70%; }

  /* Box the student-Q / instructor-answer prose (keep the "Sua pergunta" /
     "Resposta do instrutor" labels real). */
  .cp-sqa-text, .cp-sqa-answer-text { color: transparent !important; position: relative; min-height: 11px; }
  .cp-sqa-text::after, .cp-sqa-answer-text::after {
    content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    height: 10px; border-radius: 3px; background: var(--text-secondary); opacity: .22; width: 86%;
  }
  .cp-sqa-answer-text::after { width: 64%; }
</style>
</head>
<body>
<div id="demo-host"></div>
<script type="module" src="/codex/demo/pulso.js?v=1"></script>
</body>
</html>
