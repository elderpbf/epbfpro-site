<!DOCTYPE html>
<html lang="pt-BR" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Codex - PensoIA</title>

<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">

<!-- Shell chrome reused from Backstage (same origin, so the login carries over). -->
<link rel="stylesheet" href="css/theme.css?v=1.4">
<!-- Admin shell chrome (bs-app/bs-main/bs-topbar, theme-transition) + the inline
     login card (bs-auth-*). Codex copy, verbatim, so the backstage backstage.css
     link is dropped. bs-auth-* rides along unchanged (auth.js stays backstage and
     emits it); the cdx- rename of the Codex-emitted shell classes is a later pass. -->
<link rel="stylesheet" href="css/backstage.css?v=1.3">
<!-- Settings drawer chrome (Codex copy, pairs with js/settings-drawer.js). -->
<link rel="stylesheet" href="css/settings-drawer.css?v=1.2">
<!-- Notification bell (.cdx-bell-*, pairs with js/notif-bell.js). Shared by the
     topbar (teacher) and the Trilha header (student). -->
<link rel="stylesheet" href="css/notif-bell.css?v=1.1">
<!-- .ctr- item-render styles (Codex copy, pairs with js/item-render.js). Prefix-
     scoped, so they do not collide with Codex's cdx- styles. -->
<link rel="stylesheet" href="css/item-render.css?v=1.0">
<!-- ClassTrail styles the admin still uses (type-filter chips, tarefa view) plus
     the deferred shared editor/renderer (ct-/ctr-, window-global JS). Codex copy,
     verbatim, so the backstage classtrail.css link is dropped. The cdx- rename of
     the Codex-owned widgets is a later pass (their names are shared with the Trail). -->
<link rel="stylesheet" href="css/classtrail.css?v=1.2">
<!-- Drive file-preview styles (Codex copy, pairs with js/drive-viewer.js). The
     native Drive panel is cdx- styled in content.css; the legacy cv-drive.css is
     no longer loaded. -->
<link rel="stylesheet" href="css/drive-viewer.css?v=1.1">
<!-- cv-presets.css is no longer loaded: Content's Presets is a native cdx- port
     (content/presets.js) and the sidebar preset loader (js/preset-loader.js) is
     styled by lessons.css (.cdx-lessons-sidebar-head .cv-preset-loader-*). -->
<!-- ClassVault styles Codex still uses (the cv-sm sub-module list + a few cv-*
     leaves; cv-renderer/cv-slides are also covered by drive-viewer.css, but cv-sm
     is classvault-only). Codex copy, verbatim, dropping the LAST backstage CSS
     link. A dead-rule trim + cdx- rename is a later pass. -->
<link rel="stylesheet" href="css/classvault.css?v=1.2">
<link rel="stylesheet" href="css/tokens.css?v=1.8">
<link rel="stylesheet" href="css/components.css?v=1">
<link rel="stylesheet" href="css/codex.css?v=3.0">
<link rel="stylesheet" href="cohorts/cohorts.css?v=4.1">
<link rel="stylesheet" href="content/content.css?v=3.9">
<link rel="stylesheet" href="content/slides.css?v=2.0">
<!-- Deck editor styles, scoped under .cdx-deck-editor (no global leak). -->
<link rel="stylesheet" href="content/slides/css/tokens.css?v=1.2">
<link rel="stylesheet" href="content/slides/css/slide.css?v=2.5">
<link rel="stylesheet" href="content/slides/css/ui.css?v=3.11">
<link rel="stylesheet" href="lessons/lessons.css?v=2.5">
<!-- QR share modal styles (Codex copy, pairs with js/qr-share-modal.js). -->
<link rel="stylesheet" href="css/qr-share-modal.css?v=1.1">
<link rel="stylesheet" href="questions/questions.css?v=4.9">
<link rel="stylesheet" href="certificates/certificates.css?v=2.7">
<link rel="stylesheet" href="certificates/cert-render.css?v=1.8">
<script src="js/debug.js?v=2.5"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div class="theme-transition" id="themeTransition" aria-hidden="true"></div>

<!-- =====================================================
     SCREEN: LOGIN (Codex own-login, item 11.2)
     E-mail + OTP via codex-api (admin_otp_request / admin_otp_verify). Replaces the
     legacy redirect to /backstage/. Google sign-in is intentionally absent for now;
     the reserved slot below stays hidden until it is wired (no handler yet).
     ===================================================== -->
<div id="screen-login" class="bs-auth-bg" hidden>
  <div class="bs-auth-card">
    <div class="bs-auth-logo">
      <img src="../images/logo.png" alt="PensoIA">
      <span class="bs-product">Codex</span>
    </div>

    <!-- Step 1: e-mail -->
    <div id="cdx-login-email-step">
      <h2>Bem-vindo de volta</h2>
      <p class="bs-auth-hint">Entre com seu e-mail para receber um código de acesso.</p>
      <div class="bs-field">
        <input id="cdx-login-email" type="email" autocomplete="email" autofocus placeholder="E-mail">
      </div>
      <button class="bs-auth-btn" id="cdx-login-email-btn">Enviar código</button>

      <!-- Reserved (hidden) Google slot: o login com Google entra aqui depois. -->
      <div class="bs-auth-divider" id="cdx-login-google-slot" hidden><span class="bs-auth-divider-text">ou</span></div>
      <button class="bs-auth-btn bs-auth-btn--google" id="cdx-login-google-btn" hidden>
        <svg width="18" height="18" viewBox="0 0 48 48" style="vertical-align:middle;margin-right:8px"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
        Entrar com Google
      </button>
    </div>

    <!-- Step 2: código -->
    <div id="cdx-login-code-step" hidden>
      <h2>Confira seu e-mail</h2>
      <p class="bs-auth-hint">Enviamos um código de 4 letras para <strong id="cdx-login-email-echo"></strong>.</p>
      <div class="bs-field">
        <input id="cdx-login-code" type="text" inputmode="text" autocomplete="one-time-code" maxlength="4" placeholder="Código" style="text-transform:uppercase;letter-spacing:.25em">
      </div>
      <button class="bs-auth-btn" id="cdx-login-code-btn">Entrar</button>
      <div class="cdx-login-actions">
        <button type="button" class="cdx-auth-link" id="cdx-login-resend-btn">Reenviar código</button>
        <span aria-hidden="true">·</span>
        <button type="button" class="cdx-auth-link" id="cdx-login-back-btn">Usar outro e-mail</button>
      </div>
    </div>

    <p class="bs-form-error" id="cdx-login-error"></p>
  </div>
</div>

<!-- =====================================================
     CODEX SHELL
     CodexTopbar mounts the four-tab strip into .bs-app; the active tab renders
     into #codex-view. Strangler migration: un-migrated tabs link to the old
     pages (see codex-topbar.js TABS).
     ===================================================== -->
<div id="screen-app" class="bs-app" hidden>
  <main class="bs-main">
    <div id="codex-view" class="cdx-view"></div>
  </main>
</div>

<!-- Shared Backstage services as regular scripts (window globals), loaded
     BEFORE the module boot so Codex modules can read them. -->
<!-- utils.js is no longer loaded: Codex vendors hashPw (js/settings-auth.js),
     owns the Enter-to-submit handler (js/form-enter.js, imported in the boot),
     uses its own toast (js/toast.js), and the pure helpers (escHtml/parseCSV/
     LETTERS) were unused (each module vendors its own). -->
<!-- api-client.js is no longer loaded: the Worker transport is now the Codex ES
     module js/worker-call.js (the boot's first import below), which sets
     window.callWorker and defaults to codex-api. This also completes the admin's
     Stage 2 backend cutover: api-client.js hardcoded backstage-api and ignored
     window.WORKER_URL, so the admin had still been on backstage-api. -->

<!-- Codex-owned theme manager (classic script: the Trail pre-paints the theme
     synchronously, so it stays a non-deferred global, window.ThemeManager). -->
<script src="js/theme-manager.js?v=1.0"></script>
<script src="js/bs-google.js?v=1.4"></script>
<script src="js/auth.js?v=1.4"></script>
<!-- The Settings drawer is now Codex ES modules: the shell js/settings-drawer.js
     (app-owned) + the injected auth sections js/settings-auth.js, imported by
     js/codex-topbar.js. The backstage settings-drawer.js global is no longer loaded. -->
<!-- Brand logo/glyph helpers are now the Codex ES module js/brand-logos.js,
     imported by certificates/cert-render.js (logo + watermark) and js/codex-topbar.js
     (the topbar wordmark). The backstage global is no longer loaded; the canonical
     artwork is mirrored verbatim and the backstage copy stays for the legacy family. -->
<!-- The toast, item renderer / type-filter / tarefa-fields, and the AI item-spec
     are now Codex ES modules (js/toast.js, js/item-render.js, js/type-filter.js,
     js/tarefa-fields.js, js/ai-spec.js). -->
<!-- ct-renderer / ct-type-filter / ct-tarefa-fields are now Codex ES modules
     (js/item-render.js, js/type-filter.js, js/tarefa-fields.js), imported by the
     Content + Lessons tab modules. The backstage globals are no longer loaded. -->
<!-- Labs sub-tab (native cdx- module, content/labs.js). The lab registry and
     the fullscreen preview modal are now Codex ES modules (js/labs-registry.js,
     js/lab-viewer.js), imported by content/labs.js, content/presets.js and
     lessons.js; the backstage globals are no longer loaded. -->
<!-- Drive sub-tab (native cdx- module, content/drive.js). Folder CRUD + the
     synced-item index go through the codex-api facade; the client-side Google
     Drive read uses BS_GOOGLE (already loaded above). The file-preview modal is
     now the Codex ES module js/drive-viewer.js (imported by content/drive.js and
     lessons.js); the legacy folders-api / cache / folders-ui / sync-ui globals
     are no longer loaded. -->
<!-- The preset loader is now the Codex ES module js/preset-loader.js (imported by
     lessons.js); Content's Presets sub-tab is a native port (content/presets.js).
     The legacy cv-presets-ui.js global (and the Stage 0 dead globals: ai-client,
     ct-item-form, ct-item-creator, cv-type-registry, cv-focus-mode, cv-presets-api,
     cv-item-picker) are no longer loaded. -->
<!-- The QR share modal is now the Codex ES module js/qr-share-modal.js, imported
     by the live host (questions/live-host.js). The backstage global is no longer
     loaded. -->

<!-- Codex is ES modules. One boot imports, routes by ?tab=, and mounts the
     active tab; no logic inline beyond the wiring. -->
<script type="module">
  import './js/worker-call.js'; // Codex Worker transport FIRST -> sets window.callWorker (codex-api default); replaces backstage/js/api-client.js
  import { install as installReconnect } from './js/reconnect.js'; // connection watchdog: raises a reload banner when the network drops, clears it when calls succeed
  import { isAuthed, mountLogin } from './js/codex-login.js'; // Codex own-login gate (item 11.2): e-mail+OTP, replaces the /backstage/ redirect
  import { init as topbar } from './js/codex-topbar.js';
  import { apply as applyI18n } from './js/i18n.js';
  import * as glyphs from './js/glyphs.js';
  import './js/form-enter.js'; // Codex-owned Enter-to-submit (replaces backstage/js/utils.js)
  import * as cohorts from './cohorts/cohorts.js';
  import * as content from './content/content.js';
  import * as lessons from './lessons/lessons.js';
  import * as questions from './questions/questions.js';
  import * as certificates from './certificates/certificates.js';

  // Stage 2 cutover: Codex's backend is the codex-api Worker. worker-call.js (the
  // boot's first import) already defaults here; this is the explicit page-level
  // override that callWorker AND the facade's assetUrl() read. Trail and the rest
  // of Backstage are unaffected. Reversible: delete this line to fall back to
  // worker-call.js's codex-api default (both Workers share classpulse-db + R2).
  window.WORKER_URL = 'https://codex-api.pensoia.workers.dev';

  // The Codex glyph library is owned here. Shared window-global consumers
  // (the ct-type-filter chip strip) reach it through this global.
  window.CdxGlyphs = glyphs;

  // Connection watchdog: from here on, a dropped network surfaces a reload
  // banner instead of silent failures. Install before any tab mounts so the
  // very first call is covered.
  installReconnect();

  const params = new URLSearchParams(location.search);

  // Presenter window: the Slides editor's ▶ Apresentar opens this same page with
  // ?presenter=1. Mount ONLY the slides editor in presenter mode; the deck is pushed
  // over the BroadcastChannel from the opener, so no auth, tab routing or store is
  // needed here. Handled before the auth gate so it works from any session state.
  if (params.get('presenter') === '1') {
    applyI18n();
    const host = document.createElement('div');
    host.className = 'cdx-deck-editor';
    document.body.appendChild(host);
    const [slides, toast] = await Promise.all([
      import('./content/slides/js/app.js'),
      import('./js/toast.js'),
    ]);
    slides.mount(host, { notify: (msg) => toast.ok(msg) });
  }
  // Codex own-login gate (item 11.2): if not authed, show the e-mail+OTP login and STOP.
  // No tabs mount until an admin session is in place. This replaces the legacy
  // BS_AUTH.guard() redirect to /backstage/; on successful login the page reloads and
  // this branch is skipped.
  else if (!isAuthed()) {
    applyI18n();
    mountLogin();
  } else {
    document.getElementById('screen-app').hidden = false;
    BS_AUTH.clearPasswordInputs();
    applyI18n();

    const TABS = { cohorts, content, lessons, questions, certificates };
    const tab = TABS[params.get('tab')] ? params.get('tab') : 'cohorts';
    const sub = params.get('sub') || undefined;

    // Each tab may own a sub-tab registry. Build the FULL map so the topbar's pill
    // mode can reveal ANY tab's sub-tabs on hover (jump straight to a sub-tab, one
    // less click). The active tab also drives the persistent-bar mode. Only the
    // active tab passes the current `sub`, so only its current sub-tab highlights.
    const subTabsByTab = {};
    for (const key of Object.keys(TABS)) {
      if (TABS[key].subtabs) subTabsByTab[key] = TABS[key].subtabs(key === tab ? sub : undefined);
    }
    const subTabs = subTabsByTab[tab] || [];
    topbar({ active: tab, subTabs, subTabsByTab });

    const ctx = {};
    if (tab === 'cohorts' || tab === 'content' || tab === 'questions' || tab === 'certificates') ctx.sub = sub;
    // Fórum deep-link from the notification bell: open this turma's dossiê on the Fórum tab.
    if (tab === 'cohorts') { ctx.fclient = params.get('fclient') || undefined; ctx.fturma = params.get('fturma') || undefined; ctx.fdtab = params.get('fclient') ? 'forum' : undefined; }
    // Questions deep-link: ?session=<code> opens that session's live host directly
    // (the Lessons live card links here). The Sessions sub-tab reads ctx.session.
    if (tab === 'questions') ctx.session = params.get('session') || undefined;
    TABS[tab].mount(document.getElementById('codex-view'), ctx);
  }
</script>
</body>
</html>
