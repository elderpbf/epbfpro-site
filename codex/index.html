<!DOCTYPE html>
<html lang="pt-BR" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Codex - PensoIA</title>

<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">

<!-- Shell chrome reused from Backstage (same origin, so the login carries over). -->
<link rel="stylesheet" href="../backstage/css/theme.css?v=1.3">
<link rel="stylesheet" href="../backstage/css/backstage.css?v=2.8">
<link rel="stylesheet" href="../backstage/css/settings-drawer.css?v=1.0">
<link rel="stylesheet" href="../backstage/css/shared-components.css?v=1.6">
<!-- ct-/ctr- scoped styles for the shared item editor (CTItemForm/Creator),
     which Content → Items mounts as a window global until it is migrated.
     Prefix-scoped, so they do not collide with Codex's cdx- styles. -->
<link rel="stylesheet" href="../backstage/css/ct-renderer.css?v=1.0">
<link rel="stylesheet" href="../backstage/classtrail/css/classtrail.css?v=4.0">
<!-- Drive sub-tab: the native panel is cdx- styled in content.css; cv-drive.css
     remains only for the shared CVDriveViewer file-preview modal. -->
<link rel="stylesheet" href="../backstage/css/cv-drive.css?v=1.3">
<link rel="stylesheet" href="../backstage/css/cv-presets.css?v=1.4">
<link rel="stylesheet" href="../backstage/classvault/css/classvault.css?v=1.50">
<link rel="stylesheet" href="css/tokens.css?v=1.0">
<link rel="stylesheet" href="css/codex.css?v=2.0">
<link rel="stylesheet" href="cohorts/cohorts.css?v=1.2">
<link rel="stylesheet" href="content/content.css?v=2.6">
<link rel="stylesheet" href="content/slides.css?v=1.8">
<!-- Deck editor styles, scoped under .cdx-deck-editor (no global leak). -->
<link rel="stylesheet" href="content/slides/css/tokens.css?v=1.1">
<link rel="stylesheet" href="content/slides/css/slide.css?v=1.7">
<link rel="stylesheet" href="content/slides/css/ui.css?v=2.0">
<link rel="stylesheet" href="lessons/lessons.css?v=2.1">
<link rel="stylesheet" href="../backstage/css/qr-share-modal.css?v=1.3">
<link rel="stylesheet" href="questions/questions.css?v=2.9">
<script src="../backstage/js/debug.js?v=2.5"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div class="theme-transition" id="themeTransition" aria-hidden="true"></div>

<!-- =====================================================
     CODEX SHELL
     CodexTopbar mounts the four-tab strip into .bs-app; the active tab renders
     into #codex-view. Strangler migration: un-migrated tabs link to the old
     pages (see codex-topbar.js TABS).
     ===================================================== -->
<div id="screen-app" class="bs-app">
  <main class="bs-main">
    <div id="codex-view" class="cdx-view"></div>
  </main>
</div>

<!-- Shared Backstage services as regular scripts (window globals), loaded
     BEFORE the module boot so Codex modules can read them. -->
<script src="../backstage/js/utils.js?v=1.5"></script>
<script src="../backstage/js/api-client.js?v=1.2"></script>
<script src="../backstage/js/theme-manager.js?v=1.2"></script>
<script src="../backstage/js/bs-google.js?v=1.4"></script>
<script src="../backstage/js/auth.js?v=1.4"></script>
<script src="../backstage/js/settings-drawer.js?v=1.2"></script>
<script src="../backstage/js/brand-logos.js?v=1.0"></script>
<!-- Shared helpers (window globals) still used by Content → Items: the type
     filter chips, the preview renderer, and the prompt-building AI spec. The
     item editor + creator are now Codex-native ES modules (content/item-form.js,
     content/item-creator.js); the legacy CTItemForm/CTItemCreator globals are no
     longer loaded here. -->
<script src="../backstage/js/bs-toast.js?v=1.0"></script>
<script src="../backstage/js/ct-ai-spec.js?v=1.3"></script>
<script src="../backstage/js/ct-type-filter.js?v=1.1"></script>
<script src="../backstage/js/ct-renderer.js?v=1.0"></script>
<!-- Tarefas answer-field registry (list of field types + stored-value rendering
     and CSV serialization). Shared leaf helper, used as a global by the native
     Tarefas sub-tab, same pattern as ct-renderer above. -->
<script src="../backstage/js/ct-tarefa-fields.js?v=1.0"></script>
<!-- Labs sub-tab (native cdx- module, content/labs.js). The lab registry
     (CVLabs, also feeds the Presets picker's Labs group + Lessons) and the
     fullscreen preview modal (CVLabViewer) stay shared globals; the panel grid
     is now native, so the legacy ct-labs-panel.js global is no longer loaded. -->
<script src="../backstage/classvault/js/cv-labs.js?v=1.4"></script>
<script src="../backstage/js/cv-lab-viewer.js?v=1.0"></script>
<!-- Drive sub-tab (native cdx- module, content/drive.js). Folder CRUD + the
     synced-item index go through the codex-api facade; the client-side Google
     Drive read uses BS_GOOGLE (already loaded above). Only the file-preview modal
     (CVDriveViewer, also used by Lessons) stays a shared global; the legacy
     folders-api / cache / folders-ui / sync-ui globals are no longer loaded. -->
<script src="../backstage/js/cv-drive-viewer.js?v=1.0"></script>
<!-- Shared Backstage globals still used by Content sub-tabs (Presets item picker,
     the shared editor, AI generation). Lessons is now a NATIVE ES module
     (lessons/lessons.js + lesson-model.js) and no longer loads the aula-engine
     copy. Pruning the globals that became dead at this cutover (cv-type-registry,
     cv-focus-mode) is the Phase-4 cleanup, after their non-Lessons users are
     audited. -->
<script src="../backstage/js/ai-client.js?v=1.0"></script>
<script src="../backstage/js/ct-item-form.js?v=1.4"></script>
<script src="../backstage/js/ct-item-creator.js?v=1.0"></script>
<script src="../backstage/classvault/js/cv-type-registry.js?v=1.4"></script>
<script src="../backstage/classvault/js/cv-focus-mode.js?v=1.6"></script>
<script src="../backstage/js/cv-presets-api.js?v=1.0"></script>
<script src="../backstage/js/cv-item-picker.js?v=1.3"></script>
<script src="../backstage/js/cv-presets-ui.js?v=1.2"></script>
<!-- Shared QR share modal (the live host's QR button reuses this global). -->
<script src="../backstage/js/qr-share-modal.js?v=1.3"></script>

<!-- Codex is ES modules. One boot imports, routes by ?tab=, and mounts the
     active tab; no logic inline beyond the wiring. -->
<script type="module">
  import { init as topbar } from './js/codex-topbar.js';
  import { apply as applyI18n } from './js/i18n.js';
  import * as glyphs from './js/glyphs.js';
  import * as cohorts from './cohorts/cohorts.js';
  import * as content from './content/content.js';
  import * as lessons from './lessons/lessons.js';
  import * as questions from './questions/questions.js';

  // The Codex glyph library is owned here. Shared window-global consumers
  // (the ct-type-filter chip strip) reach it through this global.
  window.CdxGlyphs = glyphs;

  const TABS = { cohorts, content, lessons, questions };
  const params = new URLSearchParams(location.search);
  const tab = TABS[params.get('tab')] ? params.get('tab') : 'cohorts';
  const sub = params.get('sub') || undefined;

  BS_AUTH.guard();
  BS_AUTH.clearPasswordInputs();
  applyI18n();

  // Each tab may own a sub-tab registry. Build the FULL map so the topbar's pill
  // mode can reveal ANY tab's sub-tabs on hover (jump straight to a sub-tab, one
  // less click). The active tab also drives the persistent-bar mode. Only the
  // active tab passes the current `sub`, so only its current sub-tab highlights.
  const subTabsByTab = {};
  for (const key of Object.keys(TABS)) {
    if (TABS[key].subtabs) subTabsByTab[key] = TABS[key].subtabs(key === tab ? sub : undefined);
  }
  const subTabs = subTabsByTab[tab] || [];
  topbar({ active: tab, subTabs, subTabsByTab });

  const ctx = {};
  if (tab === 'content' || tab === 'questions') ctx.sub = sub;
  TABS[tab].mount(document.getElementById('codex-view'), ctx);
</script>
</body>
</html>
