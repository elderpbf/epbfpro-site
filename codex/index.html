<!DOCTYPE html>
<html lang="pt-BR" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Codex - PensoIA</title>

<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">

<!-- Shell chrome reused from Backstage (same origin, so the login carries over). -->
<link rel="stylesheet" href="../backstage/css/theme.css?v=1.3">
<link rel="stylesheet" href="../backstage/css/backstage.css?v=2.8">
<link rel="stylesheet" href="../backstage/css/settings-drawer.css?v=1.0">
<link rel="stylesheet" href="../backstage/css/shared-components.css?v=1.6">
<link rel="stylesheet" href="css/codex.css?v=1.0">
<script src="../backstage/js/debug.js?v=2.5"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div class="theme-transition" id="themeTransition" aria-hidden="true"></div>

<!-- =====================================================
     CODEX LAUNCHER
     The four functional surfaces. Links point at the OLD pages for now
     (strangler migration): as each tab is rebuilt under /codex/, its link
     here is repointed to the new page and the old one is deleted.
     ===================================================== -->
<div id="screen-app" class="bs-app">
  <main class="bs-main">
    <div id="view-dashboard">
      <div class="bs-tool-grid">

        <!-- Lessons (Aula) -> ClassVault for now -->
        <a class="bs-tool-card" href="/backstage/classvault/" aria-label="Aula">
          <div class="bs-tool-icon" style="background: linear-gradient(135deg, #6366f1, #4f46e5);">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
          </div>
          <div class="bs-tool-name" data-i18n="nav.lessons">Aula</div>
          <div class="bs-tool-desc" data-i18n="card.lessons.desc">Apresente conteúdo durante a aula</div>
        </a>

        <!-- Content (Conteúdo) -> ClassTrail conteudo for now -->
        <a class="bs-tool-card" href="/backstage/classtrail/?tab=conteudo" aria-label="Conteúdo">
          <div class="bs-tool-icon" style="background: linear-gradient(135deg, #14b8a6, #0d9488);">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline>
            </svg>
          </div>
          <div class="bs-tool-name" data-i18n="nav.content">Conteúdo</div>
          <div class="bs-tool-desc" data-i18n="card.content.desc">Itens, slides, apostila e tarefas</div>
        </a>

        <!-- Cohorts (Turmas) -> ClassTrail turmas for now -->
        <a class="bs-tool-card" href="/backstage/classtrail/?tab=turmas" aria-label="Turmas">
          <div class="bs-tool-icon" style="background: linear-gradient(135deg, #f59e0b, #d97706);">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
          </div>
          <div class="bs-tool-name" data-i18n="nav.cohorts">Turmas</div>
          <div class="bs-tool-desc" data-i18n="card.cohorts.desc">Alunos, turmas e liberações</div>
        </a>

        <!-- Questions (Perguntas) -> ClassPulse for now -->
        <a class="bs-tool-card" href="/backstage/classpulse/" aria-label="Perguntas">
          <div class="bs-tool-icon" style="background: linear-gradient(135deg, #ec4899, #db2777);">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
          </div>
          <div class="bs-tool-name" data-i18n="nav.questions">Perguntas</div>
          <div class="bs-tool-desc" data-i18n="card.questions.desc">Perguntas ao vivo, banco e estatísticas</div>
        </a>

      </div>
    </div>
  </main>
</div>

<!-- =====================================================
     SCRIPTS — shared Backstage modules (login carries over, same origin)
     ===================================================== -->
<script src="../backstage/js/utils.js?v=1.4"></script>
<script src="../backstage/js/api-client.js?v=1.2"></script>
<script src="../backstage/js/theme-manager.js?v=1.2"></script>
<script src="../backstage/js/bs-google.js?v=1.4"></script>
<script src="../backstage/js/auth.js?v=1.4"></script>
<script src="../backstage/js/settings-drawer.js?v=1.2"></script>
<script src="../backstage/js/brand-logos.js?v=1.0"></script>
<script src="../backstage/js/backstage-topbar.js?v=2.8"></script>

<!-- Codex modules — dictionaries first, then the i18n engine, then the API facade. -->
<script src="i18n/pt.js?v=1.0"></script>
<script src="js/i18n.js?v=1.0"></script>
<script src="js/codex-api.js?v=1.0"></script>

<script>
'use strict';
BS_AUTH.guard();              // shared Backstage login; bounces to /backstage/ if not signed in
BS_AUTH.clearPasswordInputs();
I18N.apply();                 // fill PT-BR strings into [data-i18n] elements
Topbar.init({ title: 'Codex', backLink: '/backstage/' });
</script>
</body>
</html>
